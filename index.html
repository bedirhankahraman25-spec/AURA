<!DOCTYPE html>
<html lang="tr">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<meta name="theme-color"
content="#02060a">

<title>AURA AI</title>

<style>

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
}

body {
    overflow: hidden;
    font-family: Arial, sans-serif;
    color: #00eaff;

    background:
        radial-gradient(
            circle at center,
            #06303d 0%,
            #02080c 50%,
            #000000 100%
        );
}

.top-bar {
    height: 60px;

    display: flex;
    align-items: center;
    justify-content: space-between;

    padding: 0 18px;

    background:
        rgba(0,10,15,0.9);

    border-bottom:
        1px solid
        rgba(0,234,255,0.4);
}

.logo {
    font-size: 21px;
    font-weight: bold;
    letter-spacing: 4px;

    text-shadow:
        0 0 10px #00eaff,
        0 0 25px #00eaff;
}

.status {
    font-size: 11px;
    letter-spacing: 2px;
    color: #55ffcc;
}

.status::before {
    content: "";

    display: inline-block;

    width: 7px;
    height: 7px;

    margin-right: 7px;

    border-radius: 50%;

    background: #55ffcc;

    box-shadow:
        0 0 8px #55ffcc,
        0 0 15px #55ffcc;
}

.main {
    height: calc(100vh - 60px);
    height: calc(100dvh - 60px);

    display: flex;
    flex-direction: column;
    align-items: center;

    min-height: 0;
}

.aura-core {
    width: 210px;
    height: 210px;

    margin-top: 10px;

    position: relative;

    display: flex;
    align-items: center;
    justify-content: center;

    flex-shrink: 0;
}

.aura-ring {
    position: absolute;

    border-radius: 50%;

    border:
        1px solid
        #00eaff;

    opacity: 0.7;
}

.ring1 {
    width: 135px;
    height: 135px;

    border-left-color: transparent;
    border-right-color: transparent;

    animation:
        rotate1 7s linear infinite;
}

.ring2 {
    width: 175px;
    height: 175px;

    border-top-color: transparent;
    border-bottom-color: transparent;

    animation:
        rotate2 10s linear infinite;
}

.ring3 {
    width: 210px;
    height: 210px;

    border-left-color: transparent;
    border-bottom-color: transparent;

    animation:
        rotate1 14s linear infinite;
}

.aura-center {
    width: 100px;
    height: 100px;

    border-radius: 50%;

    border:
        2px solid
        #00eaff;

    display: flex;
    align-items: center;
    justify-content: center;

    color: #00eaff;

    font-size: 21px;
    font-weight: bold;

    letter-spacing: 3px;

    background:
        radial-gradient(
            circle,
            #064454,
            #02090d
        );

    box-shadow:
        0 0 15px #00eaff,
        0 0 45px rgba(0,234,255,0.7),
        inset 0 0 25px rgba(0,234,255,0.5);

    animation:
        pulse 2.2s infinite ease-in-out;

    z-index: 5;
}

@keyframes rotate1 {

    from {
        transform: rotate(0deg);
    }

    to {
        transform: rotate(360deg);
    }
}

@keyframes rotate2 {

    from {
        transform: rotate(360deg);
    }

    to {
        transform: rotate(0deg);
    }
}

@keyframes pulse {

    0%,
    100% {
        transform: scale(1);
    }

    50% {
        transform: scale(1.06);
    }
}

.aura-status {
    margin-top: -8px;
    margin-bottom: 5px;

    font-size: 10px;
    letter-spacing: 3px;

    color: #8defff;
}

#chat {
    width: min(92%, 600px);

    flex: 1;
    min-height: 0;

    overflow-y: auto;

    padding:
        5px 5px 10px;
}

.message {
    max-width: 85%;

    padding:
        10px 13px;

    margin-bottom: 10px;

    border-radius: 10px;

    line-height: 1.4;

    white-space: pre-wrap;

    font-size: 14px;
}

.aura {
    background:
        rgba(0,35,45,0.8);

    margin-right: auto;

    border:
        1px solid
        rgba(0,234,255,0.25);
}

.user {
    background:
        rgba(0,90,120,0.8);

    margin-left: auto;

    color: white;
}

#bottom {
    width: 100%;

    min-height: 65px;

    display: flex;
    align-items: center;

    gap: 8px;

    padding: 10px;

    background:
        rgba(0,10,15,0.97);

    border-top:
        1px solid
        rgba(0,234,255,0.45);

    z-index: 10;
}

#input {
    flex: 1;

    min-width: 0;

    height: 45px;

    padding: 12px;

    border-radius: 8px;

    border:
        1px solid
        rgba(0,234,255,0.5);

    outline: none;

    background:
        rgba(0,25,32,0.95);

    color: #00eaff;

    font-size: 14px;
}

#input::placeholder {
    color: #548995;
}

button {
    height: 45px;

    border:
        1px solid
        #00eaff;

    border-radius: 8px;

    padding: 0 14px;

    background:
        rgba(0,60,75,0.9);

    color: #00eaff;

    font-size: 14px;

    cursor: pointer;
}

button:active {
    transform: scale(0.94);
}

button:disabled {
    opacity: 0.5;
}

.mic-button {
    width: 45px;
    padding: 0;
    font-size: 20px;
}

@media (max-width: 500px) {

    .aura-core {

        transform: scale(0.82);

        margin-top: 0;
        margin-bottom: -15px;
    }

    .logo {
        font-size: 18px;
    }

    button {
        padding: 0 11px;
    }
}

</style>

</head>

<body>

<div class="top-bar">

    <div class="logo">
        AURA
    </div>

    <div class="status">
        ONLINE
    </div>

</div>

<div class="main">

    <div class="aura-core">

        <div class="aura-ring ring1"></div>
        <div class="aura-ring ring2"></div>
        <div class="aura-ring ring3"></div>

        <div class="aura-center">
            AURA
        </div>

    </div>

    <div class="aura-status">
        AI SYSTEM READY
    </div>

    <div id="chat"></div>

    <div id="bottom">

        <input
            id="input"
            type="text"
            placeholder="AURA'ya bir şey sor..."
            autocomplete="off"
        >

        <button
            class="mic-button"
            id="micButton"
            type="button">
            🎤
        </button>

        <button
            id="sendButton"
            type="button">
            Gönder
        </button>

    </div>

</div>

<script src="https://js.puter.com/v2/"></script>

<script>

const chat =
    document.getElementById("chat");

const input =
    document.getElementById("input");

const sendButton =
    document.getElementById("sendButton");

const micButton =
    document.getElementById("micButton");


/* =========================
   MESAJ
========================= */

function addMessage(text, type) {

    const message =
        document.createElement("div");

    message.className =
        "message " + type;

    message.textContent =
        text;

    chat.appendChild(message);

    chat.scrollTop =
        chat.scrollHeight;
}


/* =========================
   AURA KİMLİĞİ
========================= */

const systemPrompt = `

Sen AURA adında kişisel yapay zeka asistanısın.

Türkçe konuş.

Kullanıcının adı Bedirhan Kahraman.

Fakat kullanıcıya cevap verirken
asla gereksiz şekilde Bedirhan deme.

Özellikle cevapların başında
"Bedirhan",
"Bedirhan Kahraman"
veya benzeri bir hitap kullanma.

Kullanıcı adını yalnızca
kullanıcı açıkça adını sorarsa söyle.

Kullanıcı "ben kimim" derse
Bedirhan Kahraman olduğunu söyle.

Kullanıcının sevgilisinin adı
Edanur Kahraman.

Kullanıcı sevgilisinin adını sorarsa
Edanur Kahraman olduğunu söyle.

Doğal konuş.

Gereksiz tekrar yapma.

Bilmediğin bilgileri uydurma.

Sen AURA'sın.

`;


/* =========================
   KONUŞMA
========================= */

const conversation = [

    {
        role: "system",
        content: systemPrompt
    }

];


/* =========================
   UYGULAMA KOMUTLARI
========================= */

function normalizeCommand(text) {

    return text
        .toLocaleLowerCase("tr-TR")
        .replace(/[’']/g, "")
        .replace(/\s+/g, " ")
        .trim();
}


function openAndroidIntent(url) {

    try {

        const link =
            document.createElement("a");

        link.href = url;

        link.style.display = "none";

        document.body.appendChild(link);

        link.click();

        setTimeout(function() {

            link.remove();

        }, 1000);

        return true;

    }

    catch (error) {

        console.error(
            "INTENT HATASI:",
            error
        );

        return false;
    }
}


function openApplication(text) {

    const command =
        normalizeCommand(text);


    /* WHATSAPP */

    if (
        command.includes("whatsapp")
        &&
        (
            command.includes("aç") ||
            command.includes("ac") ||
            command.includes("başlat") ||
            command.includes("baslat") ||
            command.includes("çalıştır") ||
            command.includes("calistir")
        )
    ) {

        return openAndroidIntent(
            "intent://#Intent;" +
            "package=com.whatsapp;" +
            "end"
        );
    }


    /* YOUTUBE */

    if (
        (
            command.includes("youtube")
            ||
            command.includes("youtube u")
            ||
            command.includes("youtubeyi")
        )
        &&
        (
            command.includes("aç") ||
            command.includes("ac") ||
            command.includes("başlat") ||
            command.includes("baslat")
        )
    ) {

        return openAndroidIntent(
            "intent://www.youtube.com/#Intent;" +
            "scheme=https;" +
            "package=com.google.android.youtube;" +
            "end"
        );
    }


    /* INSTAGRAM */

    if (
        command.includes("instagram")
        &&
        (
            command.includes("aç") ||
            command.includes("ac") ||
            command.includes("başlat") ||
            command.includes("baslat")
        )
    ) {

        return openAndroidIntent(
            "intent://instagram.com/#Intent;" +
            "scheme=https;" +
            "package=com.instagram.android;" +
            "end"
        );
    }


    /* CHROME */

    if (
        command.includes("chrome")
        &&
        (
            command.includes("aç") ||
            command.includes("ac") ||
            command.includes("başlat") ||
            command.includes("baslat")
        )
    ) {

        return openAndroidIntent(
            "intent://#Intent;" +
            "package=com.android.chrome;" +
            "end"
        );
    }


    /* KAMERA */

    if (
        command.includes("kamera")
        &&
        (
            command.includes("aç") ||
            command.includes("ac") ||
            command.includes("başlat") ||
            command.includes("baslat")
        )
    ) {

        return openAndroidIntent(
            "intent://#Intent;" +
            "action=android.media.action.IMAGE_CAPTURE;" +
            "end"
        );
    }


    /* GALERİ */

    if (
        (
            command.includes("galeri")
            ||
            command.includes("fotoğraflar")
            ||
            command.includes("fotograflar")
            ||
            command.includes("fotoğrafları")
            ||
            command.includes("fotograflari")
        )
        &&
        (
            command.includes("aç") ||
            command.includes("ac") ||
            command.includes("başlat") ||
            command.includes("baslat")
        )
    ) {

        return openAndroidIntent(
            "intent://#Intent;" +
            "action=android.intent.action.VIEW;" +
            "type=image/*;" +
            "end"
        );
    }


    /* AYARLAR */

    if (
        (
            command.includes("ayarlar")
            ||
            command.includes("ayarları")
            ||
            command.includes("ayarlari")
        )
        &&
        (
            command.includes("aç") ||
            command.includes("ac") ||
            command.includes("başlat") ||
            command.includes("baslat")
        )
    ) {

        return openAndroidIntent(
            "intent://#Intent;" +
            "action=android.settings.SETTINGS;" +
            "end"
        );
    }


    return false;
}


/* =========================
   AI
========================= */

async function askAI(text) {

    conversation.push({

        role: "user",
        content: text

    });


    try {

        const response =
            await puter.ai.chat(
                conversation,
                {
                    model:
                        "gpt-5.4-nano"
                }
            );


        let answer = "";


        if (
            response &&
            response.message &&
            response.message.content
        ) {

            answer =
                response.message.content;

        }

        else if (
            response &&
            response.text
        ) {

            answer =
                response.text;

        }

        else if (
            typeof response === "string"
        ) {

            answer =
                response;

        }

        else {

            answer =
                "AURA cevap oluşturamadı.";
        }


        conversation.push({

            role: "assistant",
            content: answer

        });


        return answer;

    }

    catch (error) {

        console.error(
            "AI HATASI:",
            error
        );

        return "AI bağlantısında bir sorun oluştu.";
    }
}<script>

/* =========================
   TEMEL MESAJ İŞLEME
========================= */

async function processMessage(
    text,
    voiceMode
) {

    addMessage(
        text,
        "user"
    );


    /*
       ÖNCE TELEFON KOMUTU
    */

    const appOpened =
        openApplication(text);


    if (appOpened) {

        addMessage(
            "Komut alındı. Uygulama açılıyor.",
            "aura"
        );

        return;
    }


    /*
       UYGULAMA KOMUTU DEĞİLSE AI
    */

    addMessage(
        "Düşünüyorum...",
        "aura"
    );


    const loading =
        chat.lastElementChild;


    sendButton.disabled =
        true;

    micButton.disabled =
        true;


    try {

        const reply =
            await askAI(text);


        if (loading) {
            loading.remove();
        }


        addMessage(
            reply,
            "aura"
        );


        if (voiceMode) {

            speak(reply);
        }


    }

    catch (error) {

        console.error(error);


        if (loading) {
            loading.remove();
        }


        addMessage(
            "Bir hata oluştu. Tekrar deneyelim.",
            "aura"
        );
    }


    sendButton.disabled =
        false;

    micButton.disabled =
        false;

    input.focus();
}


/* =========================
   WEB ARAMA
========================= */

function needsWebSearch(text) {

    const command =
        text.toLowerCase();


    const words = [

        "internette ara",
        "internetten ara",
        "internette araştır",
        "internetten araştır",
        "webde ara",
        "web'de ara",
        "internetten bak",
        "internete bak",
        "güncel bilgi",
        "guncel bilgi",
        "hava durumu",
        "hava nasıl",
        "hava nasil",
        "son dakika",
        "haberler",
        "güncel haber",
        "guncel haber",
        "şimdi",
        "simdi",
        "şu an",
        "su an"

    ];


    return words.some(
        function(word) {

            return command.includes(word);

        }
    );
}


/* =========================
   WEB DESTEKLİ AI
========================= */

async function askAIWithWeb(text) {

    conversation.push({

        role: "user",

        content:
            text +
            "\n\n" +
            "Bu soruyu güncel internet bilgileri " +
            "gerekiyorsa web araması yaparak cevapla. " +
            "Kullanıcıya gereksiz şekilde adıyla hitap etme."

    });


    try {

        const response =
            await puter.ai.chat(
                conversation,
                {
                    model:
                        "gpt-5.4-nano",

                    tools: [
                        {
                            type: "web_search"
                        }
                    ]
                }
            );


        let answer = "";


        if (
            response &&
            response.message &&
            response.message.content
        ) {

            answer =
                response.message.content;

        }

        else if (
            response &&
            response.text
        ) {

            answer =
                response.text;

        }

        else if (
            typeof response === "string"
        ) {

            answer =
                response;

        }

        else {

            answer =
                "Web aramasından cevap alınamadı.";
        }


        conversation.push({

            role: "assistant",

            content: answer

        });


        return answer;

    }

    catch (error) {

        console.error(
            "WEB HATASI:",
            error
        );


        return await askAI(text);
    }
}


/* =========================
   ANA MESAJ SİSTEMİ
========================= */

async function sendMessage(
    voiceMode = false
) {

    const text =
        input.value.trim();


    if (!text) {
        return;
    }


    input.value = "";


    addMessage(
        text,
        "user"
    );


    /*
       UYGULAMA KOMUTU
    */

    if (
        openApplication(text)
    ) {

        addMessage(
            "Komut alındı. Uygulama açılıyor.",
            "aura"
        );

        input.focus();

        return;
    }


    /*
       NORMAL AI İŞLEMİ
    */

    addMessage(
        "Düşünüyorum...",
        "aura"
    );


    const loading =
        chat.lastElementChild;


    sendButton.disabled =
        true;

    micButton.disabled =
        true;


    try {

        let reply;


        if (
            needsWebSearch(text)
        ) {

            reply =
                await askAIWithWeb(
                    text
                );

        }

        else {

            reply =
                await askAI(text);
        }


        if (loading) {

            loading.remove();
        }


        addMessage(
            reply,
            "aura"
        );


        if (voiceMode) {

            speak(reply);
        }


    }

    catch (error) {

        console.error(error);


        if (loading) {
            loading.remove();
        }


        addMessage(
            "Bir hata oluştu. Tekrar deneyelim.",
            "aura"
        );
    }


    sendButton.disabled =
        false;

    micButton.disabled =
        false;

    input.focus();
}


/* =========================
   GÖNDER
========================= */

sendButton.onclick =
    function() {

        sendMessage(false);
    };


input.onkeydown =
    function(event) {

        if (
            event.key === "Enter"
        ) {

            event.preventDefault();

            sendMessage(false);
        }
    };


/* =========================
   SES TEMİZLEME
========================= */

function cleanTextForSpeech(text) {

    return text

        .replace(
            /[\p{Emoji_Presentation}\p{Extended_Pictographic}]/gu,
            ""
        )

        .replace(
            /https?:\/\/\S+/gi,
            ""
        )

        .replace(
            /[.,!?;:"'“”‘’()[\]{}<>…\/\\|@#$%^&*_+=~`-]/g,
            " "
        )

        .replace(
            /\s+/g,
            " "
        )

        .trim();
}


/* =========================
   SESLİ CEVAP
========================= */

function speak(text) {

    if (
        !("speechSynthesis" in window)
    ) {

        return;
    }


    const cleanText =
        cleanTextForSpeech(text);


    if (!cleanText) {
        return;
    }


    const utterance =
        new SpeechSynthesisUtterance(
            cleanText
        );


    utterance.lang =
        "tr-TR";

    utterance.rate =
        0.9;

    utterance.pitch =
        1;

    utterance.volume =
        1;


    window.speechSynthesis.cancel();

    window.speechSynthesis.speak(
        utterance
    );
}


/* =========================
   SESLİ KOMUT
========================= */

const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;


let recognition = null;

let isListening = false;


if (SpeechRecognition) {

    recognition =
        new SpeechRecognition();


    recognition.lang =
        "tr-TR";

    recognition.continuous =
        false;

    recognition.interimResults =
        false;


    recognition.onstart =
        function() {

            isListening = true;

            micButton.textContent =
                "🔴";
        };


    recognition.onend =
        function() {

            isListening = false;

            micButton.textContent =
                "🎤";
        };


    recognition.onerror =
        function(error) {

            console.error(
                "SES HATASI:",
                error
            );

            isListening = false;

            micButton.textContent =
                "🎤";
        };


    recognition.onresult =
        async function(event) {

            const text =
                event
                .results[0][0]
                .transcript
                .trim();


            if (!text) {
                return;
            }


            input.value =
                text;


            input.value = "";


            await sendVoiceMessage(
                text
            );
        };
}<script>

/* =========================
   SESLİ MESAJ GÖNDERME
========================= */

async function sendVoiceMessage(text) {

    if (!text) {
        return;
    }


    /*
       Önce uygulama komutu
    */

    if (
        openApplication(text)
    ) {

        addMessage(
            text,
            "user"
        );

        addMessage(
            "Komut alındı. Uygulama açılıyor.",
            "aura"
        );

        return;
    }


    /*
       Normal AI + Web sistemi
    */

    addMessage(
        text,
        "user"
    );


    addMessage(
        "Düşünüyorum...",
        "aura"
    );


    const loading =
        chat.lastElementChild;


    sendButton.disabled =
        true;

    micButton.disabled =
        true;


    try {

        let reply;


        if (
            needsWebSearch(text)
        ) {

            reply =
                await askAIWithWeb(
                    text
                );

        }

        else {

            reply =
                await askAI(text);
        }


        if (loading) {

            loading.remove();
        }


        addMessage(
            reply,
            "aura"
        );


        speak(reply);

    }

    catch (error) {

        console.error(
            "SESLİ MESAJ HATASI:",
            error
        );


        if (loading) {
            loading.remove();
        }


        addMessage(
            "Bir hata oluştu. Tekrar deneyelim.",
            "aura"
        );
    }


    sendButton.disabled =
        false;

    micButton.disabled =
        false;

    input.focus();
}


/* =========================
   MİKROFON BUTONU
========================= */

micButton.addEventListener(
    "click",
    function() {

        if (!recognition) {

            addMessage(
                "Bu tarayıcı sesli komutu desteklemiyor.",
                "aura"
            );

            return;
        }


        if (isListening) {

            recognition.stop();

            return;
        }


        try {

            recognition.start();

        }

        catch (error) {

            console.error(
                "Mikrofon başlatılamadı:",
                error
            );
        }

    }
);
