========================= */

function emptyMemory() {

    return {
        facts: [],
        notes: [],
        preferences: []
    };
}


function loadMemory() {

    try {

        const raw =
            localStorage.getItem(
                MEMORY_KEY
            );

        if (!raw) {
            return emptyMemory();
        }

        const data =
            JSON.parse(raw);

        return {

            facts:
                Array.isArray(data.facts)
                    ? data.facts
                    : [],

            notes:
                Array.isArray(data.notes)
                    ? data.notes
                    : [],

            preferences:
                Array.isArray(data.preferences)
                    ? data.preferences
                    : []
        };

    } catch (error) {

        console.error(
            "Memory error:",
            error
        );

        return emptyMemory();
    }
}


let auraMemory =
    loadMemory();


function saveMemory() {

    localStorage.setItem(
        MEMORY_KEY,
        JSON.stringify(auraMemory)
    );

    updateMemoryUI();
}


function addMemory(type, text) {

    auraMemory[type].push({

        text: text,

        date:
            new Date()
            .toLocaleString("tr-TR")
    });

    saveMemory();
}


function memoryCount() {

    return (
        auraMemory.facts.length +
        auraMemory.notes.length +
        auraMemory.preferences.length
    );
}


function memoryText() {

    const all = [];

    auraMemory.facts.forEach(
        x => all.push(
            "Bilgi: " + x.text
        )
    );

    auraMemory.preferences.forEach(
        x => all.push(
            "Tercih: " + x.text
        )
    );

    auraMemory.notes.forEach(
        x => all.push(
            "Not: " + x.text
        )
    );

    return all.length
        ? all.join("\n")
        : "Henüz kayıtlı bilgi yok.";
}/* =========================
   HAFIZA ARAYÜZÜ
========================= */

function updateMemoryUI() {

    const count =
        memoryCount();

    memoryStatus.textContent =
        "MEMORY " + count;

    memoryStatus.classList.toggle(
        "hasMemory",
        count > 0
    );

    if (!count) {

        memoryContent.innerHTML =
            `<div class="memoryItem">
                Hafızada kayıtlı bilgi yok.
            </div>`;

        return;
    }

    memoryContent.innerHTML = "";

    auraMemory.facts.forEach(
        item => {

            addMemoryVisual(
                "Bilgi",
                item.text
            );

        }
    );

    auraMemory.preferences.forEach(
        item => {

            addMemoryVisual(
                "Tercih",
                item.text
            );

        }
    );

    auraMemory.notes.forEach(
        item => {

            addMemoryVisual(
                "Not",
                item.text
            );

        }
    );
}


function addMemoryVisual(
    type,
    text
) {

    const div =
        document.createElement(
            "div"
        );

    div.className =
        "memoryItem";

    div.textContent =
        type + ": " + text;

    memoryContent.appendChild(
        div
    );
}

                voice: false,
                agent: false
            };
        }

        const data =
            JSON.parse(raw);

        return {

            voice:
                data.voice === true,

            agent:
                data.agent === true
        };

    } catch {

        return {
            voice: false,
            agent: false
        };
    }
}

    }/* =========================
   AI CEVAP AYRIŞTIRMA
========================= */

function extractAIText(
    response
) {

    if (!response) {
        return "";
    }

    if (
        typeof response ===
        "string"
    ) {

        return response.trim();
    }

    if (
        typeof response.text ===
        "string"
    ) {

        return response.text.trim();
    }

    if (
        response.message &&
        typeof response.message.content ===
        "string"
    ) {

        return response.message.content.trim();
    }

    if (
        response.message &&
        Array.isArray(
            response.message.content
        )
    ) {

        return response.message.content
            .map(
                item => {

                    if (
                        typeof item ===
                        "string"
                    ) {
                        return item;
                    }

                    if (
                        item &&
                        typeof item.text ===
                        "string"
                    ) {
                        return item.text;
                    }

                    return "";
                }
            )
            .join("")
            .trim();
    }

    return "";
}


/* =========================
   SES TEMİZLEME
========================= */

function cleanSpeechText(
    text
) {

    return String(text || "")

        .replace(
            /https?:\/\/\S+/gi,
            " "
        )

        .replace(
            /[\p{Emoji_Presentation}\p{Extended_Pictographic}]/gu,
            " "
        )

        .replace(
            /[*_`#~()[\]{}<>|\\/+=@#$%^&;:"'“”‘’!?.,…-]/g,
            " "
        )

        .replace(
            /\s+/g,
            " "
        )

        .trim();
}


function speak(
    text
) {

    if (
        !("speechSynthesis" in window)
    ) {
        return;
    }

    const clean =
        cleanSpeechText(text);

    if (!clean) {
        return;
    }

    window.speechSynthesis.cancel();

    const utterance =
        new SpeechSynthesisUtterance(
            clean
        );

    utterance.lang =
        "tr-TR";

    utterance.rate =
        .9;

    utterance.pitch =
        1;

    utterance.volume =
        1;

    window.speechSynthesis.speak(
        utterance
    );
        }/* =========================

function buildSystemPrompt() {

    let prompt = `

Sen AURA adında gelişmiş,
profesyonel ve doğal konuşan
bir yapay zeka asistanısın.

seslendirme.

Uydurma bilgi üretme.

Kullanıcının kalıcı hafızası:

${memoryText()}

`;

    if (auraSettings.agent) {

        prompt += `

AGENT MODU AKTİF.

Karmaşık görevlerde:

1. Görevi analiz et.
2. Gerekli adımları belirle.
3. Adımları sırala.

Kullanıcı istemediği sürece

`;

    }

    return prompt;
}


/* =========================
   ÖZEL KOMUTLAR
========================= */

function handleCommand(
    text
) {

    const lower =
        text
            .toLocaleLowerCase(
                "tr-TR"
            )
            .trim();


    if (
        lower === "saat kaç" ||
        lower === "saat"
    ) {

        return {
            handled: true,
            response:
                "Şu an saat " +
                new Date()
                    .toLocaleTimeString(
                        "tr-TR",
                        {
                            hour: "2-digit",
                            minute: "2-digit"
                        }
                    )
        };

    }


    if (
        lower === "bugün tarih ne" ||
        lower === "tarih ne"
    ) {

        return {
            handled: true,
            response:
                "Bugün " +
                new Date()
                    .toLocaleDateString(
                        "tr-TR",
                        {
                            weekday: "long",
                            year: "numeric",
                            month: "long",
                            day: "numeric"
                        }
                    )
        };

    }


    if (
        lower.startsWith(
            "not al "
        )
    ) {

        const value =
            text.substring(
                7
            ).trim();

        if (value) {

            addMemory(
                "notes",
                value
            );

            return {
                handled: true,
                response:
                    "Not hafızaya kaydedildi."
            };
        }
    }


    if (
        lower.startsWith(
            "bunu hatırla "
        )
    ) {

        const value =
            text.substring(
                13
            ).trim();

        if (value) {

            addMemory(
                "facts",
                value
            );

            return {
                handled: true,
                response:
                    "Bilgiyi hafızaya kaydettim."
            };
        }
    }


    if (
        lower ===
        "hafızamda ne var" ||
        lower ===
        "hafizamda ne var"
    ) {

        return {
            handled: true,
            response:
                memoryText()
        };
    }


    if (
        lower.includes(
            "sesli oku"
        ) ||
        lower.includes(
            "sesli cevap ver"
        )
    ) {

        return {
            handled: true,
            forceVoice: true,
            response:
                "Elbette. Bundan sonraki cevabımı sesli olarak okuyacağım."
        };
    }


    return {
        handled: false
    };
            }/* =========================
   AI ÇAĞRISI
========================= */

async function askAI(
    text
) {

    if (
        typeof puter ===
        "undefined"
    ) {

        throw new Error(
            "Puter AI yüklenemedi."
        );
    }

    const messages = [

        {
            role: "system",
            content:
                buildSystemPrompt()
        },

        {
            role: "user",
            content:
                text
        }

    ];

    const response =
        await puter.ai.chat(
            messages
        );

    const answer =
        extractAIText(
            response
        );

    if (!answer) {

        throw new Error(
            "AI boş cevap döndürdü."
        );
    }

    return answer;
}


/* =========================
   MESAJ GÖNDER
========================= */

async function sendMessage() {

    const text =
        messageInput.value.trim();

    if (!text) {
        return;
    }

    messageInput.value = "";

    addMessage(
        text,
        "user"
    );

    const command =
        handleCommand(
            text
        );

    if (
        command.handled
    ) {

        addMessage(
            command.response,
            "aura"
        );

        if (
            command.forceVoice ||
            auraSettings.voice
        ) {

            speak(
                command.response
            );
        }

        return;
    }

    setThinking(true);

    sendButton.disabled =
        true;

    try {

        const answer =
            await askAI(text);

        setThinking(false);

        addMessage(
            answer,
            "aura"
        );

        /*
          ÖNEMLİ:
          Normal cevap otomatik okunmaz.
          Sadece Ayarlar'dan sesli cevap
          açıksa okunur.
        */

        if (
            auraSettings.voice
        ) {

            speak(answer);
        }

    } catch (error) {

        console.error(
            "AURA AI ERROR:",
            error
        );

        setThinking(false);

        addMessage(
            "AI bağlantısında bir sorun oluştu. Lütfen tekrar deneyin.",
            "aura"
        );

    } finally {

        sendButton.disabled =
            false;

        messageInput.focus();
    }
}

let recognition =
    null;

const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;


if (SpeechRecognition) {

    recognition =
        new SpeechRecognition();

    recognition.lang =
        "tr-TR";

    recognition.continuous =
        false;

    recognition.interimResults =
        false;

    recognition.onstart =
        function() {

            micButton.classList.add(
                "listening"
            );
        };

    recognition.onend =
        function() {

            micButton.classList.remove(
                "listening"
            );
        };

    recognition.onresult =
        function(event) {

            const result =
                event.results[0][0].transcript;

            messageInput.value =
                result;

            messageInput.focus();

        };

    recognition.onerror =
        function() {

            micButton.classList.remove(
                "listening"
            );
        };

}


micButton.addEventListener(
    "click",
    function() {

        if (!recognition) {

            addMessage(
                "Bu tarayıcı sesli giriş özelliğini desteklemiyor.",
                "aura"
            );

            return;
        }

        try {

            recognition.start();

        } catch {

            try {
                recognition.stop();
            } catch {}

        }

    }
);


/* =========================
   PANEL SÜRÜKLEME
========================= */

let dragStartY =
    null;

chatPanel.addEventListener(
    "touchstart",
    function(event) {

        if (
            event.touches.length !== 1
        ) {
            return;
        }

        dragStartY =
            event.touches[0].clientY;

    },
    {
        passive: true
    }
);


chatPanel.addEventListener(
    "touchmove",
    function(event) {

        if (
            dragStartY === null
        ) {
            return;
        }

        const currentY =
            event.touches[0].clientY;

        const diff =
            currentY - dragStartY;

        if (
            diff > 90
        ) {

            dragStartY =
                null;

            closeChatPanel();
        }

    },
    {
        passive: true
    }
);


chatPanel.addEventListener(
    "touchend",
    function() {

        dragStartY =
            null;

    }
);
