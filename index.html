<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">

<meta name="theme-color" content="#010712">

<title>AURA AI</title>

<style>

*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,
body{
    width:100%;
    height:100%;
    margin:0;
}

body{
    overflow:hidden;
    font-family:Arial,Helvetica,sans-serif;
    color:#e9fbff;

    background:
        radial-gradient(
            circle at 50% 30%,
            #073b59 0%,
            #031d31 32%,
            #010b16 65%,
            #000207 100%
        );
}

.background-light{
    position:fixed;

    width:600px;
    height:600px;

    left:50%;
    top:50%;

    transform:translate(-50%,-50%);

    border-radius:50%;

    background:
        radial-gradient(
            circle,
            rgba(0,220,255,.12),
            rgba(0,100,220,.04) 45%,
            transparent 72%
        );

    filter:blur(12px);

    pointer-events:none;

    z-index:0;
}

.header{
    position:relative;

    width:100%;
    height:58px;

    display:flex;
    align-items:center;
    justify-content:space-between;

    padding:0 18px;

    z-index:30;

    background:
        rgba(0,5,12,.9);

    border-bottom:
        1px solid
        rgba(0,220,255,.25);

    backdrop-filter:blur(12px);
}

.logo{
    color:#00eaff;

    font-size:20px;
    font-weight:bold;

    letter-spacing:5px;

    text-shadow:
        0 0 10px #00eaff,
        0 0 25px rgba(0,220,255,.6);
}

.status{
    display:flex;
    align-items:center;
    gap:7px;

    color:#55ffcf;

    font-size:9px;
    letter-spacing:2px;
}

.status-dot{
    width:6px;
    height:6px;

    border-radius:50%;

    background:#55ffcf;

    box-shadow:
        0 0 8px #55ffcf,
        0 0 16px #55ffcf;
}

.main{
    position:relative;

    width:100%;
    height:calc(100dvh - 58px);

    overflow:hidden;
}

.core{
    position:absolute;

    width:230px;
    height:230px;

    left:50%;
    top:50%;

    transform:
        translate(-50%,-50%)
        scale(1.1);

    display:flex;
    align-items:center;
    justify-content:center;

    z-index:20;

    cursor:pointer;

    transition:
        top .5s cubic-bezier(.2,.8,.2,1),
        transform .5s cubic-bezier(.2,.8,.2,1);
}

.main.panel-open .core{
    top:95px;

    transform:
        translate(-50%,-50%)
        scale(.72);
}

.main.panel-closed .core{
    top:50%;

    transform:
        translate(-50%,-50%)
        scale(1.1);
}

.ring{
    position:absolute;

    border-radius:50%;

    border:
        1px solid
        rgba(0,225,255,.55);

    pointer-events:none;
}

.ring-one{
    width:158px;
    height:158px;

    border-left-color:transparent;
    border-right-color:transparent;

    animation:
        rotateOne 8s linear infinite;
}

.ring-two{
    width:195px;
    height:195px;

    border-top-color:transparent;
    border-bottom-color:transparent;

    animation:
        rotateTwo 11s linear infinite;
}

.core-glow{
    position:absolute;

    width:160px;
    height:160px;

    border-radius:50%;

    background:
        radial-gradient(
            circle,
            rgba(0,235,255,.28),
            rgba(0,120,220,.06) 50%,
            transparent 72%
        );

    filter:blur(10px);

    animation:
        glowPulse 3s ease-in-out infinite;
}

.sphere{
    position:relative;

    width:116px;
    height:116px;

    display:flex;
    align-items:center;
    justify-content:center;

    border-radius:50%;

    background:
        radial-gradient(
            circle at 32% 27%,
            #d5ffff 0%,
            #38eaff 8%,
            #0788a9 27%,
            #034866 48%,
            #012238 70%,
            #000a13 100%
        );

    border:
        2px solid
        rgba(125,250,255,.95);

    box-shadow:
        0 0 15px #00eaff,
        0 0 40px rgba(0,220,255,.7),
        0 0 75px rgba(0,100,255,.35),
        inset -16px -16px 27px rgba(0,0,0,.58),
        inset 10px 8px 18px rgba(180,255,255,.35);

    animation:
        spherePulse 2.7s ease-in-out infinite;

    z-index:5;
}

.core-name{
    color:#ecffff;

    font-size:17px;
    font-weight:bold;

    letter-spacing:4px;

    text-shadow:
        0 0 6px #fff,
        0 0 14px #00eaff,
        0 0 26px #008cff;
}

@keyframes spherePulse{

    0%,100%{
        transform:scale(1);
    }

    50%{
        transform:scale(1.07);
    }

}

@keyframes glowPulse{

    0%,100%{
        transform:scale(1);
        opacity:.6;
    }

    50%{
        transform:scale(1.15);
        opacity:1;
    }

}

@keyframes rotateOne{

    from{
        transform:rotate(0deg);
    }

    to{
        transform:rotate(360deg);
    }

}

@keyframes rotateTwo{

    from{
        transform:rotate(360deg);
    }

    to{
        transform:rotate(0deg);
    }

}.chat-panel{
    position:absolute;

    left:50%;
    bottom:0;

    width:min(94%,640px);

    height:calc(100% - 205px);

    transform:translateX(-50%);

    display:flex;
    flex-direction:column;

    z-index:10;

    background:
        rgba(1,12,23,.84);

    border:
        1px solid
        rgba(0,190,255,.25);

    border-bottom:0;

    border-radius:
        20px 20px 0 0;

    backdrop-filter:blur(14px);

    overflow:hidden;

    transition:
        height .45s ease,
        opacity .3s ease,
        transform .45s ease;
}

.main.panel-closed .chat-panel{

    height:0;

    opacity:0;

    transform:
        translateX(-50%)
        translateY(30px);

    pointer-events:none;
}

#chat{
    width:100%;
    height:100%;

    overflow-y:auto;

    padding:
        18px 12px 75px;

    scrollbar-width:thin;

    scrollbar-color:
        #008aae
        transparent;
}

#chat::-webkit-scrollbar{
    width:3px;
}

#chat::-webkit-scrollbar-thumb{
    background:#008aae;
    border-radius:10px;
}

.message{
    max-width:82%;

    padding:
        10px 13px;

    margin-bottom:10px;

    border-radius:12px;

    font-size:13px;

    line-height:1.45;

    white-space:pre-wrap;

    animation:
        messageIn .2s ease;
}

@keyframes messageIn{

    from{
        opacity:0;
        transform:translateY(7px);
    }

    to{
        opacity:1;
        transform:translateY(0);
    }

}

.message.aura{
    margin-left:0;
    margin-right:auto;

    color:#ddfaff;

    background:
        linear-gradient(
            135deg,
            rgba(3,59,79,.86),
            rgba(1,24,39,.92)
        );

    border-left:
        2px solid
        #00eaff;

    border-top-left-radius:3px;
}

.message.user{
    margin-left:auto;
    margin-right:0;

    color:#fff;

    background:
        linear-gradient(
            135deg,
            rgba(8,94,127,.94),
            rgba(3,48,77,.96)
        );

    border-right:
        2px solid
        #55ffcf;

    border-top-right-radius:3px;
}

.bottom{
    position:absolute;

    left:50%;
    bottom:0;

    width:min(94%,640px);

    transform:translateX(-50%);

    padding:
        9px 8px 10px;

    z-index:15;

    background:
        linear-gradient(
            180deg,
            #041d31,
            #020d1b
        );

    border:
        1px solid
        rgba(0,190,255,.25);

    border-radius:
        0 0 20px 20px;

    transition:
        transform .45s ease,
        opacity .3s ease;
}

.main.panel-closed .bottom{

    transform:
        translate(-50%,120px);

    opacity:0;

    pointer-events:none;
}

.composer{
    height:48px;

    display:flex;
    align-items:center;

    gap:7px;

    padding:
        4px 5px 4px 13px;

    border-radius:14px;

    background:#041b2d;

    border:
        1px solid
        rgba(0,190,255,.34);

    box-shadow:
        inset 0 0 15px
        rgba(0,100,160,.08);
}

.composer:focus-within{

    border-color:
        rgba(0,225,255,.75);

    box-shadow:
        0 0 18px
        rgba(0,180,255,.14);
}

#input{
    flex:1;

    min-width:0;

    height:100%;

    border:0;
    outline:0;

    background:transparent;

    color:#fff;

    font-size:13px;
}

#input::placeholder{
    color:#54798a;
}

.button{
    width:40px;
    height:40px;

    flex-shrink:0;

    border:0;

    border-radius:11px;

    cursor:pointer;

    color:#00eaff;

    background:#062b43;

    font-size:16px;
}

.button:active{
    transform:scale(.9);
}

.button:disabled{
    opacity:.45;
}

.send{
    color:#001923;

    background:
        linear-gradient(
            135deg,
            #00eaff,
            #55ffcf
        );

    box-shadow:
        0 0 15px
        rgba(0,220,255,.25);
}

@media(max-width:500px){

    .main.panel-open .core{
        top:88px;

        transform:
            translate(-50%,-50%)
            scale(.66);
    }

    .main.panel-closed .core{
        transform:
            translate(-50%,-50%)
            scale(1.06);
    }

    .chat-panel,
    .bottom{
        width:96%;
    }

    .message{
        max-width:88%;
    }

}

</style>

</head>

<body>

<div class="background-light"></div>

<div class="header">

    <div class="logo">
        AURA
    </div>

    <div class="status">

        <span class="status-dot"></span>

        SYSTEM ONLINE

    </div>

</div>

<div
    class="main panel-closed"
    id="main"
>

    <div
        class="core"
        id="core"
    >

        <div class="ring ring-one"></div>

        <div class="ring ring-two"></div>

        <div class="core-glow"></div>

        <div class="sphere">

            <div class="core-name">
                AURA
            </div>

        </div>

    </div>

    <div
        class="chat-panel"
        id="chatPanel"
    >

        <div id="chat">

            <div class="message aura">
                Selam Bedirhan, sistem hazır. Seni dinliyorum.
            </div>

        </div>

    </div>

    <div
        class="bottom"
        id="bottom"
    >

        <div class="composer">

            <input
                id="input"
                type="text"
                autocomplete="off"
                placeholder="AURA'ya mesaj yaz..."
            >

            <button
                class="button"
                id="mic"
                type="button"
            >🎙</button>

            <button
                class="button send"
                id="send"
                type="button"
            >➤</button>

        </div>

    </div>

</div>

<script src="https://js.puter.com/v2/"></script>

<script>/* =========================
   ELEMENTLER
========================= */

const main =
    document.getElementById("main");

const core =
    document.getElementById("core");

const input =
    document.getElementById("input");

const send =
    document.getElementById("send");

const mic =
    document.getElementById("mic");

const chat =
    document.getElementById("chat");


/* =========================
   KİMLİK
========================= */

const USER_NAME =
    "Bedirhan Kahraman";

const GIRLFRIEND_NAME =
    "Edanur";


/* =========================
   KALICI VERİLER
========================= */

const MEMORY_KEY =
    "AURA_MEMORY_V6";

const TASK_KEY =
    "AURA_TASKS_V6";

const REMINDER_KEY =
    "AURA_REMINDERS_V6";

const HISTORY_KEY =
    "AURA_HISTORY_V6";


function emptyMemory(){

    return {
        facts:[],
        preferences:[],
        notes:[],
        knowledge:[]
    };

}


function loadData(
    key,
    fallback
){

    try{

        const value =
            localStorage.getItem(key);

        if(!value){

            return fallback;
        }

        const parsed =
            JSON.parse(value);

        return parsed;

    }catch(error){

        console.error(
            "Veri okunamadı:",
            error
        );

        return fallback;
    }

}


let memory =
    loadData(
        MEMORY_KEY,
        emptyMemory()
    );

let tasks =
    loadData(
        TASK_KEY,
        []
    );

let reminders =
    loadData(
        REMINDER_KEY,
        []
    );

let history =
    loadData(
        HISTORY_KEY,
        []
    );


function saveData(){

    try{

        localStorage.setItem(
            MEMORY_KEY,
            JSON.stringify(memory)
        );

        localStorage.setItem(
            TASK_KEY,
            JSON.stringify(tasks)
        );

        localStorage.setItem(
            REMINDER_KEY,
            JSON.stringify(reminders)
        );

        localStorage.setItem(
            HISTORY_KEY,
            JSON.stringify(
                history.slice(-50)
            )
        );

    }catch(error){

        console.error(
            "Kalıcı kayıt hatası:",
            error
        );

    }

}


/* =========================
   HAFIZA
========================= */

function addMemory(
    type,
    text
){

    if(
        !Array.isArray(
            memory[type]
        )
    ){

        memory[type] = [];

    }

    memory[type].push({

        text:text,

        date:
            new Date()
            .toLocaleString("tr-TR")

    });

    saveData();

}


function getMemoryText(){

    let output = "";

    if(memory.facts.length){

        output +=
            "Kayıtlı bilgiler:\n";

        memory.facts.forEach(
            item => {

                output +=
                    "- " +
                    item.text +
                    "\n";

            }
        );

    }

    if(memory.preferences.length){

        output +=
            "\nTercihler:\n";

        memory.preferences.forEach(
            item => {

                output +=
                    "- " +
                    item.text +
                    "\n";

            }
        );

    }

    if(memory.notes.length){

        output +=
            "\nNotlar:\n";

        memory.notes.forEach(
            item => {

                output +=
                    "- " +
                    item.text +
                    "\n";

            }
        );

    }

    if(memory.knowledge.length){

        output +=
            "\nBilgi tabanı:\n";

        memory.knowledge.forEach(
            item => {

                output +=
                    "- " +
                    item.text +
                    "\n";

            }
        );

    }

    return output.trim() ||
        "Henüz özel hafıza kaydı yok.";

}


/* =========================
   SİSTEM PROMPT
========================= */

function buildSystemPrompt(){

    return `
Sen AURA adında kişisel yapay zeka asistanısın.

Türkçe konuş.

Kullanıcının adı:
Bedirhan Kahraman.

Kullanıcının sevgilisi:
Edanur.

Önemli kurallar:

- Her mesajda kullanıcıya Bedirhan diye hitap etme.
- Doğal ve insan gibi konuş.
- Gereksiz tekrar yapma.
- Kısa ve anlaşılır cevaplar ver.
- Gerektiğinde detaylı açıklama yap.
- Bilmediğin bilgileri uydurma.
- Kullanıcı "ben kimim" derse Bedirhan Kahraman olduğunu bil.
- Kullanıcı sevgilisini sorarsa Edanur olduğunu bil.
- Edanur AURA'nın sevgilisi değildir.
- Edanur, Bedirhan'ın sevgilisidir.
- Kendini AURA olarak tanıt.
- Tarih ve saat sorularına doğru cevap vermeye çalış.
- Basit matematik işlemlerini çöz.
- Şaka istenirse şaka yap.
- Kullanıcının kalıcı hafızasını gerektiğinde kullan.
- Kullanıcının daha önceki konuşma geçmişini bağlam olarak kullan.

KALICI HAFIZA:

${getMemoryText()}

GÖREVLER:

${
    tasks.length
    ? tasks.map(
        (task,index) =>
        `${index+1}. ${task.text} ${
            task.done
            ? "[TAMAMLANDI]"
            : "[BEKLİYOR]"
        }`
      ).join("\n")
    : "Görev yok."
}
`;

}/* =========================
   MESAJ GÖSTER
========================= */

function addMessage(
    text,
    type
){

    const element =
        document.createElement(
            "div"
        );

    element.className =
        "message " + type;

    element.textContent =
        String(text);

    chat.appendChild(
        element
    );

    chat.scrollTop =
        chat.scrollHeight;

}


/* =========================
   HAFIZA KOMUTLARI
========================= */

function memoryCommand(
    text
){

    const lower =
        text
        .toLocaleLowerCase("tr-TR")
        .trim();


    const notePrefixes = [

        "not al ",
        "not kaydet ",
        "bunu not al ",
        "bunu kaydet ",
        "hafızana kaydet ",
        "hafizana kaydet "

    ];


    for(
        const prefix
        of notePrefixes
    ){

        if(
            lower.startsWith(prefix)
        ){

            const value =
                text
                .substring(prefix.length)
                .trim();


            if(!value){

                return {
                    handled:true,
                    response:
                        "Kaydedilecek notu belirt."
                };

            }


            addMemory(
                "notes",
                value
            );


            return {
                handled:true,
                response:
                    "Not kalıcı hafızaya kaydedildi."
            };

        }

    }


    const factPrefixes = [

        "bunu hatırla ",
        "bunu hatirla ",
        "bunu hafızana al ",
        "bunu hafizana al ",
        "bunu unutma "

    ];


    for(
        const prefix
        of factPrefixes
    ){

        if(
            lower.startsWith(prefix)
        ){

            const value =
                text
                .substring(prefix.length)
                .trim();


            if(!value){

                return {
                    handled:true,
                    response:
                        "Hatırlamam gereken bilgiyi belirt."
                };

            }


            addMemory(
                "facts",
                value
            );


            return {
                handled:true,
                response:
                    "Bilgi kalıcı hafızaya kaydedildi."
            };

        }

    }


    const preferencePrefixes = [

        "tercihimi hatırla ",
        "tercihimi hatirla ",
        "şunu seviyorum ",
        "sunu seviyorum ",
        "şunu sevmiyorum ",
        "sunu sevmiyorum "

    ];


    for(
        const prefix
        of preferencePrefixes
    ){

        if(
            lower.startsWith(prefix)
        ){

            const value =
                text
                .substring(prefix.length)
                .trim();


            if(!value){

                return {
                    handled:true,
                    response:
                        "Tercihi belirt."
                };

            }


            addMemory(
                "preferences",
                value
            );


            return {
                handled:true,
                response:
                    "Tercih kalıcı hafızaya kaydedildi."
            };

        }

    }


    if(
        lower === "hafızamda ne var" ||
        lower === "hafizamda ne var" ||
        lower === "neyi hatırlıyorsun" ||
        lower === "neyi hatirliyorsun"
    ){

        return {
            handled:true,
            response:
                getMemoryText()
        };

    }


    if(
        lower === "hafızayı temizle" ||
        lower === "hafizayi temizle" ||
        lower === "hafızanı temizle" ||
        lower === "hafizani temizle"
    ){

        memory =
            emptyMemory();

        saveData();

        return {
            handled:true,
            response:
                "AURA hafızası temizlendi."
        };

    }


    return {
        handled:false
    };

}


/* =========================
   BİLGİ TABANI
========================= */

function knowledgeCommand(
    text
){

    const lower =
        text
        .toLocaleLowerCase("tr-TR")
        .trim();


    const prefixes = [

        "bilgi ekle ",
        "bilgiyi kaydet ",
        "auraya bilgi ekle ",
        "aura'ya bilgi ekle ",
        "auraya öğret ",
        "aura'ya öğret "

    ];


    for(
        const prefix
        of prefixes
    ){

        if(
            lower.startsWith(prefix)
        ){

            const value =
                text
                .substring(prefix.length)
                .trim();


            if(!value){

                return {
                    handled:true,
                    response:
                        "Eklenecek bilgiyi belirt."
                };

            }


            memory.knowledge.push({

                text:value,

                date:
                    new Date()
                    .toLocaleString("tr-TR")

            });


            saveData();


            return {
                handled:true,
                response:
                    "Bilgi tabanına kaydedildi."
            };

        }

    }


    return {
        handled:false
    };

}


/* =========================
   GÖREVLER
========================= */

function taskCommand(
    text
){

    const lower =
        text
        .toLocaleLowerCase("tr-TR")
        .trim();


    const prefixes = [

        "görev ekle ",
        "gorev ekle ",
        "yapılacak ekle ",
        "yapilacak ekle "

    ];


    for(
        const prefix
        of prefixes
    ){

        if(
            lower.startsWith(prefix)
        ){

            const value =
                text
                .substring(prefix.length)
                .trim();


            if(!value){

                return {
                    handled:true,
                    response:
                        "Eklenecek görevi belirt."
                };

            }


            tasks.push({

                id:Date.now(),

                text:value,

                done:false,

                created:
                    new Date()
                    .toLocaleString("tr-TR")

            });


            saveData();


            return {
                handled:true,
                response:
                    "Görev listeye eklendi."
            };

        }

    }


    if(
        lower === "görevlerim" ||
        lower === "gorevlerim" ||
        lower === "görev listesi" ||
        lower === "gorev listesi"
    ){

        if(!tasks.length){

            return {
                handled:true,
                response:
                    "Görev listen boş."
            };

        }


        return {
            handled:true,
            response:
                tasks
                .map(
                    (task,index) =>
                    `${index+1}. ${
                        task.done
                        ? "✓"
                        : "○"
                    } ${task.text}`
                )
                .join("\n")
        };

    }


    if(
        lower.startsWith(
            "görevi tamamla "
        ) ||
        lower.startsWith(
            "gorevi tamamla "
        )
    ){

        const number =
            parseInt(
                text
                .replace(
                    /^görevi tamamla\s*/i,
                    ""
                )
                .replace(
                    /^gorevi tamamla\s*/i,
                    ""
                )
            );


        const index =
            number - 1;


        if(
            Number.isInteger(number) &&
            tasks[index]
        ){

            tasks[index].done =
                true;

            saveData();

            return {
                handled:true,
                response:
                    "Görev tamamlandı."
            };

        }


        return {
            handled:true,
            response:
                "Bu numarada görev bulunamadı."
        };

    }


    if(
        lower === "görevleri temizle" ||
        lower === "gorevleri temizle"
    ){

        tasks = [];

        saveData();

        return {
            handled:true,
            response:
                "Görev listesi temizlendi."
        };

    }


    return {
        handled:false
    };

        }/* =========================
   TARİH / SAAT

/* =========================
   HESAPLAMA
========================= */

function calculateCommand(
    text
){

    const lower =
        text
        .toLocaleLowerCase("tr-TR")
        .trim();


    const prefixes = [

        "hesapla ",
        "hesap ",
        "kaç eder ",
        "kac eder "

    ];


    let expression =
        null;


    for(
        const prefix
        of prefixes
    ){

        if(
            lower.startsWith(prefix)
        ){

            expression =
                text
                .substring(prefix.length)
                .trim();

            break;

        }

    }


    if(!expression){

        return {
            handled:false
        };

    }


    expression =
        expression
        .replace(/,/g,".")
        .replace(/×/g,"*")
        .replace(/÷/g,"/")
        .replace(/[^0-9+\-*/().%\s]/g,"");


    if(!expression){

        return {
            handled:true,
            response:
                "Hesaplanacak işlemi anlayamadım."
        };

    }


    try{

        const result =
            Function(
                '"use strict";return (' +
                expression +
                ')'
            )();


        if(
            typeof result !== "number" ||
            !Number.isFinite(result)
        ){

            throw new Error(
                "Geçersiz sonuç"
            );

        }


        return {
            handled:true,
            response:
                "Sonuç: " +
                result
        };

    }catch(error){

        return {
            handled:true,
            response:
                "Bu işlemi hesaplayamadım."
        };

    }

}

function createReminder(
    text,
    minutes
){

    const reminder = {

        id:Date.now(),

        text:text,

        time:
            Date.now() +
            minutes * 60000

    };


    reminders.push(
        reminder
    );

    saveData();


    setTimeout(
        function(){

            addMessage(
                "Hatırlatıcı: " +
                reminder.text,
                "aura"
            );

            speak(
                "Hatırlatıcı. " +
                reminder.text
            );


            reminders =
                reminders.filter(
                    item =>
                        item.id !==
                        reminder.id
                );

            saveData();

        },
        minutes * 60000
    );

}


function reminderCommand(
    text
){

    const lower =
        text
        .toLocaleLowerCase("tr-TR")
        .trim();


    const match =
        lower.match(
            /(.+?)\s+(\d+)\s*(dakika|dk)\s+sonra/
        );


    if(!match){

        return {
            handled:false
        };

    }


    const reminderText =
        match[1]
        .replace(
            /^(hatırlat|hatirlat)\s*/i,
            ""
        )
        .trim();


    const minutes =
        Number(
            match[2]
        );


    if(
        !reminderText ||
        !Number.isFinite(minutes) ||
        minutes <= 0
    ){

        return {
            handled:true,
            response:
                "Hatırlatıcı komutunu anlayamadım."
        };

    }


    createReminder(
        reminderText,
        minutes
    );


    return {
        handled:true,
        response:
            `${minutes} dakika sonra "${reminderText}" için hatırlatacağım.`
    };

}

/* =========================
   DOSYA OKUMA
========================= */

function selectFile(){

    return new Promise(
        resolve => {

            const picker =
                document.createElement(
                    "input"
                );

            picker.type =
                "file";

            picker.accept =
                ".txt,.md,.csv,.json,.html,.htm";


            picker.onchange =
                async function(){

                    const file =
                        picker.files[0];


                    if(!file){

                        resolve(null);

                        return;

                    }


                    try{

                        const content =
                            await file.text();


                        resolve({

                            name:file.name,

                            content:content

                        });

                    }catch(error){

                        resolve(null);

                    }

                };


            picker.click();

        }
    );

}


async function fileCommand(
    text
){

    const lower =
        text
        .toLocaleLowerCase("tr-TR");


    if(
        !lower.includes("dosya oku") &&
        !lower.includes("dosyayı oku") &&
        !lower.includes("dosyayi oku") &&
        !lower.includes("dosya incele")
    ){

        return {
            handled:false
        };

    }


    const file =
        await selectFile();


    if(!file){

        return {
            handled:true,
            response:
                "Dosya seçilmedi."
        };

    }


    if(!file.content){

        return {
            handled:true,
            response:
                "Dosya okunamadı."
        };

    }


    const content =
        file.content.length > 10000
        ? file.content.substring(
            0,
            10000
          )
        : file.content;


    try{

        const answer =
            await askAI(
                `Dosya adı: ${file.name}

Dosya içeriği:

${content}

Bu dosyayı analiz et ve anlaşılır şekilde açıkla.`
            );


        return {
            handled:true,
            response:answer
        };

    }catch(error){

        return {
            handled:true,
            response:
                "Dosyayı analiz ederken AI bağlantısında sorun oluştu."
        };

    }

}


/* =========================
   KONUŞMA GEÇMİŞİ
========================= */

function saveConversation(
    user,
    aura
){

    history.push({

        user:user,

        aura:aura,

        date:
            new Date()
            .toLocaleString("tr-TR")

    });


    if(
        history.length > 50
    ){

        history =
            history.slice(-50);

    }


    saveData();

        }/* =========================
   AI CEVAP AYIKLA
========================= */

function extractAIText(
    response
){

    if(!response){

        return "";
    }


    if(
        typeof response === "string"
    ){

        return response.trim();

    }


    if(
        response.message &&
        typeof response.message.content === "string"
    ){

        return response.message.content.trim();

    }


    if(
        Array.isArray(
            response?.message?.content
        )
    ){

        return response.message.content
            .map(
                part =>
                    typeof part === "string"
                    ? part
                    : part?.text || ""
            )
            .join("")
            .trim();

    }


    if(
        typeof response.text === "string"
    ){

        return response.text.trim();

    }


    return "";

}


/* =========================
   AI BAĞLANTISI
========================= */

async function askAI(
    text
){

    if(
        typeof puter === "undefined"
    ){

        throw new Error(
            "Puter yüklenmedi."
        );

    }


    if(
        !puter.ai ||
        typeof puter.ai.chat !== "function"
    ){

        throw new Error(
            "Puter AI servisi bulunamadı."
        );

    }


    const messages = [

        {
            role:"system",
            content:
                buildSystemPrompt()
        }

    ];


    history
        .slice(-12)
        .forEach(
            item => {

                if(item.user){

                    messages.push({

                        role:"user",

                        content:item.user

                    });

                }


                if(item.aura){

                    messages.push({

                        role:"assistant",

                        content:item.aura

                    });

                }

            }
        );


    messages.push({

        role:"user",

        content:text

    });


    const response =
        await puter.ai.chat(
            messages
        );


    const answer =
        extractAIText(
            response
        );


    if(!answer){

        throw new Error(
            "AI boş cevap döndürdü."
        );

    }


    saveConversation(
        text,
        answer
    );


    return answer;

}


/* =========================
   TÜM YEREL KOMUTLAR
========================= */

async function localCommand(
    text
){

    const handlers = [

        memoryCommand,

        knowledgeCommand,

        taskCommand,

        reminderCommand,

        fileCommand,

        dateTimeCommand,

        calculateCommand,

        jokeCommand,

        identityCommand,

        systemCommand

    ];


    for(
        const handler
        of handlers
    ){

        try{

            const result =
                await handler(text);


            if(
                result &&
                result.handled
            ){

                return result.response;

            }

        }catch(error){

            console.error(
                "Komut hatası:",
                error
            );

        }

    }


    return null;

}


/* =========================
   SES SİSTEMİ
========================= */

let selectedVoice =
    null;


function loadVoices(){

    if(
        !("speechSynthesis" in window)
    ){

        return;

    }


    const voices =
        speechSynthesis
        .getVoices();


    selectedVoice =
        voices.find(
            voice =>
                voice.lang
                .toLowerCase()
                .startsWith("tr")
        ) ||
        voices[0] ||
        null;

}


if(
    "speechSynthesis" in window
){

    speechSynthesis.onvoiceschanged =
        loadVoices;

    loadVoices();

}


function cleanSpeechText(
    text
){

    return String(text)

        .replace(
            /https?:\/\/\S+/gi,
            " "
        )

        .replace(
            /[`*_#]/g,
            " "
        )

        .replace(
            /[()[\]{}<>]/g,
            " "
        )

        .replace(
            /\s+/g,
            " "
        )

        .trim();

}


function speak(
    text
){

    if(
        !("speechSynthesis" in window)
    ){

        return;

    }


    const clean =
        cleanSpeechText(
            text
        );


    if(!clean){

        return;

    }


    speechSynthesis.cancel();


    const utterance =
        new SpeechSynthesisUtterance(
            clean
        );


    utterance.lang =
        "tr-TR";


    if(selectedVoice){

        utterance.voice =
            selectedVoice;

    }


    utterance.rate =
        .92;

    utterance.pitch =
        1;

    utterance.volume =
        1;


    speechSynthesis.speak(
        utterance
    );

        }/* =========================
   SESLİ GİRİŞ
========================= */

let recognition =
    null;

let listening =
    false;


function setupRecognition(){

    const SpeechRecognition =
        window.SpeechRecognition ||
        window.webkitSpeechRecognition;


    if(!SpeechRecognition){

        return false;

    }


    recognition =
        new SpeechRecognition();


    recognition.lang =
        "tr-TR";

    recognition.continuous =
        false;

    recognition.interimResults =
        false;


    recognition.onstart =
        function(){

            listening =
                true;

            mic.textContent =
                "■";

        };


    recognition.onend =
        function(){

            listening =
                false;

            mic.textContent =
                "🎙";

        };


    recognition.onerror =
        function(){

            listening =
                false;

            mic.textContent =
                "🎙";

        };


    recognition.onresult =
        function(event){

            const result =
                event
                .results[0][0]
                .transcript;


            input.value =
                result;


            sendMessage();

        };


    return true;

}


const speechReady =
    setupRecognition();


mic.addEventListener(
    "click",
    function(){

        if(!speechReady){

            addMessage(
                "Bu cihaz/tarayıcı sesli girişi desteklemiyor.",
                "aura"
            );

            return;

        }


        try{

            if(listening){

                recognition.stop();

            }else{

                recognition.start();

            }

        }catch(error){

            console.error(
                "Mikrofon:",
                error
            );

        }

    }
);


/* =========================
   MESAJ GÖNDER
========================= */

let sending =
    false;


async function sendMessage(){

    if(sending){

        return;

    }


    const text =
        input.value.trim();


    if(!text){

        return;

    }


    sending =
        true;


    input.value =
        "";


    addMessage(
        text,
        "user"
    );


    send.disabled =
        true;

    mic.disabled =
        true;


    try{

        const local =
            await localCommand(
                text
            );


        if(
            local !== null
        ){

            addMessage(
                local,
                "aura"
            );

            speak(
                local
            );

            return;

        }


        const answer =
            await askAI(
                text
            );


        addMessage(
            answer,
            "aura"
        );


        speak(
            answer
        );


    }catch(error){

        console.error(
            "AURA AI HATASI:",
            error
        );


        addMessage(
            "AI bağlantısında bir sorun oluştu. Birkaç saniye sonra tekrar dene.",
            "aura"
        );

    }finally{

        sending =
            false;

        send.disabled =
            false;

        mic.disabled =
            false;

        input.focus();

    }

}


/* =========================
   BUTON / ENTER
========================= */

send.addEventListener(
    "click",
    sendMessage
);


input.addEventListener(
    "keydown",
    function(event){

        if(
            event.key === "Enter"
        ){

            event.preventDefault();

            sendMessage();

        }

    }
);


/* =========================
   ÇEKİRDEK
========================= */

let panelOpen =
    false;


function openPanel(){

    panelOpen =
        true;

    main.classList.remove(
        "panel-closed"
    );

    main.classList.add(
        "panel-open"
    );

}


function closePanel(){

    panelOpen =
        false;

    main.classList.remove(
        "panel-open"
    );

    main.classList.add(
        "panel-closed"
    );

}


core.addEventListener(

            openPanel();

    }

/* =========================
   SÜRÜKLEME
========================= */

let startY =
    null;


main.addEventListener(
    "touchstart",
    function(event){

        if(
            event.touches.length !== 1
        ){

            return;

        }


        startY =
            event.touches[0].clientY;

    },
    {
        passive:true
    }
);


main.addEventListener(
    "touchend",
    function(event){

        if(startY === null){

            return;

        }


        const endY =
            event.changedTouches[0].clientY;


        const difference =
            endY - startY;


        if(
            difference < -60
        ){

            openPanel();

        }


        if(
            difference > 60
        ){

            closePanel();

        }


        startY =
            null;

    },
    {
        passive:true
    }
);


/* =========================
   HATIRLATICILARI GERİ YÜKLE
========================= */

function restoreReminders(){

    const now =
        Date.now();


    const active = [];


    reminders.forEach(
        reminder => {

            const remaining =
                reminder.time -
                now;


            if(
                remaining <= 0
            ){

                addMessage(
                    "Hatırlatıcı: " +
                    reminder.text,
                    "aura"
                );

            }else{

                active.push(
                    reminder
                );


                setTimeout(
                    function(){

                        addMessage(
                            "Hatırlatıcı: " +
                            reminder.text,
                            "aura"
                        );


                        speak(
                            "Hatırlatıcı. " +
                            reminder.text
                        );


                        reminders =
                            reminders.filter(
                                item =>
                                    item.id !==
                                    reminder.id
                            );


                        saveData();

                    },
                    remaining
                );

            }

        }
    );


    reminders =
        active;

    saveData();

}


/* =========================
   BAŞLAT
========================= */

function initializeAura(){

    closePanel();

    loadVoices();

    restoreReminders();

    chat.scrollTop =
        chat.scrollHeight;

}


window.addEventListener(
    "beforeunload",
    function(){

        saveData();

    }
);


window.addEventListener(
    "error",
    function(event){

        console.error(
            "AURA sistem hatası:",
            event.error ||
            event.message
        );

    }
);


window.addEventListener(
    "unhandledrejection",
    function(event){

        console.error(
            "AURA Promise hatası:",
            event.reason
        );

    }
);


initializeAura();
