<!DOCTYPE html>
<html lang="tr">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<meta name="theme-color"
content="#02060a">

<title>AURA AI</title>

<style>

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
}

body {
    overflow: hidden;
    font-family: Arial, sans-serif;
    color: #00eaff;

    background:
        radial-gradient(
            circle at center,
            #06303d 0%,
            #02080c 50%,
            #000000 100%
        );
}

/* ÜST BAR */

.top-bar {
    height: 60px;

    display: flex;
    align-items: center;
    justify-content: space-between;

    padding: 0 18px;

    background: rgba(0,10,15,.9);

    border-bottom:
        1px solid
        rgba(0,234,255,.4);
}

.logo {
    font-size: 21px;
    font-weight: bold;
    letter-spacing: 4px;

    text-shadow:
        0 0 10px #00eaff,
        0 0 25px #00eaff;
}

.status {
    font-size: 11px;
    letter-spacing: 2px;
    color: #55ffcc;
}

.status::before {
    content: "";

    display: inline-block;

    width: 7px;
    height: 7px;

    margin-right: 7px;

    border-radius: 50%;

    background: #55ffcc;

    box-shadow:
        0 0 8px #55ffcc,
        0 0 15px #55ffcc;
}

/* ANA */

.main {
    height: calc(100vh - 60px);
    height: calc(100dvh - 60px);

    display: flex;
    flex-direction: column;
    align-items: center;

    min-height: 0;
}

/* AURA ÇEKİRDEĞİ */

.aura-core {
    width: 210px;
    height: 210px;

    margin-top: 10px;

    position: relative;

    display: flex;
    align-items: center;
    justify-content: center;

    flex-shrink: 0;
}

/* HALKALAR */

.aura-ring {
    position: absolute;

    border-radius: 50%;

    border:
        1px solid
        #00eaff;

    opacity: .7;
}

.ring1 {
    width: 135px;
    height: 135px;

    border-left-color: transparent;
    border-right-color: transparent;

    animation:
        rotate1 7s linear infinite;
}

.ring2 {
    width: 175px;
    height: 175px;

    border-top-color: transparent;
    border-bottom-color: transparent;

    animation:
        rotate2 10s linear infinite;
}

.ring3 {
    width: 210px;
    height: 210px;

    border-left-color: transparent;
    border-bottom-color: transparent;

    animation:
        rotate1 14s linear infinite;
}

/* MERKEZ */

.aura-center {
    width: 100px;
    height: 100px;

    border-radius: 50%;

    border:
        2px solid
        #00eaff;

    display: flex;
    align-items: center;
    justify-content: center;

    color: #00eaff;

    font-size: 21px;
    font-weight: bold;

    letter-spacing: 3px;

    background:
        radial-gradient(
            circle,
            #064454,
            #02090d
        );

    box-shadow:
        0 0 15px #00eaff,
        0 0 45px rgba(0,234,255,.7),
        inset 0 0 25px rgba(0,234,255,.5);

    animation:
        pulse 2.2s infinite ease-in-out;

    z-index: 5;
}

@keyframes rotate1 {

    from {
        transform: rotate(0deg);
    }

    to {
        transform: rotate(360deg);
    }
}

@keyframes rotate2 {

    from {
        transform: rotate(360deg);
    }

    to {
        transform: rotate(0deg);
    }
}

@keyframes pulse {

    0%,
    100% {
        transform: scale(1);
    }

    50% {
        transform: scale(1.06);
    }
}

/* DURUM */

.aura-status {
    margin-top: -8px;
    margin-bottom: 5px;

    font-size: 10px;
    letter-spacing: 3px;

    color: #8defff;
}

/* SOHBET */

#chat {
    width: min(92%, 600px);

    flex: 1;
    min-height: 0;

    overflow-y: auto;

    padding:
        5px 5px 10px;
}

.message {
    max-width: 85%;

    padding:
        10px 13px;

    margin-bottom: 10px;

    border-radius: 10px;

    line-height: 1.4;

    white-space: pre-wrap;

    font-size: 14px;
}

.aura {
    background:
        rgba(0,35,45,.8);

    margin-right: auto;

    border:
        1px solid
        rgba(0,234,255,.25);
}

.user {
    background:
        rgba(0,90,120,.8);

    margin-left: auto;

    color: white;
}

/* ALT PANEL */

#bottom {
    width: 100%;

    min-height: 65px;

    display: flex;
    align-items: center;

    gap: 8px;

    padding: 10px;

    background:
        rgba(0,10,15,.97);

    border-top:
        1px solid
        rgba(0,234,255,.45);

    z-index: 10;
}

#input {
    flex: 1;

    min-width: 0;

    height: 45px;

    padding: 12px;

    border-radius: 8px;

    border:
        1px solid
        rgba(0,234,255,.5);

    outline: none;

    background:
        rgba(0,25,32,.95);

    color: #00eaff;

    font-size: 14px;
}

#input::placeholder {
    color: #548995;
}

/* BUTONLAR */

button {
    height: 45px;

    border:
        1px solid
        #00eaff;

    border-radius: 8px;

    padding: 0 14px;

    background:
        rgba(0,60,75,.9);

    color: #00eaff;

    font-size: 14px;

    cursor: pointer;
}

button:active {
    transform: scale(.94);
}

button:disabled {
    opacity: .5;
}

.mic-button {
    width: 45px;

    padding: 0;

    font-size: 20px;
}

@media (max-width:500px) {

    .aura-core {
        transform: scale(.82);

        margin-top: 0;
        margin-bottom: -15px;
    }

    .logo {
        font-size: 18px;
    }

    button {
        padding: 0 11px;
    }
}

</style>

</head>

<body>

<div class="top-bar">

    <div class="logo">
        AURA
    </div>

    <div class="status"
         id="status">
        ONLINE
    </div>

</div>


<div class="main">

    <div class="aura-core">

        <div class="aura-ring ring1"></div>

        <div class="aura-ring ring2"></div>

        <div class="aura-ring ring3"></div>

        <div class="aura-center">
            AURA
        </div>

    </div>


    <div
        class="aura-status"
        id="auraStatus">

        AI READY

    </div>


    <div id="chat"></div>


    <div id="bottom">

        <input
            id="input"
            type="text"
            placeholder="AURA'ya bir şey sor..."
            autocomplete="off"
        >

        <button
            class="mic-button"
            id="micButton"
            type="button">

            🎤

        </button>

        <button
            id="sendButton"
            type="button">

            Gönder

        </button>

    </div>

</div>


<!-- PUTER AI -->

<script src="https://js.puter.com/v2/"></script>

<script>
    /* =========================
   ELEMENTLER
========================= */

const chat =
    document.getElementById("chat");

const input =
    document.getElementById("input");

const sendButton =
    document.getElementById("sendButton");

const micButton =
    document.getElementById("micButton");

const status =
    document.getElementById("status");

const auraStatus =
    document.getElementById("auraStatus");


/* =========================
   MESAJ
========================= */

function addMessage(text, type) {

    const message =
        document.createElement("div");

    message.className =
        "message " + type;

    message.textContent =
        text;

    chat.appendChild(message);

    chat.scrollTop =
        chat.scrollHeight;
}


/* =========================
   SES TEMİZLEME
========================= */

function cleanTextForSpeech(text) {

    return text

        .replace(
            /[\p{Emoji_Presentation}\p{Extended_Pictographic}]/gu,
            ""
        )

        .replace(
            /https?:\/\/\S+/gi,
            ""
        )

        .replace(
            /[.,!?;:"'“”‘’()[\]{}<>…:;\/\\|@#$%^&*_+=~`-]/g,
            " "
        )

        .replace(
            /\s+/g,
            " "
        )

        .trim();
}


/* =========================
   SES
========================= */

function speak(text) {

    if (
        !("speechSynthesis" in window)
    ) {
        return;
    }

    const clean =
        cleanTextForSpeech(text);

    if (!clean) {
        return;
    }

    const message =
        new SpeechSynthesisUtterance(clean);

    message.lang =
        "tr-TR";

    message.rate =
        0.92;

    message.pitch =
        1;

    message.volume =
        1;

    window.speechSynthesis.cancel();

    setTimeout(function() {

        window.speechSynthesis.speak(
            message
        );

    }, 100);
}


/* =========================
   AURA'NIN KONUŞMA TARZI
========================= */

const systemPrompt = {

    role: "system",

    content: `
Sen AURA adında kişisel bir yapay zekâ asistanısın.

Türkçe konuş.

Kullanıcının adı Bedirhan Kahraman.

Kullanıcıyla doğal ve samimi ama abartısız konuş.

Kullanıcıya her mesajda adıyla hitap etme.

Özellikle "Bedirhan Kahraman" ifadesini gereksiz yere tekrar etme.

Sadece gerçekten gerektiğinde "Bedirhan" de.

Kısa ve doğal cevapları tercih et.

Aynı cümleleri tekrar tekrar kullanma.

Robot gibi konuşma.

Kullanıcı günlük konuşma dili kullanıyorsa sen de doğal Türkçe kullan.

Kullanıcı soru sorduğunda doğrudan cevap ver.

Gereksiz açıklama yapma.

Bilmediğin bir bilgiyi uydurma.

Güncel bilgi gerektiğinde web aramasını kullan.

Web araması yaptığında bulduğun bilgiyi kendi doğal cümlelerinle aktar.

Kullanıcı "ben kimim" derse Bedirhan Kahraman olduğunu söyle.

Kullanıcı "sevgilimin adı ne" derse Edanur Kahraman olduğunu söyle.

Kendini AURA olarak tanıt.
`
};


/* =========================
   KONUŞMA HAFIZASI
========================= */

const conversation = [
    systemPrompt
];


/* =========================
   AI CEVABI ÇIKAR
========================= */

function extractAIText(response) {

    if (!response) {
        return "";
    }

    if (
        response.message &&
        response.message.content
    ) {

        return response.message.content;
    }

    if (
        response.text
    ) {

        return response.text;
    }

    if (
        typeof response === "string"
    ) {

        return response;
    }

    return String(response);
}


/* =========================
   WEB ARAMALI AI
========================= */

async function askAI(text) {

    conversation.push({

        role: "user",

        content: text

    });


    try {

        const response =
            await puter.ai.chat(
                conversation,
                {
                    model:
                        "openai/gpt-5.3-chat",

                    tools: [
                        {
                            type:
                                "web_search"
                        }
                    ]
                }
            );


        const answer =
            extractAIText(response);


        if (!answer) {

            throw new Error(
                "AI boş cevap döndürdü"
            );
        }


        conversation.push({

            role: "assistant",

            content: answer

        });


        return answer;


    } catch (error) {

        console.error(
            "AURA AI HATASI:",
            error
        );


        return "Şu anda bağlantıda bir sorun var. Biraz sonra tekrar deneyelim.";
    }
}


/* =========================
   YAZILI MESAJ
========================= */

async function sendMessage(
    voiceMode = false
) {

    const text =
        input.value.trim();

    if (!text) {
        return;
    }


    addMessage(
        text,
        "user"
    );


    input.value = "";


    sendButton.disabled =
        true;

    micButton.disabled =
        true;


    auraStatus.textContent =
        "THINKING";


    addMessage(
        "Düşünüyorum...",
        "aura"
    );


    const loading =
        chat.lastElementChild;


    try {

        const reply =
            await askAI(text);


        if (loading) {
            loading.remove();
        }


        addMessage(
            reply,
            "aura"
        );


        /*
          SADECE SESLİ
          KOMUTTA KONUŞ
        */

        if (voiceMode) {

            speak(reply);
        }


    } catch (error) {

        if (loading) {
            loading.remove();
        }


        addMessage(
            "Bir hata oluştu.",
            "aura"
        );
    }


    auraStatus.textContent =
        wakeMode
            ? "AURA LISTENING"
            : "AI READY";


    sendButton.disabled =
        false;

    micButton.disabled =
        false;

    input.focus();
}


/* =========================
   ENTER
========================= */

input.addEventListener(
    "keydown",
    function(event) {

        if (
            event.key === "Enter"
        ) {

            event.preventDefault();

            sendMessage(false);
        }

    }
);


/* =========================
   GÖNDER
========================= */

sendButton.addEventListener(
    "click",
    function() {

        sendMessage(false);

    }
);
   /* =========================
   SESLİ KOMUT SİSTEMİ
========================= */

const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;


let recognition = null;

let wakeMode = false;

let commandMode = false;

let recognitionRunning = false;


/* =========================
   SES TANIMA YOKSA
========================= */

if (!SpeechRecognition) {

    micButton.disabled = true;

    auraStatus.textContent =
        "VOICE NOT SUPPORTED";
}


/* =========================
   TANIMA MOTORU
========================= */

function createRecognition() {

    if (!SpeechRecognition) {
        return null;
    }


    const rec =
        new SpeechRecognition();


    rec.lang =
        "tr-TR";


    rec.continuous =
        true;


    rec.interimResults =
        false;


    rec.maxAlternatives =
        1;


    rec.onstart =
        function() {

            recognitionRunning =
                true;

            auraStatus.textContent =
                wakeMode
                    ? "AURA LISTENING"
                    : "LISTENING";

            status.textContent =
                "VOICE";
        };


    rec.onresult =
        function(event) {

            for (
                let i =
                    event.resultIndex;

                i <
                    event.results.length;

                i++
            ) {

                if (
                    !event.results[i].isFinal
                ) {
                    continue;
                }


                const spoken =
                    event.results[i][0]
                    .transcript
                    .trim();


                if (!spoken) {
                    continue;
                }


                handleVoiceText(spoken);
            }
        };


    rec.onerror =
        function(event) {

            console.log(
                "VOICE ERROR:",
                event.error
            );

            recognitionRunning =
                false;


            /*
              Sürekli dinleme sırasında
              bazı telefonlar timeout verir.
              Kapatmak yerine yeniden başlat.
            */

            if (wakeMode) {

                setTimeout(
                    startRecognition,
                    500
                );

            }
        };


    rec.onend =
        function() {

            recognitionRunning =
                false;


            if (wakeMode) {

                setTimeout(
                    startRecognition,
                    300
                );

            }

            else {

                auraStatus.textContent =
                    "AI READY";

                status.textContent =
                    "ONLINE";
            }
        };


    return rec;
}


/* =========================
   AURA KELİMESİNİ BUL
========================= */

function containsWakeWord(text) {

    const normalized =
        text
        .toLocaleLowerCase("tr-TR")
        .trim();


    return (
        normalized === "aura" ||
        normalized.startsWith("aura ") ||
        normalized.includes(" aura ")
    );
}


/* =========================
   AURA'YI ÇIKAR
========================= */

function removeWakeWord(text) {

    return text

        .replace(
            /^aura[\s,:-]*/i,
            ""
        )

        .trim();
}


/* =========================
   SESLİ KOMUTU İŞLE
========================= */

function handleVoiceText(spoken) {

    console.log(
        "DUYULAN:",
        spoken
    );


    /*
      AURA zaten uyandırıldıysa
      gelen cümleyi direkt komut kabul et
    */

    if (commandMode) {

        commandMode =
            false;


        input.value =
            spoken;


        sendMessage(true);


        return;
    }


    /*
      AURA kelimesi yoksa
      sessizce bekle
    */

    if (
        !containsWakeWord(spoken)
    ) {

        return;
    }


    const command =
        removeWakeWord(spoken);


    /*
      Sadece "AURA" denmişse
      sonraki cümleyi bekle
    */

    if (!command) {

        commandMode =
            true;


        auraStatus.textContent =
            "AURA AWAKE";


        status.textContent =
            "AWAKE";


        speak(
            "Dinliyorum"
        );


        return;
    }


    /*
      Örnek:
      "AURA bugün hava nasıl"
    */

    input.value =
        command;


    sendMessage(true);
}


/* =========================
   DİNLEMEYİ BAŞLAT
========================= */

function startRecognition() {

    if (!SpeechRecognition) {
        return;
    }


    if (!wakeMode) {
        return;
    }


    if (recognitionRunning) {
        return;
    }


    recognition =
        createRecognition();


    if (!recognition) {
        return;
    }


    try {

        recognition.start();

    } catch (error) {

        console.log(
            "Recognition start:",
            error
        );
    }
}


/* =========================
   MİKROFON BUTONU
========================= */

micButton.addEventListener(
    "click",
    function() {

        if (!SpeechRecognition) {

            addMessage(
                "Bu tarayıcı sesli komutu desteklemiyor.",
                "aura"
            );

            return;
        }


        /*
          İlk basış:
          AURA uyandırma modunu aç
        */

        if (!wakeMode) {

            wakeMode =
                true;

            commandMode =
                false;


            auraStatus.textContent =
                "AURA LISTENING";

            status.textContent =
                "VOICE";


            addMessage(
                "AURA dinleme modu açıldı. AURA diyerek beni uyandırabilirsin.",
                "aura"
            );


            startRecognition();

            return;
        }


        /*
          İkinci basış:
          Dinlemeyi kapat
        */

        wakeMode =
            false;

        commandMode =
            false;


        if (recognition) {

            try {

                recognition.stop();

            } catch (error) {}
        }


        recognitionRunning =
            false;


        auraStatus.textContent =
            "AI READY";

        status.textContent =
            "ONLINE";
    });


/* =========================
   BAŞLANGIÇ
========================= */

addMessage(
    "Merhaba. Ben AURA AI.\n\nSistem hazır. Seni dinliyorum.",
    "aura"
);
    /* =========================
   DOĞAL KONUŞMA DÜZELTMELERİ
========================= */

/*
  AI'nin gereksiz şekilde
  kullanıcı adını tekrar etmesini
  ayrıca burada da engelliyoruz.
*/

function cleanAIResponse(text) {

    if (!text) {
        return "";
    }


    let result =
        String(text).trim();


    /*
      Çok sık tekrarlanan
      "Bedirhan Kahraman" hitabını azalt.
    */

    const phrases = [

        "Bedirhan Kahraman,",

        "Bedirhan Kahraman.",

        "Bedirhan Kahraman!",

        "Bedirhan Kahraman?",

        "Bedirhan,"
    ];


    phrases.forEach(
        function(phrase) {

            result =
                result.split(phrase)
                .join("");
        }
    );


    /*
      Başta oluşan boşlukları temizle.
    */

    result =
        result.trim();


    return result;
}


/* =========================
   ORİJİNAL ASK AI'YI
   TEMİZ CEVAPLA DEĞİŞTİR
========================= */

const originalAskAI =
    askAI;


askAI = async function(text) {

    const response =
        await originalAskAI(text);


    return cleanAIResponse(
        response
    );
};


/* =========================
   WEB ARAMASI İÇİN
   ÖZEL KOMUT DESTEĞİ
========================= */

/*
  Kullanıcı özellikle
  "internette ara",
  "webde ara",
  "güncel bilgi",
  "son haberler"
  gibi şeyler söylerse AI'ye
  bunun güncel bilgi olduğunu
  özellikle belirtiyoruz.
*/

const originalAskAIWithWeb =
    askAI;


askAI = async function(text) {

    const lower =
        text
        .toLocaleLowerCase("tr-TR");


    const webWords = [

        "internette ara",

        "internetten ara",

        "webde ara",

        "web'de ara",

        "internetten bak",

        "güncel bilgi",

        "guncel bilgi",

        "son haberler",

        "bugünkü haberler",

        "bugunku haberler",

        "şu an",

        "su an",

        "en son"
    ];


    const needsWeb =
        webWords.some(
            word =>
                lower.includes(word)
        );


    let prompt =
        text;


    if (needsWeb) {

        prompt =
            `Bu soruda güncel internet bilgisi gerekiyor. Web aramasını kullan ve güncel bilgileri doğrula.

Kullanıcı sorusu:
${text}`;
    }


    const response =
        await originalAskAIWithWeb(
            prompt
        );


    return cleanAIResponse(
        response
    );
};


/* =========================
   HATA YAKALAMA
========================= */

window.addEventListener(
    "error",
    function(event) {

        console.error(
            "AURA:",
            event.error
        );

    }
);


/* =========================
   SAYFA KAPANIRKEN
========================= */

window.addEventListener(
    "beforeunload",
    function() {

        if (
            recognition &&
            recognitionRunning
        ) {

            try {

                recognition.stop();

            } catch (error) {}
        }

    }
);


/* =========================
   SON DURUM
========================= */

auraStatus.textContent =
    "AI READY";

status.textContent =
    "ONLINE";

</script>

</body>
</html>
