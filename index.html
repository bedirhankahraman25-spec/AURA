<!DOCTYPE html>
<html lang="tr">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<meta name="theme-color"
content="#02060a">

<title>AURA AI</title>

<style>

/* =========================
   TEMEL
========================= */

* {
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    height: 100%;
    margin: 0;
}

body {
    overflow: hidden;
    font-family:
        Arial,
        Helvetica,
        sans-serif;

    color: #00eaff;

    background:
        radial-gradient(
            circle at 50% 35%,
            #073b49 0%,
            #03151c 28%,
            #02080c 60%,
            #000000 100%
        );
}

/* =========================
   ARKA PLAN
========================= */

.background-glow {
    position: fixed;
    inset: 0;

    pointer-events: none;

    background:
        radial-gradient(
            circle at 50% 35%,
            rgba(0,234,255,0.10),
            transparent 30%
        );

    animation:
        backgroundPulse 5s ease-in-out infinite;
}

@keyframes backgroundPulse {

    0%,
    100% {
        opacity: 0.7;
    }

    50% {
        opacity: 1;
    }
}

/* =========================
   ÜST BAR
========================= */

.top-bar {

    position: relative;

    width: 100%;
    height: 60px;

    display: flex;
    align-items: center;
    justify-content: space-between;

    padding: 0 18px;

    background:
        rgba(0,10,15,0.88);

    border-bottom:
        1px solid
        rgba(0,234,255,0.35);

    box-shadow:
        0 5px 25px
        rgba(0,234,255,0.08);

    z-index: 20;
}

.logo {

    font-size: 21px;
    font-weight: 700;

    letter-spacing: 5px;

    color: #00eaff;

    text-shadow:
        0 0 8px #00eaff,
        0 0 20px #00eaff,
        0 0 40px
        rgba(0,234,255,0.6);
}

.status {

    display: flex;
    align-items: center;

    font-size: 10px;
    letter-spacing: 2px;

    color: #55ffcc;
}

.status-dot {

    width: 7px;
    height: 7px;

    margin-right: 7px;

    border-radius: 50%;

    background: #55ffcc;

    box-shadow:
        0 0 8px #55ffcc,
        0 0 18px #55ffcc;

    animation:
        onlinePulse 1.8s infinite;
}

@keyframes onlinePulse {

    0%,
    100% {
        opacity: 1;
        transform: scale(1);
    }

    50% {
        opacity: 0.45;
        transform: scale(0.75);
    }
}

/* =========================
   ANA ALAN
========================= */

.main {

    position: relative;

    width: 100%;
    height: calc(100vh - 60px);
    height: calc(100dvh - 60px);

    display: flex;
    flex-direction: column;
    align-items: center;

    min-height: 0;
}

/* =========================
   AURA ÇEKİRDEĞİ
========================= */

.aura-core {

    position: relative;

    width: 220px;
    height: 220px;

    margin-top: 5px;

    display: flex;
    align-items: center;
    justify-content: center;

    flex-shrink: 0;
}

.aura-ring {

    position: absolute;

    border-radius: 50%;

    border:
        1px solid
        rgba(0,234,255,0.8);

    box-shadow:
        0 0 8px
        rgba(0,234,255,0.25);

    pointer-events: none;
}

.ring1 {

    width: 125px;
    height: 125px;

    border-left-color: transparent;
    border-right-color: transparent;

    animation:
        rotateClockwise 6s linear infinite;
}

.ring2 {

    width: 165px;
    height: 165px;

    border-top-color: transparent;
    border-bottom-color: transparent;

    animation:
        rotateCounter 9s linear infinite;
}

.ring3 {

    width: 205px;
    height: 205px;

    border-left-color: transparent;
    border-bottom-color: transparent;

    animation:
        rotateClockwise 13s linear infinite;
}

.ring4 {

    width: 185px;
    height: 185px;

    border:
        1px dashed
        rgba(85,255,204,0.35);

    animation:
        rotateCounter 18s linear infinite;
}

/* =========================
   MERKEZ
========================= */

.aura-center {

    position: relative;

    width: 100px;
    height: 100px;

    display: flex;
    align-items: center;
    justify-content: center;

    border-radius: 50%;

    border:
        2px solid
        #00eaff;

    background:
        radial-gradient(
            circle,
            #07596c 0%,
            #063442 38%,
            #02090d 78%
        );

    color: #00eaff;

    font-size: 20px;
    font-weight: 700;

    letter-spacing: 3px;

    box-shadow:
        0 0 12px #00eaff,
        0 0 30px
        rgba(0,234,255,0.75),
        0 0 70px
        rgba(0,234,255,0.25),
        inset 0 0 25px
        rgba(0,234,255,0.55);

    animation:
        corePulse 2.4s
        ease-in-out infinite;

    z-index: 5;
}

.aura-center::before {

    content: "";

    position: absolute;

    inset: 8px;

    border-radius: 50%;

    border:
        1px solid
        rgba(85,255,204,0.35);

    animation:
        innerRotate 4s
        linear infinite;
}

@keyframes rotateClockwise {

    from {
        transform: rotate(0deg);
    }

    to {
        transform: rotate(360deg);
    }
}

@keyframes rotateCounter {

    from {
        transform: rotate(360deg);
    }

    to {
        transform: rotate(0deg);
    }
}

@keyframes innerRotate {

    from {
        transform: rotate(0deg);
    }

    to {
        transform: rotate(-360deg);
    }
}

@keyframes corePulse {

    0%,
    100% {
        transform: scale(1);
        box-shadow:
            0 0 12px #00eaff,
            0 0 30px
            rgba(0,234,255,0.75),
            0 0 70px
            rgba(0,234,255,0.25),
            inset 0 0 25px
            rgba(0,234,255,0.55);
    }

    50% {
        transform: scale(1.055);
        box-shadow:
            0 0 18px #00eaff,
            0 0 45px
            rgba(0,234,255,0.9),
            0 0 90px
            rgba(0,234,255,0.35),
            inset 0 0 35px
            rgba(0,234,255,0.7);
    }
}

/* =========================
   DURUM
========================= */

.aura-status {

    margin-top: -8px;
    margin-bottom: 4px;

    font-size: 9px;

    letter-spacing: 3px;

    color: #8defff;

    text-shadow:
        0 0 8px
        rgba(0,234,255,0.5);

    text-transform: uppercase;
}/* =========================
   SOHBET ALANI
========================= */

#chat {

    width: min(94%, 620px);

    flex: 1;

    min-height: 0;

    overflow-y: auto;

    padding:
        5px 5px 12px;

    scroll-behavior: smooth;

    scrollbar-width: thin;

    scrollbar-color:
        rgba(0,234,255,0.55)
        transparent;
}

/* =========================
   SCROLLBAR
========================= */

#chat::-webkit-scrollbar {

    width: 4px;
}

#chat::-webkit-scrollbar-track {

    background:
        transparent;
}

#chat::-webkit-scrollbar-thumb {

    border-radius: 10px;

    background:
        rgba(0,234,255,0.55);

    box-shadow:
        0 0 8px
        rgba(0,234,255,0.35);
}

/* =========================
   MESAJ
========================= */

.message {

    position: relative;

    max-width: 86%;

    padding:
        11px 14px;

    margin-bottom: 10px;

    border-radius: 13px;

    font-size: 14px;

    line-height: 1.45;

    white-space: pre-wrap;

    word-break: break-word;

    animation:
        messageAppear
        0.25s ease-out;
}

@keyframes messageAppear {

    from {
        opacity: 0;
        transform:
            translateY(8px)
            scale(0.98);
    }

    to {
        opacity: 1;
        transform:
            translateY(0)
            scale(1);
    }
}

/* =========================
   AURA MESAJI
========================= */

.message.aura {

    margin-right: auto;

    color: #c9/* =========================
   ALT PANEL
========================= */

#bottom {

    width: 100%;

    min-height: 68px;

    padding:
        10px 12px;

    display: flex;

    align-items: center;

    gap: 8px;

    background:
        linear-gradient(
            180deg,
            rgba(0,12,18,0.94),
            rgba(0,5,9,0.99)
        );

    border-top:
        1px solid
        rgba(0,234,255,0.35);

    box-shadow:
        0 -10px 35px
        rgba(0,234,255,0.06);

    z-index: 30;
}

/* =========================
   MESAJ GİRİŞİ
========================= */

#input {

    flex: 1;

    min-width: 0;

    height: 46px;

    padding:
        0 14px;

    border-radius: 12px;

    border:
        1px solid
        rgba(0,234,255,0.35);

    outline: none;

    background:
        linear-gradient(
            135deg,
            rgba(0,32,42,0.95),
            rgba(0,15,21,0.98)
        );

    color: #dffcff;

    font-size: 14px;

    box-shadow:
        inset 0 0 15px
        rgba(0,234,255,0.04);

    transition:
        border-color 0.2s,
        box-shadow 0.2s,
        background 0.2s;
}

#input:focus {

    border-color:
        rgba(0,234,255,0.8);

    background:
        rgba(0,30,40,0.98);

    box-shadow:
        0 0 12px
        rgba(0,234,255,0.12),
        inset 0 0 15px
        rgba(0,234,255,0.06);
}

#input::placeholder {

    color:
        rgba(130,190,202,0.55);
}

/* =========================
   GENEL BUTON
========================= */

button {

    height: 46px;

    border-radius: 12px;

    border:
        1px solid
        rgba(0,234,255,0.55);

    background:
        linear-gradient(
            135deg,
            rgba(0,70,88,0.95),
            rgba(0,35,48,0.98)
        );

    color: #00eaff;

    font-size: 13px;

    font-weight: 600;

    cursor: pointer;

    box-shadow:
        0 0 10px
        rgba(0,234,255,0.08);

    transition:
        transform 0.12s,
        background 0.2s,
        box-shadow 0.2s,
        border-color 0.2s;
}

button:hover {

    border-color:
        #00eaff;

    background:
        linear-gradient(
            135deg,
            rgba(0,90,110,0.98),
            rgba(0,45,60,1)
        );

    box-shadow:
        0 0 15px
        rgba(0,234,255,0.2);
}

button:active {

    transform:
        scale(0.94);
}

button:disabled {

    opacity: 0.45;

    cursor: not-allowed;
}

/* =========================
   MİKROFON
========================= */

.mic-button {

    flex-shrink: 0;

    width: 46px;

    padding: 0;

    display: flex;

    align-items: center;
    justify-content: center;

    font-size: 19px;

    border-radius: 12px;
}

/* Mikrofon aktif */

.mic-button.listening {

    color: #55ffcc;

    border-color:
        #55ffcc;

    background:
        rgba(0,70,62,0.8);

    box-shadow:
        0 0 12px
        rgba(85,255,204,0.3);

    animation:
        micPulse 1s
        ease-in-out infinite;
}

@keyframes micPulse {

    0%,
    100% {
        transform: scale(1);
    }

    50% {
        transform: scale(1.07);
    }
}

/* =========================
   GÖNDER
========================= */

#sendButton {

    flex-shrink: 0;

    min-width: 72px;

    padding:
        0 13px;

    color: #001015;

    background:
        linear-gradient(
            135deg,
            #00eaff,
            #55ffcc
        );

    border:
        1px solid
        #00eaff;

    box-shadow:
        0 0 12px
        rgba(0,234,255,0.22);
}

#sendButton:hover {

    background:
        linear-gradient(
            135deg,
            #55ffcc,
            #00eaff
        );

    box-shadow:
        0 0 20px
        rgba(0,234,255,0.35);
}

/* =========================
   MOBİL ALT PANEL
========================= */

@media (max-width: 500px) {

    #bottom {

        min-height: 64px;

        padding:
            8px;

        gap: 6px;
    }

    #input {

        height: 44px;

        font-size: 13px;

        padding:
            0 11px;
    }

    button {

        height: 44px;
    }

    .mic-button {

        width: 44px;

        font-size: 18px;
    }

    #sendButton {

        min-width: 64px;

        padding:
            0 10px;

        font-size: 12px;
    }
             }</style>

</head>

<body>

<!-- =========================
     ARKA PLAN
========================= -->

<div class="background-glow"></div>


<!-- =========================
     ÜST BAR
========================= -->

<div class="top-bar">

    <div class="logo">
        AURA
    </div>

    <div class="status">

        <span class="status-dot"></span>

        ONLINE

    </div>

</div>


<!-- =========================
     ANA ALAN
========================= -->

<div class="main">


    <!-- =====================
         AURA ÇEKİRDEĞİ
    ====================== -->

    <div class="aura-core">

        <div class="aura-ring ring1"></div>

        <div class="aura-ring ring2"></div>

        <div class="aura-ring ring3"></div>

        <div class="aura-ring ring4"></div>


        <div class="aura-center">

            AURA

        </div>

    </div>


    <!-- =====================
         SİSTEM DURUMU
    ====================== -->

    <div
        class="aura-status"
        id="auraStatus">

        AI SYSTEM READY

    </div>


    <!-- =====================
         SOHBET
    ====================== -->

    <div id="chat"></div>


    <!-- =====================
         ALT PANEL
    ====================== -->

    <div id="bottom">

        <input
            id="input"
            type="text"
            placeholder="AURA'ya bir şey sor..."
            autocomplete="off"
        >


        <button
            class="mic-button"
            id="micButton"
            type="button"
            title="Sesli konuş">

            🎤

        </button>


        <button
            id="sendButton"
            type="button">

            Gönder

        </button>

    </div>

</div>


<!-- =========================
     PUTER AI
========================= -->

<script src="https://js.puter.com/v2/"></script>

<script>/* =========================
   ELEMENTLER
========================= */

const chat =
    document.getElementById("chat");

const input =
    document.getElementById("input");

const sendButton =
    document.getElementById("sendButton");

const micButton =
    document.getElementById("micButton");

const auraStatus =
    document.getElementById("auraStatus");


/* =========================
   AURA KİMLİĞİ
========================= */

const systemPrompt = `

Sen AURA adında kişisel yapay zeka asistanısın.

Türkçe konuş.

Kullanıcının adı Bedirhan Kahraman.

Kullanıcıya her mesajda Bedirhan diye hitap etme.

Sadece gerekli olduğunda veya kullanıcı
kim olduğunu sorduğunda adını kullan.

Kullanıcının sevgilisi Edanur Kahraman'dır.

Edanur AURA'nın sevgilisi değildir.
Edanur, Bedirhan'ın sevgilisidir.

Doğal ve akıcı konuş.

Gereksiz tekrar yapma.

Bilmediğin bilgileri uydurma.

Kullanıcı "sen kimsin" veya
"adın ne" diye sorarsa AURA olduğunu söyle.

Kullanıcı "ben kimim" diye sorarsa
Bedirhan Kahraman olduğunu söyle.

Kullanıcı Edanur hakkında sorarsa
Edanur Kahraman'ın Bedirhan'ın sevgilisi
olduğunu bil.

Sen AURA'sın.

`;


/* =========================
   KONUŞMA HAFIZASI
========================= */

const conversation = [

    {
        role: "system",
        content: systemPrompt
    }

];


/* =========================
   MESAJ EKLE
========================= */

function addMessage(
    text,
    type
) {

    const message =
        document.createElement("div");

    message.className =
        "message " + type;

    message.textContent =
        text;

    chat.appendChild(
        message
    );

    chat.scrollTop =
        chat.scrollHeight;

    return message;
}


/* =========================
   DURUM
========================= */

function setAuraStatus(
    text,
    thinking
) {

    if (auraStatus) {

        auraStatus.textContent =
            text;
    }

    if (thinking) {

        document.body.classList.add(
            "aura-thinking"
        );

    } else {

        document.body.classList.remove(
            "aura-thinking"
        );
    }
}


/* =========================
   AI CEVAP ÇIKARMA
========================= */

function extractAIText(
    response
) {

    if (!response) {

        return "";
    }


    if (
        typeof response ===
        "string"
    ) {

        return response.trim();
    }


    if (
        response.message &&
        typeof response.message.content ===
        "string"
    ) {

        return response.message.content.trim();
    }


    if (
        response.message &&
        Array.isArray(
            response.message.content
        )
    ) {

        return response.message.content

            .map(function(part) {

                if (
                    typeof part ===
                    "string"
                ) {

                    return part;
                }

                return part &&
                    part.text
                    ? part.text
                    : "";
            })

            .join("")
            .trim();
    }


    if (
        typeof response.text ===
        "string"
    ) {

        return response.text.trim();
    }


    return "";
}


/* =========================
   AI ÇAĞRISI
========================= */

async function askAI(
    text
) {

    conversation.push({

        role: "user",

        content: text

    });


    if (
        typeof puter ===
        "undefined"
    ) {

        throw new Error(
            "Puter AI yüklenemedi."
        );
    }


    const response =
        await puter.ai.chat(

            conversation,

            {
                model:
                    "gpt-5.4-nano"
            }

        );


    const answer =
        extractAIText(
            response
        );


    if (!answer) {

        throw new Error(
            "AI boş cevap döndürdü."
        );
    }


    conversation.push({

        role: "assistant",

        content: answer

    });


    return answer;
}


/* =========================
   MESAJ GÖNDER
========================= */

async function sendMessage(
    voiceMode = false
) {

    const text =
        input.value.trim();


    if (!text) {

        return;
    }


    input.value = "";


    addMessage(
        text,
        "user"
    );


    const loading =
        addMessage(
            "Düşünüyorum...",
            "aura"
        );


    setAuraStatus(
        "THINKING...",
        true
    );


    sendButton.disabled =
        true;

    micButton.disabled =
        true;


    try {

        const reply =
            await askAI(
                text
            );


        if (loading) {

            loading.remove();
        }


        addMessage(
            reply,
            "aura"
        );


        setAuraStatus(
            "AI SYSTEM READY",
            false
        );


        if (
            voiceMode &&
            typeof speak ===
            "function"
        ) {

            speak(reply);
        }

    }

    catch (error) {

        console.error(
            "AURA AI HATASI:",
            error
        );


        if (loading) {

            loading.remove();
        }


        addMessage(
            "AI bağlantısında bir sorun oluştu. Lütfen tekrar deneyin.",
            "aura"
        );


        setAuraStatus(
            "CONNECTION ERROR",
            false
        );
    }


    sendButton.disabled =
        false;

    micButton.disabled =
        false;

    input.focus();
}


/* =========================
   GÖNDER BUTONU
========================= */

sendButton.addEventListener(
    "click",
    function() {

        sendMessage(false);

    }
);


/* =========================
   ENTER
========================= */

input.addEventListener(
    "keydown",
    function(event) {

        if (
            event.key ===
            "Enter"
        ) {

            event.preventDefault();

            sendMessage(false);
        }

    }
);


/* =========================
   BAŞLANGIÇ MESAJI
========================= */

addMessage(
    "Merhaba. Ben AURA AI.\n\nSistem hazır. Seni dinliyorum.",
    "aura"
);/* =========================
   SES TEMİZLEME
========================= */

function cleanTextForSpeech(text) {

    if (!text) {
        return "";
    }

    return text

        .replace(
            /https?:\/\/\S+/gi,
            " "
        )

        .replace(
            /[\p{Emoji_Presentation}\p{Extended_Pictographic}]/gu,
            " "
        )

        .replace(
            /[.,!?;:"'“”‘’()[\]{}<>…\/\\|@#$%^&*_+=~`-]/g,
            " "
        )

        .replace(
            /\s+/g,
            " "
        )

        .trim();
}


/* =========================
   SESLİ CEVAP
========================= */

function speak(text) {

    if (
        !("speechSynthesis" in window)
    ) {

        return;
    }


    const clean =
        cleanTextForSpeech(
            text
        );


    if (!clean) {
        return;
    }


    window.speechSynthesis.cancel();


    const utterance =
        new SpeechSynthesisUtterance(
            clean
        );


    utterance.lang =
        "tr-TR";

    utterance.rate =
        0.9;

    utterance.pitch =
        1;

    utterance.volume =
        1;


    utterance.onstart =
        function() {

            setAuraStatus(
                "SPEAKING...",
                true
            );
        };


    utterance.onend =
        function() {

            setAuraStatus(
                "AI SYSTEM READY",
                false
            );
        };


    utterance.onerror =
        function() {

            setAuraStatus(
                "AI SYSTEM READY",
                false
            );
        };


    window.speechSynthesis.speak(
        utterance
    );
}


/* =========================
   SES TANIMA
========================= */

const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;


let recognition =
    null;

let isListening =
    false;


if (SpeechRecognition) {

    recognition =
        new SpeechRecognition();


    recognition.lang =
        "tr-TR";

    recognition.continuous =
        false;

    recognition.interimResults =
        false;

    recognition.maxAlternatives =
        1;


    recognition.onstart =
        function() {

            isListening =
                true;


            micButton.textContent =
                "🔴";


            micButton.classList.add(
                "listening"
            );


            setAuraStatus(
                "LISTENING...",
                true
            );
        };


    recognition.onresult =
        async function(event) {

            const result =
                event
                .results[0][0]
                .transcript
                .trim();


            if (!result) {

                return;
            }


            input.value =
                result;


            input.value = "";


            await sendMessage(
                true
            );
        };


    recognition.onerror =
        function(event) {

            console.error(
                "SES TANIMA HATASI:",
                event
            );


            isListening =
                false;


            micButton.textContent =
                "🎤";


            micButton.classList.remove(
                "listening"
            );


            setAuraStatus(
                "AI SYSTEM READY",
                false
            );
        };


    recognition.onend =
        function() {

            isListening =
                false;


            micButton.textContent =
                "🎤";


            micButton.classList.remove(
                "listening"
            );


            if (
                !document.body.classList.contains(
                    "aura-thinking"
                )
            ) {

                setAuraStatus(
                    "AI SYSTEM READY",
                    false
                );
            }
        };

}


/* =========================
   MİKROFON BUTONU
========================= */

micButton.addEventListener(
    "click",
    function() {

        if (!recognition) {

            addMessage(
                "Bu tarayıcı sesli komut özelliğini desteklemiyor.",
                "aura"
            );

            return;
        }


        if (isListening) {

            recognition.stop();

            return;
        }


        try {

            recognition.start();

        }

        catch (error) {

            console.error(
                "MİKROFON BAŞLATMA HATASI:",
                error
            );
        }

    }
);


/* =========================
   SAYFA AÇILDIĞINDA
========================= */

window.addEventListener(
    "load",
    function() {

        input.focus();

        setAuraStatus(
            "AI SYSTEM READY",
            false
        );

    }
);


/* =========================
   GÜVENLİK
========================= */

window.addEventListener(
    "error",
    function(event) {

        console.error(
            "AURA GENEL HATA:",
            event.error
        );

    }
);


/* =========================
   DOSYA SONU
========================= */

</script>
