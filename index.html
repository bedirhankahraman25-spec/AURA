<style>

/* ========================================
   GENEL AYARLAR
======================================== */

* {
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    height: 100%;

    margin: 0;
    padding: 0;
}

body {

    overflow: hidden;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    color: #dffcff;

    background:

        radial-gradient(
            circle at 50% 35%,
            rgba(0, 105, 145, 0.22),
            transparent 35%
        ),

        radial-gradient(
            circle at 50% 80%,
            rgba(0, 55, 90, 0.18),
            transparent 40%
        ),

        linear-gradient(
            160deg,
            #010408 0%,
            #020b12 45%,
            #000000 100%
        );

}


/* ========================================
   ARKA PLAN IŞIK EFEKTİ
======================================== */

body::before {

    content: "";

    position: fixed;

    top: 0;
    left: 0;

    width: 100%;
    height: 100%;

    pointer-events: none;

    background:

        radial-gradient(
            circle at center,
            transparent 20%,
            rgba(0, 234, 255, 0.025) 55%,
            transparent 75%
        );

    animation:
        backgroundPulse
        8s
        ease-in-out
        infinite;

}


@keyframes backgroundPulse {

    0%,
    100% {

        opacity: 0.5;

    }

    50% {

        opacity: 1;

    }

}


/* ========================================
   ANA UYGULAMA
======================================== */

#app {

    width: 100%;
    height: 100vh;
    height: 100dvh;

    position: relative;

    overflow: hidden;

    display: flex;
    flex-direction: column;

}


/* ========================================
   ÜST BAR
======================================== */

#topBar {

    width: 100%;
    height: 54px;

    flex-shrink: 0;

    display: flex;

    align-items: center;
    justify-content: space-between;

    padding:
        0
        18px;

    border-bottom:

        1px solid
        rgba(0, 234, 255, 0.16);

    background:

        linear-gradient(
            90deg,
            rgba(0, 10, 18, 0.94),
            rgba(0, 25, 38, 0.72),
            rgba(0, 10, 18, 0.94)
        );

    backdrop-filter:
        blur(12px);

    z-index: 100;

}


/* ========================================
   LOGO
======================================== */

#auraLogo {

    color: #00eaff;

    font-size: 19px;

    font-weight: 700;

    letter-spacing: 6px;

    text-shadow:

        0 0 8px
        rgba(0, 234, 255, 0.9),

        0 0 22px
        rgba(0, 234, 255, 0.45);

}


#systemText {

    font-size: 9px;

    letter-spacing: 2px;

    color:
        rgba(170, 240, 255, 0.6);

    text-transform: uppercase;

}


/* ========================================
   ANA SAHNE
======================================== */

#mainStage {

    position: relative;

    width: 100%;

    flex: 1;

    min-height: 0;

    overflow: hidden;

}


/* ========================================
   ÇEKİRDEK ALANI
======================================== */

#coreArea {

    position: absolute;

    top: 50%;
    left: 50%;

    width: 280px;
    height: 280px;

    transform:
        translate(
            -50%,
            -50%
        );

    display: flex;

    align-items: center;
    justify-content: center;

    transition:

        top 0.6s ease,
        transform 0.6s ease,
        width 0.6s ease,
        height 0.6s ease;

    z-index: 5;

}


/* ========================================
   SOHBET AÇILDIĞINDA ÇEKİRDEK
======================================== */

#coreArea.chat-open {

    top: 19%;

    width: 205px;
    height: 205px;

}


/* ========================================
   AURA ÇEKİRDEĞİ
======================================== */

#auraCore {

    position: relative;

    width: 120px;
    height: 120px;

    border-radius: 50%;

    display: flex;

    align-items: center;
    justify-content: center;

    cursor: pointer;

    user-select: none;

    background:

        radial-gradient(
            circle at 35% 30%,

            #0a718d 0%,

            #064152 32%,

            #031c25 65%,

            #01090d 100%
        );

    border:

        2px solid
        rgba(0, 234, 255, 0.9);

    box-shadow:

        0 0 15px
        rgba(0, 234, 255, 0.8),

        0 0 40px
        rgba(0, 234, 255, 0.45),

        0 0 80px
        rgba(0, 150, 255, 0.18),

        inset
        0 0 30px
        rgba(0, 234, 255, 0.22);

    animation:

        coreBreathing
        3.2s
        ease-in-out
        infinite;

    z-index: 10;

}


#auraCore:active {

    transform:
        scale(0.94);

}


/* ========================================
   ÇEKİRDEK YAZISI
======================================== */

#auraCoreText {

    color: #d9fcff;

    font-size: 22px;

    font-weight: 700;

    letter-spacing: 5px;

    margin-left: 5px;

    text-shadow:

        0 0 8px
        #00eaff,

        0 0 22px
        rgba(0, 234, 255, 0.7);

}


/* ========================================
   ÇEKİRDEK ANİMASYONU
======================================== */

@keyframes coreBreathing {

    0%,
    100% {

        box-shadow:

            0 0 15px
            rgba(0, 234, 255, 0.7),

            0 0 40px
            rgba(0, 234, 255, 0.35),

            0 0 80px
            rgba(0, 150, 255, 0.12),

            inset
            0 0 30px
            rgba(0, 234, 255, 0.2);

    }

    50% {

        box-shadow:

            0 0 22px
            rgba(0, 234, 255, 1),

            0 0 60px
            rgba(0, 234, 255, 0.55),

            0 0 110px
            rgba(0, 150, 255, 0.25),

            inset
            0 0 38px
            rgba(0, 234, 255, 0.3);

    }

}


/* ========================================
   ÇEKİRDEK HALKALARI
======================================== */

.coreRing {

    position: absolute;

    border-radius: 50%;

    pointer-events: none;

}


#ringOne {

    width: 165px;
    height: 165px;

    border:

        1px solid
        rgba(0, 234, 255, 0.55);

    border-left-color:
        transparent;

    border-right-color:
        transparent;

    animation:

        rotateClockwise
        9s
        linear
        infinite;

}


#ringTwo {

    width: 205px;
    height: 205px;

    border:

        1px solid
        rgba(0, 170, 255, 0.35);

    border-top-color:
        transparent;

    border-bottom-color:
        transparent;

    animation:

        rotateCounter
        15s
        linear
        infinite;

}


#ringThree {

    width: 250px;
    height: 250px;

    border:

        1px solid
        rgba(0, 234, 255, 0.14);

    border-left-color:
        transparent;

    animation:

        rotateClockwise
        22s
        linear
        infinite;

}


@keyframes rotateClockwise {

    from {

        transform:
            rotate(0deg);

    }

    to {

        transform:
            rotate(360deg);

    }

}


@keyframes rotateCounter {

    from {

        transform:
            rotate(360deg);

    }

    to {

        transform:
            rotate(0deg);

    }

}


/* ========================================
   KARŞILAMA YAZISI
======================================== */

#welcomeText {

    position: absolute;

    top: calc(50% + 165px);

    left: 50%;

    width: 100%;

    transform:
        translateX(-50%);

    text-align: center;

    color:
        rgba(165, 235, 255, 0.85);

    font-size: 13px;

    letter-spacing: 1px;

    transition:

        opacity 0.4s ease,
        transform 0.4s ease;

    z-index: 4;

}


#welcomeText.hidden {

    opacity: 0;

    transform:
        translateX(-50%)
        translateY(-10px);

    pointer-events: none;

}


/* ========================================
   MOBİL DÜZEN
======================================== */

@media
(max-width: 500px) {

    #coreArea {

        width: 250px;
        height: 250px;

    }

    #coreArea.chat-open {

        width: 190px;
        height: 190px;

        top: 18%;

    }

    #auraCore {

        width: 112px;
        height: 112px;

    }

    #ringOne {

        width: 155px;
        height: 155px;

    }

    #ringTwo {

        width: 195px;
        height: 195px;

    }

    #ringThree {

        width: 235px;
        height: 235px;

    }

}

</style>

<script>
     /* ========================================
   ELEMENTLER
======================================== */

const auraCore =
    document.getElementById("auraCore");

const coreArea =
    document.getElementById("coreArea");

const chatPanel =
    document.getElementById("chatPanel");

const closeChatButton =
    document.getElementById("closeChatButton");

const chatMessages =
    document.getElementById("chatMessages");

const messageInput =
    document.getElementById("messageInput");

const sendButton =
    document.getElementById("sendButton");

const micButton =
    document.getElementById("micButton");

const attachButton =
    document.getElementById("attachButton");

const fileInput =
    document.getElementById("fileInput");

const filePreview =
    document.getElementById("filePreview");

const dragHandle =
    document.getElementById("dragHandle");

const welcomeText =
    document.getElementById("welcomeText");

const modalOverlay =
    document.getElementById("modalOverlay");

const modalContent =
    document.getElementById("modalContent");

const modalConfirm =
    document.getElementById("modalConfirm");

const modalCancel =
    document.getElementById("modalCancel");


/* ========================================
   UYGULAMA DURUMU
======================================== */

let chatOpen = false;

let selectedFile = null;

let voiceMode = false;

let recognition = null;

let isListening = false;

let typingMessage = null;


/* ========================================
   ÇEKİRDEK VE SOHBET
======================================== */

function openChat() {

    chatOpen = true;

    chatPanel.classList.add("open");

    coreArea.classList.add("chat-open");

    welcomeText.classList.add("hidden");

    setTimeout(
        function() {

            messageInput.focus();

        },
        500
    );

}


function closeChat() {

    chatOpen = false;

    chatPanel.classList.remove("open");

    coreArea.classList.remove("chat-open");

    welcomeText.classList.remove("hidden");

}


auraCore.addEventListener(
    "click",
    function() {

        if (chatOpen) {

            closeChat();

        } else {

            openChat();

        }

    }
);


closeChatButton.addEventListener(
    "click",
    closeChat
);


/* ========================================
   MESAJ KAYDIRMA
======================================== */

function scrollChatToBottom() {

    setTimeout(
        function() {

            chatMessages.scrollTop =

     /* ========================================
   KALICI HAFIZA
======================================== */

const MEMORY_KEY =
    "AURA_MAIN_MEMORY_V1";


function createEmptyMemory() {

    return {

        facts: [],

        preferences: [],

        notes: [],

        tasks: [],

        reminders: [],

        diary: [],

        goals: []

    };

}


function loadMemory() {

    try {

        const saved =
            localStorage.getItem(
                MEMORY_KEY
            );

        if (!saved) {

            return createEmptyMemory();

        }


        const data =
            JSON.parse(saved);


        return {

            facts:
                Array.isArray(data.facts)
                    ? data.facts
                    : [],

            preferences:
                Array.isArray(data.preferences)
                    ? data.preferences
                    : [],

            notes:
                Array.isArray(data.notes)
                    ? data.notes
                    : [],

            tasks:
                Array.isArray(data.tasks)
                    ? data.tasks
                    : [],

            reminders:
                Array.isArray(data.reminders)
                    ? data.reminders
                    : [],

            diary:
                Array.isArray(data.diary)
                    ? data.diary
                    : [],

            goals:
                Array.isArray(data.goals)
                    ? data.goals
                    : []

        };

    }

    catch (error) {

        console.error(
            "Hafıza yüklenemedi:",
            error
        );

        return createEmptyMemory();

    }

}


let auraMemory =
    loadMemory();


function saveMemory() {

    try {

        localStorage.setItem(
            MEMORY_KEY,
            JSON.stringify(auraMemory)
        );

    }

    catch (error) {

        console.error(
            "Hafıza kaydedilemedi:",
            error
        );

    }

}


function createMemoryItem(text) {

    return {

        id:
            Date.now() +
            Math.random(),

        text:
            text,

        createdAt:
            new Date().toISOString()

    };

}


function addMemory(
    type,
    text
) {

    if (
        !auraMemory[type]
    ) {

        return false;

    }


    auraMemory[type].push(
        createMemoryItem(text)
    );

    saveMemory();

    return true;

     }
     /* ========================================
   HAFIZA METNİ
======================================== */

function buildMemoryText() {

    let result = "";


    if (
        auraMemory.facts.length
    ) {

        result +=
            "Kayıtlı bilgiler:\n";

        auraMemory.facts.forEach(
            item => {

                result +=
                    "- " +
                    item.text +
                    "\n";

            }
        );

    }


    if (
        auraMemory.preferences.length
    ) {

        result +=
            "\nKullanıcı tercihleri:\n";

        auraMemory.preferences.forEach(
            item => {

                result +=
                    "- " +
                    item.text +
                    "\n";

            }
        );

    }


    if (
        auraMemory.notes.length
    ) {

        result +=
            "\nNotlar:\n";

        auraMemory.notes.forEach(
            item => {

                result +=
                    "- " +
                    item.text +
                    "\n";

            }
        );

    }


    if (!result.trim()) {

        return
            "Henüz kayıtlı kişisel bilgi bulunmuyor.";

    }


    return result.trim();

}


/* ========================================
   HAFIZA KOMUTLARI
======================================== */

function normalizeText(text) {

    return text
        .toLocaleLowerCase("tr-TR")
        .trim();

}


function handleMemoryCommand(text) {

    const command =
        normalizeText(text);


    const patterns = [

        {
            type: "notes",

            commands: [
                "not al ",
                "not kaydet ",
                "bunu not al ",
                "bunu kaydet "
            ],

            response:
                "Not hafızaya kaydedildi."
        },

        {
            type: "facts",

            commands: [
                "bunu hatırla ",
                "bunu hatirla ",
                "hafızana kaydet ",
                "hafizana kaydet ",
                "bunu unutma "
            ],

            response:
                "Bilgi hafızaya kaydedildi."
        },

        {
            type: "preferences",

            commands: [
                "tercihimi hatırla ",
                "tercihimi hatirla "
            ],

            response:
                "Tercih hafızaya kaydedildi."
        }

    ];


    for (
        const group of patterns
    ) {

        for (
            const pattern of group.commands
        ) {

            if (
                command.startsWith(pattern)
            ) {

                const value =
                    text
                    .substring(
                        pattern.length
                    )
                    .trim();


                if (!value) {

                    return {

                        handled: true,

                        response:
                            "Kaydedilecek bilgiyi belirt."

                    };

                }


                addMemory(
                    group.type,
                    value
                );


                return {

                    handled: true,

                    response:
                        group.response

                };

            }

        }

    }


    if (

        command ===
        "hafızamda ne var"

        ||

        command ===
        "hafizamda ne var"

        ||

        command ===
        "neyi hatırlıyorsun"

        ||

        command ===
        "neyi hatirliyorsun"

    ) {

        return {

            handled: true,

            response:
                buildMemoryText()

        };

    }


    return {

        handled: false

    };

     }
     /* ========================================
   GÖREV SİSTEMİ
======================================== */

function addTask(text) {

    auraMemory.tasks.push({

        id:
            Date.now() +
            Math.random(),

        text:
            text,

        completed:
            false,

        createdAt:
            new Date().toISOString()

    });

    saveMemory();

}


function listTasks() {

    if (
        auraMemory.tasks.length === 0
    ) {

        return
            "Henüz kayıtlı görevin bulunmuyor.";

    }


    return auraMemory.tasks
        .map(
            function(task, index) {

                return (
                    (index + 1) +
                    ". " +
                    (task.completed
                        ? "✓ "
                        : "○ ") +
                    task.text
                );

            }
        )
        .join("\n");

}


function completeTask(number) {

    const index =
        Number(number) - 1;


    if (

        Number.isNaN(index)

        ||

        !auraMemory.tasks[index]

    ) {

        return false;

    }


    auraMemory.tasks[index].completed =
        true;

    saveMemory();

    return true;

}


/* ========================================
   HEDEF SİSTEMİ
======================================== */

function addGoal(text) {

    auraMemory.goals.push({

        id:
            Date.now() +
            Math.random(),

        text:
            text,

        progress:
            0,

        createdAt:
            new Date().toISOString()

    });

    saveMemory();

}


function listGoals() {

    if (
        auraMemory.goals.length === 0
    ) {

        return
            "Henüz kayıtlı hedef bulunmuyor.";

    }


    return auraMemory.goals
        .map(
            function(goal, index) {

                return (
                    (index + 1) +
                    ". " +
                    goal.text +
                    " — %" +
                    goal.progress
                );

            }
        )
        .join("\n");

}


/* ========================================
   GÜNLÜK SİSTEMİ
======================================== */

function addDiary(text) {

    auraMemory.diary.push({

        id:
            Date.now() +

        text:
            text,

        date:
            new Date()
            .toLocaleDateString("tr-TR")

     }
     /* ========================================
   HATIRLATICI SİSTEMİ
======================================== */

function addReminder(
    text,
    date
) {

    auraMemory.reminders.push({

        id:

        text:

        date:

    });

}


function checkReminders() {

    const now =
        new Date().getTime();


    auraMemory.reminders.forEach(
        function(reminder) {

            const reminderTime =
                new Date(
                    reminder.date
                ).getTime();


            if (

                !reminder.notified

                &&

                reminderTime <= now

            ) {

                reminder.notified =
                    true;

                saveMemory();

                showNotification(
                    "Hatırlatıcı",
                    reminder.text
                );

            }

        }
    );

}

function showNotification(

    if (

    ) {

        if (

        ) {

        else if (

        ) {

        }

        "aura"
    );

}


/* ========================================
   BASİT KOMUT İŞLEYİCİ
======================================== */

function handleLocalCommands(text) {

    const command =
        normalizeText(text);


    if (
        command.startsWith("görev ekle ")
        ||
        command.startsWith("gorev ekle ")
    ) {

        const value =
            text
            .replace(
                /^görev ekle /i,
                ""
            )
            .replace(
                /^gorev ekle /i,
                ""
            )
            .trim();


        if (value) {

            addTask(value);

            return
                "Görev listene eklendi: " +
                value;

        }

    }


    if (

        command ===
        "görevlerim"

        ||

        command ===
        "gorevlerim"

    ) {

        return listTasks();

    }


    if (
        command.startsWith("hedef ekle ")
    ) {

        const value =
            text
            .substring(
                "hedef ekle ".length
            )
            .trim();


        if (value) {

            addGoal(value);

            return
                "Yeni hedef kaydedildi.";

        }

    }


    if (
        command ===
        "hedeflerim"
    ) {

        return listGoals();

    }


    if (
        command.startsWith("günlüğe yaz ")
        ||
        command.startsWith("gunluge yaz ")
    ) {

        const value =
            text
            .replace(
                /^günlüğe yaz /i,
                ""
            )
            .replace(
                /^gunluge yaz /i,
                ""
            )
            .trim();


        if (value) {

            addDiary(value);

            return
                "Günlüğüne kaydedildi.";

        }

    }


    return null;

}
     /* ========================================
   GÜVENLİ ONAY SİSTEMİ
======================================== */

function requestConfirmation(message) {

    return new Promise(
        function(resolve) {

            modalContent.textContent =
                message;

            modalOverlay.classList.add(
                "active"
            );


            function cleanup() {

                modalOverlay.classList.remove(
                    "active"
                );

                modalConfirm.onclick =
                    null;

                modalCancel.onclick =
                    null;

            }


            modalConfirm.onclick =
                function() {

                    cleanup();

                    resolve(true);

                };


            modalCancel.onclick =
                function() {

                    cleanup();

                    resolve(false);

                };

        }
    );

}


/* ========================================
   TEHLİKELİ KOMUTLAR
======================================== */

async function handleDangerousCommand(text) {

    const command =
        normalizeText(text);


    if (

        command ===
        "hafızanı temizle"

        ||

        command ===
        "hafizani temizle"

        ||

        command ===
        "tüm hafızanı sil"

        ||

        command ===
        "tum hafizani sil"

    ) {

        const confirmed =
            await requestConfirmation(
                "Tüm AURA hafızası silinecek. Emin misin?"
            );


        if (!confirmed) {

            return
                "İşlem iptal edildi.";

        }


        auraMemory =
            createEmptyMemory();

        saveMemory();


        return
            "Tüm AURA hafızası temizlendi.";

    }


    if (

        command ===
        "tüm görevleri sil"

        ||

        command ===
        "tum gorevleri sil"

    ) {

        const confirmed =
            await requestConfirmation(
                "Tüm görevler silinecek. Emin misin?"
            );


        if (!confirmed) {

            return
                "İşlem iptal edildi.";

        }


        auraMemory.tasks = [];

        saveMemory();


        return
            "Tüm görevler silindi.";

    }


    return null;

}

/* ========================================
   AI YANITINI AYIKLAMA
======================================== */

function extractAIText(response) {

    if (!response) {

        return "";

    }


    if (
        typeof response === "string"
    ) {

        return response.trim();

    }


    if (

        response.message

        &&

        typeof response.message.content ===
        "string"

    ) {

        return response.message.content.trim();

    }


    if (
        typeof response.text ===
        "string"
    ) {

        return response.text.trim();

    }


    if (
        typeof response.content ===
        "string"
    ) {

        return response.content.trim();

    }


    return "";

}


/* ========================================
   AI ÇAĞRISI
======================================== */

async function askAI(text) {

    if (
        typeof puter ===
        "undefined"
    ) {

        throw new Error(
            "AI servisi yüklenemedi."
        );

    }


    const response =
        await puter.ai.chat(

            [
                {

                    role: "system",

                    content:
                        buildSystemPrompt()

                },

                {

                    role: "user",

                    content:
                        text

                }

            ]

        );


    const answer =
        extractAIText(response);


    if (!answer) {

        throw new Error(
            "AURA yanıt oluşturamadı."
        );

    }


    return answer;

}
     /* ========================================
   SES TEMİZLEME
======================================== */

function cleanTextForSpeech(text) {

    return text

        .replace(
            /https?:\/\/\S+/gi,
            " "
        )

        .replace(
            /[\p{Emoji_Presentation}\p{Extended_Pictographic}]/gu,
            " "
        )

        .replace(
            /[#*_`~|<>]/g,
            " "
        )

        .replace(
            /\s+/g,
            " "
        )

        .trim();

}


/* ========================================
   SESLENDİRME
======================================== */

function speak(text) {

    if (
        !("speechSynthesis" in window)
    ) {

        return;

    }


    const cleanText =
        cleanTextForSpeech(text);


    if (!cleanText) {

        return;

    }


    window.speechSynthesis.cancel();


    const utterance =
        new SpeechSynthesisUtterance(
            cleanText
        );


    utterance.lang =
        "tr-TR";

    utterance.rate =
        0.95;

    utterance.pitch =
        1;

    utterance.volume =
        1;


    window.speechSynthesis.speak(
        utterance
    );

}

            );

        };


    recognition.onresult =

            );

     /* ========================================
   MESAJ GÖNDERME
======================================== */

async function sendMessage(
    fromVoice = false
) {

    const text =
        messageInput.value.trim();


    if (
        !text
        &&
        !selectedFile
    ) {

        return;

    }


    const fileInfo =
        buildFileMessage();


    let fullText =
        text;


    if (fileInfo) {

        fullText +=
            fileInfo;

    }


    messageInput.value = "";

    messageInput.style.height =
        "auto";


    addMessage(
        text ||
        (
            "Dosya gönderildi: " +
            selectedFile.name
        ),
        "user"
    );


    clearSelectedFile();


    sendButton.disabled =
        true;


    /* Yerel güvenlik komutları */

    const dangerousResponse =
        await handleDangerousCommand(
            text
        );


    if (dangerousResponse) {

        addMessage(
            dangerousResponse,
            "aura"
        );

        sendButton.disabled =
            false;

        return;

    }


    /* Hafıza komutları */

    const memoryResult =
        handleMemoryCommand(
            text
        );


    if (memoryResult.handled) {

        addMessage(
            memoryResult.response,
            "aura"
        );


        if (fromVoice) {

            speak(
                memoryResult.response
            );

        }


        sendButton.disabled =
            false;

        voiceMode = false;

        return;

    }


    /* Yerel özellik komutları */

    const localResponse =
        handleLocalCommands(
            text
        );


    if (localResponse) {

        addMessage(
            localResponse,
            "aura"
        );


        if (fromVoice) {

            speak(
                localResponse
            );

        }


        sendButton.disabled =
            false;

        voiceMode = false;

        return;

    }


    showTyping();


    try {

        const answer =
            await askAI(
                fullText
            );


        hideTyping();


        addMessage(
            answer,
            "aura"
        );


        /* Sadece sesli konuşmada sesli cevap */

        if (
            fromVoice
            ||
            voiceMode
        ) {

            speak(answer);

        }

    }

    catch (error) {

        console.error(
            error
        );


        hideTyping();


        addMessage(

            "Bağlantı veya AI servisiyle ilgili bir sorun oluştu. Lütfen tekrar dene.",

            "aura"

        );

    }

    finally {

        sendButton.disabled =
            false;

        voiceMode =
            false;

    }

     }

    }
);


/* ========================================
   PANEL SÜRÜKLEME
======================================== */

let dragStartY = 0;

let dragCurrentY = 0;

let isDraggingPanel = false;


dragHandle.addEventListener(
    "touchstart",
    function(event) {

        dragStartY =
            event.touches[0].clientY;

        isDraggingPanel =
            true;

    },
    {
        passive: true
    }
);


dragHandle.addEventListener(
    "touchmove",
    function(event) {

        if (!isDraggingPanel) {

            return;

        }


        dragCurrentY =
            event.touches[0].clientY;


        const difference =
            dragCurrentY -
            dragStartY;


        if (
            difference > 0
        ) {

            chatPanel.style.transform =
                `translateY(${difference}px)`;

        }

    },
    {
        passive: true
    }
);


dragHandle.addEventListener(
    "touchend",
    function() {

        if (!isDraggingPanel) {

            return;

        }


        const difference =
            dragCurrentY -
            dragStartY;


        chatPanel.style.transform =
            "";


        if (
            difference > 100
        ) {

            closeChat();

        }


        isDraggingPanel =
            false;

        dragStartY = 0;

        dragCurrentY = 0;

    }
);
     /* ========================================
   HATIRLATICI KOMUT DESTEĞİ
======================================== */

function parseReminderCommand(text) {

    const command =
        normalizeText(text);


    if (
        !command.startsWith("hatırlat ")
        &&
        !command.startsWith("hatirlat ")
    ) {

        return null;

    }


    const value =
        text
        .replace(
            /^hatırlat /i,
            ""
        )
        .replace(
            /^hatirlat /i,
            ""
        )
        .trim();


    return value;

}


/* ========================================
   GELİŞMİŞ YEREL KOMUTLAR
======================================== */

const originalHandleLocalCommands =
    handleLocalCommands;


function enhancedLocalCommands(text) {

    const reminderText =
        parseReminderCommand(text);


    if (reminderText) {

        return (
            "Hatırlatıcı oluşturmak için tarih ve saat bilgisini daha açık belirtmelisin. Örneğin: yarın saat 10:00."
        );

    }


    return originalHandleLocalCommands(
        text
    );

}


/* Fonksiyonu güncelle */

handleLocalCommands =
    enhancedLocalCommands;


/* ========================================
   SOHBET GEÇMİŞİ
======================================== */

/*
Ana sohbet geçmişi her uygulama açıldığında
temiz başlar. Kalıcı olan şey:

- Hafıza
- Notlar
- Görevler
- Hedefler
- Günlük
- Hatırlatıcılar

Bu sayede mesaj ekranı gereksiz şekilde
eski konuşmalarla dolmaz.
*/


/* ========================================
   SAYFA AÇILIŞ
======================================== */

window.addEventListener(
    "load",
    function() {

        checkReminders();

    }
);


/* ========================================
   ÇEVRİMDIŞI DURUM
======================================== */

window.addEventListener(
    "offline",
    function() {

        console.warn(
            "İnternet bağlantısı kesildi."
        );

    }
);


window.addEventListener(
    "online",
    function() {

        console.log(
            "İnternet bağlantısı yeniden sağlandı."
        );

    }
);
     /* ========================================
   BASİT TARİH KOMUTLARI
======================================== */

function getCurrentDateInfo() {

    return new Date()
        .toLocaleDateString(
            "tr-TR",
            {

                weekday: "long",

                year: "numeric",

                month: "long",

                day: "numeric"

            }
        );

}


function getCurrentTimeInfo() {

    return new Date()
        .toLocaleTimeString(
            "tr-TR",
            {

                hour:
                    "2-digit",

                minute:
                    "2-digit"

            }
        );

}


/* ========================================
   HIZLI KOMUTLAR
======================================== */

function handleQuickCommands(text) {

    const command =
        normalizeText(text);


    if (

        command === "saat kaç"

        ||

        command === "saat kaç?"

    ) {

        return (
            "Şu an saat " +
            getCurrentTimeInfo()
        );

    }


    if (

        command === "bugünün tarihi"

        ||

        command === "bugün ayın kaçı"

        ||

        command === "bugun ayin kaci"

    ) {

        return (
            "Bugünün tarihi " +
            getCurrentDateInfo()
        );

    }


    if (
        command === "yardım"
        ||
        command === "yardim"
    ) {

        return `
AURA'da kullanabileceğin bazı komutlar:

• Not al ...
• Bunu hatırla ...
• Hafızamda ne var
• Görev ekle ...
• Görevlerim
• Hedef ekle ...
• Hedeflerim
• Günlüğe yaz ...
• Hafızanı temizle

Ayrıca normal şekilde istediğin her konuda AURA ile konuşabilirsin.
`;

    }


    return null;

}


/* ========================================
   QUICK COMMAND ENTEGRASYONU
======================================== */

const previousLocalCommands =
    handleLocalCommands;


handleLocalCommands =
    function(text) {

        const quick =
            handleQuickCommands(text);


        if (quick) {

            return quick;

        }


        return previousLocalCommands(
            text
        );

    };
     /* ========================================
   PWA SERVICE WORKER
======================================== */

if (
    "serviceWorker" in navigator
) {

    window.addEventListener(
        "load",
        function() {

            navigator
                .serviceWorker
                .register(
                    "./service-worker.js"
                )
                .catch(
                    function(error) {

                        console.warn(
                            "Service Worker yüklenemedi:",
                            error
                        );

                    }
                );

        }
    );

}


/* ========================================
   BİLDİRİM İZNİ
======================================== */

function requestNotificationPermission() {

    if (
        !("Notification" in window)
    ) {

        return;

    }


    if (
        Notification.permission ===
        "default"
    ) {

        Notification.requestPermission();

    }

}


/* ========================================
   GÖRÜNÜRLÜK KONTROLÜ
======================================== */

document.addEventListener(
    "visibilitychange",
    function() {

        if (
            !document.hidden
        ) {

            checkReminders();

        }

    }
);


/* ========================================
   AURA BAŞLATMA
======================================== */

function initializeAura() {

    console.log(
        "AURA Main System initialized."
    );


    messageInput.value = "";

    messageInput.style.height =
        "auto";


    clearSelectedFile();


    /* Sohbet başlangıçta kapalı */

    closeChat();


    /* Hafızayı kontrol et */

    if (
        !auraMemory
    ) {

        auraMemory =
            createEmptyMemory();

        saveMemory();

    }

}


initializeAura();
