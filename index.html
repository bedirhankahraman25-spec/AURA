<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    height: 100vh;
    overflow: hidden;
    font-family: Arial, sans-serif;
    color: #00eaff;
    background:
        radial-gradient(circle at center,
        #06232d 0%,
        #02070b 45%,
        #000000 100%);
}

/* ÜST BAR */

.top-bar {
    height: 65px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 20px;

    background: rgba(0,10,15,.75);
    border-bottom: 1px solid rgba(0,234,255,.35);
}

.logo {
    font-size: 21px;
    font-weight: bold;
    letter-spacing: 4px;

    text-shadow:
        0 0 10px #00eaff,
        0 0 25px #00eaff;
}

.status {
    font-size: 11px;
    letter-spacing: 2px;
    color: #55ffcc;
}

.status::before {
    content: "";
    display: inline-block;

    width: 7px;
    height: 7px;

    margin-right: 7px;

    border-radius: 50%;

    background: #55ffcc;

    box-shadow:
        0 0 8px #55ffcc,
        0 0 15px #55ffcc;
}

/* ANA ALAN */

.main {
    height: calc(100dvh - 65px);

    min-height: 0;

    display: flex;
    flex-direction: column;
    align-items: center;
}

/* AURA ÇEKİRDEĞİ */

.aura-core {
    width: 220px;
    height: 220px;

    margin-top: 25px;

    position: relative;

    display: flex;
    align-items: center;
    justify-content: center;

    flex-shrink: 0;
}
