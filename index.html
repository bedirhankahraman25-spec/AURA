<!DOCTYPE html>
<html lang="tr">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#02060a">

<title>AURA AI</title>

<style>

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
}

body {
    overflow: hidden;
    font-family: Arial, sans-serif;
    color: #00eaff;

    background:
        radial-gradient(
            circle at center,
            #06303d 0%,
            #02080c 50%,
            #000000 100%
        );
}

.top-bar {
    height: 60px;
    display: flex;
    align-items: center;
    justify-content: space-between;

    padding: 0 18px;

    background: rgba(0,10,15,0.9);
    border-bottom: 1px solid rgba(0,234,255,0.4);
}

.logo {
    font-size: 21px;
    font-weight: bold;
    letter-spacing: 4px;

    text-shadow:
        0 0 10px #00eaff,
        0 0 25px #00eaff;
}

.status {
    font-size: 11px;
    letter-spacing: 2px;
    color: #55ffcc;
}

.status::before {
    content: "";
    display: inline-block;

    width: 7px;
    height: 7px;

    margin-right: 7px;

    border-radius: 50%;

    background: #55ffcc;

    box-shadow:
        0 0 8px #55ffcc,
        0 0 15px #55ffcc;
}

.main {
    height: calc(100vh - 60px);
    height: calc(100dvh - 60px);

    display: flex;
    flex-direction: column;
    align-items: center;

    min-height: 0;
}

.aura-core {
    width: 210px;
    height: 210px;

    margin-top: 10px;

    position: relative;

    display: flex;
    align-items: center;
    justify-content: center;

    flex-shrink: 0;
}

.aura-ring {
    position: absolute;

    border-radius: 50%;

    border: 1px solid #00eaff;

    opacity: 0.7;
}

.ring1 {
    width: 135px;
    height: 135px;

    border-left-color: transparent;
    border-right-color: transparent;

    animation: rotate1 7s linear infinite;
}

.ring2 {
    width: 175px;
    height: 175px;

    border-top-color: transparent;
    border-bottom-color: transparent;

    animation: rotate2 10s linear infinite;
}

.ring3 {
    width: 210px;
    height: 210px;

    border-left-color: transparent;
    border-bottom-color: transparent;

    animation: rotate1 14s linear infinite;
}

.aura-center {
    width: 100px;
    height: 100px;

    border-radius: 50%;

    border: 2px solid #00eaff;

    display: flex;
    align-items: center;
    justify-content: center;

    color: #00eaff;

    font-size: 21px;
    font-weight: bold;

    letter-spacing: 3px;

    background:
        radial-gradient(
            circle,
            #064454,
            #02090d
        );

    box-shadow:
        0 0 15px #00eaff,
        0 0 45px rgba(0,234,255,0.7),
        inset 0 0 25px rgba(0,234,255,0.5);

    animation: pulse 2.2s infinite ease-in-out;

    z-index: 5;
}

@keyframes rotate1 {

    from {
        transform: rotate(0deg);
    }

    to {
        transform: rotate(360deg);
    }
}

@keyframes rotate2 {

    from {
        transform: rotate(360deg);
    }

    to {
        transform: rotate(0deg);
    }
}

@keyframes pulse {

    0%,
    100% {
        transform: scale(1);
    }

    50% {
        transform: scale(1.06);
    }
}

.aura-status {
    margin-top: -8px;
    margin-bottom: 5px;

    font-size: 10px;
    letter-spacing: 3px;

    color: #8defff;
}

#chat {
    width: min(92%, 600px);

    flex: 1;
    min-height: 0;

    overflow-y: auto;

    padding: 5px 5px 10px;
}

.message {
    max-width: 85%;

    padding: 10px 13px;

    margin-bottom: 10px;

    border-radius: 10px;

    line-height: 1.4;

    white-space: pre-wrap;

    font-size: 14px;
}

.aura {
    background: rgba(0,35,45,0.8);

    margin-right: auto;

    border: 1px solid rgba(0,234,255,0.25);
}

.user {
    background: rgba(0,90,120,0.8);

    margin-left: auto;

    color: white;
}

#bottom {
    width: 100%;

    min-height: 65px;

    display: flex;
    align-items: center;

    gap: 8px;

    padding: 10px;

    background: rgba(0,10,15,0.97);

    border-top: 1px solid rgba(0,234,255,0.45);

    z-index: 10;
}

#input {
    flex: 1;

    min-width: 0;

    height: 45px;

    padding: 12px;

    border-radius: 8px;

    border: 1px solid rgba(0,234,255,0.5);

    outline: none;

    background: rgba(0,25,32,0.95);

    color: #00eaff;

    font-size: 14px;
}

#input::placeholder {
    color: #548995;
}

button {
    height: 45px;

    border: 1px solid #00eaff;

    border-radius: 8px;

    padding: 0 14px;

    background: rgba(0,60,75,0.9);

    color: #00eaff;

    font-size: 14px;

    cursor: pointer;
}

button:active {
    transform: scale(0.94);
}

button:disabled {
    opacity: 0.5;
}

.mic-button {
    width: 45px;
    padding: 0;
    font-size: 20px;
}

@media (max-width: 500px) {

    .aura-core {
        transform: scale(0.82);

        margin-top: 0;
        margin-bottom: -15px;
    }

    .logo {
        font-size: 18px;
    }

    button {
        padding: 0 11px;
    }
}

</style>

</head>

<body>

<div class="top-bar">

    <div class="logo">
        AURA
    </div>

    <div class="status" id="status">
        ONLINE
    </div>

</div>

<div class="main">

    <div class="aura-core">

        <div class="aura-ring ring1"></div>

        <div class="aura-ring ring2"></div>

        <div class="aura-ring ring3"></div>

        <div class="aura-center">
            AURA
        </div>

    </div>

    <div class="aura-status" id="auraStatus">
        AI SYSTEM READY
    </div>

    <div id="chat"></div>

    <div id="bottom">

        <input
            id="input"
            type="text"
            placeholder="Bir şey sor..."
            autocomplete="off"
            disabled
        >

        <button
            class="mic-button"
            id="micButton"
            type="button"
            disabled>
            🎤
        </button>

        <button
            id="sendButton"
            type="button"
            disabled>
            Gönder
        </button>

    </div>

</div>

<script src="https://js.puter.com/v2/"></script>

<script>
    /* =========================================
   AURA BULUT HAFIZASI
========================================= */

const MEMORY_KEY =
    "aura_cloud_memory_v1";

const CHAT_KEY =
    "aura_cloud_chat_v1";


const defaultMemory = {

    name: "Bedirhan Kahraman",

    girlfriend: "Edanur Kahraman",

    favoriteTeam: "",

    facts: []

};


let memory = {
    ...defaultMemory
};


let conversation = [

    {
        role: "system",
        content: ""
    }

];


let cloudReady = false;


/* =========================================
   HAFIZA METNİ
========================================= */

function buildMemoryText() {

    let text =
        "KALICI KULLANICI HAFIZASI:\n";

    text +=
        "Kullanıcının adı: " +
        memory.name +
        "\n";

    text +=
        "Kullanıcının sevgilisinin adı: " +
        memory.girlfriend +
        "\n";

    if (memory.favoriteTeam) {

        text +=
            "Kullanıcının tuttuğu takım: " +
            memory.favoriteTeam +
            "\n";
    }

    if (
        Array.isArray(memory.facts) &&
        memory.facts.length > 0
    ) {

        text +=
            "Kullanıcı hakkında hatırlanması gereken bilgiler:\n";

        memory.facts.forEach(
            function(fact) {

                text +=
                    "- " +
                    fact +
                    "\n";
            }
        );
    }

    return text;
}


/* =========================================
   SİSTEM MESAJI
========================================= */

function buildSystemPrompt() {

    return `
Sen AURA adında kişisel bir yapay zekâ asistanısın.

Türkçe konuş.

Kullanıcının adı Bedirhan Kahraman.

Kullanıcının sevgilisinin adı Edanur Kahraman.

ÖNEMLİ KONUŞMA KURALLARI:

Kullanıcıya sürekli ismiyle hitap etme.

Her cevaba "Bedirhan" diye başlama.

İsmini yalnızca gerçekten gerekli olduğunda kullan.

Her mesajda kendini "AURA" diye tanıtma.

Doğal, kısa ve anlaşılır cevaplar ver.

Gereksiz tekrar yapma.

Bilmediğin bilgiyi uydurma.

Kullanıcı "ben kimim" derse Bedirhan Kahraman olduğunu söyle.

Kullanıcı "sevgilimin adı ne" derse Edanur Kahraman olduğunu söyle.

KALICI HAFIZA:

${buildMemoryText()}

Bu hafızadaki bilgileri konuşma sırasında gerektiğinde kullan.

Kullanıcı yeni ve önemli bir bilgi verdiğinde bunu dikkate al.
`;
}


/* =========================================
   BULUTTAN HAFIZA YÜKLE
========================================= */

async function loadCloudMemory() {

    try {

        const saved =
            await puter.kv.get(
                MEMORY_KEY
            );


        if (
            saved !== undefined &&
            saved !== null
        ) {

            if (
                typeof saved === "string"
            ) {

                try {

                    memory =
                        JSON.parse(saved);

                } catch {

                    memory = {
                        ...defaultMemory
                    };
                }

            } else {

                memory = {
                    ...defaultMemory,
                    ...saved
                };
            }
        }


        if (
            !Array.isArray(memory.facts)
        ) {

            memory.facts = [];
        }


        console.log(
            "BULUT HAFIZA YÜKLENDİ:",
            memory
        );


        return true;

    }

    catch (error) {

        console.error(
            "BULUT HAFIZA YÜKLEME HATASI:",
            error
        );

        return false;
    }
}


/* =========================================
   BULUTA HAFIZA KAYDET
========================================= */

async function saveCloudMemory() {

    try {

        const result =
            await puter.kv.set(
                MEMORY_KEY,
                memory
            );


        console.log(
            "HAFIZA BULUTA KAYDEDİLDİ:",
            result
        );


        return true;

    }

    catch (error) {

        console.error(
            "HAFIZA KAYDETME HATASI:",
            error
        );

        return false;
    }
}


/* =========================================
   KONUŞMA GEÇMİŞİNİ YÜKLE
========================================= */

async function loadCloudConversation() {

    try {

        const saved =
            await puter.kv.get(
                CHAT_KEY
            );


        if (
            saved !== undefined &&
            saved !== null &&
            Array.isArray(saved)
        ) {

            conversation =
                saved;

        }


        if (
            !Array.isArray(conversation) ||
            conversation.length === 0
        ) {

            conversation = [

                {
                    role: "system",
                    content: ""
                }

            ];
        }


        return true;

    }

    catch (error) {

        console.error(
            "KONUŞMA YÜKLEME HATASI:",
            error
        );

        conversation = [

            {
                role: "system",
                content: ""
            }

        ];

        return false;
    }
}


/* =========================================
   KONUŞMAYI BULUTA KAYDET
========================================= */

async function saveCloudConversation() {

    try {

        /*
         * Çok fazla büyümemesi için
         * son 40 mesajı tutuyoruz.
         */

        const system =
            conversation[0];


        const messages =
            conversation.slice(-40);


        conversation =
            [
                system,
                ...messages.filter(
                    function(item, index) {

                        return (
                            index !== 0
                        );
                    }
                )
            ];


        await puter.kv.set(
            CHAT_KEY,
            conversation
        );


        console.log(
            "KONUŞMA BULUTA KAYDEDİLDİ."
        );


        return true;

    }

    catch (error) {

        console.error(
            "KONUŞMA KAYDETME HATASI:",
            error
        );

        return false;
    }
}


/* =========================================
   SİSTEM MESAJINI GÜNCELLE
========================================= */

function updateSystemMessage() {

    if (
        !conversation[0] ||
        conversation[0].role !== "system"
    ) {

        conversation.unshift({

            role: "system",
            content: buildSystemPrompt()

        });

    } else {

        conversation[0].content =
            buildSystemPrompt();
    }
}


/* =========================================
   BENZERSİZ BİLGİ EKLE
========================================= */

function addFact(fact) {

    const clean =
        String(fact)
            .trim()
            .replace(
                /[.!?]+$/,
                ""
            );


    if (!clean) {
        return false;
    }


    const exists =
        memory.facts.some(
            function(item) {

                return (
                    item.toLocaleLowerCase("tr-TR") ===
                    clean.toLocaleLowerCase("tr-TR")
                );

            }
        );


    if (exists) {
        return false;
    }


    memory.facts.push(
        clean
    );


    return true;
            }
    /* =========================================
   MESAJDAN HAFIZA ÖĞREN
========================================= */

async function learnFromMessage(text) {

    let changed = false;


    /* TAKIM */

    const teamPatterns = [

        /ben\s+(.+?)\s+tutuyorum/i,

        /ben\s+(.+?)\s+tutuyorum/iu,

        /(.+?)\s+taraftarıyım/i,

        /(.+?)\s+taraftariyim/i

    ];


    for (
        const pattern of teamPatterns
    ) {

        const match =
            text.match(pattern);


        if (match) {

            let team =
                match[1]
                    .trim()
                    .replace(
                        /^[ıi]\s+/i,
                        ""
                    )
                    .replace(
                        /[.!?,]+$/,
                        ""
                    );


            if (
                team.length >= 2 &&
                team.length <= 60
            ) {

                if (
                    memory.favoriteTeam !==
                    team
                ) {

                    memory.favoriteTeam =
                        team;

                    changed = true;
                }
            }

            break;
        }
    }


    /* BUNU HATIRLA */

    const rememberPatterns = [

        /bunu\s+hatırla\s*[:\-]?\s*(.+)/i,

        /bunu\s+hatirla\s*[:\-]?\s*(.+)/i,

        /aklında\s+tut\s*[:\-]?\s*(.+)/i,

        /aklinda\s+tut\s*[:\-]?\s*(.+)/i,

        /unutma\s*[:\-]?\s*(.+)/i

    ];


    for (
        const pattern of rememberPatterns
    ) {

        const match =
            text.match(pattern);


        if (match) {

            if (
                addFact(match[1])
            ) {

                changed = true;
            }

            break;
        }
    }


    if (changed) {

        await saveCloudMemory();

    }


    return changed;
}


/* =========================================
   HAFIZA KOMUTLARI
========================================= */

function handleMemoryCommand(text) {

    const lower =
        text
            .toLocaleLowerCase("tr-TR")
            .trim();


    /* HAFIZA GÖR */

    if (

        lower === "hafızamda ne var" ||

        lower === "hafizanda ne var" ||

        lower === "hafızanda ne var" ||

        lower.includes(
            "benim hakkımda ne biliyorsun"
        ) ||

        lower.includes(
            "benim hakkimda ne biliyorsun"
        )

    ) {

        return buildMemoryText();
    }


    /* TAKIM */

    if (

        lower.includes(
            "hangi takımı tutuyorum"
        ) ||

        lower.includes(
            "hangi takimi tutuyorum"
        )

    ) {

        if (
            memory.favoriteTeam
        ) {

            return (
                "Tuttuğun takım " +
                memory.favoriteTeam +
                "."
            );

        }

        return (
            "Tuttuğun takımı henüz hafızamda bulamıyorum."
        );
    }


    /* HAFIZA SİL */

    if (

        lower ===
        "hafızayı temizle" ||

        lower ===
        "hafizayi temizle"

    ) {

        return "__CLEAR_MEMORY__";
    }


    return null;
}


/* =========================================
   MESAJ EKLE
========================================= */

function addMessage(
    text,
    type
) {

    const message =
        document.createElement(
            "div"
        );


    message.className =
        "message " + type;


    message.textContent =
        text;


    chat.appendChild(
        message
    );


    chat.scrollTop =
        chat.scrollHeight;
}


/* =========================================
   SES TEMİZLE
========================================= */

function cleanTextForSpeech(text) {

    return text

        .replace(
            /[\p{Emoji_Presentation}\p{Extended_Pictographic}]/gu,
            ""
        )

        .replace(
            /https?:\/\/\S+/gi,
            ""
        )

        .replace(
            /[.,!?;:"'“”‘’()[\]{}<>…:;\/\\|@#$%^&*_+=~`-]/g,
            " "
        )

        .replace(
            /\s+/g,
            " "
        )

        .trim();
}


/* =========================================
   KONUŞ
========================================= */

function speak(text) {

    if (
        !("speechSynthesis" in window)
    ) {

        return;
    }


    const clean =
        cleanTextForSpeech(text);


    if (!clean) {
        return;
    }


    const voice =
        new SpeechSynthesisUtterance(
            clean
        );


    voice.lang =
        "tr-TR";

    voice.rate =
        0.9;

    voice.pitch =
        1;

    voice.volume =
        1;


    window.speechSynthesis.cancel();


    setTimeout(
        function() {

            window.speechSynthesis.speak(
                voice
            );

        },
        100
    );
}


/* =========================================
   GERÇEK AI
========================================= */

async function askAI(text) {

    await learnFromMessage(
        text
    );


    const memoryAnswer =
        handleMemoryCommand(
            text
        );


    if (
        memoryAnswer ===
        "__CLEAR_MEMORY__"
    ) {

        memory = {
            ...defaultMemory,
            facts: []
        };


        await saveCloudMemory();


        return (
            "Kalıcı hafızamı temizledim."
        );
    }


    if (memoryAnswer) {

        return memoryAnswer;
    }


    updateSystemMessage();


    conversation.push({

        role: "user",

        content: text

    });


    try {

        const response =
            await puter.ai.chat(
                conversation,
                {
                    model: "gpt-5.4-nano"
                }
            );


        let answer = "";


        if (
            response &&
            response.message &&
            typeof response.message.content ===
            "string"
        ) {

            answer =
                response.message.content;

        }

        else if (
            response &&
            typeof response.text ===
            "string"
        ) {

            answer =
                response.text;

        }

        else if (
            typeof response ===
            "string"
        ) {

            answer =
                response;

        }

        else {

            answer =
                String(response);
        }


        conversation.push({

            role: "assistant",

            content: answer

        });


        /*
         * AI konuşmasını da buluta kaydet.
         */

        await saveCloudConversation();


        /*
         * Hafızayı tekrar güvenceye al.
         */

        await saveCloudMemory();


        return answer;

    }

    catch (error) {

        console.error(
            "PUTER AI HATASI:",
            error
        );


        return (
            "AI bağlantısında bir sorun oluştu. Tekrar deneyebiliriz."
        );
    }
}


/* =========================================
   MESAJ GÖNDER
========================================= */

async function sendMessage(
    voiceMode = false
) {

    if (!cloudReady) {

        addMessage(
            "Hafıza sistemi henüz hazır değil.",
            "aura"
        );

        return;
    }


    const text =
        input.value.trim();


    if (!text) {
        return;
    }


    addMessage(
        text,
        "user"
    );


    input.value =
        "";


    sendButton.disabled =
        true;

    micButton.disabled =
        true;


    addMessage(
        "Düşünüyorum...",
        "aura"
    );


    const loading =
        chat.lastElementChild;


    try {

        const reply =
            await askAI(text);


        if (loading) {
            loading.remove();
        }


        addMessage(
            reply,
            "aura"
        );


        if (voiceMode) {

            speak(reply);
        }

    }

    catch (error) {

        console.error(
            error
        );


        if (loading) {
            loading.remove();
        }


        addMessage(
            "Bir hata oluştu.",
            "aura"
        );
    }


    sendButton.disabled =
        false;

    micButton.disabled =
        false;


    input.focus();
    }
    /* =========================================
   GÖNDER BUTONU
========================================= */

sendButton.addEventListener(
    "click",
    function() {

        sendMessage(false);

    }
);


/* =========================================
   ENTER
========================================= */

input.addEventListener(
    "keydown",
    function(event) {

        if (
            event.key === "Enter"
        ) {

            event.preventDefault();

            sendMessage(false);
        }

    }
);


/* =========================================
   MİKROFON
========================================= */

function startListening() {

    const SpeechRecognition =
        window.SpeechRecognition ||
        window.webkitSpeechRecognition;


    if (!SpeechRecognition) {

        addMessage(
            "Bu tarayıcı sesli komutu desteklemiyor.",
            "aura"
        );

        return;
    }


    const recognition =
        new SpeechRecognition();


    recognition.lang =
        "tr-TR";


    recognition.continuous =
        false;


    recognition.interimResults =
        false;


    recognition.onstart =
        function() {

            micButton.disabled =
                true;


            addMessage(
                "Dinliyorum...",
                "aura"
            );
        };


    recognition.onresult =
        function(event) {

            const text =
                event.results[0][0]
                    .transcript
                    .trim();


            input.value =
                text;


            sendMessage(true);
        };


    recognition.onerror =
        function(event) {

            console.error(
                "Mikrofon:",
                event.error
            );


            micButton.disabled =
                false;


            addMessage(
                "Sesli komut alınamadı.",
                "aura"
            );
        };


    recognition.onend =
        function() {

            micButton.disabled =
                false;
        };


    try {

        recognition.start();

    }

    catch (error) {

        console.error(
            error
        );


        micButton.disabled =
            false;
    }
}


micButton.addEventListener(
    "click",
    startListening
);


/* =========================================
   AURA'YI BAŞLAT
========================================= */

async function initializeAURA() {

    addMessage(
        "Bulut hafızası yükleniyor...",
        "aura"
    );


    const memoryLoaded =
        await loadCloudMemory();


    const chatLoaded =
        await loadCloudConversation();


    updateSystemMessage();


    if (
        memoryLoaded
    ) {

        cloudReady =
            true;


        input.disabled =
            false;

        sendButton.disabled =
            false;

        micButton.disabled =
            false;


        document.getElementById(
            "status"
        ).textContent =
            "ONLINE";


        document.getElementById(
            "auraStatus"
        ).textContent =
            "MEMORY ONLINE";


        chat.lastElementChild.remove();


        addMessage(
            "Sistem hazır. Kalıcı hafıza aktif.",
            "aura"
        );


        console.log(
            "AURA HAFIZA:",
            memory
        );


        console.log(
            "AURA KONUŞMA:",
            conversation
        );


        input.focus();

    }

    else {

        cloudReady =
            false;


        document.getElementById(
            "status"
        ).textContent =
            "MEMORY ERROR";


        document.getElementById(
            "auraStatus"
        ).textContent =
            "MEMORY OFFLINE";


        chat.lastElementChild.remove();


        addMessage(
            "Bulut hafızasına bağlanılamadı. Puter hesabının açık olduğundan emin ol.",
            "aura"
        );


        /*
         * AI'yi yine tamamen kilitlemiyoruz;
         * ancak yanlışlıkla yerel hafıza kullanmaması
         * için gönderme kapalı kalıyor.
         */

    }
}
