<!DOCTYPE html>
<html lang="tr">
<head>

<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<meta name="theme-color" content="#020b14">

<title>AURA AI</title>

<style>

*{
    box-sizing:border-box;
}

html,
body{
    width:100%;
    height:100%;
    margin:0;
}

body{

    overflow:hidden;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    color:#dffaff;

    background:
        radial-gradient(
            circle at 50% 35%,
            #073b57 0%,
            #05263b 30%,
            #020e19 65%,
            #00070d 100%
        );
}


/* =========================
   ÜST BAR
========================= */

.top-bar{

    height:78px;

    display:flex;

    align-items:center;

    justify-content:space-between;

    padding:
        0 28px;

    background:
        rgba(0,7,14,.92);

    border-bottom:
        1px solid
        rgba(0,234,255,.28);

    box-shadow:
        0 4px 25px
        rgba(0,0,0,.35);

    position:relative;

    z-index:20;
}


.logo{

    font-size:29px;

    font-weight:700;

    letter-spacing:7px;

    color:#00eaff;

    text-shadow:
        0 0 8px #00eaff,
        0 0 20px #00eaff,
        0 0 35px
        rgba(0,234,255,.65);
}


.online{

    display:flex;

    align-items:center;

    gap:9px;

    color:#62ffd4;

    font-size:12px;

    letter-spacing:3px;
}


.online-dot{

    width:9px;
    height:9px;

    border-radius:50%;

    background:#62ffd4;

    box-shadow:
        0 0 8px #62ffd4,
        0 0 18px #62ffd4;
}


/* =========================
   ANA ALAN
========================= */

.main{

    height:
        calc(100vh - 78px);

    height:
        calc(100dvh - 78px);

    position:relative;

    overflow:hidden;
}


/* =========================
   ÇEKİRDEK ALANI
========================= */

.core-area{

    position:absolute;

    top:8%;

    left:0;

    width:100%;

    display:flex;

    justify-content:center;

    align-items:center;

    z-index:5;

    transition:
        top .45s ease,
        transform .45s ease;
}


.main.chat-open .core-area{

    top:2%;

    transform:scale(.82);
}


.aura-core{

    width:210px;

    height:210px;

    position:relative;

    display:flex;

    align-items:center;

    justify-content:center;

    cursor:pointer;

    user-select:none;
}


.core-glow{

    position:absolute;

    width:145px;

    height:145px;

    border-radius:50%;

    background:
        radial-gradient(
            circle,
            rgba(0,234,255,.55),
            rgba(0,120,180,.15) 45%,
            transparent 72%
        );

    filter:blur(10px);

    animation:
        corePulse 3s
        ease-in-out
        infinite;
}


.core-circle{

    width:130px;

    height:130px;

    border-radius:50%;

    position:relative;

    z-index:5;

    display:flex;

    align-items:center;

    justify-content:center;

    background:
        radial-gradient(
            circle at 35% 30%,
            #65f7ff 0%,
            #087d9d 18%,
            #04334c 52%,
            #010c15 100%
        );

    border:
        2px solid
        #5af7ff;

    box-shadow:

        0 0 10px
        #00eaff,

        0 0 30px
        rgba(0,234,255,.75),

        0 0 65px
        rgba(0,150,255,.35),

        inset 0 0 25px
        rgba(0,234,255,.5);

    animation:
        coreBreath 3s
        ease-in-out
        infinite;
}


.core-text{

    font-size:21px;

    font-weight:700;

    letter-spacing:6px;

    color:#fff;

    text-shadow:
        0 0 8px #fff,
        0 0 18px #00eaff;
}


/* =========================
   HALKALAR
========================= */

.ring{

    position:absolute;

    border-radius:50%;

    border:
        1px solid
        rgba(0,234,255,.65);

    pointer-events:none;
}


.ring.one{

    width:155px;
    height:155px;

    border-left-color:transparent;
    border-bottom-color:transparent;

    animation:
        rotateClockwise
        8s
        linear
        infinite;
}


.ring.two{

    width:185px;
    height:185px;

    border-right-color:transparent;
    border-top-color:transparent;

    animation:
        rotateReverse
        11s
        linear
        infinite;
}


.ring.three{

    width:210px;
    height:210px;

    border-left-color:transparent;
    border-right-color:transparent;

    opacity:.45;

    animation:
        rotateClockwise
        15s
        linear
        infinite;
}


@keyframes rotateClockwise{

    from{
        transform:rotate(0deg);
    }

    to{
        transform:rotate(360deg);
    }
}


@keyframes rotateReverse{

    from{
        transform:rotate(360deg);
    }

    to{
        transform:rotate(0deg);
    }
}


@keyframes corePulse{

    0%,
    100%{
        transform:scale(.92);
        opacity:.75;
    }

    50%{
        transform:scale(1.08);
        opacity:1;
    }
}


@keyframes coreBreath{

    0%,
    100%{
        transform:scale(1);
    }

    50%{
        transform:scale(1.035);
    }
}


/* =========================
   CHAT PANEL
========================= */

.chat-panel{

    position:absolute;

    left:2%;

    bottom:0;

    width:96%;

    height:58%;

    background:
        rgba(0,10,20,.88);

    border:
        1px solid
        rgba(0,234,255,.28);

    border-bottom:none;

    border-radius:
        32px 32px 0 0;

    box-shadow:
        0 -10px 40px
        rgba(0,0,0,.4),

        inset 0 1px 0
        rgba(0,234,255,.12);

    display:flex;

    flex-direction:column;

    transform:
        translateY(102%);

    transition:
        transform .45s
        cubic-bezier(.2,.8,.2,1);

    z-index:10;

    overflow:hidden;
}


.main.chat-open .chat-panel{

    transform:
        translateY(0);
}


/* =========================
   CHAT MESAJLARI
========================= */

#chat{

    flex:1;

    min-height:0;

    overflow-y:auto;

    padding:
        28px
        20px
        120px;

    scroll-behavior:smooth;
}


#chat::-webkit-scrollbar{

    width:5px;
}


#chat::-webkit-scrollbar-thumb{

    background:
        rgba(0,234,255,.35);

    border-radius:10px;
}


.message{

    width:fit-content;

    max-width:82%;

    padding:
        15px
        18px;

    margin-bottom:14px;

    border-radius:18px;

    font-size:15px;

    line-height:1.55;

    white-space:pre-wrap;

    overflow-wrap:anywhere;

    word-break:break-word;

    text-align:left;

    animation:
        messageIn
        .25s
        ease;
}


@keyframes messageIn{

    from{

        opacity:0;

        transform:
            translateY(8px);
    }

    to{

        opacity:1;

        transform:
            translateY(0);
    }
}


.message.aura{

    margin-right:auto;

    margin-left:2px;

    background:
        linear-gradient(
            135deg,
            rgba(0,54,72,.95),
            rgba(0,25,38,.95)
        );

    border-left:
        3px solid
        #00eaff;

    border-radius:
        5px 18px 18px 18px;

    box-shadow:
        0 5px 20px
        rgba(0,234,255,.08);
}


.message.user{

    margin-left:auto;

    margin-right:2px;

    background:
        linear-gradient(
            135deg,
            #0d6688,
            #07405c
        );

    border-right:
        3px solid
        #52ffe0;

    border-radius:
        18px 5px 18px 18px;

    color:#fff;
}


/* =========================
   ALT GİRİŞ
========================= */

.input-area{

    position:absolute;

    left:15px;

    right:15px;

    bottom:15px;

    min-height:76px;

    padding:10px;

    display:flex;

    gap:9px;

    align-items:center;

    background:
        rgba(2,24,37,.98);

    border:
        1px solid
        rgba(0,234,255,.65);

    border-radius:25px;

    box-shadow:
        0 0 20px
        rgba(0,234,255,.12);
}


#input{

    flex:1;

    min-width:0;

    height:52px;

    padding:
        0 15px;

    border:none;

    outline:none;

    border-radius:17px;

    background:
        rgba(0,48,65,.75);

    color:#e9fdff;

    font-size:15px;
}


#input::placeholder{

    color:#7195a3;
}


.action-button{

    width:52px;

    height:52px;

    flex-shrink:0;

    border:none;

    border-radius:17px;

    cursor:pointer;

    display:flex;

    align-items:center;

    justify-content:center;

    font-size:21px;

    transition:
        transform .15s,
        filter .15s;
}


.action-button:active{

    transform:scale(.92);
}


#micButton{

    background:
        #063c59;

    color:#a9f8ff;

    border:
        1px solid
        rgba(0,234,255,.25);
}


#micButton.listening{

    background:#00a8bd;

    color:#fff;

    box-shadow:
        0 0 20px
        rgba(0,234,255,.7);
}


#sendButton{

    background:
        linear-gradient(
            135deg,
            #19ddeb,
            #15a7c9
        );

    color:#001018;

    font-size:25px;

    font-weight:900;

    box-shadow:
        0 0 15px
        rgba(0,234,255,.35);
}


/* =========================
   YARDIMCI PANEL
========================= */

.tools-panel{

    position:absolute;

    top:12px;

    right:15px;

    display:flex;

    gap:6px;

    z-index:20;
}


.small-button{

    width:35px;

    height:35px;

    border:
        1px solid
        rgba(0,234,255,.25);

    border-radius:11px;

    background:
        rgba(0,30,45,.7);

    color:#8defff;

    cursor:pointer;
}


/* =========================
   MOBİL
========================= */

@media(max-width:600px){

    .top-bar{

        height:70px;

        padding:
            0 20px;
    }

    .logo{

        font-size:25px;

        letter-spacing:6px;
    }

    .online{

        font-size:10px;

        letter-spacing:2px;
    }

    .main{

        height:
            calc(100vh - 70px);

        height:
            calc(100dvh - 70px);
    }

    .core-area{

        top:7%;
    }

    .main.chat-open .core-area{

        top:0%;

        transform:scale(.72);
    }

    .chat-panel{

        left:0;

        width:100%;

        height:62%;

        border-radius:
            28px 28px 0 0;
    }

    #chat{

        padding:
            24px
            15px
            120px;
    }

    .message{

        max-width:88%;

        font-size:15px;
    }

    .input-area{

        left:10px;

        right:10px;

        bottom:10px;

        min-height:70px;

        border-radius:22px;
    }

    #input{

        font-size:14px;
    }

    .action-button{

        width:48px;

        height:48px;
    }

}

</style>

</head>

<body>


<div class="top-bar">

    <div class="logo">
        AURA
    </div>

    <div class="online">
        <span class="online-dot"></span>
        SYSTEM ONLINE
    </div>

</div>


<div class="main" id="main">


    <div class="core-area">

        <div
            class="aura-core"
            id="auraCore">

            <div class="core-glow"></div>

            <div class="ring one"></div>
            <div class="ring two"></div>
            <div class="ring three"></div>

            <div class="core-circle">

                <div class="core-text">
                    AURA
                </div>

            </div>

        </div>

    </div>


    <div
        class="chat-panel"
        id="chatPanel">

        <div id="chat"></div>


        <div class="input-area">

            <input
                id="input"
                type="text"
                autocomplete="off"
                placeholder="AURA'ya mesaj yaz..."
            >

            <button
                id="micButton"
                class="action-button"
                type="button"
                title="Sesli komut">
                🎙️
            </button>

            <button
                id="sendButton"
                class="action-button"
                type="button"
                title="Gönder">
                ➤
            </button>

        </div>

    </div>

</div>


<script src="https://js.puter.com/v2/"></script><script>

/* =========================
   TEMEL DEĞİŞKENLER
========================= */

const main =
    document.getElementById("main");

const auraCore =
    document.getElementById("auraCore");

const chat =
    document.getElementById("chat");

const input =
    document.getElementById("input");

const sendButton =
    document.getElementById("sendButton");

const micButton =
    document.getElementById("micButton");


const USER_NAME =
    "Bedirhan";

const GIRLFRIEND_NAME =
    "Edanur";


/* =========================
   HAFIZA
========================= */

const MEMORY_KEY =
    "AURA_MEMORY_V7";


function createEmptyMemory(){

    return {

        facts:[],

        preferences:[],

        notes:[],

        tasks:[],

        reminders:[],

        knowledge:[]
    };
}


function loadMemory(){

    try{

        const raw =
            localStorage.getItem(
                MEMORY_KEY
            );

        if(!raw){

            return createEmptyMemory();
        }

        const data =
            JSON.parse(raw);

        const empty =
            createEmptyMemory();

        return {

            facts:
                Array.isArray(data.facts)
                    ? data.facts
                    : empty.facts,

            preferences:
                Array.isArray(data.preferences)
                    ? data.preferences
                    : empty.preferences,

            notes:
                Array.isArray(data.notes)
                    ? data.notes
                    : empty.notes,

            tasks:
                Array.isArray(data.tasks)
                    ? data.tasks
                    : empty.tasks,

            reminders:
                Array.isArray(data.reminders)
                    ? data.reminders
                    : empty.reminders,

            knowledge:
                Array.isArray(data.knowledge)
                    ? data.knowledge
                    : empty.knowledge
        };

    }catch(error){

        console.error(
            "Hafıza okunamadı:",
            error
        );

        return createEmptyMemory();
    }
}


let memory =
    loadMemory();


function saveMemory(){

    try{

        localStorage.setItem(
            MEMORY_KEY,
            JSON.stringify(memory)
        );

    }catch(error){

        console.error(
            "Hafıza kaydedilemedi:",
            error
        );
    }
}


function addMemory(
    type,
    text
){

    if(
        !memory[type] ||
        !Array.isArray(memory[type])
    ){

        return false;
    }

    memory[type].push({

        id:
            Date.now(),

        text:
            String(text),

        created:
            new Date()
            .toLocaleString("tr-TR")
    });

    saveMemory();

    return true;
}


/* =========================
   MESAJ GEÇMİŞİ
========================= */

const HISTORY_KEY =
    "AURA_CHAT_HISTORY_V7";


function loadHistory(){

    try{

        const raw =
            localStorage.getItem(
                HISTORY_KEY
            );

        if(!raw){

            return [];
        }

        const data =
            JSON.parse(raw);

        return Array.isArray(data)
            ? data
            : [];

    }catch{

        return [];
    }
}


let history =
    loadHistory();


function saveHistory(){

    try{

        localStorage.setItem(
            HISTORY_KEY,
            JSON.stringify(
                history.slice(-40)
            )
        );

    }catch(error){

        console.error(
            "Geçmiş kaydedilemedi:",
            error
        );
    }
}


function saveConversation(
    userText,
    auraText
){

    history.push({

        user:
            String(userText),

        aura:
            String(auraText),

        date:
            new Date()
            .toISOString()
    });

    saveHistory();
}


/* =========================
   CHAT AÇ / KAPAT
========================= */

function openChat(){

    main.classList.add(
        "chat-open"
    );

    setTimeout(
        () => input.focus(),
        350
    );
}


function closeChat(){

    main.classList.remove(
        "chat-open"
    );
}


auraCore.addEventListener(
    "click",
    function(){

        if(
            main.classList.contains(
                "chat-open"
            )
        ){

            closeChat();

        }else{

            openChat();
        }

    }
);


/* =========================
   MESAJ EKLEME
========================= */

function addMessage(
    text,
    type
){

    const message =
        document.createElement(
            "div"
        );

    message.className =
        "message " +
        (
            type === "user"
                ? "user"
                : "aura"
        );

    message.textContent =
        String(text ?? "");

    chat.appendChild(
        message
    );

    requestAnimationFrame(
        () => {

            chat.scrollTop =
                chat.scrollHeight;

        }
    );
}


/* =========================
   İLK MESAJ
========================= */

addMessage(
    "Selam Bedirhan, sistem hazır. Seni dinliyorum.",
    "aura"
);


/* =========================
   AI CEVABINI TEMİZLE
========================= */

function extractAIText(
    response
){

    if(
        response === null ||
        response === undefined
    ){

        return "";
    }


    if(
        typeof response === "string"
    ){

        return response.trim();
    }


    if(
        response.message &&
        typeof response.message.content === "string"
    ){

        return response.message.content.trim();
    }


    if(
        response.message &&
        Array.isArray(
            response.message.content
        )
    ){

        return response.message.content

            .map(
                item => {

                    if(
                        typeof item === "string"
                    ){

                        return item;
                    }

                    if(
                        item &&
                        typeof item.text === "string"
                    ){

                        return item.text;
                    }

                    return "";
                }
            )

            .join("")

            .trim();
    }


    if(
        typeof response.text === "string"
    ){

        return response.text.trim();
    }


    return "";
}


/* =========================
   AI HATA METNİ
========================= */

function getErrorText(
    error
){

    if(
        error &&
        typeof error.message === "string"
    ){

        return error.message;
    }

    return String(
        error || "Bilinmeyen hata"
    );
}/* =========================
   SYSTEM PROMPT
========================= */

function buildSystemPrompt(){

    const facts =
        memory.facts
            .map(
                x => "- " + x.text
            )
            .join("\n");


    const preferences =
        memory.preferences
            .map(
                x => "- " + x.text
            )
            .join("\n");


    const notes =
        memory.notes
            .map(
                x => "- " + x.text
            )
            .join("\n");


    const knowledge =
        memory.knowledge
            .map(
                x => "- " + x.text
            )
            .join("\n");


    return `
Sen AURA'sın.

Kullanıcının adı Bedirhan'dır.

Bedirhan'ın sevgilisinin adı Edanur'dur.
Edanur AURA'nın sevgilisi değildir.

Türkçe cevap ver.

Kısa, doğal ve anlaşılır konuş.

Kullanıcı sana "AURA" diye hitap edebilir.

Kullanıcıya erkek veya kadın şeklinde cinsiyet ataması yapma.

Bilmediğin bilgileri uydurma.

Kullanıcı senden bir işlem istediğinde mümkünse işlemi gerçekleştir.

Kullanıcıya gereksiz şekilde "Bedirhan" diye hitap etme.

KALICI HAFIZA:

Bilgiler:
${facts || "Yok"}

Tercihler:
${preferences || "Yok"}

Notlar:
${notes || "Yok"}

Bilgi tabanı:
${knowledge || "Yok"}
`;
}


/* =========================
   AI ÇAĞRISI
========================= */

async function askAI(
    text
){

    if(
        typeof puter === "undefined"
    ){

        throw new Error(
            "Puter.js yüklenemedi."
        );
    }


    if(
        !puter.ai ||
        typeof puter.ai.chat !== "function"
    ){

        throw new Error(
            "Puter AI servisi bulunamadı."
        );
    }


    const messages = [

        {
            role:"system",

            content:
                buildSystemPrompt()
        }

    ];


    /*
       Son konuşmaları AI'ya aktar.
       Bozuk obje göndermemek için
       yalnızca string gönderiyoruz.
    */

    history
        .slice(-12)
        .forEach(
            item => {

                if(
                    item &&
                    typeof item.user === "string"
                ){

                    messages.push({

                        role:"user",

                        content:
                            item.user
                    });
                }


                if(
                    item &&
                    typeof item.aura === "string"
                ){

                    messages.push({

                        role:"assistant",

                        content:
                            item.aura
                    });
                }

            }
        );


    messages.push({

        role:"user",

        content:
            String(text)
    });


    try{

        /*
          Puter dokümantasyonundaki
          messages formatı kullanılıyor.
        */

        const response =
            await puter.ai.chat(
                messages,
                {
                    model:
                        "gpt-5.4-nano",

                    temperature:
                        0.5,

                    max_tokens:
                        1200
                }
            );


        const answer =
            extractAIText(
                response
            );


        if(!answer){

            throw new Error(
                "AI boş cevap döndürdü."
            );
        }


        return answer.trim();

    }catch(error){

        console.error(
            "AURA AI ERROR:",
            error
        );

        throw error;
    }
}


/* =========================
   NORMAL MESAJ GÖNDER
========================= */

let sending =
    false;


async function sendMessage(
    text,
    voiceRequest = false
){

    const clean =
        String(text ?? "")
            .trim();


    if(
        !clean ||
        sending
    ){

        return;
    }


    sending = true;

    sendButton.disabled = true;


    addMessage(
        clean,
        "user"
    );


    input.value = "";


    try{

        const commandResult =
            await handleLocalCommand(
                clean
            );


        if(
            commandResult !== null
        ){

            addMessage(
                commandResult,
                "aura"
            );

            if(
                voiceRequest
            ){

                speak(
                    commandResult
                );
            }

            return;
        }


        const answer =
            await askAI(
                clean
            );


        addMessage(
            answer,
            "aura"
        );


        saveConversation(
            clean,
            answer
        );


        /*
          KRİTİK:
          Normal yazılı mesajlarda
          speak() ÇAĞRILMIYOR.

          Sadece voiceRequest=true
          olduğunda seslendirme yapılır.
        */

        if(
            voiceRequest
        ){

            speak(
                answer
            );
        }

    }catch(error){

        console.error(
            error
        );


        addMessage(
            "AURA bağlantısında bir sorun oluştu. Lütfen tekrar deneyin.",
            "aura"
        );

    }finally{

        sending = false;

        sendButton.disabled =
            false;

        input.focus();
    }
}

function removeEmojis(
    text
){

    return String(text ?? "")

        .replace(
            /[\p{Emoji_Presentation}\p{Extended_Pictographic}]/gu,
            " "
        )

        .replace(
            /\s+/g,
            " "
        )

        .trim();
}


/* =========================
   SES METNİ TEMİZLE
========================= */

function cleanSpeechText(
    text
){

    return removeEmojis(text)

        .replace(
            /https?:\/\/\S+/gi,
            " "
        )

        .replace(
            /[*_#`~|{}[\]<>]/g,
            " "
        )

        .replace(
            /\s+/g,
            " "
        )

        .trim();
}


/* =========================
   SESLENDİRME
========================= */

function speak(
    text
){

    if(
        !("speechSynthesis" in window)
    ){

        return;
    }


    const clean =
        cleanSpeechText(
            text
        );


    if(!clean){

        return;
    }


    window.speechSynthesis.cancel();


    const utterance =
        new SpeechSynthesisUtterance(
            clean
        );


    utterance.lang =
        "tr-TR";

    utterance.rate =
        0.92;

    utterance.pitch =
        1;

    utterance.volume =
        1;


    window.speechSynthesis.speak(
        utterance
    );
}

function localMemoryCommand(
    text
){

    const lower =
        text
            .toLocaleLowerCase(
                "tr-TR"
            )
            .trim();


    const notePrefixes = [

        "not al ",

        "not kaydet ",

        "bunu not al ",

        "bunu kaydet ",

        "hafızana kaydet ",

        "hafizana kaydet "
    ];


    for(
        const prefix
        of notePrefixes
    ){

        if(
            lower.startsWith(
                prefix
            )
        ){

            const value =
                text
                    .slice(
                        prefix.length
                    )
                    .trim();


            if(!value){

                return "Kaydedilecek notu belirt.";
            }


            addMemory(
                "notes",
                value
            );


            return:
                "Not hafızaya kaydedildi.";
        }
    }


    const factPrefixes = [

        "bunu hatırla ",

        "bunu hatirla ",

        "bunu hafızana al ",

        "bunu hafizana al ",

        "bunu unutma "
    ];


    for(
        const prefix
        of factPrefixes
    ){

        if(
            lower.startsWith(
                prefix
            )
        ){

            const value =
                text
                    .slice(
                        prefix.length
                    )
                    .trim();


            if(!value){

                return "Hatırlanacak bilgiyi belirt.";
            }


            addMemory(
                "facts",
                value
            );


            return:
                "Bilgi hafızaya kaydedildi.";
        }
    }


    if(
        lower ===
        "hafızamda ne var" ||
        lower ===
        "hafizamda ne var"
    ){

        const facts =
            memory.facts
                .map(
                    x => x.text
                );

        const notes =
            memory.notes
                .map(
                    x => x.text
                );


        return (
            "Hafızamdaki bilgiler:\n\n" +
            (
                facts.length
                    ? facts.join("\n")
                    : "Kayıtlı bilgi yok."
            ) +
            "\n\nNotlar:\n" +
            (
                notes.length
                    ? notes.join("\n")
                    : "Kayıtlı not yok."
            )
        );
    }


    if(
        lower ===
        "hafızanı temizle" ||
        lower ===
        "hafizani temizle"
    ){

        memory =
            createEmptyMemory();

        saveMemory();

        return:
            "AURA hafızası temizlendi.";
    }


    return null;
    }/* =========================
   GÖREV SİSTEMİ
========================= */

function taskCommand(
    text
){

    const lower =
        text
            .toLocaleLowerCase(
                "tr-TR"
            )
            .trim();


    if(
        lower.startsWith(
            "görev ekle "
        ) ||
        lower.startsWith(
            "gorev ekle "
        )
    ){

        const prefix =
            lower.startsWith(
                "görev ekle "
            )
                ? "görev ekle "
                : "gorev ekle ";


        const title =
            text
                .slice(
                    prefix.length
                )
                .trim();


        if(!title){

            return "Eklenecek görevi belirt.";
        }


        memory.tasks.push({

            id:
                Date.now(),

            title:

                title,

            done:false
        });


        saveMemory();


        return:
            "Görev eklendi: " +
            title;
    }


    if(
        lower ===
        "görevlerim" ||
        lower ===
        "gorevlerim"
    ){

        if(
            memory.tasks.length === 0
        ){

            return:
                "Kayıtlı görev bulunmuyor.";
        }


        return memory.tasks

            .map(
                (task,index) =>

                    `${index + 1}. ` +
                    (
                        task.done
                            ? "✓ "
                            : "○ "
                    ) +
                    task.title
            )

            .join("\n");
    }


    if(
        lower.startsWith(
            "görevi tamamla "
        ) ||
        lower.startsWith(
            "gorevi tamamla "
        )
    ){

        const number =
            parseInt(
                lower
                    .replace(
                        "görevi tamamla ",
                        ""
                    )
                    .replace(
                        "gorevi tamamla ",
                        ""
                    )
                    .trim()
            );


        if(
            !Number.isInteger(number) ||
            number < 1 ||
            number > memory.tasks.length
        ){

            return:
                "Geçerli bir görev numarası belirt.";
        }


        memory.tasks[
            number - 1
        ].done = true;


        saveMemory();


        return:
            "Görev tamamlandı.";
    }


    if(
        lower ===
        "görevleri temizle" ||
        lower ===
        "gorevleri temizle"
    ){

        memory.tasks = [];

        saveMemory();

        return:
            "Görev listesi temizlendi.";
    }


    return null;
}

    if(
        lower ===
        "hatırlatıcıları temizle" ||

        memory.reminders = [];

        saveMemory();

async function readLocalFile(
    file
){

    if(!file){

        return null;
    }


    const name =
        file.name || "";


    const extension =
        name
            .split(".")
            .pop()
            .toLowerCase();


    const supported = [

        "txt",

        "md",

        "csv",

        "json",

        "html",

        "js",

        "css"
    ];


    if(
        !supported.includes(
            extension
        )
    ){

        return:
            "Bu prototipte TXT, MD, CSV, JSON, HTML, JS ve CSS dosyaları okunabiliyor.";
    }


    try{

        const text =
            await file.text();


        const shortened =
            text.length > 15000
                ? text.slice(
                    0,
                    15000
                ) +
                "\n\n[Dosya kısaltıldı.]"
                : text;


        addMessage(
            `Dosya okundu: ${name}\n\n${shortened}`,
            "aura"
        );


        return shortened;

    }catch(error){

        console.error(
            error
        );

        return:
            "Dosya okunamadı.";
    }
}

function openFileReader(){

    const picker =
        document.createElement(
            "input"
        );


    picker.type =
        "file";


    picker.accept =
        ".txt,.md,.csv,.json,.html,.js,.css";


    picker.addEventListener(
        "change",
        async function(){

            const file =
                picker.files?.[0];


            if(!file){

                return;
            }


            await readLocalFile(
                file
            );
        }
    );


    picker.click();
}


/* =========================

async function runAgent(
    command
){

    const task =
        String(command)
            .trim();


    if(!task){

        return:
            "Ajanın yapacağı işlemi belirt.";
    }


    /*
      Ajan sistemi burada
      görevi analiz edip
      uygun yerel işlemi seçer.
    */

    const lower =
        task.toLocaleLowerCase(
            "tr-TR"
        );


    if(
        lower.includes(
            "görev"
        ) ||
        lower.includes(
            "gorev"
        )
    ){

        const result =
            taskCommand(
                task
            );


        if(
            result
        ){

            return result;
        }
    }


    if(
        lower.includes(
            "hatırlat"
        ) ||
        lower.includes(
            "hatirlat"
        )
    ){

        const result =
            reminderCommand(
                task
            );


        if(
            result
        ){

            return result;
        }
    }


    if(
        lower.includes(
            "not"
        ) ||
        lower.includes(
            "hafıza"
        ) ||
        lower.includes(
            "hafiza"
        )
    ){

        const result =
            localMemoryCommand(
                task
            );


        if(
            result
        ){

            return result;
        }
    }


    /*
      Yerel işlem yoksa
      AI'ya görev olarak gönder.
    */

    return await askAI(

        `Sen AURA ajanısın.

Kullanıcının istediği görevi analiz et.

Gerekirse adım adım düşün fakat
kullanıcıya sadece uygulanabilir sonucu ver.

Görev:
${task}`
    );
}

function openWebsite(
    value
){

    let url =
        String(value)
            .trim();


    if(!url){

        return:
            "Açılacak siteyi belirt.";
    }


    if(
        !/^https?:\/\//i.test(
            url
        )
    ){

        url =
            "https://" +
            url;
    }


    window.open(
        url,
        "_blank"
    );


    return:
        "Site açılıyor: " +
        url;
}


/* =========================
   YEREL KOMUTLAR
========================= */

async function handleLocalCommand(
    text
){

    let result;


    result =
        localMemoryCommand(
            text
        );

    if(result !== null){

        return result;
    }


    result =
        taskCommand(
            text
        );

    if(result !== null){

        return result;
    }


    result =
        reminderCommand(
            text
        );

    if(result !== null){

        return result;
    }


    result =
        knowledgeCommand(
            text
        );

    if(result !== null){

        return result;
    }


    const lower =
        text
            .toLocaleLowerCase(
                "tr-TR"
            )
            .trim();


    if(
        lower.startsWith(
            "site aç "
        ) ||
        lower.startsWith(
            "site ac "
        )
    ){

        const prefix =
            lower.startsWith(
                "site aç "
            )
                ? "site aç "
                : "site ac ";


        return openWebsite(
            text.slice(
                prefix.length
            )
        );
    }


    if(
        lower.startsWith(
            "ajan "
        )
    ){

        return await runAgent(
            text.slice(5)
        );
    }


    if(
        lower ===
        "dosya oku"
    ){

        openFileReader();

        return:
            "Dosya seçme ekranı açıldı.";
    }


    if(
        lower ===
        "hafızayı sil" ||
        lower ===
        "hafizayi sil"
    ){

        memory =
            createEmptyMemory();

        history = [];

        saveMemory();

        saveHistory();

        return:
            "AURA'nın hafızası temizlendi.";
    }


    return null;
        }/* =========================
   SAAT / TARİH KOMUTLARI
========================= */

function basicCommand(

){

        text
            .toLocaleLowerCase(

            )

                    }
                );

                .toLocaleDateString(

/* =========================
   HATIRLATICI KONTROLÜ
========================= */

function checkReminders(){

    if(
        !memory.reminders.length
    ){

        return;
    }


    const now =
        new Date();


    /*
      Basit prototip:
      Hatırlatıcı kayıtlarının
      varlığını kontrol eder.
    */

    memory.reminders =
        memory.reminders.filter(
            reminder => {

                if(
                    !reminder.created
                ){

                    return true;
                }


                const created =
                    new Date(
                        reminder.created
                    );


                /*
                   24 saatten eski
                   hatırlatıcıları
                   otomatik silmiyoruz.
                   Sadece kayıtlı tutuyoruz.
                */

                return (
                    now.getTime() -
                    created.getTime()
                ) <
                1000 *
                60 *
                60 *
                24 *
                365;
            }
        );


    saveMemory();
}

            )

        touchStartY =
            event.touches[0].clientY;

document.addEventListener(
    "touchend",
    function(event){

        if(
            touchStartY === null
        ){

            return;
        }


        const endY =
            event.changedTouches[0].clientY;


        const difference =
            endY - touchStartY;


        /*
          Aşağı sürükleme:
          paneli kapat.
        */

        if(
            difference > 80
        ){

            closeChat();
        }


        /*
          Yukarı sürükleme:
          paneli aç.
        */

        if(
            difference < -80
        ){

            openChat();
        }


        touchStartY =
            null;

    },
    {
        passive:true
    }
);
