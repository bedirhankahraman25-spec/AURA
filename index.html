<!DOCTYPE html>

<html lang="tr">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<meta name="theme-color" content="#010712">

<title>AURA AI</title>

<style>

*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,
body{
    width:100%;
    height:100%;
    margin:0;
}

body{
    overflow:hidden;
    font-family:Arial,Helvetica,sans-serif;
    color:#e9fbff;

    background:
        radial-gradient(
            circle at 50% 25%,
            #073c5c 0%,
            #031d31 30%,
            #010b16 62%,
            #000207 100%
        );
}

.background-light{
    position:fixed;
    width:560px;
    height:560px;
    left:50%;
    top:50%;

    transform:
        translate(-50%,-50%);

    border-radius:50%;

    background:
        radial-gradient(
            circle,
            rgba(0,210,255,.13),
            rgba(0,110,210,.05) 43%,
            transparent 72%
        );

    filter:blur(10px);

    pointer-events:none;

    z-index:0;
}

.header{
    width:100%;
    height:58px;

    display:flex;
    align-items:center;
    justify-content:space-between;

    padding:0 18px;

    position:relative;

    z-index:20;

    background:
        rgba(0,5,12,.88);

    border-bottom:
        1px solid
        rgba(0,210,255,.24);

    backdrop-filter:blur(12px);
}

.logo{
    color:#00eaff;

    font-size:20px;

    font-weight:bold;

    letter-spacing:5px;

    text-shadow:
        0 0 9px #00eaff,
        0 0 24px rgba(0,220,255,.55);
}

.status{
    display:flex;

    align-items:center;

    gap:7px;

    color:#55ffcf;

    font-size:9px;

    letter-spacing:2px;
}

.status-dot{
    width:6px;
    height:6px;

    border-radius:50%;

    background:#55ffcf;

    box-shadow:
        0 0 7px #55ffcf,
        0 0 15px #55ffcf;
}

.main{
    width:100%;

    height:
        calc(100dvh - 58px);

    position:relative;

    overflow:hidden;
}

.core{
    position:absolute;

    width:230px;
    height:230px;

    left:50%;
    top:50%;

    transform:
        translate(-50%,-50%)
        scale(1.12);

    display:flex;

    align-items:center;

    justify-content:center;

    z-index:30;

    cursor:pointer;

    transition:
        top .55s cubic-bezier(.2,.8,.2,1),
        transform .55s cubic-bezier(.2,.8,.2,1);
}

.main.panel-open .core{
    top:-12px;

    transform:
        translateX(-50%)
        scale(.70);
}

.main.panel-closed .core{
    top:50%;

    transform:
        translate(-50%,-50%)
        scale(1.12);
}

.ring{
    position:absolute;

    border-radius:50%;

    border:
        1px solid
        rgba(0,225,255,.60);

    box-shadow:
        0 0 9px
        rgba(0,220,255,.18);

    pointer-events:none;
}

.ring-one{
    width:158px;
    height:158px;

    border-left-color:transparent;

    border-right-color:transparent;

    animation:
        rotateOne 7s linear infinite;
}

.ring-two{
    width:194px;
    height:194px;

    border-top-color:transparent;

    border-bottom-color:transparent;

    animation:
        rotateTwo 10s linear infinite;
}

.core-glow{
    position:absolute;

    width:160px;
    height:160px;

    border-radius:50%;

    background:
        radial-gradient(
            circle,
            rgba(0,235,255,.28),
            rgba(0,125,220,.08) 48%,
            transparent 72%
        );

    filter:blur(9px);

    pointer-events:none;

    animation:
        glowPulse 3s ease-in-out infinite;
}

.sphere{
    width:116px;
    height:116px;

    display:flex;

    align-items:center;

    justify-content:center;

    position:relative;

    border-radius:50%;

    z-index:6;

    background:
        radial-gradient(
            circle at 32% 27%,
            #caffff 0%,
            #38eaff 8%,
            #0788a9 25%,
            #034866 46%,
            #012238 68%,
            #000a13 100%
        );

    border:
        2px solid
        rgba(125,250,255,.95);

    box-shadow:
        0 0 14px #00eaff,
        0 0 38px rgba(0,220,255,.75),
        0 0 75px rgba(0,110,255,.40),
        inset -16px -16px 27px rgba(0,0,0,.58),
        inset 10px 8px 18px rgba(180,255,255,.38);

    animation:
        spherePulse 2.7s ease-in-out infinite;
}

.core-name{
    color:#ecffff;

    font-size:17px;

    font-weight:bold;

    letter-spacing:4px;

    text-shadow:
        0 0 5px #ffffff,
        0 0 12px #00eaff,
        0 0 25px #009dff;

    z-index:10;

    pointer-events:none;
}

@keyframes spherePulse{

    0%,100%{
        transform:scale(1);
    }

    50%{
        transform:scale(1.07);
    }
}

@keyframes glowPulse{

    0%,100%{
        transform:scale(1);
        opacity:.65;
    }

    50%{
        transform:scale(1.14);
        opacity:1;
    }
}

@keyframes rotateOne{

    from{
        transform:rotate(0deg);
    }

    to{
        transform:rotate(360deg);
    }
}

@keyframes rotateTwo{

    from{
        transform:rotate(360deg);
    }

    to{
        transform:rotate(0deg);
    }
}

.chat-panel{
    position:absolute;

    left:50%;
    bottom:0;

    width:min(92%,640px);

    height:
        calc(100% - 190px);

    transform:
        translateX(-50%);

    display:flex;

    flex-direction:column;

    z-index:10;

    background:
        rgba(1,11,21,.76);

    border:
        1px solid
        rgba(0,180,255,.20);

    border-bottom:0;

    border-radius:
        20px 20px 0 0;

    backdrop-filter:blur(12px);

    overflow:hidden;

    touch-action:none;

    transition:
        height .45s ease,
        transform .45s ease,
        opacity .35s ease;
}

.main.panel-closed .chat-panel{

    height:0;

    transform:
        translateX(-50%)
        translateY(25px);

    opacity:0;

    pointer-events:none;
}

#chat{
    width:100%;
    height:100%;

    overflow-y:auto;

    padding:
        15px 12px 18px;

    scrollbar-width:thin;

    scrollbar-color:
        #0086ae
        transparent;
}

#chat::-webkit-scrollbar{
    width:3px;
}

#chat::-webkit-scrollbar-thumb{
    background:#008db8;

    border-radius:10px;
}

.message{
    max-width:80%;

    padding:
        10px 13px;

    margin-bottom:10px;

    border-radius:12px;

    font-size:13px;

    line-height:1.45;

    white-space:pre-wrap;

    animation:
        messageIn .2s ease;
}

@keyframes messageIn{

    from{
        opacity:0;
        transform:translateY(6px);
    }

    to{
        opacity:1;
        transform:translateY(0);
    }
}

.message.aura{
    margin-left:0;
    margin-right:auto;

    color:#ddfaff;

    background:
        linear-gradient(
            135deg,
            rgba(3,59,79,.82),
            rgba(1,24,39,.88)
        );

    border-left:
        2px solid
        #00eaff;

    border-top-left-radius:3px;
}

.message.user{
    margin-left:auto;
    margin-right:0;

    color:#ffffff;

    background:
        linear-gradient(
            135deg,
            rgba(8,94,127,.92),
            rgba(3,48,77,.95)
        );

    border-right:
        2px solid
        #4dffcf;

    border-top-right-radius:3px;
}.bottom{
    position:absolute;

    left:50%;
    bottom:0;

    width:min(92%,640px);

    transform:translateX(-50%);

    padding:9px 8px 10px;

    z-index:15;

    background:
        linear-gradient(
            180deg,
            #041d31,
            #020d1b
        );

    border:
        1px solid
        rgba(0,180,255,.22);

    border-radius:
        0 0 20px 20px;
}

.main.panel-closed .bottom{
    transform:
        translate(-50%,120px);

    opacity:0;

    pointer-events:none;
}

.composer{
    height:48px;

    display:flex;

    align-items:center;

    gap:7px;

    padding:
        4px 5px 4px 13px;

    border-radius:14px;

    background:#041b2d;

    border:
        1px solid
        rgba(0,190,255,.32);
}

.composer:focus-within{
    border-color:
        rgba(0,225,255,.75);

    box-shadow:
        0 0 18px
        rgba(0,180,255,.12);
}

#input{
    flex:1;

    min-width:0;

    height:100%;

    border:0;

    outline:0;

    background:transparent;

    color:#ffffff;

    font-size:13px;
}

#input::placeholder{
    color:#54798a;
}

.button{
    width:40px;

    height:40px;

    flex-shrink:0;

    border:0;

    border-radius:11px;

    cursor:pointer;

    color:#00eaff;

    background:#062b43;

    font-size:16px;
}

.button:active{
    transform:scale(.90);
}

.send{
    color:#001923;

    background:
        linear-gradient(
            135deg,
            #00eaff,
            #4dffcf
        );

    box-shadow:
        0 0 15px
        rgba(0,220,255,.25);
}

.tool-panel{
    position:absolute;

    top:65px;

    right:10px;

    width:245px;

    max-height:70vh;

    overflow-y:auto;

    padding:10px;

    z-index:50;

    display:none;

    background:
        rgba(2,18,31,.96);

    border:
        1px solid
        rgba(0,220,255,.35);

    border-radius:14px;

    box-shadow:
        0 0 30px
        rgba(0,180,255,.18);
}

.tool-panel.active{
    display:block;
}

.tool-title{
    color:#00eaff;

    font-size:11px;

    letter-spacing:2px;

    margin-bottom:8px;
}

.tool-item{
    padding:8px;

    margin-bottom:5px;

    border-radius:8px;

    background:
        rgba(0,100,140,.16);

    color:#bceeff;

    font-size:11px;
}

@media(max-width:500px){

    .core{
        transform:
            translate(-50%,-50%)
            scale(1.08);
    }

    .main.panel-open .core{
        top:-10px;

        transform:
            translateX(-50%)
            scale(.66);
    }

    .main.panel-closed .core{
        transform:
            translate(-50%,-50%)
            scale(1.08);
    }

    .chat-panel,
    .bottom{
        width:96%;
    }

    .message{
        max-width:88%;
    }

    .composer{
        height:46px;
    }

    .button{
        width:38px;

        height:38px;
    }
}

</style>

</head>

<body>

<div class="background-light"></div>

<div class="header">

    <div class="logo">
        AURA
    </div>

    <div class="status">

        <span class="status-dot"></span>

        SYSTEM ONLINE

    </div>

</div>

<div
    class="main panel-closed"
    id="main"
>

    <div
        class="core"
        id="core"
    >

        <div
            class="ring ring-one">
        </div>

        <div
            class="ring ring-two">
        </div>

        <div
            class="core-glow">
        </div>

        <div class="sphere">

            <div class="core-name">
                AURA
            </div>

        </div>

    </div>

    <div
        class="chat-panel"
        id="chatPanel"
    >

        <div id="chat">

            <div class="message aura">

                Selam Bedirhan, sistem hazır. Seni dinliyorum.

            </div>

        </div>

    </div>

    <div
        class="bottom"
        id="bottom"
    >

        <div class="composer">

            <input
                id="input"
                type="text"
                placeholder="AURA'ya mesaj yaz..."
                autocomplete="off"
            >

            <button
                class="button"
                id="mic"
                type="button"
            >
                🎙
            </button>

            <button
                class="button send"
                id="send"
                type="button"
            >
                ➤
            </button>

        </div>

    </div>

</div>

<script src="https://js.puter.com/v2/"></script>

<script>/* =========================
   ELEMENTLER
========================= */

const main =
    document.getElementById("main");

const core =
    document.getElementById("core");

const chatPanel =
    document.getElementById("chatPanel");

const input =
    document.getElementById("input");

const send =
    document.getElementById("send");

const mic =
    document.getElementById("mic");

const chat =
    document.getElementById("chat");


/* =========================
   AURA KİMLİĞİ
========================= */

const AURA_NAME =
    "AURA";

const USER_NAME =
    "Bedirhan Kahraman";

const GIRLFRIEND_NAME =
    "Edanur";


/* =========================
   HAFIZA
========================= */

const MEMORY_KEY =
    "AURA_COMPLETE_MEMORY_V1";

const TASK_KEY =
    "AURA_TASKS_V1";

const REMINDER_KEY =
    "AURA_REMINDERS_V1";

const HISTORY_KEY =
    "AURA_HISTORY_V1";


function emptyMemory(){

    return {
        facts:[],
        preferences:[],
        notes:[],
        knowledge:[]
    };
}


function loadJSON(
    key,
    fallback
){

    try{

        const data =
            localStorage.getItem(key);

        if(!data){
            return fallback;
        }

        return JSON.parse(data);

    }catch(error){

        console.error(
            "Veri okunamadı:",
            error
        );

        return fallback;
    }
}


let memory =
    loadJSON(
        MEMORY_KEY,
        emptyMemory()
    );

let tasks =
    loadJSON(
        TASK_KEY,
        []
    );

let reminders =
    loadJSON(
        REMINDER_KEY,
        []
    );

let history =
    loadJSON(
        HISTORY_KEY,
        []
    );


function saveAll(){

    try{

        localStorage.setItem(
            MEMORY_KEY,
            JSON.stringify(memory)
        );

        localStorage.setItem(
            TASK_KEY,
            JSON.stringify(tasks)
        );

        localStorage.setItem(
            REMINDER_KEY,
            JSON.stringify(reminders)
        );

        localStorage.setItem(
            HISTORY_KEY,
            JSON.stringify(history.slice(-40))
        );

    }catch(error){

        console.error(
            "Kayıt hatası:",
            error
        );
    }
}


/* =========================
   HAFIZA EKLEME
========================= */

function addMemory(
    type,
    text
){

    if(
        !memory[type]
    ){

        memory[type] = [];

    }

    memory[type].push({

        text:text,

        date:
            new Date()
            .toLocaleString("tr-TR")

    });

    saveAll();
}


function memoryText(){

    let result = "";

    if(memory.facts.length){

        result +=
            "Bilgiler:\n";

        memory.facts.forEach(
            item => {

                result +=
                    "- " +
                    item.text +
                    "\n";

            }
        );
    }

    if(memory.preferences.length){

        result +=
            "\nTercihler:\n";

        memory.preferences.forEach(
            item => {

                result +=
                    "- " +
                    item.text +
                    "\n";

            }
        );
    }

    if(memory.notes.length){

        result +=
            "\nNotlar:\n";

        memory.notes.forEach(
            item => {

                result +=
                    "- " +
                    item.text +
                    "\n";

            }
        );
    }

    if(memory.knowledge.length){

        result +=
            "\nBilgi tabanı:\n";

        memory.knowledge.forEach(
            item => {

                result +=
                    "- " +
                    item.text +
                    "\n";

            }
        );
    }

    return result ||
        "Özel kayıt bulunmuyor.";
}


/* =========================
   SİSTEM PROMPT
========================= */

function buildSystemPrompt(){

    return `
Sen AURA adında kişisel yapay zeka asistanısın.

Türkçe konuş.

Kullanıcı:
${USER_NAME}

Kullanıcının sevgilisi:
${GIRLFRIEND_NAME}

Önemli:
- Kullanıcıya her cevapta Bedirhan diye hitap etme.
- Doğal konuş.
- Gereksiz tekrar yapma.
- Bilmediğin bilgiyi uydurma.
- Kendini AURA olarak tanıt.
- Kullanıcı "ben kimim" derse Bedirhan Kahraman olduğunu söyle.
- Kullanıcı sevgilimi/sevgilim kim derse Edanur olduğunu söyle.
- Kullanıcı Edanur hakkında soru sorarsa bağlama göre cevap ver.
- Tarih, saat ve basit hesaplama sorularında doğrudan cevap ver.
- Kullanıcının hafızasındaki bilgileri gerektiğinde kullan.

KALICI HAFIZA:

${memoryText()}

GÖREVLER:

${tasks.length
    ? tasks.map(
        (x,i) =>
        `${i+1}. ${x.text} ${x.done ? "[TAMAM]" : "[BEKLIYOR]"}`
      ).join("\n")
    : "Görev bulunmuyor."}
`;
}


/* =========================
   MESAJ
========================= */

function addMessage(
    text,
    type
){

    const message =
        document.createElement(
            "div"
        );

    message.className =
        "message " + type;

    message.textContent =
        text;

    chat.appendChild(
        message
    );

    chat.scrollTop =
        chat.scrollHeight;
}/* =========================
   HAFIZA KOMUTLARI
========================= */

function handleMemoryCommand(
    text
){

    const lower =
        text
        .toLocaleLowerCase("tr-TR")
        .trim();


    const notePrefixes = [

        "not al ",
        "not kaydet ",
        "bunu not al ",
        "bunu kaydet ",
        "hafızana kaydet ",
        "hafizana kaydet "

    ];


    for(
        const prefix
        of notePrefixes
    ){

        if(
            lower.startsWith(prefix)
        ){

            const value =
                text
                .substring(prefix.length)
                .trim();

            if(!value){

                return {
                    handled:true,
                    response:
                        "Kaydedilecek notu belirt."
                };

            }

            addMemory(
                "notes",
                value
            );

            return {
                handled:true,
                response:
                    "Not hafızaya kaydedildi."
            };
        }
    }


    const factPrefixes = [

        "bunu hatırla ",
        "bunu hatirla ",
        "bunu hafızana al ",
        "bunu hafizana al ",
        "bunu unutma "

    ];


    for(
        const prefix
        of factPrefixes
    ){

        if(
            lower.startsWith(prefix)
        ){

            const value =
                text
                .substring(prefix.length)
                .trim();

            if(!value){

                return {
                    handled:true,
                    response:
                        "Hatırlamam gereken bilgiyi belirt."
                };

            }

            addMemory(
                "facts",
                value
            );

            return {
                handled:true,
                response:
                    "Bilgi kalıcı hafızaya kaydedildi."
            };
        }
    }


    const preferencePrefixes = [

        "tercihimi hatırla ",
        "tercihimi hatirla ",
        "şunu seviyorum ",
        "sunu seviyorum ",
        "şunu sevmiyorum ",
        "sunu sevmiyorum "

    ];


    for(
        const prefix
        of preferencePrefixes
    ){

        if(
            lower.startsWith(prefix)
        ){

            const value =
                text
                .substring(prefix.length)
                .trim();

            if(!value){

                return {
                    handled:true,
                    response:
                        "Tercihi belirt."
                };

            }

            addMemory(
                "preferences",
                value
            );

            return {
                handled:true,
                response:
                    "Tercih hafızaya kaydedildi."
            };
        }
    }


    if(

        lower ===
        "hafızamda ne var"

        ||

        lower ===
        "hafizamda ne var"

        ||

        lower ===
        "neyi hatırlıyorsun"

        ||

        lower ===
        "neyi hatirliyorsun"

    ){

        return {
            handled:true,
            response:
                memoryText()
        };
    }


    if(

        lower ===
        "hafızayı temizle"

        ||

        lower ===
        "hafizayi temizle"

        ||

        lower ===
        "hafızanı temizle"

        ||

        lower ===
        "hafizani temizle"

    ){

        memory =
            emptyMemory();

        saveAll();

        return {
            handled:true,
            response:
                "Kalıcı hafıza temizlendi."
        };
    }


    return {
        handled:false
    };
}


/* =========================
   BİLGİ TABANI
========================= */

function addKnowledge(
    text
){

    memory.knowledge.push({

        text:text,

        date:
            new Date()
            .toLocaleString("tr-TR")

    });

    saveAll();
}


function handleKnowledgeCommand(
    text
){

    const lower =
        text
        .toLocaleLowerCase("tr-TR")
        .trim();


    const prefixes = [

        "bilgi ekle ",
        "bilgiyi kaydet ",
        "auraya bilgi ekle ",
        "aura'ya bilgi ekle ",
        "auraya öğret ",
        "aura'ya öğret "

    ];


    for(
        const prefix
        of prefixes
    ){

        if(
            lower.startsWith(prefix)
        ){

            const value =
                text
                .substring(prefix.length)
                .trim();

            if(!value){

                return {
                    handled:true,
                    response:
                        "Eklenecek bilgiyi belirt."
                };

            }

            addKnowledge(value);

            return {
                handled:true,
                response:
                    "Bilgi tabanına eklendi."
            };
        }
    }


    return {
        handled:false
    };
}


/* =========================
   GÖREV SİSTEMİ
========================= */

function addTask(
    text
){

    tasks.push({

        id:Date.now(),

        text:text,

        done:false,

        created:
            new Date()
            .toLocaleString("tr-TR")

    });

    saveAll();
}


function taskText(){

    if(!tasks.length){

        return "Görev listesi boş.";
    }

    return tasks
        .map(
            (task,index) =>
                `${index+1}. ${
                    task.done
                    ? "✓"
                    : "○"
                } ${task.text}`
        )
        .join("\n");
}


function handleTaskCommand(
    text
){

    const lower =
        text
        .toLocaleLowerCase("tr-TR")
        .trim();


    const prefixes = [

/* =========================

========================= */

function calculationCommand(
    text
){

    const lower =
        text
        .toLocaleLowerCase("tr-TR")
        .trim();


    if(
        !(
            lower.startsWith("hesapla ")

            ||

            lower.startsWith("hesap ")

            ||

            lower.startsWith("kaç eder ")

            ||

            lower.startsWith("kac eder ")
        )
    ){

        return {
            handled:false
        };
    }


    let expression =
        text
        .replace(
            /^hesapla\s*/i,
            ""
        )
        .replace(
            /^hesap\s*/i,
            ""
        )
        .replace(
            /^kaç eder\s*/i,
            ""
        )
        .replace(
            /^kac eder\s*/i,
            ""
        )
        .trim();


    expression =
        expression
        .replace(/,/g,".")
        .replace(/×/g,"*")
        .replace(/÷/g,"/")
        .replace(/[^0-9+\-*/().%\s]/g,"");


    if(!expression){

        return {
            handled:true,
            response:
                "Hesaplanacak işlemi anlayamadım."
        };
    }


    try{

        if(
            !/^[0-9+\-*/().%\s]+$/
                .test(expression)
        ){

            throw new Error(
                "Geçersiz işlem"
            );
        }


        const result =
            Function(
                '"use strict"; return (' +
                expression +
                ')'
            )();


        if(
            typeof result !== "number" ||
            !Number.isFinite(result)
        ){

            throw new Error(
                "Sonuç geçersiz"
            );
        }


        return {
            handled:true,
            response:
                "Sonuç: " +
                result
        };

    }catch(error){

        return {
            handled:true,
            response:
                "Bu işlemi hesaplayamadım."
        };
    }
}

/* =========================
   AI CEVABI AYIKLA
========================= */

function extractAIText(
    response
){

    if(!response){

        return "";
    }


    if(
        typeof response ===
        "string"
    ){

        return response.trim();
    }


    if(
        response.message &&
        typeof response.message.content ===
        "string"
    ){

        return response
            .message
            .content
            .trim();
    }


    if(
        Array.isArray(
            response?.message?.content
        )
    ){

        return response
            .message
            .content
            .map(
                part =>
                    typeof part ===
                    "string"
                    ? part
                    : part?.text || ""
            )
            .join("")
            .trim();
    }


    if(
        typeof response.text ===
        "string"
    ){

        return response.text.trim();
    }


    return "";
}

async function askAI(
    text,
    useWeb = false
){

    if(
        typeof puter ===
        "undefined"
    ){

        throw new Error(
            "Puter AI yüklenemedi."
        );
    }


    const messages = [

        {
            role:"system",
            content:
                buildSystemPrompt()
        }

    ];


    history
        .slice(-12)
        .forEach(
            item => {

                messages.push({

                    role:"user",

                    content:item.user

                });

                messages.push({

                    role:"assistant",

                    content:item.aura

                });

            }
        );


    messages.push({

        role:"user",

        content:text

    });


    const options = {

        model:
            "gpt-5.4-nano"

    };


    if(useWeb){

        options.tools = [

            {
                type:"web_search"
            }

        ];

    }


    const response =
        await puter.ai.chat(
            messages,
            options
        );


    const answer =
        extractAIText(
            response
        );


    if(!answer){

        throw new Error(
            "AI boş cevap verdi."
        );
    }


    saveConversation(
        text,
        answer
    );


    return answer;
}

async function readFileContent(
    file
){

    if(!file){

        return "";
    }


    const name =
        file.name
        .toLocaleLowerCase("tr-TR");


    if(
        name.endsWith(".txt") ||
        name.endsWith(".md") ||
        name.endsWith(".csv") ||
        name.endsWith(".json")
    ){

        return await file.text();

    }


    if(
        name.endsWith(".html") ||
        name.endsWith(".htm")
    ){

        return await file.text();

    }


    return "";
}


/* =========================
   DOSYA SEÇ
========================= */

function chooseFile(){

    return new Promise(
        resolve => {

            const picker =
                document.createElement(
                    "input"
                );

            picker.type =
                "file";

            picker.accept =
                ".txt,.md,.csv,.json,.html,.htm";


            picker.onchange =
                async function(){

                    const file =
                        picker.files[0];

                    if(!file){

                        resolve(null);

                        return;
                    }


                    try{

                        const content =
                            await readFileContent(
                                file
                            );

                        resolve({

                            name:file.name,

                            content:content

                        });

                    }catch(error){

                        resolve({

                            name:file.name,

                            content:""

                        });

                    }

                };


            picker.click();

        }
    );
    }/* =========================
   DOSYA OKUMA KOMUTU

function addReminder(
    text,
    minutes
){

    const reminder = {

        id:Date.now(),

        text:text,

        time:
            Date.now() +
            minutes * 60 * 1000,

        created:
            new Date()
            .toLocaleString("tr-TR")

    };


    reminders.push(
        reminder
    );

    saveAll();


    setTimeout(
        function(){

            const current =
                reminders.find(
                    item =>
                        item.id ===
                        reminder.id
                );


            if(!current){

                return;
            }


            addMessage(
                "Hatırlatıcı: " +
                reminder.text,
                "aura"
            );


            speak(
                "Hatırlatıcı. " +
                reminder.text
            );


            reminders =
                reminders.filter(
                    item =>
                        item.id !==
                        reminder.id
                );


            saveAll();

        },
        minutes * 60 * 1000
    );
}


/* =========================
   HATIRLATICI KOMUTU
========================= */

function reminderCommand(
    text
){

    const lower =
        text
        .toLocaleLowerCase("tr-TR")
        .trim();


    const match =
        lower.match(
            /(.+?)\s+(\d+)\s*(dakika|dk)\s+sonra/
        );


    if(!match){

        return {
            handled:false
        };
    }


    const reminderText =
        match[1]
        .replace(
            /^(hatırlat|hatirlat)\s*/i,
            ""
        )
        .trim();


    const minutes =
        Number(
            match[2]
        );


    if(
        !reminderText ||
        !Number.isFinite(minutes) ||
        minutes <= 0
    ){

        return {
            handled:true,
            response:
                "Hatırlatıcı komutunu anlayamadım."
        };
    }


    addReminder(
        reminderText,
        minutes
    );


    return {

        handled:true,

        response:
            `${minutes} dakika sonra "${reminderText}" için hatırlatacağım.`

    };
}


/* =========================
   KALICI HATIRLATICILARI
   AÇILIŞTA YÜKLE
========================= */

function restoreReminders(){

    const now =
        Date.now();


    const active =
        [];


    reminders.forEach(
        reminder => {

            const remaining =
                reminder.time -
                now;


            if(
                remaining <= 0
            ){

                addMessage(
                    "Geçmiş hatırlatıcı: " +
                    reminder.text,
                    "aura"
                );

                speak(
                    "Hatırlatıcı. " +
                    reminder.text
                );

            }else{

                active.push(
                    reminder
                );


                setTimeout(
                    function(){

                        addMessage(
                            "Hatırlatıcı: " +
                            reminder.text,
                            "aura"
                        );


                        speak(
                            "Hatırlatıcı. " +
                            reminder.text
                        );


                        reminders =
                            reminders.filter(
                                item =>
                                    item.id !==
                                    reminder.id
                            );


                        saveAll();

                    },
                    remaining
                );

            }

        }
    );


    reminders =
        active;

    saveAll();
}

){

        Number(number) - 1;


    if(

    tasks[index].done =

    saveAll();

    return true;

){

    const handlers = [

        reminderCommand,

        completeTaskCommand,

        fileCommand,

        agentCommand,

        systemCommand

    ];


    for(
        const handler
        of handlers
    ){

        try{

            const result =
                await handler(text);


            if(
                result &&
                result.handled
            ){

                if(
                    result.agent
                ){

                    return await runAgent(
                        result
                    );

                }


                return result.response;
            }

        }catch(error){

            console.error(
                "Komut hatası:",
                error
            );

            return null;
        }

    }


    return null;

        )

        .replace(
            /[()[\]{}<>]/g,
            " "
        )

        .replace(
            /\s+/g,
            " "
        )

        .trim();

}


/* =========================
   KONUŞ
========================= */

function speak(
    text
){

    if(
        !("speechSynthesis" in window)
    ){

        return;
    }


    const clean =
        cleanSpeechText(
            text
        );


    if(!clean){

        return;
    }


    speechSynthesis.cancel();


    const utterance =
        new SpeechSynthesisUtterance(
            clean
        );


    utterance.lang =
        "tr-TR";


    if(selectedVoice){

        utterance.voice =
            selectedVoice;

    }


    utterance.rate =
        0.92;


    utterance.pitch =
        1;


    utterance.volume =
        1;


    speechSynthesis.speak(
        utterance
    );

}


/* =========================
   SESLİ GİRİŞ
========================= */

let recognition =
    null;

let listening =
    false;


function setupSpeechRecognition(){

    const SpeechRecognition =
        window.SpeechRecognition ||

        window.webkitSpeechRecognition;


    if(!SpeechRecognition){

        return false;
    }


    recognition =
        new SpeechRecognition();


    recognition.lang =
        "tr-TR";


    recognition.continuous =
        false;


    recognition.interimResults =
        false;


    recognition.maxAlternatives =
        1;


    recognition.onstart =
        function(){

            listening =
                true;

            mic.textContent =
                "■";

            mic.style.color =
                "#ff6075";

        };


    recognition.onend =
        function(){

            listening =
                false;

            mic.textContent =
                "🎙";

            mic.style.color =
                "";

        };


    recognition.onerror =
        function(error){

            console.error(
                "Ses tanıma hatası:",
                error
            );


            listening =
                false;

            mic.textContent =
                "🎙";

            mic.style.color =
                "";

        };


    recognition.onresult =
        function(event){

            const result =
                event
                .results[0][0]
                .transcript;


            input.value =
                result;


            sendMessage();

        };


    return true;

}


const speechReady =
    setupSpeechRecognition();


/* =========================
   MİKROFON BUTONU
========================= */

mic.addEventListener(
    "click",
    function(){

        if(!speechReady){

            addMessage(
                "Bu tarayıcı sesli girişi desteklemiyor.",
                "aura"
            );

            return;
        }


        try{

            if(listening){

                recognition.stop();

            }else{

                recognition.start();

            }

        }catch(error){

            console.error(
                "Mikrofon hatası:",
                error
            );

        }

    }
);


/* =========================
   MESAJ GÖNDERME
========================= */

let sending =
    false;


async function sendMessage(){

    if(sending){

        return;
    }


    const text =
        input.value.trim();


    if(!text){

        return;
    }


    sending =
        true;


    input.value =
        "";


    addMessage(
        text,
        "user"
    );


    send.disabled =
        true;


    mic.disabled =
        true;


    try{

        /* Önce yerel komutları kontrol et */

        let localResult =
            await localCommand(
                text
            );


        /* Daha sonra gelişmiş komutları kontrol et */

        if(
            localResult ===
            null
        ){

            localResult =
                await processCommand(
                    text
                );

        }


        /* Yerel cevap bulunduysa AI'ya gitme */

        if(
            localResult !==
            null
        ){

            addMessage(
                localResult,
                "aura"
            );


            speak(
                localResult
            );


            return;
        }


        /* Normal AI sohbeti */

        const useWeb =
            needsWebSearch(
                text
            );


        const answer =
            await askAI(
                text,
                useWeb
            );


        addMessage(
            answer,
            "aura"
        );


        speak(
            answer
        );


    }catch(error){

        console.error(
            "Mesaj gönderme hatası:",
            error
        );


        const fallback =
            "Şu anda cevap oluştururken bir sorun oluştu. Lütfen tekrar dene.";


        addMessage(
            fallback,
            "aura"
        );


    }finally{

        sending =
            false;


        send.disabled =
            false;


        mic.disabled =
            false;


        input.focus();

    }

}


/* =========================
   GÖNDER BUTONU
========================= */

send.addEventListener(
    "click",
    sendMessage
);


/* =========================
   ENTER İLE GÖNDER
========================= */

input.addEventListener(
    "keydown",
    function(event){

        if(
            event.key ===
            "Enter"
        ){

            event.preventDefault();

            sendMessage();

        }

    }
);/* =========================
   ÇEKİRDEK / PANEL KONTROLÜ
========================= */

let panelOpen =
    false;


function openPanel(){

    panelOpen =
        true;

    main.classList.remove(
        "panel-closed"
    );

    main.classList.add(
        "panel-open"
    );

}


function closePanel(){

    panelOpen =
        false;

    main.classList.remove(
        "panel-open"
    );

    main.classList.add(
        "panel-closed"
    );

}


/* Çekirdeğe dokununca sohbet açılır/kapanır */

core.addEventListener(
    "click",
    function(){

        if(panelOpen){

            closePanel();

        }else{

            openPanel();

        }

    }
);


/* =========================
   SÜRÜKLEYEREK PANEL AÇ/KAPAT
========================= */

let touchStartY =
    null;

let touchCurrentY =
    null;


main.addEventListener(
    "touchstart",
    function(event){

        if(
            event.touches.length !== 1
        ){

            return;
        }


        touchStartY =
            event.touches[0].clientY;

        touchCurrentY =
            touchStartY;

    },
    {
        passive:true
    }
);


main.addEventListener(
    "touchmove",
    function(event){

        if(
            touchStartY === null
        ){

            return;
        }


        touchCurrentY =
            event.touches[0].clientY;

    },
    {
        passive:true
    }
);


main.addEventListener(
    "touchend",
    function(){

        if(
            touchStartY === null ||
            touchCurrentY === null
        ){

            return;
        }


        const difference =
            touchCurrentY -
            touchStartY;


        /*
         * Yukarı sürükleme:
         * Panel açılır.
         */

        if(
            difference < -60
        ){

            openPanel();

        }


        /*
         * Aşağı sürükleme:
         * Panel kapanır.
         */

        else if(
            difference > 60
        ){

            closePanel();

        }


        touchStartY =
            null;

        touchCurrentY =
            null;

    }
);

   BAŞLANGIÇ
