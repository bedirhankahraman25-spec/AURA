<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#02060a">
<title>AURA AI</title>

<style>
*{box-sizing:border-box}

html,body{
    margin:0;
    width:100%;
    height:100%;
}

body{
    overflow:hidden;
    font-family:Arial,sans-serif;
    color:#00eaff;
    background:
        radial-gradient(circle at center,#06303d 0%,#02080c 50%,#000 100%);
}

.top-bar{
    height:60px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 18px;
    background:rgba(0,10,15,.9);
    border-bottom:1px solid rgba(0,234,255,.4);
}

.logo{
    font-size:21px;
    font-weight:bold;
    letter-spacing:4px;
    text-shadow:0 0 10px #00eaff,0 0 25px #00eaff;
}

.status{
    font-size:11px;
    letter-spacing:2px;
    color:#55ffcc;
}

.status::before{
    content:"";
    display:inline-block;
    width:7px;
    height:7px;
    margin-right:7px;
    border-radius:50%;
    background:#55ffcc;
    box-shadow:0 0 8px #55ffcc,0 0 15px #55ffcc;
}

.main{
    height:calc(100vh - 60px);
    height:calc(100dvh - 60px);
    display:flex;
    flex-direction:column;
    align-items:center;
    min-height:0;
}

.aura-core{
    width:210px;
    height:210px;
    margin-top:10px;
    position:relative;
    display:flex;
    align-items:center;
    justify-content:center;
    flex-shrink:0;
}

.aura-ring{
    position:absolute;
    border-radius:50%;
    border:1px solid #00eaff;
    opacity:.7;
}

.ring1{
    width:135px;
    height:135px;
    border-left-color:transparent;
    border-right-color:transparent;
    animation:rotate1 7s linear infinite;
}

.ring2{
    width:175px;
    height:175px;
    border-top-color:transparent;
    border-bottom-color:transparent;
    animation:rotate2 10s linear infinite;
}

.ring3{
    width:210px;
    height:210px;
    border-left-color:transparent;
    border-bottom-color:transparent;
    animation:rotate1 14s linear infinite;
}

.aura-center{
    width:100px;
    height:100px;
    border-radius:50%;
    border:2px solid #00eaff;
    display:flex;
    align-items:center;
    justify-content:center;
    color:#00eaff;
    font-size:21px;
    font-weight:bold;
    letter-spacing:3px;
    background:radial-gradient(circle,#064454,#02090d);
    box-shadow:
        0 0 15px #00eaff,
        0 0 45px rgba(0,234,255,.7),
        inset 0 0 25px rgba(0,234,255,.5);
    animation:pulse 2.2s infinite ease-in-out;
    z-index:5;
}

@keyframes rotate1{
    from{transform:rotate(0deg)}
    to{transform:rotate(360deg)}
}

@keyframes rotate2{
    from{transform:rotate(360deg)}
    to{transform:rotate(0deg)}
}

@keyframes pulse{
    0%,100%{transform:scale(1)}
    50%{transform:scale(1.06)}
}

.aura-status{
    margin-top:-8px;
    margin-bottom:5px;
    font-size:10px;
    letter-spacing:3px;
    color:#8defff;
}

#chat{
    width:min(92%,600px);
    flex:1;
    min-height:0;
    overflow-y:auto;
    padding:5px 5px 10px;
}

.message{
    max-width:85%;
    padding:10px 13px;
    margin-bottom:10px;
    border-radius:10px;
    line-height:1.4;
    white-space:pre-wrap;
    font-size:14px;
}

.aura{
    background:rgba(0,35,45,.8);
    margin-right:auto;
    border:1px solid rgba(0,234,255,.25);
}

.user{
    background:rgba(0,90,120,.8);
    margin-left:auto;
    color:white;
}

#bottom{
    width:100%;
    min-height:65px;
    display:flex;
    align-items:center;
    gap:8px;
    padding:10px;
    background:rgba(0,10,15,.97);
    border-top:1px solid rgba(0,234,255,.45);
    z-index:10;
}

#input{
    flex:1;
    min-width:0;
    height:45px;
    padding:12px;
    border-radius:8px;
    border:1px solid rgba(0,234,255,.5);
    outline:none;
    background:rgba(0,25,32,.95);
    color:#00eaff;
    font-size:14px;
}

#input::placeholder{
    color:#548995;
}

button{
    height:45px;
    border:1px solid #00eaff;
    border-radius:8px;
    padding:0 14px;
    background:rgba(0,60,75,.9);
    color:#00eaff;
    font-size:14px;
    cursor:pointer;
}

button:active{
    transform:scale(.94);
}

button:disabled{
    opacity:.5;
}

.mic-button{
    width:45px;
    padding:0;
    font-size:20px;
}

@media(max-width:500px){
    .aura-core{
        transform:scale(.82);
        margin-top:0;
        margin-bottom:-15px;
    }

    .logo{
        font-size:18px;
    }

    button{
        padding:0 11px;
    }
}</style>
</head>

<body>

<div class="top-bar">
    <div class="logo">AURA</div>
    <div class="status">ONLINE</div>
</div>

<div class="main">

    <div class="aura-core">
        <div class="aura-ring ring1"></div>
        <div class="aura-ring ring2"></div>
        <div class="aura-ring ring3"></div>

        <div class="aura-center">
            AURA
        </div>
    </div>

    <div class="aura-status">
        AI MEMORY SYSTEM READY
    </div>

    <div id="chat"></div>

    <div id="bottom">

        <input
            id="input"
            type="text"
            placeholder="AURA'ya bir şey sor..."
            autocomplete="off"
        >

        <button
            class="mic-button"
            id="micButton"
            type="button">
            🎤
        </button>

        <button
            id="sendButton"
            type="button">
            Gönder
        </button>

    </div>

</div>

<script src="https://js.puter.com/v2/"></script>

<script>

const chat=document.getElementById("chat");
const input=document.getElementById("input");
const sendButton=document.getElementById("sendButton");
const micButton=document.getElementById("micButton");


/* HAFIZA */

const MEMORY_KEY="AURA_MEMORY_V5";

function emptyMemory(){
    return {
        notes:[],
        facts:[],
        preferences:[]
    };
}

function loadMemory(){

    try{

        const saved=localStorage.getItem(MEMORY_KEY);

        if(!saved){
            return emptyMemory();
        }

        const data=JSON.parse(saved);

        return {
            notes:Array.isArray(data.notes)?data.notes:[],
            facts:Array.isArray(data.facts)?data.facts:[],
            preferences:Array.isArray(data.preferences)
                ?data.preferences:[]
        };

    }catch(error){

        console.error("Hafıza okuma hatası:",error);

        return emptyMemory();
    }
}

let auraMemory=loadMemory();


function saveMemory(){

    try{

        localStorage.setItem(
            MEMORY_KEY,
            JSON.stringify(auraMemory)
        );

    }catch(error){

        console.error("Hafıza kaydetme hatası:",error);
    }
}


function addNote(text){

    auraMemory.notes.push({
        text:text,
        date:new Date().toLocaleString("tr-TR")
    });

    saveMemory();
}


function addFact(text){

    auraMemory.facts.push({
        text:text,
        date:new Date().toLocaleString("tr-TR")
    });

    saveMemory();
}


function addPreference(text){

    auraMemory.preferences.push({
        text:text,
        date:new Date().toLocaleString("tr-TR")
    });

    saveMemory();
}


function clearMemory(){

    auraMemory=emptyMemory();

    saveMemory();
}


function memoryText(){

    let result="";

    if(auraMemory.facts.length){

        result+="KAYITLI BİLGİLER:\n";

        auraMemory.facts.forEach(function(item){
            result+="- "+item.text+"\n";
        });

        result+="\n";
    }

    if(auraMemory.preferences.length){

        result+="TERCİHLER:\n";

        auraMemory.preferences.forEach(function(item){
            result+="- "+item.text+"\n";
        });

        result+="\n";
    }

    if(auraMemory.notes.length){

        result+="NOTLAR:\n";

        auraMemory.notes.forEach(function(item){
            result+="- "+item.text+"\n";
        });
    }

    if(!result){
        result="Henüz kayıtlı bilgi yok.";
    }

    return result.trim();
}


/* HAFIZA KOMUTLARI */

function handleMemoryCommand(text){

    const command=text.toLowerCase().trim();


    const notePatterns=[
        "not al ",
        "not kaydet ",
        "bunu not al ",
        "bunu kaydet ",
        "hafızana kaydet ",
        "hafizana kaydet "
    ];


    for(const pattern of notePatterns){

        if(command.startsWith(pattern)){

            let value=text.substring(pattern.length).trim();

            if(value.startsWith(":")){
                value=value.substring(1).trim();
            }

            if(!value){

                return{
                    handled:true,
                    response:"Ne not almamı istediğini söyle."
                };
            }

            addNote(value);

            return{
                handled:true,
                response:"Tamam. Bunu hafızama kaydettim."
            };
        }
    }


    const factPatterns=[
        "bunu hatırla ",
        "bunu hafızana al ",
        "bunu hafızanda tut ",
        "bunu unutma "
    ];


    for(const pattern of factPatterns){

        if(command.startsWith(pattern)){

            let value=text.substring(pattern.length).trim();

            if(value.startsWith(":")){
                value=value.substring(1).trim();
            }

            if(!value){

                return{
                    handled:true,
                    response:"Hatırlamamı istediğin bilgiyi söyle."
                };
            }

            addFact(value);

            return{
                handled:true,
                response:"Tamam. Bunu hatırlayacağım."
            };
        }
    }


    const preferencePatterns=[
        "tercihim ",
        "tercihimi hatırla ",
        "şunu seviyorum ",
        "sunu seviyorum ",
        "şunu sevmiyorum ",
        "sunu sevmiyorum "
    ];


    for(const pattern of preferencePatterns){

        if(command.startsWith(pattern)){

            let value=text.substring(pattern.length).trim();

            if(value.startsWith(":")){
                value=value.substring(1).trim();
            }

            if(!value){

                return{
                    handled:true,
                    response:"Hangi tercihini hatırlamamı istediğini söyle."
                };
            }

            addPreference(value);

            return{
                handled:true,
                response:"Tamam. Bu tercihini hafızama ekledim."
            };
        }
    }


    if(
        command==="hafızamda ne var" ||
        command==="hafizamda ne var" ||
        command==="neyi hatırlıyorsun" ||
        command==="neyi hatirliyorsun" ||
        command==="hafızanı göster" ||
        command==="hafizani goster"
    ){

        return{
            handled:true,
            response:memoryText()
        };
    }


    if(
        command==="hafızanı temizle" ||
        command==="hafizani temizle" ||
        command==="tüm hafızanı sil" ||
        command==="tum hafizani sil"
    ){

        clearMemory();

        return{
            handled:true,
            response:"Tamam. Hafızam temizlendi."
        };
    }


    return{
        handled:false
    };
}/* AI SİSTEMİ */

const conversation=[
    {
        role:"system",
        content:""
    }
];


function updateSystem(){

    conversation[0].content=
`Sen AURA adında kişisel bir yapay zekâ asistanısın.

Türkçe konuş.

Kullanıcının adı Bedirhan Kahraman.

ÇOK ÖNEMLİ:
Kullanıcıya normal konuşmalarda ismiyle hitap etme.

"Bedirhan" veya "Bedirhan Kahraman" ifadelerini kendiliğinden kullanma.

Her cevabın başında kullanıcıya ismiyle seslenme.

Kullanıcının adını yalnızca kullanıcı özellikle adını sorarsa kullan.

Kullanıcı "ben kimim" derse "Sen Bedirhan Kahraman'sın." diyebilirsin.

Kullanıcı "adım ne" veya "benim adım ne" derse adının Bedirhan Kahraman olduğunu söyle.

Bunun dışındaki konuşmalarda kullanıcıya isimle hitap etme.

Kısa, doğal ve anlaşılır cevaplar ver.

Gereksiz tekrar yapma.

Bilmediğin bilgiyi uydurma.

Kendini AURA olarak tanıt.

Kalıcı hafıza:

${memoryText()}`;
}


/* SES METNİ TEMİZLEME */

function cleanTextForSpeech(text){

    return text

        .replace(
            /[\p{Emoji_Presentation}\p{Extended_Pictographic}]/gu,
            ""
        )

        .replace(
            /https?:\/\/\S+/gi,
            ""
        )

        .replace(
            /[.,!?;:"'“”‘’()[\]{}<>…:;\/\\|@#$%^&*_+=~`-]/g,
            " "
        )

        .replace(
            /\s+/g,
            " "
        )

        .trim();
}


/* SESLİ CEVAP */

function speak(text){

    if(!("speechSynthesis" in window)){
        return;
    }

    const clean=cleanTextForSpeech(text);

    if(!clean){
        return;
    }

    window.speechSynthesis.cancel();

    const utterance=
        new SpeechSynthesisUtterance(clean);

    utterance.lang="tr-TR";
    utterance.rate=.9;
    utterance.pitch=1;
    utterance.volume=1;

    window.speechSynthesis.speak(utterance);
}


/* AI */

async function askAI(text){

    updateSystem();

    conversation.push({
        role:"user",
        content:text
    });


    try{

        const response=
            await puter.ai.chat(
                conversation,
                {
                    model:"gpt-5.4-nano"
                }
            );


        let answer="";


        if(
            response &&
            response.message &&
            response.message.content
        ){

            answer=response.message.content;

        }else if(
            response &&
            response.text
        ){

            answer=response.text;

        }else if(
            typeof response==="string"
        ){

            answer=response;

        }else{

            answer=String(response);
        }


        conversation.push({
            role:"assistant",
            content:answer
        });


        return answer;


    }catch(error){

        console.error(
            "AURA AI HATASI:",
            error
        );

        throw error;
    }
}


/* MESAJ GÖNDER */

async function sendMessage(voiceMode=false){

    const text=input.value.trim();

    if(!text){
        return;
    }


    addMessage(text,"user");

    input.value="";


    const memoryResult=
        handleMemoryCommand(text);


    if(memoryResult.handled){

        addMessage(
            memoryResult.response,
            "aura"
        );

        if(voiceMode){
            speak(memoryResult.response);
        }

        input.focus();

        return;
    }


    sendButton.disabled=true;
    micButton.disabled=true;


    addMessage(
        "Düşünüyorum...",
        "aura"
    );


    const loading=chat.lastElementChild;


    try{

        const reply=await askAI(text);


        if(loading){
            loading.remove();
        }


        addMessage(
            reply,
            "aura"
        );


        if(voiceMode){
            speak(reply);
        }


    }catch(error){

        if(loading){
            loading.remove();
        }


        addMessage(
            "AI bağlantısında bir sorun oluştu. Tekrar deneyelim.",
            "aura"
        );

    }finally{

        sendButton.disabled=false;
        micButton.disabled=false;

        input.focus();
    }
}/* GÖNDER BUTONU */

sendButton.addEventListener(
    "click",
    function(){
        sendMessage(false);
    }
);


/* ENTER */

input.addEventListener(
    "keydown",
    function(event){

        if(event.key==="Enter"){

            event.preventDefault();

            sendMessage(false);
        }
    }
);


/* SESLİ KOMUT */

function startListening(){

    const SpeechRecognition=
        window.SpeechRecognition ||
        window.webkitSpeechRecognition;


    if(!SpeechRecognition){

        addMessage(
            "Bu tarayıcı sesli komutu desteklemiyor.",
            "aura"
        );

        return;
    }


    const recognition=
        new SpeechRecognition();


    recognition.lang="tr-TR";
    recognition.continuous=false;
    recognition.interimResults=false;


    micButton.disabled=true;


    recognition.onstart=function(){

        addMessage(
            "Dinliyorum...",
            "aura"
        );
    };


    recognition.onresult=function(event){

        const text=
            event.results[0][0].transcript;

        input.value=text;

        sendMessage(true);
    };


    recognition.onerror=function(event){

        console.error(
            "SES HATASI:",
            event
        );

        micButton.disabled=false;

        addMessage(
            "Sesli komut alınamadı.",
            "aura"
        );
    };


    recognition.onend=function(){

        micButton.disabled=false;
    };


    try{

        recognition.start();

    }catch(error){

        micButton.disabled=false;

        console.error(
            "Mikrofon başlatılamadı:",
            error
        );
    }
}


/* MİKROFON BUTONU */

micButton.addEventListener(
    "click",
    function(){
        startListening();
    }
);


/* MESAJ EKLEME */

function addMessage(text,type){

    const message=
        document.createElement("div");

    message.className=
        "message "+type;

    message.textContent=
        text;

    chat.appendChild(message);

    chat.scrollTop=
        chat.scrollHeight;
}


/* BAŞLANGIÇ MESAJI */

addMessage(
    "Merhaba Bedirhan. Ben AURA AI.\n\nSistem hazır. Seni dinliyorum.",
    "aura"
);

input.focus();

</script>

</body>
</html>
