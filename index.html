<!DOCTYPE html>
<html lang="tr">
<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
>

<meta
    name="theme-color"
    content="#020912"
>

<title>AURA AI</title>

<style>

*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,
body{
    width:100%;
    height:100%;
    margin:0;
}

body{
    overflow:hidden;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    color:#dffaff;

    background:
        radial-gradient(
            circle at 50% 35%,
            #073b57 0%,
            #05263b 30%,
            #020e19 65%,
            #00070d 100%
        );
}

button,
input{
    font:inherit;
}

button{
    border:0;
}

.app{
    width:100%;
    height:100dvh;

    display:flex;
    flex-direction:column;

    position:relative;

    overflow:hidden;
}

.topbar{
    height:72px;
    flex:0 0 72px;

    display:flex;
    align-items:center;
    justify-content:space-between;

    padding:0 24px;

    background:
        rgba(0,7,13,.94);

    border-bottom:
        1px solid
        rgba(0,234,255,.28);

    box-shadow:
        0 8px 30px
        rgba(0,0,0,.3);

    z-index:20;
}

.logo{
    font-size:25px;
    letter-spacing:6px;

    color:#00eaff;

    text-shadow:
        0 0 12px
        rgba(0,234,255,.9),

        0 0 25px
        rgba(0,234,255,.55);
}

.online{
    font-size:11px;
    letter-spacing:3px;

    color:#69ffd7;
}

.online i{
    display:inline-block;

    width:8px;
    height:8px;

    margin-right:8px;

    border-radius:50%;

    background:#55ffc8;

    box-shadow:
        0 0 12px #55ffc8;
}

.stage{
    position:relative;

    flex:1;

    min-height:0;

    overflow:hidden;
}

.background-glow{
    position:absolute;

    width:600px;
    height:600px;

    left:50%;
    top:50%;

    transform:
        translate(-50%,-50%);

    border-radius:50%;

    background:
        radial-gradient(
            circle,
            rgba(0,220,255,.12),
            rgba(0,100,220,.04) 45%,
            transparent 72%
        );

    filter:blur(12px);

    pointer-events:none;

    z-index:0;
}

.core-zone{
    position:absolute;

    inset:0;

    display:flex;

    align-items:center;
    justify-content:center;

    transition:
        all .45s ease;

    z-index:3;

    pointer-events:none;
}

.app.chat-open .core-zone{
    align-items:flex-start;

    padding-top:48px;
}

.core-button{
    width:158px;
    height:158px;

    position:relative;

    display:flex;
    align-items:center;
    justify-content:center;

    border-radius:50%;

    cursor:pointer;

    pointer-events:auto;

    color:#fff;

    background:
        radial-gradient(
            circle at 35% 30%,
            #8dfbff 0%,
            #1595ad 18%,
            #053647 48%,
            #010b13 72%
        );

    border:
        2px solid
        #5af7ff;

    box-shadow:
        0 0 18px #00eaff,
        0 0 70px rgba(0,234,255,.5),
        inset 0 0 35px rgba(0,234,255,.55);

    animation:
        corePulse 2.8s
        ease-in-out
        infinite;

    user-select:none;

    outline:none;
}

.core-button:active{
    transform:scale(.96);
}

.core-text{
    font-size:20px;

    font-weight:700;

    letter-spacing:6px;

    text-shadow:
        0 0 8px #fff,
        0 0 18px #00eaff;
}

.ring{
    position:absolute;

    border:
        1px solid
        rgba(0,234,255,.65);

    border-radius:50%;

    pointer-events:none;
}

.r1{
    width:190px;
    height:190px;

    border-left-color:transparent;
    border-bottom-color:transparent;

    animation:
        rotateOne 9s linear infinite;
}

.r2{
    width:218px;
    height:218px;

    border-right-color:transparent;
    border-top-color:transparent;

    animation:
        rotateTwo 13s linear infinite;
}

.r3{
    width:245px;
    height:245px;

    border-left-color:transparent;
    border-right-color:transparent;

    opacity:.42;

    animation:
        rotateOne 17s linear infinite;
}

@keyframes rotateOne{
    from{
        transform:rotate(0deg);
    }

    to{
        transform:rotate(360deg);
    }
}

@keyframes rotateTwo{
    from{
        transform:rotate(360deg);
    }

    to{
        transform:rotate(0deg);
    }
}

@keyframes corePulse{
    0%,
    100%{
        transform:scale(1);
    }

    50%{
        transform:scale(1.035);
    }
}

.chat-panel{
    position:absolute;

    left:14px;
    right:14px;
    bottom:14px;

    height:min(66%,600px);
    min-height:300px;

    display:flex;
    flex-direction:column;

    background:
        rgba(1,12,21,.95);

    border:
        1px solid
        rgba(0,234,255,.35);

    border-radius:28px;

    box-shadow:
        0 0 35px rgba(0,0,0,.45),
        inset 0 0 25px
        rgba(0,234,255,.04);

    transform:
        translateY(
            calc(100% + 35px)
        );

    opacity:0;

    pointer-events:none;

    transition:
        transform .45s cubic-bezier(.2,.8,.2,1),
        opacity .25s ease;

    z-index:4;

    overflow:hidden;

    touch-action:none;
}

.app.chat-open .chat-panel{
    transform:translateY(0);
    opacity:1;
    pointer-events:auto;
}

.chat-head{
    height:52px;
    flex:0 0 52px;

    display:flex;
    align-items:center;
    justify-content:space-between;

    padding:0 18px;

    border-bottom:
        1px solid
        rgba(0,234,255,.15);
}

.chat-title{
    font-size:11px;

    letter-spacing:3px;

    color:#8fefff;
}

.close-btn{
    width:34px;
    height:34px;

    border-radius:50%;

    background:#08283a;

    color:#8fefff;

    cursor:pointer;
}

.messages{
    flex:1;

    min-height:0;

    overflow-y:auto;

    padding:
        18px
        10px
        105px;
}

.msg{
    max-width:88%;

    padding:
        14px
        16px;

    margin:
        0 14px 12px;

    border-radius:16px;

    line-height:1.5;

    font-size:15px;

    white-space:pre-wrap;

    overflow-wrap:anywhere;

    word-break:break-word;

    text-align:left;
}

.msg.aura{
    margin-right:auto;

    background:
        linear-gradient(
            135deg,
            rgba(4,44,61,.95),
            rgba(2,24,35,.95)
        );

    border-left:
        3px solid
        #00eaff;

    border-radius:
        5px 18px 18px 18px;
}

.msg.user{
    margin-left:auto;

    background:
        linear-gradient(
            135deg,
            #0b6687,
            #07465e
        );

    border-right:
        3px solid
        #65faff;

    border-radius:
        18px 5px 18px 18px;

    color:#fff;
}.input-area{
    position:absolute;

    left:15px;
    right:15px;
    bottom:15px;

    min-height:76px;

    padding:10px;

    display:flex;

    gap:9px;

    align-items:center;

    background:
        rgba(2,24,37,.98);

    border:
        1px solid
        rgba(0,234,255,.65);

    border-radius:25px;

    box-shadow:
        0 0 20px
        rgba(0,234,255,.12);
}

#input{
    flex:1;

    min-width:0;

    height:52px;

    padding:
        0 15px;

    border:none;

    outline:none;

    border-radius:17px;

    background:
        rgba(0,48,65,.75);

    color:#e9fdff;

    font-size:15px;
}

#input::placeholder{
    color:#7195a3;
}

.action-button{
    width:52px;
    height:52px;

    flex-shrink:0;

    border:none;

    border-radius:17px;

    cursor:pointer;

    display:flex;

    align-items:center;
    justify-content:center;

    font-size:21px;

    transition:
        transform .15s,
        filter .15s;
}

.action-button:active{
    transform:scale(.92);
}

#micButton{
    background:#063c59;

    color:#a9f8ff;

    border:
        1px solid
        rgba(0,234,255,.25);
}

#micButton.listening{
    background:#00a8bd;

    color:#fff;

    box-shadow:
        0 0 20px
        rgba(0,234,255,.7);
}

#sendButton{
    background:
        linear-gradient(
            135deg,
            #19ddeb,
            #15a7c9
        );

    color:#001018;

    font-size:25px;

    font-weight:900;

    box-shadow:
        0 0 15px
        rgba(0,234,255,.35);
}

.action-button:disabled{
    opacity:.45;

    cursor:default;
}

.file-pill{
    margin:
        8px 14px;

    padding:
        9px 12px;

    border-radius:10px;

    background:#05293a;

    color:#86eefa;

    font-size:12px;

    display:none;
}

.file-pill.show{
    display:block;
}

.status-line{
    position:absolute;

    top:18px;
    left:50%;

    transform:
        translateX(-50%);

    color:#6c9daa;

    font-size:10px;

    letter-spacing:2px;

    opacity:.8;

    z-index:1;
}

.toast{
    position:fixed;

    left:50%;
    bottom:20px;

    transform:
        translate(-50%,20px);

    max-width:88%;

    padding:
        11px 16px;

    border:
        1px solid
        rgba(0,234,255,.4);

    border-radius:12px;

    background:#041522;

    color:#c4f9ff;

    font-size:13px;

    text-align:center;

    opacity:0;

    pointer-events:none;

    transition:.25s;

    z-index:100;
}

.toast.show{
    opacity:1;

    transform:
        translate(-50%,0);
}

@media(max-width:600px){

    .topbar{
        height:64px;
        flex-basis:64px;

        padding:0 18px;
    }

    .logo{
        font-size:21px;
    }

    .online{
        font-size:10px;
        letter-spacing:2px;
    }

    .app.chat-open .core-zone{
        align-items:flex-start;
        padding-top:34px;
    }

    .core-button{
        width:140px;
        height:140px;

        font-size:18px;
    }

    .r1{
        width:170px;
        height:170px;
    }

    .r2{
        width:195px;
        height:195px;
    }

    .r3{
        width:220px;
        height:220px;
    }

    .chat-panel{
        left:8px;
        right:8px;
        bottom:8px;

        height:70%;

        border-radius:24px;
    }

    .messages{
        padding:
            18px
            8px
            110px;
    }

    .msg{
        max-width:90%;
        font-size:14px;
    }

    .input-area{
        left:10px;
        right:10px;
        bottom:10px;

        min-height:70px;

        border-radius:22px;
    }

    #input{
        font-size:14px;
    }

    .action-button{
        width:48px;
        height:48px;
    }
}

</style>
</head>

<body>

<div class="app" id="app">

    <header class="topbar">

        <div class="logo">
            AURA
        </div>

        <div class="online">
            <i></i>
            SYSTEM ONLINE
        </div>

    </header>


    <main class="stage">

        <div class="background-glow"></div>

        <div
            class="status-line"
            id="statusLine">
        </div>


        <section class="core-zone">

            <button
                class="core-button"
                id="coreButton"
                type="button"
            >

                <span class="ring r1"></span>
                <span class="ring r2"></span>
                <span class="ring r3"></span>

                <span class="core-text">
                    AURA
                </span>

            </button>

        </section>


        <section
            class="chat-panel"
            id="chatPanel">

            <div class="chat-head">

                <div class="chat-title">
                    AURA COMMUNICATION
                </div>

                <button
                    class="close-btn"
                    id="closeChat"
                    type="button">
                    ×
                </button>

            </div>


            <div
                class="file-pill"
                id="filePill">
            </div>


            <div
                class="messages"
                id="messages">
            </div>


            <div class="input-area">

                <div class="input-wrap">

                    <input
                        id="input"
                        type="text"
                        autocomplete="off"
                        placeholder="AURA'ya mesaj yaz..."
                    >

                </div>


                <button
                    id="micButton"
                    class="action-button"
                    type="button"
                >
                    🎙
                </button>


                <button
                    id="sendButton"
                    class="action-button"
                    type="button"
                >
                    ➤
                </button>

            </div>

        </section>

    </main>


    <input
        type="file"
        id="fileInput"
        class="hidden"
        accept=".txt,.md,.json,.csv,.html,.css,.js,.py,.pdf"
    >


    <div
        class="toast"
        id="toast">
    </div>

</div>


<script src="https://js.puter.com/v2/"></script>

<script>"use strict";


const app =
    document.getElementById("app");

const coreButton =
    document.getElementById("coreButton");

const closeChat =
    document.getElementById("closeChat");

const chatPanel =
    document.getElementById("chatPanel");

const messagesEl =
    document.getElementById("messages");

const input =
    document.getElementById("input");

const sendButton =
    document.getElementById("sendButton");

const micButton =
    document.getElementById("micButton");

const toast =
    document.getElementById("toast");

const fileInput =
    document.getElementById("fileInput");

const filePill =
    document.getElementById("filePill");

const statusLine =
    document.getElementById("statusLine");


const USER_NAME =
    "Bedirhan";

const GIRLFRIEND_NAME =
    "Edanur";


const STORAGE={

    memory:
        "AURA_MEMORY_FINAL",

    tasks:
        "AURA_TASKS_FINAL",

    reminders:
        "AURA_REMINDERS_FINAL",

    history:
        "AURA_HISTORY_FINAL",

    knowledge:
        "AURA_KNOWLEDGE_FINAL"

};


const AI_MODEL =
    "gpt-5.4-nano";


const state={

    memory:{
        facts:[],
        preferences:[],
        notes:[]
    },

    tasks:[],

    reminders:[],

    history:[],

    knowledge:[],

    fileContext:"",

    fileName:"",

    busy:false,

    listening:false,

    voiceRequest:false,

    recognition:null

};


function loadJSON(
    key,
    fallback
){

    try{

        const raw=
            localStorage.getItem(
                key
            );

        if(!raw){

            return fallback;
        }

        const value=
            JSON.parse(raw);

        return value;

    }catch(error){

        console.error(
            "Storage okuma:",
            error
        );

        return fallback;

    }

}


function saveJSON(
    key,
    value
){

    try{

        localStorage.setItem(
            key,
            JSON.stringify(value)
        );

    }catch(error){

        console.error(
            "Storage kayıt:",
            error
        );

    }

}


state.memory=
    loadJSON(
        STORAGE.memory,
        state.memory
    );

state.tasks=
    loadJSON(
        STORAGE.tasks,
        []
    );

state.reminders=
    loadJSON(
        STORAGE.reminders,
        []
    );

state.history=
    loadJSON(
        STORAGE.history,
        []
    );

state.knowledge=
    loadJSON(
        STORAGE.knowledge,
        [
            {
                title:"AURA",
                text:
                    "AURA, Bedirhan'ın kişisel yapay zeka projesidir."
            },
            {
                title:"Edanur",
                text:
                    "Edanur, Bedirhan'ın sevgilisidir."
            }
        ]
    );


function cleanText(
    value
){

    return String(
        value ?? ""
    ).trim();

}


function showToast(
    text
){

    toast.textContent=
        cleanText(text);

    toast.classList.add(
        "show"
    );

    clearTimeout(
        showToast.timer
    );

    showToast.timer=
        setTimeout(
            ()=>{
                toast.classList.remove(
                    "show"
                );
            },
            2400
        );

}


function openChat(){

    app.classList.add(
        "chat-open"
    );

    setTimeout(
        ()=>{
            input.focus();
        },
        300
    );

}


function closeChatBox(){

    app.classList.remove(
        "chat-open"
    );

}


coreButton.addEventListener(
    "click",
    ()=>{
        openChat();
    }
);


closeChat.addEventListener(
    "click",
    ()=>{
        closeChatBox();
    }
);


function addMessage(
    text,
    role="aura",
    persist=true
){

    const value=
        cleanText(text);

    if(!value){

        return;

    }


    const element=
        document.createElement(
            "div"
        );


    element.className=
        "msg " +
        (
            role==="user"
                ? "user"
                : "aura"
        );


    element.textContent=
        value;


    messagesEl.appendChild(
        element
    );


    requestAnimationFrame(
        ()=>{
            messagesEl.scrollTop=
                messagesEl.scrollHeight;
        }
    );


    if(persist){

        state.history.push({

            role:
                role==="user"
                    ? "user"
                    : "aura",

            text:value,

            time:
                Date.now()

        });


        if(
            state.history.length>100
        ){

            state.history=
                state.history.slice(-100);

        }


        saveJSON(
            STORAGE.history,
            state.history
        );

    }

}


function renderHistory(){

    messagesEl.innerHTML="";


    if(
        !state.history.length
    ){

        addMessage(
            "Selam Bedirhan, sistem hazır. Seni dinliyorum.",
            "aura",
            true
        );

        return;

    }


    state.history.forEach(
        item=>{

            addMessage(
                item.text,
                item.role,
                false
            );

        }
    );

}


renderHistory();


function saveAll(){

    saveJSON(
        STORAGE.memory,
        state.memory
    );

    saveJSON(
        STORAGE.tasks,
        state.tasks
    );

    saveJSON(
        STORAGE.reminders,
        state.reminders
    );

    saveJSON(
        STORAGE.history,
        state.history
    );

    saveJSON(
        STORAGE.knowledge,
        state.knowledge
    );

}


function memoryText(){

    const result=[];


    if(
        state.memory.facts.length
    ){

        result.push(
            "Bilgiler:\n"+
            state.memory.facts
                .map(
                    x=>"- "+x.text
                )
                .join("\n")
        );

    }


    if(
        state.memory.preferences.length
    ){

        result.push(
            "Tercihler:\n"+
            state.memory.preferences
                .map(
                    x=>"- "+x.text
                )
                .join("\n")
        );

    }


    if(
        state.memory.notes.length
    ){

        result.push(
            "Notlar:\n"+
            state.memory.notes
                .map(
                    x=>"- "+x.text
                )
                .join("\n")
        );

    }


    return result.join(
        "\n\n"
    ) ||
    "Kayıtlı özel bilgi yok.";

}


function addMemory(
    type,
    text
){

    if(
        !Array.isArray(
            state.memory[type]
        )
    ){

        return;

    }


    state.memory[type].push({

        text:
            cleanText(text),

        time:
            Date.now()

    });


    state.memory[type]=
        state.memory[type].slice(
            -100
        );


    saveJSON(
        STORAGE.memory,
        state.memory
    );

}function memoryCommand(
    text
){

    const lower=
        text
            .toLocaleLowerCase(
                "tr-TR"
            )
            .trim();


    const groups=[

        {
            type:"notes",

            prefixes:[
                "not al ",
                "not kaydet ",
                "bunu not al ",
                "bunu kaydet ",
                "hafızana kaydet ",
                "hafizana kaydet "
            ]
        },

        {
            type:"facts",

            prefixes:[
                "bunu hatırla ",
                "bunu hatirla ",
                "bunu hafızana al ",
                "bunu hafizana al ",
                "bunu unutma "
            ]
        },

        {
            type:"preferences",

            prefixes:[
                "tercihimi hatırla ",
                "tercihimi hatirla ",
                "şunu seviyorum ",
                "sunu seviyorum ",
                "şunu sevmiyorum ",
                "sunu sevmiyorum "
            ]
        }

    ];


    for(
        const group of groups
    ){

        for(
            const prefix of group.prefixes
        ){

            if(
                lower.startsWith(prefix)
            ){

                const value=
                    text
                        .slice(
                            prefix.length
                        )
                        .trim();


                if(!value){

                    return {
                        handled:true,
                        response:
                            "Kaydedilecek bilgiyi belirt."
                    };

                }


                addMemory(
                    group.type,
                    value
                );


                return {
                    handled:true,
                    response:
                        "Tamam, bunu hafızaya kaydettim."
                };

            }

        }

    }


    if(
        lower==="hafızamda ne var"||
        lower==="hafizamda ne var"||
        lower==="neyi hatırlıyorsun"||
        lower==="neyi hatirliyorsun"
    ){

        return {
            handled:true,
            response:
                memoryText()
        };

    }


    if(
        lower==="hafızanı temizle"||
        lower==="hafizani temizle"
    ){

        state.memory={
            facts:[],
            preferences:[],
            notes:[]
        };


        saveJSON(
            STORAGE.memory,
            state.memory
        );


        return {
            handled:true,
            response:
                "AURA hafızası temizlendi."
        };

    }


    return {
        handled:false
    };

}


function taskCommand(
    text
){

    const lower=
        text
            .toLocaleLowerCase(
                "tr-TR"
            )
            .trim();


    let match=
        lower.match(
            /^(?:görev ekle|gorev ekle)\s+(.+)$/

                        )

                        )
                )

            time:

        saveJSON(
            STORAGE.tasks,
            state.tasks
        );


        return {
            handled:true,
            response:

        };

    }


    if(
        [
            "görevlerim",
            "gorevlerim",
            "görev listesi",

    ){

        if(

        return {

        };

    }


    match=
        lower.match(
            /^(?:görevi tamamla|gorevi tamamla)\s+(\d+)$/
        );


    if(match){

        const index=
            Number(match[1])-1;


        if(

            saveJSON(
                STORAGE.tasks,
                state.tasks
            );


            return {

            };

        }


        return {
            handled:true,
            response:
                "Bu numarada görev bulunamadı."
        };

    }


    return {
        handled:false
    };

}


function reminderCommand(

){

                    :60000;


        const item={

                Date.now(),

            due:

                multiplier,

            done:false

        };


        state.reminders.push(

        saveJSON(

            state.reminders
        );


        scheduleReminder(
            item

        return {
            handled:true,

        };

    }

            "hatirlatici listesi"
        ].includes(lower)
    ){

        const active=
            state.reminders.filter(

            );


        if(
            !active.length

            return {
                handled:true,
                response:

            };

        }


        return {
            handled:true,
            response:
                active
                    .map(
                        (x,i)=>
                        `${i+1}. ${x.msg} — ${new Date(x.due).toLocaleString("tr-TR")}`
                    )
                    .join("\n")
        };

    }


    return {
        handled:false
    };

}


function scheduleReminder(
    item
){

    const delay=
        Math.max(
            0,
            item.due-Date.now()
        );


    setTimeout(
        ()=>{
            if(
                !item.done
            ){

                item.done=
                    true;


                saveJSON(
                    STORAGE.reminders,
                    state.reminders
                );


                addMessage(
                    "Hatırlatıcı: "+
                    item.msg,
                    "aura",
                    true
                );


                if(
                    Notification &&
                    Notification.permission==="granted"
                ){

                    try{

                        new Notification(
                            "AURA",
                            {
                                body:
                                    item.msg
                            }
                        );

                    }catch{}

                }


            }
        },
        Math.min(
            delay,
            2147483647
        )
    );

}

    }async function openSelectedFile(
    file
){

    if(!file){

        return;

    }


    const name=
        file.name
            .toLowerCase();


    try{

        if(
            name.endsWith(".pdf")
        ){

            if(
                !window.pdfjsLib
            ){

                await loadPDFJS();

            }


            const buffer=
                new Uint8Array(
                    await file.arrayBuffer()
                );


            const pdf=
                await window.pdfjsLib
                    .getDocument({
                        data:buffer
                    })
                    .promise;


            let fullText="";


            for(
                let pageNum=1;
                pageNum<=pdf.numPages;
                pageNum++
            ){

                const page=
                    await pdf.getPage(
                        pageNum
                    );


                const content=
                    await page.getTextContent();


                const pageText=
                    content.items
                        .map(
                            item=>
                                item.str||""
                        )
                        .join(" ");


                fullText+=
                    `\n[Sayfa ${pageNum}]\n${pageText}`;


                if(
                    fullText.length>=30000
                ){

                    break;

                }

            }


            state.fileContext=
                fullText.slice(
                    0,
                    30000
                );

        }else{

            state.fileContext=
                (
                    await file.text()
                )
                .slice(
                    0,
                    30000
                );

        }


        state.fileName=
            file.name;


        filePill.textContent=
            `Dosya: ${file.name}`;

        filePill.classList.add(
            "show"
        );


        addMessage(
            `${file.name} okundu. İçeriği hakkında soru sorabilirsin.`,
            "aura",
            true
        );


        openChat();


    }catch(error){

        console.error(
            "Dosya hatası:",
            error
        );


        showToast(
            "Dosya okunamadı."
        );

    }

}


async function loadPDFJS(){

    if(
        window.pdfjsLib
    ){

        return;

    }


    await new Promise(
        (resolve,reject)=>{

            const script=
                document.createElement(
                    "script"
                );


            script.src=
                "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.min.mjs";


            script.type=
                "module";


            script.onload=
                resolve;

            script.onerror=
                reject;


            document.head.appendChild(
                script
            );

        }
    );

}

        }function normalizeAIResponse(
    response
){

    if(
        response===null||
        response===undefined
    ){

        return "";

    }


    if(
        typeof response==="string"
    ){

        return response.trim();

    }


    if(
        typeof response.message?.content==="string"
    ){

        return response.message.content.trim();

    }


    if(
        Array.isArray(
            response.message?.content
        )
    ){

        return response.message.content
            .map(
                part=>{

                    if(
                        typeof part==="string"
                    ){

                        return part;

                    }


                    if(
                        part &&
                        typeof part.text==="string"
                    ){

                        return part.text;

                    }


                    return "";

                }
            )
            .join("")
            .trim();

    }


    if(
        typeof response.text==="string"
    ){

        return response.text.trim();

    }


    if(
        typeof response.content==="string"
    ){

        return response.content.trim();

    }


    return "";

}

async function askAI(
    text
){

    if(
        typeof puter==="undefined"
    ){

        throw new Error(
            "Puter yüklenmedi."
        );

    }


    if(
        !puter.ai||
        typeof puter.ai.chat!=="function"
    ){

        throw new Error(
            "Puter AI servisi bulunamadı."
        );

    }


    const messages=[

        {
            role:"system",
            content:
                buildPrompt()
        }

    ];


    state.history
        .slice(-12)
        .forEach(
            item=>{

                if(
                    item &&
                    (
                        item.role==="user"||
                        item.role==="aura"
                    ) &&
                    typeof item.text==="string"
                ){

                    messages.push({

                        role:
                            item.role==="user"
                                ?"user"
                                :"assistant",

                        content:
                            item.text

                    });

                }

            }
        );


    messages.push({

        role:"user",

        content:
            String(text)

    });


    const response=
        await puter.ai.chat(
            messages,
            {
                model:
                    AI_MODEL
            }
        );


    const answer=
        normalizeAIResponse(
            response
        );


    if(!answer){

        throw new Error(
            "AI metin döndürmedi."
        );

    }


    return answer;

}


function cleanSpeechText(
    text
){

    let result=
        String(text??"");


    try{

        result=
            result.replace(
                /[\p{Emoji_Presentation}\p{Extended_Pictographic}]/gu,
                " "
            );

    }catch{

        result=
            result.replace(
                /[\u{1F300}-\u{1FAFF}]/gu,
                " "
            );

    }


    return result

        .replace(
            /https?:\/\/\S+/gi,
            " "
        )

        .replace(
            /[`*_#~|<>[\]{}]/g,
            " "
        )

        .replace(
            /[•●◆◇★☆✓✔→←↑↓]/g,
            " "
        )

        .replace(
            /\s+/g,
            " "
        )

        .trim();

}


function speak(
    text
){

    if(
        !("speechSynthesis"in window)
    ){

        return;

    }


    const clean=
        cleanSpeechText(
            text
        );


    if(!clean){

        return;

    }


    speechSynthesis.cancel();


    const utterance=
        new SpeechSynthesisUtterance(
            clean
        );


    utterance.lang=
        "tr-TR";

    utterance.rate=
        .92;

    utterance.pitch=
        1;

    utterance.volume=
        1;


    speechSynthesis.speak(
        utterance
    );

}


function getVoiceRecognition(){

    const Recognition=
        window.SpeechRecognition||
        window.webkitSpeechRecognition;


    if(!Recognition){

        return null;

    const recognition=
        new Recognition();


    recognition.lang=
        "tr-TR";

    recognition.continuous=
        false;

    recognition.interimResults=
        false;

    recognition.maxAlternatives=
        1;


    return recognition;

}

            shouldSpeak
        ){

            speak(
                errorMessage
            );

        }


    }finally{

        state.busy=
            false;

        sendButton.disabled=
            false;

        micButton.disabled=
            false;

        state.voiceRequest=
            false;

        statusLine.textContent=
            "";

        input.focus();

    }

}


sendButton.addEventListener(
    "click",
    ()=>{
        sendMessage(false);
    }
);


input.addEventListener(
    "keydown",
    event=>{

        if(
            event.key==="Enter" &&
            !event.shiftKey
        ){

            event.preventDefault();

            sendMessage(false);

        }

    }
);


document.addEventListener(
    "keydown",
    event=>{

        if(
            event.key==="Escape"
        ){

            closeChatBox();

        }

    }
);


window.addEventListener(
    "beforeunload",
    ()=>{
        saveAll();
    }
);


window.addEventListener(
    "error",
    event=>{

        console.error(
            "AURA JS:",
            event.error||
            event.message
        );

    }
);


window.addEventListener(
    "unhandledrejection",
    event=>{

        console.error(
            "AURA Promise:",
            event.reason
        );

    }
);


if(
    "Notification"in window &&
    Notification.permission==="default"
){

    Notification
        .requestPermission()
        .catch(
            ()=>{}
        );

}


state.reminders
    .filter(
        item=>
            !item.done &&
            item.due>Date.now()
    )
    .forEach(
        scheduleReminder
    );


statusLine.textContent="";


</script>

</body>
</html>
