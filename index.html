<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AURA AI</title>

<style>

*{
    box-sizing:border-box;
}

html,body{
    width:100%;
    height:100%;
    margin:0;
}

body{
    overflow:hidden;
    font-family:Arial,sans-serif;
    color:#dffcff;

    background:
        radial-gradient(
            circle at 50% 20%,
            #073d55 0%,
            #041d2d 35%,
            #020b15 70%,
            #00040a 100%
        );
}

/* ARKA PLAN */

body::before{
    content:"";
    position:fixed;
    inset:0;

    background:
        radial-gradient(
            circle at 20% 30%,
            rgba(0,180,255,.08),
            transparent 25%
        ),
        radial-gradient(
            circle at 80% 70%,
            rgba(0,234,255,.06),
            transparent 25%
        );

    pointer-events:none;
}

/* ÜST BAR */

.top{
    height:58px;

    display:flex;
    align-items:center;
    justify-content:space-between;

    padding:0 18px;

    background:rgba(0,8,16,.82);

    border-bottom:
        1px solid
        rgba(0,234,255,.25);

    position:relative;
    z-index:5;
}

.logo{
    font-size:20px;
    font-weight:bold;
    letter-spacing:5px;

    color:#00eaff;

    text-shadow:
        0 0 10px #00eaff,
        0 0 25px rgba(0,234,255,.6);
}

.status{
    display:flex;
    align-items:center;

    font-size:9px;
    letter-spacing:2px;

    color:#55ffcc;
}

.dot{
    width:6px;
    height:6px;

    margin-right:6px;

    border-radius:50%;

    background:#55ffcc;

    box-shadow:
        0 0 8px #55ffcc;
}

/* ANA */

.main{
    height:calc(100dvh - 58px);

    display:flex;
    flex-direction:column;
    align-items:center;

    min-height:0;
}

/* ÇEKİRDEK */

.core{
    width:190px;
    height:190px;

    margin-top:3px;

    position:relative;

    display:flex;
    align-items:center;
    justify-content:center;

    flex-shrink:0;
}

.ring{
    position:absolute;

    border-radius:50%;

    border:1px solid
        rgba(0,234,255,.7);
}

.r1{
    width:115px;
    height:115px;

    border-left-color:transparent;
    border-right-color:transparent;

    animation:spin 6s linear infinite;
}

.r2{
    width:150px;
    height:150px;

    border-top-color:transparent;
    border-bottom-color:transparent;

    animation:spin 10s linear reverse infinite;
}

.r3{
    width:185px;
    height:185px;

    border-left-color:transparent;
    border-bottom-color:transparent;

    animation:spin 14s linear infinite;
}

.center{
    width:82px;
    height:82px;

    display:flex;
    align-items:center;
    justify-content:center;

    border-radius:50%;

    border:
        2px solid #00eaff;

    color:#00eaff;

    font-size:17px;
    font-weight:bold;
    letter-spacing:3px;

    background:
        radial-gradient(
            circle,
            #08617a,
            #021522
        );

    box-shadow:
        0 0 15px #00eaff,
        0 0 45px
        rgba(0,234,255,.55),
        inset 0 0 20px
        rgba(0,234,255,.45);

    animation:pulse 2.3s infinite;
}

@keyframes spin{
    to{
        transform:rotate(360deg);
    }
}

@keyframes pulse{
    50%{
        transform:scale(1.06);
    }
}

/* SİSTEM YAZISI */

.system{
    margin-top:-8px;
    margin-bottom:5px;

    font-size:9px;
    letter-spacing:3px;

    color:#7ddff2;
}

/* SOHBET */

#chat{
    width:min(92%,620px);

    flex:1;
    min-height:0;

    overflow-y:auto;

    padding:4px 3px 12px;

    scrollbar-width:thin;
    scrollbar-color:
        rgba(0,234,255,.5)
        transparent;
}

#chat::-webkit-scrollbar{
    width:3px;
}

#chat::-webkit-scrollbar-thumb{
    background:#00eaff;
    border-radius:10px;
}

/* MESAJ */

.message{
    max-width:84%;

    padding:10px 13px;

    margin-bottom:10px;

    border-radius:14px;

    font-size:14px;
    line-height:1.45;

    white-space:pre-wrap;
    word-break:break-word;

    animation:messageIn .2s ease;
}

@keyframes messageIn{

    from{
        opacity:0;
        transform:translateY(6px);
    }

    to{
        opacity:1;
        transform:translateY(0);
    }
}

.aura{
    margin-right:auto;

    color:#d9faff;

    background:
        rgba(4,42,58,.72);

    border:
        1px solid
        rgba(0,234,255,.22);

    border-top-left-radius:5px;

    box-shadow:
        0 4px 20px
        rgba(0,0,0,.15);
}

.user{
    margin-left:auto;

    color:white;

    background:
        linear-gradient(
            135deg,
            rgba(10,116,150,.8),
            rgba(4,71,102,.8)
        );

    border:
        1px solid
        rgba(0,234,255,.28);

    border-top-right-radius:5px;
}

/* ALT PANEL */

.bottom{
    width:100%;

    padding:
        8px 10px;

    display:flex;
    align-items:center;

    justify-content:center;

    background:
        rgba(0,7,14,.9);

    border-top:
        1px solid
        rgba(0,234,255,.2);

    z-index:5;
}

/* MESAJ KUTUSU */

.composer{
    width:min(92%,620px);

    display:flex;
    align-items:center;

    gap:7px;

    padding:5px;

    border-radius:18px;

    background:
        rgba(5,30,43,.88);

    border:
        1px solid
        rgba(0,234,255,.28);

    box-shadow:
        0 5px 30px
        rgba(0,0,0,.35),
        inset 0 0 15px
        rgba(0,234,255,.04);
}

#input{
    flex:1;

    min-width:0;

    height:42px;

    border:0;
    outline:0;

    padding:
        0 13px;

    border-radius:14px;

    background:
        transparent;

    color:#e9fcff;

    font-size:14px;
}

#input::placeholder{
    color:#628994;
}

.icon{
    width:42px;
    height:42px;

    flex-shrink:0;

    border:0;

    border-radius:50%;

    background:
        rgba(0,72,94,.7);

    color:#00eaff;

    font-size:17px;

    cursor:pointer;

    transition:.15s;
}

.icon:active{
    transform:scale(.9);
}

.send{
    background:
        linear-gradient(
            135deg,
            #00eaff,
            #55ffcc
        );

    color:#00202a;

    font-size:19px;

    box-shadow:
        0 0 14px
        rgba(0,234,255,.25);
}

/* MOBİL */

@media(max-width:500px){

    .core{
        transform:scale(.86);

        margin-top:-3px;
        margin-bottom:-12px;
    }

    .message{
        max-width:89%;
        font-size:13px;
    }

    .composer{
        width:96%;
    }

    #input{
        font-size:13px;
    }

    .icon{
        width:40px;
        height:40px;
    }
}

</style>
</head>

<body>

<div class="top">

    <div class="logo">
        AURA
    </div>

    <div class="status">
        <span class="dot"></span>
        ONLINE
    </div>

</div>

<div class="main">

    <div class="core">

        <div class="ring r1"></div>
        <div class="ring r2"></div>
        <div class="ring r3"></div>

        <div class="center">
            AURA
        </div>

    </div>

    <div class="system">
        AI SYSTEM READY
    </div>

    <div id="chat">

        <div class="message aura">
            Merhaba. Ben AURA.
        </div>

        <div class="message aura">
            Sistem hazır. Seni dinliyorum.
        </div>

    </div>

    <div class="bottom">

        <div class="composer">

            <input
                id="input"
                type="text"
                placeholder="AURA'ya mesaj yaz..."
                autocomplete="off">

            <button
                class="icon"
                id="mic"
                type="button">
                🎙
            </button>

            <button
                class="icon send"
                id="send"
                type="button">
                ➤
            </button>

        </div>

    </div>

</div><script>

const input =
    document.getElementById("input");

const send =
    document.getElementById("send");

const mic =
    document.getElementById("mic");

const chat =
    document.getElementById("chat");


/* =========================
   MESAJ EKLEME
========================= */

function addMessage(
    text,
    type
){

    const message =
        document.createElement("div");

    message.className =
        "message " + type;

    message.textContent =
        text;

    chat.appendChild(
        message
    );

    chat.scrollTop =
        chat.scrollHeight;
}


/* =========================
   TEST CEVABI
========================= */

function sendMessage(){

    const text =
        input.value.trim();


    if(!text){
        return;
    }


    addMessage(
        text,
        "user"
    );


    input.value = "";


    /*
       Şimdilik gerçek AI yok.
       Sadece arayüz testi.
    */

    setTimeout(
        function(){

            addMessage(
                "Mesajını aldım. AURA arayüz testi aktif.",
                "aura"
            );

        },
        350
    );

}


/* =========================
   GÖNDER BUTONU
========================= */

send.addEventListener(
    "click",
    sendMessage
);


/* =========================
   ENTER İLE GÖNDER
========================= */

input.addEventListener(
    "keydown",
    function(event){

        if(
            event.key === "Enter"
        ){

            event.preventDefault();

            sendMessage();
        }

    }
);


/* =========================
   MİKROFON TESTİ
========================= */

mic.addEventListener(
    "click",
    function(){

        addMessage(
            "Mikrofon butonu hazır. Ses sistemi daha sonra bağlanabilir.",
            "aura"
        );

    }
);


/* =========================
   SAYFA AÇILINCA
========================= */

window.addEventListener(
    "load",
    function(){

        input.focus();

        chat.scrollTop =
            chat.scrollHeight;

    }
);

</script>

</body>
</html>
