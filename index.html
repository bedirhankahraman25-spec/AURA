<!DOCTYPE html>
<html lang="tr">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#02060a">

<title>AURA AI</title>

<style>

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
}

body {
    overflow: hidden;
    font-family: Arial, sans-serif;
    color: #00eaff;

    background:
        radial-gradient(
            circle at center,
            #06303d 0%,
            #02080c 50%,
            #000000 100%
        );
}

/* ÜST BAR */

.top-bar {
    height: 60px;

    display: flex;
    align-items: center;
    justify-content: space-between;

    padding: 0 18px;

    background: rgba(0,10,15,0.9);

    border-bottom:
        1px solid
        rgba(0,234,255,0.4);
}

.logo {
    font-size: 21px;
    font-weight: bold;

    letter-spacing: 4px;

    text-shadow:
        0 0 10px #00eaff,
        0 0 25px #00eaff;
}

.status {
    font-size: 11px;

    letter-spacing: 2px;

    color: #55ffcc;
}

.status::before {
    content: "";

    display: inline-block;

    width: 7px;
    height: 7px;

    margin-right: 7px;

    border-radius: 50%;

    background: #55ffcc;

    box-shadow:
        0 0 8px #55ffcc,
        0 0 15px #55ffcc;
}

/* ANA ALAN */

.main {
    height: calc(100vh - 60px);
    height: calc(100dvh - 60px);

    display: flex;
    flex-direction: column;
    align-items: center;

    min-height: 0;
}

/* AURA ÇEKİRDEĞİ */

.aura-core {
    width: 210px;
    height: 210px;

    margin-top: 10px;

    position: relative;

    display: flex;
    align-items: center;
    justify-content: center;

    flex-shrink: 0;
}

/* HALKALAR */

.aura-ring {
    position: absolute;

    border-radius: 50%;

    border: 1px solid #00eaff;

    opacity: 0.7;
}

.ring1 {
    width: 135px;
    height: 135px;

    border-left-color: transparent;
    border-right-color: transparent;

    animation:
        rotate1 7s linear infinite;
}

.ring2 {
    width: 175px;
    height: 175px;

    border-top-color: transparent;
    border-bottom-color: transparent;

    animation:
        rotate2 10s linear infinite;
}

.ring3 {
    width: 210px;
    height: 210px;

    border-left-color: transparent;
    border-bottom-color: transparent;

    animation:
        rotate1 14s linear infinite;
}

/* MERKEZ */

.aura-center {
    width: 100px;
    height: 100px;

    border-radius: 50%;

    border:
        2px solid
        #00eaff;

    display: flex;
    align-items: center;
    justify-content: center;

    color: #00eaff;

    font-size: 21px;
    font-weight: bold;

    letter-spacing: 3px;

    background:
        radial-gradient(
            circle,
            #064454,
            #02090d
        );

    box-shadow:
        0 0 15px #00eaff,
        0 0 45px rgba(0,234,255,0.7),
        inset 0 0 25px rgba(0,234,255,0.5);

    animation:
        pulse 2.2s infinite ease-in-out;

    z-index: 5;
}

/* ANİMASYONLAR */

@keyframes rotate1 {

    from {
        transform: rotate(0deg);
    }

    to {
        transform: rotate(360deg);
    }
}

@keyframes rotate2 {

    from {
        transform: rotate(360deg);
    }

    to {
        transform: rotate(0deg);
    }
}

@keyframes pulse {

    0%,
    100% {
        transform: scale(1);
    }

    50% {
        transform: scale(1.06);
    }
}

/* DURUM */

.aura-status {
    margin-top: -8px;
    margin-bottom: 5px;

    font-size: 10px;

    letter-spacing: 3px;

    color: #8defff;
}

/* SOHBET */

#chat {
    width: min(92%, 600px);

    flex: 1;
    min-height: 0;

    overflow-y: auto;

    padding: 5px 5px 10px;
}

.message {
    max-width: 85%;

    padding: 10px 13px;

    margin-bottom: 10px;

    border-radius: 10px;

    line-height: 1.4;

    white-space: pre-wrap;

    font-size: 14px;
}

.aura {
    background:
        rgba(0,35,45,0.8);

    margin-right: auto;

    border:
        1px solid
        rgba(0,234,255,0.25);
}

.user {
    background:
        rgba(0,90,120,0.8);

    margin-left: auto;

    color: white;
}

/* ALT PANEL */

#bottom {
    width: 100%;

    min-height: 65px;

    display: flex;

    align-items: center;

    gap: 8px;

    padding: 10px;

    background:
        rgba(0,10,15,0.97);

    border-top:
        1px solid
        rgba(0,234,255,0.45);

    z-index: 10;
}

/* YAZI KUTUSU */

#input {
    flex: 1;

    min-width: 0;

    height: 45px;

    padding: 12px;

    border-radius: 8px;

    border:
        1px solid
        rgba(0,234,255,0.5);

    outline: none;

    background:
        rgba(0,25,32,0.95);

    color: #00eaff;

    font-size: 14px;
}

#input::placeholder {
    color: #548995;
}

/* BUTONLAR */

button {
    height: 45px;

    border:
        1px solid
        #00eaff;

    border-radius: 8px;

    padding: 0 14px;

    background:
        rgba(0,60,75,0.9);

    color: #00eaff;

    font-size: 14px;

    cursor: pointer;
}

button:active {
    transform: scale(0.94);
}

button:disabled {
    opacity: 0.5;
}

.mic-button {
    width: 45px;

    padding: 0;

    font-size: 20px;
}

/* TELEFON */

@media (max-width: 500px) {

    .aura-core {
        transform: scale(0.82);

        margin-top: 0;
        margin-bottom: -15px;
    }

    .logo {
        font-size: 18px;
    }

    button {
        padding: 0 11px;
    }
}

</style>

</head>

<body>

<!-- ÜST BAR -->

<div class="top-bar">

    <div class="logo">
        AURA
    </div>

    <div class="status">
        ONLINE
    </div>

</div>


<!-- ANA ALAN -->

<div class="main">

    <!-- AURA ÇEKİRDEĞİ -->

    <div class="aura-core">

        <div class="aura-ring ring1"></div>

        <div class="aura-ring ring2"></div>

        <div class="aura-ring ring3"></div>

        <div class="aura-center">
            AURA
        </div>

    </div>


    <div class="aura-status">
        AI SYSTEM READY
    </div>


    <!-- SOHBET -->

    <div id="chat"></div>


    <!-- MESAJ GİRİŞİ -->

    <div id="bottom">

        <input
            id="input"
            type="text"
            placeholder="AURA'ya bir şey sor..."
            autocomplete="off"
        >

        <button
            class="mic-button"
            id="micButton"
            type="button">
            🎤
        </button>

        <button
            id="sendButton"
            type="button">
            Gönder
        </button>

    </div>

</div>


<!-- PUTER AI -->

<script src="https://js.puter.com/v2/"></script>


<script>

/* ELEMENTLER */

const chat =
    document.getElementById("chat");

const input =
    document.getElementById("input");

const sendButton =
    document.getElementById("sendButton");

const micButton =
    document.getElementById("micButton");


/* AURA'NIN HAFIZASI */

const conversation = [

    {
        role: "system",

        content:
        `Sen AURA adında kişisel bir yapay zekâ asistanısın.

Kullanıcı Türkçe konuşuyor.

Kullanıcıya doğal, anlaşılır ve kısa cevaplar ver.

Kullanıcının adı Bedirhan Kahraman.

Kullanıcının sevgilisinin adı Edanur Kahraman.

Bu bilgileri yalnızca kullanıcı bunlarla ilgili soru sorduğunda kullan.

Kendini AURA olarak tanıt.

Kullanıcı "ben kimim" diye sorarsa Bedirhan Kahraman olduğunu söyle.

Kullanıcı "sevgilimin adı ne" diye sorarsa Edanur Kahraman olduğunu söyle.

Kullanıcı özel olarak istemedikçe gereksiz uzun cevaplar verme.

Bilmediğin bir şeyi biliyormuş gibi uydurma.

Sorunun cevabını doğrudan ver.`
    }

];


/* MESAJ EKLEME */

function addMessage(text, type) {

    const message =
        document.createElement("div");

    message.className =
        "message " + type;

    message.textContent =
        text;

    chat.appendChild(message);

    chat.scrollTop =
        chat.scrollHeight;
}


/* SESLİ CEVAP */

function speak(text) {

    if (!("speechSynthesis" in window)) {
        return;
    }

    const message =
        new SpeechSynthesisUtterance(text);

    message.lang =
        "tr-TR";

    message.rate =
        0.9;

    message.pitch =
        1;

    message.volume =
        1;

    window.speechSynthesis.cancel();

    setTimeout(function() {

        window.speechSynthesis.speak(message);

    }, 100);
}


/* AI CEVABI */

async function askAI(text) {

    conversation.push({
        role: "user",
        content: text
    });


    try {

        const response =
            await puter.ai.chat(
                conversation,
                {
                    model: "gpt-5.4-nano"
                }
            );


        let answer = "";


        if (
            response &&
            response.message &&
            response.message.content
        ) {

            answer =
                response.message.content;

        } else if (
            response &&
            response.text
        ) {

            answer =
                response.text;

        } else if (
            typeof response === "string"
        ) {

            answer =
                response;

        } else {

            answer =
                String(response);
        }


        conversation.push({
            role: "assistant",
            content: answer
        });


        return answer;

    }

    catch (error) {

        console.error(
            "AURA AI HATASI:",
            error
        );


        return "AI bağlantısında bir sorun oluştu. Biraz sonra tekrar deneyelim.";
    }
}


/* MESAJ GÖNDER */

async function sendMessage() {

    const text =
        input.value.trim();


    if (!text) {
        return;
    }


    addMessage(
        text,
        "user"
    );


    input.value = "";


    sendButton.disabled =
        true;

    micButton.disabled =
        true;


    addMessage(
        "Düşünüyorum...",
        "aura"
    );


    const loadingMessage =
        chat.lastElementChild;


    try {

        const reply =
            await askAI(text);


        if (loadingMessage) {

            loadingMessage.remove();
        }


        addMessage(
            reply,
            "aura"
        );


        speak(reply);

    }

    catch (error) {

        if (loadingMessage) {

            loadingMessage.remove();
        }


        addMessage(
            "Bir hata oluştu. Tekrar deneyebiliriz.",
            "aura"
        );
    }


    sendButton.disabled =
        false;

    micButton.disabled =
        false;

    input.focus();
}


/* GÖNDER BUTONU */

sendButton.addEventListener(
    "click",
    sendMessage
);


/* ENTER */

input.addEventListener(
    "keydown",
    function(event) {

        if (
            event.key === "Enter"
        ) {

            event.preventDefault();

            sendMessage();
        }
    }
);


/* SESLİ KOMUT */

function startListening() {

    const SpeechRecognition =
        window.SpeechRecognition ||
        window.webkitSpeechRecognition;


    if (!SpeechRecognition) {

        addMessage(
            "Bu tarayıcı sesli komutu desteklemiyor.",
            "aura"
        );

        return;
    }


    const recognition =
        new SpeechRecognition();


    recognition.lang =
        "tr-TR";

    recognition.continuous =
        false;

    recognition.interimResults =
        false;


    recognition.onstart =
        function() {

            micButton.disabled =
                true;

            addMessage(
                "Dinliyorum...",
                "aura"
            );
        };


    recognition.onresult =
        function(event) {

            const text =
                event.results[0][0].transcript;


            input.value =
                text;


            sendMessage();
        };


    recognition.onerror =
        function(event) {

            console.error(
                "Mikrofon hatası:",
                event.error
            );


            addMessage(
                "Sesli komut alınamadı.",
                "aura"
            );


            micButton.disabled =
                false;
        };


    recognition.onend =
        function() {

            micButton.disabled =
                false;
        };


    try {

        recognition.start();

    }

    catch (error) {

        micButton.disabled =
            false;

        addMessage(
            "Mikrofon başlatılamadı.",
            "aura"
        );
    }
}


/* MİKROFON BUTONU */

micButton.addEventListener(
    "click",
    startListening
);


/* BAŞLANGIÇ MESAJI */

addMessage(
    "Merhaba. Ben AURA AI.\n\n" +
    "Gerçek yapay zekâ bağlantım hazır. Seni dinliyorum.",
    "aura"
);

</script>

</body>
</html>
