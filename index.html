<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,
initial-scale=1,
maximum-scale=1,
user-scalable=no">

<meta name="theme-color"
content="#02050a">

<title>AURA</title>

<style>

*{
box-sizing:border-box;
margin:0;
padding:0;
-webkit-tap-highlight-color:transparent;
}

html,
body{
width:100%;
height:100%;
overflow:hidden;
background:#02050a;
color:#eaffff;
font-family:
Arial,
Roboto,
Helvetica,
sans-serif;
}

body{
touch-action:manipulation;
}

button,
input,
textarea{
font-family:inherit;
}

button{
border:0;
outline:0;
}

#app{
position:fixed;
inset:0;
width:100%;
height:100%;
overflow:hidden;

background:
radial-gradient(
circle at 50% 50%,
rgba(0,220,255,.09),
transparent 28%
),
radial-gradient(
circle at 50% 50%,
rgba(0,100,255,.05),
transparent 55%
),
#02050a;
}

/* =========================
   ARKA PLAN
========================= */

.grid{
position:absolute;
inset:0;
pointer-events:none;
opacity:.12;

background-image:
linear-gradient(
rgba(0,220,255,.08) 1px,
transparent 1px
),
linear-gradient(
90deg,
rgba(0,220,255,.08) 1px,
transparent 1px
);

background-size:
42px 42px;
}

.vignette{
position:absolute;
inset:0;
pointer-events:none;

background:
radial-gradient(
ellipse at center,
transparent 30%,
rgba(0,0,0,.52) 100%
);
}

/* =========================
   ANA EKRAN
========================= */

#main{
position:absolute;
inset:0;

display:flex;
align-items:center;
justify-content:center;

z-index:5;
}

.core-wrapper{
position:relative;

width:340px;
height:340px;

display:flex;
align-items:center;
justify-content:center;
}

#auraCore{
position:relative;

width:260px;
height:260px;

border-radius:50%;

display:flex;
align-items:center;
justify-content:center;

cursor:pointer;
user-select:none;

touch-action:manipulation;

z-index:10;

-webkit-user-select:none;

transition:
transform .22s ease,
filter .22s ease;
}

#auraCore:active{
transform:scale(.93);
}

/* =========================
   ÇEKİRDEK
========================= */

.core-ring{
position:absolute;
inset:0;

border-radius:50%;

pointer-events:none;
}

.ring-one{
border:
1px solid
rgba(0,234,255,.55);

border-top-color:
#00eaff;

border-bottom-color:
transparent;

animation:
rotateOne 12s linear infinite;
}

.ring-two{
inset:15px;

border:
1px solid
rgba(0,130,255,.42);

border-left-color:
#008cff;

border-right-color:
transparent;

animation:
rotateTwo 8s linear infinite;
}

.ring-three{
inset:31px;

border:
1px solid
rgba(0,255,190,.25);

animation:
pulseRing 2.4s ease-in-out infinite;
}

.ring-four{
inset:48px;

border:
1px dashed
rgba(100,240,255,.16);

animation:
rotateTwo 15s linear infinite;
}

.core-glow{
position:absolute;

width:150px;
height:150px;

border-radius:50%;

background:
radial-gradient(
circle,
#ffffff 0%,
#b8fbff 5%,
#00eaff 18%,
#008cff 42%,
rgba(0,110,255,.22) 66%,
transparent 76%
);

box-shadow:
0 0 25px #00eaff,
0 0 55px rgba(0,220,255,.7),
0 0 110px rgba(0,120,255,.35);

animation:
corePulse 2.2s
ease-in-out infinite;

pointer-events:none;
}

.core-light{
position:absolute;

width:70px;
height:70px;

border-radius:50%;

background:
radial-gradient(
circle,
rgba(255,255,255,.95),
rgba(180,255,255,.35) 35%,
transparent 72%
);

transform:
translate(-22px,-25px);

filter:blur(2px);

pointer-events:none;
}

.core-text{
position:absolute;

z-index:20;

color:white;

font-size:
clamp(28px,8vw,38px);

font-weight:900;

letter-spacing:7px;

transform:
translateX(3px);

text-shadow:
0 0 8px #00eaff,
0 0 20px #00eaff,
0 0 45px rgba(0,210,255,.9);

pointer-events:none;
}

.core-status{
position:absolute;

top:calc(100% + 18px);

left:50%;

transform:
translateX(-50%);

font-size:9px;

font-weight:700;

letter-spacing:4px;

color:
rgba(150,230,240,.5);

white-space:nowrap;

pointer-events:none;

transition:
color .25s ease,
text-shadow .25s ease;
}

/* =========================
   ÇEKİRDEK DURUMLARI
========================= */

#auraCore.processing
.core-glow{
animation:
processingPulse .65s
ease-in-out infinite;
}

#auraCore.listening
.core-glow{
animation:
listeningPulse .8s
ease-in-out infinite;
}

#auraCore.speaking
.core-glow{
animation:
speakingPulse .4s
ease-in-out infinite;
}

#auraCore.processing
.core-status{
color:#00eaff;
text-shadow:
0 0 15px #00eaff;
}

#auraCore.listening
.core-status{
color:#55ffae;
text-shadow:
0 0 15px #00ff9d;
}

#auraCore.speaking
.core-status{
color:#8da4ff;
text-shadow:
0 0 15px #566cff;
}

/* =========================
   ANİMASYONLAR
========================= */

@keyframes rotateOne{

from{
transform:rotate(0deg);
}

to{
transform:rotate(360deg);
}

}

@keyframes rotateTwo{

from{
transform:rotate(360deg);
}

to{
transform:rotate(0deg);
}

}

@keyframes pulseRing{

0%,100%{
transform:scale(.94);
opacity:.35;
}

50%{
transform:scale(1.06);
opacity:.9;
}

}

@keyframes corePulse{

0%,100%{
transform:scale(.91);
}

50%{
transform:scale(1.08);
}

}

@keyframes processingPulse{

0%,100%{
transform:scale(.86);
}

50%{
transform:scale(1.18);
}

}

@keyframes listeningPulse{

0%,100%{
transform:scale(.88);
}

50%{
transform:scale(1.22);
}

}

@keyframes speakingPulse{

0%,100%{
transform:scale(.9);
}

50%{
transform:scale(1.25);
}

}

/* =========================
   SOHBET KATMANI
========================= */

#chatOverlay{
position:absolute;
inset:0;

display:flex;
align-items:flex-end;
justify-content:center;

padding:
14px;

background:
rgba(0,3,8,.52);

backdrop-filter:
blur(9px);

-webkit-backdrop-filter:
blur(9px);

opacity:0;
visibility:hidden;
pointer-events:none;

transition:
opacity .25s ease,
visibility .25s ease;

z-index:100;
}

#chatOverlay.open{
opacity:1;
visibility:visible;
pointer-events:auto;
}

#chatPanel{
position:relative;

width:
min(760px,100%);

height:
min(70vh,650px);

min-height:400px;

display:flex;
flex-direction:column;

overflow:hidden;

border-radius:
24px 24px 15px 15px;

background:
linear-gradient(
180deg,
rgba(7,17,28,.98),
rgba(2,7,14,.99)
);

border:
1px solid
rgba(0,225,255,.22);

box-shadow:
0 0 50px
rgba(0,120,255,.13);

transform:
translateY(40px);

transition:
transform .28s ease;
}

#chatOverlay.open
#chatPanel{
transform:
translateY(0);
}

.chat-header{
height:58px;

flex-shrink:0;

display:flex;
align-items:center;
justify-content:space-between;

padding:
0 15px;

border-bottom:
1px solid
rgba(0,220,255,.12);

background:
rgba(4,11,20,.8);
}

.chat-brand{
display:flex;
align-items:center;
gap:9px;
}

.chat-dot{
width:8px;
height:8px;

border-radius:50%;

background:#00eaff;

box-shadow:
0 0 8px #00eaff,
0 0 20px rgba(0,234,255,.7);
}

.chat-title{
font-size:13px;
font-weight:800;

letter-spacing:3px;

color:#dffcff;
}

.chat-close{
width:38px;
height:38px;

border-radius:11px;

background:
rgba(255,255,255,.055);

border:
1px solid
rgba(255,255,255,.06);

color:#b9d5dc;

font-size:23px;

cursor:pointer;
}

.chat-close:active{
transform:scale(.9);
}

/* =========================
   MESAJLAR
========================= */

#chat{
flex:1;

min-height:0;

overflow-y:auto;

padding:
15px 13px;

-webkit-overflow-scrolling:
touch;
}

#chat::-webkit-scrollbar{
width:4px;
}

#chat::-webkit-scrollbar-thumb{
background:
rgba(0,220,255,.24);

border-radius:10px;
}

.message{
display:flex;

width:100%;

margin-bottom:11px;

animation:
messageIn .2s ease;
}

.message.user{
justify-content:flex-end;
}

.message.aura{
justify-content:flex-start;
}

.bubble{
max-width:
86%;

padding:
11px 13px;

border-radius:
15px;

font-size:13px;

line-height:1.5;

white-space:pre-wrap;

word-break:break-word;
}

.message.aura
.bubble{
background:
linear-gradient(
135deg,
rgba(0,220,255,.08),
rgba(0,100,255,.035)
);

border:
1px solid
rgba(0,220,255,.14);

border-bottom-left-radius:
5px;
}

.message.user
.bubble{
background:
linear-gradient(
135deg,
rgba(0,120,255,.25),
rgba(0,220,255,.08)
);

border:
1px solid
rgba(0,150,255,.25);

border-bottom-right-radius:
5px;
}

.msg-label{
display:block;

margin-bottom:4px;

font-size:8px;

font-weight:800;

letter-spacing:1.5px;

color:#00eaff;
}

.message.user
.msg-label{
color:#72bcff;
text-align:right;
}

@keyframes messageIn{

from{
opacity:0;
transform:
translateY(7px);
}

to{
opacity:1;
transform:
translateY(0);
}

}

/* =========================
   YAZMA ALANI
========================= */

.chat-input-area{
display:flex;
align-items:center;

gap:8px;

padding:9px;

border-top:
1px solid
rgba(0,220,255,.11);

background:
rgba(2,7,14,.95);
}

.mic-btn{
width:48px;
height:48px;

flex:0 0 48px;

border-radius:14px;

color:#00eaff;

background:
rgba(0,220,255,.06);

border:
1px solid
rgba(0,234,255,.2);

font-size:20px;

cursor:pointer;
}

.mic-btn:active{
transform:scale(.92);
}

.mic-btn.active{
color:white;

background:
rgba(0,255,157,.12);

border-color:
rgba(0,255,157,.45);

box-shadow:
0 0 20px
rgba(0,255,157,.18);
}

.input-wrap{
position:relative;

flex:1;

height:48px;
}

#userInput{
width:100%;
height:100%;

border-radius:14px;

outline:none;

border:
1px solid
rgba(0,220,255,.17);

background:
rgba(255,255,255,.035);

color:#e8fbff;

padding:
0 52px 0 14px;

font-size:13px;
}

#userInput::placeholder{
color:#55727e;
}

#userInput:focus{
border-color:
rgba(0,234,255,.4);

box-shadow:
0 0 0 2px
rgba(0,220,255,.04);
}

.send-btn{
position:absolute;

right:4px;
top:4px;

width:40px;
height:40px;

border-radius:11px;

background:#00eaff;

color:#001014;

font-size:18px;

font-weight:900;

cursor:pointer;
}

.send-btn:active{
transform:scale(.88);
}

.typing{
display:flex;

gap:4px;

align-items:center;

height:20px;
}

.typing span{
width:5px;
height:5px;

border-radius:50%;

background:#5beeff;

animation:
typing .8s
ease-in-out infinite;
}

.typing span:nth-child(2){
animation-delay:.15s;
}

.typing span:nth-child(3){
animation-delay:.3s;
}

@keyframes typing{

0%,100%{
transform:translateY(0);
opacity:.3;
}

50%{
transform:translateY(-4px);
opacity:1;
}

}

      </style><style>

/* =========================
   MOBİL
========================= */

@media(max-width:600px){

.core-wrapper{
width:300px;
height:300px;
}

#auraCore{
width:230px;
height:230px;
}

.core-glow{
width:132px;
height:132px;
}

#chatOverlay{
padding:0;
align-items:flex-end;
}

#chatPanel{
width:100%;
height:82vh;
min-height:390px;

border-radius:
23px 23px 0 0;
}

.bubble{

font-size:13px;
}

}

#auraCore{

height:190px;
}

.core-wrapper{
width:250px;
height:250px;
}

.core-glow{
width:110px;
height:110px;
}

.core-status{
top:
calc(100% + 10px);
}

#chatPanel{

}

}

/* =========================
   HAFIZA / GÖREV VERİLERİ
========================= */

</style>
</head>

<body>

id="auraCore"

tabindex="0"
aria-label="AURA'yı aç"
>

<div
class="core-ring ring-one">
</div>

<div
class="core-ring ring-two">
</div>

<div
class="core-ring ring-three">
</div>

<div
class="core-ring ring-four">
</div>

<div class="core-glow"></div>

<div class="core-light"></div>

<div class="core-text">
AURA
</div>

id="coreStatus"
class="core-status">
READY
</div>

</div>

</div>

</main>

<!-- =====================
     SOHBET
===================== -->

<div
id="chatOverlay"

>

<section
id="chatPanel"

<script>

"use strict";

/* =========================
   AURA ÇEKİRDEĞİ
========================= */

const AURA_VERSION =
"6.0-CLEAN";

const USER_NAME =
localStorage.getItem(
"aura_user_name"
) || "Kullanıcı";

const GIRLFRIEND_NAME =
localStorage.getItem(
"aura_girlfriend_name"
) || "Edanur Kahraman";

const STORAGE = {

memories:
"aura_memories_v2",

tasks:
"aura_tasks_v2",

history:
"aura_history_v2",

voice:
"aura_voice",

messages:
"aura_messages_clean",

continuous:
"aura_continuous",

proactive:
"aura_proactive",

automation:
"aura_automation"

};

const AURA = {

online:
navigator.onLine,

chatOpen:false,

processing:false,

listening:false,

speaking:false,

voiceEnabled:
localStorage.getItem(
STORAGE.voice
) !== "false",

continuousMode:
localStorage.getItem(
STORAGE.continuous
) === "true",

proactiveEnabled:
localStorage.getItem(
STORAGE.proactive
) !== "false",

automationEnabled:
localStorage.getItem(
STORAGE.automation
) !== "false",

memories:[],

tasks:[],

history:[],

messageCount:
Number(
localStorage.getItem(
"aura_message_count"
) || 0
),

recognition:null

};

/* =========================
   ELEMENTLER
========================= */

const app =
document.getElementById(
"app"
);

const auraCore =
document.getElementById(
"auraCore"
);

const coreStatus =
document.getElementById(
"coreStatus"
);

const chatOverlay =
document.getElementById(
"chatOverlay"
);

const chatPanel =
document.getElementById(
"chatPanel"
);

const chat =
document.getElementById(
"chat"
);

const userInput =
document.getElementById(
"userInput"
);

const sendBtn =
document.getElementById(
"sendBtn"
);

const micBtn =
document.getElementById(
"micBtn"
);

/* =========================
   LOCAL STORAGE
========================= */

function saveJSON(
key,
value
){

try{

localStorage.setItem(
key,
JSON.stringify(value)
);

}catch(error){

console.error(
"AURA storage:",
error
);

}

}

function loadJSON(
key,
fallback
){

try{

const raw =
localStorage.getItem(
key
);

if(!raw){
return fallback;
}

return JSON.parse(raw);

}catch(error){

return fallback;

}

}

/* =========================
   ÇEKİRDEK DURUMU
========================= */

function coreState(
state=""
){

auraCore.classList.remove(
"processing",
"listening",
"speaking"
);

if(state){

auraCore.classList.add(
state
);

}

if(state==="processing"){

coreStatus.textContent =
"PROCESSING";

}else if(
state==="listening"
){

coreStatus.textContent =
"LISTENING";

}else if(
state==="speaking"
){

coreStatus.textContent =
"SPEAKING";

}else{

coreStatus.textContent =
AURA.online
? "ONLINE"
: "OFFLINE";

}

}

/* =========================
   SOHBETİ AÇ / KAPAT
========================= */

function toggleChatPanel(
force
){

let shouldOpen;

if(
typeof force ===
"boolean"
){

shouldOpen =
force;

}else{

shouldOpen =
!AURA.chatOpen;

}

AURA.chatOpen =
shouldOpen;

if(
shouldOpen
){

chatOverlay.classList.add(
"open"
);

chatOverlay.setAttribute(
"aria-hidden",
"false"
);

setTimeout(
()=>{

userInput.focus();

scrollChat();

},
250
);

}else{

chatOverlay.classList.remove(
"open"
);

chatOverlay.setAttribute(
"aria-hidden",
"true"
);

userInput.blur();

}

}

/* =========================
   EN ÖNEMLİ KISIM:
   ÇEKİRDEK DOKUNMA
========================= */

let coreTouchHandled =
false;

function openFromCore(
event
){

if(event){

event.preventDefault();
event.stopPropagation();

}

if(coreTouchHandled){

return;

}

coreTouchHandled =
true;

toggleChatPanel();

setTimeout(
()=>{

coreTouchHandled =
false;

},
450
);

}

/*
 * pointerup:
 * Android / Chrome için ana yöntem.
 */

auraCore.addEventListener(
"pointerup",
openFromCore,
{
passive:false
}
);

/*
 * touchend:
 * Bazı PWA/WebView
 * sürümlerinde pointer
 * olayı çalışmazsa yedek.
 */

auraCore.addEventListener(
"touchend",
event=>{

event.preventDefault();

openFromCore(event);

},
{
passive:false
}
);

/*
 * click:
 * Masaüstü ve son yedek.
 */

auraCore.addEventListener(
"click",
event=>{

event.preventDefault();

openFromCore(event);

}
);

/*
 * Klavye.
 */

auraCore.addEventListener(
"keydown",
event=>{

if(
event.key==="Enter" ||
event.key===" "
){

event.preventDefault();

toggleChatPanel();

}

}
);

/* =========================
   KAPAT
========================= */

document
.getElementById(
"closeChat"
)
.addEventListener(
"click",
event=>{

event.preventDefault();

event.stopPropagation();

toggleChatPanel(
false
);

}
);

chatOverlay.addEventListener(
"click",
event=>{

if(
event.target ===
chatOverlay
){

toggleChatPanel(
false
);

}

});

/* =========================
   SCROLL
========================= */

function scrollChat(){

requestAnimationFrame(
()=>{

chat.scrollTop =
chat.scrollHeight;

}
);

}

/* =========================
   MESAJ EKLE
========================= */

function addMessage(
text,
sender="aura",
speakIt=false
){

const wrap =
document.createElement(
"div"
);

wrap.className =
"message " +
sender;

const bubble =
document.createElement(
"div"
);

bubble.className =
"bubble";

const label =
document.createElement(
"span"
);

label.className =
"msg-label";

label.textContent =
sender==="user"
? USER_NAME
: "AURA";

bubble.appendChild(
label
);

bubble.appendChild(
document.createTextNode(
String(text)
)
);

wrap.appendChild(
bubble
);

chat.appendChild(
wrap
);

AURA.messageCount++;

localStorage.setItem(
"aura_message_count",
AURA.messageCount
);

scrollChat();

if(
speakIt &&
sender==="aura" &&
AURA.voiceEnabled
){

speak(text);

}

}

/* =========================
   TYPING
========================= */

function showTyping(){

removeTyping();

const wrap =
document.createElement(
"div"
);

wrap.className =
"message aura";

wrap.id =
"auraTyping";

const bubble =
document.createElement(
"div"
);

bubble.className =
"bubble";

const label =
document.createElement(
"span"
);

label.className =
"msg-label";

function addMemory(
key,
value,
category="genel"
){

key =
String(key)
.trim();

value =
String(value)
.trim();

if(
!key ||
!value
){

return false;

}

const existing =
AURA.memories.find(
item=>
item.key.toLowerCase()===
key.toLowerCase()
);

if(existing){

existing.value =
value;

existing.category =
category;

existing.updated =
new Date()
.toISOString();

}else{

AURA.memories.push({

id:
Date.now()+
"_"+Math.random(),

key:key,

value:value,

category:category,

created:
new Date()
.toISOString(),

updated:
new Date()
.toISOString()

});

}

saveJSON(
STORAGE.memories,
AURA.memories
);

return true;

}

function getMemoryContext(){

if(
!AURA.memories.length
){

return "Kayıtlı hafıza bulunmuyor.";

}

return AURA.memories
.map(
item=>
"- "+
item.key+
": "+
item.value
)
.join("\n");

}

function handleMemoryCommand(
text
){

const lower =
text.toLowerCase();

let match =
text.match(
/(?:beni\s+)?hatırla\s*[:\-]?\s*(.+)/i
);

if(match){

addMemory(
"Kullanıcı bilgisi",
match[1].trim(),
"kişisel"
);

return (
"Tamam. Bu bilgiyi "
+
"kalıcı hafızama kaydettim."
);

}

match =
text.match(
/(?:hafızana|hafızaya)\s+kaydet\s*[:\-]?\s*(.+)/i
);

if(match){

addMemory(
"Kullanıcı notu",
match[1].trim(),
"not"
);

return (
"Bilgiyi kalıcı "
+
"hafızaya kaydettim."
);

}

if(
lower.includes(
"ne hatırlıyorsun"
) ||
lower.includes(
"hafızanda ne var"
) ||
lower.includes(
"beni hatırlıyor musun"
)
){

return getMemoryContext();

}

if(
lower.includes(
"hafıza sayısı"
) ||
lower.includes(
"kaç hafıza"
)
){

return (
"Şu anda "
+
AURA.memories.length+
" kayıtlı hafıza var."
);

}

return null;

}<script>

/* =========================
   GÖREV SİSTEMİ
========================= */

function addTask(
title,
minutes=1
){

title =
String(title)
.trim();

if(!title){
return false;
}

const task={

id:
Date.now()+
"_"+Math.random(),

title:title,

due:
Date.now()+
Math.max(
1,
Number(minutes)||1
)*60000,

completed:false,

created:
new Date()
.toISOString()

};

AURA.tasks.push(
task
);

saveJSON(
STORAGE.tasks,
AURA.tasks
);

return true;

}

function getTaskContext(){

const active =
AURA.tasks.filter(
task=>!task.completed
);

if(!active.length){

return (
"Aktif görev bulunmuyor."
);

}

return active
.map(
task=>
"- "+
task.title+
" ("+
new Date(
task.due
).toLocaleString(
"tr-TR"
)+")"
)
.join("\n");

}

function parseTaskCommand(
text
){

let clean =
text.replace(
/^(görev oluştur|görev ekle|hatırlat)\s*/i,
""
)
.trim();

if(!clean){
return null;
}

let match =
clean.match(
/(\d+)\s*dakika\s+sonra/i
);

if(match){

const minutes =
Number(
match[1]
);

clean =
clean.replace(
match[0],
""
)
.trim();

return {

title:
clean,

minutes:
minutes

};

}

match =
clean.match(
/(\d+)\s*saat\s+sonra/i
);

if(match){

const hours =
Number(
match[1]
);

clean =
clean.replace(
match[0],
""
)
.trim();

return {

title:
clean,

minutes:
hours*60

};

}

return {

title:
clean,

minutes:1

};

}

function handleTaskCommand(
text
){

const lower =
text.toLowerCase();

if(
lower.startsWith(
"görev oluştur"
) ||
lower.startsWith(
"görev ekle"
) ||
lower.startsWith(
"hatırlat "
)
){

const parsed =
parseTaskCommand(
text
);

if(
!parsed ||
!parsed.title
){

return (
"Görev adını da "
+
"yazmalısın."
);

}

addTask(
parsed.title,
parsed.minutes
);

return (
"Tamam. "
+
parsed.title+
" görevini oluşturdum."
);

}

if(
lower.includes(
"görevlerim"
) ||
lower.includes(
"aktif görevler"
) ||
lower.includes(
"hangi görevler var"
)
){

return getTaskContext();

}

return null;

}

/* =========================
   TEMEL AURA CEVAPLARI
========================= */

function generateGreeting(){

const hour =
new Date()
.getHours();

let greeting;

if(hour<12){

greeting =
"Günaydın";

}else if(hour<18){

greeting =
"İyi günler";

}else{

greeting =
"İyi akşamlar";

}

return (
greeting+
". AURA hazır. "
+
"Nasıl yardımcı olabilirim?"
);

}

function naturalResponse(
text
){

const lower =
text
.toLowerCase()
.trim();

/* Hafıza */

const memory =
handleMemoryCommand(
text
);

if(memory){

return memory;

}

/* Görev */

const task =
handleTaskCommand(
text
);

if(task){

return task;

}

/* Selam */

if(
/^(merhaba|selam|sa|hey|günaydın|iyi akşamlar|iyi geceler)\b/i
.test(text)
){

return generateGreeting();

}

/* Kimlik */

if(
lower.includes(
"sen kimsin"
) ||
lower.includes(
"adın ne"
) ||
lower==="kimsin"
){

return (
"Ben AURA. "
+
"Telefonunda çalışan "
+
"kişisel yapay zeka "
+
"asistanınım."
);

}

/* Kullanıcı */

if(
lower.includes(
"benim adım ne"
) ||
lower.includes(
"adımı biliyor musun"
)
){

return (
"Adını "
+
USER_NAME+
" olarak biliyorum."
);

}

/* Sevgili */

if(
lower.includes(
"sevgilimin adı ne"
) ||
lower.includes(
"sevgilim kim"
)
){

return (
"Sevgilinin adı "
+
GIRLFRIEND_NAME+
"."
);

}

/* Nasılsın */

if(
lower.includes(
"nasılsın"
) ||
lower.includes(
"iyi misin"
)
){

return (
"Sistemlerim normal "
+
"çalışıyor. AURA hazır."
);

}

/* Teşekkür */

if(
lower.includes(
"teşekkür"
) ||
lower.includes(
"sağ ol"
)
){

return "Rica ederim.";

}

/* Saat */

if(
lower.includes(
"saat kaç"
) ||
lower.includes(
"saati söyle"
)
){

return (
"Şu an saat "+
new Date()
.toLocaleTimeString(
"tr-TR",
{
hour:"2-digit",
minute:"2-digit"
}
)+"."
);

}

/* Tarih */

if(
lower.includes(
"tarih ne"
) ||
lower.includes(
"bugün hangi gün"
)
){

return (
"Bugün "+
new Date()
.toLocaleDateString(
"tr-TR",
{
weekday:"long",
day:"numeric",
month:"long",
year:"numeric"
}
)+"."
);

}

/* Hafıza temizleme */

if(
lower.includes(
"hafızayı temizle"
)
){

AURA.memories=[];

saveJSON(
STORAGE.memories,
[]
);

return (
"Kalıcı hafızayı temizledim."
);

}

/* Görev sayısı */

if(
lower.includes(
"kaç görev var"
)
){

const active =
AURA.tasks.filter(
t=>!t.completed
).length;

return (
"Şu anda "+
active+
" aktif görevin var."
);

}

/* Yardım */

if(
lower==="yardım" ||
lower.includes(
"hangi komutlar"
) ||
lower.includes(
"komutları göster"
)
){

return (
"Deneyebileceğin komutlar:\n\n"+
"• Merhaba\n"+
"• Saat kaç?\n"+
"• Bugün hangi gün?\n"+
"• Sen kimsin?\n"+
"• Sevgilimin adı ne?\n"+
"• Hafızana kaydet: ...\n"+
"• Beni hatırla: ...\n"+
"• Ne hatırlıyorsun?\n"+
"• Görev oluştur ders çalış 30 dakika sonra\n"+
"• Görevlerim"
);

}

/* Google */

if(
lower.startsWith(
"google'da ara "
) ||
lower.startsWith(
"google ara "
)
){

const query =
text
.replace(
/google('da)? ara/i,
""
)
.trim();

if(query){

window.open(
"https://www.google.com/search?q="+
encodeURIComponent(
query
),
"_blank"
);

return (
query+
" için Google aramasını açtım."
);

}

}

/* YouTube */

if(
lower.includes(
"youtube aç"
)
){

window.open(
"https://youtube.com",
"_blank"
);

return (
"YouTube'u açıyorum."
);

}

/* GitHub */

if(
lower.includes(
"github aç"
)
){

window.open(
"https://github.com",
"_blank"
);

return (
"GitHub'u açıyorum."
);

}

/* Genel */

if(
lower.endsWith("?")
){

return (
"Bu konuda yardımcı "
+
"olabilirim. Biraz daha "
+
"ayrıntı verirsen daha "
+
"net cevap verebilirim."
);

}

return (
"Komutunu aldım. "
+
"Yerleşik AURA komutlarından "
+
"birini deneyebilirsin. "
+
"Yardım yazarak komutları "
+
"görebilirsin."
);

}

/* =========================
   MESAJ GÖNDERME
========================= */

async function sendMessage(){

const text =
userInput.value.trim();

if(!text){
return;
}

if(
AURA.processing
){

return;

}

if(
!AURA.chatOpen
){

toggleChatPanel(
true
);

}

userInput.value="";

AURA.processing=true;

coreState(
"processing"
);

addMessage(
text,
"user",
false
);

showTyping();

try{

await new Promise(
resolve=>
setTimeout(
resolve,
350
)
);

const response =
naturalResponse(
text
);

removeTyping();

addMessage(
response,
"aura",
true
);

AURA.history.push({

time:
new Date()
.toISOString(),

user:text,

aura:response

});

saveJSON(
STORAGE.history,
AURA.history
);

saveChat();

}catch(error){

console.error(
"AURA:",
error
);

removeTyping();

addMessage(
"Bir hata oluştu. "
+
"Tekrar deneyebilirsin.",
"aura",
true
);

}finally{

AURA.processing=false;

if(
!AURA.listening &&
!AURA.speaking
){

coreState("");

}

}

}

/* =========================
   BUTONLAR
========================= */

sendBtn.addEventListener(
"click",
event=>{

event.preventDefault();

sendMessage();

}
);

userInput.addEventListener(
"keydown",
event=>{

if(
event.key==="Enter"
){

event.preventDefault();

sendMessage();

}

}
);

/* =========================
   SESLİ CEVAP
========================= */

function speak(
text
){

if(
!AURA.voiceEnabled
){

return;

}

if(
!("speechSynthesis"
in window)
){

return;

}

try{

window.speechSynthesis.cancel();

const utterance =
new SpeechSynthesisUtterance(
String(text)
);

utterance.lang =
"tr-TR";

utterance.rate =
.95;

utterance.pitch =
1;

utterance.onstart =
()=>{

AURA.speaking=true;

coreState(
"speaking"
);

};

utterance.onend =
()=>{

AURA.speaking=false;

if(
!AURA.processing &&
!AURA.listening
){

coreState("");

}

};

utterance.onerror =
()=>{

AURA.speaking=false;

if(
!AURA.processing &&
!AURA.listening
){

coreState("");

}

};

window.speechSynthesis
.speak(
utterance
);

}catch(error){

console.error(
"Speech:",
error
);

}

}

/* =========================
   MİKROFON
========================= */

const Recognition =
window.SpeechRecognition ||
window.webkitSpeechRecognition;

function setupRecognition(){

if(!Recognition){

return;

}

AURA.recognition =
new Recognition();

AURA.recognition.lang =
"tr-TR";

AURA.recognition.continuous =
false;

AURA.recognition.interimResults =
true;

AURA.recognition.onstart =
()=>{

AURA.listening=true;

micBtn.classList.add(
"active"
);

coreState(
"listening"
);

};

AURA.recognition.onresult =
event=>{

let transcript="";

for(
let i=event.resultIndex;
i<event.results.length;
i++
){

transcript +=
event.results[i][0]
.transcript;

}

userInput.value =
transcript.trim();

const last =
event.results[
event.results.length-1
];

if(
last &&
last.isFinal
){

setTimeout(
()=>{

sendMessage();

},
100
);

}

};

AURA.recognition.onerror =
event=>{

console.log(
"AURA mikrofon:",
event.error
);

AURA.listening=false;

micBtn.classList.remove(
"active"
);

if(
!AURA.processing &&
!AURA.speaking
){

coreState("");

}

};

AURA.recognition.onend =
()=>{

AURA.listening=false;

micBtn.classList.remove(
"active"
);

if(
!AURA.processing &&
!AURA.speaking
){

coreState("");

}

};

}

function startListening(){

if(!AURA.recognition){

alert(
"Bu tarayıcı mikrofon "
+
"özelliğini desteklemiyor."
);

return;

}

if(
AURA.listening
){

return;

}

if(
!AURA.chatOpen
){

toggleChatPanel(
true
);

}

try{

AURA.recognition.start();

}catch(error){

console.log(error);

}

}

function stopListening(){

if(
AURA.recognition &&
AURA.listening
){

try{

AURA.recognition.stop();

}catch(error){}

}

}

function toggleListening(){

if(
AURA.listening
){

stopListening();

}else{

startListening();

}

}

micBtn.addEventListener(
"click",
event=>{

event.preventDefault();

toggleListening();

}
);

"online",
()=>{

AURA.online=true;

if(

!AURA.listening &&

coreState("");

}

}
);

"offline",
()=>{

AURA.online=false;

if(
!AURA.processing &&
!AURA.listening &&
!AURA.speaking
){

coreState("");

}

}
