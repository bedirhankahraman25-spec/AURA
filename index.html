<!DOCTYPE html>
<html lang="tr">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<meta name="theme-color"
      content="#02060a">

<title>AURA AI</title>

<style>

*{
    box-sizing:border-box;
}

html,
body{
    margin:0;
    width:100%;
    height:100%;
}

body{
    overflow:hidden;
    font-family:Arial,sans-serif;
    color:#00eaff;

    background:
        radial-gradient(
            circle at center,
            #06303d 0%,
            #02080c 50%,
            #000000 100%
        );
}

.top-bar{
    height:60px;

    display:flex;
    align-items:center;
    justify-content:space-between;

    padding:0 18px;

    background:rgba(0,10,15,.9);

    border-bottom:
        1px solid
        rgba(0,234,255,.4);
}

.logo{
    font-size:21px;
    font-weight:bold;
    letter-spacing:4px;

    text-shadow:
        0 0 10px #00eaff,
        0 0 25px #00eaff;
}

.status{
    font-size:11px;
    letter-spacing:2px;
    color:#55ffcc;
}

.status::before{
    content:"";

    display:inline-block;

    width:7px;
    height:7px;

    margin-right:7px;

    border-radius:50%;

    background:#55ffcc;

    box-shadow:
        0 0 8px #55ffcc,
        0 0 15px #55ffcc;
}

.main{
    height:calc(100vh - 60px);
    height:calc(100dvh - 60px);

    display:flex;
    flex-direction:column;
    align-items:center;

    min-height:0;
}

.aura-core{
    width:210px;
    height:210px;

    margin-top:10px;

    position:relative;

    display:flex;
    align-items:center;
    justify-content:center;

    flex-shrink:0;
}

.aura-ring{
    position:absolute;

    border-radius:50%;

    border:
        1px solid
        #00eaff;

    opacity:.7;
}

.ring1{
    width:135px;
    height:135px;

    border-left-color:transparent;
    border-right-color:transparent;

    animation:
        rotate1 7s linear infinite;
}

.ring2{
    width:175px;
    height:175px;

    border-top-color:transparent;
    border-bottom-color:transparent;

    animation:
        rotate2 10s linear infinite;
}

.ring3{
    width:210px;
    height:210px;

    border-left-color:transparent;
    border-bottom-color:transparent;

    animation:
        rotate1 14s linear infinite;
}

.aura-center{
    width:100px;
    height:100px;

    border-radius:50%;

    border:
        2px solid
        #00eaff;

    display:flex;
    align-items:center;
    justify-content:center;

    color:#00eaff;

    font-size:21px;
    font-weight:bold;

    letter-spacing:3px;

    background:
        radial-gradient(
            circle,
            #064454,
            #02090d
        );

    box-shadow:
        0 0 15px #00eaff,
        0 0 45px rgba(0,234,255,.7),
        inset 0 0 25px rgba(0,234,255,.5);

    animation:
        pulse 2.2s infinite ease-in-out;

    z-index:5;
}

@keyframes rotate1{

    from{
        transform:rotate(0deg);
    }

    to{
        transform:rotate(360deg);
    }
}

@keyframes rotate2{

    from{
        transform:rotate(360deg);
    }

    to{
        transform:rotate(0deg);
    }
}

@keyframes pulse{

    0%,
    100%{
        transform:scale(1);
    }

    50%{
        transform:scale(1.06);
    }
}

.aura-status{
    margin-top:-8px;
    margin-bottom:5px;

    font-size:10px;
    letter-spacing:3px;

    color:#8defff;
}

#chat{
    width:min(92%,600px);

    flex:1;
    min-height:0;

    overflow-y:auto;

    padding:
        5px 5px 10px;
}

.message{
    max-width:85%;

    padding:
        10px 13px;

    margin-bottom:10px;

    border-radius:10px;

    line-height:1.4;

    white-space:pre-wrap;

    font-size:14px;
}

.aura{
    background:
        rgba(0,35,45,.8);

    margin-right:auto;

    border:
        1px solid
        rgba(0,234,255,.25);
}

.user{
    background:
        rgba(0,90,120,.8);

    margin-left:auto;

    color:white;
}

#bottom{
    width:100%;

    min-height:65px;

    display:flex;
    align-items:center;

    gap:8px;

    padding:10px;

    background:
        rgba(0,10,15,.97);

    border-top:
        1px solid
        rgba(0,234,255,.45);

    z-index:10;
}

#input{
    flex:1;

    min-width:0;

    height:45px;

    padding:12px;

    border-radius:8px;

    border:
        1px solid
        rgba(0,234,255,.5);

    outline:none;

    background:
        rgba(0,25,32,.95);

    color:#00eaff;

    font-size:14px;
}

#input::placeholder{
    color:#548995;
}

button{
    height:45px;

    border:
        1px solid
        #00eaff;

    border-radius:8px;

    padding:0 14px;

    background:
        rgba(0,60,75,.9);

    color:#00eaff;

    font-size:14px;

    cursor:pointer;
}

button:active{
    transform:scale(.94);
}

button:disabled{
    opacity:.5;
}

.mic-button{
    width:45px;

    padding:0;

    font-size:20px;
}

#tools{
    display:none;
}

#fileInput{
    display:none;
}

@media(max-width:500px){

    .aura-core{

        transform:scale(.82);

        margin-top:0;
        margin-bottom:-15px;
    }

    .logo{
        font-size:18px;
    }

    button{
        padding:0 11px;
    }
}

</style>

</head>

<body>

<div class="top-bar">

    <div class="logo">
        AURA
    </div>

    <div class="status">
        ONLINE
    </div>

</div>

<div class="main">

    <div class="aura-core">

        <div class="aura-ring ring1"></div>
        <div class="aura-ring ring2"></div>
        <div class="aura-ring ring3"></div>

        <div class="aura-center">
            AURA
        </div>

    </div>

    <div class="aura-status">
        AI SYSTEM READY
    </div>

    <div id="chat"></div>

    <div id="bottom">

        <input
            id="input"
            type="text"
            placeholder="AURA'ya bir şey sor..."
            autocomplete="off"
        >

        <button
            class="mic-button"
            id="micButton"
            type="button">
            🎤
        </button>

        <button
            id="sendButton"
            type="button">
            Gönder
        </button>

    </div>

</div>

<input
    id="fileInput"
    type="file"
    accept=".txt,.json,.csv,.md,.html,.js,.css,.py,.pdf">

<script src="https://js.puter.com/v2/"></script>

<script>

/* =====================================================
   TEMEL ELEMENTLER
===================================================== */

const chat =
    document.getElementById("chat");

const input =
    document.getElementById("input");

const sendButton =
    document.getElementById("sendButton");

const micButton =
    document.getElementById("micButton");

const fileInput =
    document.getElementById("fileInput");


/* =====================================================
   KİŞİSEL BİLGİLER
===================================================== */

const USER_NAME =
    "Bedirhan Kahraman";

const GIRLFRIEND_NAME =
    "Edanur Kahraman";


/* =====================================================
   STORAGE ANAHTARLARI
===================================================== */

const MEMORY_KEY =
    "AURA_MEMORY_V4";

const PERSONAL_MEMORY_KEY =
    "AURA_PERSONAL_MEMORY_V3";

const TASK_KEY =
    "AURA_TASKS_V1";

const REMINDER_KEY =
    "AURA_REMINDERS_V1";

const CUSTOM_COMMAND_KEY =
    "AURA_CUSTOM_COMMANDS_V1";

const PROFILE_KEY =
    "AURA_PROFILE_V1";

const CHAT_KEY =
    "AURA_CHAT_V4";


/* =====================================================
   AURA SİSTEM PROMPTU
===================================================== */

const BASE_SYSTEM_PROMPT = `

Sen AURA adında kişisel yapay zeka asistanısın.

Türkçe konuş.

Doğal, akıllı, sakin ve anlaşılır konuş.

Kullanıcının adı Bedirhan Kahraman.

Kullanıcıya her mesajda Bedirhan diye hitap etme.

Gereksiz hitaplardan kaçın.

Kullanıcı açıkça adını sorarsa
Bedirhan Kahraman olduğunu söyle.

Kullanıcının sevgilisi Edanur Kahraman'dır.

Edanur hakkında kullanıcı soru sorarsa
bu bilgiyi kullan.

Bilmediğin kişisel bilgileri uydurma.

Kullanıcıya ait kayıtlı hafıza verilirse
cevaplarını buna göre kişiselleştir.

Kısa sorulara kısa cevap ver.

Detay istenirse detaylandır.

Sen AURA'sın.

`;/* =====================================================
   GÜVENLİ STORAGE OKUMA
===================================================== */

function loadJSON(key, fallback){

    try{

        const saved =
            localStorage.getItem(key);

        if(!saved){
            return fallback;
        }

        const data =
            JSON.parse(saved);

        return data;

    }catch(error){

        console.error(
            "AURA STORAGE HATASI:",
            key,
            error
        );

        return fallback;
    }
}


function saveJSON(key, data){

    try{

        localStorage.setItem(
            key,
            JSON.stringify(data)
        );

        return true;

    }catch(error){

        console.error(
            "AURA STORAGE KAYIT HATASI:",
            key,
            error
        );

        return false;
    }
}


/* =====================================================
   HAFIZA
===================================================== */

let auraMemory =
    loadJSON(
        MEMORY_KEY,
        {
            facts:[],
            preferences:[],
            notes:[],
            important:[]
        }
    );


if(!auraMemory ||
   typeof auraMemory !== "object"){

    auraMemory = {
        facts:[],
        preferences:[],
        notes:[],
        important:[]
    };
}


function ensureMemoryStructure(){

    const types = [
        "facts",
        "preferences",
        "notes",
        "important"
    ];


    types.forEach(
        type => {

            if(
                !Array.isArray(
                    auraMemory[type]
                )
            ){

                auraMemory[type] = [];
            }

        }
    );
}


ensureMemoryStructure();


function saveMemory(){

    ensureMemoryStructure();

    saveJSON(
        MEMORY_KEY,
        auraMemory
    );
}


function addMemory(
    type,
    text
){

    if(
        !auraMemory[type]
    ){

        auraMemory[type] = [];
    }


    auraMemory[type].push({

        id:
            Date.now() +
            Math.random(),

        text:
            String(text),

        date:
            new Date()
                .toLocaleString(
                    "tr-TR"
                )

    });


    /*
       Aynı hafıza sınırsız büyümesin.
    */

    auraMemory[type] =
        auraMemory[type]
            .slice(-100);


    saveMemory();
}


/* =====================================================
   GELİŞMİŞ KİŞİSEL HAFIZA
===================================================== */

let personalMemory =
    loadJSON(
        PERSONAL_MEMORY_KEY,
        []
    );


if(
    !Array.isArray(
        personalMemory
    )
){

    personalMemory = [];
}


function savePersonalMemory(){

    personalMemory =
        personalMemory.slice(-200);

    saveJSON(
        PERSONAL_MEMORY_KEY,
        personalMemory
    );
}


function addPersonalMemory(
    category,
    text
){

    personalMemory.push({

        id:
            Date.now() +
            Math.random(),

        category:
            category,

        text:
            String(text),

        date:
            new Date()
                .toLocaleString(
                    "tr-TR"
                )

    });


    savePersonalMemory();
}


/* =====================================================
   GÖREVLER
===================================================== */

let tasks =
    loadJSON(
        TASK_KEY,
        []
    );


if(
    !Array.isArray(tasks)
){

    tasks = [];
}


function saveTasks(){

    tasks =
        tasks.slice(-200);

    saveJSON(
        TASK_KEY,
        tasks
    );
}


function addTask(text){

    const task = {

        id:
            Date.now(),

        text:
            String(text),

        completed:
            false,

        created:
            new Date()
                .toLocaleString(
                    "tr-TR"
                )

    };


    tasks.push(task);

    saveTasks();

    return task;
}


function completeTask(
    id
){

    const task =
        tasks.find(
            item =>
                String(item.id)
                ===
                String(id)
        );


    if(task){

        task.completed =
            true;

        saveTasks();

        return true;
    }


    return false;
}


function getOpenTasks(){

    return tasks.filter(
        task =>
            !task.completed
    );
}


/* =====================================================
   HATIRLATICILAR
===================================================== */

let reminders =
    loadJSON(
        REMINDER_KEY,
        []
    );


if(
    !Array.isArray(
        reminders
    )
){

    reminders = [];
}


function saveReminders(){

    reminders =
        reminders.slice(-200);

    saveJSON(
        REMINDER_KEY,
        reminders
    );
}


function addReminder(
    text,
    timestamp
){

    const reminder = {

        id:
            Date.now(),

        text:
            String(text),

        timestamp:
            Number(timestamp),

        notified:
            false,

        created:
            new Date()
                .toLocaleString(
                    "tr-TR"
                )

    };


    reminders.push(
        reminder
    );


    saveReminders();


    return reminder;
}


/* =====================================================
   ÖZEL KOMUTLAR
===================================================== */

let customCommands =
    loadJSON(
        CUSTOM_COMMAND_KEY,
        []
    );


if(
    !Array.isArray(
        customCommands
    )
){

    customCommands = [];
}


function saveCustomCommands(){

    customCommands =
        customCommands.slice(-100);

    saveJSON(
        CUSTOM_COMMAND_KEY,
        customCommands
    );
}


function addCustomCommand(
    name,
    action
){

    const existing =
        customCommands.find(
            command =>
                command.name
                    .toLocaleLowerCase(
                        "tr-TR"
                    )
                ===
                name
                    .toLocaleLowerCase(
                        "tr-TR"
                    )
        );


    if(existing){

        existing.action =
            action;

    }else{

        customCommands.push({

            id:
                Date.now(),

            name:
                name,

            action:
                action

        });
    }


    saveCustomCommands();
}


/* =====================================================
   PROFİL
===================================================== */

let auraProfile =
    loadJSON(
        PROFILE_KEY,
        {
            name:
                USER_NAME,

            girlfriend:
                GIRLFRIEND_NAME,

            created:
                new Date()
                    .toLocaleString(
                        "tr-TR"
                    )
        }
    );


if(
    !auraProfile ||
    typeof auraProfile !== "object"
){

    auraProfile = {

        name:
            USER_NAME,

        girlfriend:
            GIRLFRIEND_NAME,

        created:
            new Date()
                .toLocaleString(
                    "tr-TR"
                )
    };
}


function saveProfile(){

    saveJSON(
        PROFILE_KEY,
        auraProfile
    );
}


saveProfile();


/* =====================================================
   HAFIZA METNİ
===================================================== */

function buildMemoryText(){

    let text = "";


    if(
        auraMemory.facts.length
    ){

        text +=
            "\nKAYITLI BİLGİLER:\n";

        auraMemory.facts
            .forEach(
                item => {

                    text +=
                        "- " +
                        item.text +
                        "\n";
                }
            );
    }


    if(
        auraMemory.preferences.length
    ){

        text +=
            "\nTERCİHLER:\n";

        auraMemory.preferences
            .forEach(
                item => {

                    text +=
                        "- " +
                        item.text +
                        "\n";
                }
            );
    }


    if(
        auraMemory.notes.length
    ){

        text +=
            "\nNOTLAR:\n";

        auraMemory.notes
            .forEach(
                item => {

                    text +=
                        "- " +
                        item.text +
                        "\n";
                }
            );
    }


    if(
        auraMemory.important.length
    ){

        text +=
            "\nÖNEMLİ BİLGİLER:\n";

        auraMemory.important
            .forEach(
                item => {

                    text +=
                        "- " +
                        item.text +
                        "\n";
                }
            );
    }


    if(
        personalMemory.length
    ){

        text +=
            "\nKİŞİSEL HAFIZA:\n";

        personalMemory
            .slice(-50)
            .forEach(
                item => {

                    text +=
                        "- [" +
                        item.category +
                        "] " +
                        item.text +
                        "\n";
                }
            );
    }


    return text.trim()
        ||
        "Kayıtlı özel bilgi bulunmuyor.";
}


/* =====================================================
   SİSTEM PROMPTU OLUŞTUR
===================================================== */

function buildSystemPrompt(){

    return (

        BASE_SYSTEM_PROMPT +

        "\n\n" +

        "KULLANICI PROFİLİ:\n" +

        "Ad: " +
        auraProfile.name +

        "\nSevgilisi: " +
        auraProfile.girlfriend +

        "\n\n" +

        "AURA HAFIZASI:\n" +

        buildMemoryText() +

        "\n\n" +

        "AURA GÖREVLERİ:\n" +

        getOpenTasks()
            .map(
                task =>
                    "- " +
                    task.text
            )
            .join("\n") +

        "\n\n" +

        "ÖNEMLİ KURAL:\n" +

        "Kullanıcının hafızasında olmayan " +
        "kişisel bilgileri uydurma."

    );
}


/* =====================================================
   METİN NORMALİZASYONU
===================================================== */

function normalizeText(text){

    return String(text)
        .toLocaleLowerCase(
            "tr-TR"
        )
        .trim()
        .replace(
            /\s+/g,
            " "
        );
}


/* =====================================================
   SAYI / HESAP ALGILAMA
===================================================== */

function calculateExpression(
    text
){

    let expression =
        String(text)
            .toLocaleLowerCase(
                "tr-TR"
            )
            .trim();


    expression =
        expression
            .replace(
                /kaç eder/g,
                ""
            )
            .replace(
                /hesapla/g,
                ""
            )
            .replace(
                /nedir/g,
                ""
            )
            .trim();


    /*
       Sadece güvenli matematik
       karakterlerine izin ver.
    */

    if(
        !/^[0-9+\-*/%().,\s^]+$/
            .test(expression)
    ){

        return null;
    }


    if(
        !/[0-9]/.test(expression)
    ){

        return null;
    }


    try{

        expression =
            expression.replace(
                /,/g,
                "."
            );


        expression =
            expression.replace(
                /\^/g,
                "**"
            );


        /*
           eval yalnızca yukarıdaki
           whitelist'ten geçmiş ifadede
           kullanılıyor.
        */

        const result =
            Function(
                '"use strict"; return (' +
                expression +
                ')'
            )();


        if(
            typeof result !==
            "number"
        ){

            return null;
        }


        if(
            !Number.isFinite(
                result
            )
        ){

            return "Sonuç tanımsız.";
        }


        return (
            "Sonuç: " +
            result
        );

    }catch(error){

        return null;
    }
    }function handleLocalCommand(text){

    const command =
        normalizeText(text);


    /* =========================
       TARİH
    ========================= */

    if(
        command === "bugün tarih ne" ||
        command === "bugun tarih ne" ||
        command === "bugünün tarihi" ||
        command === "bugunun tarihi" ||
        command === "tarih ne" ||
        command === "bugün hangi gün" ||
        command === "bugun hangi gun"
    ){

        const now =
            new Date();

        return (
            "Bugün " +
            now.toLocaleDateString(
                "tr-TR",
                {
                    weekday:"long",
                    year:"numeric",
                    month:"long",
                    day:"numeric"
                }
            ) +
            "."
        );
    }


    /* =========================
       SAAT
    ========================= */

    if(
        command === "saat kaç" ||
        command === "saat kac" ||
        command === "şu an saat kaç" ||
        command === "su an saat kac" ||
        command === "saat"
    ){

        const now =
            new Date();

        return (
            "Şu an saat " +
            now.toLocaleTimeString(
                "tr-TR",
                {
                    hour:"2-digit",
                    minute:"2-digit"
                }
            ) +
            "."
        );
    }


    /* =========================
       KİMLİK
    ========================= */

    if(
        command === "ben kimim" ||
        command === "ben kimim?"
    ){

        return (
            "Sen " +
            USER_NAME +
            "'sın."
        );
    }


    if(
        command === "sevgilim kim" ||
        command === "sevgilim kim?"
    ){

        return (
            "Sevgilinin adı " +
            GIRLFRIEND_NAME +
            "."
        );
    }


    if(
        command === "edanur kim" ||
        command === "edanur kim?"
    ){

        return (
            "Edanur Kahraman, " +
            "senin sevgilin."
        );
    }


    if(
        command === "sen kimsin" ||
        command === "sen kimsin?"
    ){

        return (
            "Ben AURA. " +
            "Kişisel yapay zeka asistanınım."
        );
    }


    /* =========================
       HAFIZA GÖSTER
    ========================= */

    if(
        command === "hafızamda ne var" ||
        command === "hafizamda ne var" ||
        command === "neyi hatırlıyorsun" ||
        command === "neyi hatirliyorsun"
    ){

        return buildMemoryText();
    }


    /* =========================
       HAFIZA TEMİZLE
    ========================= */

    if(
        command === "hafızanı temizle" ||
        command === "hafizani temizle" ||
        command === "tüm hafızanı sil" ||
        command === "tum hafizani sil"
    ){

        auraMemory = {

            facts:[],
            preferences:[],
            notes:[],
            important:[]
        };


        personalMemory = [];


        saveMemory();
        savePersonalMemory();


        return (
            "Kayıtlı AURA hafızası temizlendi."
        );
    }


    /* =========================
       GÖREVLERİ GÖSTER
    ========================= */

    if(
        command === "görevlerim" ||
        command === "gorevlerim" ||
        command === "görevlerimi göster" ||
        command === "gorevlerimi goster" ||
        command === "bugünkü görevlerim" ||
        command === "bugunku gorevlerim"
    ){

        const open =
            getOpenTasks();


        if(
            open.length === 0
        ){

            return (
                "Şu anda bekleyen görevin yok."
            );
        }


        return (
            "Bekleyen görevlerin:\n\n" +
            open
                .map(
                    (task,index) =>
                        (
                            index + 1
                        ) +
                        ". " +
                        task.text
                )
                .join("\n")
        );
    }


    /* =========================
       GÖREV EKLE
    ========================= */

    const taskPatterns = [

        "görevlere ekle ",
        "gorevlere ekle ",

        "görev ekle ",
        "gorev ekle ",

        "yapılacaklara ekle ",
        "yapilacaklara ekle ",

        "yapılacak ekle ",
        "yapilacak ekle "

    ];


    for(
        const pattern of taskPatterns
    ){

        if(
            command.startsWith(
                pattern
            )
        ){

            const taskText =
                text
                    .substring(
                        pattern.length
                    )
                    .trim();


            if(!taskText){

                return (
                    "Eklememi istediğin görevi belirt."
                );
            }


            addTask(
                taskText
            );


            return (
                "Görev listesine eklendi: " +
                taskText
            );
        }
    }


    /* =========================
       GÖREV TAMAMLAMA
    ========================= */

    const completePatterns = [

        "görevi tamamla ",
        "gorevi tamamla ",

        "görevi bitir ",
        "gorevi bitir "

    ];


    for(
        const pattern of completePatterns
    ){

        if(
            command.startsWith(
                pattern
            )
        ){

            const numberText =
                command
                    .substring(
                        pattern.length
                    )
                    .trim();


            const index =
                parseInt(
                    numberText,
                    10
                );


            const open =
                getOpenTasks();


            if(
                Number.isInteger(index) &&
                index >= 1 &&
                index <= open.length
            ){

                const success =
                    completeTask(
                        open[index - 1].id
                    );


                if(success){

                    return (
                        "Görev tamamlandı: " +
                        open[index - 1].text
                    );
                }
            }


            return (
                "Geçerli bir görev numarası bulunamadı."
            );
        }
    }


    /* =========================
       MATEMATİK
    ========================= */

    const calculation =
        calculateExpression(
            text
        );


    if(
        calculation !== null
    ){

        return calculation;
    }


    /* =========================
       ŞAKA
    ========================= */

    if(
        command.includes(
            "şaka yap"
        ) ||
        command.includes(
            "saka yap"
        ) ||
        command.includes(
            "bir şaka anlat"
        ) ||
        command.includes(
            "bir saka anlat"
        )
    ){

        const jokes = [

            "Bilgisayar neden doktora gitmiş? Çünkü virüs kapmış.",

            "Matematik kitabı neden üzgünmüş? Çünkü çok problemi varmış.",

            "Telefon neden gözlük takmış? Çünkü ekranı bulanıkmış.",

            "Programcı neden kahve içmiş? Çünkü kodları Java'ymış.",

            "Elektrikçi neden hiç yalnız kalmaz? Çünkü her zaman bir bağlantısı vardır.",

            "AURA neden yorulmaz? Çünkü henüz uyku moduna geçmedim."

        ];


        return (
            jokes[
                Math.floor(
                    Math.random() *
                    jokes.length
                )
            ]
        );
    }


    /* =========================
       SİSTEM DURUMU
    ========================= */

    if(
        command === "sistem durumu" ||
        command === "sistem durumunu göster" ||
        command === "sistem durumunu goster" ||
        command === "aura sistem durumu"
    ){

        return (
            "AURA SYSTEM\n" +
            "──────────────\n" +
            "AI        ONLINE\n" +
            "MEMORY    ONLINE\n" +
            "VOICE     " +
            (
                "speechSynthesis"
                in window
                ? "ONLINE"
                : "OFFLINE"
            ) +
            "\n" +
            "STORAGE   ONLINE\n" +
            "TASKS     ONLINE\n" +
            "REMINDER  ONLINE\n" +
            "PROFILE   ONLINE\n" +
            "WEB       READY"
        );
    }


    /* =========================
       PROFİL
    ========================= */

    if(
        command === "profilimi göster" ||
        command === "profilimi goster" ||
        command === "profilim ne" ||
        command === "benim profilim"
    ){

        return (
            "AURA profilin:\n\n" +
            "Ad: " +
            auraProfile.name +
            "\n" +
            "Sevgili: " +
            auraProfile.girlfriend
        );
    }


    /* =========================
       DOSYA OKUMA
    ========================= */

    if(
        command === "dosya oku" ||
        command === "dosya aç" ||
        command === "dosya ac" ||
        command === "dosya yükle" ||
        command === "dosya yukle"
    ){

        fileInput.click();


        return (
            "Dosya seçme ekranını açtım."
        );
    }


    /* =========================
       ÖZEL KOMUT KAYDET
    ========================= */

    if(
        command.startsWith(
            "özel komut oluştur "
        ) ||
        command.startsWith(
            "ozel komut olustur "
        )
    ){

        const raw =
            text
                .replace(
                    /^özel komut oluştur /i,
                    ""
                )
                .replace(
                    /^ozel komut olustur /i,
                    ""
                )
                .trim();


        const separator =
            raw.includes(":")
                ? ":"
                : "=";


        const parts =
            raw.split(
                separator
            );


        if(
            parts.length < 2
        ){

            return (
                "Komut formatı şöyle olmalı:\n" +
                "Özel komut oluştur gece modu: iyi geceler"
            );
        }


        const name =
            parts[0].trim();


        const action =
            parts
                .slice(1)
                .join(separator)
                .trim();


        if(
            !name ||
            !action
        ){

            return (
                "Komut adı ve yapılacak işlem gerekli."
            );
        }


        addCustomCommand(
            name,
            action
        );


        return (
            "Özel komut oluşturuldu: " +
            name
        );
    }


    /* =========================
       ÖZEL KOMUT ÇALIŞTIR
    ========================= */

    const custom =
        customCommands.find(
            item =>
                normalizeText(
                    item.name
                ) === command
        );


    if(custom){

        /*
           Özel komutun action kısmını
           tekrar AURA'ya gönderiyoruz.
        */

        return (
            "Özel komut sonucu:\n" +
            custom.action
        );
    }


    return null;
}

let knowledgeBase = [];


loadKnowledgeBase()
    .then(

function searchKnowledge(text){

    if(
        !Array.isArray(
            knowledgeBase
        ) ||
        knowledgeBase.length === 0
    ){

        return null;
    }


    const query =
        normalizeText(text);


    if(
        query.length < 2
    ){

        return null;
    }


    let bestMatch =
        null;

    let bestScore =
        0;


    knowledgeBase.forEach(
        item => {

            if(!item){

                return;
            }


            /*
               knowledge.json için
               farklı alan isimlerini
               destekliyoruz.
            */

            const question =
                normalizeText(
                    item.question ||
                    item.soru ||
                    item.title ||
                    item.name ||
                    ""
                );


            const answer =
                item.answer ||
                item.cevap ||
                item.response ||
                item.content ||
                "";


            const keywords =
                Array.isArray(
                    item.keywords
                )
                    ? item.keywords
                    : (
                        Array.isArray(
                            item.anahtar
                        )
                            ? item.anahtar
                            : []
                    );


            if(
                !answer
            ){

                return;
            }


            let score =
                0;


            if(
                question &&
                query === question
            ){

                score += 100;
            }


            if(
                question &&
                query.includes(question)
            ){

                score += 60;
            }


            if(
                question &&
                question.includes(query)
            ){

                score += 45;
            }


            const queryWords =
                query.split(" ");


            queryWords.forEach(
                word => {

                    if(
                        word.length < 2
                    ){

                        return;
                    }


                    if(
                        question.includes(
                            word
                        )
                    ){

                        score += 8;
                    }


                    keywords.forEach(
                        keyword => {

                            const normalized =
                                normalizeText(
                                    keyword
                                );


                            if(
                                normalized &&
                                normalized
                                    .includes(word)
                            ){

                                score += 5;
                            }
                        }
                    );

                }
            );


            keywords.forEach(
                keyword => {

                    const normalized =
                        normalizeText(
                            keyword
                        );


                    if(
                        normalized &&
                        query.includes(
                            normalized
                        )
                    ){

                        score += 20;
                    }
                }
            );


            if(
                score > bestScore
            ){

                bestScore =
                    score;

                bestMatch = {
                    answer:
                        String(answer),

                    score:
                        score
                };
            }

        }
    );


    /*
       Çok düşük eşleşmeleri
       AI'ya bırak.
    */

    if(
        !bestMatch ||
        bestMatch.score < 12
    ){

        return null;
    }


    return bestMatch.answer;
}

function detectMood(text){

    const command =
        normalizeText(text);


    const sadWords = [

        "üzgünüm",
        "uzgunum",
        "moralim bozuk",
        "canım sıkkın",
        "canim sikkin",
        "kötüyüm",
        "kotuyum",
        "ağlayacağım",
        "aglayacagim",
        "çok üzgün",
        "cok uzgun"

    ];


    const happyWords = [

        "çok mutluyum",
        "cok mutluyum",
        "mutluyum",
        "harikayım",
        "harikayim",
        "çok mutluyum",
        "cok mutluyum",
        "süper",
        "super",
        "çok iyi",
        "cok iyi"

    ];


    const angryWords = [

        "sinirliyim",
        "çok sinirliyim",
        "cok sinirliyim",
        "kızgınım",
        "kizginim",
        "sinir oldum",
        "delirdim"

    ];


    if(
        sadWords.some(
            word =>
                command.includes(word)
        )
    ){

        return "sakin";
    }


    if(
        happyWords.some(
            word =>
                command.includes(word)
        )
    ){

        return "enerjik";
    }


    if(
        angryWords.some(
            word =>
                command.includes(word)
        )
    ){

        return "sakin";
    }


    return "normal";
}

}

/* =====================================================
   AI CEVABI ÇIKAR
===================================================== */

function extractAIText(
    response
){

    if(
        !response
    ){

        return "";
    }


    if(
        typeof response === "string"
    ){

        return response.trim();
    }


    if(
        response.message &&
        typeof response.message.content === "string"
    ){

        return response
            .message
            .content
            .trim();
    }


    if(
        response.message &&
        Array.isArray(
            response.message.content
        )
    ){

        return response
            .message
            .content
            .map(
                part => {

                    if(
                        typeof part ===
                        "string"
                    ){

                        return part;
                    }


                    if(
                        part &&
                        typeof part.text ===
                        "string"
                    ){

                        return part.text;
                    }


                    return "";
                }
            )
            .join("")
            .trim();
    }


    if(
        typeof response.text === "string"
    ){

        return response.text.trim();
    }


    return "";
}

                "bilgisi gerektirebilir. " +

                "Web araması kullanabiliyorsan " +
                "güncel bilgiyle cevapla. " +

                "Bilgi kesin değilse bunu açıkça belirt." +

                fileContext
        }

    ];


    conversation
        .slice(-10)
        .forEach(
            message => {

                if(
                    message.role === "user" ||
                    message.role === "assistant"
                ){

                    messages.push({

                        role:
                            message.role,

                        content:
                            message.content

                    });

                }

            }
        );


    messages.push({

        role:"user",

        content:
            text

    });


    try{

        const response =
            await puter.ai.chat(
                messages,
                {
                    model:
                        "gpt-5.4-nano",

                    tools:[
                        {
                            type:
                                "web_search"
                        }
                    ]
                }
            );


        let answer =
            extractAIText(
                response
            );


        if(
            !answer
        ){

            /*
               Web araması desteklenmezse
               normal AI'ya düş.
            */

            return await askAI(
                text
            );
        }


        conversation.push({

            role:
                "user",

            content:
                text

        });


        conversation.push({

            role:
                "assistant",

            content:
                answer

        });


        return answer;

    }catch(error){

        console.error(
            "AURA WEB HATASI:",
            error
        );


        /*
           Web sistemi hata verirse
           AURA tamamen çalışmayı bırakmasın.
        */

        return await askAI(
            text
        );
    }
}


/* =====================================================
   SES METNİ TEMİZLE
===================================================== */

function cleanTextForSpeech(
    text
){

    return String(text)

        .replace(
            /https?:\/\/\S+/gi,
            " "
        )

        .replace(
            /[\p{Emoji_Presentation}\p{Extended_Pictographic}]/gu,
            " "
        )

        .replace(
            /[.,!?;:"'“”‘’()[\]{}<>…\/\\|@#$%^&*_+=~`-]/g,
            " "
        )

        .replace(
            /\s+/g,
            " "
        )

        .trim();
}


/* =====================================================
   SESLENDİRME
===================================================== */

function speak(
    text
){

    if(
        !("speechSynthesis" in window)
    ){

        return;
    }


    const clean =
        cleanTextForSpeech(
            text
        );


    if(
        !clean
    ){

        return;
    }


    window.speechSynthesis.cancel();


    const utterance =
        new SpeechSynthesisUtterance(
            clean
        );


    utterance.lang =
        "tr-TR";

    utterance.rate =
        0.9;

    utterance.pitch =
        1;

    utterance.volume =
        1;


    /*
       Türkçe seslerden uygun olanı
       bulmaya çalış.
    */

    const voices =
        window.speechSynthesis
            .getVoices();


    const turkishVoice =
        voices.find(
            voice =>
                voice.lang &&
                voice.lang
                    .toLowerCase()
                    .startsWith(
                        "tr"
                    )
        );


    if(
        turkishVoice
    ){

        utterance.voice =
            turkishVoice;
    }


    window.speechSynthesis.speak(
        utterance
    );
}

function checkReminders(){

    const now =
        Date.now();


    let changed =
        false;


    reminders.forEach(
        reminder => {

            if(
                reminder.notified
            ){

                return;
            }


            if(
                Number(reminder.timestamp)
                <=
                now
            ){

                reminder.notified =
                    true;


                changed =
                    true;


                addMessage(
                    "HATIRLATICI:\n" +
                    reminder.text,
                    "aura"
                );


                /*
                   Tarayıcı destekliyorsa
                   sesli bildirim.
                */

                speak(
                    "Hatırlatıcı. " +
                    reminder.text
                );

            }

        }
    );


    if(changed){

        saveReminders();
    }
}


/* =====================================================
   HATIRLATICI KOMUTLARI
===================================================== */

function parseReminder(
    text
){

    const command =
        normalizeText(text);


    /*
       Örnek:
       "30 dakika sonra bana su içmeyi hatırlat"
    */

    const match =
        command.match(
            /^(\d+)\s*(dakika|dk|saat|sa)\s+sonra\s+(.+)$/
        );


    if(
        !match
    ){

        return null;
    }


    const amount =
        Number(
            match[1]
        );


    const unit =
        match[2];


    const reminderText =
        match[3]
            .replace(
                /^bana\s+/,
                ""
            )
            .replace(
                /hatırlat$/i,
                ""
            )
            .trim();


    if(
        !amount ||
        !reminderText
    ){

        return null;
    }


    let milliseconds;


    if(
        unit === "dakika" ||
        unit === "dk"
    ){

        milliseconds =
            amount *
            60 *
            1000;

    }else{

        milliseconds =
            amount *
            60 *
            60 *
            1000;
    }


    return {

        text:
            reminderText,

        timestamp:
            Date.now() +
            milliseconds

    };
    }/* =====================================================
   ANA MESAJ İŞLEYİCİ
===================================================== */

async function sendMessage(voiceMode = false){

    const text =
        input.value.trim();


    if(!text){

        return;
    }


    input.value = "";


    addMessage(
        text,
        "user"
    );


    addMessage(
        "Düşünüyorum...",
        "aura"
    );


    const loading =
        chat.lastElementChild;


    sendButton.disabled =
        true;

    micButton.disabled =
        true;


    try{

        /*
           1 — Yerel komutları kontrol et
        */

        const localResponse =
            handleLocalCommand(
                text
            );


        if(
            localResponse !== null
        ){

            if(loading){

                loading.remove();
            }


            addMessage(
                localResponse,
                "aura"
            );


            if(voiceMode){

                speak(
                    localResponse
                );
            }


            return;
        }


        /*
           2 — Hafızaya kaydedilecek
           bir bilgi var mı?
        */

        const memoryResponse =
            rememberUserInformation(
                text
            );


        if(
            memoryResponse !== null
        ){

            if(loading){

                loading.remove();
            }


            addMessage(
                memoryResponse,
                "aura"
            );


            if(voiceMode){

                speak(
                    memoryResponse
                );
            }


            return;
        }


        /*
           3 — Hatırlatıcı kontrolü
        */

        const reminder =
            parseReminder(
                text
            );


        if(
            reminder
        ){

            const saved =
                addReminder(
                    reminder.text,
                    reminder.timestamp
                );


            if(loading){

                loading.remove();
            }


            const date =
                new Date(
                    saved.timestamp
                );


            const response =
                (
                    "Tamam. " +
                    reminder.text +
                    " için hatırlatıcı oluşturdum.\n" +
                    "Zaman: " +
                    date.toLocaleString(
                        "tr-TR"
                    )
                );


            addMessage(
                response,
                "aura"
            );


            if(voiceMode){

                speak(
                    response
                );
            }


            return;
        }


        /*
           4 — Normal AI / Web AI
        */

        let reply;


        if(
            needsWebSearch(
                text
            )
        ){

            reply =
                await askAIWithWeb(
                    text
                );

        }else{

            reply =
                await askAI(
                    text
                );
        }


        if(loading){

            loading.remove();
        }


        addMessage(
            reply,
            "aura"
        );


        if(voiceMode){

            speak(
                reply
            );
        }


    }catch(error){

        console.error(
            "AURA MESAJ HATASI:",
            error
        );


        if(loading){

            loading.remove();
        }


        const errorMessage =
            "Bir hata oluştu. " +
            "Tekrar deneyebiliriz.";


        addMessage(
            errorMessage,
            "aura"
        );


        if(voiceMode){

            speak(
                errorMessage
            );
        }


    }finally{

        sendButton.disabled =
            false;

        micButton.disabled =
            false;

        input.focus();

    }
}

function waitForPuter(){

    let attempts =
        0;


    const timer =
        setInterval(
            function(){

                attempts++;


                if(
                    typeof puter !== "undefined"
                ){

                    clearInterval(
                        timer
                    );


                    console.log(
                        "AURA AI bağlantısı hazır."
                    );


                    return;
                }


                /*
                   10 saniyeden fazla bekleme.
                */

                if(
                    attempts >= 20
                ){

                    clearInterval(
                        timer
                    );


                    console.warn(
                        "Puter AI henüz hazır değil."
                    );
                }

            },
            500
        );
}
