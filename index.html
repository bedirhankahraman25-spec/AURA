<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>AURA AI</title>

<style>

*{
    box-sizing:border-box;
}

html,body{
    margin:0;
    width:100%;
    height:100%;
}

body{
    overflow:hidden;
    font-family:Arial,sans-serif;
    color:#dffcff;

    background:
        radial-gradient(
            ellipse at 50% 20%,
            #075879 0%,
            #04324b 28%,
            #021522 58%,
            #00070e 100%
        );
}

/* =========================
   ARKA PLAN IŞIKLARI
========================= */

body::before{
    content:"";
    position:fixed;
    width:500px;
    height:500px;

    left:50%;
    top:5%;

    transform:translateX(-50%);

    border-radius:50%;

    background:
        radial-gradient(
            circle,
            rgba(0,234,255,.13),
            transparent 68%
        );

    pointer-events:none;
}

/* =========================
   ÜST PANEL
========================= */

.header{
    height:58px;

    display:flex;
    align-items:center;
    justify-content:space-between;

    padding:0 18px;

    background:
        rgba(1,13,23,.72);

    border-bottom:
        1px solid
        rgba(0,234,255,.25);

    backdrop-filter:blur(12px);

    position:relative;
    z-index:10;
}

.logo{
    color:#00eaff;

    font-size:20px;
    font-weight:bold;

    letter-spacing:5px;

    text-shadow:
        0 0 10px #00eaff,
        0 0 25px rgba(0,234,255,.5);
}

.status{
    display:flex;
    align-items:center;

    gap:7px;

    color:#55ffcc;

    font-size:9px;

    letter-spacing:2px;
}

.status-dot{
    width:6px;
    height:6px;

    border-radius:50%;

    background:#55ffcc;

    box-shadow:
        0 0 10px #55ffcc;
}

/* =========================
   ANA ALAN
========================= */

.main{
    height:calc(100dvh - 58px);

    display:flex;
    flex-direction:column;

    align-items:center;

    min-height:0;

    position:relative;
}

/* =========================
   ÇEKİRDEK
========================= */

.core{
    width:190px;
    height:190px;

    position:relative;

    display:flex;
    align-items:center;
    justify-content:center;

    flex-shrink:0;
}

.ring{
    position:absolute;

    border-radius:50%;

    border:1px solid
        rgba(0,234,255,.7);

    box-shadow:
        0 0 10px
        rgba(0,234,255,.25);
}

.ring.one{
    width:112px;
    height:112px;

    border-left-color:transparent;
    border-right-color:transparent;

    animation:
        rotate 5s linear infinite;
}

.ring.two{
    width:150px;
    height:150px;

    border-top-color:transparent;
    border-bottom-color:transparent;

    animation:
        rotateReverse 8s linear infinite;
}

.ring.three{
    width:184px;
    height:184px;

    border-left-color:transparent;
    border-bottom-color:transparent;

    animation:
        rotate 13s linear infinite;
}

.center{
    width:80px;
    height:80px;

    display:flex;
    align-items:center;
    justify-content:center;

    border-radius:50%;

    border:
        2px solid #00eaff;

    background:
        radial-gradient(
            circle at 40% 35%,
            #0b7994,
            #032a3c 55%,
            #01101a
        );

    color:#00eaff;

    font-size:17px;
    font-weight:bold;

    letter-spacing:3px;

    box-shadow:
        0 0 12px #00eaff,
        0 0 40px rgba(0,234,255,.5),
        inset 0 0 20px rgba(0,234,255,.45);

    animation:
        corePulse 2.2s ease-in-out infinite;
}

@keyframes rotate{
    to{
        transform:rotate(360deg);
    }
}

@keyframes rotateReverse{
    to{
        transform:rotate(-360deg);
    }
}

@keyframes corePulse{
    50%{
        transform:scale(1.06);
    }
}

/* =========================
   DURUM
========================= */

.system{
    margin-top:-8px;

    margin-bottom:8px;

    color:#83e9f7;

    font-size:9px;

    letter-spacing:3px;
}

/* =========================
   SOHBET PANELİ
========================= */

.chat-panel{
    width:min(92%,640px);

    flex:1;

    min-height:0;

    display:flex;

    flex-direction:column;

    background:
        linear-gradient(
            145deg,
            rgba(4,42,60,.48),
            rgba(0,12,23,.55)
        );

    border:
        1px solid
        rgba(0,234,255,.18);

    border-radius:20px 20px 0 0;

    backdrop-filter:blur(10px);

    overflow:hidden;

    box-shadow:
        0 -10px 40px
        rgba(0,0,0,.15);
}

/* =========================
   PANEL BAŞLIĞI
========================= */

.panel-head{
    height:34px;

    display:flex;

    align-items:center;

    padding:0 13px;

    border-bottom:
        1px solid
        rgba(0,234,255,.12);

    color:
        rgba(150,230,240,.6);

    font-size:8px;

    letter-spacing:2px;
}

.panel-line{
    flex:1;

    height:1px;

    margin-left:10px;

    background:
        linear-gradient(
            90deg,
            rgba(0,234,255,.25),
            transparent
        );
}

/* =========================
   MESAJ ALANI
========================= */

#chat{
    flex:1;

    min-height:0;

    overflow-y:auto;

    padding:
        12px 12px 8px;

    scrollbar-width:thin;

    scrollbar-color:
        rgba(0,234,255,.4)
        transparent;
}

#chat::-webkit-scrollbar{
    width:3px;
}

#chat::-webkit-scrollbar-thumb{
    background:#00eaff;

    border-radius:10px;
}

/* =========================
   MESAJLAR
========================= */

.message{
    max-width:82%;

    padding:10px 13px;

    margin-bottom:9px;

    border-radius:12px;

    font-size:13px;

    line-height:1.45;

    white-space:pre-wrap;

    animation:
        messageIn .2s ease;
}

@keyframes messageIn{

    from{
        opacity:0;
        transform:translateY(5px);
    }

    to{
        opacity:1;
        transform:translateY(0);
    }
}

.aura{
    margin-right:auto;

    color:#d9fbff;

    background:
        rgba(3,54,72,.68);

    border-left:
        2px solid #00eaff;

    border-top:
        1px solid
        rgba(0,234,255,.18);

    border-right:
        1px solid
        rgba(0,234,255,.08);

    border-bottom:
        1px solid
        rgba(0,234,255,.08);

    border-top-left-radius:3px;

    box-shadow:
        0 5px 20px
        rgba(0,0,0,.12);
}

.user{
    margin-left:auto;

    color:white;

    background:
        rgba(7,108,139,.7);

    border-right:
        2px solid #55ffcc;

    border-top:
        1px solid
        rgba(85,255,204,.18);

    border-top-right-radius:3px;
}

/* =========================
   MESAJ GİRİŞ PANELİ
========================= */

.bottom{
    width:min(92%,640px);

    padding:
        9px 8px 10px;

    background:
        rgba(0,10,19,.72);

    border:
        1px solid
        rgba(0,234,255,.18);

    border-top:0;

    border-radius:
        0 0 20px 20px;

    backdrop-filter:blur(10px);
}

.composer{
    height:48px;

    display:flex;

    align-items:center;

    gap:7px;

    padding:4px 5px 4px 14px;

    border-radius:15px;

    background:
        rgba(2,30,43,.82);

    border:
        1px solid
        rgba(0,234,255,.25);

    transition:
        border .2s,
        box-shadow .2s;
}

.composer:focus-within{
    border-color:
        rgba(0,234,255,.65);

    box-shadow:
        0 0 18px
        rgba(0,234,255,.08);
}

#input{
    flex:1;

    min-width:0;

    height:100%;

    border:0;
    outline:0;

    background:transparent;

    color:white;

    font-size:13px;
}

#input::placeholder{
    color:
        rgba(120,190,205,.5);
}

/* =========================
   BUTONLAR
========================= */

.button{
    width:40px;
    height:40px;

    flex-shrink:0;

    border:0;

    border-radius:12px;

    display:flex;

    align-items:center;
    justify-content:center;

    cursor:pointer;

    font-size:16px;

    color:#00eaff;

    background:
        rgba(0,69,91,.7);

    transition:
        transform .12s,
        background .15s;
}

.button:active{
    transform:scale(.9);
}

.send{
    color:#00202a;

    background:
        linear-gradient(
            135deg,
            #00eaff,
            #55ffcc
        );

    box-shadow:
        0 0 14px
        rgba(0,234,255,.25);
}

/* MOBİL */

@media(max-width:500px){

    .core{
        transform:scale(.84);

        margin-top:-4px;
        margin-bottom:-13px;
    }

    .chat-panel,
    .bottom{
        width:96%;
    }

    .message{
        max-width:88%;
        font-size:13px;
    }

    .composer{
        height:46px;
    }

    .button{
        width:38px;
        height:38px;
    }
}

</style>
</head>

<body>

<div class="header">

    <div class="logo">
        AURA
    </div>

    <div class="status">

        <span class="status-dot"></span>

        SYSTEM ONLINE

    </div>

</div>


<div class="main">

    <div class="core">

        <div class="ring one"></div>

        <div class="ring two"></div>

        <div class="ring three"></div>

        <div class="center">
            AURA
        </div>

    </div>


    <div class="system">
        PERSONAL AI CORE
    </div>


    <div class="chat-panel">

        <div class="panel-head">

            AURA COMMUNICATION

            <div class="panel-line"></div>

        </div>


        <div id="chat">

            <div class="message aura">
                Sistem başlatıldı.
            </div>

            <div class="message aura">
                AURA hazır. Seni dinliyorum.
            </div>

        </div>

    </div>


    <div class="bottom">

        <div class="composer">

            <input
                id="input"
                type="text"
                placeholder="Mesajını yaz..."
                autocomplete="off"
            >

            <button
                class="button"
                id="mic"
                type="button">
                🎙
            </button>

            <button
                class="button send"
                id="send"
                type="button">
                ➤
            </button>

        </div>

    </div>

</div>


<script>

const input =
    document.getElementById("input");

const send =
    document.getElementById("send");

const mic =
    document.getElementById("mic");

const chat =
    document.getElementById("chat");


function addMessage(
    text,
    type
){

    const message =
        document.createElement("div");

    message.className =
        "message " + type;

    message.textContent =
        text;

    chat.appendChild(
        message
    );

    chat.scrollTop =
        chat.scrollHeight;
}


function sendMessage(){

    const text =
        input.value.trim();

    if(!text){
        return;
    }

    addMessage(
        text,
        "user"
    );

    input.value = "";

    setTimeout(
        function(){

            addMessage(
                "Mesajını aldım. AURA prototip modu aktif.",
                "aura"
            );

        },
        350
    );
}


send.addEventListener(
    "click",
    sendMessage
);


input.addEventListener(
    "keydown",
    function(event){

        if(
            event.key === "Enter"
        ){

            event.preventDefault();

            sendMessage();
        }

    }
);


mic.addEventListener(
    "click",
    function(){

        addMessage(
            "Sesli iletişim modülü hazır.",
            "aura"
        );

    }
);

</script>

</body>
</html>
