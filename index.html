<style>

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
}

body {
    overflow: hidden;
    font-family: Arial, sans-serif;
    color: #00eaff;

    background:
        radial-gradient(
            circle at center,
            #06303d 0%,
            #02080c 50%,
            #000000 100%
        );
}

.top-bar {
    height: 60px;

    display: flex;
    align-items: center;
    justify-content: space-between;

    padding: 0 18px;

    background: rgba(0,10,15,0.9);

    border-bottom:
        1px solid
        rgba(0,234,255,0.4);
}

.logo {
    font-size: 21px;
    font-weight: bold;
    letter-spacing: 4px;

    text-shadow:
        0 0 10px #00eaff,
        0 0 25px #00eaff;
}

.status {
    font-size: 11px;
    letter-spacing: 2px;
    color: #55ffcc;
}

.status::before {
    content: "";

    display: inline-block;

    width: 7px;
    height: 7px;

    margin-right: 7px;

    border-radius: 50%;

    background: #55ffcc;

    box-shadow:
        0 0 8px #55ffcc,
        0 0 15px #55ffcc;
}

.main {
    height: calc(100vh - 60px);
    height: calc(100dvh - 60px);

    display: flex;
    flex-direction: column;
    align-items: center;

    min-height: 0;
}

.aura-core {
    width: 210px;
    height: 210px;

    margin-top: 10px;

    position: relative;

    display: flex;
    align-items: center;
    justify-content: center;

    flex-shrink: 0;
}

.aura-ring {
    position: absolute;

    border-radius: 50%;

    border:
        1px solid
        #00eaff;

    opacity: 0.7;
}

.ring1 {
    width: 135px;
    height: 135px;

    border-left-color: transparent;
    border-right-color: transparent;

    animation:
        rotate1 7s linear infinite;
}

.ring2 {
    width: 175px;
    height: 175px;

    border-top-color: transparent;
    border-bottom-color: transparent;

    animation:
        rotate2 10s linear infinite;
}

.ring3 {
    width: 210px;
    height: 210px;

    border-left-color: transparent;
    border-bottom-color: transparent;

    animation:
        rotate1 14s linear infinite;
}

.aura-center {
    width: 100px;
    height: 100px;

    border-radius: 50%;

    border:
        2px solid
        #00eaff;

    display: flex;
    align-items: center;
    justify-content: center;

    color: #00eaff;

    font-size: 21px;
    font-weight: bold;

    letter-spacing: 3px;

    background:
        radial-gradient(
            circle,
            #064454,
            #02090d
        );

    box-shadow:
        0 0 15px #00eaff,
        0 0 45px rgba(0,234,255,0.7),
        inset 0 0 25px rgba(0,234,255,0.5);

    animation:
        pulse 2.2s infinite ease-in-out;

    z-index: 5;
}

@keyframes rotate1 {

    from {
        transform: rotate(0deg);
    }

    to {
        transform: rotate(360deg);
    }
}

@keyframes rotate2 {

    from {
        transform: rotate(360deg);
    }

    to {
        transform: rotate(0deg);
    }
}

@keyframes pulse {

    0%,
    100% {
        transform: scale(1);
    }

    50% {
        transform: scale(1.06);
    }
}

.aura-status {
    margin-top: -8px;

<script>

/* =====================================================
   AURA SÜRÜM 3
   KALICI HAFIZA SİSTEMİ
===================================================== */


/* ELEMENTLER */

const chat =
    document.getElementById("chat");

const input =
    document.getElementById("input");

const sendButton =
    document.getElementById("sendButton");

const micButton =
    document.getElementById("micButton");


/* =====================================================
   HAFIZA
===================================================== */

const MEMORY_KEY =
    "AURA_MEMORY_V3";


function loadMemory() {

    try {

        const saved =
            localStorage.getItem(MEMORY_KEY);

        if (!saved) {

            return {
                notes: [],
                facts: [],
                preferences: []
            };
        }

        const memory =
            JSON.parse(saved);

        return {

            notes:
                Array.isArray(memory.notes)
                    ? memory.notes
                    : [],

            facts:
                Array.isArray(memory.facts)
                    ? memory.facts
                    : [],

            preferences:
                Array.isArray(memory.preferences)
                    ? memory.preferences
                    : []
        };

    }

    catch (error) {

        console.error(
            "Hafıza okunamadı:",
            error
        );

        return {
            notes: [],
            facts: [],
            preferences: []
        };
    }
}


let auraMemory =
    loadMemory();


function saveMemory() {

    try {

        localStorage.setItem(
            MEMORY_KEY,
            JSON.stringify(auraMemory)
        );

        return true;

    }

    catch (error) {

        console.error(
            "Hafıza kaydedilemedi:",
            error
        );

        return false;
    }
}


/* =====================================================
   HAFIZA YARDIMCILARI
===================================================== */

function addNote(note) {

    auraMemory.notes.push({
        id: Date.now(),
        text: note,
        date:
            new Date().toLocaleString("tr-TR")
    });

    saveMemory();
}


function addFact(fact) {

    auraMemory.facts.push({
        id: Date.now(),
        text: fact,
        date:
            new Date().toLocaleString("tr-TR")
    });

    saveMemory();
}


function addPreference(preference) {

    auraMemory.preferences.push({
        id: Date.now(),
        text: preference,
        date:
            new Date().toLocaleString("tr-TR")
    });

    saveMemory();
}


function clearMemory() {

    auraMemory = {
        notes: [],
        facts: [],
        preferences: []
    };

    saveMemory();
}


function memoryText() {

    let result =
        "AURA hafızasındaki bilgiler:\n\n";


    if (
        auraMemory.facts.length === 0 &&
        auraMemory.preferences.length === 0 &&
        auraMemory.notes.length === 0
    ) {

        return result +
            "Henüz kayıtlı bilgi yok.";
    }


    if (auraMemory.facts.length > 0) {

        result +=
            "KAYITLI BİLGİLER:\n";

        auraMemory.facts.forEach(
            function(item, index) {

                result +=
                    (index + 1) +
                    ". " +
                    item.text +
                    "\n";
            }
        );

        result += "\n";
    }


    if (auraMemory.preferences.length > 0) {

        result +=
            "TERCİHLER:\n";

        auraMemory.preferences.forEach(
            function(item, index) {

                result +=
                    (index + 1) +
                    ". " +
                    item.text +
                    "\n";
            }
        );

        result += "\n";
    }


    if (auraMemory.notes.length > 0) {

        result +=
            "NOTLAR:\n";

        auraMemory.notes.forEach(
            function(item, index) {

                result +=
                    (index + 1) +
                    ". " +
                    item.text +
                    "\n";
            }
        );
    }


    return result.trim();
}


/* =====================================================
   HAFIZA KOMUTLARI
===================================================== */

function handleMemoryCommand(text) {

    const command =
        text.toLowerCase().trim();


    /* NOT KAYDET */

    const notePatterns = [
        "not al",
        "not kaydet",
        "bunu not al",
        "bunu kaydet",
        "hafızana kaydet",
        "hafizana kaydet"
    ];


    for (
        const pattern of notePatterns
    ) {

        if (
            command.startsWith(pattern)
        ) {

            let note =
                text.substring(
                    pattern.length
                ).trim();

            if (
                note.startsWith(":")
            ) {

                note =
                    note.substring(1).trim();
            }


            if (!note) {

                return {
                    handled: true,
                    response:
                        "Ne not almamı istediğini söyle."
                };
            }


            addNote(note);

            return {
                handled: true,
                response:
                    "Tamam. Bunu hafızama kaydettim."
            };
        }
    }


    /* BİLGİ ÖĞRET */

    const learnPatterns = [
        "bunu hatırla",
        "bunu hafızana al",
        "bunu hafızanda tut",
        "bunu unutma"
    ];


    for (
        const pattern of learnPatterns
    ) {

        if (
            command.startsWith(pattern)
        ) {

            let fact =
                text.substring(
                    pattern.length
                ).trim();

            if (
                fact.startsWith(":")
            ) {

                fact =
                    fact.substring(1).trim();
            }


            if (!fact) {

                return {
                    handled: true,
                    response:
                        "Hatırlamamı istediğin bilgiyi söyle."
                };
            }


            addFact(fact);

            return {
                handled: true,
                response:
                    "Tamam. Bunu hatırlayacağım."
            };
        }
    }


    /* TERCİH KAYDET */

    const preferencePatterns = [
        "tercihim",
        "tercihimi hatırla",
        "şunu seviyorum",
        "sunu seviyorum",
        "şunu sevmiyorum",
        "sunu sevmiyorum"
    ];


    for (
        const pattern of preferencePatterns
    ) {

        if (
            command.startsWith(pattern)
        ) {

            let preference =
                text.substring(
                    pattern.length
                ).trim();

            if (
                preference.startsWith(":")
            ) {

                preference =
                    preference.substring(1).trim();
            }


            if (!preference) {

                return {
                    handled: true,
                    response:
                        "Hangi tercihini hatırlamamı istediğini söyle."
                };
            }


            addPreference(preference);

            return {
                handled: true,
                response:
                    "Tamam. Bu tercihini hafızama ekledim."
            };
        }
    }


    /* HAFIZAYI GÖSTER */

    if (
        command === "hafızamda ne var" ||
        command === "hafizamda ne var" ||
        command === "neyi hatırlıyorsun" ||
        command === "neyi hatirliyorsun" ||
        command === "hafızanı göster" ||
        command === "hafizani goster"
    ) {

        return {
            handled: true,
            response:
                memoryText()
        };
    }


    /* HAFIZAYI TEMİZLE */

    if (
        command === "hafızanı temizle" ||
        command === "hafizani temizle" ||
        command === "tüm hafızanı sil" ||
        command === "tum hafizani sil"
    ) {

        clearMemory();

        return {
            handled: true,
            response:
                "Tamam. Kayıtlı hafızam temizlendi."
        };
    }


    /* NOTLARI SİL */

    if (
        command === "notlarımı sil" ||
        command === "notlarimi sil" ||
        command === "tüm notları sil" ||
        command === "tum notlari sil"
    ) {

        auraMemory.notes = [];

        saveMemory();

        return {
            handled: true,
            response:
                "Kayıtlı notlarımı sildim."
        };
    }


    return {
        handled: false
    };
}

/* =====================================================
   SES İÇİN TEMİZLE
===================================================== */

function cleanTextForSpeech(text) {

    return text

        .replace(
            /[\p{Emoji_Presentation}\p{Extended_Pictographic}]/gu,
            ""
        )

        .replace(
            /https?:\/\/\S+/gi,
            ""
        )

        .replace(
            /[.,!?;:"'“”‘’()[\]{}<>…:;\/\\|@#$%^&*_+=~`-]/g,
            " "
        )

        .replace(
            /\s+/g,
            " "
        )

        .trim();
}


/* =====================================================
   SES
===================================================== */

function speak(text) {

    if (
        !("speechSynthesis" in window)
    ) {
        return;
    }


    const cleanText =
        cleanTextForSpeech(text);


    if (!cleanText) {
        return;
    }


    const message =
        new SpeechSynthesisUtterance(
            cleanText
        );


    message.lang =
        "tr-TR";

    message.rate =
        0.9;

    message.pitch =
        1;

    message.volume =
        1;


    window.speechSynthesis.cancel();


    setTimeout(
        function() {

            window.speechSynthesis.speak(
                message
            );

        },
        100
    );
}


/* =====================================================
   GERÇEK AI
===================================================== */

async function askAI(text) {

    updateAISystemMemory();


    conversation.push({

        role: "user",

        content: text
    });


    try {

        const response =
            await puter.ai.chat(
                conversation,
                {
                    model:
                        "gpt-5.4-nano"
                }
            );


        let answer = "";


        if (
            response &&
            response.message &&
            response.message.content
        ) {

            answer =
                response.message.content;

        }

        else if (
            response &&
            response.text
        ) {

            answer =
                response.text;

        }

        else if (
            typeof response === "string"
        ) {

            answer =
                response;

        }

        else {

            answer =
                String(response);
        }


        conversation.push({

            role: "assistant",

            content: answer
        });


        return answer;

    }

    catch (error) {

        console.error(
            "AURA AI HATASI:",
            error
        );


        return:
        "AI bağlantısında bir sorun oluştu. Biraz sonra tekrar deneyelim.";
    }
}
