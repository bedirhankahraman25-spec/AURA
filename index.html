<!DOCTYPE html>
<html lang="tr">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<meta name="theme-color"
      content="#02060a">

<title>AURA AI</title>

<style>

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
}

body {
    overflow: hidden;

    font-family: Arial, sans-serif;

    color: #00eaff;

    background:
        radial-gradient(
            circle at center,
            #06303d 0%,
            #02080c 50%,
            #000000 100%
        );
}

/* =========================
   ÜST BAR
========================= */

.top-bar {

    height: 60px;

    display: flex;

    align-items: center;

    justify-content: space-between;

    padding: 0 18px;

    background:
        rgba(0,10,15,0.9);

    border-bottom:
        1px solid
        rgba(0,234,255,0.4);
}

.logo {

    font-size: 21px;

    font-weight: bold;

    letter-spacing: 4px;

    text-shadow:
        0 0 10px #00eaff,
        0 0 25px #00eaff;
}

.status {

    font-size: 11px;

    letter-spacing: 2px;

    color: #55ffcc;

    text-transform: uppercase;
}

.status::before {

    content: "";

    display: inline-block;

    width: 7px;

    height: 7px;

    margin-right: 7px;

    border-radius: 50%;

    background: #55ffcc;

    box-shadow:
        0 0 8px #55ffcc,
        0 0 15px #55ffcc;
}

/* =========================
   ANA ALAN
========================= */

.main {

    height: calc(100vh - 60px);

    height: calc(100dvh - 60px);

    display: flex;

    flex-direction: column;

    align-items: center;

    min-height: 0;
}

/* =========================
   AURA ÇEKİRDEĞİ
========================= */

.aura-core {

    width: 210px;

    height: 210px;

    margin-top: 10px;

    position: relative;

    display: flex;

    align-items: center;

    justify-content: center;

    flex-shrink: 0;
}

.aura-ring {

    position: absolute;

    border-radius: 50%;

    border:
        1px solid
        #00eaff;

    opacity: 0.7;
}

.ring1 {

    width: 135px;

    height: 135px;

    border-left-color: transparent;

    border-right-color: transparent;

    animation:
        rotate1 7s linear infinite;
}

.ring2 {

    width: 175px;

    height: 175px;

    border-top-color: transparent;

    border-bottom-color: transparent;

    animation:
        rotate2 10s linear infinite;
}

.ring3 {

    width: 210px;

    height: 210px;

    border-left-color: transparent;

    border-bottom-color: transparent;

    animation:
        rotate1 14s linear infinite;
}

.aura-center {

    width: 100px;

    height: 100px;

    border-radius: 50%;

    border:
        2px solid
        #00eaff;

    display: flex;

    align-items: center;

    justify-content: center;

    color: #00eaff;

    font-size: 21px;

    font-weight: bold;

    letter-spacing: 3px;

    background:
        radial-gradient(
            circle,
            #064454,
            #02090d
        );

    box-shadow:
        0 0 15px #00eaff,
        0 0 45px rgba(0,234,255,0.7),
        inset 0 0 25px rgba(0,234,255,0.5);

    animation:
        pulse 2.2s infinite ease-in-out;

    z-index: 5;
}

@keyframes rotate1 {

    from {
        transform: rotate(0deg);
    }

    to {
        transform: rotate(360deg);
    }
}

@keyframes rotate2 {

    from {
        transform: rotate(360deg);
    }

    to {
        transform: rotate(0deg);
    }
}

@keyframes pulse {

    0%,
    100% {
        transform: scale(1);
    }

    50% {
        transform: scale(1.06);
    }
}

/* =========================
   DURUM
========================= */

.aura-status {

    margin-top: -8px;

    margin-bottom: 5px;

    font-size: 10px;

    letter-spacing: 3px;

    color: #8defff;

    text-transform: uppercase;
}

/* =========================
   SOHBET
========================= */

#chat {

    width: min(92%, 600px);

    flex: 1;

    min-height: 0;

    overflow-y: auto;

    padding:
        5px 5px 10px;

    scrollbar-width: thin;
}

.message {

    max-width: 85%;

    padding:
        10px 13px;

    margin-bottom: 10px;

    border-radius: 10px;

    line-height: 1.4;

    white-space: pre-wrap;

    font-size: 14px;

    word-wrap: break-word;
}

.aura {

    background:
        rgba(0,35,45,0.8);

    margin-right: auto;

    border:
        1px solid
        rgba(0,234,255,0.25);
}

.user {

    background:
        rgba(0,90,120,0.8);

    margin-left: auto;

    color: white;
}

/* =========================
   ALT PANEL
========================= */

#bottom {

    width: 100%;

    min-height: 65px;

    display: flex;

    align-items: center;

    gap: 8px;

    padding: 10px;

    background:
        rgba(0,10,15,0.97);

    border-top:
        1px solid
        rgba(0,234,255,0.45);

    z-index: 10;
}

#input {

    flex: 1;

    min-width: 0;

    height: 45px;

    padding: 12px;

    border-radius: 8px;

    border:
        1px solid
        rgba(0,234,255,0.5);

    outline: none;

    background:
        rgba(0,25,32,0.95);

    color: #00eaff;

    font-size: 14px;
}

#input::placeholder {

    color: #548995;
}

button {

    height: 45px;

    border:
        1px solid
        #00eaff;

    border-radius: 8px;

    padding: 0 14px;

    background:
        rgba(0,60,75,0.9);

    color: #00eaff;

    font-size: 14px;

    cursor: pointer;
}

button:active {

    transform: scale(0.94);
}

button:disabled {

    opacity: 0.5;

    cursor: not-allowed;
}

.mic-button {

    width: 45px;

    padding: 0;

    font-size: 20px;
}

@media (max-width: 500px) {

    .aura-core {

        transform: scale(0.82);

        margin-top: 0;

        margin-bottom: -15px;
    }

    .logo {

        font-size: 18px;
    }

    button {

        padding: 0 11px;
    }
}

</style>

</head>

<body>

<div class="top-bar">

    <div class="logo">
        AURA
    </div>

    <div class="status">
        ONLINE
    </div>

</div>

<div class="main">

    <div class="aura-core">

        <div class="aura-ring ring1"></div>

        <div class="aura-ring ring2"></div>

        <div class="aura-ring ring3"></div>

        <div class="aura-center">
            AURA
        </div>

    </div>

    <div class="aura-status">
        AI SYSTEM READY
    </div>

    <div id="chat"></div>

    <div id="bottom">

        <input
            id="input"
            type="text"
            placeholder="AURA'ya bir şey sor..."
            autocomplete="off"
        >

        <button
            class="mic-button"
            id="micButton"
            type="button">
            🎤
        </button>

        <button
            id="sendButton"
            type="button">
            Gönder
        </button>

    </div>

</div>

<script src="https://js.puter.com/v2/"></script>

<script>/* =====================================================
   AURA AYARLARI
===================================================== */

const USER_NAME =
    "Bedirhan Kahraman";

const GIRLFRIEND_NAME =
    "Edanur Kahraman";

const MEMORY_KEY =
    "AURA_MEMORY_V6";

const CHAT_KEY =
    "AURA_CHAT_V6";

const TASK_KEY =
    "AURA_TASKS_V6";


/* =====================================================
   HTML ELEMANLARI
===================================================== */

const chat =
    document.getElementById("chat");

const input =
    document.getElementById("input");

const sendButton =
    document.getElementById("sendButton");

const micButton =
    document.getElementById("micButton");


/* =====================================================
   GÜVENLİ LOCALSTORAGE
===================================================== */

function loadData(
    key,
    fallback
){

    try {

        const raw =
            localStorage.getItem(
                key
            );

        if(
            raw === null
        ){

            return fallback;
        }

        return JSON.parse(
            raw
        );

    } catch(error){

        console.error(
            "AURA veri okuma hatası:",
            error
        );

        return fallback;
    }
}


function saveData(
    key,
    value
){

    try {

        localStorage.setItem(
            key,
            JSON.stringify(value)
        );

        return true;

    } catch(error){

        console.error(
            "AURA veri kaydetme hatası:",
            error
        );

        return false;
    }
}


/* =====================================================
   METİN NORMALİZASYONU
===================================================== */

function normalizeText(
    text
){

    return String(text || "")
        .toLocaleLowerCase("tr-TR")
        .trim()
        .replace(
            /\s+/g,
            " "
        );
}


/* =====================================================
   HAFIZA
===================================================== */

function createEmptyMemory(){

    return {

        facts: [],

        notes: [],

        preferences: []

    };
}


let auraMemory =
    loadData(
        MEMORY_KEY,
        createEmptyMemory()
    );


if(
    !auraMemory ||
    typeof auraMemory !== "object"
){

    auraMemory =
        createEmptyMemory();
}


if(
    !Array.isArray(
        auraMemory.facts
    )
){

    auraMemory.facts = [];
}


if(
    !Array.isArray(
        auraMemory.notes
    )
){

    auraMemory.notes = [];
}


if(
    !Array.isArray(
        auraMemory.preferences
    )
){

    auraMemory.preferences = [];
}


function saveMemory(){

    saveData(
        MEMORY_KEY,
        auraMemory
    );
}


function addMemory(
    type,
    text
){

    if(
        !auraMemory[type]
    ){

        return false;
    }


    const value =
        String(text || "").trim();


    if(
        !value
    ){

        return false;
    }


    /*
       Aynı bilgiyi sürekli tekrar
       kaydetmesini engelle.
    */

    const exists =
        auraMemory[type].some(
            item =>
                normalizeText(
                    item.text
                ) ===
                normalizeText(
                    value
                )
        );


    if(
        exists
    ){

        return true;
    }


    auraMemory[type].push({

        id:
            Date.now(),

        text:
            value,

        date:
            new Date()
                .toLocaleString(
                    "tr-TR"
                )

    });


    /*
       Hafızanın gereksiz büyümesini
       engelle.
    */

    if(
        auraMemory[type].length > 100
    ){

        auraMemory[type] =
            auraMemory[type].slice(
                -100
            );
    }


    saveMemory();

    return true;
}


/* =====================================================
   HAFIZA METNİ
===================================================== */

function getMemoryText(){

    const parts = [];


    if(
        auraMemory.facts.length
    ){

        parts.push(
            "Kayıtlı bilgiler:\n" +
            auraMemory.facts
                .map(
                    item =>
                        "- " +
                        item.text
                )
                .join("\n")
        );
    }


    if(
        auraMemory.preferences.length
    ){

        parts.push(
            "Kullanıcı tercihleri:\n" +
            auraMemory.preferences
                .map(
                    item =>
                        "- " +
                        item.text
                )
                .join("\n")
        );
    }


    if(
        auraMemory.notes.length
    ){

        parts.push(
            "Kullanıcı notları:\n" +
            auraMemory.notes
                .map(
                    item =>
                        "- " +
                        item.text
                )
                .join("\n")
        );
    }


    if(
        !parts.length
    ){

        return:
            "Henüz kayıtlı özel bilgi yok.";
    }


    return parts.join(
        "\n\n"
    );
}


/* =====================================================
   HAFIZA KOMUTLARI
===================================================== */

function handleMemoryCommand(
    text
){

    const command =
        normalizeText(text);


    const notePatterns = [

        "not al ",

        "not kaydet ",

        "bunu not al ",

        "bunu kaydet ",

        "hafızana kaydet ",

        "hafizana kaydet "

    ];


    for(
        const pattern of notePatterns
    ){

        if(
            command.startsWith(
                pattern
            )
        ){

            const value =
                text
                    .substring(
                        pattern.length
                    )
                    .trim();


            if(
                !value
            ){

                return:
                    "Kaydetmem için bir not belirt.";
            }


            addMemory(
                "notes",
                value
            );


            return:
                "Tamam. Notu kalıcı hafızama kaydettim.";
        }
    }


    const factPatterns = [

        "bunu hatırla ",

        "bunu hatirla ",

        "bunu hafızana al ",

        "bunu hafizana al ",

        "bunu hafızanda tut ",

        "bunu hafizanda tut ",

        "bunu unutma "

    ];


    for(
        const pattern of factPatterns
    ){

        if(
            command.startsWith(
                pattern
            )
        ){

            const value =
                text
                    .substring(
                        pattern.length
                    )
                    .trim();


            if(
                !value
            ){

                return:
                    "Hatırlamam için bir bilgi belirt.";
            }


            addMemory(
                "facts",
                value
            );


            return:
                "Tamam. Bunu kalıcı hafızama kaydettim.";
        }
    }


    const preferencePatterns = [

        "tercihimi hatırla ",

        "tercihimi hatirla ",

        "şunu seviyorum ",

        "sunu seviyorum ",

        "şunu sevmiyorum ",

        "sunu sevmiyorum "

    ];


    for(
        const pattern of preferencePatterns
    ){

        if(
            command.startsWith(
                pattern
            )
        ){

            const value =
                text
                    .substring(
                        pattern.length
                    )
                    .trim();


            if(
                !value
            ){

                return:
                    "Hatırlamam için bir tercih belirt.";
            }


            addMemory(
                "preferences",
                value
            );


            return:
                "Tamam. Tercihini kalıcı hafızama kaydettim.";
        }
    }


    if(
        command ===
            "hafızamda ne var" ||

        command ===
            "hafizamda ne var" ||

        command ===
            "neyi hatırlıyorsun" ||

        command ===
            "neyi hatirliyorsun" ||

        command ===
            "hafızanı göster" ||

        command ===
            "hafizani goster"
    ){

        return getMemoryText();
    }


    if(
        command ===
            "hafızanı temizle" ||

        command ===
            "hafizani temizle" ||

        command ===
            "tüm hafızanı sil" ||

        command ===
            "tum hafizani sil"
    ){

        auraMemory =
            createEmptyMemory();

        saveMemory();


        return:
            "AURA hafızası tamamen temizlendi.";
    }


    if(
        command ===
            "notlarımı sil" ||

        command ===
            "notlarimi sil" ||

        command ===
            "tüm notları sil" ||

        command ===
            "tum notlari sil"
    ){

        auraMemory.notes = [];

        saveMemory();


        return:
            "Tüm notlar silindi.";
    }


    return null;
}/* =====================================================
   GÖREV SİSTEMİ
===================================================== */

let tasks =
    loadData(
        TASK_KEY,
        []
    );


if(
    !Array.isArray(tasks)
){

    tasks = [];
}


function saveTasks(){

    saveData(
        TASK_KEY,
        tasks
    );
}


function addTask(
    text
){

    const value =
        String(text || "").trim();


    if(
        !value
    ){

        return false;
    }


    tasks.push({

        id:
            Date.now(),

        text:
            value,

        completed:
            false,

        created:
            new Date()
                .toLocaleString(
                    "tr-TR"
                )

    });


    if(
        tasks.length > 100
    ){

        tasks =
            tasks.slice(
                -100
            );
    }


    saveTasks();

    return true;
}


function getActiveTasks(){

    return tasks.filter(
        task =>
            task.completed === false
    );
}


function handleTaskCommand(
    text
){

    const command =
        normalizeText(text);


    if(
        command === "görevlerim" ||
        command === "gorevlerim" ||
        command === "görevlerimi göster" ||
        command === "gorevlerimi goster"
    ){

        const active =
            getActiveTasks();


        if(
            active.length === 0
        ){

            return:
                "Şu anda bekleyen bir görevin yok.";
        }


        return:

            "Bekleyen görevlerin:\n\n" +

            active
                .map(
                    (task,index) =>
                        (
                            index + 1
                        ) +
                        ". " +
                        task.text
                )
                .join("\n");
    }


    const addPatterns = [

        "görev ekle ",

        "gorev ekle ",

        "görevlere ekle ",

        "gorevlere ekle "

    ];


    for(
        const pattern of addPatterns
    ){

        if(
            command.startsWith(
                pattern
            )
        ){

            const value =
                text
                    .substring(
                        pattern.length
                    )
                    .trim();


            if(
                !value
            ){

                return:
                    "Eklememi istediğin görevi belirt.";
            }


            addTask(
                value
            );


            return:
                "Görev eklendi: " +
                value;
        }
    }


    if(
        command === "görevleri temizle" ||
        command === "gorevleri temizle"
    ){

        tasks = [];

        saveTasks();


        return:
            "Görev listesi temizlendi.";
    }


    return null;
}


/* =====================================================
   HESAP MAKİNESİ
===================================================== */

function calculateMath(
    text
){

    let expression =
        normalizeText(
            text
        );


    expression =
        expression

            .replace(
                /kaç eder/g,
                ""
            )

            .replace(
                /kac eder/g,
                ""
            )

            .replace(
                /hesapla/g,
                ""
            )

            .replace(
                /sonuç/g,
                ""
            )

            .replace(
                /sonuc/g,
                ""
            )

            .trim();


    if(
        !expression
    ){

        return null;
    }


    /*
       Sadece matematik karakterleri.
       eval kullanılmıyor.
    */

    if(
        !/^[0-9+\-*/%().,\s^]+$/
            .test(
                expression
            )
    ){

        return null;
    }


    if(
        !/[0-9]/
            .test(
                expression
            )
    ){

        return null;
    }


    try{

        expression =
            expression
                .replace(
                    /,/g,
                    "."
                )
                .replace(
                    /\^/g,
                    "**"
                );


        const result =
            Function(
                '"use strict";' +
                'return (' +
                expression +
                ')'
            )();


        if(
            typeof result !==
            "number"
        ){

            return null;
        }


        if(
            !Number.isFinite(
                result
            )
        ){

            return:
                "Bu işlemin sonucu tanımsız.";
        }


        return:
            "Sonuç: " +
            result;

    }catch(error){

        return null;
    }
}


/* =====================================================
   TARİH / SAAT / KİMLİK / ŞAKA
===================================================== */

function getLocalCommand(
    text
){

    const command =
        normalizeText(
            text
        );


    if(
        command === "saat kaç" ||
        command === "saat kac" ||
        command === "şu an saat kaç" ||
        command === "su an saat kac"
    ){

        return:
            "Şu an saat " +
            new Date()
                .toLocaleTimeString(
                    "tr-TR",
                    {
                        hour:
                            "2-digit",

                        minute:
                            "2-digit"
                    }
                ) +
            ".";
    }


    if(
        command === "tarih ne" ||
        command === "bugün tarih ne" ||
        command === "bugun tarih ne" ||
        command === "bugünün tarihi" ||
        command === "bugunun tarihi" ||
        command === "bugün hangi gün" ||
        command === "bugun hangi gun"
    ){

        return:
            "Bugün " +
            new Date()
                .toLocaleDateString(
                    "tr-TR",
                    {
                        weekday:
                            "long",

                        year:
                            "numeric",

                        month:
                            "long",

                        day:
                            "numeric"
                    }
                ) +
            ".";
    }


    if(
        command === "ben kimim"
    ){

        return:
            "Sen " +
            USER_NAME +
            "'sın.";
    }


    if(
        command === "sevgilim kim" ||
        command === "sevgilimin adı ne" ||
        command === "sevgilimin adi ne"
    ){

        return:
            "Sevgilinin adı " +
            GIRLFRIEND_NAME +
            ".";
    }


    if(
        command === "edanur kim"
    ){

        return:
            "Edanur Kahraman, senin sevgilin.";
    }


    if(
        command === "sen kimsin" ||
        command === "adın ne" ||
        command === "adin ne"
    ){

        return:
            "Ben AURA. Kişisel yapay zeka asistanınım.";
    }


    if(
        command.includes("şaka yap") ||
        command.includes("saka yap") ||
        command.includes("şaka anlat") ||
        command.includes("saka anlat")
    ){

        const jokes = [

            "Matematik kitabı neden üzgünmüş? Çünkü çok problemi varmış.",

            "Bilgisayar neden doktora gitmiş? Virüs kapmış.",

            "Telefon neden gözlük takmış? Ekranı bulanıkmış.",

            "Elektrikçi neden yalnız kalmaz? Çünkü her zaman bir bağlantısı vardır.",

            "Programcı neden kahve içer? Çünkü JavaScript tek başına yetmiyor."

        ];


        return:
            jokes[
                Math.floor(
                    Math.random() *
                    jokes.length
                )
            ];
    }


    return null;
}


/* =====================================================
   YEREL KOMUTLARI BİRLEŞTİR
===================================================== */

function handleLocalCommand(
    text
){

    const memory =
        handleMemoryCommand(
            text
        );


    if(
        memory !== null
    ){

        return memory;
    }


    const task =
        handleTaskCommand(
            text
        );


    if(
        task !== null
    ){

        return task;
    }


    const math =
        calculateMath(
            text
        );


    if(
        math !== null
    ){

        return math;
    }


    const local =
        getLocalCommand(
            text
        );


    if(
        local !== null
    ){

        return local;
    }


    return null;
}/* =====================================================
   GÖREV SİSTEMİ
===================================================== */

let tasks =
    loadData(
        TASK_KEY,

    );


if(
    !Array.isArray(tasks)
){

    tasks = [];
}


function saveTasks(){

    saveData(
        TASK_KEY,
        tasks
    );
}


function addTask(
    text
){

    const value =
        String(text || "").trim();


    if(
        !value
    ){

        return false;
    }


    tasks.push({

        id:
            Date.now(),

        text:
            value,

        completed:
            false,

        created:
            new Date()
                .toLocaleString(
                    "tr-TR"
                )

    });


    if(
        tasks.length > 100
    ){

        tasks =
            tasks.slice(
                -100
            );
    }


    saveTasks();

    return true;
}


function getActiveTasks(){

    return tasks.filter(
        task =>
            task.completed === false
    );
}


function handleTaskCommand(
    text
){

    const command =
        normalizeText(text);


    if(
        command === "görevlerim" ||
        command === "gorevlerim" ||
        command === "görevlerimi göster" ||
        command === "gorevlerimi goster"
    ){

        const active =
            getActiveTasks();


        if(
            active.length === 0
        ){

            return:
                "Şu anda bekleyen bir görevin yok.";
        }


        return:

            "Bekleyen görevlerin:\n\n" +

            active
                .map(
                    (task,index) =>
                        (
                            index + 1
                        ) +
                        ". " +
                        task.text
                )
                .join("\n");
    }


    const addPatterns = [

        "görev ekle ",

        "gorev ekle ",

        "görevlere ekle ",

        "gorevlere ekle "

    ];


    for(
        const pattern of addPatterns
    ){

        if(
            command.startsWith(
                pattern
            )
        ){

            const value =
                text
                    .substring(
                        pattern.length
                    )
                    .trim();


            if(
                !value
            ){

                return:
                    "Eklememi istediğin görevi belirt.";
            }


            addTask(
                value
            );


            return:
                "Görev eklendi: " +
                value;
        }
    }


    if(
        command === "görevleri temizle" ||
        command === "gorevleri temizle"
    ){

        tasks = [];

        saveTasks();


        return:
            "Görev listesi temizlendi.";
    }


    return null;
}


/* =====================================================
   HESAP MAKİNESİ
===================================================== */

function calculateMath(
    text
){

    let expression =
        normalizeText(
            text
        );


    expression =
        expression

            .replace(
                /kaç eder/g,
                ""
            )

            .replace(
                /kac eder/g,
                ""
            )

            .replace(
                /hesapla/g,
                ""
            )

            .replace(
                /sonuç/g,
                ""
            )

            .replace(
                /sonuc/g,
                ""
            )

            .trim();


    if(
        !expression
    ){

        return null;
    }


    /*
       Sadece matematik karakterleri.
       eval kullanılmıyor.
    */

    if(
        !/^[0-9+\-*/%().,\s^]+$/
            .test(
                expression
            )
    ){

        return null;
    }


    if(
        !/[0-9]/
            .test(
                expression
            )
    ){

        return null;
    }


    try{

        expression =
            expression
                .replace(
                    /,/g,
                    "."
                )
                .replace(
                    /\^/g,
                    "**"
                );


        const result =
            Function(
                '"use strict";' +
                'return (' +
                expression +
                ')'
            )();


        if(
            typeof result !==
            "number"
        ){

            return null;
        }


        if(
            !Number.isFinite(
                result
            )
        ){

            return:
                "Bu işlemin sonucu tanımsız.";
        }


        return:
            "Sonuç: " +
            result;

    }catch(error){

        return null;
    }
}

    if(

    ){

        return:

    if(

    if(

    ){

        return:

    }


    if(
        command.includes("şaka yap") ||

    ){

        const jokes = [

function isPuterReady(){

    return (
        typeof puter !== "undefined" &&
        puter.ai &&
        typeof puter.ai.chat === "function"
    );
}


/* =====================================================
   AI CEVAP ÇIKARMA
===================================================== */

function extractAIText(
    response
){

    if(
        response === null ||
        response === undefined
    ){

        return "";
    }


    if(
        typeof response === "string"
    ){

        return response.trim();
    }


    if(
        response.message &&
        typeof response.message.content ===
        "string"
    ){

        return response.message.content.trim();
    }


    if(
        response.message &&
        Array.isArray(
            response.message.content
        )
    ){

        return response.message.content
            .map(
                part => {

                    if(
                        typeof part === "string"
                    ){

                        return part;
                    }


                    if(
                        part &&
                        typeof part.text === "string"
                    ){

                        return part.text;
                    }


                    return "";
                }
            )
            .join("")
            .trim();
    }


    if(
        typeof response.text === "string"
    ){

        return response.text.trim();
    }


    if(
        typeof response.content === "string"
    ){

        return response.content.trim();
    }


    return "";
}

/* =====================================================
   PUTER HAZIRLANMASINI BEKLE
===================================================== */

async function waitForPuter(){

    if(
        isPuterReady()
    ){

        return true;
    }


    for(
        let i = 0;
        i < 30;
        i++
    ){

        await new Promise(
            resolve =>
                setTimeout(
                    resolve,
                    300
                )
        );


        if(
            isPuterReady()
        ){

            return true;
        }
    }


    return false;
}

   NORMAL AI
===================================================== */

async function askAI(
    text
){

    conversation[0] = {

        role:
            "system",

        content:
            buildSystemPrompt()

    };


    conversation.push({

        role:
            "user",

        content:
            String(text)

    });


    if(
        conversation.length > 31
    ){

        conversation =
            [
                conversation[0]
            ].concat(
                conversation.slice(-30)
            );
    }


    const ready =
        await waitForPuter();


    if(
        !ready
    ){

        conversation.pop();


        return:
            "AURA'nın AI bağlantısı hazır değil. " +
            "Sayfayı yenileyip tekrar deneyebilirsin.";
    }


    try{

        const response =
            await puter.ai.chat(
                conversation,
                {
                    model:
                        "gpt-5.4-nano"
                }
            );


        const answer =
            extractAIText(
                response
            );


        if(
            !answer
        ){

            conversation.pop();


            return:
                "AURA şu anda cevap oluşturamadı.";
        }


        conversation.push({

            role:
                "assistant",

            content:
                answer

        });


        return answer;

    }catch(error){

        console.error(
            "AURA AI HATASI:",
            error
        );


        if(
            conversation.length &&
            conversation[
                conversation.length - 1
            ].role === "user"
        ){

            conversation.pop();
        }


        return:
            "AI bağlantısında geçici bir sorun oluştu.";
    }

function needsWebSearch(
    text
){

    const command =
        normalizeText(
            text
        );


    const keywords = [

        "internette ara",
        "internetten ara",
        "internette araştır",
        "internetten araştır",

        "webde ara",
        "web'de ara",

        "internetten bak",
        "internete bak",

        "güncel bilgi",
        "guncel bilgi",

        "güncel haber",
        "guncel haber",

        "son dakika",
        "haberler",

        "hava durumu",
        "hava nasıl",
        "hava nasil",

        "şimdi",
        "simdi",

        "şu an",
        "su an"

    ];


    return keywords.some(
        keyword =>
            command.includes(
                keyword
            )
    );
}

async function askAIWithWeb(

){

    conversation[0] = {

function rememberUserInformation(
    text
){

    const command =
        normalizeText(
            text
        );


    const namePatterns = [

        "benim adım ",

        "benim adim "

    ];


    for(
        const pattern of namePatterns
    ){

        if(
            command.startsWith(
                pattern
            )
        ){

            const value =
                text
                    .substring(
                        pattern.length
                    )
                    .trim();


            if(
                value
            ){

                addMemory(
                    "facts",
                    "Kullanıcının söylediği isim: " +
                    value
                );


                return:
                    "Tamam. Bunu hafızama kaydettim.";
            }
        }
    }


    /*
       Kullanıcı açık şekilde
       bir şeyi sevdiğini söylüyorsa
       tercih olarak kaydet.
    */

    if(
        command.includes(
            " seviyorum"
        )
    ){

        addMemory(
            "preferences",
            text
        );


        return:
            "Tamam. Bu tercihini hafızama kaydettim.";
    }


    return null;
}


/* =====================================================
   SES METNİ TEMİZLE
===================================================== */

function cleanTextForSpeech(
    text
){

    return String(text || "")

        .replace(
            /https?:\/\/\S+/gi,
            " "
        )

        .replace(
            /[\p{Emoji_Presentation}\p{Extended_Pictographic}]/gu,
            " "
        )

        .replace(
            /[.,!?;:"'“”‘’()[\]{}<>…\/\\|@#$%^&*_+=~`-]/g,
            " "
        )

        .replace(
            /\s+/g,
            " "
        )

        .trim();
}


/* =====================================================
   AURA SESLENDİRME
===================================================== */

function speak(
    text
){

    if(
        !("speechSynthesis" in window)
    ){

        return;
    }


    const clean =
        cleanTextForSpeech(
            text
        );


    if(
        !clean
    ){

        return;
    }


    try{

        window.speechSynthesis.cancel();


        const utterance =
            new SpeechSynthesisUtterance(
                clean
            );


        utterance.lang =
            "tr-TR";

        utterance.rate =
            0.9;

        utterance.pitch =
            1;

        utterance.volume =
            1;


        window.speechSynthesis.speak(
            utterance
        );

    }catch(error){

        console.error(
            "Seslendirme hatası:",
            error
        );
    }
}

let isProcessing =
    false;


async function sendMessage(
    voiceMode = false
){

    if(
        isProcessing
    ){

        return;
    }


    const text =
        input.value.trim();


    if(
        !text
    ){

        return;
    }


    input.value =
        "";


    addMessage(
        text,
        "user"
    );


    addMessage(
        "Düşünüyorum...",
        "aura"
    );


    const loading =
        chat.lastElementChild;


    isProcessing =
        true;


    sendButton.disabled =
        true;


    micButton.disabled =
        true;


    try{

        let reply =
            handleLocalCommand(
                text
            );


        /*
           Yerel komut değilse
           kullanıcı bilgisini kontrol et.
        */

        if(
            reply === null
        ){

            reply =
                rememberUserInformation(
                    text
                );
        }


        /*
           Hâlâ cevap yoksa AI'ye gönder.
        */

        if(
            reply === null
        ){

            if(
                needsWebSearch(
                    text
                )
            ){

                reply =
                    await askAIWithWeb(
                        text
                    );

            }else{

                reply =
                    await askAI(
                        text
                    );
            }
        }


        if(
            loading
        ){

            loading.remove();
        }


        addMessage(
            reply,
            "aura"
        );


        if(
            voiceMode
        ){

            speak(
                reply
            );
        }

    }catch(error){

        console.error(
            "MESAJ HATASI:",
            error
        );


        if(
            loading
        ){

            loading.remove();
        }


        addMessage(
            "Bir hata oluştu. Tekrar deneyelim.",
            "aura"
        );

    }finally{

        isProcessing =
            false;


        sendButton.disabled =
            false;


        micButton.disabled =
            false;


        input.focus();
    }
}


/* =====================================================
   GÖNDER BUTONU
===================================================== */

sendButton.addEventListener(
    "click",
    function(){

        sendMessage(
            false
        );

    }
);


/* =====================================================
   ENTER
===================================================== */

input.addEventListener(
    "keydown",
    function(event){

        if(
            event.key === "Enter"
        ){

            event.preventDefault();


            sendMessage(
                false
            );
        }

    }
);

===================================================== */

window.addEventListener(
    "beforeunload",
    function(){

        try{

            saveMemory();

            saveChatHistory();

            saveTasks();

        }catch(error){

            console.error(
                "Kapanış kayıt hatası:",
                error
            );
        }

    }
);
