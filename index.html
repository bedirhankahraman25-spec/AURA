<!DOCTYPE html>
<html lang="tr">
<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>AURA AI</title>

<style>

/* =========================
   TEMEL
========================= */

*{
    box-sizing:border-box;
}

html,
body{
    width:100%;
    height:100%;
    margin:0;
}

body{

    overflow:hidden;

    font-family:
        Arial,
        sans-serif;

    color:#e7fbff;

    background:
        radial-gradient(
            circle at 50% 20%,
            #073d5d 0%,
            #031d31 27%,
            #010b16 60%,
            #000207 100%
        );
}


/* =========================
   ARKA PLAN IŞIKLARI
========================= */

body::before{

    content:"";

    position:fixed;

    width:600px;
    height:600px;

    left:50%;
    top:-170px;

    transform:
        translateX(-50%);

    border-radius:50%;

    background:
        radial-gradient(
            circle,
            rgba(0,190,255,.13),
            rgba(0,100,180,.05) 40%,
            transparent 70%
        );

    pointer-events:none;
}


body::after{

    content:"";

    position:fixed;

    inset:0;

    pointer-events:none;

    background:
        linear-gradient(
            rgba(0,200,255,.035) 1px,
            transparent 1px
        ),
        linear-gradient(
            90deg,
            rgba(0,200,255,.035) 1px,
            transparent 1px
        );

    background-size:
        50px 50px;

}


/* =========================
   ÜST BAR
========================= */

.header{

    height:58px;

    display:flex;

    align-items:center;

    justify-content:space-between;

    padding:
        0 18px;

    background:
        rgba(0,5,12,.82);

    border-bottom:
        1px solid
        rgba(0,210,255,.25);

    position:relative;

    z-index:10;

    backdrop-filter:
        blur(12px);
}


.logo{

    color:#00eaff;

    font-size:20px;

    font-weight:bold;

    letter-spacing:5px;

    text-shadow:
        0 0 10px #00eaff,
        0 0 25px rgba(0,220,255,.55);
}


.status{

    display:flex;

    align-items:center;

    gap:7px;

    color:#54ffcf;

    font-size:9px;

    letter-spacing:2px;
}


.status-dot{

    width:6px;
    height:6px;

    border-radius:50%;

    background:#54ffcf;

    box-shadow:
        0 0 8px #54ffcf,
        0 0 16px #54ffcf;

}


/* =========================
   ANA
========================= */

.main{

    height:
        calc(100dvh - 58px);

    display:flex;

    flex-direction:column;

    align-items:center;

    min-height:0;

    position:relative;

    z-index:2;
}


/* =========================
   YENİ AURA ÇEKİRDEĞİ
========================= */

.core{

    width:225px;
    height:225px;

    position:relative;

    display:flex;

    align-items:center;

    justify-content:center;

    flex-shrink:0;

    margin-top:-3px;
}


/* Dış halka */

.core-ring{

    position:absolute;

    border-radius:50%;

    border:
        1px solid
        rgba(0,225,255,.6);

    box-shadow:
        0 0 10px
        rgba(0,220,255,.25);
}


.core-ring.r1{

    width:150px;
    height:150px;

    border-top-color:
        transparent;

    border-bottom-color:
        transparent;

    animation:
        spin1 6s linear infinite;
}


.core-ring.r2{

    width:184px;
    height:184px;

    border-left-color:
        transparent;

    border-right-color:
        transparent;

    animation:
        spin2 9s linear infinite;
}


.core-ring.r3{

    width:215px;
    height:215px;

    border-top-color:
        transparent;

    border-left-color:
        transparent;

    animation:
        spin1 14s linear infinite;
}


/* Küre ışığı */

.core-glow{

    position:absolute;

    width:150px;
    height:150px;

    border-radius:50%;

    background:
        radial-gradient(
            circle,
            rgba(0,235,255,.28),
            rgba(0,130,220,.12) 40%,
            transparent 72%
        );

    filter:
        blur(8px);

    animation:
        glow 2.5s ease-in-out infinite;
}


/* Ana küre */

.sphere{

    width:108px;
    height:108px;

    position:relative;

    border-radius:50%;

    display:flex;

    align-items:center;

    justify-content:center;

    overflow:hidden;

    background:

        radial-gradient(
            circle at 33% 27%,
            #c8ffff 0%,
            #36eaff 7%,
            #078bab 22%,
            #034969 43%,
            #012238 65%,
            #000a13 100%
        );

    border:
        2px solid
        rgba(104,246,255,.9);

    box-shadow:

        0 0 12px #00eaff,

        0 0 35px
        rgba(0,220,255,.75),

        0 0 75px
        rgba(0,110,255,.4),

        inset:
        -18px -15px 25px
        rgba(0,0,0,.6),

        inset:
        10px 8px 18px
        rgba(170,255,255,.35);

    animation:
        spherePulse 2.2s
        ease-in-out infinite;

    z-index:5;
}


/* Küre yatay enerji çizgileri */

.sphere::before{

    content:"";

    position:absolute;

    width:145px;
    height:42px;

    border-top:
        1px solid
        rgba(175,255,255,.7);

    border-bottom:
        1px solid
        rgba(0,220,255,.45);

    border-radius:50%;

    transform:
        rotate(-18deg);

    box-shadow:
        0 0 8px
        rgba(0,240,255,.6);

}


/* Küre dikey enerji çizgileri */

.sphere::after{

    content:"";

    position:absolute;

    width:45px;
    height:145px;

    border-left:
        1px solid
        rgba(150,250,255,.55);

    border-right:
        1px solid
        rgba(0,210,255,.35);

    border-radius:50%;

    transform:
        rotate(28deg);

}


/* AURA yazısı */

.core-name{

    position:relative;

    z-index:10;

    color:#eaffff;

    font-size:16px;

    font-weight:bold;

    letter-spacing:4px;

    text-shadow:

        0 0 5px #ffffff,

        0 0 12px #00eaff,

        0 0 25px #00aaff;

}


/* Küre merkezi */

.core-light{

    position:absolute;

    width:22px;
    height:22px;

    border-radius:50%;

    background:
        radial-gradient(
            circle,
            #ffffff,
            #8fffff 25%,
            #00dfff 50%,
            transparent 75%
        );

    opacity:.55;

    filter:
        blur(1px);

    animation:
        lightPulse 1.8s
        ease-in-out infinite;

}


/* Animasyonlar */

@keyframes spin1{

    to{
        transform:
            rotate(360deg);
    }

}


@keyframes spin2{

    to{
        transform:
            rotate(-360deg);
    }

}


@keyframes glow{

    50%{
        transform:
            scale(1.13);

        opacity:.75;
    }

}


@keyframes spherePulse{

    50%{

        transform:
            scale(1.045);

        box-shadow:

            0 0 18px #00eaff,

            0 0 50px
            rgba(0,220,255,.8),

            0 0 90px
            rgba(0,110,255,.45),

            inset:
            -18px -15px 25px
            rgba(0,0,0,.6),

            inset:
            10px 8px 18px
            rgba(170,255,255,.4);

    }

}


@keyframes lightPulse{

    50%{

        transform:
            scale(1.4);

        opacity:.2;

    }

}


/* =========================
   SİSTEM YAZISI
========================= */

.system{

    margin-top:-8px;

    margin-bottom:7px;

    color:#78e7fa;

    font-size:9px;

    letter-spacing:3px;

    text-shadow:
        0 0 8px
        rgba(0,220,255,.6);

}


/* =========================
   SOHBET
========================= */

.chat-panel{

    width:
        min(92%,640px);

    flex:1;

    min-height:0;

    display:flex;

    flex-direction:column;

    background:
        rgba(1,11,21,.55);

    border:
        1px solid
        rgba(0,180,255,.18);

    border-radius:
        18px 18px 0 0;

    backdrop-filter:
        blur(10px);

    overflow:hidden;
}


.chat-title{

    height:31px;

    display:flex;

    align-items:center;

    padding:
        0 13px;

    color:
        rgba(130,220,240,.55);

    font-size:8px;

    letter-spacing:2px;

    border-bottom:
        1px solid
        rgba(0,180,255,.12);
}


.chat-title::after{

    content:"";

    flex:1;

    height:1px;

    margin-left:10px;

    background:
        linear-gradient(
            90deg,
            rgba(0,210,255,.3),
            transparent
        );
}


/* =========================
   MESAJ ALANI
========================= */

#chat{

    flex:1;

    min-height:0;

    overflow-y:auto;

    padding:
        12px;

    scrollbar-width:thin;

    scrollbar-color:
        #007fa8
        transparent;
}


#chat::-webkit-scrollbar{

    width:3px;
}


#chat::-webkit-scrollbar-thumb{

    background:#008db8;

    border-radius:10px;
}


/* =========================
   MESAJLAR
========================= */

.message{

    max-width:80%;

    padding:
        10px 13px;

    margin-bottom:10px;

    border-radius:12px;

    font-size:13px;

    line-height:1.45;

    white-space:pre-wrap;

    animation:
        messageIn .2s ease;
}


@keyframes messageIn{

    from{

        opacity:0;

        transform:
            translateY(5px);

    }

    to{

        opacity:1;

        transform:
            translateY(0);

    }

}


/* AURA SOL */

.message.aura{

    margin-left:0;

    margin-right:auto;

    background:
        linear-gradient(
            135deg,
            rgba(3,58,78,.78),
            rgba(1,24,39,.8)
        );

    border-left:
        2px solid
        #00eaff;

    border-top-left-radius:
        3px;

    color:#dcfaff;

}


/* KULLANICI SAĞ */

.message.user{

    margin-left:auto;

    margin-right:0;

    background:
        linear-gradient(
            135deg,
            rgba(8,93,126,.9),
            rgba(3,48,76,.92)
        );

    border-right:
        2px solid
        #4dffce;

    border-top-right-radius:
        3px;

    color:#ffffff;

}


/* =========================
   ALT MESAJ ALANI
========================= */

.bottom{

    width:
        min(92%,640px);

    padding:
        9px 8px 10px;

    background:
        linear-gradient(
            180deg,
            #041d31,
            #020d1b
        );

    border:
        1px solid
        rgba(0,180,255,.2);

    border-top:0;

    border-radius:
        0 0 18px 18px;

}


/* Mesaj kutusu */

.composer{

    height:48px;

    display:flex;

    align-items:center;

    gap:7px;

    padding:
        4px 5px 4px 13px;

    border-radius:14px;

    background:
        #041b2d;

    border:
        1px solid
        rgba(0,190,255,.3);

    transition:.2s;
}


.composer:focus-within{

    border-color:
        rgba(0,225,255,.7);

    box-shadow:
        0 0 18px
        rgba(0,180,255,.12);
}


#input{

    flex:1;

    min-width:0;

    height:100%;

    border:0;

    outline:0;

    background:
        transparent;

    color:#ffffff;

    font-size:13px;
}


#input::placeholder{

    color:#54798a;

}


/* Butonlar */

.button{

    width:40px;
    height:40px;

    flex-shrink:0;

    border:0;

    border-radius:11px;

    cursor:pointer;

    color:#00eaff;

    background:
        #062b43;

    font-size:16px;

    transition:.15s;

}


.button:active{

    transform:
        scale(.9);

}


.send{

    color:#001923;

    background:
        linear-gradient(
            135deg,
            #00eaff,
            #4dffcf
        );

    box-shadow:
        0 0 15px
        rgba(0,220,255,.25);

}


/* =========================
   MOBİL
========================= */

@media(max-width:500px){

    .core{

        transform:
            scale(.82);

        margin-top:-5px;

        margin-bottom:-13px;

    }


    .chat-panel,
    .bottom{

        width:96%;

    }


    .message{

        max-width:88%;

        font-size:13px;

    }


    .composer{

        height:46px;

    }


    .button{

        width:38px;

        height:38px;

    }

}

</style>

</head>


<body>


<!-- =========================
     ÜST
========================= -->

<div class="header">

    <div class="logo">
        AURA
    </div>

    <div class="status">

        <span class="status-dot"></span>

        SYSTEM ONLINE

    </div>

</div>


<!-- =========================
     ANA
========================= -->

<div class="main">


    <!-- AURA ÇEKİRDEĞİ -->

    <div class="core">

        <div class="core-ring r1"></div>

        <div class="core-ring r2"></div>

        <div class="core-ring r3"></div>

        <div class="core-glow"></div>

        <div class="sphere">

            <div class="core-name">
                AURA
            </div>

            <div class="core-light"></div>

        </div>

    </div>


    <div class="system">
        AURA CORE // READY
    </div>


    <!-- SOHBET -->

    <div class="chat-panel">

        <div class="chat-title">
            COMMUNICATION CHANNEL
        </div>


        <div id="chat">

            <!-- AURA SOLDA -->

            <div class="message aura">
                AURA çekirdeği başlatıldı.
            </div>


            <!-- AURA SOLDA -->

            <div class="message aura">
                Sistem hazır. Seni dinliyorum.
            </div>

        </div>

    </div>


    <!-- MESAJ ALANI -->

    <div class="bottom">

        <div class="composer">

            <input
                id="input"
                type="text"
                placeholder="AURA'ya mesaj yaz..."
                autocomplete="off"
            >


            <button
                class="button"
                id="mic"
                type="button">

                🎙

            </button>


            <button
                class="button send"
                id="send"
                type="button">

                ➤

            </button>

        </div>

    </div>

</div>


<script>

/* =========================
   ELEMANLAR
========================= */

const input =
    document.getElementById("input");

const send =
    document.getElementById("send");

const mic =
    document.getElementById("mic");

const chat =
    document.getElementById("chat");


/* =========================
   MESAJ EKLE
========================= */

function addMessage(
    text,
    type
){

    const message =
        document.createElement("div");


    message.className =
        "message " + type;


    message.textContent =
        text;


    chat.appendChild(
        message
    );


    chat.scrollTop =
        chat.scrollHeight;

}


/* =========================
   MESAJ GÖNDER
========================= */

function sendMessage(){

    const text =
        input.value.trim();


    if(!text){

        return;

    }


    /*
       KULLANICI MESAJI
       SAĞ TARAFTA
    */

    addMessage(
        text,
        "user"
    );


    input.value =
        "";


    /*
       ŞİMDİLİK TEST CEVABI
       AURA SOL TARAFTA
    */

    setTimeout(
        function(){

            addMessage(
                "Mesajını aldım. AURA prototip modu aktif.",
                "aura"
            );

        },
        350
    );

}


/* =========================
   GÖNDER BUTONU
========================= */

send.addEventListener(
    "click",
    sendMessage
);


/* =========================
   ENTER
========================= */

input.addEventListener(
    "keydown",
    function(event){

        if(
            event.key === "Enter"
        ){

            event.preventDefault();

            sendMessage();

        }

    }
);


/* =========================
   MİKROFON
========================= */

mic.addEventListener(
    "click",
    function(){

        addMessage(
            "Sesli iletişim modülü hazır.",
            "aura"
        );

    }
);


/* =========================
   BAŞLANGIÇ
========================= */

window.addEventListener(
    "load",
    function(){

        input.focus();

    }
);

</script>


</body>

</html>
