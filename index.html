<head>

<title>AURA AI</title>

<style>
*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    width:100%;
    height:100%;
    margin:0;
    padding:0;
}

body{
    overflow:hidden;
    font-family:Arial,Helvetica,sans-serif;
    color:#dffaff;
    background:
        radial-gradient(circle at 50% 35%,
        #073b57 0%,
        #05263b 30%,
        #020e19 65%,
        #00070d 100%);
}

button,input,textarea{
    font:inherit;
}

button{
    border:0;
}

.app{
    width:100%;
    height:100dvh;
    display:flex;
    flex-direction:column;
    position:relative;
    overflow:hidden;
}

.topbar{
    height:64px;
    flex:0 0 64px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 18px;
    background:rgba(0,7,13,.94);
    border-bottom:1px solid rgba(0,234,255,.28);
    box-shadow:0 8px 30px rgba(0,0,0,.3);
    z-index:20;
}

.logo{
    font-size:22px;
    letter-spacing:6px;
    color:#00eaff;
    text-shadow:0 0 12px rgba(0,234,255,.9),0 0 25px rgba(0,234,255,.55);
}

.online{
    font-size:9px;
    letter-spacing:2px;
    color:#69ffd7;
}

.online i{
    display:inline-block;
    width:8px;
    height:8px;
    margin-right:7px;
    border-radius:50%;
    background:#55ffc8;
    box-shadow:0 0 12px #55ffc8;
}

.system-mini{
    position:absolute;
    left:12px;
    top:10px;
    display:flex;
    gap:7px;
    flex-wrap:wrap;
    z-index:8;
    pointer-events:none;
}

.system-mini span{
    padding:4px 7px;
    border:1px solid rgba(0,234,255,.18);
    border-radius:8px;
    background:rgba(1,17,28,.58);
    color:#6d9ba7;
    font-size:7px;
    letter-spacing:1px;
}

.system-mini .ok{
    color:#62ffd6;
}

.stage{
    position:relative;
    flex:1;
    min-height:0;
    overflow:hidden;
}

.background-glow{
    position:absolute;
    width:600px;
    height:600px;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    border-radius:50%;
    background:
        radial-gradient(circle,
        rgba(0,220,255,.12),
        rgba(0,100,220,.04) 45%,
        transparent 72%);
    filter:blur(12px);
    pointer-events:none;
}

.status-line{
    position:absolute;
    left:50%;
    top:48px;
    transform:translateX(-50%);
    color:#6b99a6;
    font-size:9px;
    letter-spacing:2px;
    z-index:10;
    white-space:nowrap;
}

.core-zone{
    position:absolute;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    transition:all .45s ease;
    z-index:3;
    pointer-events:none;
}

.app.chat-open .core-zone{
    align-items:flex-start;
    padding-top:75px;
}

.core-button{
    width:140px;
    height:140px;
    position:relative;
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius:50%;
    cursor:pointer;
    pointer-events:auto;
    color:#fff;
    background:
        radial-gradient(circle at 35% 30%,
        #8dfbff 0%,
        #1595ad 18%,
        #053647 48%,
        #010b13 72%);
    border:2px solid #5af7ff;
    box-shadow:
        0 0 18px #00eaff,
        0 0 70px rgba(0,234,255,.5),
        inset 0 0 35px rgba(0,234,255,.55);
    animation:corePulse 2.8s ease-in-out infinite;
    outline:none;
}

.core-button:active{
    transform:scale(.96);
}

.core-text{
    font-size:18px;
    font-weight:700;
    letter-spacing:6px;
    text-shadow:0 0 8px #fff,0 0 18px #00eaff;
}

.ring{
    position:absolute;
    border:1px solid rgba(0,234,255,.65);
    border-radius:50%;
    pointer-events:none;
}

.r1{
    width:170px;
    height:170px;
    border-left-color:transparent;
    border-bottom-color:transparent;
    animation:rotateOne 9s linear infinite;
}

.r2{
    width:195px;
    height:195px;
    border-right-color:transparent;
    border-top-color:transparent;
    animation:rotateTwo 13s linear infinite;
}

.r3{
    width:220px;
    height:220px;
    border-left-color:transparent;
    border-right-color:transparent;
    opacity:.42;
    animation:rotateOne 17s linear infinite;
}

@keyframes rotateOne{
    from{transform:rotate(0deg)}
    to{transform:rotate(360deg)}
}

@keyframes rotateTwo{
    from{transform:rotate(360deg)}
    to{transform:rotate(0deg)}
}

@keyframes corePulse{
    0%,100%{transform:scale(1)}
    50%{transform:scale(1.035)}
}

.chat-panel{
    position:absolute;
    left:5px;
    right:5px;
    bottom:5px;
    height:72%;
    display:flex;
    flex-direction:column;
    background:rgba(1,12,21,.97);
    border:1px solid rgba(0,234,255,.35);
    border-radius:23px;
    box-shadow:0 0 35px rgba(0,0,0,.45),inset 0 0 25px rgba(0,234,255,.04);
    transform:translateY(calc(100% + 35px));
    opacity:0;
    pointer-events:none;
    transition:transform .45s cubic-bezier(.2,.8,.2,1),opacity .25s ease;
    z-index:4;
    overflow:hidden;
    touch-action:none;
}

.app.chat-open .chat-panel{
    transform:translateY(0);
    opacity:1;
    pointer-events:auto;
}

.chat-head{
    min-height:50px;
    flex:0 0 50px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 12px;
    border-bottom:1px solid rgba(0,234,255,.15);
}

.chat-head-left{
    min-width:0;
}

.chat-title{
    font-size:9px;
    letter-spacing:2.5px;
    color:#8fefff;
    white-space:nowrap;
}

.file-hint{
    margin-top:3px;
    font-size:7px;
    color:#578592;
    letter-spacing:.5px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.close-btn{
    width:34px;
    height:34px;
    flex:0 0 34px;
    border-radius:50%;
    background:#08283a;
    color:#8fefff;
    cursor:pointer;
    font-size:20px;
}

.close-btn:active{
    transform:scale(.92);
}

.messages{
    flex:1;
    min-height:0;
    overflow-y:auto;
    padding:15px 6px 125px;
    scroll-behavior:smooth;
    overscroll-behavior:contain;
}

.messages::-webkit-scrollbar{
    width:4px;
}

.messages::-webkit-scrollbar-thumb{
    background:rgba(0,234,255,.3);
    border-radius:10px;
}

.msg{
    width:fit-content;
    max-width:91%;
    padding:13px 15px;
    margin:0 6px 12px;
    border-radius:16px;
    line-height:1.5;
    font-size:14px;
    white-space:pre-wrap;
    overflow-wrap:anywhere;
    word-break:break-word;
    text-align:left;
    animation:messageIn .2s ease;
}

@keyframes messageIn{
    from{opacity:0;transform:translateY(6px)}
    to{opacity:1;transform:translateY(0)}
}

.msg.aura{
    margin-right:auto;
    background:linear-gradient(135deg,rgba(4,44,61,.96),rgba(2,24,35,.96));
    border-left:3px solid #00eaff;
    border-radius:5px 18px 18px 18px;
}

.msg.user{
    margin-left:auto;
    background:linear-gradient(135deg,#0b6687,#07465e);
    border-right:3px solid #65faff;
    border-radius:18px 5px 18px 18px;
    color:#fff;
}

.file-pill{
    display:none;
    margin:8px 12px 0;
    padding:8px 10px;
    border-radius:10px;
    background:#05293a;
    color:#86eefa;
    font-size:11px;
}

.file-pill.show{
    display:block;
}

.input-area{
    position:absolute;
    left:7px;
    right:7px;
    bottom:7px;
    min-height:68px;
    padding:7px;
    display:grid;
    grid-template-columns:minmax(0,1fr) 46px 46px 46px;
    gap:6px;
    align-items:center;
    background:rgba(2,24,37,.99);
    border:1px solid rgba(0,234,255,.65);
    border-radius:22px;
    box-shadow:0 0 20px rgba(0,234,255,.12);
    width:auto;
}

.input-wrap{
    min-width:0;
    width:100%;
    height:50px;
    display:flex;
    align-items:center;
    overflow:hidden;
    border-radius:17px;
    background:rgba(0,48,65,.75);
}

#input{
    width:100%;
    min-width:0;
    height:100%;
    padding:0 12px;
    border:0;
    outline:0;
    background:transparent;
    color:#e9fdff;
    font-size:14px;
}

#input::placeholder{
    color:#7195a3;
}

.action-button{
    width:46px;
    height:46px;
    min-width:46px;
    padding:0;
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius:16px;
    cursor:pointer;
    font-size:19px;
    transition:transform .15s,filter .15s;
}

.action-button:active{
    transform:scale(.92);
}

.action-button:disabled{
    opacity:.45;
}

#micButton{
    background:#063c59;
    color:#a9f8ff;
    border:1px solid rgba(0,234,255,.25);
}

#micButton.listening{
    background:#00a8bd;
    color:#fff;
    box-shadow:0 0 20px rgba(0,234,255,.7);
}

#sendButton{
    background:linear-gradient(135deg,#19ddeb,#15a7c9);
    color:#001018;
    font-size:23px;
    font-weight:900;
    box-shadow:0 0 15px rgba(0,234,255,.35);
}

#fileButton{
    background:#062f45;
    color:#81ecff;
}

.toast{
    position:fixed;
    left:50%;
    bottom:20px;
    transform:translate(-50%,20px);
    max-width:88%;
    padding:11px 16px;
    border:1px solid rgba(0,234,255,.4);
    border-radius:12px;
    background:#041522;
    color:#c4f9ff;
    font-size:13px;
    text-align:center;
    opacity:0;
    pointer-events:none;
    transition:.25s;
    z-index:1000;
}

.toast.show{
    opacity:1;
    transform:translate(-50%,0);
}

.hidden{
    display:none!important;

function saveJSON(key,value){

    try{
        localStorage.setItem(
            key,
            JSON.stringify(value)
        );
    }catch(error){
        console.error("Storage save:",error);
    }
}

function loadJSON(key,fallback){

    try{

        const raw =
            localStorage.getItem(key);

        if(!raw){
            return fallback;
        }

        return JSON.parse(raw);

    }catch(error){

        console.error("Storage load:",error);

        return fallback;
    }
}

/* ================================
   TEXT HELPERS
================================ */

function cleanText(text){

    return String(text ?? "")
        .replace(/\s+/g," ")
        .trim();
}

function lowerTR(text){

    return cleanText(text)
        .toLocaleLowerCase("tr-TR");
}

function normalizeAIResponse(response){

    if(!response){
        return "";
    }

    if(typeof response === "string"){
        return response.trim();
    }

    if(response.message){

        if(typeof response.message.content === "string"){
            return response.message.content.trim();
        }

        if(Array.isArray(response.message.content)){
            return response.message.content
                .map(x =>
                    typeof x === "string"
                        ? x
                        : x?.text || ""
                )
                .join("")
                .trim();
        }
    }

    if(typeof response.content === "string"){
        return response.content.trim();
    }

    return String(response)
        .replace(/^\[object Object\]$/,"")
        .trim();
}

function escapeHTML(text){

    return String(text)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;");
}

function formatDate(date){

    return new Intl.DateTimeFormat(
        "tr-TR",
        {
            day:"2-digit",
            month:"2-digit",
            year:"numeric",
            hour:"2-digit",
            minute:"2-digit"
        }
    ).format(date);
}<!-- AURA AI ULTIMATE - PART 4/13 -->

function addReminder(

){

function nextRepeatTime(
    reminder
){

    const current =
        new Date(reminder.time);

    if(reminder.repeat === "daily"){

        current.setDate(
            current.getDate()+1
        );

        return current.getTime();
    }

    if(reminder.repeat === "weekly"){

        current.setDate(
            current.getDate()+7
        );

        return current.getTime();
    }

    return null;
}

function notifyReminder(
    reminder
){

    addMessage(
        `Hatırlatma: ${reminder.text}`,
        "aura",
        true
    );

    speak(
        `Hatırlatma. ${reminder.text}`
    );

    if(
        "Notification" in window &&
        Notification.permission === "granted"
    ){
        try{
            new Notification(
                "AURA Hatırlatma",
                {
                    body:reminder.text,
                    icon:""
                }
            );
        }catch{}
    }
}

function checkReminders(){

    const now =
        Date.now();

    let changed = false;

    state.reminders.forEach(
        reminder => {

            if(!reminder.active){
                return;
            }

            if(
                reminder.time <= now &&
                reminder.lastTriggered !== reminder.time
            ){

                reminder.lastTriggered =
                    reminder.time;

                notifyReminder(
                    reminder
                );

                const next =
                    nextRepeatTime(
                        reminder
                    );

                if(next){

                    reminder.time = next;

                }else{

                    reminder.active = false;
                }

                changed = true;
            }
        }
    );

    if(changed){
        saveJSON(
            STORAGE.reminders,
            state.reminders
        );

        updateDashboard();
    }
      }<!-- AURA AI ULTIMATE - PART 6/13 -->

/* ================================
   TIME PARSER
================================ */

function parseTimeText(text){

    const match =
        String(text)
            .match(
                /(?:saat\s*)?([01]?\d|2[0-3])(?:[:.](\d{2}))?/i
            );

    if(!match){
        return null;
    }

    return {
        hour:Number(match[1]),
        minute:Number(match[2] || 0)
    };
}

function buildReminderDate(
    text
){

    const now =
        new Date();

    const lower =
        lowerTR(text);

    const time =
        parseTimeText(text);

    if(!time){
        return null;
    }

    let date =
        new Date(now);

    if(
        lower.includes("yarın") ||
        lower.includes("yarin")
    ){

        date.setDate(
            date.getDate()+1
        );
    }

    const weekDays = {
        "pazar":0,
        "pazartesi":1,
        "salı":2,
        "sali":2,
        "çarşamba":3,
        "carsamba":3,
        "perşembe":4,
        "persembe":4,
        "cuma":5,
        "cumartesi":6
    };

    for(
        const dayName in weekDays
    ){

        if(lower.includes(dayName)){

            const target =
                weekDays[dayName];

            let diff =
                target - date.getDay();

            if(diff <= 0){
                diff += 7;
            }

            date.setDate(
                date.getDate()+diff
            );

            break;
        }
    }

    date.setHours(
        time.hour,
        time.minute,
        0,
        0
    );

    if(
        date.getTime() <= now.getTime() &&
        !(
            lower.includes("yarın") ||
            lower.includes("yarin")
        )
    ){
        date.setDate(
            date.getDate()+1
        );
    }

    return date;
}

/* ================================
   SMART REMINDER
================================ */

function smartReminderCommand(
    text
){

    const lower =
        lowerTR(text);

    const reminderWords =
        [
            "hatırlat",
            "hatirlat",
            "hatırlatıcı",
            "hatirlatici"
        ];

    if(
        !reminderWords.some(
            word => lower.includes(word)
        )
    ){
        return {
            handled:false
        };
    }

    const date =
        buildReminderDate(text);

    if(!date){

        return {
            handled:true,
            response:
                "Hatırlatma için saat belirt. Örneğin: yarın 14:00'te matematik çalışmayı hatırlat."
        };
    }

    let reminderText =
        text
            .replace(
                /.*?(hatırlat|hatirlatıcı|hatirlat)/i,
                ""
            )
            .trim();

    reminderText =
        reminderText
            .replace(
                /^(?:bana|şunu|sunu)\s*/i,
                ""
            )
            .replace(
                /(?:yarın|yarin|bugün|bugun)\s*/i,
                ""
            )
            .replace(
                /(?:her gün|her gun|her hafta|her pazartesi|her salı|her sali|her çarşamba|her carsamba|her perşembe|her persembe|her cuma|her cumartesi|her pazar)\s*/i,
                ""
            )
            .trim();

    let repeat =
        "none";

    if(
        lower.includes("her gün") ||
        lower.includes("her gun")
    ){
        repeat = "daily";
    }

    if(
        lower.includes("her hafta") ||
        lower.match(/her\s+(pazartesi|salı|sali|çarşamba|carsamba|perşembe|persembe|cuma|cumartesi|pazar)/)
    ){
        repeat = "weekly";
    }

    if(!reminderText){
        reminderText =
            "Planlanan işlem";
    }

    addReminder(
        reminderText,
        date,
        repeat
    );

    addTask(
        reminderText,
        {
            due:date.getTime(),
            source:"reminder"
        }
    );

    return {
        handled:true,
        response:
            `${formatDate(date)} için hatırlatma oluşturdum.\n\n${reminderText}${
                repeat !== "none"
                    ? `\nTekrar: ${repeat === "daily" ? "Her gün" : "Her hafta"}`
                    : ""
            }`
    };
}

async function extractPDFText(
    file
){

    try{

        const pdfjs =
            await import(
                "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.4.168/pdf.min.mjs"
            );

        pdfjs.GlobalWorkerOptions.workerSrc =
            "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.4.168/pdf.worker.min.mjs";

        const buffer =
            await file.arrayBuffer();

        const pdf =
            await pdfjs.getDocument({
                data:buffer
            }).promise;

        let result = "";

        const pages =
            Math.min(
                pdf.numPages,
                25
            );

        for(
            let i=1;
            i<=pages;
            i++
        ){

            const page =
                await pdf.getPage(i);

            const content =
                await page.getTextContent();

            result +=
                content.items
                    .map(
                        item => item.str
                    )
                    .join(" ")
                +
                "\n\n";
        }

        return result.slice(
            0,
            50000
        );

    }catch(error){

        console.error(
            "PDF:",
            error
        );

        return "";
    }
}

async function readFile(
    file
){

    if(!file){
        return;
    }

    const name =
        file.name.toLowerCase();

    try{

        state.fileName =
            file.name;

        state.fileType =
            file.type;

        state.fileContext = "";
        state.imageURL = "";

        if(
            file.type.startsWith("image/")
        ){

            filePill.textContent =
                `Görsel: ${file.name}`;

            filePill.classList.add("show");

            await analyzeImage(
                file,
                "Bu görseli ayrıntılı şekilde Türkçe analiz et."
            );

            return;
        }

        if(
            name.endsWith(".pdf")
        ){

            const text =
                await extractPDFText(
                    file
                );

            if(!text){

                showToast(
                    "PDF metni okunamadı. Dosyayı görsel olarak da gönderebilirsin."
                );

                return;
            }

            state.fileContext =
                text;

        }else{

            const supported =
                [
                    ".txt",
                    ".md",
                    ".json",
                    ".csv",
                    ".html",
                    ".css",
                    ".js",
                    ".py"
                ].some(
                    ext =>
                        name.endsWith(ext)
                );

            if(!supported){

                showToast(
                    "Bu dosya türü desteklenmiyor."
                );

                return;
            }

            state.fileContext =
                (
                    await file.text()
                ).slice(
                    0,
                    50000
                );
        }

        filePill.textContent =
            `Dosya: ${file.name}`;

        filePill.classList.add("show");

            state.fileContext.slice(0,300)

        addMessage(
            `${file.name} AURA'ya yüklendi. Dosyayı özetleyebilir, içindeki hataları bulabilir veya sorularını cevaplayabilirim.`,
            "aura",
            true
        );

    }catch(error){

        console.error(
            "Dosya:",
            error
        );

        showToast(
            "Dosya okunamadı."
        );
    }

async function askAI(
    text,
    options={}
){

    if(
        typeof puter === "undefined"
    ){
        throw new Error(
            "Puter yüklenmedi."
        );
    }

    if(
        !puter.ai ||
        typeof puter.ai.chat !== "function"
    ){
        throw new Error(
            "Puter AI servisi bulunamadı."
        );
    }

    const messages = [

        {
            role:"system",
            content:buildPrompt()
        }

    ];

    state.history
        .slice(-14)
        .forEach(
            item => {

                if(
                    item &&
                    typeof item.text === "string"
                ){

                    messages.push({
                        role:
                            item.role === "user"
                                ? "user"
                                : "assistant",
                        content:item.text
                    });
                }
            }
        );

    messages.push({
        role:"user",
        content:String(text)
    });

    const config = {
        model:AI_MODEL
    };

    if(
        options.webSearch ||
        needsWebSearch(text)
    ){

        config.tools = [
            {
                type:"web_search"
            }
        ];
    }

    const response =
        await puter.ai.chat(
            messages,
            config
        );

    const answer =
        normalizeAIResponse(
            response
        );

    if(!answer){
        throw new Error(
            "AI metin döndürmedi."
        );
    }

    return answer;
}

async function planAgent(
    goal
){

    const agent =
        createAgent(goal);

    statusLine.textContent =
        "AURA AJAN PLANLIYOR";

    const planningPrompt = `
Aşağıdaki görevi 3 ile 7 arası uygulanabilir adıma böl.

Görev:
${goal}

Sadece JSON döndür:

{
  "steps": [
    "adım 1",
    "adım 2",
    "adım 3"
  ]
}

Türkçe yaz.
`;

    const answer =
        await askAI(
            planningPrompt
        );

    let parsed = null;

    try{

        parsed =
            JSON.parse(
                answer
                    .replace(
                        /```json|```/g,
                        ""
                    )
                    .trim()
            );

    }catch{}

    if(
        !parsed ||
        !Array.isArray(parsed.steps)
    ){

        parsed = {
            steps:[
                "Görevi analiz et",
                "Gerekli bilgileri araştır",
                "Sonuçları karşılaştır",
                "Sonucu düzenle",
                "Kullanıcıya sun"
            ]
        };
    }

    agent.steps =
        parsed.steps
            .slice(0,7)
            .map(
                title => ({
                    title,
                    done:false
                })
            );

    agent.status =
        "running";

    saveJSON(
        STORAGE.agents,
        state.agents
    );

    return agent;
}

async function executeAgent(
    agent
){

    const results = [];

    for(
        let i=0;
        i<agent.steps.length;
        i++
    ){

        const step =
            agent.steps[i];

        statusLine.textContent =
            `AJAN ${i+1}/${agent.steps.length}`;

        step.done = false;

        const web =
            needsWebSearch(
                `${agent.goal} ${step.title}`
            );

        try{

            const result =
                await askAI(
                    `
AJAN GÖREVİ

Ana görev:
${agent.goal}

Şu anda yalnızca bu adımı gerçekleştir:
${step.title}

Önceki sonuçlar:
${results.join("\n\n")}

Sonucu Türkçe ve kullanışlı şekilde ver.
`,
                    {
                        webSearch:web
                    }
                );

            results.push(
                `ADIM ${i+1}: ${result}`
            );

            step.result =
                result;

            step.done = true;

            saveJSON(
                STORAGE.agents,
                state.agents
            );

            addMessage(
                `Ajan ${i+1}/${agent.steps.length} tamamlandı:\n${result}`,
                "aura",
                false
            );

        }catch(error){

            step.result =
                "Bu adım gerçekleştirilemedi.";

            step.done = false;

            results.push(
                `ADIM ${i+1}: Başarısız`
            );
        }
    }

    agent.status =
        "completed";

    saveJSON(
        STORAGE.agents,
        state.agents
    );

    const finalPrompt = `
Aşağıdaki ajan görevinin sonuçlarını tek ve düzgün bir sonuç haline getir.

ANA GÖREV:
${agent.goal}

SONUÇLAR:
${results.join("\n\n")}

Gereksiz tekrarları kaldır.
Türkçe yaz.
Sonucu doğrudan kullanıcıya sun.
`;

    return await askAI(
        finalPrompt,
        {
            webSearch:
                needsWebSearch(agent.goal)
        }
    );
}

async function runAgent(
    goal
){

    const agent =
        await planAgent(
            goal
        );

    addMessage(
        `AURA ajanı görevi parçaladı:\n\n${
            agent.steps
                .map(
                    (x,i)=>
                        `${i+1}. ${x.title}`
                )
                .join("\n")
        }`,
        "aura",
        true
    );

    return await executeAgent(
        agent
    );
}

/* ================================

================================ */

function localCommand(
    text
){

    const lower =
        lowerTR(text);

    /* ---- BASIC ---- */

    let result =
        basicCommand(text);

    if(result.handled){
        return result;
    }

    /* ---- MEMORY ---- */

    const memoryPatterns = [
        {
            type:"facts",
            words:[
                "hafızaya kaydet",
                "hafizaya kaydet",
                "hatırla",
                "hatirla"
            ]
        },
        {
            type:"preferences",
            words:[
                "sevdiğimi hatırla",
                "sevdigimi hatirla"
            ]
        },
        {
            type:"notes",
            words:[
                "not al",
                "not olarak kaydet"
            ]
        }
    ];

    for(
        const group of memoryPatterns
    ){

        for(
            const prefix of group.words
        ){

            if(lower.startsWith(prefix)){

                const value =
                    text
                        .slice(
                            prefix.length
                        )
                        .trim();

                if(!value){

                    return {
                        handled:true,
                        response:
                            "Kaydedilecek bilgiyi belirt."
                    };
                }

                addMemory(
                    group.type,
                    value
                );

                return {
                    handled:true,
                    response:
                        "Tamam. Bunu kalıcı hafızaya kaydettim."
                };
            }
        }
    }

    if(
        [
            "hafızamda ne var",
            "hafizamda ne var",
            "neyi hatırlıyorsun",
            "neyi hatirliyorsun"
        ].includes(lower)
    ){

        return {
            handled:true,
            response:
                memoryText()
        };
    }

    if(
        lower.includes(
            "aura hafızasında kaç kayıt var"
        ) ||
        lower.includes(
            "aura hafizasında kac kayit var"
        )
    ){

        return {
            handled:true,
            response:
                `AURA hafızasında ${memoryCount()} kayıt var.`
        };
    }

    /* ---- TASKS ---- */

    const taskMatch =
        lower.match(
            /^(?:görev ekle|gorev ekle)\s+(.+)$/
        );

    if(taskMatch){

        const originalStart =
            lower.indexOf(
                taskMatch[1]
            );

        const title =
            text
                .slice(
                    originalStart
                )
                .trim();

        addTask(title);

        return {
            handled:true,
            response:
                `Görev eklendi: ${title}`
        };
    }

    if(
        [
            "görevlerim",
            "gorevlerim",
            "görev listesi",
            "gorev listesi"
        ].includes(lower)
    ){

        return {
            handled:true,
            response:
                taskListText()
        };
    }

    const complete =
        lower.match(
            /^(?:görevi tamamla|gorevi tamamla)\s+(\d+)$/
        );

    if(complete){

        const index =
            Number(
                complete[1]
            ) - 1;

        return {
            handled:true,
            response:
                completeTask(index)
                    ? "Görev tamamlandı."
                    : "Bu numarada görev bulunamadı."
        };
    }

    /* ---- REMINDER ---- */

    result =
        smartReminderCommand(
            text
        );

    if(result.handled){
        return result;
    }

    /* ---- MEMORY MANAGEMENT ---- */

    if(
        lower.includes(
            "son kaydettiğim notu sil"
        ) ||
        lower.includes(
            "son kaydettigim notu sil"
        )
    ){

        const removed =
            state.memory.notes.pop();

        saveJSON(
            STORAGE.memory,
            state.memory
        );

        return {
            handled:true,
            response:
                removed
                    ? `Son not silindi: ${removed}`
                    : "Silinecek kayıt yok."
        };
    }

    if(
        lower.includes(
            "edanın hakkındaki kayıtları göster"
        ) ||
        lower.includes(
            "edanur hakkındaki kayıtları göster"
        )
    ){

        const items = [
            ...state.memory.facts,
            ...state.memory.preferences,
            ...state.memory.notes
        ].filter(
            item =>
                lowerTR(item)
                    .includes("edan")
        );

        return {
            handled:true,
            response:
                items.length
                    ? items.join("\n")
                    : "Edanur hakkında özel hafıza kaydı bulunamadı."
        };
    }

    /* ---- PROFILE ---- */

    if(
        lower.startsWith(
            "profilime ekle "
        )
    ){

        const value =
            text
                .slice(15)
                .trim();

        addKnowledge(
            "Kullanıcı profili",
            value
        );

        return {
            handled:true,
            response:
                "Bilgiyi kişisel bilgi tabanına ekledim."
        };
    }

    if(
        lower === "profilimi göster"
    ){

        return {
            handled:true,
            response:
                profileText()
        };
    }

    /* ---- GOALS ---- */

    if(
        lower.startsWith(
            "hedef oluştur "
        ) ||
        lower.startsWith(
            "hedef olustur "
        )
    ){

        const value =
            text
                .replace(
                    /^hedef\s+(oluştur|olustur)\s+/i,
                    ""
                )
                .trim();

        const goal =
            createGoal(value);

        return {
            handled:true,
            response:
                `Hedef oluşturuldu: ${goal.title}\n\nİstersen "bu hedefi parçalara böl" diyebilirsin.`
        };
    }

    /* ---- SITE ---- */

    const siteMatch =
        lower.match(
            /^(?:siteyi aç|siteyi ac|aç|ac)\s+(.+)$/
        );

    if(siteMatch){

        const target =
            text
                .slice(
                    text.toLocaleLowerCase("tr-TR")
                        .indexOf(siteMatch[1])
                )
                .trim();

        return {
            handled:true,
            response:
                openWebsite(target)
        };
    }

    /* ---- APP ---- */

    const appMatch =
        lower.match(
            /^(?:uygulamayı aç|uygulamayi ac|uygulama aç|uygulama ac)\s+(.+)$/
        );

    if(appMatch){

        const appName =
            text
                .slice(
                    text.toLocaleLowerCase("tr-TR")
                        .indexOf(appMatch[1])
                )
                .trim();

        if(
            openAndroidApp(appName)
        ){

            return {
                handled:true,
                response:
                    `${appName} uygulamasını açmayı deniyorum.`
            };
        }

        return {
            handled:true,
            response:
                `${appName} için Android uygulama bağlantısı bulunamadı.`
        };
    }

    /* ---- SHORTCUTS ---- */

    if(
        lower === "/hafıza" ||
        lower === "/hafiza"
    ){
        return {
            handled:true,
            response:
                memoryText()
        };
    }

    if(
        lower === "/görevler" ||
        lower === "/gorevler"
    ){
        return {
            handled:true,
            response:
                taskListText()
        };
    }

    if(
        lower === "/hatırlat" ||
        lower === "/hatirlat"
    ){
        return {
            handled:true,
            response:
                "Örnek: yarın 20:00'de ders çalışmayı hatırlat."
        };
    }

    if(
        lower === "/dosya"
    ){
        fileButton.click();

        return {
            handled:true,
            response:
                "Dosya seçme ekranını açtım."
        };

    if(
        lower === "/ajan"
    ){
        return {
            handled:true,
            response:
                "Örnek: Ajan FM26 için genç Türk oyuncuları araştır ve 10 kişilik liste çıkar."
        };
    }

    if(
        lower === "/site"
    ){
        return {
            handled:true,
            response:
                "Örnek: siteyi aç YouTube"
        };
    }

    if(
        lower === "/panel"
    ){

        openPanel(

        return {

            ){

                        item.path,

            );

        const answer =
            normalizeAIResponse(
                response

        addMessage(
            answer,
            "aura",
            true

        saveHistoryItem(
            "aura",
            answer

        speakIfNeeded(
            answer,
            false
        );

        return answer;

            "Görsel analiz:",

async function executeSmartAction(
    text
){

    const result =
        await smartAICommand(
            text
        );

    if(!result){
        return {
            handled:false
        };
    }

    switch(
        result.action
    ){

        case "task":{

            const title =
                result.value ||
                text;

            addTask(title);

            return {
                handled:true,
                response:
                    `Görev oluşturuldu: ${title}`
            };
        }

        case "reminder":{

            const local =
                smartReminderCommand(text);

            if(local.handled){
                return local;
            }

            break;
        }

        case "website":{

            const value =
                result.value ||
                text;

            return {
                handled:true,
                response:
                    openWebsite(value)
            };
        }

        case "android_app":{

            const value =
                result.value ||
                text;

            if(
                openAndroidApp(value)
            ){

                return {
                    handled:true,
                    response:
                        `${value} uygulamasını açmayı deniyorum.`
                };
            }

            break;
        }

        case "agent":{

            const resultText =
                await runAgent(
                    result.value ||
                    text
                );

            return {
                handled:true,
                response:
                    resultText
            };
        }

        case "goal":{

            const goal =
                createGoal(
                    result.value ||
                    text
                );

            return {
                handled:true,
                response:
                    `Hedef oluşturuldu: ${goal.title}`
            };
        }

        case "profile":{

            addKnowledge(
                "Kullanıcı profili",
                result.value ||
                text
            );

            return {
                handled:true,
                response:
                    "Profil bilgisine ekledim."
            };
        }
    }

    return {
        handled:false
    };

function cleanSpeechText(
    text
){

    let result =
        String(text ?? "");

    try{

        result =
            result.replace(
                /[\p{Emoji_Presentation}\p{Extended_Pictographic}]/gu,
                " "
            );

    }catch{

        result =
            result.replace(
                /[\u{1F300}-\u{1FAFF}]/gu,
                " "
            );
    }

    return result
        .replace(
            /https?:\/\/\S+/gi,
            " "
        )
        .replace(
            /[`*_#~|<>{}\[\]]/g,
            " "
        )
        .replace(
            /[•●◆◇★☆✓✔→←↑↓]/g,
            " "
        )
        .replace(
            /\s+/g,
            " "
        )
        .trim();
}

function speak(
    text
){

    if(
        !("speechSynthesis" in window)
    ){
        return;
    }

    const clean =
        cleanSpeechText(text);

    if(!clean){
        return;
    }

    speechSynthesis.cancel();

    const utterance =
        new SpeechSynthesisUtterance(
            clean
        );

    utterance.lang =
        "tr-TR";

    utterance.rate =
        .92;

    utterance.pitch =
        1;

    utterance.volume =
        1;

    speechSynthesis.speak(
        utterance
    );
}

function speakIfNeeded(
    text,
    fromVoice
){

    if(
        fromVoice ||
        state.settings.autoSpeak
    ){
        speak(text);
    }
}<!-- AURA AI ULTIMATE - PART 13/13 -->

/* ================================
   MASTER MESSAGE
================================ */

async function sendMessage(
    fromVoice=false
){

    if(state.busy){
        return;
    }

    const text =
        cleanText(
            input.value
        );

    if(!text){
        return;
    }

    const shouldSpeak =
        Boolean(
            fromVoice ||
            state.voiceRequest
        );

    state.voiceRequest =
        false;

    addMessage(
        text,
        "user",
        true
    );

    input.value = "";

    state.busy = true;

    sendButton.disabled = true;
    micButton.disabled = true;
    fileButton.disabled = true;

    statusLine.textContent =
        "AURA DÜŞÜNÜYOR";

    try{

        /* 1 — özel yerel komut */

        let local =
            localCommand(text);

        if(
            local.handled &&
            local.response
        ){

            addMessage(
                local.response,
                "aura",
                true
            );

            speakIfNeeded(
                local.response,
                shouldSpeak
            );

            return;
        }

        /* 2 — kodlama ajanı */

        if(
            looksLikeCodeTask(text)
        ){

            const codeResult =
                await codeAgent(
                    text
                );

            addMessage(
                codeResult.response,
                "aura",
                true
            );

            speakIfNeeded(
                codeResult.response,
                shouldSpeak
            );

            return;
        }

        /* 3 — günlük plan */

        if(
            lowerTR(text).includes(
                "bugünü planla"
            ) ||
            lowerTR(text).includes(
                "bugunu planla"
            ) ||
            lowerTR(text).includes(
                "günümü planla"
            ) ||
            lowerTR(text).includes(
                "gunumu planla"
            )
        ){

            const plan =
                await createDailyPlan(
                    text
                );

            speakIfNeeded(
                plan,
                shouldSpeak
            );

            return;
        }

        /* 4 — açık ajan */

        if(
            isAgentRequest(text)
        ){

            const goal =
                text
                    .replace(
                        /^ajan\s+/i,
                        ""
                    );

            const result =
                await runAgent(
                    goal
                );

            addMessage(
                result,
                "aura",
                true
            );

            speakIfNeeded(
                result,
                shouldSpeak
            );

            return;
        }

        /* 5 — doğal cümleden işlem */

        const smart =
            await executeSmartAction(
                text
            );

        if(
            smart.handled &&
            smart.response
        ){

            addMessage(
                smart.response,
                "aura",
                true
            );

            speakIfNeeded(
                smart.response,
                shouldSpeak
            );

            return;
        }

        /* 6 — normal AI */

        const answer =
            await askAI(
                text,
                {
                    webSearch:
                        needsWebSearch(text)
                }
            );

        addMessage(
            answer,
            "aura",
            true
        );

        speakIfNeeded(
            answer,
            shouldSpeak
        );

    }catch(error){

        console.error(
            "AURA AI HATASI:",
            error
        );

        const message =
            "AI bağlantısında bir sorun oluştu. Biraz sonra tekrar dene.";

        addMessage(
            message,
            "aura",
            true
        );

        if(
            shouldSpeak
        ){
            speak(message);
        }

    }finally{

        state.busy = false;

        sendButton.disabled = false;
        micButton.disabled = false;
        fileButton.disabled = false;

        state.voiceRequest = false;

        statusLine.textContent = "";

        input.focus();

        updateDashboard();

        if(
            state.settings.conversationMode
        ){

            setTimeout(
                runConversationCycle,
                1200
            );
        }
    }
}

const Recognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;

if(Recognition){

    state.recognition =
        new Recognition();

    state.recognition.lang =
        "tr-TR";

    state.recognition.continuous =
        false;

    state.recognition.interimResults =
        false;

    state.recognition.onstart =
        ()=>{

            state.listening =
                true;

            micButton.classList.add(
                "listening"
            );

            micButton.textContent =
                "⏺";

            showToast(
                "Dinliyorum..."
            );

            updateDashboard();
        };

    state.recognition.onend =
        ()=>{

            state.listening =
                false;

            micButton.classList.remove(
                "listening"
            );

            micButton.textContent =
                "🎙";

            updateDashboard();

            if(
                state.settings.conversationMode &&
                state.voiceRequest
            ){

                setTimeout(
                    runConversationCycle,
                    700
                );
            }
        };

    state.recognition.onerror =
        error => {

            console.error(
                "Mikrofon:",
                error
            );

            state.listening =
                false;

            state.voiceRequest =
                false;

            micButton.classList.remove(
                "listening"
            );

            micButton.textContent =
                "🎙";

            showToast(
                "Mikrofon kullanılamadı."
            );

            updateDashboard();
        };

    state.recognition.onresult =
        event => {

            const result =
                event.results[0][0]
                    .transcript
                    .trim();

            if(!result){
                return;
            }

            state.voiceRequest =
                true;

            input.value =
                result;

            sendMessage(true);
        };
}

micButton.addEventListener(
    "click",
    ()=>{

        if(!state.recognition){

            showToast(
                "Bu tarayıcı sesli girişi desteklemiyor."
            );

            return;
        }

        try{

            if(
                state.listening
            ){

                state.recognition.stop();

            }else{

                state.voiceRequest = true;

                state.recognition.start();
            }

        }catch(error){

            console.error(
                error
            );
        }
    }
);

================================ */

chatPanel.addEventListener(
    "touchstart",
    event => {

        if(
            event.touches.length !== 1
        ){
            return;
        }

        state.touchStartY =
            event.touches[0]
                .clientY;

    },
    {
        passive:true
    }
);

chatPanel.addEventListener(
    "touchend",
    event => {

        if(
            state.touchStartY === null
        ){
            return;
        }

        const endY =
            event.changedTouches[0]
                .clientY;

        const distance =
            endY -
            state.touchStartY;

        if(
            distance > 70
        ){
            closeChatBox();
        }

        state.touchStartY =
            null;

    },
    {
        passive:true
    }
);

    showMemoryPanel,
    showTaskPanel,
    showProfilePanel,
    showAgentPanel
};

/* ================================
   INITIALIZATION
================================ */

function initializeAURA(){

    updateDashboard();

    resetVisibleChat();

    checkReminders();

    setInterval(
        checkReminders,
        5000
    );

    setInterval(
        updateDashboard,
        1500
    );

    window.addEventListener(
        "beforeunload",
        ()=>{
            saveEverything();
        }
    );

    setTimeout(
        ()=>{
            statusLine.textContent = "";
        },
        500
    );
}

initializeAURA();

</script>
</body>
