<!DOCTYPE html>
<html lang="tr">
<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no"
>

<meta
    name="theme-color"
    content="#010712"
>

<title>AURA AI</title>

<style>

*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,
body{
    width:100%;
    height:100%;
    margin:0;
}

body{
    overflow:hidden;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    color:#e9fbff;

    background:
        radial-gradient(
            circle at 50% 30%,
            #073b59 0%,
            #031d31 32%,
            #010b16 65%,
            #000207 100%
        );
}

.background-light{
    position:fixed;

    width:600px;
    height:600px;

    left:50%;
    top:50%;

    transform:
        translate(-50%,-50%);

    border-radius:50%;

    background:
        radial-gradient(
            circle,
            rgba(0,220,255,.12),
            rgba(0,100,220,.04) 45%,
            transparent 72%
        );

    filter:blur(12px);

    pointer-events:none;

    z-index:0;
}

.header{
    position:relative;

    width:100%;
    height:58px;

    display:flex;
    align-items:center;
    justify-content:space-between;

    padding:0 18px;

    z-index:30;

    background:
        rgba(0,5,12,.9);

    border-bottom:
        1px solid
        rgba(0,220,255,.25);

    backdrop-filter:blur(12px);
}

.logo{
    color:#00eaff;

    font-size:20px;
    font-weight:bold;

    letter-spacing:5px;

    text-shadow:
        0 0 10px #00eaff,
        0 0 25px rgba(0,220,255,.6);
}

.status{
    display:flex;
    align-items:center;

    gap:7px;

    color:#55ffcf;

    font-size:9px;

    letter-spacing:2px;
}

.status-dot{
    width:6px;
    height:6px;

    border-radius:50%;

    background:#55ffcf;

    box-shadow:
        0 0 8px #55ffcf,
        0 0 16px #55ffcf;
}

.main{
    position:relative;

    width:100%;

    height:
        calc(100dvh - 58px);

    overflow:hidden;
}

.core{
    position:absolute;

    width:230px;
    height:230px;

    left:50%;
    top:50%;

    transform:
        translate(-50%,-50%)
        scale(1.1);

    display:flex;
    align-items:center;
    justify-content:center;

    z-index:20;

    cursor:pointer;

    transition:
        top .5s
        cubic-bezier(.2,.8,.2,1),

        transform .5s
        cubic-bezier(.2,.8,.2,1);
}

.main.panel-open .core{
    top:95px;

    transform:
        translate(-50%,-50%)
        scale(.72);
}

.main.panel-closed .core{
    top:50%;

    transform:
        translate(-50%,-50%)
        scale(1.1);
}

.ring{
    position:absolute;

    border-radius:50%;

    border:
        1px solid
        rgba(0,225,255,.55);

    pointer-events:none;
}

.ring-one{
    width:158px;
    height:158px;

    border-left-color:transparent;
    border-right-color:transparent;

    animation:
        rotateOne 8s linear infinite;
}

.ring-two{
    width:195px;
    height:195px;

    border-top-color:transparent;
    border-bottom-color:transparent;

    animation:
        rotateTwo 11s linear infinite;
}

.core-glow{
    position:absolute;

    width:160px;
    height:160px;

    border-radius:50%;

    background:
        radial-gradient(
            circle,
            rgba(0,235,255,.28),
            rgba(0,120,220,.06) 50%,
            transparent 72%
        );

    filter:blur(10px);

    animation:
        glowPulse 3s ease-in-out infinite;
}

.sphere{
    position:relative;

    width:116px;
    height:116px;

    display:flex;
    align-items:center;
    justify-content:center;

    border-radius:50%;

    background:
        radial-gradient(
            circle at 32% 27%,
            #d5ffff 0%,
            #38eaff 8%,
            #0788a9 27%,
            #034866 48%,
            #012238 70%,
            #000a13 100%
        );

    border:
        2px solid
        rgba(125,250,255,.95);

    box-shadow:
        0 0 15px #00eaff,
        0 0 40px rgba(0,220,255,.7),
        0 0 75px rgba(0,100,255,.35),
        inset -16px -16px 27px rgba(0,0,0,.58),
        inset 10px 8px 18px rgba(180,255,255,.35);

    animation:
        spherePulse 2.7s ease-in-out infinite;

    z-index:5;
}

.core-name{
    color:#ecffff;

    font-size:17px;

    font-weight:bold;

    letter-spacing:4px;

    text-shadow:
        0 0 6px #fff,
        0 0 14px #00eaff,
        0 0 26px #008cff;
}

@keyframes spherePulse{

    0%,100%{
        transform:scale(1);
    }

    50%{
        transform:scale(1.07);
    }

}

@keyframes glowPulse{

    0%,100%{
        transform:scale(1);
        opacity:.6;
    }

    50%{
        transform:scale(1.15);
        opacity:1;
    }

}

@keyframes rotateOne{

    from{
        transform:rotate(0deg);
    }

    to{
        transform:rotate(360deg);
    }

}

@keyframes rotateTwo{

    from{
        transform:rotate(360deg);
    }

    to{
        transform:rotate(0deg);
    }

}.chat-panel{
    position:absolute;

    left:50%;
    bottom:0;

    width:min(94%,640px);

    height:
        calc(100% - 205px);

    transform:
        translateX(-50%);

    display:flex;
    flex-direction:column;

    z-index:10;

    background:
        rgba(1,12,23,.84);

    border:
        1px solid
        rgba(0,190,255,.25);

    border-bottom:0;

    border-radius:
        20px 20px 0 0;

    backdrop-filter:blur(14px);

    overflow:hidden;

    transition:
        height .45s ease,
        opacity .3s ease,
        transform .45s ease;
}

.main.panel-closed .chat-panel{

    height:0;

    opacity:0;

    transform:
        translateX(-50%)
        translateY(30px);

    pointer-events:none;
}

#chat{
    width:100%;
    height:100%;

    overflow-y:auto;

    padding:
        18px 12px 75px;

    scrollbar-width:thin;

    scrollbar-color:
        #008aae
        transparent;
}

#chat::-webkit-scrollbar{
    width:3px;
}

#chat::-webkit-scrollbar-thumb{
    background:#008aae;
    border-radius:10px;
}

.message{
    max-width:82%;

    padding:
        10px 13px;

    margin-bottom:10px;

    border-radius:12px;

    font-size:13px;

    line-height:1.45;

    white-space:pre-wrap;

    animation:
        messageIn .2s ease;
}

@keyframes messageIn{

    from{
        opacity:0;
        transform:translateY(7px);
    }

    to{
        opacity:1;
        transform:translateY(0);
    }

}

.message.aura{
    margin-left:0;
    margin-right:auto;

    color:#ddfaff;

    background:
        linear-gradient(
            135deg,
            rgba(3,59,79,.86),
            rgba(1,24,39,.92)
        );

    border-left:
        2px solid
        #00eaff;

    border-top-left-radius:3px;
}

.message.user{
    margin-left:auto;
    margin-right:0;

    color:#fff;

    background:
        linear-gradient(
            135deg,
            rgba(8,94,127,.94),
            rgba(3,48,77,.96)
        );

    border-right:
        2px solid
        #55ffcf;

    border-top-right-radius:3px;
}

.bottom{
    position:absolute;

    left:50%;
    bottom:0;

    width:min(94%,640px);

    transform:
        translateX(-50%);

    padding:
        9px 8px 10px;

    z-index:15;

    background:
        linear-gradient(
            180deg,
            #041d31,
            #020d1b
        );

    border:
        1px solid
        rgba(0,190,255,.25);

    border-radius:
        0 0 20px 20px;

    transition:
        transform .45s ease,
        opacity .3s ease;
}

.main.panel-closed .bottom{

    transform:
        translate(-50%,120px);

    opacity:0;

    pointer-events:none;
}

.composer{
    height:48px;

    display:flex;
    align-items:center;

    gap:7px;

    padding:
        4px 5px 4px 13px;

    border-radius:14px;

    background:#041b2d;

    border:
        1px solid
        rgba(0,190,255,.34);

    box-shadow:
        inset 0 0 15px
        rgba(0,100,160,.08);
}

.composer:focus-within{

    border-color:
        rgba(0,225,255,.75);

    box-shadow:
        0 0 18px
        rgba(0,180,255,.14);
}

#input{
    flex:1;

    min-width:0;

    height:100%;

    border:0;
    outline:0;

    background:transparent;

    color:#fff;

    font-size:13px;
}

#input::placeholder{
    color:#54798a;
}

.button{
    width:40px;
    height:40px;

    flex-shrink:0;

    border:0;

    border-radius:11px;

    cursor:pointer;

    color:#00eaff;

    background:#062b43;

    font-size:16px;
}

.button:active{
    transform:scale(.9);
}

.button:disabled{
    opacity:.45;
}

.send{
    color:#001923;

    background:
        linear-gradient(
            135deg,
            #00eaff,
            #55ffcf
        );

    box-shadow:
        0 0 15px
        rgba(0,220,255,.25);
}

@media(max-width:500px){

    .main.panel-open .core{
        top:88px;

        transform:
            translate(-50%,-50%)
            scale(.66);
    }

    .main.panel-closed .core{
        transform:
            translate(-50%,-50%)
            scale(1.06);
    }

    .chat-panel,
    .bottom{
        width:96%;
    }

    .message{
        max-width:88%;
    }

}

</style>

</head>

<body>

<div class="background-light"></div>

<div class="header">

    <div class="logo">
        AURA
    </div>

    <div class="status">

        <span class="status-dot"></span>

        SYSTEM ONLINE

    </div>

</div>

<div
    class="main panel-closed"
    id="main"
>

    <div
        class="core"
        id="core"
    >

        <div class="ring ring-one"></div>

        <div class="ring ring-two"></div>

        <div class="core-glow"></div>

        <div class="sphere">

            <div class="core-name">
                AURA
            </div>

        </div>

    </div>

    <div
        class="chat-panel"
        id="chatPanel"
    >

        <div id="chat">

            <div class="message aura">
                Selam Bedirhan, sistem hazır. Seni dinliyorum.
            </div>

        </div>

    </div>

    <div
        class="bottom"
        id="bottom"
    >

        <div class="composer">

            <input
                id="input"
                type="text"
                autocomplete="off"
                placeholder="AURA'ya mesaj yaz..."
            >

            <button
                class="button"
                id="mic"
                type="button"
            >🎙</button>

            <button
                class="button send"
                id="send"
                type="button"
            >➤</button>

        </div>

    </div>

</div>

<script src="https://js.puter.com/v2/"></script>

<script>const main =
    document.getElementById("main");

const core =
    document.getElementById("core");

const input =
    document.getElementById("input");

const send =
    document.getElementById("send");

const mic =
    document.getElementById("mic");

const chat =
    document.getElementById("chat");


const USER_NAME =
    "Bedirhan Kahraman";

const GIRLFRIEND_NAME =
    "Edanur";


const MEMORY_KEY =
    "AURA_MEMORY_V7";

const TASK_KEY =
    "AURA_TASKS_V7";

const REMINDER_KEY =
    "AURA_REMINDERS_V7";

const HISTORY_KEY =
    "AURA_HISTORY_V7";


function emptyMemory(){

    return {
        facts:[],
        preferences:[],
        notes:[],
        knowledge:[]
    };

}


function loadData(
    key,
    fallback
){

    try{

        const value =
            localStorage.getItem(key);

        if(!value){
            return fallback;
        }

        return JSON.parse(value);

    }catch(error){

        console.error(
            "Veri okunamadı:",
            error
        );

        return fallback;
    }

}


let memory =
    loadData(
        MEMORY_KEY,
        emptyMemory()
    );

let tasks =
    loadData(
        TASK_KEY,
        []
    );

let reminders =
    loadData(
        REMINDER_KEY,
        []
    );

let history =
    loadData(
        HISTORY_KEY,
        []
    );


function saveData(){

    try{

        localStorage.setItem(
            MEMORY_KEY,
            JSON.stringify(memory)
        );

        localStorage.setItem(
            TASK_KEY,
            JSON.stringify(tasks)
        );

        localStorage.setItem(
            REMINDER_KEY,
            JSON.stringify(reminders)
        );

        localStorage.setItem(
            HISTORY_KEY,
            JSON.stringify(
                history.slice(-50)
            )
        );

    }catch(error){

        console.error(
            "Kayıt hatası:",
            error
        );

    }

}


function addMemory(
    type,
    text
){

    if(
        !Array.isArray(
            memory[type]
        )
    ){

        memory[type] = [];

    }

    memory[type].push({

        text:text,

        date:
            new Date()
            .toLocaleString("tr-TR")

    });

    saveData();

}


function getMemoryText(){

    let output = "";


    if(memory.facts.length){

        output +=
            "Kayıtlı bilgiler:\n";

        memory.facts.forEach(
            item => {

                output +=
                    "- " +
                    item.text +
                    "\n";

            }
        );

    }


    if(memory.preferences.length){

        output +=
            "\nTercihler:\n";

        memory.preferences.forEach(
            item => {

                output +=
                    "- " +
                    item.text +
                    "\n";

            }
        );

    }


    if(memory.notes.length){

        output +=
            "\nNotlar:\n";

        memory.notes.forEach(
            item => {

                output +=
                    "- " +
                    item.text +
                    "\n";

            }
        );

    }


    if(memory.knowledge.length){

        output +=
            "\nBilgi tabanı:\n";

        memory.knowledge.forEach(
            item => {

                output +=
                    "- " +
                    item.text +
                    "\n";

            }
        );

    }


    return output.trim() ||
        "Henüz özel hafıza kaydı yok.";

}


function buildSystemPrompt(){

    return `
Sen AURA adında kişisel yapay zeka asistanısın.

Türkçe konuş.

Kullanıcının adı:
Bedirhan Kahraman.

Kullanıcının sevgilisi:
Edanur.

Edanur AURA'nın sevgilisi değildir.
Edanur, Bedirhan'ın sevgilisidir.

Doğal konuş.
Gereksiz tekrar yapma.
Bilmediğin bilgileri uydurma.

Kendini AURA olarak tanıt.

Kalıcı hafıza:

${getMemoryText()}

Görevler:

${
    tasks.length
    ? tasks.map(
        (task,index) =>
        `${index+1}. ${task.text} ${
            task.done
            ? "[TAMAMLANDI]"
            : "[BEKLİYOR]"
        }`
      ).join("\n")
    : "Görev yok."
}
`;

}function addMessage(
    text,
    type
){

    const element =
        document.createElement(
            "div"
        );

    element.className =
        "message " + type;

    element.textContent =
        String(text);

    chat.appendChild(
        element
    );

    chat.scrollTop =
        chat.scrollHeight;

}


function memoryCommand(text){

    const lower =
        text
        .toLocaleLowerCase("tr-TR")
        .trim();


    const prefixes = [

        "not al ",
        "not kaydet ",
        "bunu not al ",
        "bunu kaydet ",
        "hafızana kaydet ",
        "hafizana kaydet ",
        "bunu hatırla ",
        "bunu hatirla ",
        "bunu hafızana al ",
        "bunu hafizana al ",
        "bunu unutma "

    ];


    for(
        const prefix of prefixes
    ){

        if(
            lower.startsWith(prefix)
        ){

            const value =
                text
                .substring(prefix.length)
                .trim();


            if(!value){

                return {
                    handled:true,
                    response:
                        "Kaydedilecek bilgiyi belirt."
                };

            }


            const isNote =
                prefix.includes("not");


            addMemory(
                isNote
                ? "notes"
                : "facts",
                value
            );


            return {
                handled:true,
                response:
                    "Bilgi kalıcı hafızaya kaydedildi."
            };

        }

    }


    if(
        lower === "hafızamda ne var" ||
        lower === "hafizamda ne var" ||
        lower === "neyi hatırlıyorsun" ||
        lower === "neyi hatirliyorsun"
    ){

        return {
            handled:true,
            response:getMemoryText()
        };

    }


    if(
        lower === "hafızayı temizle" ||
        lower === "hafizayi temizle" ||
        lower === "hafızanı temizle" ||
        lower === "hafizani temizle"
    ){

        memory =
            emptyMemory();

        saveData();

        return {
            handled:true,
            response:
                "AURA hafızası temizlendi."
        };

    }


    return {
        handled:false
    };

}


function knowledgeCommand(text){

    const lower =
        text
        .toLocaleLowerCase("tr-TR")
        .trim();


    const prefixes = [

        "bilgi ekle ",
        "bilgiyi kaydet ",
        "auraya bilgi ekle ",
        "aura'ya bilgi ekle ",
        "auraya öğret ",
        "aura'ya öğret "

    ];


    for(
        const prefix of prefixes
    ){

        if(
            lower.startsWith(prefix)
        ){

            const value =
                text
                .substring(prefix.length)
                .trim();


            if(!value){

                return {
                    handled:true,
                    response:
                        "Eklenecek bilgiyi belirt."
                };

            }


            memory.knowledge.push({

                text:value,

                date:
                    new Date()
                    .toLocaleString("tr-TR")

            });


            saveData();


            return {
                handled:true,
                response:
                    "Bilgi tabanına kaydedildi."
            };

        }

    }


    return {
        handled:false
    };

}


function taskCommand(text){

    const lower =
        text
        .toLocaleLowerCase("tr-TR")
        .trim();


    const prefixes = [
        "görev ekle ",
        "gorev ekle ",
        "yapılacak ekle ",
        "yapilacak ekle "
    ];


    for(
        const prefix of prefixes
    ){

        if(
            lower.startsWith(prefix)
        ){

            const value =
                text
                .substring(prefix.length)
                .trim();


            if(!value){

                return {
                    handled:true,
                    response:
                        "Eklenecek görevi belirt."
                };

            }


            tasks.push({

                id:Date.now(),

                text:value,

                done:false,

                created:
                    new Date()
                    .toLocaleString("tr-TR")

            });


            saveData();


            return {
                handled:true,
                response:
                    "Görev listeye eklendi."
            };

        }

    }


    if(
        lower === "görevlerim" ||
        lower === "gorevlerim" ||
        lower === "görev listesi" ||
        lower === "gorev listesi"
    ){

        if(!tasks.length){

            return {
                handled:true,
                response:
                    "Görev listen boş."
            };

        }


        return {
            handled:true,
            response:
                tasks
                .map(
                    (task,index) =>
                    `${index+1}. ${
                        task.done
                        ? "Tamamlandı"
                        : "Bekliyor"
                    } - ${task.text}`
                )
                .join("\n")
        };

    }


    if(
        lower.startsWith(
            "görevi tamamla "
        ) ||
        lower.startsWith(
            "gorevi tamamla "
        )
    ){

        const number =
            parseInt(
                text
                .replace(
                    /^görevi tamamla\s*/i,
                    ""
                )
                .replace(
                    /^gorevi tamamla\s*/i,
                    ""
                )
            );


        const index =
            number - 1;


        if(tasks[index]){

            tasks[index].done =
                true;

            saveData();


            return {
                handled:true,
                response:
                    "Görev tamamlandı."
            };

        }


        return {
            handled:true,
            response:
                "Bu numarada görev bulunamadı."
        };

    }


    return {
        handled:false
    };

}function dateTimeCommand(text){

    const lower =
        text
        .toLocaleLowerCase("tr-TR")
        .trim();


    if(
        lower.includes("saat kaç") ||
        lower.includes("saat kac")
    ){

        return {
            handled:true,
            response:
                "Şu an saat " +
                new Date()
                .toLocaleTimeString(
                    "tr-TR",
                    {
                        hour:"2-digit",
                        minute:"2-digit"
                    }
                ) +
                "."
        };

    }


    if(
        lower.includes("bugün tarih") ||
        lower.includes("bugun tarih")
    ){

        return {
            handled:true,
            response:
                "Bugünün tarihi " +
                new Date()
                .toLocaleDateString(
                    "tr-TR",
                    {
                        day:"2-digit",
                        month:"long",
                        year:"numeric"
                    }
                ) +
                "."
        };

    }


    return {
        handled:false
    };

}


function calculateCommand(text){

    const lower =
        text
        .toLocaleLowerCase("tr-TR")
        .trim();


    const prefixes = [
        "hesapla ",
        "hesap ",
        "kaç eder ",
        "kac eder "
    ];


    let expression = null;


    for(
        const prefix of prefixes
    ){

        if(
            lower.startsWith(prefix)
        ){

            expression =
                text
                .substring(prefix.length)
                .trim();

            break;

        }

    }


    if(!expression){

        return {
            handled:false
        };

    }


    expression =
        expression
        .replace(/,/g,".")
        .replace(/×/g,"*")
        .replace(/÷/g,"/")
        .replace(
            /[^0-9+\-*/().%\s]/g,
            ""
        );


    try{

        const result =
            Function(
                '"use strict";return (' +
                expression +
                ')'
            )();


        return {
            handled:true,
            response:
                "Sonuç: " +
                result
        };

    }catch(error){

        return {
            handled:true,
            response:
                "Bu işlemi hesaplayamadım."
        };

    }

}


function jokeCommand(text){

    const lower =
        text
        .toLocaleLowerCase("tr-TR");


    if(
        !lower.includes("şaka") &&
        !lower.includes("saka")
    ){

        return {
            handled:false
        };

    }


    const jokes = [

        "Bilgisayar neden doktora gitmiş? Virüs kapmış.",

        "Programcı neden kahve içmiş? Java'sı bitmiş.",

        "Telefon neden gözlük takmış? Ekranı göremiyormuş.",

        "İnternet neden yorulmuş? Çok fazla bağlantısı varmış."

    ];


    return {
        handled:true,
        response:
            jokes[
                Math.floor(
                    Math.random() *
                    jokes.length
                )
            ]
    };

}


function identityCommand(text){

    const lower =
        text
        .toLocaleLowerCase("tr-TR")
        .trim();


    if(
        lower === "ben kimim"
    ){

        return {
            handled:true,
            response:
                "Sen Bedirhan Kahraman'sın."
        };

    }


    if(
        lower.includes("sevgilim kim") ||
        lower.includes("sevgilimin adı ne") ||
        lower.includes("sevgilimin adi ne")
    ){

        return {
            handled:true,
            response:
                "Sevgilinin adı Edanur."
        };

    }


    if(
        lower === "sen kimsin"
    ){

        return {
            handled:true,
            response:
                "Ben AURA. Senin kişisel yapay zeka asistanınım."
        };

    }


    return {
        handled:false
    };

}


function systemCommand(text){

    const lower =
        text
        .toLocaleLowerCase("tr-TR")
        .trim();


    if(
        lower === "sistem durumu"
    ){

        return {

`AURA özellikleri:

AI sohbeti
Kalıcı hafıza
Bilgi tabanı
Görev listesi
Hatırlatıcı
Dosya okuma
Sesli giriş
Sesli cevap
Konuşma geçmişi
Tarih ve saat
Hesaplama
Şaka
Ajan sistemi`
        };

    }


    return {
        handled:false
    };

}/* =========================
   AI CEVAP METNİ
========================= */

function extractAIText(response){

    if(!response){
        return "";
    }


    if(
        response.message &&
        typeof response.message.content ===
        "string"
    ){

        return response.message.content.trim();

    }


    if(
        response.message &&
        Array.isArray(
            response.message.content
        )
    ){

        return response.message.content
            .map(part => {

                if(
                    typeof part === "string"
                ){

                    return part;

                }

                if(
                    part &&
                    typeof part.text ===
                    "string"
                ){

                    return part.text;

                }

                return "";

            })
            .join("")
            .trim();

    }


    if(
        typeof response.text === "string"
    ){

        return response.text.trim();

    }


    if(
        typeof response.content === "string"
    ){

        return response.content.trim();

    }


    return "";

}


/* =========================
   AI
========================= */

async function askAI(text){

    if(
        typeof puter === "undefined"
    ){

        throw new Error(
            "Puter yüklenmedi."
        );

    }


    if(
        !puter.ai ||
        typeof puter.ai.chat !==
        "function"
    ){

        throw new Error(
            "Puter AI bulunamadı."
        );

    }


    const messages = [

        {
            role:"system",
            content:
                buildSystemPrompt()
        }

    ];


    history
        .slice(-12)
        .forEach(item => {

            if(
                item &&
                typeof item.user ===
                "string"
            ){

                messages.push({
                    role:"user",
                    content:item.user
                });

            }


            if(
                item &&
                typeof item.aura ===
                "string"
            ){

                messages.push({
                    role:"assistant",
                    content:item.aura
                });

            }

        });


    messages.push({

        role:"user",

        content:String(text)

    });


    const response =
        await puter.ai.chat(
            messages
        );


    const answer =
        extractAIText(
            response
        );


    if(!answer){

        throw new Error(
            "AI boş cevap verdi."
        );

    }


    saveConversation(
        text,
        answer
    );


    return answer;

}


/* =========================
   HAFIZA GEÇMİŞİ
========================= */

function saveConversation(
    user,
    aura
){

    history.push({

        user:String(user),

        aura:String(aura),

        date:
            new Date()
            .toLocaleString("tr-TR")

    });


    if(
        history.length > 50
    ){

        history =
            history.slice(-50);

    }


    saveData();

}


/* =========================
   SADECE SESLİ MESAJDAN
   SONRA KONUŞ
========================= */

let selectedVoice =
    null;


function loadVoices(){

    if(
        !("speechSynthesis" in window)
    ){

        return;

    }


    const voices =
        speechSynthesis
        .getVoices();


    selectedVoice =
        voices.find(
            voice =>
                voice.lang
                .toLowerCase()
                .startsWith("tr")
        ) ||

        voices.find(
            voice =>
                voice.lang
                .toLowerCase()
                .includes("tr-tr")
        ) ||

        voices[0] ||

        null;

}


if(
    "speechSynthesis" in window
){

    speechSynthesis.onvoiceschanged =
        loadVoices;

    loadVoices();

}


/* =========================
   EMOJİLERİ TEMİZLE
========================= */

function cleanSpeechText(
    text
){

    let clean =
        String(text);


    /*
     * Emoji ve pictographic
     * karakterleri kaldır.
     */

    try{

        clean =
            clean.replace(
                /[\p{Emoji_Presentation}\p{Extended_Pictographic}]/gu,
                " "
            );

    }catch(error){

        /*
         * Eski tarayıcılar için
         * yedek temizleme.
         */

        clean =
            clean.replace(
                /[\u{1F300}-\u{1FAFF}]/gu,
                " "
            );

    }


    clean =
        clean

        .replace(
            /https?:\/\/\S+/gi,
            " "
        )

        .replace(
            /[`*_#~]/g,
            " "
        )

        .replace(
            /[()[\]{}<>]/g,
            " "
        )

        .replace(
            /[•●◆◇★☆✓✔✕×→←↑↓]/g,
            " "
        )

        .replace(
            /\s+/g,
            " "
        )

        .trim();


    return clean;

}


/* =========================
   SESLENDİR
========================= */

function speak(text){

    if(
        !("speechSynthesis" in window)
    ){

        return;

    }


    const clean =
        cleanSpeechText(text);


    if(!clean){

        return;

    }


    speechSynthesis.cancel();


    const utterance =
        new SpeechSynthesisUtterance(
            clean
        );


    utterance.lang =
        "tr-TR";


    if(selectedVoice){

        utterance.voice =
            selectedVoice;

    }


    utterance.rate =
        .92;

    utterance.pitch =
        1;

    utterance.volume =
        1;


    speechSynthesis.speak(
        utterance
    );

}/* =========================
   YEREL KOMUTLAR
========================= */

async function localCommand(
    text
){

    const handlers = [

        memoryCommand,

        knowledgeCommand,

        taskCommand,

        dateTimeCommand,

        calculateCommand,

        jokeCommand,

        identityCommand,

        systemCommand

    ];


    for(
        const handler of handlers
    ){

        try{

            const result =
                await handler(text);


            if(
                result &&
                result.handled
            ){

                return result.response;

            }

        }catch(error){

            console.error(
                "Komut hatası:",
                error
            );

        }

    }


    return null;

}


/* =========================
   SESLİ GİRİŞ
========================= */

let recognition =
    null;

let listening =
    false;


/*
 * Bu değişken çok önemli.
 *
 * false = yazılı mesaj
 * true  = mikrofon mesajı
 */

let currentVoiceMessage =
    false;


function setupRecognition(){

    const SpeechRecognition =
        window.SpeechRecognition ||
        window.webkitSpeechRecognition;


    if(!SpeechRecognition){

        return false;

    }


    recognition =
        new SpeechRecognition();


    recognition.lang =
        "tr-TR";


    recognition.continuous =
        false;


    recognition.interimResults =
        false;


    recognition.maxAlternatives =
        1;


    recognition.onstart =
        function(){

            listening =
                true;

            mic.textContent =
                "■";

            mic.style.color =
                "#ff6075";

        };


    recognition.onend =
        function(){

            listening =
                false;

            mic.textContent =
                "🎙";

            mic.style.color =
                "";

        };


    recognition.onerror =
        function(error){

            console.error(
                "Ses tanıma hatası:",
                error
            );

            listening =
                false;

            currentVoiceMessage =
                false;

            mic.textContent =
                "🎙";

            mic.style.color =
                "";

        };


    recognition.onresult =
        function(event){

            const result =
                event
                .results[0][0]
                .transcript;


            input.value =
                result;


            /*
             * Bu mesaj mikrofonla
             * geldiği için AI cevabı
             * sesli okunacak.
             */

            sendMessage(true);

        };


    return true;

}


const speechReady =
    setupRecognition();


/* =========================
   MİKROFON
========================= */

mic.addEventListener(
    "click",
    function(){

        if(!speechReady){

            addMessage(
                "Bu tarayıcı sesli girişi desteklemiyor.",
                "aura"
            );

            return;

        }


        try{

            if(listening){

                recognition.stop();

            }else{

                currentVoiceMessage =
                    true;

                recognition.start();

            }

        }catch(error){

            console.error(
                "Mikrofon hatası:",
                error
            );

            currentVoiceMessage =
                false;

        }

    }
);


/* =========================
   MESAJ GÖNDER
========================= */

let sending =
    false;


async function sendMessage(
    voiceMessage = false
){

    if(sending){

        return;

    }


    const text =
        input.value.trim();


    if(!text){

        return;

    }


    sending =
        true;


    input.value =
        "";


    addMessage(
        text,
        "user"
    );


    send.disabled =
        true;

    mic.disabled =
        true;


    try{

        const local =
            await localCommand(
                text
            );


        if(
            local !== null
        ){

            addMessage(
                local,
                "aura"
            );


            /*
             * Sadece mikrofonla
             * gelen mesajda konuş.
             */

            if(
                voiceMessage === true
            ){

                speak(local);

            }


            return;

        }


        const answer =
            await askAI(
                text
            );


        addMessage(
            answer,
            "aura"
        );


        /*
         * YAZILI MESAJDA:
         * speak() ÇAĞRILMIYOR.
         *
         * MİKROFON MESAJINDA:
         * speak() ÇAĞRILIYOR.
         */

        if(
            voiceMessage === true
        ){

            speak(answer);

        }


    }catch(error){

        console.error(
            "AURA AI HATASI:",
            error
        );


        addMessage(
            "AI bağlantısında bir sorun oluştu. Tekrar deneyebilirsin.",
            "aura"
        );


    }finally{

        sending =
            false;

        send.disabled =
            false;

        mic.disabled =
            false;

        currentVoiceMessage =
            false;

        input.focus();

    }

}


/* =========================
   GÖNDER BUTONU
========================= */

send.addEventListener(
    "click",
    function(){

        /*
         * Butondan gönderilen
         * mesaj kesinlikle yazılıdır.
         */

        sendMessage(false);

    }
);


/* =========================
   ENTER
========================= */

input.addEventListener(
    "keydown",
    function(event){

        if(
            event.key === "Enter"
        ){

            event.preventDefault();

            /*
             * Enter ile gönderilen
             * mesaj da yazılıdır.
             */

            sendMessage(false);

        }

    }
);


/* =========================
   ÇEKİRDEK
========================= */

let panelOpen =
    false;


function openPanel(){

    panelOpen =
        true;

    main.classList.remove(
        "panel-closed"
    );

    main.classList.add(
        "panel-open"
    );

}


function closePanel(){

    panelOpen =
        false;

    main.classList.remove(
        "panel-open"
    );

    main.classList.add(
        "panel-closed"
    );

}


core.addEventListener(
    "click",
    function(){

        if(panelOpen){

            closePanel();

        }else{

            openPanel();

        }

    }
);


/* =========================
   SÜRÜKLEME
========================= */

let startY =
    null;


main.addEventListener(
    "touchstart",
    function(event){

        if(
            event.touches.length !== 1
        ){

            return;

        }


        startY =
            event.touches[0].clientY;

    },
    {
        passive:true
    }
);


main.addEventListener(
    "touchend",
    function(event){

        if(
            startY === null
        ){

            return;

        }


        const endY =
            event.changedTouches[0].clientY;


        const difference =
            endY - startY;


        if(
            difference < -60
        ){

            openPanel();

        }


        if(
            difference > 60
        ){

            closePanel();

        }


        startY =
            null;

    },
    {
        passive:true
    }
);


/* =========================
   BAŞLAT
========================= */

function initializeAura(){

    closePanel();

    loadVoices();

    chat.scrollTop =
        chat.scrollHeight;

}


window.addEventListener(
    "beforeunload",
    function(){

        saveData();

    }
);


window.addEventListener(
    "error",
    function(event){

        console.error(
            "AURA sistem hatası:",
            event.error ||
            event.message
        );

    }
);


window.addEventListener(
    "unhandledrejection",
    function(event){

        console.error(
            "AURA Promise hatası:",
            event.reason
        );

    }
);


initializeAura();
