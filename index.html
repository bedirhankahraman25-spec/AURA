<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">

      content="width=device-width,
               initial-scale=1,

               user-scalable=no">

<meta name="theme-color" content="#02050b">

<title>AURA</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    -webkit-tap-highlight-color:transparent;
}

html,
body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#02050b;
    color:#e9fbff;
    font-family:
        Arial,
        Helvetica,
        sans-serif;
}

body{
    user-select:none;
}

button,
input,
textarea{
    font-family:inherit;
}

button{
    border:none;
    outline:none;
}

#app{
    position:relative;
    width:100%;
    height:100%;
    overflow:hidden;
    background:
        radial-gradient(
            circle at 50% 50%,
            rgba(0,220,255,.08),
            transparent 28%
        ),
        radial-gradient(
            circle at 50% 50%,
            rgba(0,120,255,.04),
            transparent 52%
        ),
        #02050b;
}

.grid-bg{
    position:absolute;
    inset:0;
    pointer-events:none;
    opacity:.13;
    background-image:
        linear-gradient(
            rgba(0,220,255,.07) 1px,
            transparent 1px
        ),
        linear-gradient(
            90deg,
            rgba(0,220,255,.07) 1px,
            transparent 1px
        );

}

.vignette{
    position:absolute;
    inset:0;
    pointer-events:none;

        radial-gradient(

</style><style>

#mainScreen{
    position:absolute;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    z-index:5;
}

.core-area{
    position:relative;
    width:100%;
    height:100%;
    display:flex;
    align-items:center;
    justify-content:center;
}

.aura-core{
    position:relative;
    width:min(58vw,280px);
    height:min(58vw,280px);
    max-width:280px;
    max-height:280px;
    min-width:190px;
    min-height:190px;

    border-radius:50%;

    display:flex;
    align-items:center;
    justify-content:center;

    cursor:pointer;

    isolation:isolate;

    transition:
        transform .35s ease,
        filter .35s ease;
}

.aura-core:active{
    transform:scale(.94);
}

.core-glow{
    position:absolute;
    inset:10%;
    border-radius:50%;

    background:
        radial-gradient(
            circle,
            rgba(0,240,255,.95) 0%,
            rgba(0,170,255,.72) 22%,
            rgba(0,85,255,.38) 45%,
            rgba(0,0,0,0) 72%
        );

    filter:
        blur(9px);

    opacity:.92;

    z-index:-1;

    animation:
        corePulse 3.2s ease-in-out infinite;
}

.core-inner{
    position:absolute;
    inset:22%;
    border-radius:50%;

    background:
        radial-gradient(
            circle at 45% 35%,
            #eaffff 0%,
            #7af4ff 8%,
            #00d9ff 22%,
            #0077ff 50%,
            #021d46 78%,
            #010812 100%
        );

    box-shadow:
        inset 0 0 24px rgba(255,255,255,.42),
        inset 0 0 65px rgba(0,220,255,.45),
        0 0 20px rgba(0,220,255,.82),
        0 0 70px rgba(0,150,255,.42);

    overflow:hidden;
}

.core-inner::before{
    content:"";
    position:absolute;
    inset:-40%;
    border-radius:50%;

    background:
        conic-gradient(
            from 0deg,
            transparent,
            rgba(255,255,255,.26),
            transparent 18%,
            transparent 55%,
            rgba(0,255,255,.20),
            transparent 75%
        );

    animation:
        rotateCore 4.5s linear infinite;
}

.core-inner::after{
    content:"";
    position:absolute;
    width:34%;
    height:34%;
    left:18%;
    top:13%;
    border-radius:50%;

    background:
        radial-gradient(
            circle,
            rgba(255,255,255,.85),
            rgba(255,255,255,.18) 42%,
            transparent 72%
        );

    filter:blur(2px);
}

</style><style>

.core-ring{
    position:absolute;
    border-radius:50%;
    pointer-events:none;
}

.ring-1{
    inset:5%;
    border:
        1px solid rgba(0,235,255,.56);

    box-shadow:
        0 0 12px rgba(0,220,255,.24);

    animation:
        ringRotateA 12s linear infinite;
}

.ring-2{
    inset:-2%;
    border:
        1px dashed rgba(0,180,255,.30);

    animation:
        ringRotateB 18s linear infinite;
}

.ring-3{
    inset:12%;
    border:
        1px solid rgba(130,230,255,.18);

    box-shadow:
        inset 0 0 16px rgba(0,220,255,.15);

    animation:
        ringPulse 2.8s ease-in-out infinite;
}

.core-label{
    position:absolute;
    z-index:8;

    color:#eaffff;

    font-size:
        clamp(22px,7vw,38px);

    font-weight:800;

    letter-spacing:
        clamp(5px,2vw,10px);

    text-shadow:
        0 0 7px rgba(255,255,255,.82),
        0 0 25px rgba(0,220,255,.95),
        0 0 45px rgba(0,150,255,.7);

    transform:translateX(4px);
}

.core-status{
    position:absolute;
    bottom:-48px;
    left:50%;

    transform:
        translateX(-50%);

    color:
        rgba(175,240,255,.55);

    font-size:10px;
    letter-spacing:3px;

    text-transform:uppercase;

    white-space:nowrap;

    transition:
        color .3s ease,
        text-shadow .3s ease;
}

.aura-core.processing
.core-status{
    color:#51efff;
    text-shadow:0 0 15px #00dfff;
}

.aura-core.listening
.core-status{
    color:#8dffbd;
    text-shadow:0 0 15px #32ff8b;
}

.aura-core.speaking
.core-status{
    color:#b3b8ff;
    text-shadow:0 0 15px #5764ff;
}

.aura-core.processing
.core-glow{
    animation:
        processingPulse .75s ease-in-out infinite;
}

.aura-core.listening
.core-glow{
    filter:blur(6px);
    animation:
        listeningPulse .9s ease-in-out infinite;
}

.aura-core.speaking
.core-glow{
    animation:
        speakingPulse .45s ease-in-out infinite;
}

</style><style>

@keyframes corePulse{
    0%,100%{
        transform:scale(.96);
        opacity:.75;
    }

    50%{
        transform:scale(1.08);
        opacity:1;
    }
}

@keyframes processingPulse{
    0%,100%{
        transform:scale(.92);
        opacity:.65;
    }

    50%{
        transform:scale(1.15);
        opacity:1;
    }
}

@keyframes listeningPulse{
    0%,100%{
        transform:scale(.9);
        opacity:.64;
    }

    50%{
        transform:scale(1.16);
        opacity:1;
    }
}

@keyframes speakingPulse{
    0%,100%{
        transform:scale(.95);
        opacity:.76;
    }

    50%{
        transform:scale(1.2);
        opacity:1;
    }
}

@keyframes rotateCore{
    from{
        transform:rotate(0deg);
    }

    to{
        transform:rotate(360deg);
    }
}

@keyframes ringRotateA{
    from{
        transform:rotate(0deg);
    }

    to{
        transform:rotate(360deg);
    }
}

@keyframes ringRotateB{
    from{
        transform:rotate(360deg);
    }

    to{
        transform:rotate(0deg);
    }
}

@keyframes ringPulse{
    0%,100%{
        transform:scale(.98);
        opacity:.45;
    }

    50%{
        transform:scale(1.05);
        opacity:1;
    }
}

<body>

<div id="app">

    <div class="grid-bg"></div>

    <div class="vignette"></div>

    <main id="mainScreen">

        <section class="core-area">

            <div
                id="auraCore"
                class="aura-core"
                role="button"
                aria-label="AURA sohbetini aç"
                tabindex="0"
            >

                <div class="core-ring ring-1"></div>
                <div class="core-ring ring-2"></div>
                <div class="core-ring ring-3"></div>

                <div class="core-glow"></div>

                </div>

                    id="coreStatus"
                    class="core-status"

                </div>

            </div>

        </section>

    </main>

    <div
        id="chatOverlay"
        aria-hidden="true"
    >

        <section
            id="chatPanel"
            role="dialog"
            aria-modal="true"
            aria-label="AURA sohbet"
        >

            <div class="chat-top">

                    <div class="chat-title-text">

                    type="button"

                <div class="input-row">                    <textarea
                        id="userInput"
                        rows="1"
                        autocomplete="off"
                        autocapitalize="sentences"
                        placeholder="AURA'ya bir şey söyle..."
                    ></textarea>

                    <button
                        id="micBtn"
                        class="action-btn mic-btn"
                        type="button"
                        aria-label="Mikrofon"
                    >
                        ◉
                    </button>

                    <button
                        id="sendBtn"
                        class="action-btn send-btn"
                        type="button"
                        aria-label="Gönder"
                    >
                        ➤
                    </button>

                </div>

                <div class="input-hint">
                    ENTER = GÖNDER • SHIFT+ENTER = ALT SATIR
                </div>

            </div>

        </section>

    </div>

</div>

<script>

"use strict";

const AURA_VERSION = "6.0-CLEAN";

const STORAGE = {
    memories:"aura_memories_v3",
    history:"aura_history_v3",
    messages:"aura_messages_v3",
    userName:"aura_user_name",
    girlfriend:"aura_girlfriend_name"
};

const USER_NAME =
    localStorage.getItem(STORAGE.userName)
    || "Kullanıcı";

const GIRLFRIEND_NAME =
    localStorage.getItem(STORAGE.girlfriend)
    || "Edanur Kahraman";

const state = {

    chatOpen:false,

    processing:false,

    listening:false,

    speaking:false,

    online:navigator.onLine,

    voiceEnabled:
        localStorage.getItem("aura_voice")
        !== "false",

    recognition:null,

    memories:[],

    history:[],

    messageCount:0

};

const auraCore =
    document.getElementById("auraCore");

const coreStatus =
    document.getElementById("coreStatus");

const chatOverlay =
    document.getElementById("chatOverlay");

const chatPanel =
    document.getElementById("chatPanel");

const messages =
    document.getElementById("messages");

const userInput =
    document.getElementById("userInput");

const sendBtn =
    document.getElementById("sendBtn");

const micBtn =
    document.getElementById("micBtn");

const closeChat =
    document.getElementById("closeChat");

</script><script>

function saveJSON(key,value){

    try{

        localStorage.setItem(
            key,
            JSON.stringify(value)
        );

    }catch(error){

        console.error(
            "AURA storage error:",
            error
        );

    }

}

function loadJSON(key,fallback){

    try{

        const raw =
            localStorage.getItem(key);

        if(!raw){
            return fallback;
        }

        const parsed =
            JSON.parse(raw);

        return parsed;

    }catch(error){

        console.error(
            "AURA load error:",
            error
        );

        return fallback;
    }

}

function setCoreState(stateName){

    auraCore.classList.remove(
        "processing",
        "listening",
        "speaking"
    );

    if(stateName){

        auraCore.classList.add(
            stateName
        );
    }

    if(stateName==="processing"){

        coreStatus.textContent =
            "PROCESSING";

    }else if(stateName==="listening"){

        coreStatus.textContent =
            "LISTENING";

    }else if(stateName==="speaking"){

        coreStatus.textContent =
            "SPEAKING";

    }else{

        coreStatus.textContent =
            state.online
                ? "ONLINE"
                : "OFFLINE";
    }

}

function openChat(){

    state.chatOpen = true;

    chatOverlay.classList.add("open");

    chatOverlay.setAttribute(
        "aria-hidden",
        "false"
    );

    setTimeout(()=>{

        userInput.focus();

        scrollMessages();

    },260);

}

function closeChatPanel(){

    state.chatOpen = false;

    chatOverlay.classList.remove("open");

    chatOverlay.setAttribute(
        "aria-hidden",
        "true"
    );

    userInput.blur();

}

function toggleChat(){

    if(state.chatOpen){

        closeChatPanel();

    }else{

        openChat();

    }

}

function scrollMessages(){

    requestAnimationFrame(()=>{

        messages.scrollTop =
            messages.scrollHeight;

    });

}

</script><script>

function addMessage(
    text,
    sender="aura",
    shouldSpeak=false
){

    const wrapper =
        document.createElement("div");

    wrapper.className =
        "message " + sender;

    const bubble =
        document.createElement("div");

    bubble.className =
        "bubble";

    const label =
        document.createElement("span");

    label.className =
        "msg-label";

    label.textContent =
        sender==="user"
            ? USER_NAME
            : "AURA";

    const content =
        document.createTextNode(
            String(text)
        );

    bubble.appendChild(label);
    bubble.appendChild(content);

    wrapper.appendChild(bubble);

    messages.appendChild(wrapper);

    scrollMessages();

    state.messageCount++;

    localStorage.setItem(
        "aura_message_count",
        String(state.messageCount)
    );

    if(
        shouldSpeak &&
        sender==="aura" &&
        state.voiceEnabled
    ){

        speak(text);
    }

}

function addTyping(){

    const wrapper =
        document.createElement("div");

    wrapper.className =
        "message aura";

    wrapper.id =
        "typingMessage";

    const bubble =
        document.createElement("div");

    bubble.className =
        "bubble";

    const label =
        document.createElement("span");

    label.className =
        "msg-label";

    label.textContent =
        "AURA";

    const typing =
        document.createElement("div");

    typing.className =
        "typing";

    typing.innerHTML =
        "<span></span><span></span><span></span>";

    bubble.appendChild(label);
    bubble.appendChild(typing);

    wrapper.appendChild(bubble);

    messages.appendChild(wrapper);

    scrollMessages();
}

function removeTyping(){

    const item =
        document.getElementById(
            "typingMessage"
        );

    if(item){

        item.remove();
    }
}

function saveConversation(){

    const items = [];

    document
        .querySelectorAll(
            "#messages .message"
        )
        .forEach(node=>{

            if(node.id==="typingMessage"){
                return;
            }

            const bubble =
                node.querySelector(
                    ".bubble"
                );

            if(!bubble){
                return;
            }

            const label =
                bubble.querySelector(
                    ".msg-label"
                );

            const text =
                bubble
                    .innerText
                    .replace(
                        label
                            ? label.innerText
                            : "",
                        ""
                    )
                    .trim();

            items.push({

                sender:
                    node.classList.contains(
                        "user"
                    )
                        ? "user"
                        : "aura",

                text

            });

        });

    saveJSON(
        STORAGE.messages,
        items
    );

}

     </script><script>

function loadConversation(){

    const saved =
        loadJSON(
            STORAGE.messages,
            []
        );

    if(
        Array.isArray(saved) &&
        saved.length
    ){

        saved.forEach(item=>{

            if(
                item &&
                typeof item.text==="string"
            ){

                addMessage(
                    item.text,
                    item.sender==="user"
                        ? "user"
                        : "aura",
                    false
                );

            }

        });

        return;
    }

    addMessage(
        getGreeting(),
        "aura",
        false
    );

}

function addHistory(
    userText,
    auraText
){

    state.history.push({

        time:
            new Date().toISOString(),

        user:
            userText,

        aura:
            auraText
    });

    saveJSON(
        STORAGE.history,
        state.history
    );

}

function loadPersistentData(){

    state.memories =
        loadJSON(
            STORAGE.memories,
            []
        );

    state.history =
        loadJSON(
            STORAGE.history,
            []
        );

    state.messageCount =
        Number(
            localStorage.getItem(
                "aura_message_count"
            )
            || 0
        );

    loadConversation();

    setCoreState("");
}

function getGreeting(){

    const hour =
        new Date().getHours();

    let greeting;

    if(hour<12){

        greeting = "Günaydın";

    }else if(hour<18){

        greeting = "İyi günler";

    }else{

        greeting = "İyi akşamlar";

    }

    return (
        greeting +
        ". AURA hazır. Nasıl yardımcı olabilirim?"
    );

}

function delay(ms){

    return new Promise(
        resolve => setTimeout(
            resolve,
            ms
        )
    );

}

         </script><script>

function addMemory(
    key,
    value,
    category="genel"
){

    if(
        !key ||
        !value
    ){

        return false;
    }

    const item = {

        id:
            Date.now().toString()
            + "_"
            + Math.random()
                .toString(36)
                .slice(2),

        key:
            String(key)
                .trim(),

        value:
            String(value)
                .trim(),

        category:

            String(category),

        created:
            new Date()
                .toISOString()
    };

    state.memories.push(item);

    saveJSON(
        STORAGE.memories,
        state.memories
    );

    return true;
}

function memoryContext(){

    if(
        !state.memories.length
    ){

        return (
            "Şu anda kayıtlı "
            + "bir hafızam yok."
        );
    }

    return state.memories
        .slice(-10)
        .map(
            memory =>
                memory.key
                + ": "
                + memory.value
        )
        .join("\n");
}

function handleMemoryCommand(text){

    const lower =
        text.toLowerCase();

    let match;

    match =
        text.match(
            /(?:hafızana kaydet|hafızaya kaydet|beni hatırla)\s*[:\-]?\s*(.+)/i
        );

    if(match){

        const value =
            match[1].trim();

        const saved =
            addMemory(
                "Kullanıcı notu",
                value,
                "not"
            );

        return saved
            ? "Tamam. Bunu kalıcı hafızama kaydettim."
            : "Hafızaya kaydedemedim.";
    }

    if(
        lower.includes(
            "ne hatırlıyorsun"
        )
        ||
        lower.includes(
            "hafızanda ne var"
        )
        ||
        lower.includes(
            "beni hatırlıyor musun"
        )
    ){

        return memoryContext();

    }

    return null;
}

         </script><script>

function getNaturalResponse(text){

    const lower =
        text
            .toLowerCase()
            .trim();

    const memoryReply =
        handleMemoryCommand(text);

    if(memoryReply){

        return memoryReply;
    }

    if(
        /^(merhaba|selam|sa|hey|günaydın|iyi akşamlar|iyi geceler)/i
            .test(text)
    ){

        return getGreeting();
    }

    if(
        lower.includes("sen kimsin")
        ||
        lower.includes("adın ne")
        ||
        lower==="kimsin"
    ){

        return (
            "Ben AURA. "
            + "Kişisel yapay zeka "
            + "asistanınım."
        );
    }

    if(
        lower.includes("nasılsın")
        ||
        lower.includes("iyi misin")
    ){

        return (
            "Sistemlerim normal "
            + "çalışıyor. AURA hazır."
        );
    }

    if(
        lower.includes("saat kaç")
        ||
        lower.includes("saati söyle")
    ){

        return (
            "Şu an saat "
            +
            new Date()
                .toLocaleTimeString(
                    "tr-TR",
                    {
                        hour:"2-digit",
                        minute:"2-digit"
                    }
                )
            + "."
        );
    }

    if(
        lower.includes("tarih ne")
        ||
        lower.includes("bugün hangi gün")
    ){

        return (
            "Bugün "
            +
            new Date()
                .toLocaleDateString(
                    "tr-TR",
                    {
                        day:"numeric",
                        month:"long",
                        year:"numeric"
                    }
                )
            + "."
        );
    }

    if(
        lower.includes("teşekkür")
        ||
        lower.includes("sağ ol")
    ){

        return "Rica ederim.";
    }

    if(
        lower.includes("sıkıldım")
    ){

        return (
            "İstersen sohbet edebiliriz, "
            + "bir şeyler planlayabiliriz "
            + "veya hafızama yeni bilgi "
            + "kaydedebilirim."
        );
    }

    if(
        lower.includes(
            "sevgilimin adı ne"
        )
        ||
        lower.includes(
            "sevgilim kim"
        )
    ){

        return (
            "Sevgilinin adı "
            + GIRLFRIEND_NAME
            + "."
        );
    }

         </script><script>

    if(
        lower==="yardım"
        ||
        lower.includes("komutlar")
    ){

        return (
            "Deneyebileceğin bazı komutlar:\n\n"
            + "• Merhaba\n"
            + "• Saat kaç?\n"
            + "• Bugün hangi gün?\n"
            + "• Sen kimsin?\n"
            + "• Sevgilimin adı ne?\n"
            + "• Hafızana kaydet: ...\n"
            + "• Beni hatırlıyor musun?\n"
            + "• Nasılsın?"
        );
    }

    if(
        lower.includes("hafıza sayın")
        ||
        lower.includes("kaç şey hatırlıyorsun")
    ){

        return (
            "Kalıcı hafızamda "
            + state.memories.length
            + " kayıt var."
        );
    }

    if(
        lower.includes("hafızayı temizle")
    ){

        state.memories = [];

        saveJSON(
            STORAGE.memories,
            []
        );

        return (
            "Kalıcı hafızayı temizledim."
        );
    }

    if(
        lower.includes("youtube aç")
        ||
        lower.includes("youtube'u aç")
    ){

        window.open(
            "https://youtube.com",
            "_blank"
        );

        return (
            "YouTube'u açıyorum."
        );
    }

    if(
        lower.includes("google aç")
        ||
        lower.includes("google'ı aç")
    ){

        window.open(
            "https://google.com",
            "_blank"
        );

        return (
            "Google'ı açıyorum."
        );
    }

    if(
        lower.includes("github aç")
    ){

        window.open(
            "https://github.com",
            "_blank"
        );

        return (
            "GitHub'u açıyorum."
        );
    }

    if(
        lower.includes("internette ara")
    ){

        const query =
            text
                .replace(
                    /internette ara/i,
                    ""
                )
                .trim();

        if(query){

            window.open(
                "https://www.google.com/search?q="
                + encodeURIComponent(
                    query
                ),
                "_blank"
            );

            return (
                query
                + " için arama açtım."
            );
        }

    }

    if(
        lower.endsWith("?")
    ){

        return (
            "Bu konuda yardımcı "
            + "olabilirim. Biraz daha "
            + "ayrıntı verirsen daha "
            + "net cevap verebilirim."
        );
    }

    return (
        "Komutunu aldım. "
        + "Şimdilik yerleşik "
        + "komutlarla çalışıyorum. "
        + "Daha ayrıntılı bir konu "
        + "yazabilirsin."
    );

}

         </script><script>

async function processMessage(text){

    if(
        state.processing
        ||
        !text
        ||
        !text.trim()
    ){

        return;
    }

    text =
        text.trim();

    state.processing = true;

    setCoreState(
        "processing"
    );

    addMessage(
        text,
        "user",
        false
    );

    saveConversation();

    addTyping();

    userInput.value = "";

    autoResizeInput();

    try{

        await delay(
            350
        );

        const response =
            getNaturalResponse(
                text
            );

        removeTyping();

        addMessage(
            response,
            "aura",
            true
        );

        addHistory(
            text,
            response
        );

        saveConversation();

    }catch(error){

        console.error(
            "AURA response error:",
            error
        );

        removeTyping();

        addMessage(
            "Bir hata oluştu. "
            + "Tekrar deneyebilirsin.",
            "aura",
            true
        );

    }finally{

        state.processing = false;

        setCoreState("");

        userInput.focus();
    }

}

function sendCurrentMessage(){

    const text =
        userInput.value.trim();

    if(!text){
        return;
    }

    processMessage(
        text
    );

}

function autoResizeInput(){

    userInput.style.height =
        "auto";

    userInput.style.height =
        Math.min(
            userInput.scrollHeight,
            120
        ) + "px";
}

         </script><script>

function speak(text){

    if(
        !state.voiceEnabled
        ||
        !("speechSynthesis" in window)
    ){

        return;
    }

    try{

        window.speechSynthesis
            .cancel();

        const utterance =
            new SpeechSynthesisUtterance(
                text
            );

        utterance.lang =
            "tr-TR";

        utterance.rate =
            0.96;

        utterance.pitch =
            1.0;

        state.speaking = true;

        setCoreState(
            "speaking"
        );

        utterance.onend = ()=>{

            state.speaking = false;

            if(
                !state.processing
                &&
                !state.listening
            ){

                setCoreState("");
            }

        };

        utterance.onerror = ()=>{

            state.speaking = false;

            if(
                !state.processing
                &&
                !state.listening
            ){

                setCoreState("");
            }

        };

        window.speechSynthesis
            .speak(
                utterance
            );

    }catch(error){

        console.error(
            "Speech error:",
            error
        );

        state.speaking =
            false;

        setCoreState("");
    }

}

const Recognition =
    window.SpeechRecognition
    ||
    window.webkitSpeechRecognition;

function setupRecognition(){

    if(!Recognition){

        return;
    }

    state.recognition =
        new Recognition();

    state.recognition.lang =
        "tr-TR";

    state.recognition.continuous =
        false;

    state.recognition.interimResults =
        false;

    state.recognition.onstart = ()=>{

        state.listening = true;

        micBtn.classList.add(
            "active"
        );

        setCoreState(
            "listening"
        );
    };

    state.recognition.onresult =
        event =>{

            let transcript = "";

            for(
                let i=event.resultIndex;
                i<event.results.length;
                i++
            ){

                transcript +=
                    event.results[i][0]
                        .transcript;
            }

            transcript =
                transcript.trim();

            if(transcript){

                userInput.value =
                    transcript;

                autoResizeInput();

                processMessage(
                    transcript
                );
            }
        };

         </script><script>

    state.recognition.onend = ()=>{

        state.listening = false;

        micBtn.classList.remove(
            "active"
        );

        if(
            !state.processing
            &&
            !state.speaking
        ){

            setCoreState("");
        }

    };

    state.recognition.onerror =
        error =>{

            console.warn(
                "Speech recognition:",
                error
            );

            state.listening = false;

            micBtn.classList.remove(
                "active"
            );

            setCoreState("");
        };

}

function startListening(){

    if(!state.recognition){

        alert(
            "Bu tarayıcıda Türkçe "
            + "mikrofon desteği yok."
        );

        return;
    }

    if(state.listening){

        return;
    }

    try{

        state.recognition.start();

    }catch(error){

        console.warn(
            "Recognition start:",
            error
        );

    }

}

function stopListening(){

    if(
        state.recognition
        &&
        state.listening
    ){

        state.recognition.stop();
    }

}
