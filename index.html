<!DOCTYPE html>
<html lang="tr">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<meta name="theme-color"
      content="#02060a">

<title>AURA AI</title>

<style>

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
}

body {
    overflow: hidden;
    font-family: Arial, sans-serif;
    color: #00eaff;

    background:
        radial-gradient(
            circle at center,
            #06303d 0%,
            #02080c 50%,
            #000000 100%
        );
}


/* ÜST BAR */

.top-bar {
    height: 60px;

    display: flex;
    align-items: center;
    justify-content: space-between;

    padding: 0 18px;

    background:
        rgba(0,10,15,0.9);

    border-bottom:
        1px solid
        rgba(0,234,255,0.4);
}

.logo {
    font-size: 21px;
    font-weight: bold;
    letter-spacing: 4px;

    text-shadow:
        0 0 10px #00eaff,
        0 0 25px #00eaff;
}

.status {
    font-size: 11px;
    letter-spacing: 2px;
    color: #55ffcc;
}

.status::before {
    content: "";

    display: inline-block;

    width: 7px;
    height: 7px;

    margin-right: 7px;

    border-radius: 50%;

    background: #55ffcc;

    box-shadow:
        0 0 8px #55ffcc,
        0 0 15px #55ffcc;
}


/* ANA ALAN */

.main {
    height: calc(100vh - 60px);
    height: calc(100dvh - 60px);

    display: flex;
    flex-direction: column;
    align-items: center;

    min-height: 0;
}


/* AURA ÇEKİRDEĞİ */

.aura-core {
    width: 210px;
    height: 210px;

    margin-top: 10px;

    position: relative;

    display: flex;
    align-items: center;
    justify-content: center;

    flex-shrink: 0;
}


/* HALKALAR */

.aura-ring {
    position: absolute;

    border-radius: 50%;

    border:
        1px solid
        #00eaff;

    opacity: 0.7;
}

.ring1 {
    width: 135px;
    height: 135px;

    border-left-color: transparent;
    border-right-color: transparent;

    animation:
        rotate1 7s linear infinite;
}

.ring2 {
    width: 175px;
    height: 175px;

    border-top-color: transparent;
    border-bottom-color: transparent;

    animation:
        rotate2 10s linear infinite;
}

.ring3 {
    width: 210px;
    height: 210px;

    border-left-color: transparent;
    border-bottom-color: transparent;

    animation:
        rotate1 14s linear infinite;
}


/* MERKEZ */

.aura-center {
    width: 100px;
    height: 100px;

    border-radius: 50%;

    border:
        2px solid
        #00eaff;

    display: flex;
    align-items: center;
    justify-content: center;

    color: #00eaff;

    font-size: 21px;
    font-weight: bold;

    letter-spacing: 3px;

    background:
        radial-gradient(
            circle,
            #064454,
            #02090d
        );

    box-shadow:
        0 0 15px #00eaff,
        0 0 45px rgba(0,234,255,0.7),
        inset 0 0 25px rgba(0,234,255,0.5);

    animation:
        pulse 2.2s infinite ease-in-out;

    z-index: 5;
}


/* ANİMASYONLAR */

@keyframes rotate1 {

    from {
        transform: rotate(0deg);
    }

    to {
        transform: rotate(360deg);
    }
}

@keyframes rotate2 {

    from {
        transform: rotate(360deg);
    }

    to {
        transform: rotate(0deg);
    }
}

@keyframes pulse {

    0%,
    100% {
        transform: scale(1);
    }

    50% {
        transform: scale(1.06);
    }
}


/* DURUM */

.aura-status {
    margin-top: -8px;
    margin-bottom: 5px;

    font-size: 10px;
    letter-spacing: 3px;

    color: #8defff;
}


/* SOHBET */

#chat {
    width: min(92%, 600px);

    flex: 1;
    min-height: 0;

    overflow-y: auto;

    padding:
        5px 5px 10px;
}

.message {
    max-width: 85%;

    padding:
        10px 13px;

    margin-bottom: 10px;

    border-radius: 10px;

    line-height: 1.4;

    white-space: pre-wrap;

    font-size: 14px;
}

.aura {
    background:
        rgba(0,35,45,0.8);

    margin-right: auto;

    border:
        1px solid
        rgba(0,234,255,0.25);
}

.user {
    background:
        rgba(0,90,120,0.8);

    margin-left: auto;

    color: white;
}


/* ALT PANEL */

#bottom {
    width: 100%;

    min-height: 65px;

    display: flex;
    align-items: center;

    gap: 8px;

    padding: 10px;

    background:
        rgba(0,10,15,0.97);

    border-top:
        1px solid
        rgba(0,234,255,0.45);

    z-index: 10;
}


/* YAZI KUTUSU */

#input {
    flex: 1;

    min-width: 0;

    height: 45px;

    padding: 12px;

    border-radius: 8px;

    border:
        1px solid
        rgba(0,234,255,0.5);

    outline: none;

    background:
        rgba(0,25,32,0.95);

    color: #00eaff;

    font-size: 14px;
}

#input::placeholder {
    color: #548995;
}


/* BUTONLAR */

button {
    height: 45px;

    border:
        1px solid
        #00eaff;

    border-radius: 8px;

    padding: 0 14px;

    background:
        rgba(0,60,75,0.9);

    color: #00eaff;

    font-size: 14px;

    cursor: pointer;
}

button:active {
    transform: scale(0.94);
}

button:disabled {
    opacity: 0.5;
}

.mic-button {
    width: 45px;

    padding: 0;

    font-size: 20px;
}


/* TELEFON */

@media (max-width: 500px) {

    .aura-core {

        transform: scale(0.82);

        margin-top: 0;
        margin-bottom: -15px;
    }

    .logo {
        font-size: 18px;
    }

    button {
        padding: 0 11px;
    }
}

</style>

</head>

<body>


<div class="top-bar">

    <div class="logo">
        AURA
    </div>

    <div class="status">
        ONLINE
    </div>

</div>


<div class="main">


    <div class="aura-core">

        <div class="aura-ring ring1"></div>

        <div class="aura-ring ring2"></div>

        <div class="aura-ring ring3"></div>

        <div class="aura-center">
            AURA
        </div>

    </div>


    <div class="aura-status">
        AI SYSTEM READY
    </div>


    <div id="chat"></div>


    <div id="bottom">

        <input
            id="input"
            type="text"
            placeholder="AURA'ya bir şey sor..."
            autocomplete="off"
        >

        <button
            class="mic-button"
            id="micButton"
            type="button">
            🎤
        </button>

        <button
            id="sendButton"
            type="button">
            Gönder
        </button>

    </div>

</div>
<script src="https://js.puter.com/v2/"></script>

<script>

/* =========================
   AURA ELEMENTLERİ
========================= */

const chat =
    document.getElementById("chat");

const input =
    document.getElementById("input");

const sendButton =
    document.getElementById("sendButton");

const micButton =
    document.getElementById("micButton");


/* =========================
   MESAJ EKLEME
========================= */

function addMessage(text, type) {

    const message =
        document.createElement("div");

    message.className =
        "message " + type;

    message.textContent =
        text;

    chat.appendChild(message);

    chat.scrollTop =
        chat.scrollHeight;
}


/* =========================
   SES TEMİZLEME
========================= */

function cleanTextForSpeech(text) {

    return text

        .replace(
            /[\p{Emoji_Presentation}\p{Extended_Pictographic}]/gu,
            ""
        )

        .replace(
            /https?:\/\/\S+/gi,
            ""
        )

        .replace(
            /[.,!?;:"'“”‘’()[\]{}<>…\/\\|@#$%^&*_+=~`-]/g,
            " "
        )

        .replace(
            /\s+/g,
            " "
        )

        .trim();
}


/* =========================
   SESLİ CEVAP
========================= */

function speak(text) {

    if (
        !("speechSynthesis" in window)
    ) {
        return;
    }

    const cleanText =
        cleanTextForSpeech(text);

    if (!cleanText) {
        return;
    }

    const message =
        new SpeechSynthesisUtterance(
            cleanText
        );

    message.lang =
        "tr-TR";

    message.rate =
        0.9;

    message.pitch =
        1;

    message.volume =
        1;

    window.speechSynthesis.cancel();

    window.speechSynthesis.speak(
        message
    );
}


/* =========================
   AURA SİSTEM MESAJI
========================= */

const auraSystemPrompt = `

Sen AURA adında kişisel bir yapay zekâ asistanısın.

Türkçe konuş.

Kullanıcıyla doğal ve samimi şekilde konuş.

Çok kısa cevap vermek zorunda değilsin ancak gereksiz uzatma.

Kullanıcının adını biliyorsun fakat cevapların içinde
kullanıcının adını gereksiz yere kullanma.

ÖNEMLİ:

Kullanıcı sana adını sormadığı sürece
"Bedirhan",
"Bedirhan Kahraman"
veya başka bir isimle hitap ETME.

Kullanıcı "ben kimim" diye sorarsa
"Bedirhan Kahraman" olduğunu söyle.

Kullanıcı sevgilisinin adını sorarsa
"Edanur Kahraman" olduğunu söyle.

Her cevabın başına kullanıcı adını ekleme.

Kullanıcıyla konuşurken doğal bir insan gibi cevap ver.

Bilmediğin bilgileri uydurma.

Senin adın AURA.

`;


/* =========================
   KONUŞMA GEÇMİŞİ
========================= */

const conversation = [

    {
        role: "system",
        content: auraSystemPrompt
    }

];


/* =========================
   AI CEVABI
========================= */

async function askAI(text) {

    conversation.push({

        role: "user",

        content: text

    });


    try {

        const response =
            await puter.ai.chat(
                conversation,
                {
                    model:
                        "gpt-5.4-nano"
                }
            );


        let answer = "";


        if (
            response &&
            response.message &&
            response.message.content
        ) {

            answer =
                response.message.content;

        }

        else if (
            response &&
            response.text
        ) {

            answer =
                response.text;

        }

        else if (
            typeof response === "string"
        ) {

            answer =
                response;

        }

        else {

            answer =
                "AURA cevap oluşturamadı.";
        }


        conversation.push({

            role: "assistant",

            content: answer

        });


        return answer;


    }

    catch (error) {

        console.error(
            "AURA AI HATASI:",
            error
        );


        return "AI bağlantısında bir sorun oluştu.";
    }
}


/* =========================
   MESAJ GÖNDER
========================= */

async function sendMessage(
    voiceMode = false
) {

    const text =
        input.value.trim();


    if (!text) {
        return;
    }


    addMessage(
        text,
        "user"
    );


    input.value = "";


    sendButton.disabled =
        true;

    micButton.disabled =
        true;


    addMessage(
        "Düşünüyorum...",
        "aura"
    );


    const loading =
        chat.lastElementChild;


    try {

        const reply =
            await askAI(text);


        if (loading) {
            loading.remove();
        }


        addMessage(
            reply,
            "aura"
        );


        /*

        SADECE MİKROFONLA
        KONUŞULDUĞUNDA
        SESLİ CEVAP VER

        */

        if (voiceMode) {

            speak(reply);
        }


    }

    catch (error) {

        if (loading) {
            loading.remove();
        }


        addMessage(
            "Bir hata oluştu.",
            "aura"
        );
    }


    sendButton.disabled =
        false;

    micButton.disabled =
        false;

    input.focus();
}


/* =========================
   GÖNDER BUTONU
========================= */

sendButton.addEventListener(
    "click",
    function() {

        sendMessage(false);

    }
);


/* =========================
   ENTER
========================= */

input.addEventListener(
    "keydown",
    function(event) {

        if (
            event.key === "Enter"
        ) {

            event.preventDefault();

            sendMessage(false);
        }

    }
);
     /* =========================
   SESLİ KOMUT SİSTEMİ
========================= */

let recognition = null;
let isListening = false;


/* TARAYICI DESTEĞİ */

const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;


/* =========================
   SES TANIMA
========================= */

if (SpeechRecognition) {

    recognition =
        new SpeechRecognition();

    recognition.lang =
        "tr-TR";

    recognition.continuous =
        false;

    recognition.interimResults =
        false;


    recognition.onstart =
        function() {

            isListening = true;

            micButton.disabled = false;

            micButton.textContent = "🔴";
        };


    recognition.onend =
        function() {

            isListening = false;

            micButton.textContent = "🎤";
        };


    recognition.onerror =
        function(error) {

            console.error(
                "Ses tanıma hatası:",
                error
            );

            isListening = false;

            micButton.textContent = "🎤";
        };


    recognition.onresult =
        function(event) {

            const result =
                event.results[
                    event.results.length - 1
                ][0].transcript.trim();


            if (!result) {
                return;
            }


            /*
              AURA UYANDIRMA

              Kullanıcı sadece
              "AURA" diyorsa
              cevap vermesin.
            */

            const lower =
                result.toLowerCase();


            if (
                lower === "aura" ||
                lower === "aura."
            ) {

                addMessage(
                    "Dinliyorum.",
                    "aura"
                );

                speak(
                    "Dinliyorum"
                );

                return;
            }


            /*
              NORMAL SESLİ KOMUT
            */

            input.value =
                result;


            sendMessage(true);
        };
}


/* =========================
   MİKROFON BUTONU
========================= */

micButton.addEventListener(
    "click",
    function() {

        if (!recognition) {

            addMessage(
                "Bu tarayıcı sesli komutu desteklemiyor.",
                "aura"
            );

            return;
        }


        if (isListening) {

            recognition.stop();

            return;
        }


        try {

            recognition.start();

        }

        catch (error) {

            console.error(
                "Mikrofon başlatılamadı:",
                error
            );
        }

    }
);


/* =========================
   AURA UYANMA KONTROLÜ
========================= */

function containsAuraWakeWord(text) {

    const command =
        text
        .toLowerCase()
        .trim();


    return (
        command === "aura" ||
        command.startsWith("aura ") ||
        command.includes(" aura ")
    );
}


/* =========================
   BAŞLANGIÇ MESAJI
========================= */

addMessage(
    "Merhaba. Ben AURA AI.\n\n" +
    "Sistem hazır. Seni dinliyorum.",
    "aura"
);
    }
/* =========================
   WEB ARAMALI AI
========================= */

async function askAIWithWeb(text) {

    conversation.push({

        role: "user",

        content: text

    });


    try {

        const response =
            await puter.ai.chat(
                conversation,
                {
                    model:
                        "openai/gpt-5.3-chat",

                    tools: [
                        {
                            type: "web_search"
                        }
                    ]
                }
            );


        let answer = "";


        if (
            response &&
            response.message &&
            response.message.content
        ) {

            answer =
                response.message.content;

        }

        else if (
            response &&
            response.text
        ) {

            answer =
                response.text;

        }

        else if (
            typeof response === "string"
        ) {

            answer =
                response;

        }

        else {

            answer =
                "Web aramasından cevap alınamadı.";
        }


        conversation.push({

            role: "assistant",

            content: answer

        });


        return answer;

    }

    catch (error) {

        console.error(
            "WEB AI HATASI:",
            error
        );


        return "İnternet üzerinden bilgi alınırken bir sorun oluştu.";
    }
}


/* =========================
   WEB ARAMASI GEREKLİ Mİ
========================= */

function needsWebSearch(text) {

    const command =
        text.toLowerCase().trim();


    const webWords = [

        "internette ara",

        "internetten ara",

        "internette araştır",

        "internetten araştır",

        "webde ara",

        "web'de ara",

        "internetten bak",

        "internete bak",

        "güncel bilgi",

        "guncel bilgi",

        "son dakika",

        "bugün",

        "bugun",

        "şu an",

        "su an",

        "şimdi",

        "simdi",

        "hava durumu",

        "hava nasıl",

        "hava nasil",

        "haber",

        "haberler",

        "bugünkü",

        "bugunku",

        "en son",

        "güncel",

        "guncel",

        "araştır",

        "arastir"

    ];


    for (
        const word of webWords
    ) {

        if (
            command.includes(word)
        ) {

            return true;
        }
    }


    return false;
}


/* =========================
   GÜNCELLENMİŞ MESAJ SİSTEMİ
========================= */

sendMessage = async function(
    voiceMode = false
) {

    const text =
        input.value.trim();


    if (!text) {

        return;
    }


    addMessage(
        text,
        "user"
    );


    input.value = "";


    sendButton.disabled =
        true;

    micButton.disabled =
        true;


    addMessage(
        "Düşünüyorum...",
        "aura"
    );


    const loading =
        chat.lastElementChild;


    try {

        let reply;


        /*
          GÜNCEL BİLGİ GEREKİYORSA
          WEB ARAMALI AI KULLAN
        */

        if (
            needsWebSearch(text)
        ) {

            reply =
                await askAIWithWeb(
                    text
                );

        }

        else {

            reply =
                await askAI(
                    text
                );
        }


        if (loading) {

            loading.remove();
        }


        addMessage(
            reply,
            "aura"
        );


        /*
          SADECE SESLİ KOMUTTA
          AURA SESLİ CEVAP VERİR
        */

        if (voiceMode) {

            speak(reply);
        }


    }

    catch (error) {

        console.error(
            "AURA GENEL HATASI:",
            error
        );


        if (loading) {

            loading.remove();
        }


        addMessage(
            "Bir hata oluştu. Tekrar deneyelim.",
            "aura"
        );
    }


    sendButton.disabled =
        false;

    micButton.disabled =
        false;

    input.focus();
};


/* =========================
   BAŞLANGIÇ MESAJI
========================= */

addMessage(
    "Merhaba. Ben AURA AI.\n\n" +
    "Sistem hazır. Seni dinliyorum.",
    "aura"
);


/* =========================
   HTML KAPANIŞI
========================= */

</script>

</body>

</html>
