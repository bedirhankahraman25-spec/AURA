<!DOCTYPE html>
<html lang="tr">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#02060a">

<title>AURA AI</title>

<style>

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
}

body {
    overflow: hidden;
    font-family: Arial, sans-serif;
    color: #00eaff;

    background:
        radial-gradient(
            circle at center,
            #06303d 0%,
            #02080c 50%,
            #000000 100%
        );
}

.top-bar {
    height: 60px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 18px;
    background: rgba(0,10,15,0.9);
    border-bottom: 1px solid rgba(0,234,255,0.4);
}

.logo {
    font-size: 21px;
    font-weight: bold;
    letter-spacing: 4px;
    text-shadow:
        0 0 10px #00eaff,
        0 0 25px #00eaff;
}

.status {
    font-size: 11px;
    letter-spacing: 2px;
    color: #55ffcc;
}

.status::before {
    content: "";
    display: inline-block;
    width: 7px;
    height: 7px;
    margin-right: 7px;
    border-radius: 50%;
    background: #55ffcc;
    box-shadow:
        0 0 8px #55ffcc,
        0 0 15px #55ffcc;
}

.main {
    height: calc(100vh - 60px);
    height: calc(100dvh - 60px);
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 0;
}

.aura-core {
    width: 210px;
    height: 210px;
    margin-top: 10px;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
}

.aura-ring {
    position: absolute;
    border-radius: 50%;
    border: 1px solid #00eaff;
    opacity: 0.7;
}

.ring1 {
    width: 135px;
    height: 135px;
    border-left-color: transparent;
    border-right-color: transparent;
    animation: rotate1 7s linear infinite;
}

.ring2 {
    width: 175px;
    height: 175px;
    border-top-color: transparent;
    border-bottom-color: transparent;
    animation: rotate2 10s linear infinite;
}

.ring3 {
    width: 210px;
    height: 210px;
    border-left-color: transparent;
    border-bottom-color: transparent;
    animation: rotate1 14s linear infinite;
}

.aura-center {
    width: 100px;
    height: 100px;
    border-radius: 50%;
    border: 2px solid #00eaff;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #00eaff;
    font-size: 21px;
    font-weight: bold;
    letter-spacing: 3px;

    background:
        radial-gradient(
            circle,
            #064454,
            #02090d
        );

    box-shadow:
        0 0 15px #00eaff,
        0 0 45px rgba(0,234,255,0.7),
        inset 0 0 25px rgba(0,234,255,0.5);

    animation: pulse 2.2s infinite ease-in-out;
    z-index: 5;
}

@keyframes rotate1 {
    from {
        transform: rotate(0deg);
    }

    to {
        transform: rotate(360deg);
    }
}

@keyframes rotate2 {
    from {
        transform: rotate(360deg);
    }

    to {
        transform: rotate(0deg);
    }
}

@keyframes pulse {
    0%, 100% {
        transform: scale(1);
    }

    50% {
        transform: scale(1.06);
    }
}

.aura-status {
    margin-top: -8px;
    margin-bottom: 5px;
    font-size: 10px;
    letter-spacing: 3px;
    color: #8defff;
}

#chat {
    width: min(92%, 600px);
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    padding: 5px 5px 10px;
}

.message {
    max-width: 85%;
    padding: 10px 13px;
    margin-bottom: 10px;
    border-radius: 10px;
    line-height: 1.4;
    white-space: pre-wrap;
    font-size: 14px;
}

.aura {
    background: rgba(0,35,45,0.8);
    margin-right: auto;
    border: 1px solid rgba(0,234,255,0.25);
}

.user {
    background: rgba(0,90,120,0.8);
    margin-left: auto;
    color: white;
}

#bottom {
    width: 100%;
    min-height: 65px;
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px;
    background: rgba(0,10,15,0.97);
    border-top: 1px solid rgba(0,234,255,0.45);
    z-index: 10;
}

#input {
    flex: 1;
    min-width: 0;
    height: 45px;
    padding: 12px;
    border-radius: 8px;
    border: 1px solid rgba(0,234,255,0.5);
    outline: none;
    background: rgba(0,25,32,0.95);
    color: #00eaff;
    font-size: 14px;
}

#input::placeholder {
    color: #548995;
}

button {
    height: 45px;
    border: 1px solid #00eaff;
    border-radius: 8px;
    padding: 0 14px;
    background: rgba(0,60,75,0.9);
    color: #00eaff;
    font-size: 14px;
    cursor: pointer;
}

button:active {
    transform: scale(0.94);
}

button:disabled {
    opacity: 0.5;
}

.mic-button {
    width: 45px;
    padding: 0;
    font-size: 20px;
}

@media (max-width: 500px) {

    .aura-core {
        transform: scale(0.82);
        margin-top: 0;
        margin-bottom: -15px;
    }

    .logo {
        font-size: 18px;
    }

    button {
        padding: 0 11px;
    }
}

</style>

</head>

<body>

<div class="top-bar">

    <div class="logo">
        AURA
    </div>

    <div class="status">
        ONLINE
    </div>

</div>

<div class="main">

    <div class="aura-core">

        <div class="aura-ring ring1"></div>
        <div class="aura-ring ring2"></div>
        <div class="aura-ring ring3"></div>

        <div class="aura-center">
            AURA
        </div>

    </div>

    <div class="aura-status">
        AI SYSTEM READY
    </div>

    <div id="chat"></div>

    <div id="bottom">

        <input
            id="input"
            type="text"
            placeholder="AURA'ya bir şey sor..."
            autocomplete="off"
        >

        <button
            class="mic-button"
            id="micButton"
            type="button">
            🎤
        </button>

        <button
            id="sendButton"
            type="button">
            Gönder
        </button>

    </div>

</div>

<script src="https://js.puter.com/v2/"></script>

<script>
    const chat = document.getElementById("chat");
const input = document.getElementById("input");
const sendButton = document.getElementById("sendButton");
const micButton = document.getElementById("micButton");


/* ================================
   KALICI HAFIZA
================================ */

const MEMORY_KEY = "AURA_PERMANENT_MEMORY";


let memory = {

    name: "Bedirhan Kahraman",

    girlfriend: "Edanur Kahraman",

    favoriteTeam: "",

    facts: []

};


function loadMemory() {

    try {

        const saved =
            localStorage.getItem(MEMORY_KEY);

        if (saved) {

            const parsed =
                JSON.parse(saved);

            memory = {
                ...memory,
                ...parsed
            };

            if (!Array.isArray(memory.facts)) {
                memory.facts = [];
            }
        }

    } catch (error) {

        console.error(
            "Hafıza yükleme hatası:",
            error
        );
    }
}


function saveMemory() {

    try {

        localStorage.setItem(
            MEMORY_KEY,
            JSON.stringify(memory)
        );

    } catch (error) {

        console.error(
            "Hafıza kaydetme hatası:",
            error
        );
    }
}


loadMemory();


/* ================================
   BİLGİYİ HAFIZAYA AL
================================ */

function learnMemory(text) {

    const lower =
        text.toLocaleLowerCase("tr-TR");


    /* TAKIM */

    const teamPatterns = [

        /ben\s+(.+?)\s+tutuyorum/i,

        /(.+?)\s+tutuyorum/i,

        /ben\s+(.+?)\s+taraftarıyım/i,

        /ben\s+(.+?)\s+taraftariyim/i

    ];


    for (const pattern of teamPatterns) {

        const match =
            text.match(pattern);

        if (match) {

            const team =
                match[1]
                    .trim()
                    .replace(/[.!?,]+$/, "");

            if (
                team.length > 1 &&
                team.length < 60
            ) {

                memory.favoriteTeam =
                    team;

                saveMemory();

            }

            break;
        }
    }


    /* BUNU HATIRLA */

    const rememberPatterns = [

        /bunu hatırla[:\s]+(.+)/i,

        /bunu hatirla[:\s]+(.+)/i,

        /aklında tut[:\s]+(.+)/i,

        /aklinda tut[:\s]+(.+)/i,

        /unutma[:\s]+(.+)/i

    ];


    for (const pattern of rememberPatterns) {

        const match =
            text.match(pattern);

        if (match) {

            const fact =
                match[1]
                    .trim()
                    .replace(/[.!?]+$/, "");

            if (
                fact.length > 1 &&
                fact.length < 250
            ) {

                if (
                    !memory.facts.includes(fact)
                ) {

                    memory.facts.push(fact);

                    saveMemory();

                }
            }

            break;
        }
    }
}


/* ================================
   HAFIZA BİLGİSİ
================================ */

function getMemoryContext() {

    let result =
        "KALICI KULLANICI HAFIZASI:\n";

    result +=
        "Kullanıcının adı: " +
        memory.name +
        "\n";

    result +=
        "Sevgilisinin adı: " +
        memory.girlfriend +
        "\n";


    if (memory.favoriteTeam) {

        result +=
            "Tuttuğu takım: " +
            memory.favoriteTeam +
            "\n";
    }


    if (memory.facts.length > 0) {

        result +=
            "Hatırlanması istenen bilgiler:\n";

        memory.facts.forEach(
            function(fact, index) {

                result +=
                    "- " +
                    fact +
                    "\n";
            }
        );
    }


    return result;
}


/* ================================
   HAFIZA SORGULARI
================================ */

function memoryCommand(text) {

    const lower =
        text
            .toLocaleLowerCase("tr-TR")
            .trim();


    if (
        lower === "hafızamda ne var" ||
        lower === "hafizanda ne var" ||
        lower === "hafızanda ne var" ||
        lower.includes("benim hakkımda ne biliyorsun") ||
        lower.includes("benim hakkimda ne biliyorsun")
    ) {

        return getMemoryContext();
    }


    if (
        lower.includes("hangi takımı tutuyorum") ||
        lower.includes("hangi takimi tutuyorum")
    ) {

        if (memory.favoriteTeam) {

            return (
                "Tuttuğun takım " +
                memory.favoriteTeam +
                "."
            );

        }

        return "Tuttuğun takımı henüz hafızama kaydetmedim.";
    }


    return null;
}


/* ================================
   AI SİSTEM MESAJI
================================ */

function systemPrompt() {

    return `
Sen AURA adında kişisel bir yapay zekâ asistanısın.

Türkçe konuş.

Kullanıcının adı Bedirhan Kahraman.

Kullanıcının sevgilisinin adı Edanur Kahraman.

ÖNEMLİ:
Kullanıcıya sürekli ismiyle hitap etme.

Her mesajın başında "Bedirhan" deme.

İsmini yalnızca gerçekten doğal ve gerekli olduğu durumlarda kullan.

Her mesajda kendini AURA olarak tanıtma.

Doğal, kısa ve anlaşılır cevaplar ver.

Kullanıcı "ben kimim" diye sorarsa Bedirhan Kahraman olduğunu söyle.

Kullanıcı "sevgilimin adı ne" diye sorarsa Edanur Kahraman olduğunu söyle.

Aşağıdaki kalıcı hafızayı kullan:

${getMemoryContext()}

Hafızadaki bilgileri kullanıcı sormadan gereksiz şekilde listeleme.

Yeni ve önemli bir bilgi verildiğinde onu dikkate al.
`;
}


/* ================================
   KONUŞMA GEÇMİŞİ
================================ */

const conversation = [

    {
        role: "system",
        content: systemPrompt()
    }

];
/* ================================
   MESAJ EKLE
================================ */

function addMessage(text, type) {

    const message =
        document.createElement("div");

    message.className =
        "message " + type;

    message.textContent =
        text;

    chat.appendChild(message);

    chat.scrollTop =
        chat.scrollHeight;
}


/* ================================
   SES
================================ */

function cleanTextForSpeech(text) {

    return text
        .replace(
            /[\p{Emoji_Presentation}\p{Extended_Pictographic}]/gu,
            ""
        )
        .replace(
            /https?:\/\/\S+/gi,
            ""
        )
        .replace(
            /[.,!?;:"'“”‘’()[\]{}<>…:;\/\\|@#$%^&*_+=~`-]/g,
            " "
        )
        .replace(
            /\s+/g,
            " "
        )
        .trim();
}


function speak(text) {

    if (!("speechSynthesis" in window)) {
        return;
    }

    const clean =
        cleanTextForSpeech(text);

    if (!clean) {
        return;
    }

    const voice =
        new SpeechSynthesisUtterance(clean);

    voice.lang = "tr-TR";
    voice.rate = 0.9;
    voice.pitch = 1;
    voice.volume = 1;

    window.speechSynthesis.cancel();

    window.speechSynthesis.speak(voice);
}


/* ================================
   AI CEVABI
================================ */

async function askAI(text) {

    learnMemory(text);


    const special =
        memoryCommand(text);


    if (special) {
        return special;
    }


    /*
     * Sistem mesajını güncel hafızayla
     * yeniliyoruz.
     */

    conversation[0].content =
        systemPrompt();


    conversation.push({

        role: "user",

        content: text

    });


    try {

        /*
         * Puter'ın desteklediği messages
         * formatını kullanıyoruz.
         */

        const response =
            await puter.ai.chat(
                conversation,
                {
                    model: "gpt-5.4-nano"
                }
            );


        console.log(
            "PUTER CEVABI:",
            response
        );


        let answer = "";


        if (
            response &&
            response.message
        ) {

            if (
                typeof response.message.content ===
                "string"
            ) {

                answer =
                    response.message.content;

            }

            else if (
                Array.isArray(
                    response.message.content
                )
            ) {

                answer =
                    response.message.content
                        .map(
                            item =>
                                typeof item === "string"
                                    ? item
                                    : item.text || ""
                        )
                        .join("");

            }

        }


        if (!answer && response?.text) {

            answer =
                response.text;

        }


        if (!answer) {

            answer =
                String(response);

        }


        conversation.push({

            role: "assistant",

            content: answer

        });


        return answer;

    }

    catch (error) {

        console.error(
            "PUTER AI HATASI:",
            error
        );


        return (
            "AI bağlantısında hata oluştu: " +
            (error?.message || "Bilinmeyen hata")
        );
    }
}


/* ================================
   MESAJ GÖNDER
================================ */

async function sendMessage(
    voiceMode = false
) {

    const text =
        input.value.trim();


    if (!text) {
        return;
    }


    addMessage(
        text,
        "user"
    );


    input.value = "";


    sendButton.disabled =
        true;

    micButton.disabled =
        true;


    addMessage(
        "Düşünüyorum...",
        "aura"
    );


    const loading =
        chat.lastElementChild;


    try {

        const reply =
            await askAI(text);


        if (loading) {
            loading.remove();
        }


        addMessage(
            reply,
            "aura"
        );


        if (voiceMode) {

            speak(reply);

        }

    }

    catch (error) {

        console.error(error);


        if (loading) {
            loading.remove();
        }


        addMessage(
            "Bir hata oluştu.",
            "aura"
        );
    }


    sendButton.disabled =
        false;

    micButton.disabled =
        false;

    input.focus();
}


/* ================================
   GÖNDER BUTONU
================================ */

sendButton.onclick =
    function() {

        sendMessage(false);

    };


/* ================================
   ENTER
================================ */

input.onkeydown =
    function(event) {

        if (
            event.key === "Enter"
        ) {

            event.preventDefault();

            sendMessage(false);

        }

    };
    /* ================================
   MİKROFON
================================ */

function startListening() {

    const Recognition =
        window.SpeechRecognition ||
        window.webkitSpeechRecognition;


    if (!Recognition) {

        addMessage(
            "Bu tarayıcı sesli komutu desteklemiyor.",
            "aura"
        );

        return;
    }


    const recognition =
        new Recognition();


    recognition.lang =
        "tr-TR";


    recognition.continuous =
        false;


    recognition.interimResults =
        false;


    recognition.onstart =
        function() {

            micButton.disabled =
                true;

            addMessage(
                "Dinliyorum...",
                "aura"
            );
        };


    recognition.onresult =
        function(event) {

            const text =
                event.results[0][0]
                    .transcript
                    .trim();


            input.value =
                text;


            sendMessage(true);
        };


    recognition.onerror =
        function(event) {

            console.error(
                "Mikrofon hatası:",
                event.error
            );


            micButton.disabled =
                false;


            addMessage(
                "Sesli komut alınamadı.",
                "aura"
            );
        };


    recognition.onend =
        function() {

            micButton.disabled =
                false;
        };


    try {

        recognition.start();

    }

    catch (error) {

        console.error(error);

        micButton.disabled =
            false;
    }
}


micButton.onclick =
    startListening;


/* ================================
   BAŞLANGIÇ
================================ */

addMessage(
    "Merhaba. Sistem hazır. Seni dinliyorum.",
    "aura"
);


input.focus();


/* ================================
   HAFIZAYI OTOMATİK KAYDET
================================ */

window.addEventListener(
    "beforeunload",
    function() {

        saveMemory();

    }
);


console.log(
    "AURA başlatıldı."
);

console.log(
    "Kalıcı hafıza:",
    memory
);

</script>

</body>
</html>
