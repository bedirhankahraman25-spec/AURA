<!DOCTYPE html>
<html lang="tr">
<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width,
             initial-scale=1.0,
             maximum-scale=1.0,
             user-scalable=no"
>

<meta
    name="theme-color"
    content="#01030a"
>

<title>AURA AI</title>

<style>

/* =====================================================
   TEMEL
===================================================== */

*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,
body{
    width:100%;
    height:100%;
    margin:0;
}

body{
    overflow:hidden;

    color:#d9fbff;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    background:
        #01030a;
}


/* =====================================================
   ANA UYGULAMA
===================================================== */

.app{
    width:100%;
    height:100dvh;

    position:relative;

    overflow:hidden;

    background:

        linear-gradient(
            rgba(0,234,255,.025) 1px,
            transparent 1px
        ),

        linear-gradient(
            90deg,
            rgba(0,234,255,.025) 1px,
            transparent 1px
        ),

        radial-gradient(
            circle at 50% 58%,
            rgba(0,130,255,.16),
            transparent 27%
        ),

        radial-gradient(
            circle at 50% 50%,
            #02101d 0%,
            #01050d 48%,
            #000208 100%
        );

    background-size:
        58px 58px,
        58px 58px,
        auto,
        auto;
}


/* =====================================================
   ÜST BAR
===================================================== */

.topbar{

    height:116px;

    display:flex;

    align-items:center;

    justify-content:space-between;

    padding:
        0 22px;

    background:
        rgba(0,3,9,.96);

    border-bottom:
        1px solid
        rgba(0,234,255,.20);

    position:relative;

    z-index:20;
}


.brand{

    display:flex;

    align-items:center;

    gap:13px;
}


.brand-dot{

    width:18px;
    height:18px;

    border-radius:50%;

    background:#00eaff;

    box-shadow:
        0 0 12px #00eaff,
        0 0 30px rgba(0,234,255,.65);

    animation:
        dotPulse 2s ease-in-out infinite;
}


.brand-name{

    font-size:30px;

    font-weight:700;

    letter-spacing:8px;

    color:#eaffff;

    text-shadow:
        0 0 8px #00eaff,
        0 0 24px rgba(0,234,255,.6);
}


@keyframes dotPulse{

    0%,
    100%{
        transform:scale(1);
        opacity:.9;
    }

    50%{
        transform:scale(1.15);
        opacity:1;
    }
}


/* =====================================================
   ÜSTTEKİ 3 BUTON
===================================================== */

.top-actions{

    display:flex;

    gap:12px;
}


.top-action{

    width:72px;
    height:72px;

    border-radius:20px;

    border:
        1px solid
        rgba(0,234,255,.24);

    background:
        rgba(2,18,29,.75);

    color:#00eaff;

    font-size:26px;

    display:flex;

    align-items:center;

    justify-content:center;

    cursor:pointer;

    box-shadow:
        inset 0 0 18px
        rgba(0,234,255,.025);

    transition:
        transform .15s,
        border-color .15s,
        box-shadow .15s;
}


.top-action:active{

    transform:
        scale(.92);

}


.top-action:hover{

    border-color:
        rgba(0,234,255,.6);

    box-shadow:
        0 0 18px
        rgba(0,234,255,.08);
}


/* =====================================================
   DURUM BAR
===================================================== */

.statusbar{

    height:66px;

    display:flex;

    align-items:center;

    justify-content:center;

    gap:12px;

    position:relative;

    z-index:19;
}


.status-pill{

    min-width:88px;

    height:40px;

    padding:
        0 16px;

    border-radius:22px;

    border:
        1px solid
        rgba(0,234,255,.13);

    background:
        rgba(2,9,18,.65);

    display:flex;

    align-items:center;

    justify-content:center;

    color:#3f6673;

    font-size:13px;

    letter-spacing:.5px;
}


.status-pill.online{

    color:#00ff9d;

    border-color:
        rgba(0,255,157,.15);
}


.status-pill.memory{

    color:#536f79;
}


.status-pill.auto{

    color:#536f79;
}


.status-pill.auto.active{

    color:#00eaff;

    border-color:
        rgba(0,234,255,.25);

}


/* =====================================================
   ANA SAHNE
===================================================== */

.stage{

    position:absolute;

    left:0;
    right:0;

    top:182px;
    bottom:0;

    overflow:hidden;
}


/* =====================================================
   ÇEKİRDEK ALANI
===================================================== */

.core-zone{

    position:absolute;

    inset:0;

    display:flex;

    align-items:center;

    justify-content:center;

    pointer-events:none;

    transition:
        transform .45s ease,
        align-items .45s ease;
}


.app.chat-open .core-zone{

    align-items:flex-start;

    padding-top:46px;
}


.core-button{

    width:215px;
    height:215px;

    border:0;

    border-radius:50%;

    position:relative;

    display:flex;

    align-items:center;

    justify-content:center;

    background:transparent;

    cursor:pointer;

    pointer-events:auto;

    outline:none;

    color:#fff;

    z-index:5;
}


/* =====================================================
   ÇEKİRDEK HALKALARI
===================================================== */

.core-ring{

    position:absolute;

    border-radius:50%;

    border:
        1px solid
        rgba(0,234,255,.58);

    pointer-events:none;
}


.core-ring.r1{

    width:160px;
    height:160px;

    border-left-color:
        transparent;

    border-bottom-color:
        transparent;

    animation:
        spinA
        8s
        linear
        infinite;
}


.core-ring.r2{

    width:188px;
    height:188px;

    border-right-color:
        transparent;

    border-top-color:
        transparent;

    animation:
        spinB
        11s
        linear
        infinite;
}


.core-ring.r3{

    width:215px;
    height:215px;

    border-left-color:
        transparent;

    border-right-color:
        transparent;

    opacity:.48;

    animation:
        spinA
        15s
        linear
        infinite;
}


@keyframes spinA{

    from{
        transform:rotate(0deg);
    }

    to{
        transform:rotate(360deg);
    }
}


@keyframes spinB{

    from{
        transform:rotate(360deg);
    }

    to{
        transform:rotate(0deg);
    }
}


/* =====================================================
   ÇEKİRDEK IŞIK
===================================================== */

.core-aura{

    position:absolute;

    width:165px;
    height:165px;

    border-radius:50%;

    background:
        radial-gradient(
            circle,
            rgba(0,234,255,.42),
            rgba(0,115,255,.13) 45%,
            transparent 72%
        );

    filter:blur(12px);

    animation:
        auraGlow
        3s
        ease-in-out
        infinite;
}


@keyframes auraGlow{

    0%,
    100%{
        transform:scale(.9);
        opacity:.65;
    }

    50%{
        transform:scale(1.1);
        opacity:1;
    }
}


/* =====================================================
   ÇEKİRDEK KÜRESİ
===================================================== */

.core-sphere{

    width:118px;
    height:118px;

    border-radius:50%;

    display:flex;

    align-items:center;

    justify-content:center;

    position:relative;

    background:
        radial-gradient(
            circle at 33% 28%,
            #67f7ff 0%,
            #057dff 19%,
            #053d91 42%,
            #031b48 67%,
            #000814 100%
        );

    border:
        2px solid
        rgba(0,234,255,.92);

    box-shadow:

        0 0 16px
        rgba(0,234,255,.95),

        0 0 45px
        rgba(0,130,255,.7),

        0 0 82px
        rgba(0,70,255,.27),

        inset
        0 0 28px
        rgba(0,234,255,.48);

    animation:
        sphereBreath
        3s
        ease-in-out
        infinite;

    z-index:5;
}


.core-sphere span{

    font-size:19px;

    font-weight:700;

    letter-spacing:5px;

    color:#fff;

    text-shadow:
        0 0 8px #fff,
        0 0 20px #00eaff;
}


@keyframes sphereBreath{

    0%,
    100%{
        transform:scale(1);
    }

    50%{
        transform:scale(1.045);
    }
}/* =====================================================
   SOHBET PANELİ
===================================================== */

.chat-panel{

    position:absolute;

    left:14px;
    right:14px;
    bottom:14px;

    height:
        min(70%,650px);

    border-radius:26px;

    background:
        rgba(1,8,16,.96);

    border:
        1px solid
        rgba(0,234,255,.25);

    box-shadow:
        0 -10px 35px
        rgba(0,0,0,.5),

        inset
        0 0 25px
        rgba(0,234,255,.035);

    display:flex;

    flex-direction:column;

    overflow:hidden;

    opacity:0;

    pointer-events:none;

    transform:
        translateY(
            calc(100% + 30px)
        );

    transition:
        transform .45s
        cubic-bezier(.2,.8,.2,1),

        opacity .25s ease;

    z-index:10;

    touch-action:none;
}


.app.chat-open .chat-panel{

    opacity:1;

    pointer-events:auto;

    transform:
        translateY(0);
}


/* =====================================================
   CHAT ÜST
===================================================== */

.chat-head{

    height:54px;

    flex:0 0 54px;

    display:flex;

    align-items:center;

    justify-content:space-between;

    padding:
        0 16px;

    border-bottom:
        1px solid
        rgba(0,234,255,.12);
}


.chat-head-title{

    color:#83eefa;

    font-size:10px;

    letter-spacing:3px;
}


.chat-close{

    width:34px;

    height:34px;

    border-radius:50%;

    background:
        #062536;

    color:#81eefa;

    cursor:pointer;

    font-size:20px;
}


/* =====================================================
   MESAJLAR
===================================================== */

.messages{

    flex:1;

    min-height:0;

    overflow-y:auto;

    padding:
        17px
        8px
        112px;

    scroll-behavior:smooth;

    overscroll-behavior:contain;
}


.messages::-webkit-scrollbar{

    width:4px;
}


.messages::-webkit-scrollbar-thumb{

    background:
        rgba(0,234,255,.25);

    border-radius:10px;
}


.message{

    width:fit-content;

    max-width:88%;

    padding:
        12px 14px;

    margin:
        0 7px 11px;

    border-radius:15px;

    font-size:14px;

    line-height:1.5;

    white-space:pre-wrap;

    overflow-wrap:anywhere;

    word-break:break-word;
}


.message.aura{

    margin-right:auto;

    background:
        linear-gradient(
            135deg,
            rgba(3,49,66,.96),
            rgba(2,21,32,.96)
        );

    border-left:
        3px solid
        #00eaff;

    border-radius:
        5px 15px 15px 15px;
}


.message.user{

    margin-left:auto;

    background:
        linear-gradient(
            135deg,
            #0c6888,
            #063c52
        );

    border-right:
        3px solid
        #5bffe0;

    border-radius:
        15px 5px 15px 15px;

    color:#fff;
}


/* =====================================================
   YAZI ALANI
===================================================== */

.composer{

    position:absolute;

    left:9px;
    right:9px;
    bottom:9px;

    height:68px;

    display:grid;

    grid-template-columns:
        minmax(0,1fr)
        48px
        48px;

    gap:7px;

    padding:7px;

    background:
        rgba(2,22,34,.99);

    border:
        1px solid
        rgba(0,234,255,.58);

    border-radius:21px;
}


.input-wrap{

    min-width:0;

    height:52px;

    overflow:hidden;

    border-radius:16px;

    background:
        rgba(0,45,62,.8);
}


#input{

    width:100%;

    height:100%;

    padding:
        0 13px;

    border:0;

    outline:0;

    background:transparent;

    color:#e9fdff;

    font-size:14px;
}


#input::placeholder{

    color:#658895;
}


.action-btn{

    width:48px;
    height:48px;

    min-width:48px;
    max-width:48px;

    border-radius:15px;

    display:flex;

    align-items:center;
    justify-content:center;

    cursor:pointer;

    font-size:20px;

    padding:0;
}


.action-btn:active{

    transform:scale(.92);
}


.action-btn:disabled{

    opacity:.45;

    cursor:default;
}


.mic-btn{

    color:#a8f9ff;

    background:
        #062e45;

    border:
        1px solid
        rgba(0,234,255,.2);
}


.mic-btn.listening{

    background:
        #00a8bd;

    color:#fff;

    box-shadow:
        0 0 18px
        rgba(0,234,255,.6);
}


.send-btn{

    color:#001217;

    background:
        linear-gradient(
            135deg,
            #49faff,
            #11c9db
        );

    font-size:23px;

    font-weight:800;

    box-shadow:
        0 0 15px
        rgba(0,234,255,.3);
}


/* =====================================================
   TOAST
===================================================== */

.toast{

    position:fixed;

    left:50%;
    bottom:24px;

    transform:
        translate(-50%,20px);

    max-width:88%;

    padding:
        10px 15px;

    border-radius:12px;

    border:
        1px solid
        rgba(0,234,255,.35);

    background:
        #041522;

    color:#c9faff;

    font-size:13px;

    text-align:center;

    opacity:0;

    pointer-events:none;

    transition:.25s;

    z-index:100;
}


.toast.show{

    opacity:1;

    transform:
        translate(-50%,0);
}


/* =====================================================
   GİZLİ DOSYA / GÖRSEL GİRİŞLER
===================================================== */

.hidden-input{

    display:none;
}


/* =====================================================
   MOBİL
===================================================== */

@media(max-width:600px){

    .topbar{

        height:108px;
    }

    .brand-name{

        font-size:24px;
    }

    .top-action{

        width:56px;
        height:56px;

        border-radius:17px;

        font-size:22px;
    }

    .statusbar{

        height:55px;
    }

    .status-pill{

        height:36px;

        min-width:82px;

        padding:
            0 13px;

        font-size:11px;
    }

    .stage{

        top:163px;
    }

    .app.chat-open .core-zone{

        align-items:flex-start;

        padding-top:26px;
    }

    .chat-panel{

        left:6px;
        right:6px;
        bottom:6px;

        height:74%;

        border-radius:23px;
    }

    .composer{

        left:7px;
        right:7px;
        bottom:7px;

        grid-template-columns:
            minmax(0,1fr)
            45px
            45px;

        gap:5px;
    }

    .action-btn{

        width:45px;
        height:45px;

        min-width:45px;
        max-width:45px;
    }

    #input{

        font-size:14px;
    }
}</style>

</head>

<body>

<div class="app" id="app">

    <header class="topbar">

        <div class="brand">

            <span class="brand-dot"></span>

            <span class="brand-name">
                AURA
            </span>

        </div>


        <div class="top-actions">

            <button
                class="top-action"
                id="quickVoice"
                type="button"
                title="Konuşma modu">

                ◎

            </button>


            <button
                class="top-action"
                id="quickMemory"
                type="button"
                title="Hafıza">

                ◇

            </button>


            <button
                class="top-action"
                id="quickAuto"
                type="button"
                title="Ajan modu">

                ⚙

            </button>

        </div>

    </header>


    <div class="statusbar">

        <div
            class="status-pill online"
            id="onlineStatus">

            ONLINE

        </div>


        <div
            class="status-pill memory"
            id="memoryStatus">

            MEMORY 0

        </div>


        <div
            class="status-pill auto"
            id="autoStatus">

            AUTO

        </div>

    </div>


    <main class="stage">

        <div class="background-glow"></div>


        <div class="core-zone">

            <button
                class="core-button"
                id="coreButton"
                type="button"
                aria-label="AURA'yı aç">

                <span
                    class="core-ring r1">
                </span>

                <span
                    class="core-ring r2">
                </span>

                <span
                    class="core-ring r3">
                </span>


                <div
                    class="core-aura">
                </div>


                <div
                    class="core-sphere">

                    <span>
                        AURA
                    </span>

                </div>

            </button>

        </div>


        <section
            class="chat-panel"
            id="chatPanel">


            <div class="chat-head">

                <div
                    class="chat-head-title">

                    AURA COMMUNICATION

                </div>


                <button
                    class="chat-close"
                    id="closeChat"
                    type="button">

                    ×

                </button>

            </div>


            <div
                class="messages"
                id="messages">
            </div>


            <div class="composer">

                <div
                    class="input-wrap">

                    <input
                        id="input"
                        type="text"
                        autocomplete="off"
                        placeholder="AURA'ya mesaj yaz..."
                    >

                </div>


                <button
                    class="action-btn mic-btn"
                    id="micButton"
                    type="button">

                    🎙

                </button>


                <button
                    class="action-btn send-btn"
                    id="sendButton"
                    type="button">

                    ➤

                </button>

            </div>


        </section>


        <input
            class="hidden-input"
            id="fileInput"
            type="file"
            accept=".txt,.md,.json,.csv,.html,.css,.js,.py,.pdf"
        >


        <input
            class="hidden-input"
            id="imageInput"
            type="file"
            accept="image/*"
        >


        <div
            class="toast"
            id="toast">
        </div>

    </main>

</div>


<script src="https://js.puter.com/v2/"></script>

<script>"use strict";


/* =====================================================
   ELEMENTLER
===================================================== */

const app =
    document.getElementById("app");

const coreButton =
    document.getElementById("coreButton");

const chatPanel =
    document.getElementById("chatPanel");

const closeChat =
    document.getElementById("closeChat");

const messagesEl =
    document.getElementById("messages");

const input =
    document.getElementById("input");

const sendButton =
    document.getElementById("sendButton");

const micButton =
    document.getElementById("micButton");

const fileInput =
    document.getElementById("fileInput");

const imageInput =
    document.getElementById("imageInput");

const toast =
    document.getElementById("toast");

const memoryStatus =
    document.getElementById("memoryStatus");

const autoStatus =
    document.getElementById("autoStatus");

const quickVoice =
    document.getElementById("quickVoice");

const quickMemory =
    document.getElementById("quickMemory");

const quickAuto =
    document.getElementById("quickAuto");

const statusLine =
    document.getElementById("statusLine");


/* =====================================================
   KİMLİK
===================================================== */

const USER_NAME =
    "Bedirhan Kahraman";

const GIRLFRIEND_NAME =
    "Edanur";


/* =====================================================
   AI MODELLERİ
===================================================== */

const NORMAL_MODEL =
    "gpt-5.4-nano";

const SEARCH_MODEL =
    "openai/gpt-5.6-luna";


/* =====================================================
   STORAGE ANAHTARLARI
===================================================== */

const STORAGE = {

    memory:
        "AURA_V10_MEMORY",

    history:
        "AURA_V10_HISTORY",

    tasks:
        "AURA_V10_TASKS",

    reminders:
        "AURA_V10_REMINDERS",

    knowledge:
        "AURA_V10_KNOWLEDGE",

    profile:
        "AURA_V10_PROFILE",

    goals:
        "AURA_V10_GOALS",

    planner:
        "AURA_V10_PLANNER",

    settings:
        "AURA_V10_SETTINGS"
};


/* =====================================================
   BAŞLANGIÇ DURUMU
===================================================== */

const state = {

    memory:{
        facts:[],
        preferences:[],
        notes:[]
    },

    history:[],

    tasks:[],

    reminders:[],

    knowledge:[],

    profile:{},

    goals:[],

    planner:{},

    settings:{
        auto:true,
        voiceConversation:false
    },

    fileContext:"",

    fileName:"",

    busy:false,

    voiceRequest:false,

    listening:false,

    recognition:null
};


/* =====================================================
   GÜVENLİ JSON
===================================================== */

function loadJSON(
    key,
    fallback
){

    try{

        const raw =
            localStorage.getItem(
                key
            );

        if(!raw){

            return fallback;
        }

        const value =
            JSON.parse(raw);

        return value;

    }catch(error){

        console.error(
            "AURA storage okuma:",
            error
        );

        return fallback;
    }
}


function saveJSON(
    key,
    value
){

    try{

        localStorage.setItem(
            key,
            JSON.stringify(value)
        );

    }catch(error){

        console.error(
            "AURA storage kayıt:",
            error
        );
    }
}


/* =====================================================
   VERİLERİ YÜKLE
===================================================== */

state.memory =
    loadJSON(
        STORAGE.memory,
        state.memory
    );

state.history =
    loadJSON(
        STORAGE.history,
        []
    );

state.tasks =
    loadJSON(
        STORAGE.tasks,
        []
    );

state.reminders =
    loadJSON(
        STORAGE.reminders,
        []
    );

state.knowledge =
    loadJSON(
        STORAGE.knowledge,
        [
            {
                title:"AURA",
                text:
                    "AURA, Bedirhan'ın kişisel yapay zeka projesidir."
            },

            {
                title:"Edanur",
                text:
                    "Edanur, Bedirhan'ın sevgilisidir."
            }
        ]
    );

state.profile =
    loadJSON(
        STORAGE.profile,
        {
            name:
                USER_NAME,

            girlfriend:
                GIRLFRIEND_NAME
        }
    );

state.goals =
    loadJSON(
        STORAGE.goals,
        []
    );

state.planner =
    loadJSON(
        STORAGE.planner,
        {}
    );

function cleanText(
    value
){

    return String(
        value ?? ""
    ).trim();
}


function escapeText(
    value
){

    return cleanText(value)
        .replace(
            /[<>]/g,
            ""
        );
}


function showToast(
    text
){

    toast.textContent =
        cleanText(text);

    toast.classList.add(
        "show"
    );

    clearTimeout(
        showToast.timer
    );

    showToast.timer =
        setTimeout(
            ()=>{
                toast.classList.remove(
                    "show"
                );
            },
            2400
        );
}


function updateStatus(){

    const memoryCount =
        state.memory.facts.length +

function addMessage(
    text,
    role="aura",
    persist=true
){

    const value =
        cleanText(text);


    if(!value){

        return;
    }


    const element =
        document.createElement(
            "div"
        );


    element.className =
        "message " +
        (
            role === "user"
                ? "user"
                : "aura"
        );


    element.textContent =
        value;


    messagesEl.appendChild(
        element
    );


    requestAnimationFrame(
        ()=>{
            messagesEl.scrollTop =
                messagesEl.scrollHeight;
        }
    );


    if(
        persist
    ){

        state.history.push({

            role:
                role === "user"
                    ? "user"
                    : "aura",

            text:value,

            time:
                Date.now()
        });


        if(
            state.history.length > 120
        ){

            state.history =
                state.history.slice(-120);
        }


        saveJSON(
            STORAGE.history,
            state.history
        );
    }
}

    if(

            "Bilgiler:\n"+
            state.memory.facts
                .map(
                    item =>
                        "- "+

    if(

        result.push(
            "Tercihler:\n"+
            state.memory.preferences
                .map(
                    item =>
                        "- "+
                        item.text
                )
                .join("\n")
        );
    }


    if(
        state.memory.notes.length
    ){

        result.push(
            "Notlar:\n"+
            state.memory.notes
                .map(
                    item =>
                        "- "+
                        item.text

function addMemory(
    type,
    text
){

    if(
        !Array.isArray(
            state.memory[type]
        )
    ){

        return;
    }


    state.memory[type].push({

        text:
            cleanText(text),

        time:

    state.memory[type] =
        state.memory[type]
            .slice(-100);


    saveJSON(
        STORAGE.memory,
        state.memory

    updateStatus();
}

function memoryCommand(
    text
){

    const lower =
        cleanText(text)
            .toLocaleLowerCase(
                "tr-TR"
            );


    const groups=[

        {
            type:"notes",

            prefixes:[
                "not al ",
                "not kaydet ",
                "bunu not al ",
                "bunu kaydet ",
                "hafızana kaydet ",
                "hafizana kaydet "
            ]
        },

        {
            type:"facts",

            prefixes:[
                "bunu hatırla ",
                "bunu hatirla ",
                "bunu hafızana al ",
                "bunu hafizana al ",
                "bunu unutma "
            ]
        },

        {
            type:"preferences",

            prefixes:[
                "tercihimi hatırla ",
                "tercihimi hatirla ",
                "şunu seviyorum ",
                "sunu seviyorum ",
                "şunu sevmiyorum ",
                "sunu sevmiyorum "
            ]
        }

    ];


    for(
        const group of groups
    ){

        for(
            const prefix of group.prefixes
        ){

            if(
                lower.startsWith(prefix)
            ){

                const value=
                    text
                        .slice(
                            prefix.length
                        )
                        .trim();


                if(!value){

                    return {
                        handled:true,
                        response:
                            "Kaydedilecek bilgiyi belirt."
                    };
                }


                addMemory(
                    group.type,
                    value
                );


                return {
                    handled:true,
                    response:
                        "Tamam, bunu kalıcı hafızaya kaydettim."
                };
            }
        }
    }


    if(
        [
            "hafızamda ne var",
            "hafizamda ne var",
            "neyi hatırlıyorsun",
            "neyi hatirliyorsun"
        ].includes(lower)
    ){

        return {
            handled:true,
            response:
                memoryText()
        };
    }


    if(
        [
            "hafıza özeti",
            "hafiza ozeti"
        ].includes(lower)
    ){

        return {
            handled:true,
            response:
                `Hafızada ${
                    state.memory.facts.length+
                    state.memory.preferences.length+
                    state.memory.notes.length
                } kayıt var. Bilgi tabanında ${
                    state.knowledge.length
                } kayıt var.`
        };
    }


    if(
        [
            "hafızanı temizle",
            "hafizani temizle",
            "tüm hafızanı sil",
            "tum hafizani sil"
        ].includes(lower)
    ){

        state.memory={
            facts:[],
            preferences:[],
            notes:[]
        };


        saveJSON(
            STORAGE.memory,
            state.memory
        );


        updateStatus();


        return {
            handled:true,
            response:
                "AURA hafızası temizlendi."
        };
    }


    if(
        [
            "notlarımı sil",
            "notlarimi sil",
            "tüm notları sil",
            "tum notlari sil"
        ].includes(lower)
    ){

        state.memory.notes=[];


        saveJSON(
            STORAGE.memory,
            state.memory
        );


        updateStatus();


        return {
            handled:true,
            response:
                "Tüm notlar silindi."
        };
    }


    return {
        handled:false
    };
}

function taskCommand(
    text
){

    const lower=
        cleanText(text)
            .toLocaleLowerCase(
                "tr-TR"
            );


    const match=
        lower.match(
            /^(?:görev ekle|gorev ekle)\s+(.+)$/
        );


    if(match){

        const start=
            text
                .toLocaleLowerCase(
                    "tr-TR"
                )
                .indexOf(
                    match[1]
                );


        const title=
            text
                .slice(start)
                .trim();


        state.tasks.push({

            id:Date.now(),

            title,

            done:false,

            time:Date.now()
        });


        saveJSON(
            STORAGE.tasks,
            state.tasks
        );


        return {
            handled:true,
            response:
                `Görev eklendi: ${title}`
        };
    }


    if(
        [
            "görevlerim",
            "gorevlerim",
            "görev listesi",
            "gorev listesi"
        ].includes(lower)
    ){

        if(
            !state.tasks.length
        ){

            return {
                handled:true,
                response:
                    "Görev listesi boş."
            };
        }


        return {
            handled:true,
            response:
                state.tasks
                    .map(
                        (x,i)=>
                            `${i+1}. ${
                                x.done
                                    ? "✓"
                                    : "○"
                            } ${x.title}`
                    )
                    .join("\n")
        };
    }


    const done=
        lower.match(
            /^(?:görevi tamamla|gorevi tamamla)\s+(\d+)$/
        );


    if(done){

        const index=
            Number(
                done[1]
            )-1;


        if(
            state.tasks[index]
        ){

            state.tasks[index].done=
                true;


            saveJSON(
                STORAGE.tasks,
                state.tasks
            );


            return {
                handled:true,
                response:
                    "Görev tamamlandı."
            };
        }
    }


    const remove=
        lower.match(
            /^(?:görevi sil|gorevi sil)\s+(\d+)$/
        );


    if(remove){

        const index=
            Number(
                remove[1]
            )-1;


        if(
            state.tasks[index]
        ){

            state.tasks.splice(
                index,
                1
            );


            saveJSON(
                STORAGE.tasks,
                state.tasks
            );


            return {
                handled:true,
                response:
                    "Görev silindi."
            };
        }
    }


    if(
        [
            "görevleri temizle",
            "gorevleri temizle"
        ].includes(lower)
    ){

        state.tasks=[];


        saveJSON(
            STORAGE.tasks,
            state.tasks
        );


        return {
            handled:true,
            response:
                "Görev listesi temizlendi."
        };
    }


    return {
        handled:false
    };
}

function createReminder(
    message,
    delay,
    repeat=null
){

    const item={

        id:Date.now(),

        msg:
            cleanText(message),

        due:
            Date.now()+
            delay,

        repeat,

        done:false
    };


    state.reminders.push(
        item
    );


    saveJSON(
        STORAGE.reminders,
        state.reminders
    );


    scheduleReminder(
        item
    );


    return item;
}


function reminderCommand(
    text
){

    const lower=
        cleanText(text)
            .toLocaleLowerCase(
                "tr-TR"
            );


    const repeatDaily=
        lower.match(
            /^(?:her gün|her gun)\s+(\d{1,2}):(\d{2})\s+(.+)$/
        );


    if(repeatDaily){

        const h=
            Number(
                repeatDaily[1]
            );

        const m=
            Number(
                repeatDaily[2]
            );


        const message=
            text
                .slice(
                    text
                        .toLocaleLowerCase(
                            "tr-TR"
                        )
                        .indexOf(
                            repeatDaily[3]
                        )
                )
                .trim();


        const now=
            new Date();


        const target=
            new Date();


        target.setHours(
            h,
            m,
            0,
            0
        );


        if(
            target<=now
        ){

            target.setDate(
                target.getDate()+1
            );
        }


        createReminder(
            message,
            target.getTime()-
            now.getTime(),
            "daily"
        );


        return {
            handled:true,
            response:
                `Her gün ${String(h).padStart(2,"0")}:${String(m).padStart(2,"0")} için "${message}" hatırlatıcısı oluşturuldu.`
        };
    }


    const match=
        lower.match(
            /^(?:hatırlat|hatirlat)\s+(\d+)\s*(saniye|dakika|dk|saat)\s+(.+)$/
        );


    if(match){

        const count=
            Number(
                match[1]
            );


        const unit=
            match[2];


        const index=
            text
                .toLocaleLowerCase(
                    "tr-TR"
                )
                .indexOf(
                    match[3]
                );


        const message=
            text
                .slice(index)
                .trim();


        const multiplier=
            unit==="saniye"
                ?1000
                :unit==="saat"
                    ?3600000
                    :60000;


        createReminder(
            message,
            count*multiplier,
            null
        );


        return {
            handled:true,
            response:
                `${count} ${unit} sonra "${message}" için hatırlatıcı oluşturdum.`
        };
    }


    if(
        [
            "hatırlatıcılarım",
            "hatirlaticilarim"
        ].includes(lower)
    ){

        const active=
            state.reminders.filter(
                x=>!x.done
            );


        if(
            !active.length
        ){

            return {
                handled:true,
                response:
                    "Aktif hatırlatıcı yok."
            };
        }


        return {
            handled:true,
            response:
                active
                    .map(
                        (x,i)=>
                            `${i+1}. ${x.msg} — ${new Date(x.due).toLocaleString("tr-TR")}`
                    )
                    .join("\n")
        };
    }


    return {
        handled:false
    };
}


function scheduleReminder(
    item
){

    const delay=
        Math.max(
            0,
            item.due-Date.now()
        );


    setTimeout(
        ()=>{

            if(
                item.done
            ){

                return;
            }


            addMessage(
                "Hatırlatıcı: "+
                item.msg,
                "aura",
                true
            );


            if(
                "Notification" in window &&
                Notification.permission==="granted"
            ){

                try{

                    new Notification(
                        "AURA",
                        {
                            body:item.msg
                        }
                    );

                }catch{}

            }


            if(
                item.repeat==="daily"
            ){

                item.due=
                    Date.now()+
                    86400000;

                scheduleReminder(
                    item
                );

            }else{

                item.done=true;
            }


            saveJSON(
                STORAGE.reminders,
                state.reminders
            );

        },
        Math.min(
            delay,
            2147483647
        )
    );
              }/* =====================================================

        lower.match(

        }
    }


    return {
        handled:false
    };

function calculatorCommand(
    text
){

    const lower=
        cleanText(text)
            .toLocaleLowerCase(
                "tr-TR"
            );


    const prefixes=[
        "hesapla ",
        "hesap ",
        "kaç eder ",
        "kac eder "
    ];


    let expression=null;


    for(
        const prefix of prefixes
    ){

        if(
            lower.startsWith(prefix)
        ){

            expression=
                text
                    .slice(
                        prefix.length
                    )
                    .trim();

            break;
        }
    }


    if(!expression){

        return {
            handled:false
        };
    }


    expression=
        expression
            .replace(
                /,/g,
                "."
            )
            .replace(
                /×/g,
                "*"
            )
            .replace(
                /÷/g,
                "/"
            )
            .replace(
                /[^0-9+\-*/().%\s]/g,
                ""
            );


    if(!expression){

        return {
            handled:true,
            response:
                "Hesaplanacak işlemi anlayamadım."
        };
    }


    try{

        const result=
            Function(
                '"use strict";return ('+
                expression+
                ')'
            )();


        if(
            typeof result!=="number"||
            !Number.isFinite(result)
        ){

            throw new Error(
                "Geçersiz sonuç"
            );
        }


        return {
            handled:true,
            response:
                "Sonuç: "+
                result
        };

    }catch{

        return {
            handled:true,
            response:
                "Bu işlemi hesaplayamadım."
        };
    }
              }/* =====================================================
   BİLGİ TABANI
===================================================== */

async function readTextFile(
    file
){

    const name=
        file.name
            .toLowerCase();


    const supported=[
        ".txt",
        ".md",
        ".json",
        ".csv",
        ".html",
        ".css",
        ".js",
        ".py"
    ];


    if(
        !supported.some(
            ext =>
                name.endsWith(ext)
        )
    ){

        throw new Error(
            "Desteklenmeyen dosya türü."
        );
    }


    return (
        await file.text()
    )
    .slice(
        0,
        40000
    );
}

const APP_INTENTS={

    youtube:
        "intent://www.youtube.com/#Intent;package=com.google.android.youtube;scheme=https;end",

    whatsapp:
        "intent://send/#Intent;package=com.whatsapp;scheme=whatsapp;end",

    instagram:

function openSiteOrApp(
    name
){

    const target=
        cleanText(name)
            .toLocaleLowerCase(
                "tr-TR"
            );


    const url=
        SITE_MAP[target]||
        (
            /^https?:\/\//i.test(
                target
            )
                ?target
                :"https://www.google.com/search?q="+
                 encodeURIComponent(target)
        );


    const intent=
        APP_INTENTS[target];


    if(
        intent
    ){

        try{

            const link=
                document.createElement(
                    "a"
                );


            link.href=
                intent;

            link.target=
                "_blank";

            link.rel=
                "noopener";

            document.body.appendChild(
                link
            );

            link.click();


            link.remove();

        }catch{

            window.open(
                url,
                "_blank"
            );
        }


        setTimeout(
            ()=>{
                window.open(
                    url,
                    "_blank"
                );
            },
            1400
        );

    }else{

        window.open(
            url,
            "_blank"
        );
    }


    return:
        `${target} açılıyor.`;
}

/* =====================================================
   TOOL ÇALIŞTIR
===================================================== */

async function executeTool(
    name,
    args
){

    switch(name){

        case "get_current_time":

            return JSON.stringify({

                date:
                    new Date()
                        .toLocaleDateString(
                            "tr-TR",
                            {
                                weekday:"long",
                                day:"numeric",
                                month:"long",
                                year:"numeric"
                            }
                        ),

                time:
                    new Date()
                        .toLocaleTimeString(
                            "tr-TR"
                        )

            });


        case "calculate":{

            const expression=
                String(
                    args.expression||
                    ""
                )
                .replace(
                    /[^0-9+\-*/().%\s]/g,
                    ""
                );


            try{

                const result=
                    Function(
                        '"use strict";return ('+
                        expression+
                        ')'
                    )();


                return String(result);

            }catch{

                return "Hesaplama yapılamadı.";
            }
        }


        case "add_task":{

            const title=
                cleanText(
                    args.title
                );


            if(
                !confirmAction(
                    `Yeni görev:\n${title}`
                )
            ){

                return "Kullanıcı işlemi iptal etti.";
            }


            state.tasks.push({

                id:Date.now(),

                title,

                done:false,

                time:Date.now()
            });


            saveJSON(
                STORAGE.tasks,
                state.tasks
            );


            return "Görev oluşturuldu.";
        }


        case "add_reminder":{

            const message=
                cleanText(
                    args.message
                );


            const minutes=
                Number(
                    args.minutes
                );


            if(
                !Number.isFinite(minutes)||
                minutes<=0
            ){

                return "Geçersiz süre.";
            }


            if(
                !confirmAction(
                    `${minutes} dakika sonra "${message}" hatırlatılsın mı?`
                )
            ){

                return "Kullanıcı işlemi iptal etti.";
            }


            createReminder(
                message,
                minutes*60000
            );


            return "Hatırlatıcı oluşturuldu.";
        }


        case "save_memory":{

            const category=
                args.category;

            const text=
                cleanText(
                    args.text
                );


            if(
                !confirmAction(
                    `Hafızaya şu bilgi kaydedilecek:\n\n${text}`
                )
            ){

                return "Kullanıcı işlemi iptal etti.";
            }


            addMemory(
                category,
                text
            );


            return "Bilgi hafızaya kaydedildi.";
        }


        case "open_website":{

            const name=
                cleanText(
                    args.name
                );


            if(
                !confirmAction(
                    `${name} açılsın mı?`
                )
            ){

                return "Kullanıcı işlemi iptal etti.";
            }


            return openSiteOrApp(
                name
            );
        }


        case "get_memory":

            return memoryText();


        default:

            return "Bilinmeyen tool.";
    }
                          }/* =====================================================
   AI CEVAP NORMALİZASYONU
===================================================== */

function normalizeAIResponse(
    response
){

    if(
        response===null||
        response===undefined
    ){

        return "";
    }


    if(
        typeof response==="string"
    ){

        return response.trim();
    }


    if(
        typeof response.message?.content==="string"
    ){

        return response.message.content.trim();
    }


    if(
        Array.isArray(
            response.message?.content
        )
    ){

        return response.message.content

            .map(
                part=>{

                    if(
                        typeof part==="string"
                    ){

                        return part;
                    }


                    if(
                        part &&
                        typeof part.text==="string"
                    ){

                        return part.text;
                    }


                    return "";
                }
            )

            .join("")
            .trim();
    }


    if(
        typeof response.text==="string"
    ){

        return response.text.trim();
    }


    if(
        typeof response.content==="string"
    ){

        return response.content.trim();
    }


    return "";
}

async function askAI(
    text,
    useWeb=false
){

    if(
        typeof puter==="undefined"
    ){

        throw new Error(
            "Puter yüklenmedi."
        );
    }


    if(
        !puter.ai||
        typeof puter.ai.chat!=="function"
    ){

        throw new Error(
            "Puter AI servisi bulunamadı."
        );
    }


    const messages=[

        {
            role:"system",

            content:
                buildPrompt()
        }

    ];


    state.history
        .slice(-16)
        .forEach(
            item=>{

                if(
                    item &&
                    typeof item.text==="string"
                ){

                    messages.push({

                        role:
                            item.role==="user"
                                ?"user"
                                :"assistant",

                        content:
                            item.text
                    });
                }
            }
        );


    messages.push({

        role:"user",

        content:
            String(text)
    });


    let options={

        model:
            useWeb
                ? SEARCH_MODEL
                : NORMAL_MODEL,

        tools:
            agentTools
    };


    if(
        useWeb
    ){

        options.tools=[
            {type:"web_search"},
            ...agentTools
        ];
    }


    let response=
        await puter.ai.chat(
            messages,
            options
        );


    /*
       Agent tool çağrısı varsa
       maksimum 3 tur çalıştır.
    */

    for(
        let round=0;
        round<3;
        round++
    ){

        const toolCalls=
            response
                ?.message
                ?.tool_calls;


        if(
            !Array.isArray(toolCalls)||
            !toolCalls.length
        ){

            break;
        }


        messages.push(
            response.message
        );


        for(
            const call
            of toolCalls
        ){

            let args={};


            try{

                args=
                    JSON.parse(
                        call.function.arguments||
                        "{}"
                    );

            }catch{

                args={};
            }


            const result=
                await executeTool(
                    call.function.name,
                    args
                );


            messages.push({

                role:"tool",

                tool_call_id:
                    call.id,

                content:
                    String(result)
            });
        }


        response=
            await puter.ai.chat(
                messages,
                options
            );
    }


    const answer=
        normalizeAIResponse(
            response
        );


    if(!answer){

        throw new Error(
            "AI metin döndürmedi."
        );
    }


    return answer;
}/* =====================================================
   SES
===================================================== */

function cleanSpeechText(
    text
){

    let result=
        String(
            text??""
        );


    try{

        result=
            result.replace(
                /[\p{Emoji_Presentation}\p{Extended_Pictographic}]/gu,
                " "
            );

    }catch{

        result=
            result.replace(
                /[\u{1F300}-\u{1FAFF}]/gu,
                " "
            );
    }


    return result

        .replace(
            /https?:\/\/\S+/gi,
            " "
        )

        .replace(
            /[`*_#~|<>{}\[\]]/g,
            " "
        )

        .replace(
            /[•●◆◇★☆✓✔→←↑↓]/g,
            " "
        )

        .replace(
            /\s+/g,
            " "
        )

        .trim();
}


function speak(
    text
){

    if(
        !("speechSynthesis" in window)
    ){

        return;
    }


    const clean=
        cleanSpeechText(
            text
        );


    if(!clean){

        return;
    }


    speechSynthesis.cancel();


    const utterance=
        new SpeechSynthesisUtterance(
            clean
        );


    utterance.lang=
        "tr-TR";

    utterance.rate=
        .92;

    utterance.pitch=
        1;

    utterance.volume=
        1;


    speechSynthesis.speak(
        utterance
    );
}

        siteCommand,

        basicCommand

    ];

async function createDailyPlan(){

        new Date()
            .toLocaleDateString(

        state.tasks
            .filter(
                x=>!x.done

            .join("\n");

        state.goals

            )
            .join("\n");


    const prompt=
`Bugün ${today}.

Kullanıcının bekleyen görevleri:
${taskList||"Yok"}

Hedefleri:
${goalList||"Yok"}

Kullanıcı için uygulanabilir, dengeli bir günlük plan hazırla.

    const plan=

/* =====================================================
   HEDEF KOMUTU
===================================================== */

function goalProgressCommand(
    text
){

    const lower=
        cleanText(text)
            .toLocaleLowerCase(
                "tr-TR"
            );


    const add=
        lower.match(
            /^(?:hedef ekle|hedefim)\s+(.+)$/
        );


    if(add){

        const start=
            text
                .toLocaleLowerCase(
                    "tr-TR"
                )
                .indexOf(
                    add[1]
                );


        const title=
            text
                .slice(start)
                .trim();


        state.goals.push({

            id:Date.now(),

            title,

            progress:0,

            created:Date.now()
        });


        saveJSON(
            STORAGE.goals,
            state.goals
        );


        updateStatus();


        return {
            handled:true,
            response:
                `Hedef eklendi: ${title}`
        };
    }


    if(
        [
            "hedeflerim",
            "hedef listem"
        ].includes(lower)
    ){

        return {
            handled:true,
            response:
                state.goals.length
                    ?state.goals
                        .map(
                            (x,i)=>
                                `${i+1}. ${x.title} — %${x.progress}`
                        )
                        .join("\n")
                    :"Henüz hedef yok."
        };
    }


    const progress=
        lower.match(
            /^(?:hedef ilerleme|hedef ilerlemem)\s+(\d+)\s+(\d+)$/
        );


    if(progress){

        const index=
            Number(progress[1])-1;


        const value=
            Math.max(
                0,
                Math.min(
                    100,
                    Number(progress[2])
                )
            );


        if(
            state.goals[index]
        ){

            state.goals[index].progress=
                value;


            saveJSON(
                STORAGE.goals,
                state.goals
            );


            updateStatus();


            return {
                handled:true,
                response:
                    `Hedef ilerlemesi %${value} olarak kaydedildi.`
            };
        }


        return {
            handled:true,
            response:
                "Hedef bulunamadı."
        };
    }


    return {
        handled:false
    };
}


/* =====================================================
   GÜNLÜK PLAN KOMUTUNU LOCAL'A EKLE
===================================================== */

const originalSmartLocalCommand=
    smartLocalCommand;


smartLocalCommand=
    async function(text){

        const planner=
            plannerLocalCommand(
                text
            );


        if(
            planner.handled
        ){

            return planner;
        }


        const goal=
            goalProgressCommand(
                text
            );


        if(
            goal.handled
        ){

            return goal;
        }


        const lower=
            cleanText(text)
                .toLocaleLowerCase(
                    "tr-TR"
                );


        if(
            lower==="günlük plan oluştur"||
            lower==="gunluk plan olustur"
        ){

            try{

                const plan=
                    await createDailyPlan();


                return {
                    handled:true,
                    response:
                        plan
                };

            }catch{

                return {
                    handled:true,
                    response:
                        "Günlük plan oluşturulamadı."
                };
            }
        }


        return await originalSmartLocalCommand(
            text
        );

async function executeAIMessage(
    text
){

    const needSearch=
        needsWebSearch(
            text
        );


    const systemResult=
        await smartLocalCommand(
            text
        );


    if(
        systemResult &&
        systemResult.handled
    ){

        return {
            text:
                systemResult.response,

            local:true
        };
    }


    if(
        state.settings.auto
    ){

        const answer=
            await askAI(
                text,
                needSearch
            );


        return {
            text:answer,
            local:false
        };
    }


    const answer=
        await askAI(
            text,
            needSearch
        );


    return {
        text:answer,
        local:false
    };
}

===================================================== */

async function sendMessage(
    fromVoice=false
){

    if(
        state.busy
    ){

        return;
    }


    const text=
        cleanText(
            input.value
        );


    if(!text){

        return;
    }


    const shouldSpeak=
        Boolean(
            fromVoice ||
            state.voiceRequest ||
            state.settings.voiceConversation
        );


    state.voiceRequest=
        false;


    addMessage(
        text,
        "user",
        true
    );


    input.value="";


    state.busy=
        true;


    sendButton.disabled=
        true;

    micButton.disabled=
        true;


    statusLine.textContent=
        "AURA DÜŞÜNÜYOR";


    try{

        const result=
            await executeAIMessage(
                text
            );


        if(
            result &&
            result.text
        ){

            addMessage(
                result.text,
                "aura",
                true
            );


            if(
                shouldSpeak
            ){

                speak(
                    result.text
                );
            }


            if(
                state.settings.voiceConversation &&
                state.recognition
            ){

                setTimeout(
                    ()=>{
                        try{

                            state.voiceRequest=
                                true;

                            state.recognition.start();

                        }catch{}
                    },
                    700
                );
            }
        }


    }catch(error){

        console.error(
            "AURA AI HATASI:",
            error
        );


        addMessage(
            "AI bağlantısında bir sorun oluştu. Lütfen tekrar dene.",
            "aura",
            true
        );


    }finally{

        state.busy=
            false;


        sendButton.disabled=
            false;


        micButton.disabled=
            false;


        state.voiceRequest=
            false;


        statusLine.textContent=
            "";


        updateStatus();


        input.focus();
    }
}
