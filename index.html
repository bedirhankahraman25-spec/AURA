<!DOCTYPE html>
<html lang="tr">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<meta name="theme-color"
      content="#02060a">

<title>AURA AI</title>

<style>

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
}

body {
    overflow: hidden;

    font-family:
        Arial,
        sans-serif;

    color: #00eaff;

    background:
        radial-gradient(
            circle at center,
            #06303d 0%,
            #02080c 50%,
            #000000 100%
        );
}

/* =========================
   ÜST BAR
========================= */

.top-bar {

    height: 60px;

    display: flex;

    align-items: center;

    justify-content: space-between;

    padding:
        0 18px;

    background:
        rgba(0,10,15,0.9);

    border-bottom:
        1px solid
        rgba(0,234,255,0.4);
}

.logo {

    font-size: 21px;

    font-weight: bold;

    letter-spacing: 4px;

    text-shadow:
        0 0 10px #00eaff,
        0 0 25px #00eaff;
}

.status {

    font-size: 11px;

    letter-spacing: 2px;

    color:
        #55ffcc;
}

.status::before {

    content: "";

    display:
        inline-block;

    width: 7px;

    height: 7px;

    margin-right: 7px;

    border-radius: 50%;

    background:
        #55ffcc;

    box-shadow:
        0 0 8px #55ffcc,
        0 0 15px #55ffcc;
}

/* =========================
   ANA ALAN
========================= */

.main {

    height:
        calc(100vh - 60px);

    height:
        calc(100dvh - 60px);

    display:
        flex;

    flex-direction:
        column;

    align-items:
        center;

    min-height:
        0;
}

/* =========================
   AURA ÇEKİRDEĞİ
========================= */

.aura-core {

    width:
        210px;

    height:
        210px;

    margin-top:
        10px;

    position:
        relative;

    display:
        flex;

    align-items:
        center;

    justify-content:
        center;

    flex-shrink:
        0;
}

.aura-ring {

    position:
        absolute;

    border-radius:
        50%;

    border:
        1px solid
        #00eaff;

    opacity:
        0.7;
}

.ring1 {

    width:
        135px;

    height:
        135px;

    border-left-color:
        transparent;

    border-right-color:
        transparent;

    animation:
        rotate1 7s linear infinite;
}

.ring2 {

    width:
        175px;

    height:
        175px;

    border-top-color:
        transparent;

    border-bottom-color:
        transparent;

    animation:
        rotate2 10s linear infinite;
}

.ring3 {

    width:
        210px;

    height:
        210px;

    border-left-color:
        transparent;

    border-bottom-color:
        transparent;

    animation:
        rotate1 14s linear infinite;
}

.aura-center {

    width:
        100px;

    height:
        100px;

    border-radius:
        50%;

    border:
        2px solid
        #00eaff;

    display:
        flex;

    align-items:
        center;

    justify-content:
        center;

    color:
        #00eaff;

    font-size:
        21px;

    font-weight:
        bold;

    letter-spacing:
        3px;

    background:
        radial-gradient(
            circle,
            #064454,
            #02090d
        );

    box-shadow:
        0 0 15px #00eaff,
        0 0 45px rgba(0,234,255,0.7),
        inset 0 0 25px rgba(0,234,255,0.5);

    animation:
        pulse 2.2s
        infinite
        ease-in-out;

    z-index:
        5;
}

@keyframes rotate1 {

    from {
        transform:
            rotate(0deg);
    }

    to {
        transform:
            rotate(360deg);
    }
}

@keyframes rotate2 {

    from {
        transform:
            rotate(360deg);
    }

    to {
        transform:
            rotate(0deg);
    }
}

@keyframes pulse {

    0%,
    100% {
        transform:
            scale(1);
    }

    50% {
        transform:
            scale(1.06);
    }
}

/* =========================
   DURUM
========================= */

.aura-status {

    margin-top:
        -8px;

    margin-bottom:
        5px;

    font-size:
        10px;

    letter-spacing:
        3px;

    color:
        #8defff;
}

/* =========================
   SOHBET
========================= */

#chat {

    width:
        min(92%, 600px);

    flex:
        1;

    min-height:
        0;

    overflow-y:
        auto;

    padding:
        5px 5px 10px;
}

.message {

    max-width:
        85%;

    padding:
        10px 13px;

    margin-bottom:
        10px;

    border-radius:
        10px;

    line-height:
        1.4;

    white-space:
        pre-wrap;

    font-size:
        14px;

    word-break:
        break-word;
}

.aura {

    background:
        rgba(0,35,45,0.8);

    margin-right:
        auto;

    border:
        1px solid
        rgba(0,234,255,0.25);
}

.user {

    background:
        rgba(0,90,120,0.8);

    margin-left:
        auto;

    color:
        white;
}

/* =========================
   ALT PANEL
========================= */

#bottom {

    width:
        100%;

    min-height:
        65px;

    display:
        flex;

    align-items:
        center;

    gap:
        8px;

    padding:
        10px;

    background:
        rgba(0,10,15,0.97);

    border-top:
        1px solid
        rgba(0,234,255,0.45);

    z-index:
        10;
}

#input {

    flex:
        1;

    min-width:
        0;

    height:
        45px;

    padding:
        12px;

    border-radius:
        8px;

    border:
        1px solid
        rgba(0,234,255,0.5);

    outline:
        none;

    background:
        rgba(0,25,32,0.95);

    color:
        #00eaff;

    font-size:
        14px;
}

#input::placeholder {

    color:
        #548995;
}

button {

    height:
        45px;

    border:
        1px solid
        #00eaff;

    border-radius:
        8px;

    padding:
        0 14px;

    background:
        rgba(0,60,75,0.9);

    color:
        #00eaff;

    font-size:
        14px;

    cursor:
        pointer;
}

button:active {

    transform:
        scale(0.94);
}

button:disabled {

    opacity:
        0.5;

    cursor:
        not-allowed;
}

.mic-button {

    width:
        45px;

    padding:
        0;

    font-size:
        20px;
}

@media (max-width: 500px) {

    .aura-core {

        transform:
            scale(0.82);

        margin-top:
            0;

        margin-bottom:
            -15px;
    }

    .logo {

        font-size:
            18px;
    }

    button {

        padding:
            0 11px;
    }
}

</style>

</head>

<body>

<div class="top-bar">

    <div class="logo">
        AURA
    </div>

    <div class="status">
        ONLINE
    </div>

</div>

<div class="main">

    <div class="aura-core">

        <div class="aura-ring ring1"></div>

        <div class="aura-ring ring2"></div>

        <div class="aura-ring ring3"></div>

        <div class="aura-center">
            AURA
        </div>

    </div>

    <div class="aura-status">
        AI SYSTEM READY
    </div>

    <div id="chat"></div>

    <div id="bottom">

        <input
            id="input"
            type="text"
            placeholder="AURA'ya bir şey sor..."
            autocomplete="off"
        >

        <button
            class="mic-button"
            id="micButton"
            type="button">
            🎤
        </button>

        <button
            id="sendButton"
            type="button">
            Gönder
        </button>

    </div>

</div>

<script src="https://js.puter.com/v2/"></script>

<script>

/* =====================================================
   AURA TEMEL AYARLARI
===================================================== */

const USER_NAME =
    "Bedirhan Kahraman";

const GIRLFRIEND_NAME =
    "Edanur Kahraman";

const MEMORY_KEY =
    "AURA_MEMORY_V7";

const CHAT_KEY =
    "AURA_CHAT_V7";

const TASK_KEY =
    "AURA_TASKS_V7";

const REMINDER_KEY =
    "AURA_REMINDERS_V7";

const KNOWLEDGE_KEY =
    "AURA_KNOWLEDGE_V7";


/* =====================================================
   ELEMENTLER
===================================================== */

const chat =
    document.getElementById("chat");

const input =
    document.getElementById("input");

const sendButton =
    document.getElementById("sendButton");

const micButton =
    document.getElementById("micButton");


/* =====================================================
   VERİ YARDIMCILARI
===================================================== */

function loadData(
    key,
    fallback
) {

    try {

        const value =
            localStorage.getItem(key);

        if (
            value === null
        ) {

            return fallback;
        }

        return JSON.parse(
            value
        );

    } catch (error) {

        console.error(
            "AURA veri okuma hatası:",
            error
        );

        return fallback;
    }
}


function saveData(
    key,
    value
) {

    try {

        localStorage.setItem(
            key,
            JSON.stringify(value)
        );

        return true;

    } catch (error) {

        console.error(
            "AURA veri kaydetme hatası:",
            error
        );

        return false;
    }
}


function normalizeText(
    text
) {

    return String(
        text || ""
    )
    .toLocaleLowerCase(
        "tr-TR"
    )
    .trim()
    .replace(
        /\s+/g,
        " "
    );
}


/* =====================================================
   GELİŞMİŞ HAFIZA
===================================================== */

function emptyMemory() {

    return {

        identity: {
            name: USER_NAME,
            girlfriend: GIRLFRIEND_NAME
        },

        facts: [],

        preferences: [],

        notes: [],

        important: [],

        history: []
    };
}


let auraMemory =
    loadData(
        MEMORY_KEY,
        emptyMemory()
    );


if (
    !auraMemory ||
    typeof auraMemory !== "object"
) {

    auraMemory =
        emptyMemory();
}


const memoryArrays = [
    "facts",
    "preferences",
    "notes",
    "important",
    "history"
];


memoryArrays.forEach(
    function(type) {

        if (
            !Array.isArray(
                auraMemory[type]
            )
        ) {

            auraMemory[type] = [];
        }
    }
);


function saveMemory() {

    saveData(
        MEMORY_KEY,
        auraMemory
    );
}


function addMemory(
    type,
    text
) {

    if (
        !Array.isArray(
            auraMemory[type]
        )
    ) {

        return false;
    }


    const value =
        String(
            text || ""
        ).trim();


    if (!value) {

        return false;
    }


    const exists =
        auraMemory[type]
            .some(
                function(item) {

                    return normalizeText(
                        item.text
                    ) ===
                    normalizeText(
                        value
                    );
                }
            );


    if (exists) {

        return true;
    }


    auraMemory[type].push({

        text:
            value,

        date:
            new Date()
                .toLocaleString(
                    "tr-TR"
                )

    });


    if (
        auraMemory[type].length >
        150
    ) {

        auraMemory[type] =
            auraMemory[type]
                .slice(-150);
    }


    saveMemory();

    return true;
}


function memoryText() {

    const sections = [];


    sections.push(
        "Kimlik: " +
        USER_NAME +
        ", sevgilisi " +
        GIRLFRIEND_NAME
    );


    if (
        auraMemory.facts.length
    ) {

        sections.push(
            "Bilgiler:\n" +
            auraMemory.facts
                .map(
                    item =>
                        "- " +
                        item.text
                )
                .join("\n")
        );
    }


    if (
        auraMemory.preferences.length
    ) {

        sections.push(
            "Tercihler:\n" +
            auraMemory.preferences
                .map(
                    item =>
                        "- " +
                        item.text
                )
                .join("\n")
        );
    }


    if (
        auraMemory.notes.length
    ) {

        sections.push(
            "Notlar:\n" +
            auraMemory.notes
                .map(
                    item =>
                        "- " +
                        item.text
                )
                .join("\n")
        );
    }


    if (
        auraMemory.important.length
    ) {

        sections.push(
            "Önemli bilgiler:\n" +
            auraMemory.important
                .map(
                    item =>
                        "- " +
                        item.text
                )
                .join("\n")
        );
    }


    return sections.join(
        "\n\n"
    );
}/* =====================================================
   GÖREV SİSTEMİ
===================================================== */

let tasks =
    loadData(
        TASK_KEY,
        []
    );


if (!Array.isArray(tasks)) {

    tasks = [];
}


function saveTasks() {

    saveData(
        TASK_KEY,
        tasks
    );
}


function addTask(
    text
) {

    const value =
        String(
            text || ""
        ).trim();


    if (!value) {

        return false;
    }


    tasks.push({

        id:
            Date.now(),

        text:
            value,

        completed:
            false,

        date:
            new Date()
                .toLocaleString(
                    "tr-TR"
                )

    });


    saveTasks();

    return true;
}


function taskCommand(
    text
) {

    const command =
        normalizeText(
            text
        );


    const prefixes = [
        "görev ekle ",
        "gorev ekle ",
        "yapılacak ekle ",
        "yapilacak ekle "
    ];


    for (
        const prefix
        of prefixes
    ) {

        if (
            command.startsWith(
                prefix
            )
        ) {

            const value =
                text
                    .substring(
                        prefix.length
                    )
                    .trim();


            if (!value) {

                return "Eklememi istediğin görevi yaz.";
            }


            addTask(
                value
            );


            return (
                "Görev eklendi: " +
                value
            );
        }
    }


    if (
        command === "görevlerim" ||
        command === "gorevlerim" ||
        command === "görevlerimi göster" ||
        command === "gorevlerimi goster"
    ) {

        const active =
            tasks.filter(
                task =>
                    !task.completed
            );


        if (
            active.length === 0
        ) {

            return (
                "Bekleyen görevin yok."
            );
        }


        return (
            "Bekleyen görevlerin:\n\n" +
            active
                .map(
                    (
                        task,
                        index
                    ) =>
                        (
                            index +
                            1
                        ) +
                        ". " +
                        task.text
                )
                .join("\n")
        );
    }


    if (
        command ===
            "görevleri temizle" ||
        command ===
            "gorevleri temizle"
    ) {

        tasks = [];

        saveTasks();

        return (
            "Görev listesi temizlendi."
        );
    }


    return null;
}


/* =====================================================
   HATIRLATICI
===================================================== */

let reminders =
    loadData(
        REMINDER_KEY,
        []
    );


if (
    !Array.isArray(
        reminders
    )
) {

    reminders = [];
}


function saveReminders() {

    saveData(
        REMINDER_KEY,
        reminders
    );
}


function addReminder(
    text,
    timestamp
) {

    reminders.push({

        id:
            Date.now(),

        text:
            text,

        time:
            timestamp,

        done:
            false

    });


    saveReminders();
}


function reminderCommand(
    text
) {

    const command =
        normalizeText(
            text
        );


    const match =
        command.match(
            /^hatırlatıcı\s+ekle\s+(\d{1,2}):(\d{2})\s+(.+)$/i
        );


    if (match) {

        const hour =
            Number(
                match[1]
            );

        const minute =
            Number(
                match[2]
            );

        const message =
            text
                .trim()
                .replace(
                    /^hatırlatıcı\s+ekle\s+\d{1,2}:\d{2}\s+/i,
                    ""
                )
                .trim();


        if (
            hour > 23 ||
            minute > 59
        ) {

            return (
                "Saat formatı hatalı."
            );
        }


        const now =
            new Date();


        const target =
            new Date();


        target.setHours(
            hour,
            minute,
            0,
            0
        );


        if (
            target <= now
        ) {

            target.setDate(
                target.getDate() +
                1
            );
        }


        addReminder(
            message,
            target.getTime()
        );


        return (
            "Tamam. " +
            target.toLocaleString(
                "tr-TR"
            ) +
            " için hatırlatıcı kuruldu."
        );
    }


    if (
        command ===
            "hatırlatıcılarım" ||
        command ===
            "hatirlaticilarim"
    ) {

        const active =
            reminders.filter(
                reminder =>
                    !reminder.done
            );


        if (
            active.length === 0
        ) {

            return (
                "Bekleyen hatırlatıcın yok."
            );
        }


        return (
            "Hatırlatıcıların:\n\n" +
            active
                .map(
                    reminder =>
                        "- " +
                        new Date(
                            reminder.time
                        )
                        .toLocaleString(
                            "tr-TR"
                        ) +
                        " → " +
                        reminder.text
                )
                .join("\n")
        );
    }


    if (
        command ===
            "hatırlatıcıları temizle" ||
        command ===
            "hatirlaticilari temizle"
    ) {

        reminders = [];

        saveReminders();

        return (
            "Hatırlatıcılar temizlendi."
        );
    }


    return null;
}


/* =====================================================
   HATIRLATICI KONTROLÜ
===================================================== */

function checkReminders() {

    const now =
        Date.now();


    let changed =
        false;


    reminders.forEach(
        function(reminder) {

            if (
                !reminder.done &&
                reminder.time <= now
            ) {

                reminder.done =
                    true;

                changed =
                    true;


                addMessage(
                    "⏰ Hatırlatıcı: " +
                    reminder.text,
                    "aura"
                );


                speak(
                    "Hatırlatıcı. " +
                    reminder.text
                );
            }
        }
    );


    if (changed) {

        saveReminders();
    }
}


setInterval(
    checkReminders,
    5000
);


/* =====================================================
   TARİH / SAAT
===================================================== */

function localCommand(
    text
) {

    const command =
        normalizeText(
            text
        );


    if (
        command === "saat kaç" ||
        command === "saat kac" ||
        command === "şu an saat kaç" ||
        command === "su an saat kac"
    ) {

        return (
            "Şu an saat " +
            new Date()
                .toLocaleTimeString(
                    "tr-TR",
                    {
                        hour:
                            "2-digit",
                        minute:
                            "2-digit"
                    }
                ) +
            "."
        );
    }


    if (
        command === "bugün tarih ne" ||
        command === "bugun tarih ne" ||
        command === "tarih ne" ||
        command === "bugünün tarihi" ||
        command === "bugunun tarihi"
    ) {

        return (
            "Bugün " +
            new Date()
                .toLocaleDateString(
                    "tr-TR",
                    {
                        weekday:
                            "long",
                        year:
                            "numeric",
                        month:
                            "long",
                        day:
                            "numeric"
                    }
                ) +
            "."
        );
    }


    if (
        command === "ben kimim"
    ) {

        return (
            "Sen " +
            USER_NAME +
            "'sın."
        );
    }


    if (
        command ===
            "sevgilim kim" ||
        command ===
            "sevgilimin adı ne" ||
        command ===
            "sevgilimin adi ne"
    ) {

        return (
            "Sevgilinin adı " +
            GIRLFRIEND_NAME +
            "."
        );
    }


    if (
        command ===
            "sen kimsin" ||
        command ===
            "adın ne" ||
        command ===
            "adin ne"
    ) {

        return (
            "Ben AURA. " +
            "Kişisel yapay zeka asistanınım."
        );
    }


    return null;
              }/* =====================================================
   GELİŞMİŞ HAFIZA KOMUTLARI
===================================================== */

function memoryCommand(
    text
) {

    const command =
        normalizeText(
            text
        );


    const notePrefixes = [
        "not al ",
        "not kaydet ",
        "bunu not al ",
        "bunu kaydet ",
        "hafızana kaydet ",
        "hafizana kaydet "
    ];


    for (
        const prefix
        of notePrefixes
    ) {

        if (
            command.startsWith(
                prefix
            )
        ) {

            const value =
                text
                    .substring(
                        prefix.length
                    )
                    .trim();


            if (!value) {

                return (
                    "Kaydedilecek notu belirt."
                );
            }


            addMemory(
                "notes",
                value
            );


            return (
                "Tamam. Notu kalıcı hafızama kaydettim."
            );
        }
    }


    const factPrefixes = [
        "bunu hatırla ",
        "bunu hatirla ",
        "bunu hafızana al ",
        "bunu hafizana al ",
        "bunu hafızanda tut ",
        "bunu hafizanda tut ",
        "bunu unutma "
    ];


    for (
        const prefix
        of factPrefixes
    ) {

        if (
            command.startsWith(
                prefix
            )
        ) {

            const value =
                text
                    .substring(
                        prefix.length
                    )
                    .trim();


            if (!value) {

                return (
                    "Hatırlanacak bilgiyi belirt."
                );
            }


            addMemory(
                "facts",
                value
            );


            return (
                "Tamam. Bunu kalıcı hafızama kaydettim."
            );
        }
    }


    const preferencePrefixes = [
        "tercihimi hatırla ",
        "tercihimi hatirla ",
        "şunu seviyorum ",
        "sunu seviyorum ",
        "şunu sevmiyorum ",
        "sunu sevmiyorum "
    ];


    for (
        const prefix
        of preferencePrefixes
    ) {

        if (
            command.startsWith(
                prefix
            )
        ) {

            const value =
                text

        ) ||
        command.startsWith(
            importantPrefix2
        )
    ) {

        const prefix =
            command.startsWith(
                importantPrefix
            )

    if (

        command ===

function knowledgeCommand(
    text
) {

    const command =
        normalizeText(
            text
        );


    const prefix =
        "bilgi ekle ";


    if (
        command.startsWith(
            prefix
        )
    ) {

        const raw =
            text
                .substring(
                    prefix.length
                )
                .trim();


        const separator =
            raw.indexOf(
                "|"
            );


        if (
            separator === -1
        ) {

            return (
                "Şu formatı kullan:\n" +
                "bilgi ekle Başlık | Bilgi"
            );
        }


        const title =
            raw
                .substring(
                    0,
                    separator
                )
                .trim();


        const content =
            raw
                .substring(
                    separator + 1
                )
                .trim();


        if (
            addKnowledge(
                title,
                content
            )
        ) {

            return (
                "Bilgi tabanına eklendi: " +
                title
            );
        }


        return (
            "Bilgi eklenemedi."
        );
    }


    if (
        command ===
            "bilgi tabanım" ||
        command ===
            "bilgi tabanimi"
    ) {

        if (
            knowledge.length === 0
        ) {

            return (
                "Bilgi tabanı henüz boş."
            );
        }


        return (
            "Bilgi tabanında " +
            knowledge.length +
            " kayıt var.\n\n" +

    }


    return null;
}


/* =====================================================
   BİLGİ TABANI ARAMA
===================================================== */

function searchKnowledge(
    query
) {

    const words =
        normalizeText(
            query
        )
        .split(
            " "
        )
        .filter(
            word =>
                word.length > 2
        );


    if (
        words.length === 0
    ) {

        return [];
    }


    return knowledge
        .map(
            function(item) {

                const haystack =
                    normalizeText(
                        item.title +
                        " " +
                        item.content
                    );


                let score = 0;


                words.forEach(
                    function(word) {

                        if (
                            haystack.includes(
                                word
                            )
                        ) {

                            score++;
                        }
                    }
                );


                return {
                    item,
                    score
                };
            }
        )
        .filter(
            result =>
                result.score > 0
        )
        .sort(
            (
                a,
                b
            ) =>
                b.score -
                a.score
        )
        .slice(
            0,
            8
        )
        .map(
            result =>
                result.item
        );
}


/* =====================================================
   BASİT HESAPLAMA
===================================================== */

function calculate(
    text
) {

    let expression =
        normalizeText(
            text
        );


    expression =
        expression
            .replace(
                /kaç eder/g,
                ""
            )
            .replace(
                /kac eder/g,
                ""
            )
            .replace(
                /hesapla/g,
                ""
            )
            .trim();


    if (
        !expression ||
        !/[0-9]/.test(
            expression
        )
    ) {

        return null;
    }


    if (
        !/^[0-9+\-*/%().,\s^]+$/
            .test(
                expression
            )
    ) {

        return null;
    }


    try {

        expression =
            expression
                .replace(
                    /,/g,
                    "."
                )
                .replace(
                    /\^/g,
                    "**"
                );


        const result =
            Function(
                '"use strict"; return (' +
                expression +
                ')'
            )();


        if (
            typeof result !==
                "number" ||
            !Number.isFinite(
                result
            )
        ) {

            return null;
        }


        return (
            "Sonuç: " +
            result
        );

    } catch (
        error
    ) {

        return null;
    }
}

===================================================== */

function chooseLocalFile() {

    return new Promise(
        function(resolve) {

            const picker =
                document.createElement(
                    "input"
                );


            picker.type =
                "file";


            picker.accept =
                ".txt,.md,.json,.csv,.html,.js,.css";


            picker.onchange =
                function(event) {

                    const file =
                        event
                            .target
                            .files[0];


                    if (!file) {

                        resolve(
                            null
                        );

                        return;
                    }


                    const reader =
                        new FileReader();


                    reader.onload =
                        function() {

                            resolve({

                                name:
                                    file.name,

                                content:
                                    String(
                                        reader.result
                                    )

                            });
                        };


                    reader.onerror =
                        function() {

                            resolve(
                                null
                            );
                        };


                    reader.readAsText(
                        file
                    );
                };


            picker.click();
        }
    );
}

function extractAnswer(
    response
) {

    if (!response) {

        return "";
    }


    if (
        typeof response ===
            "string"
    ) {

        return response.trim();
    }


    if (
        response.message &&
        typeof response.message.content ===
            "string"
    ) {

        return response.message.content.trim();
    }


    if (
        response.message &&
        Array.isArray(
            response.message.content
        )
    ) {

        return response.message.content
            .map(
                function(part) {

                    if (
                        typeof part ===
                            "string"
                    ) {

                        return part;
                    }


                    return (
                        part &&
                        part.text
                    )
                    || "";
                }
            )
            .join("")
            .trim();
    }


    if (
        typeof response.text ===
            "string"
    ) {

        return response.text.trim();
    }


    return "";
}

        );

}


/* =====================================================
   AI AJAN
===================================================== */

async function askAgent(
    text
) {

    const ready =
        await waitForPuter();


    if (!ready) {

        return (
            "AURA AI bağlantısı hazır değil."
        );
    }


    const messages = [

        {
            role:
                "system",

            content:
                buildSystemPrompt(
                    text
                )
        },

        {
            role:
                "user",

            content:
                text
        }

    ];


    try {

        let response =
            await puter.ai.chat(
                messages,
                {
                    model:
                        "gpt-5.4-nano",

                    tools:
                        agentTools
                }
            );


        let loops = 0;


        while (
            response &&
            response.message &&
            Array.isArray(
                response.message.tool_calls
            ) &&
            response.message.tool_calls.length > 0 &&
            loops < 5
        ) {

            loops++;


            messages.push(
                response.message
            );


            for (
                const toolCall
                of response.message.tool_calls
            ) {

                let args = {};


                try {

                    args =
                        JSON.parse(
                            toolCall
                                .function
                                .arguments ||
                            "{}"
                        );

                } catch (
                    error
                ) {

                    args = {};
                }


                const result =
                    await executeAgentTool(
                        toolCall
                            .function
                            .name,

                        args
                    );


                messages.push({

                    role:
                        "tool",

                    tool_call_id:
                        toolCall.id,

                    content:
                        String(
                            result
                        )
                });
            }


            response =
                await puter.ai.chat(
                    messages,
                    {
                        model:
                            "gpt-5.4-nano",

                        tools:
                            agentTools
                    }
                );
        }


        const answer =
            extractAnswer(
                response
            );


        if (
            answer
        ) {

            return answer;
        }


        return (
            "AURA cevap oluşturamadı."
        );

    } catch (
        error
    ) {

        console.error(
            "AJAN HATASI:",
            error
        );


        return await askNormalAI(
            text
        );
    }
}

/* =====================================================
   GÜNCEL BİLGİ
===================================================== */

function needsWebSearch(
    text
) {

    const command =
        normalizeText(
            text
        );


    const words = [

        "internette ara",

        "internetten ara",

        "internette araştır",

        "internetten araştır",

        "webde ara",

        "web'de ara",

        "güncel bilgi",

        "guncel bilgi",

        "son dakika",

        "güncel haber",

        "guncel haber",

        "haberler",

        "hava durumu"

    ];


    return words.some(
        word =>
            command.includes(
                word
            )
    );
}

/* =====================================================
   SES TEMİZLEME
===================================================== */

function cleanSpeechText(
    text
) {

    return String(
        text || ""
    )

    .replace(
        /https?:\/\/\S+/gi,
        " "
    )

    .replace(
        /[\p{Emoji_Presentation}\p{Extended_Pictographic}]/gu,
        " "
    )

    .replace(
        /[.,!?;:"'“”‘’()[\]{}<>…\/\\|@#$%^&*_+=~`-]/g,
        " "
    )

    .replace(
        /\s+/g,
        " "
    )

    .trim();
}


/* =====================================================
   SESLİ CEVAP
===================================================== */

function speak(
    text
) {

    if (
        !(
            "speechSynthesis"
            in window
        )
    ) {

        return;
    }


    const clean =
        cleanSpeechText(
            text
        );


    if (!clean) {

        return;
    }


    try {

        window.speechSynthesis.cancel();


        const utterance =
            new SpeechSynthesisUtterance(
                clean
            );


        utterance.lang =
            "tr-TR";

        utterance.rate =
            0.9;

        utterance.pitch =
            1;

        utterance.volume =
            1;


        window.speechSynthesis.speak(
            utterance
        );

    } catch (
        error
    ) {

        console.error(
            "SES HATASI:",
            error
        );
    }
      }/* =====================================================

function saveChat() {

    ) {

            );
    }


    saveData(
        CHAT_KEY,

    );
}


function addSavedChat(
    text,
    type
) {

    savedChat.push({

        text:
            String(
                text
            ),

        type:
            type,

        date:
            Date.now()

    });

}


/* =====================================================
   MESAJ GÖSTER
===================================================== */

function addMessage(
    text,
    type,
    save = true
) {

    const message =
        document.createElement(
            "div"
        );


    message.className =
        "message " +
        type;


    message.textContent =
        String(
            text
        );


    chat.appendChild(
        message
    );


    chat.scrollTop =
        chat.scrollHeight;


    if (
        save &&
        (
            type === "user" ||
            type === "aura"
        )
    ) {

        addSavedChat(
            text,
            type
        );
    }
}


/* =====================================================
   SOHBETİ GERİ YÜKLE
===================================================== */

function restoreChat() {

    if (
        savedChat.length === 0
    ) {

        addMessage(
            "Merhaba. Ben AURA AI.\n\nSistem hazır. Seni dinliyorum.",
            "aura"
        );

        return;
    }


    savedChat
        .slice(-40)
        .forEach(
            function(item) {

                addMessage(
                    item.text,
                    item.type,
                    false
                );
            }
        );


    chat.scrollTop =
        chat.scrollHeight;
}


/* =====================================================
   MİKROFON
===================================================== */

const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;


let recognition =
    null;


let isListening =
    false;


if (
    SpeechRecognition
) {

    recognition =
        new SpeechRecognition();


    recognition.lang =
        "tr-TR";


    recognition.continuous =
        false;


    recognition.interimResults =
        false;


    recognition.maxAlternatives =
        1;


    recognition.onstart =
        function() {

            isListening =
                true;

            micButton.textContent =
                "🔴";

            micButton.disabled =
                false;
        };


    recognition.onend =
        function() {

            isListening =
                false;

            micButton.textContent =
                "🎤";

            micButton.disabled =
                false;
        };


    recognition.onerror =
        function(event) {

            console.error(
                "MİKROFON:",
                event
            );


            isListening =
                false;

            micButton.textContent =
                "🎤";

            micButton.disabled =
                false;


            if (
                event.error ===
                "not-allowed"
            ) {

                addMessage(
                    "Mikrofon izni verilmemiş. Tarayıcıdan mikrofon iznini aç.",
                    "aura"
                );
            }
        };


    recognition.onresult =
        function(event) {

            const text =
                event
                    .results[0][0]
                    .transcript
                    .trim();


            if (!text) {

                return;
            }


            input.value =
                text;


            sendMessage(
                true
            );
        };
}


/* =====================================================
   MİKROFON BUTONU
===================================================== */

micButton.addEventListener(
    "click",
    function() {

        if (
            !recognition
        ) {

            addMessage(
                "Bu tarayıcı sesli komutu desteklemiyor. Chrome kullanmayı deneyebilirsin.",
                "aura"
            );

            return;
        }


        if (
            isListening
        ) {

            try {

                recognition.stop();

            } catch (
                error
            ) {

                console.error(
                    error
                );
            }

            return;
        }


        try {

            recognition.start();

        } catch (
            error
        ) {

            console.error(
                "Mikrofon başlatılamadı:",
                error
            );
        }
    }
);


/* =====================================================
   ANA MESAJ MOTORU
===================================================== */

let processing =
    false;


async function sendMessage(
    voiceMode = false
) {

    if (
        processing
    ) {

        return;
    }


    const text =
        input.value.trim();


    if (!text) {

        return;
    }


    input.value =
        "";


    addMessage(
        text,
        "user"
    );


    addMessage(
        "Düşünüyorum...",
        "aura"
    );


    const loading =
        chat.lastElementChild;


    processing =
        true;


    sendButton.disabled =
        true;

    micButton.disabled =
        true;


    try {

        let reply =
            null;


        /* -------------------------
           YEREL KOMUTLAR
        ------------------------- */

        reply =
            localCommandHandler(
                text
            );


        /* -------------------------
           DOSYA
        ------------------------- */

        if (
            reply === null
        ) {

            reply =
                await fileCommand(
                    text
                );
        }


        /* -------------------------
           SİTE AÇ
        ------------------------- */

        if (
            reply === null
        ) {

            reply =
                openSiteCommand(
                    text
                );
        }


        /* -------------------------
           AI AJAN
        ------------------------- */

        if (
            reply === null
        ) {

            if (
                needsWebSearch(
                    text
                )
            ) {

                reply =
                    await askAIWithWeb(
                        text
                    );

            } else {

                reply =
                    await askAgent(
                        text
                    );
            }
        }


        if (!reply) {

            reply =
                "AURA cevap oluşturamadı.";
        }


        if (
            loading
        ) {

            loading.remove();
        }


        addMessage(
            reply,
            "aura"
        );


        if (
            voiceMode
        ) {

            speak(
                reply
            );
        }

    } catch (
        error
    ) {

        console.error(
            "MESAJ MOTORU:",
            error
        );


        if (
            loading
        ) {

            loading.remove();
        }


        addMessage(
            "Bir hata oluştu. Tekrar deneyelim.",
            "aura"
        );

    } finally {

        processing =
            false;

        sendButton.disabled =
            false;

        micButton.disabled =
            false;

        input.focus();
    }
}


/* =====================================================
   GÖNDER
===================================================== */

sendButton.addEventListener(
    "click",
    function() {

        sendMessage(

        );
    }
);
