<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#02060a">
<title>AURA AI</title>

<style>
*{box-sizing:border-box}

html,body{
    margin:0;
    width:100%;
    height:100%;
}

body{
    overflow:hidden;
    font-family:Arial,sans-serif;
    color:#00eaff;
    background:
        radial-gradient(
            circle at center,
            #06303d 0%,
            #02080c 50%,
            #000 100%
        );
}

.top-bar{
    height:60px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 18px;
    background:rgba(0,10,15,.9);
    border-bottom:1px solid rgba(0,234,255,.4);
}

.logo{
    font-size:21px;
    font-weight:bold;
    letter-spacing:4px;
    text-shadow:
        0 0 10px #00eaff,
        0 0 25px #00eaff;
}

.status{
    font-size:11px;
    letter-spacing:2px;
    color:#55ffcc;
}

.status::before{
    content:"";
    display:inline-block;
    width:7px;
    height:7px;
    margin-right:7px;
    border-radius:50%;
    background:#55ffcc;
    box-shadow:
        0 0 8px #55ffcc,
        0 0 15px #55ffcc;
}

.main{
    height:calc(100vh - 60px);
    height:calc(100dvh - 60px);
    display:flex;
    flex-direction:column;
    align-items:center;
    min-height:0;
}

.aura-core{
    width:210px;
    height:210px;
    margin-top:10px;
    position:relative;
    display:flex;
    align-items:center;
    justify-content:center;
    flex-shrink:0;
}

.aura-ring{
    position:absolute;
    border-radius:50%;
    border:1px solid #00eaff;
    opacity:.7;
}

.ring1{
    width:135px;
    height:135px;
    border-left-color:transparent;
    border-right-color:transparent;
    animation:rotate1 7s linear infinite;
}

.ring2{
    width:175px;
    height:175px;
    border-top-color:transparent;
    border-bottom-color:transparent;
    animation:rotate2 10s linear infinite;
}

.ring3{
    width:210px;
    height:210px;
    border-left-color:transparent;
    border-bottom-color:transparent;
    animation:rotate1 14s linear infinite;
}

.aura-center{
    width:100px;
    height:100px;
    border-radius:50%;
    border:2px solid #00eaff;
    display:flex;
    align-items:center;
    justify-content:center;
    color:#00eaff;
    font-size:21px;
    font-weight:bold;
    letter-spacing:3px;
    background:
        radial-gradient(
            circle,
            #064454,
            #02090d
        );
    box-shadow:
        0 0 15px #00eaff,
        0 0 45px rgba(0,234,255,.7),
        inset 0 0 25px rgba(0,234,255,.5);
    animation:pulse 2.2s infinite ease-in-out;
    z-index:5;
}

@keyframes rotate1{
    from{transform:rotate(0deg)}
    to{transform:rotate(360deg)}
}

@keyframes rotate2{
    from{transform:rotate(360deg)}
    to{transform:rotate(0deg)}
}

@keyframes pulse{
    0%,100%{transform:scale(1)}
    50%{transform:scale(1.06)}
}

.aura-status{
    margin-top:-8px;
    margin-bottom:5px;
    font-size:10px;
    letter-spacing:3px;
    color:#8defff;
}

#chat{
    width:min(92%,600px);
    flex:1;
    min-height:0;
    overflow-y:auto;
    padding:5px 5px 10px;
}

.message{
    max-width:85%;
    padding:10px 13px;
    margin-bottom:10px;
    border-radius:10px;
    line-height:1.4;
    white-space:pre-wrap;
    font-size:14px;
    animation:messageIn .2s ease-out;
}

@keyframes messageIn{
    from{
        opacity:0;
        transform:translateY(5px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

.aura{
    background:rgba(0,35,45,.8);
    margin-right:auto;
    border:1px solid rgba(0,234,255,.25);
}

.user{
    background:rgba(0,90,120,.8);
    margin-left:auto;
    color:white;
}

#bottom{
    width:100%;
    min-height:65px;
    display:flex;
    align-items:center;
    gap:8px;
    padding:10px;
    background:rgba(0,10,15,.97);
    border-top:1px solid rgba(0,234,255,.45);
    z-index:10;
}

#input{
    flex:1;
    min-width:0;
    height:45px;
    padding:12px;
    border-radius:8px;
    border:1px solid rgba(0,234,255,.5);
    outline:none;
    background:rgba(0,25,32,.95);
    color:#00eaff;
    font-size:14px;
}

#input::placeholder{
    color:#548995;
}

button{
    height:45px;
    border:1px solid #00eaff;
    border-radius:8px;
    padding:0 14px;
    background:rgba(0,60,75,.9);
    color:#00eaff;
    font-size:14px;
    cursor:pointer;
}

button:active{
    transform:scale(.94);
}

button:disabled{
    opacity:.5;
}

.mic-button{
    width:45px;
    padding:0;
    font-size:20px;
}

@media(max-width:500px){
    .aura-core{
        transform:scale(.82);
        margin-top:0;
        margin-bottom:-15px;
    }

    .logo{
        font-size:18px;
    }

    button{
        padding:0 11px;
    }
}
</style>
</head>

<body>

<div class="top-bar">

    <div class="logo">AURA</div>

    <div class="status">ONLINE</div>

</div>

<div class="main">

    <div class="aura-core">

        <div class="aura-ring ring1"></div>
        <div class="aura-ring ring2"></div>
        <div class="aura-ring ring3"></div>

        <div class="aura-center">
            AURA
        </div>

    </div>

    <div class="aura-status">
        AI SYSTEM READY
    </div>

    <div id="chat"></div>

    <div id="bottom">

        <input
            id="input"
            type="text"
            placeholder="AURA'ya bir şey sor..."
            autocomplete="off"
        >

        <button
            class="mic-button"
            id="micButton"
            type="button">
            🎤
        </button>

        <button
            id="sendButton"
            type="button">
            Gönder
        </button>

    </div>

</div>

<script src="https://js.puter.com/v2/"></script>

<script>

const chat =
    document.getElementById("chat");

const input =
    document.getElementById("input");

const sendButton =
    document.getElementById("sendButton");

const micButton =
    document.getElementById("micButton");


/* =========================
   KİŞİSEL BİLGİLER
========================= */

const userName =
    "Bedirhan Kahraman";

const girlfriendName =
    "Edanur Kahraman";


/* =========================
   AURA KİMLİĞİ
========================= */

const systemPrompt = `

Sen AURA adında kişisel yapay zeka asistanısın.

Türkçe konuş.

Doğal ve akıcı konuş.

Kullanıcının adı Bedirhan Kahraman.

Fakat her cevapta Bedirhan deme.

Cevapların başında gereksiz şekilde
"Bedirhan" diye hitap etme.

Kullanıcı "ben kimim" diye sorarsa
Bedirhan Kahraman olduğunu söyle.

Kullanıcının sevgilisinin adı
Edanur Kahraman.

Edanur, kullanıcının sevgilisidir.

Kullanıcı Edanur hakkında soru
sorarsa mevcut bilgileri kullan.

Bilmediğin kişisel bilgileri uydurma.

Kısa sorulara gereksiz uzun cevap
verme.

Kullanıcı detay isterse detaylandır.

Sen AURA'sın.

`;


/* =========================
   KONUŞMA HAFIZASI
========================= */

const MEMORY_KEY =
    "AURA_CONVERSATION_MEMORY_V2";

const HISTORY_KEY =
    "AURA_MESSAGE_HISTORY_V2";

let conversation = [

    {
        role:"system",
        content:systemPrompt
    }

];


/* =========================
   HAFIZA YÜKLE
========================= */

function loadMemory(){

    try{

        const saved =
            localStorage.getItem(
                MEMORY_KEY
            );

        if(!saved){
            return;
        }

        const data =
            JSON.parse(saved);

        if(
            Array.isArray(data)
            &&
            data.length
        ){

            const system =
                data.find(
                    x =>
                        x.role ===
                        "system"
                );

            const messages =
                data.filter(
                    x =>
                        x.role !==
                        "system"
                );

            conversation = [
                system || {
                    role:"system",
                    content:systemPrompt
                },
                ...messages.slice(-80)
            ];
        }

    }catch(error){

        console.error(
            "HAFIZA YUKLEME:",
            error
        );

    }
}


/* =========================
   HAFIZA KAYDET
========================= */

function saveMemory(){

    try{

        localStorage.setItem(
            MEMORY_KEY,
            JSON.stringify(
                conversation.slice(-81)
            )
        );

    }catch(error){

        console.error(
            "HAFIZA KAYDETME:",
            error
        );
    }
}


/* =========================
   MESAJ GÖSTER
========================= */

function addMessage(
    text,
    type
){

    const message =
        document.createElement(
            "div"
        );

    message.className =
        "message " + type;

    message.textContent =
        text;

    chat.appendChild(
        message
    );

    chat.scrollTop =
        chat.scrollHeight;
}


/* =========================
   BİLGİ TABANI
========================= */

let auraKnowledge = null;

async function loadKnowledge(){

    try{

        const response =
            await fetch(
                "knowledge.json",
                {
                    cache:"no-cache"
                }
            );

        if(!response.ok){

            throw new Error(
                "knowledge.json bulunamadı"
            );
        }

        auraKnowledge =
            await response.json();

        console.log(
            "AURA bilgi tabanı hazır."
        );

    }catch(error){

        console.error(
            "BİLGİ TABANI:",
            error
        );

        auraKnowledge = null;
    }
}


/* =========================
   BİLGİ ARAMA
========================= */

function normalizeText(text){

    return text
        .toLocaleLowerCase("tr-TR")
        .replace(/[?!.,;:]/g," ")
        .replace(/\s+/g," ")
        .trim();
}


function searchKnowledge(text){

    if(
        !auraKnowledge ||
        !auraKnowledge.knowledge
    ){

        return null;
    }

    const query =
        normalizeText(text);

    let bestAnswer = null;
    let bestScore = 0;


    for(
        const category
        of Object.values(
            auraKnowledge.knowledge
        )
    ){

        if(
            !Array.isArray(category)
        ){

            continue;
        }


        for(
            const item
            of category
        ){

            if(
                !item ||
                !item.question ||
                !item.answer
            ){

                continue;
            }


            const question =
                normalizeText(
                    item.question
                );


            if(
                query === question
            ){

                return item.answer;
            }


            const words =
                question
                    .split(" ")
                    .filter(
                        word =>
                            word.length >= 3
                    );


            let matches = 0;


            for(
                const word
                of words
            ){

                if(
                    query.includes(word)
                ){

                    matches++;
                }
            }


            if(!words.length){
                continue;
            }


            const score =
                matches /
                words.length;


            if(
                score > bestScore
                &&
                score >= 0.65
            ){

                bestScore =
                    score;

                bestAnswer =
                    item.answer;
            }
        }
    }


    return bestAnswer;
}


loadMemory();

loadKnowledge();

</script><script>

/* =========================
   TARİH / SAAT
========================= */

function getDateInfo(){

    const now =
        new Date();

    return {

        date:
            now.toLocaleDateString(
                "tr-TR",
                {
                    weekday:"long",
                    year:"numeric",
                    month:"long",
                    day:"numeric"
                }
            ),

        time:
            now.toLocaleTimeString(
                "tr-TR",
                {
                    hour:"2-digit",
                    minute:"2-digit",
                    second:"2-digit"
                }
            )
    };
}


/* =========================
   HESAPLAMA
========================= */

function calculateExpression(text){

    let expression =
        normalizeText(text);


    expression =
        expression
            .replace(
                /kaç eder/g,
                ""
            )
            .replace(
                /hesapla/g,
                ""
            )
            .replace(
                /hesaplar mısın/g,
                ""
            )
            .replace(
                /hesaplar misin/g,
                ""
            )
            .replace(
                /sonuç nedir/g,
                ""
            )
            .replace(
                /sonuc nedir/g,
                ""
            )
            .trim();


    /*
       Sadece temel matematik
       karakterlerine izin veriyoruz.
    */

    if(
        !/^[0-9+\-*/().%\s]+$/
            .test(expression)
    ){

        return null;
    }


    if(
        !/[+\-*/%]/
            .test(expression)
    ){

        return null;
    }


    try{

        const result =
            Function(
                '"use strict";return(' +
                expression +
                ')'
            )();


        if(
            typeof result ===
            "number"
            &&
            Number.isFinite(result)
        ){

            return result;
        }

    }catch(error){

        return null;
    }


    return null;
}


/* =========================
   YEREL KOMUTLAR
========================= */

function handleLocalCommand(text){

    const command =
        normalizeText(text);

    const info =
        getDateInfo();


    /* SAAT */

    if(
        command === "saat kaç"
        ||
        command.includes(
            "şu an saat kaç"
        )
        ||
        command.includes(
            "su an saat kac"
        )
        ||
        command.includes(
            "saat kaç oldu"
        )
        ||
        command.includes(
            "saat kac oldu"
        )
    ){

        return (
            "Şu an saat " +
            info.time +
            "."
        );
    }


    /* TARİH */

    if(
        command.includes(
            "bugün tarih ne"
        )
        ||
        command.includes(
            "bugunun tarihi ne"
        )
        ||
        command.includes(
            "bugün günlerden ne"
        )
        ||
        command.includes(
            "bugun gunlerden ne"
        )
    ){

        return (
            "Bugün " +
            info.date +
            "."
        );
    }


    /* BUGÜN */

    if(
        command === "bugün"
        ||
        command === "bugun"
    ){

        return (
            "Bugün " +
            info.date +
            ". Saat " +
            info.time +
            "."
        );
    }


    /* KİMLİK */

    if(
        command.includes(
            "ben kimim"
        )
        ||
        command.includes(
            "benim adım ne"
        )
        ||
        command.includes(
            "benim adim ne"
        )
        ||
        command.includes(
            "ismim ne"
        )
    ){

        return (
            "Sen Bedirhan Kahraman'sın."
        );
    }


    /* EDANUR */

    if(
        command.includes(
            "edanur kim"
        )
        ||
        command.includes(
            "edanur kimdir"
        )
        ||
        command.includes(
            "sevgilim kim"
        )
        ||
        command.includes(
            "sevgilimin adı ne"
        )
        ||
        command.includes(
            "sevgilimin adi ne"
        )
    ){

        return (
            "Sevgilinin adı Edanur Kahraman."
        );
    }


    /* AURA */

    if(
        command === "sen kimsin"
        ||
        command === "adın ne"
        ||
        command === "adin ne"
        ||
        command ===
        "senin adın ne"
        ||
        command ===
        "senin adin ne"
    ){

        return (
            "Ben AURA. " +
            "Kişisel yapay zeka " +
            "asistanınım."
        );
    }


    /* SELAMLAMA */

    if(
        command === "merhaba"
        ||
        command === "selam"
        ||
        command === "selam aura"
        ||
        command === "merhaba aura"
    ){

        return (
            "Merhaba. Seni dinliyorum."
        );
    }


    /* ŞAKA */

    if(
        command.includes(
            "şaka yap"
        )
        ||
        command.includes(
            "saka yap"
        )
        ||
        command.includes(
            "bana şaka anlat"
        )
        ||
        command.includes(
            "bana saka anlat"
        )
    ){

        const jokes = [

            "Matematik kitabı neden ağlamış? Çünkü çok problemi var.",

            "Bilgisayar neden doktora gitmiş? Virüs kapmış.",

            "Telefon neden gözlük takmış? Çünkü numaraları okuyamamış.",

            "Saat neden kavga etmiş? Çünkü zamanı gelmiş.",

            "Elektrikçi neden sevgilisinden ayrılmış? Aralarındaki akım kesilmiş."

        ];


        return jokes[
            Math.floor(
                Math.random() *
                jokes.length
            )
        ];
    }


    /* HESAP */

    const calculation =
        calculateExpression(
            text
        );


    if(
        calculation !== null
    ){

        return (
            "Sonuç: " +
            calculation
        );
    }


    /* HAFIZA TEMİZLEME */

    if(
        command ===
        "hafızanı temizle"
        ||
        command ===
        "hafizani temizle"
    ){

        clearAuraMemory();

        return null;
    }


    return null;
}


/* =========================
   HAFIZA TEMİZLE
========================= */

function clearAuraMemory(){

    try{

        localStorage.removeItem(
            MEMORY_KEY
        );

        localStorage.removeItem(
            HISTORY_KEY
        );


        conversation = [

            {
                role:"system",
                content:systemPrompt
            }

        ];


        chat.innerHTML = "";


        addMessage(
            "Hafızam temizlendi.",
            "aura"
        );


    }catch(error){

        console.error(
            "HAFIZA TEMİZLEME:",
            error
        );
    }
}


/* =========================
   HAFIZAYA ÖZEL BİLGİ EKLEME
========================= */

function rememberUserInformation(
    text
){

    const command =
        normalizeText(text);


    const patterns = [

        "bunu hatırla ",

        "bunu hatirla ",

        "hafızana kaydet ",

        "hafizana kaydet ",

        "bunu unutma "

    ];


    for(
        const pattern
        of patterns
    ){

        if(
            command.startsWith(
                pattern
            )
        ){

            const original =
                text.substring(
                    pattern.length
                ).trim();


            if(!original){

                return (
                    "Kaydetmem için " +
                    "bir bilgi belirtmelisin."
                );
            }


            /*
               Sistem prompt'una
               kalıcı olarak eklemiyoruz.

               Ayrı bir hafıza kaydı
               oluşturuyoruz.
            */

            let personalMemory = [];


            try{

                const saved =
                    localStorage.getItem(
                        "AURA_PERSONAL_MEMORY_V1"
                    );


                if(saved){

                    personalMemory =
                        JSON.parse(saved);
                }

            }catch(error){

                personalMemory = [];
            }


            personalMemory.push({

                text:
                    original,

                date:
                    new Date()
                        .toLocaleString(
                            "tr-TR"
                        )
            });


            personalMemory =
                personalMemory.slice(
                    -100
                );


            localStorage.setItem(

                "AURA_PERSONAL_MEMORY_V1",

                JSON.stringify(
                    personalMemory
                )

            );


            return (
                "Tamam, bunu hafızama kaydettim."
            );
        }
    }


    return null;
}


/* =========================
   KİŞİSEL HAFIZA METNİ
========================= */

function getPersonalMemory(){

    try{

        const saved =
            localStorage.getItem(
                "AURA_PERSONAL_MEMORY_V1"
            );


        if(!saved){

            return "";
        }


        const data =
            JSON.parse(saved);


        if(
            !Array.isArray(data)
            ||
            !data.length
        ){

            return "";
        }


        return data
            .slice(-30)
            .map(
                item =>
                    "- " +
                    item.text
            )
            .join("\n");

    }catch(error){

        return "";
    }
}


/* =========================
   AI'YA GİDECEK SİSTEM
========================= */

function buildSystemPrompt(){

    const personalMemory =
        getPersonalMemory();


    let prompt =
        systemPrompt;


    if(
        personalMemory
    ){

        prompt +=
            "\n\nKullanıcı hakkında " +
            "kalıcı olarak kaydedilmiş " +
            "bilgiler:\n" +
            personalMemory;
    }


    return prompt;
}


/* =========================
   AI CEVABI
========================= */

async function askAI(text){

    conversation[0] = {

        role:"system",

        content:
            buildSystemPrompt()

    };


    conversation.push({

        role:"user",

        content:text

    });


    saveMemory();


    try{

        const response =
            await puter.ai.chat(

                conversation,

                {
                    model:
                        "gpt-5.4-nano"
                }

            );


        let answer = "";


        if(
            response &&
            response.message &&
            response.message.content
        ){

            if(
                typeof
                response.message.content
                ===
                "string"
            ){

                answer =
                    response.message.content;

            }

            else if(
                Array.isArray(
                    response.message.content
                )
            ){

                answer =
                    response.message.content
                        .map(
                            part =>
                                typeof part
                                ===
                                "string"
                                    ? part
                                    : (
                                        part?.text
                                        || ""
                                    )
                        )
                        .join("");
            }

        }

        else if(
            response &&
            typeof response.text
            ===
            "string"
        ){

            answer =
                response.text;

        }

        else if(
            typeof response ===
            "string"
        ){

            answer =
                response;
        }


        if(
            !answer
        ){

            answer =
                "Şu anda cevap oluşturamadım.";
        }


        conversation.push({

            role:"assistant",

            content:answer

        });


        saveMemory();


        return answer;

    }catch(error){

        console.error(
            "AI HATASI:",
            error
        );


        /*
           Hatalı teknik bilgileri
           kullanıcıya göstermiyoruz.
        */

        return (
            "Şu anda AI bağlantısında " +
            "bir sorun var. Biraz sonra " +
            "tekrar deneyebiliriz."
        );
    }
}

</script><script>

/* =========================
   WEB ARAMA GEREKLİ Mİ?
========================= */

function needsWebSearch(text){

    const command =
        normalizeText(text);


    const triggers = [

        "internette ara",
        "internetten ara",
        "internette araştır",
        "internetten araştır",
        "webde ara",
        "webde araştır",
        "web'de ara",
        "internetten bak",
        "internete bak",
        "güncel bilgi",
        "guncel bilgi",
        "güncel haber",
        "guncel haber",
        "son dakika",
        "son haberler",
        "haberler",
        "şu an",
        "su an",
        "şimdi",
        "simdi",
        "bugün ne oldu",
        "bugun ne oldu",
        "hava durumu",
        "hava nasıl",
        "hava nasil",
        "bugünkü hava",
        "bugunku hava",
        "en son",
        "latest"

    ];


    return triggers.some(
        word =>
            command.includes(word)
    );
}


/* =========================
   WEB DESTEKLİ AI
========================= */

async function askAIWithWeb(text){

    conversation[0] = {

        role:"system",

        content:
            buildSystemPrompt()
    };


    conversation.push({

        role:"user",

        content:
            text +
            "\n\n" +
            "Bu soruda güncel bilgi gerekiyorsa " +
            "internet/web araması kullan. " +
            "Güncel olmayan bilgiyi güncelmiş gibi " +
            "gösterme. Kullanıcıya gereksiz şekilde " +
            "Bedirhan diye hitap etme."

    });


    saveMemory();


    try{

        const response =
            await puter.ai.chat(

                conversation,

                {
                    model:
                        "gpt-5.4-nano",

                    tools:[
                        {
                            type:"web_search"
                        }
                    ]
                }

            );


        let answer = "";


        if(
            response &&
            response.message &&
            response.message.content
        ){

            if(
                typeof
                response.message.content
                ===
                "string"
            ){

                answer =
                    response.message.content;

            }

            else if(
                Array.isArray(
                    response.message.content
                )
            ){

                answer =
                    response.message.content
                        .map(
                            part =>
                                typeof part
                                ===
                                "string"
                                    ? part
                                    : (
                                        part?.text
                                        || ""
                                    )
                        )
                        .join("");
            }

        }

        else if(
            response &&
            typeof response.text
            ===
            "string"
        ){

            answer =
                response.text;

        }

        else if(
            typeof response ===
            "string"
        ){

            answer =
                response;
        }


        if(
            !answer
        ){

            answer =
                "Güncel bilgi alınamadı.";
        }


        conversation.push({

            role:"assistant",

            content:answer

        });


        saveMemory();


        return answer;


    }catch(error){

        console.error(
            "WEB AI HATASI:",
            error
        );


        /*
           Web sistemi başarısız olursa
           normal AI'ya geri dön.
        */

        conversation.pop();


        return await askAI(text);
    }
}


/* =========================
   SES METNİ TEMİZLE
========================= */

function cleanTextForSpeech(text){

    return String(text)

        .replace(
            /https?:\/\/\S+/gi,
            " "
        )

        .replace(
            /[\p{Emoji_Presentation}\p{Extended_Pictographic}]/gu,
            " "
        )

        .replace(
            /[*_#`~>|[\]{}<>]/g,
            " "
        )

        .replace(
            /[.,!?;:"'“”‘’()\/\\|@#$%^&+=-]/g,
            " "
        )

        .replace(
            /\s+/g,
            " "
        )

        .trim();
}


/* =========================
   SESLENDİRME
========================= */

function speak(text){

    if(
        !("speechSynthesis" in window)
    ){

        return;
    }


    const clean =
        cleanTextForSpeech(
            text
        );


    if(!clean){

        return;
    }


    try{

        window.speechSynthesis.cancel();


        const utterance =
            new SpeechSynthesisUtterance(
                clean
            );


        utterance.lang =
            "tr-TR";

        utterance.rate =
            0.9;

        utterance.pitch =
            1;

        utterance.volume =
            1;


        /*
           Türkçe seslerden birini
           bulmaya çalışıyoruz.
        */

        const voices =
            window.speechSynthesis
                .getVoices();


        const turkishVoice =
            voices.find(
                voice =>
                    voice.lang
                        .toLowerCase()
                        .startsWith(
                            "tr"
                        )
            );


        if(
            turkishVoice
        ){

            utterance.voice =
                turkishVoice;
        }


        window.speechSynthesis.speak(
            utterance
        );


    }catch(error){

        console.error(
            "SES OYNATMA HATASI:",
            error
        );
    }
}

   TARAYICI SESLERİ
========================= */

if(

/* =========================
   SES TANIMA
========================= */

const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;


let recognition =
    null;

let isListening =
    false;


if(
    SpeechRecognition
){

    recognition =
        new SpeechRecognition();


    recognition.lang =
        "tr-TR";


    recognition.continuous =
        false;


    recognition.interimResults =
        false;


    recognition.maxAlternatives =
        1;


    recognition.onstart =
        function(){

            isListening =
                true;


            micButton.textContent =
                "🔴";


            micButton.disabled =
                false;
        };


    recognition.onend =
        function(){

            isListening =
                false;


            micButton.textContent =
                "🎤";


            micButton.disabled =
                false;
        };


    recognition.onerror =
        function(event){

            console.error(
                "SES TANIMA:",
                event.error
            );


            isListening =
                false;


            micButton.textContent =
                "🎤";


            micButton.disabled =
                false;


            if(
                event.error ===
                "not-allowed"
            ){

                addMessage(
                    "Mikrofon izni verilmedi.",
                    "aura"
                );
            }

        };


    recognition.onresult =
        async function(event){

            const result =
                event.results[
                    event.results.length - 1
                ];


            if(
                !result ||
                !result[0]
            ){

                return;
            }


            const text =
                result[0]
                    .transcript
                    .trim();


            if(!text){

                return;
            }


            input.value =
                "";


            await sendMessage(
                text,
                true
            );
        };

}


/* =========================
   MİKROFON
========================= */

micButton.addEventListener(
    "click",
    function(){

        if(!recognition){

            addMessage(
                "Bu tarayıcı sesli komutu desteklemiyor.",
                "aura"
            );

            return;
        }


        if(isListening){

            try{

                recognition.stop();

            }catch(error){

                console.error(error);

            }

            return;
        }


        try{

            /*
               Mobil tarayıcılarda mikrofon
               çağrısı kullanıcı tıklaması
               içerisinden yapılmalı.
            */

            recognition.start();

        }catch(error){

            console.error(
                "MİKROFON BAŞLATMA:",
                error
            );

        }

    }
);


/* =========================
   ANA MESAJ SİSTEMİ
========================= */

async function sendMessage(
    forcedText = null,
    voiceMode = false
){

    let text;


    if(
        typeof forcedText ===
        "string"
    ){

        text =
            forcedText.trim();

    }else{

        text =
            input.value.trim();
    }


    if(!text){

        return;
    }


    if(
        !forcedText
    ){

        input.value =
            "";
    }


    /*
       Önce kullanıcı mesajını
       ekrana yaz.
    */

    addMessage(
        text,
        "user"
    );


    /*
       Hafıza komutu kontrolü.
    */

    const memoryReply =
        rememberUserInformation(
            text
        );


    if(
        memoryReply !== null
    ){

        addMessage(
            memoryReply,
            "aura"
        );


        input.focus();

        return;
    }


    /*
       Yerel komut kontrolü.
    */

    const localReply =
        handleLocalCommand(
            text
        );


    if(
        localReply !== null
    ){

        addMessage(
            localReply,
            "aura"
        );


        if(
            voiceMode
        ){

            speak(
                localReply
            );
        }


        input.focus();

        return;
    }


    /*
       Bilgi tabanını kontrol et.
    */

    const knowledgeReply =
        searchKnowledge(
            text
        );


    if(
        knowledgeReply !== null
    ){

        addMessage(
            knowledgeReply,
            "aura"
        );


        /*
           Bilgi tabanından gelen
           cevabı konuşma hafızasına
           da ekliyoruz.
        */

        conversation.push({

            role:"user",

            content:text

        });


        conversation.push({

            role:"assistant",

            content:knowledgeReply

        });


        saveMemory();


        if(
            voiceMode
        ){

            speak(
                knowledgeReply
            );
        }


        input.focus();

        return;
    }


    /*
       AI düşünme mesajı.
    */

    addMessage(
        "Düşünüyorum...",
        "aura"
    );


    const loading =
        chat.lastElementChild;


    sendButton.disabled =
        true;


    micButton.disabled =
        true;


    try{

        let reply;


        /*
           Güncel bilgi gerekiyorsa
           web destekli AI.
        */

        if(
            needsWebSearch(
                text
            )
        ){

            reply =
                await askAIWithWeb(
                    text
                );

        }else{

            reply =
                await askAI(
                    text
                );
        }


        if(
            loading
        ){

            loading.remove();
        }


        addMessage(
            reply,
            "aura"
        );


        if(
            voiceMode
        ){

            speak(
                reply
            );
        }


    }catch(error){

        console.error(
            "MESAJ HATASI:",
            error
        );


        if(
            loading
        ){

            loading.remove();
        }


        addMessage(
            "Bir hata oluştu. Lütfen tekrar deneyin.",
            "aura"
        );

    }


    sendButton.disabled =
        false;


    micButton.disabled =
        false;


    input.focus();
}


/* =========================
   GÖNDER BUTONU
========================= */

sendButton.addEventListener(
    "click",
    function(){

        sendMessage(
            null,
            false
        );

    }
);


/* =========================
   ENTER
========================= */

input.addEventListener(
    "keydown",
    function(event){

        if(
            event.key ===
            "Enter"
        ){

            event.preventDefault();


            sendMessage(
                null,
                false
            );
        }

    }
);

/* =========================
   BAŞLANGIÇ MESAJI
========================= */

function showWelcome(){

    /*
       Sohbet geçmişi boşsa
       karşılama mesajını göster.
    */

    const hasMessages =
        chat.children.length > 0;


    if(
        !hasMessages
    ){

        addMessage(
            "Merhaba. Ben AURA AI.\n\n" +
            "Sistem hazır. Seni dinliyorum.",
            "aura"
        );
    }
}


/* =========================
   ESKİ MESAJLARI GÖSTER
========================= */

function restoreChatHistory(){

    try{

        const saved =
            localStorage.getItem(
                HISTORY_KEY
            );


        if(!saved){

            showWelcome();

            return;
        }


        const history =
            JSON.parse(saved);


        if(
            !Array.isArray(history)
        ){

            showWelcome();

            return;
        }


        /*
           Çok fazla mesaj ekrana
           yüklenmesin.
        */

        history
            .slice(-40)
            .forEach(
                item => {

                    if(
                        !item ||
                        !item.text ||
                        !item.type
                    ){

                        return;
                    }


                    addMessage(
                        item.text,
                        item.type
                    );
                }
            );


        if(
            chat.children.length === 0
        ){

            showWelcome();
        }


    }catch(error){

        console.error(
            "SOHBET GEÇMİŞİ:",
            error
        );


        showWelcome();
    }
}


/* =========================
   MESAJ GEÇMİŞİ KAYDETME
========================= */

function saveMessageHistory(
    text,
    type
){

    try{

        let history = [];


        const saved =
            localStorage.getItem(
                HISTORY_KEY
            );


        if(saved){

            history =
                JSON.parse(
                    saved
                );
        }


        if(
            !Array.isArray(history)
        ){

            history = [];
        }


        history.push({

            text:
                text,

            type:
                type,

            date:
                new Date()
                    .toISOString()

        });


        /*
           Son 100 mesajı tut.
        */

        history =
            history.slice(-100);


        localStorage.setItem(
            HISTORY_KEY,
            JSON.stringify(
                history
            )
        );


    }catch(error){

        console.error(
            "MESAJ GEÇMİŞİ KAYDEDİLEMEDİ:",
            error
        );
    }
}


/* =========================
   addMessage FONKSİYONUNU
   GEÇMİŞ KAYDI İLE GÜNCELLE
========================= */

const originalAddMessage =
    addMessage;


addMessage =
    function(
        text,
        type
    ){

        originalAddMessage(
            text,
            type
        );


        /*
           Sistem mesajlarını
           geçmişe kaydetmiyoruz.
        */

        saveMessageHistory(
            text,
            type
        );

    };


/* =========================
   SAYFA HAZIR
========================= */

document.addEventListener(
    "DOMContentLoaded",
    function(){

        /*
           input otomatik seçilsin.
        */

        input.focus();

    }
);


/* =========================
   AURA BAŞLAT
========================= */

restoreChatHistory();


/* =========================
   GÜVENLİK / HATA YAKALAMA
========================= */

window.addEventListener(
    "error",
    function(event){

        console.error(
            "AURA GENEL HATA:",
            event.error ||
            event.message
        );

    }
);


window.addEventListener(
    "unhandledrejection",
    function(event){

        console.error(
            "AURA PROMISE HATASI:",
            event.reason
        );

    }
);

</script>
