<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0,
               user-scalable=no">

<meta name="theme-color" content="#09000f">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<title>AURA AI</title>

<link rel="manifest" href="manifest.json">

<script src="https://js.puter.com/v2/"></script>

<style>
*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,
body{
    width:100%;
    height:100%;
    margin:0;
    padding:0;
    overflow:hidden;
    background:#08000d;
    color:#fff;
    font-family:
        Inter,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
}

body{
    position:relative;
}

button,
input,
textarea{
    font:inherit;
}

button{
    border:0;
    outline:0;
    cursor:pointer;
}

button:disabled{
    cursor:default;
}

#app{
    position:relative;
    width:100%;
    height:100%;
    overflow:hidden;
    background:
        radial-gradient(
            circle at 50% 32%,
            rgba(255,0,180,.12),
            transparent 32%
        ),
        radial-gradient(
            circle at 20% 80%,
            rgba(130,0,255,.12),
            transparent 35%
        ),
        linear-gradient(
            145deg,
            #050008 0%,
            #110018 45%,
            #050008 100%
        );
}

.bg-glow{
    position:absolute;
    inset:-30%;
    pointer-events:none;
    background:
        radial-gradient(
            circle,
            rgba(255,20,180,.07),
            transparent 38%
        );
    animation:bgPulse 8s ease-in-out infinite alternate;
}

@keyframes bgPulse{
    from{
        transform:scale(.92);
        opacity:.55;
    }
    to{
        transform:scale(1.08);
        opacity:1;
    }
}

/* ÜST BAR */

.topbar{
    position:absolute;
    z-index:20;
    top:0;
    left:0;
    right:0;
    height:72px;

    display:flex;
    align-items:center;
    justify-content:space-between;

    padding:
        env(safe-area-inset-top)
        18px
        0
        18px;

    background:
        linear-gradient(
            to bottom,
            rgba(4,0,8,.88),
            rgba(4,0,8,.15)
        );

    pointer-events:none;
}

.topbar > *{
    pointer-events:auto;
}

.brand{
    display:flex;
    align-items:center;
    gap:10px;
}

.brand-crown{
    width:38px;
    height:38px;
    border-radius:50%;

    display:flex;
    align-items:center;
    justify-content:center;

    background:
        radial-gradient(
            circle,
            rgba(255,80,220,.25),
            rgba(255,0,180,.04)
        );

    border:1px solid rgba(255,100,230,.3);

    box-shadow:
        0 0 18px rgba(255,0,190,.25),
        inset 0 0 12px rgba(255,0,190,.08);

    color:#ff76df;
    font-size:18px;
}

.brand-text{
    display:flex;
    flex-direction:column;
    line-height:1.05;
}

.brand-title{
    font-size:20px;
    font-weight:800;
    letter-spacing:4px;

    background:
        linear-gradient(
            90deg,
            #fff,
            #ff75df,
            #c88cff,
            #fff
        );

    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
}

.brand-subtitle{
    margin-top:4px;
    font-size:8px;
    letter-spacing:3px;
    color:rgba(255,180,242,.65);
}

.status{
    display:flex;
    align-items:center;
    gap:7px;

    padding:8px 12px;

    border:1px solid rgba(255,100,230,.18);
    border-radius:999px;

    background:rgba(255,0,190,.045);

    color:rgba(255,210,250,.75);

    font-size:10px;
    letter-spacing:1.5px;

    box-shadow:
        0 0 15px rgba(255,0,190,.08);
}

.status-dot{
    width:7px;
    height:7px;
    border-radius:50%;
    background:#ff4dcc;

    box-shadow:
        0 0 8px #ff4dcc,
        0 0 15px rgba(255,77,204,.7);

    animation:statusBlink 1.8s ease-in-out infinite;
}

@keyframes statusBlink{
    0%,100%{
        opacity:1;
    }
    50%{
        opacity:.45;
    }
}

/* ANA SAHNE */

.main-stage{
    position:absolute;
    inset:0;

    display:flex;
    align-items:center;
    justify-content:center;

    padding:
        80px
        14px
        100px;
}

.aura-core-button{
    position:relative;

    width:min(58vw,260px);
    height:min(58vw,260px);

    min-width:170px;
    min-height:170px;

    max-width:260px;
    max-height:260px;

    border-radius:50%;

    background:transparent;

    display:flex;
    align-items:center;
    justify-content:center;

    z-index:5;

    user-select:none;
    touch-action:manipulation;
}

.core-outer{
    position:absolute;
    inset:0;

    border-radius:50%;

    border:
        1px solid
        rgba(255,80,220,.18);

    box-shadow:
        0 0 30px rgba(255,0,190,.12),
        inset 0 0 30px rgba(255,0,190,.06);

    animation:
        coreRotate 18s linear infinite;
}

.core-outer::before,
.core-outer::after{
    content:"";

    position:absolute;

    inset:10%;

    border-radius:50%;

    border:
        1px dashed
        rgba(255,110,230,.22);
}

.core-outer::after{
    inset:20%;

    border-style:solid;
    border-color:
        rgba(180,90,255,.14);

    animation:
        coreRotateReverse 12s linear infinite;
}

@keyframes coreRotate{
    from{
        transform:rotate(0deg);
    }
    to{
        transform:rotate(360deg);
    }
}

@keyframes coreRotateReverse{
    from{
        transform:rotate(360deg);
    }
    to{
        transform:rotate(0deg);
    }
}

.core-ring{
    position:absolute;
    width:74%;
    height:74%;

    border-radius:50%;

    border:
        2px solid
        rgba(255,80,220,.42);

    box-shadow:
        0 0 22px rgba(255,0,190,.2),
        inset 0 0 22px rgba(255,0,190,.12);

    animation:
        ringPulse 2.8s ease-in-out infinite;
}

@keyframes ringPulse{
    0%,100%{
        transform:scale(.94);
        opacity:.65;
    }

    50%{
        transform:scale(1.04);
        opacity:1;
    }
}

.core-inner{
    position:absolute;

    width:54%;
    height:54%;

    border-radius:50%;

    display:flex;
    align-items:center;
    justify-content:center;

    background:
        radial-gradient(
            circle at 38% 30%,
            #ffb7f1 0%,
            #ff4fd0 15%,
            #b51cff 48%,
            #4c006c 78%,
            #17001f 100%
        );

    border:
        2px solid
        rgba(255,190,245,.55);

    box-shadow:
        0 0 25px rgba(255,0,190,.55),
        0 0 65px rgba(190,0,255,.25),
        inset 0 0 30px rgba(255,255,255,.16);

    overflow:hidden;
}

.core-inner::before{
    content:"";

    position:absolute;

    width:45%;
    height:20%;

    top:15%;
    left:20%;

    border-radius:50%;

    background:
        rgba(255,255,255,.3);

    filter:blur(9px);

    transform:rotate(-25deg);
}

.core-symbol{
    position:relative;
    z-index:2;

    font-size:clamp(28px,9vw,48px);

    color:white;

    text-shadow:
        0 0 10px white,
        0 0 22px #ff7de2,
        0 0 38px #ff00c8;

    animation:
        symbolPulse 2s ease-in-out infinite;
}

@keyframes symbolPulse{
    0%,100%{
        transform:scale(.94);
        opacity:.9;
    }

    50%{
        transform:scale(1.08);
        opacity:1;
    }
}

.core-label{
    position:absolute;

    bottom:-42px;

    left:50%;

    transform:translateX(-50%);

    white-space:nowrap;

    color:rgba(255,200,246,.62);

    font-size:10px;

    letter-spacing:3px;

    text-shadow:
        0 0 10px rgba(255,0,190,.4);
}

/* CORE ÜZERİNE DOKUNMA ALANI */

.aura-core-button::after{
    content:"";

    position:absolute;

    inset:-18px;

    border-radius:50%;

    background:transparent;

    z-index:-1;
}

/* PARÇACIKLAR */

.particles{
    position:absolute;
    inset:0;
    overflow:hidden;
    pointer-events:none;
}

.particle{
    position:absolute;

    width:3px;
    height:3px;

    border-radius:50%;

    background:#ff91e7;

    box-shadow:
        0 0 8px #ff4fd0;

    opacity:.45;

    animation:
        particleFloat
        var(--duration)
        linear
        infinite;
}

@keyframes particleFloat{
    from{
        transform:
            translate3d(
                0,
                110vh,
                0
            )
            scale(.5);
    }

    to{
        transform:
            translate3d(
                var(--move),
                -20vh,
                0
            )
            scale(1.2);
    }
}

/* SOHBET PANELİ */

.chat-panel{
    position:absolute;

    z-index:30;

    left:10px;
    right:10px;

    bottom:
        calc(
            76px +
            env(safe-area-inset-bottom)
        );

    height:min(62vh,560px);

    display:flex;
    flex-direction:column;

    border:
        1px solid
        rgba(255,100,225,.22);

    border-radius:28px;

    background:
        linear-gradient(
            145deg,
            rgba(18,2,27,.96),
            rgba(8,0,14,.97)
        );

    backdrop-filter:blur(20px);
    -webkit-backdrop-filter:blur(20px);

    box-shadow:
        0 20px 60px rgba(0,0,0,.55),
        0 0 35px rgba(255,0,190,.12),
        inset 0 0 35px rgba(255,0,190,.025);

    overflow:hidden;

    opacity:0;
    visibility:hidden;

    transform:
        translateY(35px)
        scale(.97);

    pointer-events:none;

    transition:
        opacity .28s ease,
        transform .28s ease,
        visibility .28s ease;
}

.chat-panel.open{
    opacity:1;
    visibility:visible;

    transform:
        translateY(0)
        scale(1);

    pointer-events:auto;
}

.chat-header{
    flex-shrink:0;

    height:52px;

    display:flex;
    align-items:center;
    justify-content:space-between;

    padding:0 16px;

    border-bottom:
        1px solid
        rgba(255,100,225,.1);

    background:
        rgba(255,0,190,.025);
}

.chat-header-title{
    display:flex;
    align-items:center;
    gap:9px;

    font-size:12px;
    letter-spacing:1px;
}

.chat-header-icon{
    width:30px;
    height:30px;

    display:flex;
    align-items:center;
    justify-content:center;

    border-radius:50%;

    background:
        rgba(255,0,190,.09);

    border:
        1px solid
        rgba(255,100,225,.18);

    color:#ff77dc;
}

.chat-close{
    width:32px;
    height:32px;

    border-radius:50%;

    background:
        rgba(255,255,255,.035);

    color:
        rgba(255,210,248,.65);

    font-size:18px;

    transition:
        background .2s,
        color .2s;
}

.chat-close:active{
    background:
        rgba(255,0,190,.15);

    color:#fff;
}/* =========================================================
   AURA — 2 / 7
   CHAT MESAJ ALANI + INPUT + BUTONLAR
   ========================================================= */

.chat-messages{
    flex:1;

    min-height:0;

    overflow-y:auto;
    overflow-x:hidden;

    padding:16px 12px 12px;

    display:flex;
    flex-direction:column;
    gap:12px;

    scroll-behavior:smooth;

    overscroll-behavior:contain;

    -webkit-overflow-scrolling:touch;
}

.chat-messages::-webkit-scrollbar{
    width:4px;
}

.chat-messages::-webkit-scrollbar-track{
    background:transparent;
}

.chat-messages::-webkit-scrollbar-thumb{
    background:
        rgba(255,80,220,.28);

    border-radius:10px;
}

.message{
    width:100%;

    display:flex;

    animation:
        messageIn .25s ease both;
}

@keyframes messageIn{
    from{
        opacity:0;
        transform:
            translateY(8px)
            scale(.98);
    }

    to{
        opacity:1;
        transform:
            translateY(0)
            scale(1);
    }
}

.message.user{
    justify-content:flex-end;
}

.message.aura{
    justify-content:flex-start;
}

.message-content{
    max-width:86%;

    display:flex;
    flex-direction:column;
}

.message.user .message-content{
    align-items:flex-end;
}

.message.aura .message-content{
    align-items:flex-start;
}

.message-name{
    margin:
        0
        0
        4px
        10px;

    font-size:9px;

    letter-spacing:1.5px;

    color:
        rgba(255,130,225,.7);
}

.message.user .message-name{
    margin:
        0
        0
        4px
        0;
}

.message-row{
    display:flex;
    align-items:flex-end;
    gap:7px;
}

.message.user .message-row{
    flex-direction:row-reverse;
}

.avatar{
    flex-shrink:0;

    width:30px;
    height:30px;

    border-radius:50%;

    display:flex;
    align-items:center;
    justify-content:center;

    background:
        radial-gradient(
            circle,
            rgba(255,80,220,.25),
            rgba(80,0,100,.2)
        );

    border:
        1px solid
        rgba(255,100,225,.22);

    color:#ff7de0;

    font-size:12px;

    box-shadow:
        0 0 14px
        rgba(255,0,190,.1);
}

.message-bubble{
    position:relative;

    padding:
        10px
        13px;

    border-radius:17px;

    font-size:13px;

    line-height:1.5;

    word-break:break-word;

    white-space:pre-wrap;

    user-select:text;
}

.message.aura .message-bubble{
    border-top-left-radius:5px;

    color:
        rgba(255,235,252,.94);

    background:
        linear-gradient(
            135deg,
            rgba(255,0,190,.075),
            rgba(95,0,130,.16)
        );

    border:
        1px solid
        rgba(255,90,220,.14);

    box-shadow:
        0 5px 20px
        rgba(0,0,0,.16);
}

.message.user .message-bubble{
    border-top-right-radius:5px;

    color:#fff;

    background:
        linear-gradient(
            135deg,
            rgba(255,45,190,.65),
            rgba(155,25,220,.68)
        );

    border:
        1px solid
        rgba(255,150,235,.28);

    box-shadow:
        0 5px 20px
        rgba(255,0,190,.1);
}

.message-time{
    margin-top:4px;

    padding:0 5px;

    font-size:8px;

    color:
        rgba(255,190,240,.4);

    letter-spacing:.5px;
}

.message-status{
    margin-left:4px;

    color:
        rgba(255,125,220,.8);
}

/* YAZIYOR GÖSTERGESİ */

.typing-message{
    display:flex;

    align-items:flex-end;

    gap:7px;

    animation:
        messageIn .2s ease both;
}

.typing-bubble{
    min-width:60px;

    padding:
        11px 13px;

    border-radius:17px;
    border-top-left-radius:5px;

    background:
        rgba(255,0,190,.055);

    border:
        1px solid
        rgba(255,90,220,.13);
}

.typing-dots{
    display:flex;

    align-items:center;

    gap:4px;

    height:12px;
}

.typing-dot{
    width:5px;
    height:5px;

    border-radius:50%;

    background:#ff72da;

    box-shadow:
        0 0 7px
        rgba(255,70,210,.7);

    animation:
        typingDot
        1.2s
        infinite
        ease-in-out;
}

.typing-dot:nth-child(2){
    animation-delay:.15s;
}

.typing-dot:nth-child(3){
    animation-delay:.3s;
}

@keyframes typingDot{
    0%,60%,100%{
        transform:translateY(0);
        opacity:.35;
    }

    30%{
        transform:translateY(-4px);
        opacity:1;
    }
}

/* INPUT ALANI */

.chat-input-area{
    flex-shrink:0;

    padding:
        10px
        10px
        calc(
            10px +
            env(safe-area-inset-bottom)
        );

    border-top:
        1px solid
        rgba(255,100,225,.1);

    background:
        rgba(5,0,10,.72);
}

.input-wrapper{
    width:100%;

    min-height:52px;

    display:flex;
    align-items:center;

    gap:7px;

    padding:
        6px 7px 6px 13px;

    border-radius:18px;

    background:
        rgba(255,255,255,.035);

    border:
        1px solid
        rgba(255,100,225,.15);

    box-shadow:
        inset 0 0 18px
        rgba(255,0,190,.025);

    transition:
        border-color .2s,
        box-shadow .2s;
}

.input-wrapper:focus-within{
    border-color:
        rgba(255,100,225,.38);

    box-shadow:
        0 0 18px
        rgba(255,0,190,.08),
        inset 0 0 18px
        rgba(255,0,190,.035);
}

.input-icon{
    flex-shrink:0;

    width:28px;
    height:28px;

    display:flex;
    align-items:center;
    justify-content:center;

    color:
        rgba(255,115,220,.75);

    font-size:15px;
}

#messageInput{
    flex:1;

    width:100%;
    min-width:0;

    height:38px;

    padding:0;

    border:0;
    outline:0;

    resize:none;

    overflow-y:auto;

    background:transparent;

    color:#fff;

    font-size:14px;

    line-height:38px;

    appearance:none;
    -webkit-appearance:none;
}

#messageInput::placeholder{
    color:
        rgba(255,190,242,.4);
}

#messageInput:disabled{
    opacity:.55;
}

/* INPUT BUTONLARI */

.input-button{
    flex-shrink:0;

    width:40px;
    height:40px;

    display:flex;
    align-items:center;
    justify-content:center;

    border-radius:50%;

    background:
        rgba(255,255,255,.045);

    color:
        rgba(255,205,246,.7);

    border:
        1px solid
        rgba(255,100,225,.1);

    transition:
        transform .15s,
        background .15s,
        color .15s,
        box-shadow .15s;
}

.input-button:active{
    transform:scale(.91);
}

.input-button:hover{
    background:
        rgba(255,0,190,.1);

    color:#fff;
}

/* MİKROFON */

#micButton{
    position:relative;
}

#micButton.listening{
    color:#fff;

    background:
        rgba(255,0,170,.22);

    border-color:
        rgba(255,80,220,.5);

    box-shadow:
        0 0 15px
        rgba(255,0,190,.35);
}

#micButton.listening::after{
    content:"";

    position:absolute;

    inset:-4px;

    border-radius:50%;

    border:
        1px solid
        rgba(255,80,220,.4);

    animation:
        micPulse 1.2s
        ease-in-out
        infinite;
}

@keyframes micPulse{
    0%,100%{
        transform:scale(.9);
        opacity:.3;
    }

    50%{
        transform:scale(1.15);
        opacity:1;
    }
}

/* GÖNDER BUTONU */

#sendButton{
    width:43px;
    height:43px;

    color:#fff;

    background:
        linear-gradient(
            135deg,
            #ff3fc5,
            #a918e8
        );

    border:
        1px solid
        rgba(255,190,245,.32);

    box-shadow:
        0 0 15px
        rgba(255,0,190,.25);
}

#sendButton:hover{
    box-shadow:
        0 0 22px
        rgba(255,0,190,.4);
}

#sendButton:disabled{
    opacity:.45;

    filter:saturate(.5);

    box-shadow:none;
}

#sendButton.sending{
    animation:
        sendPulse 1s
        ease-in-out
        infinite;
}

@keyframes sendPulse{
    0%,100%{
        transform:scale(.96);
    }

    50%{
        transform:scale(1);
    }
}

/* ALT BİLGİ */

.input-hint{
    text-align:center;

    margin-top:6px;

    font-size:8px;

    color:
        rgba(255,180,240,.27);

    letter-spacing:.7px;
}

/* ALT NAV */

.bottom-bar{
    position:absolute;

    z-index:20;

    left:0;
    right:0;
    bottom:0;

    height:
        calc(
            70px +
            env(safe-area-inset-bottom)
        );

    padding:
        0
        18px
        env(safe-area-inset-bottom);

    display:flex;
    align-items:center;
    justify-content:center;

    background:
        linear-gradient(
            to top,
            rgba(4,0,8,.95),
            rgba(4,0,8,.15)
        );

    pointer-events:none;
}

.bottom-bar-inner{
    pointer-events:auto;

    width:100%;
    max-width:500px;

    display:flex;
    align-items:center;
    justify-content:center;
}

.core-toggle-hint{
    position:absolute;

    left:50%;
    bottom:
        calc(
            15px +
            env(safe-area-inset-bottom)
        );

    transform:translateX(-50%);

    font-size:8px;

    color:
        rgba(255,190,242,.25);

    letter-spacing:1.5px;

    pointer-events:none;

    white-space:nowrap;
}

/* MOBİL DÜZEN */

@media(max-width:480px){

    .topbar{
        height:65px;
        padding-left:12px;
        padding-right:12px;
    }

    .brand-crown{
        width:34px;
        height:34px;
    }

    .brand-title{

<script>

/* =========================================================
   AURA — 3 / 7
   TEMEL DEĞİŞKENLER
   ========================================================= */

"use strict";


/* ---------------------------------------------------------
   KULLANICI BİLGİLERİ
   --------------------------------------------------------- */

const AURA_CONFIG = {

    appName: "AURA",

    userName: "Bedirhan Kahraman",

    girlfriendName: "Edanur Kahraman",

    language: "tr-TR",

    model: "gpt-5.4-nano",

    maxMessages: 80,

    maxMemoryItems: 100

};


/* ---------------------------------------------------------
   DOM ELEMANLARI
   --------------------------------------------------------- */

const auraCore =
    document.getElementById("auraCore");

const chatPanel =
    document.getElementById("chatPanel");

const closeChatButton =
    document.getElementById("closeChatButton");

const chatMessages =
    document.getElementById("chatMessages");

const messageInput =
    document.getElementById("messageInput");

const sendButton =
    document.getElementById("sendButton");

const sendIcon =
    document.getElementById("sendIcon");

const micButton =
    document.getElementById("micButton");

const micIcon =
    document.getElementById("micIcon");

const particles =
    document.getElementById("particles");

const loadingOverlay =
    document.getElementById("loadingOverlay");

const loadingText =
    document.getElementById("loadingText");

const auraToast =
    document.getElementById("auraToast");


/* ---------------------------------------------------------
   UYGULAMA DURUMU
   --------------------------------------------------------- */

const state = {

    chatOpen: false,

    sending: false,

    listening: false,

    initialized: false,

    recognition: null,

    toastTimer: null,

    messages: [],

    memory: [],

    conversation: []

};


/* =========================================================
   GÜVENLİ LOCALSTORAGE
   ========================================================= */

const STORAGE_KEYS = {

    messages:
        "AURA_MESSAGES_V4",

    memory:
        "AURA_MEMORY_V4",

    conversation:
        "AURA_CONVERSATION_V4",

    settings:
        "AURA_SETTINGS_V4"

};


/* ---------------------------------------------------------
   LOCALSTORAGE OKUMA
   --------------------------------------------------------- */

function loadJSON(key, fallback){

    try{

        const raw =
            localStorage.getItem(key);

        if(!raw){

            return fallback;

        }

        const parsed =
            JSON.parse(raw);

        return parsed;

    }catch(error){

        console.warn(
            "AURA storage read error:",
            error
        );

        return fallback;

    }

}


/* ---------------------------------------------------------
   LOCALSTORAGE YAZMA
   --------------------------------------------------------- */

function saveJSON(key, value){

    try{

        localStorage.setItem(
            key,
            JSON.stringify(value)
        );

        return true;

    }catch(error){

        console.warn(
            "AURA storage write error:",
            error
        );

        return false;

    }

}


/* =========================================================
   HAFIZA YÜKLEME
   ========================================================= */

function loadAuraData(){

    const savedMessages =
        loadJSON(
            STORAGE_KEYS.messages,
            []
        );

    const savedMemory =
        loadJSON(
            STORAGE_KEYS.memory,
            []
        );

    const savedConversation =
        loadJSON(
            STORAGE_KEYS.conversation,
            []
        );


    if(
        Array.isArray(savedMessages)
    ){

        state.messages =
            savedMessages.slice(
                -AURA_CONFIG.maxMessages
            );

    }


    if(
        Array.isArray(savedMemory)
    ){

        state.memory =
            savedMemory.slice(
                -AURA_CONFIG.maxMemoryItems
            );

    }


    if(
        Array.isArray(savedConversation)
    ){

        state.conversation =
            savedConversation.slice(
                -30
            );

    }

}


/* =========================================================
   HAFIZA KAYDETME
   ========================================================= */

function saveAuraData(){

    saveJSON(
        STORAGE_KEYS.messages,
        state.messages.slice(
            -AURA_CONFIG.maxMessages
        )
    );

    saveJSON(
        STORAGE_KEYS.memory,
        state.memory.slice(
            -AURA_CONFIG.maxMemoryItems
        )
    );

    saveJSON(
        STORAGE_KEYS.conversation,
        state.conversation.slice(
            -30
        )
    );

}


/* =========================================================
   ZAMAN
   ========================================================= */

function getTime(){

    try{

        return new Intl.DateTimeFormat(
            AURA_CONFIG.language,
            {
                hour:"2-digit",
                minute:"2-digit"
            }
        ).format(new Date());

    }catch(error){

        return new Date()
            .toLocaleTimeString(
                AURA_CONFIG.language,
                {
                    hour:"2-digit",
                    minute:"2-digit"
                }
            );

    }

}


/* =========================================================
   TOAST
   ========================================================= */

function showToast(text){

    if(!auraToast){

        return;

    }

    clearTimeout(
        state.toastTimer
    );

    auraToast.textContent =
        String(text || "");

    auraToast.classList.add(
        "show"
    );

    state.toastTimer =
        setTimeout(
            () => {

                auraToast.classList.remove(
                    "show"
                );

            },
            2600
        );

}


/* =========================================================
   CHAT PANELİ AÇ
   ========================================================= */

function openChat(){

    if(!chatPanel){

        return;

    }

    state.chatOpen = true;

    chatPanel.classList.add(
        "open"
    );

    chatPanel.setAttribute(
        "aria-hidden",
        "false"
    );

    setTimeout(
        () => {

            if(messageInput){

                messageInput.focus();

            }

            scrollChatToBottom();

        },
        260
    );

}


/* =========================================================
   CHAT PANELİ KAPAT
   ========================================================= */

function closeChat(){

    if(!chatPanel){

        return;

    }

    state.chatOpen = false;

    chatPanel.classList.remove(
        "open"
    );

    chatPanel.setAttribute(
        "aria-hidden",
        "true"
    );

    if(messageInput){

        messageInput.blur();

    }

}


/* =========================================================
   CHAT PANELİ AÇ/KAPAT
   ========================================================= */

function toggleChat(){

    if(state.chatOpen){

        closeChat();

    }else{

        openChat();

    }

}


/* =========================================================
   ÇEKİRDEK EVENT
   ========================================================= */

/*
   ÖNEMLİ:

   Burada click kullanılıyor.
   pointerdown + click birlikte kullanılmıyor.

   Böylece Android'de aynı dokunuşun
   iki defa tetiklenmesi engelleniyor.
*/

if(auraCore){

    auraCore.addEventListener(
        "click",
        function(event){

            event.preventDefault();

            toggleChat();

        },
        {
            passive:false
        }
    );

}


/* =========================================================
   KAPAT BUTONU
   ========================================================= */

if(closeChatButton){

    closeChatButton.addEventListener(
        "click",
        function(event){

            event.preventDefault();

            closeChat();

        },
        {
            passive:false
        }
    );

}


/* =========================================================
   ESC TUŞU
   ========================================================= */

document.addEventListener(
    "keydown",
    function(event){

        if(
            event.key === "Escape" &&
            state.chatOpen
        ){

            closeChat();

        }

    }
);


/* =========================================================
   CHAT AŞAĞI KAYDIR
   ========================================================= */

function scrollChatToBottom(){

    if(!chatMessages){

        return;

    }

    requestAnimationFrame(
        () => {

            chatMessages.scrollTop =
                chatMessages.scrollHeight;

        }
    );

}


/* =========================================================
   PARÇACIK OLUŞTUR
   ========================================================= */

function createParticles(){

    if(!particles){

        return;

    }

    const count =
        window.innerWidth < 500
            ? 28
            : 42;

    particles.innerHTML = "";

    for(
        let i = 0;
        i < count;
        i++
    ){

        const particle =
            document.createElement(
                "span"
            );

        particle.className =
            "particle";

        particle.style.left =
            Math.random() * 100 + "%";

        particle.style.setProperty(
            "--move",
            (
                Math.random() * 160 - 80
            ) + "px"
        );

        particle.style.setProperty(
            "--duration",
            (
                8 +
                Math.random() * 14
            ) + "s"
        );

        particle.style.animationDelay =
            (
                -Math.random() * 20
            ) + "s";

        particles.appendChild(
            particle
        );

    }

}


/* =========================================================
   BAŞLANGIÇ
   ========================================================= */

loadAuraData();

createParticles();

window.addEventListener(
    "resize",
    function(){

        createParticles();

        scrollChatToBottom();

    }
);

</script><script>

/* =========================================================
   AURA — 4 / 7
   MESAJ SİSTEMİ + HAFIZA + GÜVENLİ METİN İŞLEME
   ========================================================= */


/* =========================================================
   HTML ESCAPE
   ========================================================= */

function escapeHTML(value){

    return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}


/* =========================================================
   MESAJ METNİNİ TEMİZLE
   ========================================================= */

function cleanMessageText(text){

    if(text === null || text === undefined){

        return "";

    }

    return String(text)
        .replace(/\u0000/g, "")
        .trim();

}


/* =========================================================
   METİN İÇİNDE BASİT MARKDOWN
   ========================================================= */

function formatMessageText(text){

    let safe =
        escapeHTML(
            cleanMessageText(text)
        );

    /*
       Satır sonlarını koruyoruz.
       HTML çalıştırılmasına izin vermiyoruz.
    */

    safe =
        safe.replace(
            /\n/g,
            "<br>"
        );

    return safe;

}


/* =========================================================
   MESAJ NESNESİ
   ========================================================= */

function createMessageObject(
    role,
    content
){

    return {

        id:
            Date.now().toString(36) +
            Math.random()
                .toString(36)
                .slice(2),

        role:
            role === "user"
                ? "user"
                : "assistant",

        content:
            cleanMessageText(content),

        time:
            getTime(),

        timestamp:
            Date.now()

    };

}


/* =========================================================
   MESAJI EKRANA EKLE
   ========================================================= */

function renderMessage(message){

    if(!chatMessages){

        return;

    }

    if(!message){

        return;

    }

    const role =
        message.role === "user"
            ? "user"
            : "aura";

    const wrapper =
        document.createElement("div");

    wrapper.className =
        "message " + role;

    const content =
        document.createElement("div");

    content.className =
        "message-content";

    const name =
        document.createElement("div");

    name.className =
        "message-name";

    name.textContent =
        role === "user"
            ? AURA_CONFIG.userName
            : "AURA";

    const row =
        document.createElement("div");

    row.className =
        "message-row";


    /* -----------------------------------------------------
       AURA AVATAR
       ----------------------------------------------------- */

    if(role === "aura"){

        const avatar =
            document.createElement("div");

        avatar.className =
            "avatar";

        avatar.textContent =
            "♡";

        row.appendChild(
            avatar
        );

    }


    /* -----------------------------------------------------
       BALON
       ----------------------------------------------------- */

    const bubble =
        document.createElement("div");

    bubble.className =
        "message-bubble";

    bubble.innerHTML =
        formatMessageText(
            message.content
        );


    /* -----------------------------------------------------
       SATIR
       ----------------------------------------------------- */

    row.appendChild(
        bubble
    );


    /* -----------------------------------------------------
       CONTENT
       ----------------------------------------------------- */

    content.appendChild(
        name
    );

    content.appendChild(
        row
    );


    /* -----------------------------------------------------
       ZAMAN
       ----------------------------------------------------- */

    const time =
        document.createElement("div");

    time.className =
        "message-time";

    time.textContent =
        message.time || getTime();


    if(role === "user"){

        const status =
            document.createElement("span");

        status.className =
            "message-status";

        status.textContent =
            "✓✓";

        time.appendChild(
            status
        );

    }


    content.appendChild(
        time
    );

    wrapper.appendChild(
        content
    );

    chatMessages.appendChild(
        wrapper
    );

}


/* =========================================================
   TÜM MESAJLARI EKRANA YÜKLE
   ========================================================= */

function renderAllMessages(){

    if(!chatMessages){

        return;

    }

    chatMessages.innerHTML = "";

    for(
        const message
        of state.messages
    ){

        renderMessage(
            message
        );

    }

    scrollChatToBottom();

}


/* =========================================================
   MESAJ EKLE
   ========================================================= */

function addMessage(
    role,
    content,
    options = {}
){

    const text =
        cleanMessageText(content);

    if(!text){

        return null;

    }

    const message =
        createMessageObject(
            role,
            text
        );

    state.messages.push(
        message
    );


    /*
       Mesaj geçmişini sınırlıyoruz.
       Böylece localStorage sonsuza kadar büyümez.
    */

    if(
        state.messages.length >
        AURA_CONFIG.maxMessages
    ){

        state.messages =
            state.messages.slice(
                -AURA_CONFIG.maxMessages
            );

    }


    if(
        options.render !== false
    ){

        renderMessage(
            message
        );

        scrollChatToBottom();

    }


    if(
        options.save !== false
    ){

        saveAuraData();

    }


    return message;

}


/* =========================================================
   KULLANICI MESAJI
   ========================================================= */

function addUserMessage(text){

    return addMessage(
        "user",
        text
    );

}


/* =========================================================
   AURA MESAJI
   ========================================================= */

function addAuraMessage(text){

    return addMessage(
        "assistant",

/* =========================================================
   HAFIZADAN BİLGİ ARA
   ========================================================= */

function searchMemory(query){

    const q =
        cleanMessageText(
            query
        ).toLocaleLowerCase(
            "tr-TR"
        );

    if(!q){

        return [];

    }

    const words =
        q
            .split(/\s+/)
            .filter(
                word =>
                    word.length >= 2
            );

    if(words.length === 0){

        return [];

    }

    return state.memory
        .map(item => {

            const text =
                String(item.text)
                    .toLocaleLowerCase(
                        "tr-TR"
                    );

            let score = 0;

            for(
                const word
                of words
            ){

                if(
                    text.includes(word)
                ){

                    score++;

                }

            }

            return {
                item,
                score
            };

        })
        .filter(
            result =>
                result.score > 0
        )
        .sort(
            (a,b) =>
                b.score - a.score
        )
        .slice(0,8)
        .map(
            result =>
                result.item
        );

}


/* =========================================================
   BASİT HAFIZA ALGILAMA
   ========================================================= */

function detectMemoryFromUserMessage(
    text
){

    const value =
        cleanMessageText(text);

    if(!value){

        return;

    }

    const lower =
        value.toLocaleLowerCase(
            "tr-TR"
        );


    /* -----------------------------------------------------
       "Benim adım ..."
       ----------------------------------------------------- */

    const nameMatch =
        value.match(
            /(?:benim adım|adım)\s+([a-zçğıöşüİÇĞÖŞÜ\s]{2,40})/i
        );

    if(nameMatch){

        const name =
            nameMatch[1]
                .trim()
                .replace(
                    /\s+/g,
                    " "
                );

        if(name){

            addMemory(
                `Kullanıcının adı: ${name}`,
                "name"
            );

        }

    }


    /* -----------------------------------------------------
       "Bunu hatırla"
       ----------------------------------------------------- */

    const rememberMatch =
        value.match(
            /(?:bunu hatırla|bunu hafızana kaydet|bunu unutma|hatırla)\s*:?\s*(.+)/i
        );

    if(rememberMatch){

        const remembered =
            rememberMatch[1]
                .trim();

        if(
            remembered.length >= 2
        ){

            addMemory(
                remembered,
                "user_requested"
            );

        }

    }


    /* -----------------------------------------------------
       EDANUR
       ----------------------------------------------------- */

    if(
        lower.includes(
            "edanur"
        )
    ){

        addMemory(
            "Kullanıcının sevgilisinin adı Edanur Kahraman.",
            "relationship"
        );

    }

}

function getFriendlyAIError(error){

    console.error(
        "AURA AI ERROR:",
        error
    );


    const text =
        String(
            error?.message ||
            error ||
            ""
        ).toLocaleLowerCase(
            "tr-TR"
        );


    if(
        text.includes("network") ||
        text.includes("fetch") ||
        text.includes("internet") ||
        text.includes("connection")
    ){

        return "Bağlantıda kısa süreli bir sorun oluştu. İnternet bağlantını kontrol edip tekrar deneyebilirsin.";

    }


    if(
        text.includes("401") ||
        text.includes("403") ||
        text.includes("unauthorized") ||
        text.includes("permission")
    ){

        return "AURA'nın yapay zeka bağlantısında yetkilendirme sorunu oluştu.";

    }


    if(
        text.includes("429") ||
        text.includes("rate")
    ){

        return "AURA'ya çok kısa sürede fazla istek gönderildi. Birkaç saniye bekleyip tekrar deneyebilirsin.";

    }


    if(
        text.includes("timeout") ||
        text.includes("timed out")
    ){

        return "AURA'nın cevabı zaman aşımına uğradı. Mesajını tekrar gönderebilirsin.";

    }


    return "Şu anda AURA'nın yapay zeka bağlantısında geçici bir sorun oluştu. Mesajını tekrar gönderebilirsin.";

}


/* =========================================================
   AI CEVABINI GÜVENLİ ŞEKİLDE METNE ÇEVİR
   ========================================================= */

function extractAIText(response){

    if(
        response === null ||
        response === undefined
    ){

        return "";

    }


    /* -----------------------------------------------------
       Direkt string
       ----------------------------------------------------- */

    if(
        typeof response === "string"
    ){

        return response.trim();

    }


    /* -----------------------------------------------------
       response.message.content
       ----------------------------------------------------- */

    if(
        response.message &&
        typeof response.message.content === "string"
    ){

        return response.message.content.trim();

    }


    /* -----------------------------------------------------
       response.message.content[]
       ----------------------------------------------------- */

    if(
        response.message &&
        Array.isArray(
            response.message.content
        )
    ){

        const parts =
            response.message.content
                .map(part => {

                    if(
                        typeof part === "string"
                    ){

                        return part;

                    }

                    if(
                        part &&
                        typeof part.text === "string"
                    ){

                        return part.text;

                    }

                    return "";

                })
                .filter(Boolean);

        if(parts.length){

            return parts.join("\n").trim();

        }

    }


    /* -----------------------------------------------------
       response.content
       ----------------------------------------------------- */

    if(
        typeof response.content === "string"
    ){

        return response.content.trim();

    }


    /* -----------------------------------------------------
       response.text
       ----------------------------------------------------- */

    if(
        typeof response.text === "string"
    ){

        return response.text.trim();

    }


    /* -----------------------------------------------------
       response.output_text
       ----------------------------------------------------- */

    if(
        typeof response.output_text === "string"
    ){

        return response.output_text.trim();

    }


    /* -----------------------------------------------------
       response.result
       ----------------------------------------------------- */

    if(
        typeof response.result === "string"
    ){

        return response.result.trim();

    }


    return "";

}


/* =========================================================
   PUTER AI ÇAĞRISI
   ========================================================= */

async function askAuraAI(userText){

    const text =
        cleanMessageText(
            userText
        );


    if(!text){

        throw new Error(
            "EMPTY_MESSAGE"
        );

    }


    if(!isPuterReady()){

        throw new Error(
            "PUTER_NOT_READY"
        );

    }


    const messages = [

        {
            role:"system",
            content:
                buildSystemPrompt()
        }

    ];


    /* -----------------------------------------------------
       KAYITLI KONUŞMA GEÇMİŞİ
       ----------------------------------------------------- */

    if(
        Array.isArray(
            state.conversation
        )
    ){

        for(
            const item
            of state.conversation.slice(-20)
        ){

            if(
                !item ||
                !item.content
            ){

                continue;

            }

            const role =
                item.role === "user"
                    ? "user"
                    : "assistant";

            messages.push({

                role:role,

                content:
                    String(
                        item.content
                    )

            });

        }

    }


    /* -----------------------------------------------------
       YENİ KULLANICI MESAJI
       ----------------------------------------------------- */

    messages.push({

        role:"user",

        content:text

    });


    /*
       Puter'a tek ve standart bir istek gönderiyoruz.
       Aynı mesajı farklı formatlarda tekrar tekrar
       göndermiyoruz.
    */

    const response =
        await window.puter.ai.chat(
            messages,
            {
                model:
                    AURA_CONFIG.model,

                stream:false
            }
        );


    const answer =
        extractAIText(
            response
        );


    if(!answer){

        throw new Error(
            "EMPTY_AI_RESPONSE"
        );

    }


    return answer;

}


/* =========================================================
   AI HAZIRLANANA KADAR BEKLE
   ========================================================= */

async function waitForPuter(
    timeout = 12000
){

    const start =
        Date.now();


    while(
        Date.now() - start <
        timeout
    ){

        if(
            isPuterReady()
        ){

            return true;

        }

        await new Promise(
            resolve =>
                setTimeout(
                    resolve,
                    250
                )
        );

    }


    return isPuterReady();

}

/* =========================================================
   TÜRKÇE SES SEÇ
   ========================================================= */

function getTurkishVoice(){

    if(!speechVoices.length){

        loadSpeechVoices();

    }


    /*
       Öncelik sırası:

       1. tr-TR
       2. tr
       3. Türkçe isimli ses
       4. herhangi bir ses
    */

    const exact =
        speechVoices.find(
            voice =>
                String(
                    voice.lang
                ).toLowerCase() ===
                "tr-tr"
        );


    if(exact){

        return exact;

    }


    const turkish =
        speechVoices.find(
            voice =>
                String(
                    voice.lang
                )
                .toLowerCase()
                .startsWith("tr")
        );


    if(turkish){

        return turkish;

    }


    const namedTurkish =
        speechVoices.find(
            voice =>
                /turk|türk/i.test(
                    String(
                        voice.name
                    )
                )
        );


    if(namedTurkish){

        return namedTurkish;

    }


    return speechVoices[0] || null;

}


/* =========================================================
   AURA KONUŞ
   ========================================================= */

function speak(text){

    const value =
        cleanMessageText(
            text
        );


    if(!value){

        return;

    }


    if(
        !("speechSynthesis" in window)
    ){

        return;

    }


    try{

        /*
           Önceki konuşmayı durdur.
           Böylece iki cevap üst üste okunmaz.
        */

        window.speechSynthesis.cancel();


        const utterance =
            new SpeechSynthesisUtterance(
                value
            );


        utterance.lang =
            AURA_CONFIG.language;

        utterance.rate =
            0.95;

        utterance.pitch =
            1.02;

        utterance.volume =
            1;


        const voice =
            getTurkishVoice();


        if(voice){

            utterance.voice =
                voice;

        }


        utterance.onerror =
            function(error){

                console.warn(
                    "AURA speech error:",
                    error
                );

            };


        window.speechSynthesis.speak(
            utterance
        );


    }catch(error){

        console.warn(
            "AURA speech unavailable:",
            error
        );

    }

}

   SESİ DURDUR

}


/* =========================================================
   SPEECH RECOGNITION DESTEĞİ
   ========================================================= */

const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition ||
    null;


/* =========================================================
   MİKROFON DURUMU
   ========================================================= */

let recognition = null;


/* =========================================================
   MİKROFON HAZIRLA
   ========================================================= */

function setupSpeechRecognition(){

    if(!SpeechRecognition){

        recognition = null;

        return false;

    }


    try{

        recognition =
            new SpeechRecognition();


        recognition.lang =
            AURA_CONFIG.language;


        recognition.continuous =
            false;


        recognition.interimResults =
            true;


        recognition.maxAlternatives =
            1;


        /* -------------------------------------------------
           BAŞLADI
           ------------------------------------------------- */

        recognition.onstart =
            function(){

                state.listening =
                    true;


                if(micButton){

                    micButton.classList.add(
                        "listening"
                    );

                    micButton.setAttribute(
                        "aria-label",
                        "Mikrofonu durdur"
                    );

                }


                if(micIcon){

                    micIcon.textContent =
                        "■";

                }


                showToast(
                    "AURA seni dinliyor..."
                );

            };


        /* -------------------------------------------------
           SONUÇ
           ------------------------------------------------- */

        recognition.onresult =
            function(event){

                if(!messageInput){

                    return;

                }


                let finalText = "";

                let interimText = "";


                for(
                    let i =
                        event.resultIndex;
                    i <
                        event.results.length;
                    i++
                ){

                    const result =
                        event.results[i];


                    if(!result){

                        continue;

                    }


                    const transcript =
                        result[0]?.transcript ||
                        "";


                    if(
                        result.isFinal
                    ){

                        finalText +=
                            transcript;

                    }else{

                        interimText +=
                            transcript;

                    }

                }


                /*
                   Final sonuç geldiyse input'a yaz.
                */

                if(
                    finalText.trim()
                ){

                    messageInput.value =
                        finalText.trim();

                    autoResizeInput();

                }


                /*
                   Interim sonuç varsa kullanıcı
                   konuşurken geçici olarak göster.
                */

                else if(
                    interimText.trim()
                ){

                    messageInput.value =
                        interimText.trim();

                    autoResizeInput();

                }

            };


        /* -------------------------------------------------
           BİTTİ
           ------------------------------------------------- */

        recognition.onend =
            function(){

                state.listening =
                    false;


                if(micButton){

                    micButton.classList.remove(
                        "listening"
                    );

                    micButton.setAttribute(
                        "aria-label",
                        "Mikrofon"
                    );

                }


                if(micIcon){

                    micIcon.textContent =
                        "🎙";

                }


                /*
                   Tanıma bittikten sonra input'ta
                   metin varsa otomatik göndermiyoruz.

                   Kullanıcı metni kontrol edebilir.
                */

            };


        /* -------------------------------------------------
           HATA
           ------------------------------------------------- */

        recognition.onerror =
            function(event){

                state.listening =
                    false;


                if(micButton){

                    micButton.classList.remove(
                        "listening"
                    );

                }


                if(micIcon){

                    micIcon.textContent =
                        "🎙";

                }


                const error =
                    String(
                        event?.error ||
                        ""
                    );


                console.warn(
                    "AURA microphone error:",
                    error
                );


                if(
                    error ===
                    "not-allowed"
                ){

                    showToast(
                        "Mikrofon izni verilmedi."
                    );

                    return;

                }


                if(
                    error ===
                    "no-speech"
                ){

                    showToast(
                        "Konuşma algılanmadı."
                    );

                    return;

                }


                if(
                    error ===
                    "audio-capture"
                ){

                    showToast(
                        "Mikrofon kullanılamıyor."
                    );

                    return;

                }


                /*
                   abort gibi normal durumlarda
                   gereksiz hata göstermiyoruz.
                */

                if(
                    error !== "aborted"
                ){

                    showToast(
                        "Mikrofon kullanılamadı."
                    );

                }

            };


        return true;


    }catch(error){

        console.warn(
            "SpeechRecognition setup error:",
            error
        );

        recognition = null;

        return false;

    }

}


/* =========================================================
   MİKROFON BAŞLAT
   ========================================================= */

function startListening(){

    if(state.sending){

        return;

    }


    /*
       Tarayıcı SpeechRecognition desteklemiyorsa
       kullanıcıya anlaşılır bilgi veriyoruz.
    */

    if(!SpeechRecognition){

        showToast(
            "Bu tarayıcı sesli yazmayı desteklemiyor."
        );

        return;

    }


    /*
       Recognition daha önce hata verip null olduysa
       yeniden oluştur.
    */

    if(!recognition){

        setupSpeechRecognition();

    }


    if(!recognition){

        showToast(
            "Mikrofon başlatılamadı."
        );

        return;

    }


    /*
       Zaten dinliyorsa tekrar start çağırma.
    */

    if(state.listening){

        stopListening();

        return;

    }


    try{

        /*
           Önceki oturumu güvenli şekilde kapat.
        */

        try{

            recognition.abort();

        }catch(error){

            /*
               Abort hatası kritik değil.
            */

        }


        /*
           Yeni recognition oluşturmak Android
           tarayıcılarında daha stabil olabilir.
        */

        setupSpeechRecognition();


        if(!recognition){

            showToast(
                "Mikrofon başlatılamadı."
            );

            return;

        }


        recognition.start();


    }catch(error){

        console.warn(
            "Recognition start error:",
            error
        );


        state.listening =
            false;


        if(micButton){

            micButton.classList.remove(
                "listening"
            );

        }


        if(micIcon){

            micIcon.textContent =
                "🎙";

        }


        /*
           İkinci kez start denemiyoruz.
           Böylece Android'deki
           "already started" hatası oluşmuyor.
        */

        showToast(
            "Mikrofon şu anda başlatılamadı."
        );

    }

}


/* =========================================================
   MİKROFON DURDUR
   ========================================================= */

function stopListening(){

    if(!recognition){

        state.listening =
            false;

        return;

    }


    try{

        recognition.stop();

    }catch(error){

        console.warn(
            "Recognition stop error:",
            error
        );

    }


    state.listening =
        false;


    if(micButton){

        micButton.classList.remove(
            "listening"
        );

    }


    if(micIcon){

        micIcon.textContent =
            "🎙";

    }

}

/* =========================================================

   ========================================================= */

let lastSentText = "";
let lastSentTime = 0;


const originalSendMessage =
    window.sendMessage;


window.sendMessage =
    async function(){

        if(state.sending){

            return;

        }


        if(!messageInput){

            return;

        }


        const currentText =
            cleanMessageText(
                messageInput.value
            );


        if(!currentText){

            return;

        }


        const now =
            Date.now();


        /*
           Aynı mesaj 700 ms içerisinde tekrar
           gönderilmeye çalışılırsa engelle.
        */

        if(
            currentText === lastSentText &&
            now - lastSentTime < 700
        ){

            return;

        }


        lastSentText =
            currentText;

        lastSentTime =
            now;


        if(
            typeof originalSendMessage ===
            "function"
        ){

            return originalSendMessage();

        }

    };


/* =========================================================
