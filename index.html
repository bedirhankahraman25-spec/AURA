<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<meta name="theme-color" content="#010712">
<title>AURA AI</title>

<style>

*{
box-sizing:border-box;
-webkit-tap-highlight-color:transparent;
}

html,body{
width:100%;
height:100%;
margin:0;
}

body{
overflow:hidden;
font-family:Arial,Helvetica,sans-serif;
color:#e9fbff;
background:
radial-gradient(circle at 50% 22%,
#073c5c 0%,
#031d31 28%,
#010b16 60%,
#000207 100%);
}

.background-light{
position:fixed;
width:520px;
height:520px;
left:50%;
top:40px;
transform:translateX(-50%);
border-radius:50%;
background:
radial-gradient(circle,
rgba(0,210,255,.10),
rgba(0,110,210,.04) 42%,
transparent 72%);
filter:blur(8px);
pointer-events:none;
z-index:0;
}

.header{
width:100%;
height:58px;
display:flex;
align-items:center;
justify-content:space-between;
padding:0 18px;
position:relative;
z-index:20;
background:rgba(0,5,12,.88);
border-bottom:1px solid rgba(0,210,255,.24);
backdrop-filter:blur(12px);
}

.logo{
color:#00eaff;
font-size:20px;
font-weight:bold;
letter-spacing:5px;
text-shadow:
0 0 9px #00eaff,
0 0 24px rgba(0,220,255,.55);
}

.status{
display:flex;
align-items:center;
gap:7px;
color:#55ffcf;
font-size:9px;
letter-spacing:2px;
}

.status-dot{
width:6px;
height:6px;
border-radius:50%;
background:#55ffcf;
box-shadow:
0 0 7px #55ffcf,
0 0 15px #55ffcf;
}

.main{
width:100%;
height:calc(100dvh - 58px);
position:relative;
overflow:hidden;
}

.core{
position:absolute;
width:210px;
height:210px;
left:50%;
top:0;
transform:translateX(-50%);
display:flex;
align-items:center;
justify-content:center;
z-index:5;
transition:
top .5s cubic-bezier(.2,.8,.2,1),
transform .5s cubic-bezier(.2,.8,.2,1);
}

.main.panel-open .core{
top:0;
transform:translateX(-50%) scale(.90);
}

.main.panel-closed .core{
top:50%;
transform:translate(-50%,-50%) scale(1.08);
}

.ring{
position:absolute;
border-radius:50%;
border:1px solid rgba(0,225,255,.58);
box-shadow:0 0 9px rgba(0,220,255,.18);
}

.ring-one{
width:150px;
height:150px;
border-left-color:transparent;
border-right-color:transparent;
animation:rotateOne 7s linear infinite;
}

.ring-two{
width:184px;
height:184px;
border-top-color:transparent;
border-bottom-color:transparent;
animation:rotateTwo 10s linear infinite;
}

.core-glow{
position:absolute;
width:145px;
height:145px;
border-radius:50%;
background:
radial-gradient(circle,
rgba(0,235,255,.25),
rgba(0,125,220,.08) 48%,
transparent 72%);
filter:blur(8px);
animation:glowPulse 3s ease-in-out infinite;
}

.sphere{
width:108px;
height:108px;
display:flex;
align-items:center;
justify-content:center;
position:relative;
border-radius:50%;
z-index:6;

background:
radial-gradient(circle at 32% 27%,
#caffff 0%,
#38eaff 8%,
#0788a9 25%,
#034866 46%,
#012238 68%,
#000a13 100%);

border:2px solid rgba(125,250,255,.9);

box-shadow:
0 0 12px #00eaff,
0 0 35px rgba(0,220,255,.72),
0 0 70px rgba(0,110,255,.38),
inset -15px -15px 25px rgba(0,0,0,.58),
inset 9px 7px 17px rgba(180,255,255,.35);

animation:spherePulse 2.7s ease-in-out infinite;
}

.core-name{
color:#ecffff;
font-size:16px;
font-weight:bold;
letter-spacing:4px;
text-shadow:
0 0 5px #ffffff,
0 0 12px #00eaff,
0 0 25px #009dff;
z-index:10;
}

@keyframes spherePulse{
0%,100%{transform:scale(1);}
50%{transform:scale(1.07);}
}

@keyframes glowPulse{
0%,100%{
transform:scale(1);
opacity:.65;
}
50%{
transform:scale(1.13);
opacity:1;
}
}

@keyframes rotateOne{
from{transform:rotate(0deg);}
to{transform:rotate(360deg);}
}

@keyframes rotateTwo{
from{transform:rotate(360deg);}
to{transform:rotate(0deg);}
}

.chat-panel{
position:absolute;
left:50%;
bottom:0;
width:min(92%,640px);
height:calc(100% - 145px);
transform:translateX(-50%);
display:flex;
flex-direction:column;
z-index:10;

background:rgba(1,11,21,.70);

border:1px solid rgba(0,180,255,.20);
border-bottom:0;
border-radius:20px 20px 0 0;

backdrop-filter:blur(12px);
overflow:hidden;
touch-action:none;

transition:
height .45s ease,
transform .45s ease,
opacity .35s ease;
}

.main.panel-closed .chat-panel{
height:0;
transform:translateX(-50%) translateY(20px);
opacity:0;
pointer-events:none;
}

#chat{
width:100%;
height:100%;
overflow-y:auto;
padding:15px 12px 18px;
scrollbar-width:thin;
scrollbar-color:#0086ae transparent;
}

#chat::-webkit-scrollbar{
width:3px;
}

#chat::-webkit-scrollbar-thumb{
background:#008db8;
border-radius:10px;
}

.message{
max-width:80%;
padding:10px 13px;
margin-bottom:10px;
border-radius:12px;
font-size:13px;
line-height:1.45;
white-space:pre-wrap;
animation:messageIn .2s ease;
}

@keyframes messageIn{
from{
opacity:0;
transform:translateY(6px);
}
to{
opacity:1;
transform:translateY(0);
}
}

.message.aura{
margin-left:0;
margin-right:auto;
color:#ddfaff;

background:
linear-gradient(
135deg,
rgba(3,59,79,.82),
rgba(1,24,39,.88)
);

border-left:2px solid #00eaff;
border-top-left-radius:3px;
}

.message.user{
margin-left:auto;
margin-right:0;
color:#ffffff;

background:
linear-gradient(
135deg,
rgba(8,94,127,.92),
rgba(3,48,77,.95)
);

border-right:2px solid #4dffcf;
border-top-right-radius:3px;
}

.bottom{
position:absolute;
left:50%;
bottom:0;
width:min(92%,640px);
transform:translateX(-50%);
padding:9px 8px 10px;
z-index:15;

background:
linear-gradient(
180deg,
#041d31,
#020d1b
);

border:1px solid rgba(0,180,255,.22);
border-top:1px solid rgba(0,190,255,.20);
border-radius:0 0 20px 20px;

transition:
transform .45s ease,
opacity .35s ease;
}

.main.panel-closed .bottom{
transform:translate(-50%,120px);
opacity:0;
pointer-events:none;
}

.composer{
height:48px;
display:flex;
align-items:center;
gap:7px;
padding:4px 5px 4px 13px;
border-radius:14px;
background:#041b2d;
border:1px solid rgba(0,190,255,.32);
}

.composer:focus-within{
border-color:rgba(0,225,255,.75);
box-shadow:0 0 18px rgba(0,180,255,.12);
}

#input{
flex:1;
min-width:0;
height:100%;
border:0;
outline:0;
background:transparent;
color:#ffffff;
font-size:13px;
}

#input::placeholder{
color:#54798a;
}

.button{
width:40px;
height:40px;
flex-shrink:0;
border:0;
border-radius:11px;
cursor:pointer;
color:#00eaff;
background:#062b43;
font-size:16px;
}

.button:active{
transform:scale(.90);
}

.send{
color:#001923;
background:
linear-gradient(
135deg,
#00eaff,
#4dffcf
);
box-shadow:
0 0 15px rgba(0,220,255,.25);
}

@media(max-width:500px){

.core{
transform:translateX(-50%) scale(.84);
}

.main.panel-open .core{
transform:translateX(-50%) scale(.84);
}

.main.panel-closed .core{
transform:translate(-50%,-50%) scale(.95);
}

.chat-panel,
.bottom{
width:96%;
}

.message{
max-width:88%;
}

.composer{
height:46px;
}

.button{
width:38px;
height:38px;
}

}

</style>
</head>

<body>

<div class="background-light"></div>

<div class="header">

<div class="logo">
AURA
</div>

<div class="status">

<span class="status-dot"></span>

SYSTEM ONLINE

</div>

</div>

<div
class="main panel-open"
id="main"
>

<div
class="core"
id="core"
>

<div
class="ring ring-one"
></div>

<div
class="ring ring-two"
></div>

<div
class="core-glow"
></div>

<div
class="sphere"
>

<div class="core-name">
AURA
</div>

</div>

</div>

<div
class="chat-panel"
id="chatPanel"
>

<div id="chat">

<div class="message aura">
AURA çekirdeği başlatıldı.
</div>

<div class="message aura">
Sistem hazır. Seni dinliyorum.
</div>

</div>

</div>

<div
class="bottom"
id="bottom"
>

<div class="composer">

<input
id="input"
type="text"
placeholder="AURA'ya mesaj yaz..."
autocomplete="off"
>

<button
class="button"
id="mic"
type="button"
>
🎙
</button>

<button
class="button send"
id="send"
type="button"
>
➤
</button>

</div>

</div>

</div><script>

const main =
document.getElementById("main");

const chatPanel =
document.getElementById("chatPanel");

const input =
document.getElementById("input");

const send =
document.getElementById("send");

const mic =
document.getElementById("mic");

const chat =
document.getElementById("chat");


let panelClosed=false;


/* PANEL KAPAT */

function closePanel(){

panelClosed=true;

main.classList.remove(
"panel-open"
);

main.classList.add(
"panel-closed"
);

}


/* PANEL AÇ */

function openPanel(){

panelClosed=false;

main.classList.remove(
"panel-closed"
);

main.classList.add(
"panel-open"
);

}


/* MESAJ EKLE */

function addMessage(
text,
type
){

const message=
document.createElement(
"div"
);

message.className=
"message "+type;

message.textContent=
text;

chat.appendChild(
message
);

chat.scrollTop=
chat.scrollHeight;

}


/* MESAJ GÖNDER */

function sendMessage(){

const text=
input.value.trim();

if(!text){
return;
}

addMessage(
text,
"user"
);

input.value="";

setTimeout(
function(){

addMessage(
"Mesajını aldım. AURA prototip modu aktif.",
"aura"
);

},
350
);

}


/* GÖNDER BUTONU */

send.addEventListener(
"click",
function(event){

event.stopPropagation();

sendMessage();

}
);


/* ENTER */

input.addEventListener(
"keydown",
function(event){

if(
event.key==="Enter"
){

event.preventDefault();

sendMessage();

}

}
);


/* MİKROFON */

mic.addEventListener(
"click",
function(event){

event.stopPropagation();

addMessage(
"Sesli iletişim modülü hazır.",
"aura"
);

}
);


/* PANEL SÜRÜKLEME */

let startY=0;

let currentY=0;

let dragging=false;


chatPanel.addEventListener(
"touchstart",
function(event){

if(
event.touches.length!==1
){
return;
}

startY=
event.touches[0].clientY;

currentY=startY;

dragging=true;

},
{
passive:true
}
);


chatPanel.addEventListener(
"touchmove",
function(event){

if(!dragging){
return;
}

currentY=
event.touches[0].clientY;

},
{
passive:true
}
);


chatPanel.addEventListener(
"touchend",
function(){

if(!dragging){
return;
}

dragging=false;

const distance=
currentY-startY;


/* AŞAĞI */

if(
distance>70
){

closePanel();

return;

}


/* YUKARI */

if(
distance<-70
){

openPanel();

}

}
);


/* KAPALI PANELDE YUKARI */

let closedStartY=0;

let closedCurrentY=0;

let closedDragging=false;


main.addEventListener(
"touchstart",
function(event){

if(!panelClosed){
return;
}

if(
event.touches.length!==1
){
return;
}

closedStartY=
event.touches[0].clientY;

closedCurrentY=
closedStartY;

closedDragging=true;

},
{
passive:true
}
);


main.addEventListener(
"touchmove",
function(event){

if(
!closedDragging
){
return;
}

closedCurrentY=
event.touches[0].clientY;

},
{
passive:true
}
);


main.addEventListener(
"touchend",
function(){

if(
!closedDragging
){
return;
}

closedDragging=false;

const distance=
closedCurrentY-
closedStartY;


if(
distance<-60
){

openPanel();

}

}
);


/* BAŞLANGIÇ */

window.addEventListener(
"load",
function(){

input.focus();

}
);

</script>

</body>
</html>
