/* =========================================================
   RESET
   ========================================================= */

*{

    margin:0;

    padding:0;

    box-sizing:border-box;

    -webkit-tap-highlight-color:transparent;

}


html{

    width:100%;

    height:100%;

    background:#020817;

}


body{

    width:100%;

    height:100%;

    min-height:100vh;

    min-height:100dvh;

    overflow:hidden;

    background:
        radial-gradient(
            circle at 50% 45%,
            #082d59 0%,
            #03152d 30%,
            #020817 65%,
            #00030a 100%
        );

    color:#ffffff;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    user-select:none;

    -webkit-user-select:none;

}


button,
textarea{

    font-family:inherit;

}


/* =========================================================
   ANA UYGULAMA
   ========================================================= */

#auraApp{

    position:relative;

    width:100%;

    height:100vh;

    height:100dvh;

    overflow:hidden;

}


/* =========================================================
   ARKA PLAN
   ========================================================= */

#auraBackground{

    position:absolute;

    inset:0;

    overflow:hidden;

    pointer-events:none;

}


/* Büyük mavi ışık */

#auraBackground::before{

    content:"";

    position:absolute;

    width:80vw;

    height:80vw;

    max-width:700px;

    max-height:700px;

    left:50%;

    top:50%;

    transform:
        translate(
            -50%,
            -50%
        );

    border-radius:50%;

    background:
        radial-gradient(
            circle,
            rgba(
                0,
                145,
                255,
                .18
            ) 0%,
            rgba(
                0,
                105,
                255,
                .08
            ) 35%,
            transparent 72%
        );

    filter:blur(20px);

}


/* Hafif parçacık görünümü */

#auraBackground::after{

    content:"";

    position:absolute;

    inset:0;

    background-image:
        radial-gradient(
            circle,
            rgba(
                82,
                185,
                255,
                .45
            ) 1px,
            transparent 1.5px
        );

    background-size:48px 48px;

    opacity:.10;

}


/* =========================================================
   ÜST BAR
   ========================================================= */

.aura-topbar{

    position:absolute;

    z-index:20;

    top:0;

    left:0;

    right:0;

    height:76px;

    display:flex;

    align-items:center;

    justify-content:space-between;

    padding:
        0 20px;

}


/* =========================================================
   MARKA
   ========================================================= */

.aura-brand{

    display:flex;

    align-items:center;

    gap:11px;

}


.aura-brand-icon{

    width:40px;

    height:40px;

    border-radius:50%;

    display:flex;

    align-items:center;

    justify-content:center;

    color:#ffffff;

    font-size:17px;

    font-weight:700;

    background:
        radial-gradient(
            circle at 35% 30%,
            #55d7ff,
            #087ee8 48%,
            #003d9d 100%
        );

    border:
        1px solid
        rgba(
            110,
            210,
            255,
            .65
        );

    box-shadow:

        0 0 12px
        rgba(
            0,
            150,
            255,
            .65
        ),

        0 0 28px
        rgba(
            0,
            110,
            255,
            .3
        );

}


.aura-brand-name{

    font-size:19px;

    font-weight:700;

    letter-spacing:5px;

    color:#e9f8ff;

    text-shadow:

        0 0 10px
        rgba(
            50,
            185,
            255,
            .7
        );

}


.aura-brand-subtitle{

    margin-top:3px;

    font-size:7px;

    letter-spacing:3px;

    color:
        rgba(
            125,
            205,
            245,
            .55
        );

}


/* =========================================================
   ONLINE
   ========================================================= */

.aura-online{

    display:flex;

    align-items:center;

    gap:7px;

    color:
        rgba(
            115,
            210,
            255,
            .8
        );

    font-size:8px;

    letter-spacing:2px;

}


.aura-online-dot{

    width:7px;

    height:7px;

    border-radius:50%;

    background:#27caff;

    box-shadow:
        0 0 10px
        #27caff;

    animation:
        auraOnlinePulse
        1.8s
        ease-in-out
        infinite;

}


@keyframes auraOnlinePulse{

    0%,
    100%{

        opacity:.45;

        transform:scale(.8);

    }

    50%{

        opacity:1;

        transform:scale(1.15);

    }

}


/* =========================================================
   ANA EKRAN
   ========================================================= */

.aura-main{

    position:absolute;

    inset:0;

    display:flex;

    align-items:center;

    justify-content:center;

    padding-top:25px;

}


/* =========================================================
   AURA ÇEKİRDEĞİ
   ========================================================= */

#auraCore{

    position:relative;

    width:280px;

    height:280px;

    border:0;

    outline:none;

    background:transparent;

    display:flex;

    align-items:center;

    justify-content:center;

    cursor:pointer;

    touch-action:manipulation;

}


/* =========================================================
   DIŞ HALKA
   ========================================================= */

.aura-ring{

    position:absolute;

    width:255px;

    height:255px;

    border-radius:50%;

    border:
        1px solid
        rgba(
            30,
            165,
            255,
            .3
        );

    box-shadow:

        0 0 28px
        rgba(
            0,
            120,
            255,
            .15
        ),

        inset 0 0 28px
        rgba(
            0,
            120,
            255,
            .08
        );

    animation:
        auraRingRotate
        18s
        linear
        infinite;

}


.aura-ring::before{

    content:"";

    position:absolute;

    inset:13px;

    border-radius:50%;

    border:
        1px dashed
        rgba(
            50,
            185,
            255,
            .38
        );

    animation:
        auraRingReverse
        11s
        linear
        infinite;

}


.aura-ring::after{

    content:"";

    position:absolute;

    inset:28px;

    border-radius:50%;

    border:
        1px solid
        rgba(
            60,
            180,
            255,
            .12
        );

}


@keyframes auraRingRotate{

    from{

        transform:rotate(0deg);

    }

    to{

        transform:rotate(360deg);

    }

}


@keyframes auraRingReverse{

    from{

        transform:rotate(360deg);

    }

    to{

        transform:rotate(0deg);

    }

}


/* =========================================================
   MAVİ ÇEKİRDEK
   ========================================================= */

.aura-core-glow{

    position:absolute;

    width:194px;

    height:194px;

    border-radius:50%;

    background:
        radial-gradient(
            circle at 37% 27%,
            #8ce8ff 0%,
            #28b8ff 13%,
            #0787ff 31%,
            #0057d6 54%,
            #003388 75%,
            #001b52 100%
        );

    box-shadow:

        0 0 20px
        rgba(
            0,
            185,
            255,
            .95
        ),

        0 0 45px
        rgba(
            0,
            135,
            255,
            .7
        ),

        0 0 90px
        rgba(
            0,
            90,
            255,
            .45
        ),

        inset 0 0 38px
        rgba(
            170,
            240,
            255,
            .4
        );

    animation:
        auraCorePulse
        3s
        ease-in-out
        infinite;

}


@keyframes auraCorePulse{

    0%,
    100%{

        transform:scale(.97);

        box-shadow:

            0 0 20px
            rgba(
                0,
                185,
                255,
                .95
            ),

            0 0 45px
            rgba(
                0,
                135,
                255,
                .7
            ),

            0 0 90px
            rgba(
                0,
                90,
                255,
                .45
            ),

            inset 0 0 38px
            rgba(
                170,
                240,
                255,
                .4
            );

    }

    50%{

        transform:scale(1.025);

        box-shadow:

            0 0 27px
            rgba(
                0,
                200,
                255,
                1
            ),

            0 0 58px
            rgba(
                0,
                145,
                255,
                .82
            ),

            0 0 110px
            rgba(
                0,
                100,
                255,
                .58
            ),

            inset 0 0 45px
            rgba(
                190,
                245,
                255,
                .5
            );

    }

}


/* =========================================================
   ÇEKİRDEK PARLAKLIĞI
   ========================================================= */

.aura-core-glow::before{

    content:"";

    position:absolute;

    left:20%;

    top:12%;

    width:58%;

    height:31%;

    border-radius:50%;

    background:
        radial-gradient(
            ellipse,
            rgba(
                235,
                252,
                255,
                .55
            ),
            transparent 70%
        );

    transform:
        rotate(-20deg);

    filter:blur(3px);

}


/* =========================================================
   AURA YAZISI
   ========================================================= */

.aura-core-text{

    position:absolute;

    z-index:5;

    color:#ffffff;

    font-size:31px;

    font-weight:700;

    letter-spacing:7px;

    margin-left:7px;

    text-shadow:

        0 0 5px
        #ffffff,

        0 0 14px
        #8ce8ff,

        0 0 28px
        #009dff,

        0 0 52px
        #006cff;

    animation:
        auraTextPulse
        2.5s
        ease-in-out
        infinite;

}


@keyframes auraTextPulse{

    0%,
    100%{

        opacity:.86;

        transform:scale(.98);

    }

    50%{

        opacity:1;

        transform:scale(1.035);

    }

}


/* =========================================================
   ÇEKİRDEK ALT YAZISI
   ========================================================= */

.aura-core-hint{

    position:absolute;

    bottom:-26px;

    left:50%;

    transform:
        translateX(-50%);

    white-space:nowrap;

    color:
        rgba(
            120,
            210,
            255,
            .7
        );

    font-size:8px;

    letter-spacing:3px;

    text-shadow:
        0 0 10px
        rgba(
            0,
            150,
            255,
            .55
        );

}


/* =========================================================
   ÇEKİRDEK DURUMLARI
   ========================================================= */

#auraCore:active
.aura-core-glow{

    transform:scale(.92);

}


#auraCore.active
.aura-core-glow{

    animation:
        auraActivePulse
        1.4s
        ease-in-out
        infinite;

}


@keyframes auraActivePulse{

    0%,
    100%{

        transform:scale(1);

    }

    50%{

        transform:scale(1.045);

    }

}


#auraCore.listening
.aura-core-glow{

    box-shadow:

        0 0 28px
        rgba(
            0,
            220,
            255,
            1
        ),

        0 0 70px
        rgba(
            0,
            180,
            255,
            .85
        ),

        0 0 130px
        rgba(
            0,
            110,
            255,
            .65
        ),

        inset 0 0 45px
        rgba(
            200,
            250,
            255,
            .55
        );

}


#auraCore.processing
.aura-core-glow{

    animation:
        auraProcessing
        .7s
        ease-in-out
        infinite;

}


@keyframes auraProcessing{

    0%,
    100%{

        transform:scale(.97);

    }

    50%{

        transform:scale(1.07);

    }

}


/* =========================================================
   ALT BİLGİ
   ========================================================= */

.aura-bottom-info{

    position:absolute;

    z-index:10;

    left:0;

    right:0;

    bottom:22px;

    text-align:center;

    color:
        rgba(

            230,
            .4

    font-size:7px;

    letter-spacing:2px;

}


/* =========================================================
   MOBİL
   ========================================================= */

@media(
    max-width:430px

    #auraCore{

        width:245px;

        height:245px;

    }


    .aura-ring{

        width:225px;

        height:225px;

    }


    .aura-core-glow{

        width:172px;

        height:172px;

    }


    .aura-core-text{

        font-size:27px;

        letter-spacing:6px;

    }


    .aura-topbar{

        padding:
            0 15px;

    }


    .aura-brand-name{

        font-size:17px;

    }

}


/* =========================================================
   HAREKET AZALTMA
   ========================================================= */

@media(
    prefers-reduced-motion:reduce
){

    *,
    *::before,
    *::after{

        animation-duration:
            .01ms !important;

        animation-iteration-count:
            1 !important;

        transition-duration:
            .01ms !important;

    }

}

</style>

/* =========================================================
   AURA AI — 4 / 15
   TEMEL JAVASCRIPT SİSTEMİ
   ========================================================= */


/* =========================================================
   ELEMENTLER
   ========================================================= */

const auraCore =
    document.getElementById("auraCore");

const auraChatPanel =
    document.getElementById("auraChatPanel");

const auraCloseChat =
    document.getElementById("auraCloseChat");

const auraMessages =
    document.getElementById("auraMessages");

const auraTyping =
    document.getElementById("auraTyping");

const auraInput =
    document.getElementById("auraInput");

const auraMic =
    document.getElementById("auraMic");

const auraSend =
    document.getElementById("auraSend");

const auraToast =
    document.getElementById("auraToast");

const auraLoading =
    document.getElementById("auraLoading");

const onlineText =
    document.getElementById("onlineText");

const onlineDot =
    document.getElementById("onlineDot");


/* =========================================================
   KULLANICI BİLGİLERİ
   ========================================================= */

const kullaniciAdi =
    "Bedirhan Kahraman";

const sevgiliAdi =
    "Edanur Kahraman";


/* =========================================================
   AURA AYARLARI
   ========================================================= */

const AURA_CONFIG = {

    appName:
        "AURA",

    language:
        "tr-TR",

    storageKey:
        "aura_ai_memory_v4",

    chatKey:
        "aura_ai_chat_v4",

    maxMessages:
        150,

    maxMemoryItems:
        100,

    maxInputLength:
        4000

};


/* =========================================================
   DURUM DEĞİŞKENLERİ
   ========================================================= */

let auraState = {

    chatOpen:
        false,

    sending:
        false,

    listening:
        false,

    speaking:
        false,

    initialized:
        false,

    recognition:
        null,

    recognitionSupported:
        false,

    speechSupported:
        false,

    lastSentMessage:
        "",

    lastSentTime:
        0,

    currentRequestId:
        0

};


/* =========================================================
   HAFIZA
   ========================================================= */

let auraMemory = {

    userName:
        kullaniciAdi,

    girlfriendName:
        sevgiliAdi,

    facts:
        [],

    preferences:
        [],

    custom:
        {}

};


/* =========================================================
   SOHBET GEÇMİŞİ
   ========================================================= */

let auraChatHistory = [];


/* =========================================================
   GÜVENLİ STRING
   ========================================================= */

function safeString(value){

    if(
        value === null ||
        value === undefined
    ){

        return "";

    }

    return String(value);

}


/* =========================================================
   HTML GÜVENLİLEŞTİRME
   ========================================================= */

function escapeHTML(value){

    const text =
        safeString(value);

    return text
        .replace(
            /&/g,
            "&amp;"
        )
        .replace(
            /</g,
            "&lt;"
        )
        .replace(
            />/g,
            "&gt;"
        )
        .replace(
            /"/g,
            "&quot;"
        )
        .replace(
            /'/g,
            "&#039;"
        );

}


/* =========================================================
   ZAMAN
   ========================================================= */

function getTime(){

    try{

        return new Date()
            .toLocaleTimeString(
                "tr-TR",
                {
                    hour:"2-digit",
                    minute:"2-digit"
                }
            );

    }catch(error){

        return "";

    }

}


/* =========================================================
   TOAST
   ========================================================= */

let toastTimer =
    null;


function showToast(message){

    if(!auraToast){

        return;

    }


    auraToast.textContent =
        safeString(message);


    auraToast.classList.add(
        "show"
    );


    if(toastTimer){

        clearTimeout(
            toastTimer
        );

    }


    toastTimer =
        setTimeout(
            function(){

                auraToast.classList.remove(
                    "show"
                );

            },
            2600
        );

}


/* =========================================================
   ONLINE DURUMU
   ========================================================= */

function updateOnlineStatus(){

    const online =
        navigator.onLine;


    if(online){

        if(onlineText){

            onlineText.textContent =
                "ONLINE";

        }


        if(onlineDot){

            onlineDot.style.background =
                "#27caff";

        }

    }else{

        if(onlineText){

            onlineText.textContent =
                "OFFLINE";

        }


        if(onlineDot){

            onlineDot.style.background =
                "#64748b";

        }

    }

}


window.addEventListener(
    "online",
    updateOnlineStatus
);


window.addEventListener(
    "offline",
    updateOnlineStatus
);


/* =========================================================
   LOCAL STORAGE OKUMA
   ========================================================= */

function loadStorage(){

    try{

        const memoryData =
            localStorage.getItem(
                AURA_CONFIG.storageKey
            );


        if(memoryData){

            const parsedMemory =
                JSON.parse(
                    memoryData
                );


            if(
                parsedMemory &&
                typeof parsedMemory ===
                "object"
            ){

                auraMemory = {

                    userName:
                        safeString(
                            parsedMemory.userName
                        ) ||
                        kullaniciAdi,

                    girlfriendName:
                        safeString(
                            parsedMemory.girlfriendName
                        ) ||
                        sevgiliAdi,

                    facts:
                        Array.isArray(
                            parsedMemory.facts
                        )
                            ? parsedMemory.facts
                            : [],

                    preferences:
                        Array.isArray(
                            parsedMemory.preferences
                        )
                            ? parsedMemory.preferences
                            : [],

                    custom:
                        parsedMemory.custom &&
                        typeof parsedMemory.custom ===
                        "object"
                            ? parsedMemory.custom
                            : {}

                };

            }

        }


        const chatData =
            localStorage.getItem(
                AURA_CONFIG.chatKey
            );


        if(chatData){

            const parsedChat =
                JSON.parse(
                    chatData
                );


            if(
                Array.isArray(
                    parsedChat
                )
            ){

                auraChatHistory =
                    parsedChat
                        .filter(
                            function(item){

                                return (
                                    item &&
                                    (
                                        item.role ===
                                        "user"
                                        ||
                                        item.role ===
                                        "assistant"
                                    ) &&
                                    typeof item.content ===
                                    "string"
                                );

                            }
                        )
                        .slice(
                            -AURA_CONFIG.maxMessages
                        );

            }

        }

    }catch(error){

        console.warn(
            "AURA storage read error:",
            error
        );

    }

}


/* =========================================================
   LOCAL STORAGE KAYDETME
   ========================================================= */

function saveStorage(){

    try{

        localStorage.setItem(
            AURA_CONFIG.storageKey,
            JSON.stringify(
                auraMemory
            )
        );


        localStorage.setItem(
            AURA_CONFIG.chatKey,
            JSON.stringify(
                auraChatHistory
                    .slice(
                        -AURA_CONFIG.maxMessages
                    )
            )
        );

    }catch(error){

        console.warn(
            "AURA storage save error:",
            error
        );

    }

}


/* =========================================================
   HAFIZA SINIRLARI
   ========================================================= */

function trimMemory(){

    if(
        !Array.isArray(
            auraMemory.facts
        )
    ){

        auraMemory.facts = [];

    }


    if(
        !Array.isArray(
            auraMemory.preferences
        )
    ){

        auraMemory.preferences = [];

                        item.trim()
                    );

            )
            .slice(

            .slice(

            );

function trimChatHistory(){

            auraChatHistory.slice(
                -AURA_CONFIG.maxMessages
            );

    }

}


/* =========================================================
   MESAJI GEÇMİŞE EKLE
   ========================================================= */

function addToHistory(
    role,
    content
){

    const cleanContent =
        safeString(
            content
        ).trim();


    if(
        !cleanContent
    ){

        return;

    }


    if(
        role !== "user" &&
        role !== "assistant"
    ){

        return;

    }


    auraChatHistory.push({

        role:

        content:
            cleanContent,

        time:
            Date.now()

    });


    trimChatHistory();

    saveStorage();

}

function cleanInput(value){

    text =

    if(
        text.length >
        AURA_CONFIG.maxInputLength

        response === null ||

    ){

    }


    if(
        typeof response ===

        return response.trim();

    }


    if(

            return response.text.trim();

        }


        if(
            typeof response.message ===

            return response.message.trim();

        }


        if(

            "string"
        ){

            return response.content.trim();

        }

    }


    return safeString(

}

        if(

            lastMessage.content !==

                content:
                    message

            await window.puter.ai.chat(
                messages
            );


        const response =
            normalizeAIResponse(
                result
            );


        if(response){

            return response;

        }


        return localAuraReply(
            message
        );

    }catch(error){

        console.warn(
            "AURA AI service error:",
            error
        );


        /*
           Burada kullanıcıya teknik
           "AI error" mesajı göstermiyoruz.

           Servis cevap veremezse yerel
           cevap sistemi devreye giriyor.
        */

        return localAuraReply(
            message

async function sendAuraMessage(

){

       Aynı anda ikinci istek başlatılmaz.
    */

    if(
        auraState.sending
    ){

        return;

    }


    const message =
        cleanInput(
            rawMessage
        );


    if(!message){

        return;

    }


    /*
       Çok kısa sürede aynı mesajın
       iki kere gönderilmesini engeller.
    */

    const now =
        Date.now();


    if(
        auraState.lastSentMessage ===
        message &&
        (
            now -
            auraState.lastSentTime
        ) <
        800
    ){

        return;

    }


    auraState.lastSentMessage =
        message;


    auraState.lastSentTime =
        now;


    if(auraInput){

        auraInput.value =
            "";

        autoResizeInput();

    }


    addUserMessage(
        message
    );


    setSendingState(
        true
    );


    showTyping();


    try{

        const requestId =
            ++auraState.currentRequestId;


        const reply =
            await requestAI(
                message
            );


        /*
           Eski bir istek sonradan dönerse
           ekrana yazılmaz.
        */

        if(
            requestId !==
            auraState.currentRequestId
        ){

            return;

        }


        hideTyping();


        const finalReply =
            normalizeAIResponse(
                reply
            );


        if(finalReply){

            addAssistantMessage(
                finalReply
            );

            /*
               Metin cevabı sesli okutma
               sistemi 9. parçada bağlanacak.
            */

            if(
                typeof window.AURASpeak ===
                "function"

                window.AURASpeak(
                    finalReply
                );

            }

        }else{

            addAssistantMessage(
                "Seni dinliyorum. Tekrar söyleyebilirsin."
            );

        }

    }catch(error){

        console.warn(
            "AURA send error:",
            error
        );


        hideTyping();


        /*
           Kullanıcıya "AI HATASI" gibi
           teknik hata göstermiyoruz.
        */

        const fallback =
            localAuraReply(
                message
            );


        addAssistantMessage(
            fallback
        );

    }finally{

        hideTyping();

        setSendingState(
            false
        );

    }

}

        );

        rememberMatch &&

            );

        }


        if(
            auraState.speaking
        ){

            stopAuraSpeech();

            return;

        }


        if(
            auraState.chatOpen
        ){

            closeAuraChat();

            setCoreState(
                "idle"
            );

        }

    }
);


/* =========================================================
   SON SİSTEM TESTİ
   ========================================================= */

function runAuraFinalTest(){

    const systems =
        checkAuraSystems();


    const coreOK =
        ensureAuraCoreWorks();


    const chatOK =
        ensureAuraChatWorks();


    const memoryOK =
        finalMemorySave();


    auraState.finalTest = {

        core:
            coreOK,

        chat:
            chatOK,

        memory:
            memoryOK,

        systems:
            systems,

        completed:
            true

    };


    return auraState.finalTest;

}


/* =========================================================
   AURA BAŞLANGIÇ
   ========================================================= */

function startAura(){

    try{

        /*
           Hafızayı yükle.
        */

        loadStorage();


        /*
           Hafızayı temiz/sınırlandır.
        */

        trimMemory();


        trimChatHistory();


        /*
           Geçmişi göster.
        */

        renderHistory();


        /*
           Online durumu.
        */

        updateOnlineStatus();


        /*
           Mobil ekran.
        */

        updateMobileViewport();


        /*
           Çekirdeği aktif hale getir.
        */

        ensureAuraCoreWorks();


        /*
           Sistem testi.
        */

        runAuraFinalTest();


        /*
           Başlangıç durumunu ayarla.
        */

        auraState.chatOpen =
            false;


        auraState.sending =
            false;


        auraState.listening =
            false;


        auraState.speaking =
            false;


        auraState.voiceInputUsed =
            false;


        setCoreState(
            "idle"
        );


        hideTyping();


        /*
           Loading ekranını kaldır.
        */

        hideAuraLoading();


        auraState.started =
            true;


        console.log(
            "AURA AI hazır."
        );

    }catch(error){

        /*
           AURA'nın başlangıcında hata olsa bile
           uygulamanın tamamen kapanmasını engelle.
        */

        console.warn(
            "AURA startup warning:",
            error
        );


        auraState.started =
            true;


        try{

            hideAuraLoading();

        }catch(
            loadingError
        ){

            console.warn(
                loadingError
            );

        }

    }

}


/* =========================================================
   STARTUP'I BİR KEZ ÇALIŞTIR
   ========================================================= */

if(
    !window.__AURA_STARTED__
){

    window.__AURA_STARTED__ =
        true;


    if(
        document.readyState ===
        "loading"
    ){

        document.addEventListener(
            "DOMContentLoaded",
            function(){

                setTimeout(
                    startAura,
                    150
                );

            },
            {
                once:true
            }
        );

    }else{

        setTimeout(
            startAura,
            150
        );

    }

}


/* =========================================================
   AURA GLOBAL API
   ========================================================= */

window.AURA =
    window.AURA || {};


window.AURA.start =
    startAura;


window.AURA.test =
    runAuraFinalTest;


window.AURA.sendFinal =
    AURAFinalSend;


window.AURA.getState =
    function(){

        return {

            initialized:
                auraState.initialized,

            started:
                auraState.started,

            chatOpen:
                auraState.chatOpen,

            sending:
                auraState.sending,

            listening:
                auraState.listening,

            speaking:
                auraState.speaking,

            online:
                auraState.online,

            memoryReady:
                auraState.memoryReady,

            aiReady:
                auraState.aiReady

        };

    };


/* =========================================================
   SON KONTROL
   ========================================================= */

setTimeout(
    function(){

        try{

            runAuraFinalTest();

            updateOnlineStatus();

            updateMobileViewport();

            syncCoreAnimation();

        }catch(error){

            console.warn(
                "AURA final check error:",
                error
            );

        }

    },
    700
);


/* =========================================================
   15 / 15 TAMAMLANDI
   ========================================================= */

console.log(
    "AURA AI — 15/15 yüklendi."
);

</script>
