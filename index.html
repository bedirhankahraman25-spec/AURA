<head>

<style>
*{
 box-sizing:border-box;
 margin:0;
 padding:0;
 -webkit-tap-highlight-color:transparent;
}

html,body{
 width:100%;
 height:100%;
 overflow:hidden;
}

body{
 background:
 radial-gradient(circle at 50% 45%,#07384b 0%,#031722 30%,#01060b 65%,#000 100%);
 color:#e8fbff;
 font-family:Arial,Helvetica,sans-serif;
}

button,input{
 font-family:inherit;
}

button{
 border:0;
 outline:0;
 cursor:pointer;
}

#app{
 width:100%;
 height:100%;
 position:relative;
 overflow:hidden;
}

#header{
 height:54px;
 position:absolute;
 top:0;
 left:0;
 right:0;
 z-index:20;
 display:flex;
 align-items:center;
 padding:0 16px;
 background:rgba(0,5,10,.82);
 border-bottom:1px solid rgba(0,234,255,.15);
 backdrop-filter:blur(14px);
}

#brand{

 font-size:18px;

 letter-spacing:4px;

}

#main{
 position:absolute;

 left:0;
 right:0;

}

#coreArea{
 position:absolute;
 inset:0;
 display:flex;
 align-items:center;
 justify-content:center;
 transition:transform .35s ease;
}

#auraCore{
 width:195px;
 height:195px;
 position:relative;
 border-radius:50%;
 display:flex;
 align-items:center;
 justify-content:center;
 cursor:pointer;
 user-select:none;
 transition:transform .3s ease;
}

#app.chat-open #coreArea{
 transform:translateY(-22%);
}

#app.chat-open #auraCore{

}
<style>
.core-ring{
 position:absolute;
 border-radius:50%;
 pointer-events:none;
}

.ring1{
 inset:0;
 border:1px solid rgba(0,234,255,.55);
 border-top-color:#00eaff;
 border-bottom-color:transparent;
 animation:r1 14s linear infinite;
}

.ring2{
 inset:17px;
 border:1px solid rgba(0,150,255,.45);
 border-left-color:#008cff;
 border-right-color:transparent;
 animation:r2 10s linear infinite;
}

.ring3{
 inset:34px;
 border:1px solid rgba(0,255,157,.22);
 animation:pulseRing 3s ease-in-out infinite;
}

.core-glow{
 width:96px;
 height:96px;
 position:absolute;
 border-radius:50%;
 background:radial-gradient(circle,#fff 0%,#9cfaff 9%,#00eaff 27%,#007dcc 48%,rgba(0,100,255,.15) 70%,transparent 76%);
 box-shadow:0 0 20px #00eaff,0 0 65px rgba(0,190,255,.55);
 animation:corePulse 2.4s ease-in-out infinite;
}

.core-text{
 position:absolute;
 z-index:5;
 color:#fff;
 font-size:22px;
 font-weight:900;
 letter-spacing:5px;
 text-shadow:0 0 8px #fff,0 0 22px #00eaff;
 pointer-events:none;
}

#auraCore.processing .core-glow{
 animation:corePulse .55s ease-in-out infinite;
}

#auraCore.listening .core-glow{
 animation:corePulse .7s ease-in-out infinite;
}

#auraCore.speaking .core-glow{
 animation:corePulse .3s ease-in-out infinite;
}

@keyframes r1{
 from{transform:rotate(0)}
 to{transform:rotate(360deg)}
}

@keyframes r2{
 from{transform:rotate(360deg)}
 to{transform:rotate(0)}
}

@keyframes pulseRing{
 0%,100%{transform:scale(.94);opacity:.3}
 50%{transform:scale(1.06);opacity:.8}
}

@keyframes corePulse{
 0%,100%{transform:scale(.94)}
 50%{transform:scale(1.08)}
}

.chat-panel{
 position:absolute;
 left:8px;
 right:8px;
 bottom:8px;
 height:min(58%,560px);
 z-index:40;
 display:flex;
 flex-direction:column;
 background:linear-gradient(180deg,rgba(7,17,28,.98),rgba(2,7,13,.99));
 border:1px solid rgba(0,234,255,.2);
 border-radius:20px;
 box-shadow:0 0 45px rgba(0,0,0,.5);
 backdrop-filter:blur(18px);
 transform:translateY(calc(100% + 30px));
 opacity:0;
 pointer-events:none;
 transition:transform .35s ease,opacity .25s ease;
}

#app.chat-open .chat-panel{
 transform:translateY(0);
 opacity:1;
 pointer-events:auto;
}
    <style>
.drag-handle{
 width:42px;
 height:4px;
 margin:7px auto 3px;
 border-radius:10px;

.chat-header{

.chat-status{

.close-chat{

}

.chat{

 scrollbar-width:thin;

}

.message{

.message.user{

.bubble{

}

.message.aura .bubble{

 border:1px solid rgba(0,234,255,.13);
}

.message.user .bubble{

 border:1px solid rgba(0,150,255,.25);
}

.msg-label{

 margin-bottom:3px;
 color:#00eaff;
 font-size:8px;
 font-weight:700;
 letter-spacing:1px;
}

.message.user .msg-label{
 color:#71bfff;
 text-align:right;
}

.typing{
 display:none;
 padding:0 12px 6px;
 color:#66838e;
 font-size:9px;
}

.typing.show{
 display:block;
}

@keyframes messageIn{
 from{opacity:0;transform:translateY(7px)}
 to{opacity:1;transform:translateY(0)}
}
    <style>
.input-area{
 display:flex;
 align-items:center;
 gap:6px;

 border-top:1px solid rgba(0,234,255,.09);

.input-wrap{

#userInput{

}

#userInput::placeholder{

}

#userInput:focus{

 box-shadow:0 0 16px rgba(0,220,255,.08);
}

.send-button{
 position:absolute;
 right:4px;
 top:4px;
 width:36px;
 height:36px;
 border-radius:10px;
 background:#00eaff;
 color:#001116;
 font-size:16px;
 font-weight:900;
}

.tool-button,.mic-button{
 width:44px;

}

.mic-button.active{

.file-preview{

 padding:7px 9px;

.file-preview.show{

}

.overlay{

 display:none;

 backdrop-filter:blur(8px);

.overlay.open{

<script src="https://js.puter.com/v2/"></script>

<script>
"use strict";

const AURA_VERSION = "5.0";

const USER_NAME =
 localStorage.getItem("aura_user_name") ||
 "Bedirhan Kahraman";

const GIRLFRIEND_NAME =
 localStorage.getItem("aura_girlfriend_name") ||
 "Edanur Kahraman";

const AURA = {
 chatOpen:false,
 processing:false,
 listening:false,
 speaking:false,
 online:navigator.onLine,
 voiceEnabled:
  localStorage.getItem("aura_voice") === "true",
 memories:[],
 history:[],
 tasks:[],
 recognition:null,
 pendingSecurity:null,
 messageCount:
  Number(localStorage.getItem("aura_messages") || 0)
};

const app =
 document.getElementById("app");

const core =
 document.getElementById("auraCore");

const chat =
 document.getElementById("chat");

const input =
 document.getElementById("userInput");

const sendButton =
 document.getElementById("sendButton");

const micButton =
 document.getElementById("micButton");

const fileInput =
 document.getElementById("fileInput");

const typing =
 document.getElementById("typing");

const filePreview =
 document.getElementById("filePreview");

const STORAGE = {
 memories:"aura_memories",
 history:"aura_history",
 tasks:"aura_tasks"
};

function loadJSON(key,fallback){
 try{
  const raw=localStorage.getItem(key);
  return raw ? JSON.parse(raw) : fallback;
 }catch(e){
  return fallback;
 }
}

function saveJSON(key,value){
 try{
  localStorage.setItem(key,JSON.stringify(value));
 }catch(e){
  console.error(e);
 }
}

AURA.memories =
 loadJSON(STORAGE.memories,[]);

AURA.history =
 loadJSON(STORAGE.history,[]);

AURA.tasks =
 loadJSON(STORAGE.tasks,[]);
    function toggleChatPanel(force){
 const next =
  typeof force === "boolean"
   ? force
   : !AURA.chatOpen;

 AURA.chatOpen=next;

 app.classList.toggle(
  "chat-open",
  next
 );

 if(next){
  setTimeout(()=>{
   input.focus();
   scrollChat();
  },250);
 }else{
  input.blur();
 }
}

core.addEventListener(
 "click",
 function(e){
  e.stopPropagation();
  toggleChatPanel();
 }
);

document
 .getElementById("closeChat")
 .addEventListener(
  "click",
  ()=>toggleChatPanel(false)
 );

function scrollChat(){
 chat.scrollTop=chat.scrollHeight;
}

function setCoreState(state){
 core.classList.remove(
  "processing",
  "listening",
  "speaking"
 );

 if(
  ["processing","listening","speaking"]
   .includes(state)
 ){
  core.classList.add(state);
 }
}

function toast(text){
 const el=document.getElementById("toast");

 el.textContent=String(text);
 el.classList.add("show");

 clearTimeout(toast.timer);

 toast.timer=setTimeout(
  ()=>el.classList.remove("show"),
  2200
 );
}

function setThinking(state){
 AURA.processing=state;

 typing.classList.toggle(
  "show",
  state
 );

 setCoreState(
  state ? "processing":"normal"
 );
    }
    function addMessage(
 text,
 sender="aura",
 speakIt=false
){
 const wrap=document.createElement("div");

 wrap.className=
  "message "+sender;

 const bubble=document.createElement("div");

 bubble.className="bubble";

 const label=document.createElement("span");

 label.className="msg-label";

 label.textContent=
  sender==="user"
   ? USER_NAME
   : "AURA";

 bubble.appendChild(label);

 bubble.appendChild(
  document.createTextNode(String(text))
 );

 wrap.appendChild(bubble);

 chat.appendChild(wrap);

 AURA.messageCount++;

 localStorage.setItem(
  "aura_messages",
  AURA.messageCount
 );

 scrollChat();

 if(
  sender==="aura" &&
  speakIt
 ){
  speak(text);
 }
}

function recordHistory(user,aura){
 AURA.history.push({
  user:String(user),
  aura:String(aura),
  time:Date.now()
 });

 if(AURA.history.length>100){
  AURA.history=
   AURA.history.slice(-100);
 }

 saveJSON(
  STORAGE.history,
  AURA.history
 );
}

function addMemory(key,value){
 key=String(key).trim();
 value=String(value).trim();

 if(!key||!value)return false;

 const old=
  AURA.memories.find(
   x=>x.key.toLocaleLowerCase("tr-TR")
    ===key.toLocaleLowerCase("tr-TR")
  );

 if(old){
  old.value=value;
  old.updated=Date.now();
 }else{
  AURA.memories.push({
   id:
    Date.now()+"_"+Math.random(),
   key,
   value,
   created:Date.now()
  });
 }

 saveJSON(
  STORAGE.memories,
  AURA.memories
 );

 return true;
}

function removeMemory(id){
 AURA.memories=
  AURA.memories.filter(
   x=>x.id!==id
  );

 saveJSON(
  STORAGE.memories,
  AURA.memories
 );
}

function memoryContext(){
 if(!AURA.memories.length){
  return "Kayıtlı özel bilgi yok.";
 }

 return AURA.memories
  .slice(-40)
  .map(
   x=>`${x.key}: ${x.value}`
  )
  .join("\n");
}
    function handleMemoryCommand(text){

 const lower=
  text.toLocaleLowerCase("tr-TR");

 let match=
  text.match(
   /(?:beni\s+hatırla|bunu\s+hatırla)\s*[:\-]?\s*(.+)/i
  );

 if(match){
  addMemory(
   "Kullanıcı bilgisi",
   match[1]
  );

  return "Tamam. Bu bilgiyi hafızama kaydettim.";
 }

 match=
  text.match(
   /(?:hafızana|hafızaya)\s+kaydet\s*[:\-]?\s*(.+)/i
  );

 if(match){
  addMemory(
   "Kullanıcı notu",
   match[1]
  );

  return "Bilgiyi hafızaya kaydettim.";
 }

 if(
  lower.includes("hafızanda ne var")||
  lower.includes("hafızamda ne var")||
  lower.includes("neyi hatırlıyorsun")
 ){
  return AURA.memories.length
   ? "Hafızamda şunlar var:\n\n"+
     memoryContext()
   : "Şu anda kayıtlı özel bilgi bulunmuyor.";
 }

 if(
  lower.includes("hafızanı temizle")
 ){
  AURA.memories=[];
  saveJSON(
   STORAGE.memories,
   AURA.memories
  );

  return "Hafızayı temizledim.";
 }

 return null;
}

function buildSystemPrompt(){

 return `
Sen AURA adında akıllı bir yapay zeka asistanısın.

Kullanıcının adı:
${USER_NAME}

Kullanıcının sevgilisi:
${GIRLFRIEND_NAME}

Edanur kullanıcının sevgilisidir.

Türkçe konuş.
Doğal, net ve akıllı cevaplar ver.
Gereksiz tekrar yapma.

Kullanıcının kalıcı hafızası:
${memoryContext()}

Yeteneklerin:
Genel sohbet, güncel bilgi araştırma,
hafıza, görev yönetimi, sesli giriş,
sesli cevap, dosya/görsel analizi,
kod yazma, açıklama ve sistem işlemleri.

Yapamadığın işlemi yapmış gibi gösterme.
`;
}
    function extractAIText(response){

 if(!response)return "";

 if(typeof response==="string"){
  return response.trim();
 }

 if(
  response.message &&
  typeof response.message.content==="string"
 ){
  return response.message.content.trim();
 }

 if(
  response.message &&
  Array.isArray(
   response.message.content
  )
 ){
  return response.message.content
   .map(
    x=>typeof x==="string"
     ? x
     : x?.text||""
   )
   .join("")
   .trim();
 }

 if(typeof response.text==="string"){
  return response.text.trim();
 }

 return "";
}

async function askAI(text){

 if(typeof puter==="undefined"){
  throw new Error(
   "Puter AI bağlantısı bulunamadı."
  );
 }

 const messages=[
  {
   role:"system",
   content:buildSystemPrompt()
  },

  ...AURA.history
   .slice(-12)
   .flatMap(
    x=>[
     {
      role:"user",
      content:x.user
     },
     {
      role:"assistant",
      content:x.aura
     }
    ]
   ),

  {
   role:"user",
   content:text
  }
 ];

 const response=
  await puter.ai.chat(
   messages,
   {
    model:"gpt-5.6-luna",
    temperature:.35,
    max_tokens:1800
   }
 );

 const answer=
  extractAIText(response);

 if(!answer){
  throw new Error(
   "AURA boş cevap aldı."
  );
 }

 return answer;
    }
    async function sendMessage(){

 const text=input.value.trim();

 if(!text||AURA.processing){
  return;
 }

 input.value="";

 if(!AURA.chatOpen){
  toggleChatPanel(true);
 }

 addMessage(
  text,
  "user",
  false
 );

 const memoryResponse=
  handleMemoryCommand(text);

 if(memoryResponse){

  addMessage(
   memoryResponse,
   "aura",
   AURA.voiceEnabled
  );

  recordHistory(
   text,
   memoryResponse
  );

  return;
 }

 setThinking(true);

 try{

  const answer=
   await askAI(text);

  setThinking(false);

  addMessage(
   answer,
   "aura",
   AURA.voiceEnabled
  );

  recordHistory(
   text,
   answer
  );

 }catch(error){

  console.error(
   "AURA AI ERROR:",
   error
  );

  setThinking(false);

  addMessage(
   "AURA bağlantısında bir hata oluştu. İnternet bağlantısını ve AI servisini kontrol et.",
   "aura",
   false
  );
 }
}

sendButton.addEventListener(
 "click",
 sendMessage
);

input.addEventListener(
 "keydown",
 function(e){
  if(e.key==="Enter"){
   e.preventDefault();
   sendMessage();
  }
 }
);
    function cleanSpeechText(text){

 return String(text)
  .replace(
   /https?:\/\/\S+/gi,
   " "
  )
  .replace(
   /[\p{Emoji_Presentation}\p{Extended_Pictographic}]/gu,
   " "
  )
  .replace(
   /[*_`#~\[\]{}<>|\\/+=@#$%^&;:"'“”‘’!?.,…-]/g,
   " "
  )
  .replace(
   /\s+/g,
   " "
  )
  .trim();
}

function speak(text){

 if(!AURA.voiceEnabled)return;

 if(!("speechSynthesis" in window)){
  return;
 }

 const clean=
  cleanSpeechText(text);

 if(!clean)return;

 speechSynthesis.cancel();

 const utterance=
  new SpeechSynthesisUtterance(
   clean
  );

 utterance.lang="tr-TR";
 utterance.rate=.95;
 utterance.pitch=1;
 utterance.volume=1;

 utterance.onstart=()=>{
  AURA.speaking=true;
  setCoreState("speaking");
 };

 utterance.onend=()=>{
  AURA.speaking=false;
  setCoreState("normal");
 };

 speechSynthesis.speak(
  utterance
 );
}
    function setupSpeech(){

 const Recognition=
  window.SpeechRecognition||
  window.webkitSpeechRecognition;

 if(!Recognition){
  micButton.disabled=true;
  return;
 }

 AURA.recognition=
  new Recognition();

 AURA.recognition.lang=
  "tr-TR";

 AURA.recognition.continuous=false;
 AURA.recognition.interimResults=false;

 AURA.recognition.onstart=()=>{
  AURA.listening=true;

  micButton.classList.add(
   "active"
  );

  setCoreState(
   "listening"
  );
 };

 AURA.recognition.onresult=
  event=>{

   const text=
    event.results[0][0]
     .transcript
     .trim();

   if(text){
    input.value=text;
    sendMessage();
   }
  };

 AURA.recognition.onerror=
  error=>{
   console.error(
    "Speech error:",
    error
   );

   AURA.listening=false;

   micButton.classList.remove(
    "active"
   );

   setCoreState("normal");
 };

 AURA.recognition.onend=()=>{
  AURA.listening=false;

  micButton.classList.remove(
   "active"
  );

  if(!AURA.processing){
   setCoreState("normal");
  }
 };
}

function startListening(){

 if(!AURA.recognition){
  toast(
   "Tarayıcı sesli girişi desteklemiyor."
  );
  return;
 }

 if(AURA.listening)return;

 if(!AURA.chatOpen){
  toggleChatPanel(true);
 }

 try{
  AURA.recognition.start();
 }catch(e){}
}

function stopListening(){

 if(
  AURA.recognition&&
  AURA.listening
 ){
  try{
   AURA.recognition.stop();
  }catch(e){}
 }
}

micButton.addEventListener(
 "click",
 ()=>{
  AURA.listening
   ? stopListening()
   : startListening();
 }
);
    const dragHandle=
 document.getElementById(
  "dragHandle"
 );

let dragStartY=null;

dragHandle.addEventListener(
 "touchstart",
 e=>{
  dragStartY=
   e.touches[0].clientY;
 },
 {passive:true}
);

dragHandle.addEventListener(
 "touchmove",
 e=>{

  if(dragStartY===null)return;

  const current=
   e.touches[0].clientY;

  if(
   current-dragStartY>65
  ){

   dragStartY=null;

   input.value="";

   filePreview.classList.remove(
    "show"
   );

   toggleChatPanel(false);
  }
 },
 {passive:true}
);

dragHandle.addEventListener(
 "touchend",
 ()=>{
  dragStartY=null;
 }
);

window.addEventListener(
 "online",
 ()=>{
  AURA.online=true;
 }
);

window.addEventListener(
 "offline",
 ()=>{
  AURA.online=false;
 }
);

document
 .getElementById("fileButton")
 .addEventListener(
  "click",
  ()=>{
   fileInput.click();
  }
);

fileInput.addEventListener(
 "change",
 function(){

  const file=this.files[0];

  if(!file)return;

  filePreview.textContent=
   file.name;

  filePreview.classList.add(
   "show"
  );

  this.value="";
 }
);
    function requestSecurity(
 text,
 callback
){

 const modal=
  document.getElementById(
   "securityModal"
  );

 document.getElementById(
  "securityText"
 ).textContent=text;

 AURA.pendingSecurity=
  callback;

 modal.classList.add(
  "open"
 );
}

document
 .getElementById(
  "securityCancel"
 )
 .onclick=()=>{
  AURA.pendingSecurity=null;

  document
   .getElementById(
    "securityModal"
   )
   .classList.remove(
    "open"
   );
 };

document
 .getElementById(
  "securityConfirm"
 )
 .onclick=()=>{

  const callback=
   AURA.pendingSecurity;

  AURA.pendingSecurity=null;

  document
   .getElementById(
    "securityModal"
   )
   .classList.remove(
    "open"
   );

  if(callback){
   callback();
  }
 };

document
 .getElementById(
  "overlay"
 )
 .addEventListener(
  "click",
  ()=>{
   document
    .getElementById(
     "overlay"
    )
    .classList.remove(
     "open"
    );
  }
 );
    function getTime(){

 return new Date()
  .toLocaleTimeString(
   "tr-TR",
   {
    hour:"2-digit",
    minute:"2-digit"
   }
  );
}

function getDate(){

 return new Date()
  .toLocaleDateString(
   "tr-TR",
   {
    weekday:"long",
    year:"numeric",
    month:"long",
    day:"numeric"
   }
  );
}

function localCommand(text){

 const lower=
  text.toLocaleLowerCase(
   "tr-TR"
  );

 if(
  lower.includes(
   "saat kaç"
  )
 ){

  return "Şu an saat "+getTime()+".";

 }

 if(
  lower.includes(
   "bugün günlerden ne"
  )||
  lower.includes(
   "bugünün tarihi"
  )
 ){

  return "Bugün "+getDate()+".";

 }

 if(
  lower==="sen kimsin"||
  lower.includes(
   "adın ne"
  )
 ){

  return (
   "Ben AURA. "
   +"Kullanıcına yardımcı olmak için "
   +"tasarlanmış yapay zeka asistanıyım."
  );

 }

 return null;
}

const originalSend=
 sendMessage;

sendMessage=
 async function(){

  const text=
   input.value.trim();

  if(!text)return;

  const local=
   localCommand(text);

  if(local){

   input.value="";

   addMessage(
    text,
    "user"
   );

   addMessage(
    local,
    "aura",
    AURA.voiceEnabled
   );

   recordHistory(
    text,
    local
   );

   return;
  }

  return originalSend();
 };
    function updateMemoryUI(){
 const count=
  AURA.memories.length;

 if(count>=0){
  document.title=
   "AURA AI • Memory "+count;
 }
}

function saveCurrentState(){
 saveJSON(
  STORAGE.memories,
  AURA.memories
 );

 saveJSON(
  STORAGE.history,
  AURA.history
 );

 saveJSON(
  STORAGE.tasks,
  AURA.tasks
 );
}

window.addEventListener(
 "beforeunload",
 saveCurrentState
);

document.addEventListener(
 "visibilitychange",
 ()=>{
  if(
   document.visibilityState===
   "hidden"
  ){
   saveCurrentState();
  }
);

function initializeAURA(){

 AURA.chatOpen=false;

 app.classList.remove(
  "chat-open"
 );

 setupSpeech();

 updateMemoryUI();

 setCoreState(
  "normal"
 );

 addMessage(
  "Selam Bedirhan. Sistem hazır.",
  "aura",
  false
 );

}

window.addEventListener(
 "load",
 initializeAURA
);
    window.AURA_API={

 getVersion(){
  return AURA_VERSION;
 },

 getMemory(){
  return [...AURA.memories];
 },

 addMemory,

 removeMemory,

 openChat(){
  toggleChatPanel(true);
 },

 closeChat(){
  toggleChatPanel(false);
 },

 speak,

 stopSpeaking(){
  if(
   "speechSynthesis" in window
  ){
   speechSynthesis.cancel();
  }
 },

 getStatus(){
  return {
   online:AURA.online,
   chatOpen:AURA.chatOpen,
   processing:AURA.processing,
   listening:AURA.listening,
   speaking:AURA.speaking,
   memories:
    AURA.memories.length,
   messages:
    AURA.messageCount
  };
 }

};

document.addEventListener(
 "keydown",
 event=>{

  if(
   event.key==="Escape" &&
   AURA.chatOpen
  ){
   toggleChatPanel(false);
  }

  if(
   event.key==="Enter" &&
   document.activeElement===
   input
  ){
   sendMessage();
  }

 }
);

if(
 "serviceWorker" in navigator
){
 navigator.serviceWorker
  .register("service-worker.js")
  .catch(
   ()=>{}
  );
    }
