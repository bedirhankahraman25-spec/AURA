<!DOCTYPE html>
<html lang="tr">
<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<meta name="theme-color"
      content="#02060a">

<title>AURA AI</title>

<style>

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
}

body {
    overflow: hidden;
    font-family: Arial, sans-serif;
    color: #00eaff;

    background:
        radial-gradient(
            circle at center,
            #06303d 0%,
            #02080c 50%,
            #000000 100%
        );
}

/* =========================
   ÜST BAR
========================= */

.top-bar {
    height: 60px;

    display: flex;
    align-items: center;
    justify-content: space-between;

    padding: 0 18px;

    background: rgba(0,10,15,0.9);

    border-bottom:
        1px solid
        rgba(0,234,255,0.4);
}

.logo {
    font-size: 21px;
    font-weight: bold;
    letter-spacing: 4px;

    text-shadow:
        0 0 10px #00eaff,
        0 0 25px #00eaff;
}

.status {
    font-size: 11px;
    letter-spacing: 2px;
    color: #55ffcc;
}

.status::before {
    content: "";

    display: inline-block;

    width: 7px;
    height: 7px;

    margin-right: 7px;

    border-radius: 50%;

    background: #55ffcc;

    box-shadow:
        0 0 8px #55ffcc,
        0 0 15px #55ffcc;
}

/* =========================
   ANA ALAN
========================= */

.main {
    height: calc(100vh - 60px);
    height: calc(100dvh - 60px);

    display: flex;
    flex-direction: column;
    align-items: center;

    min-height: 0;
}

/* =========================
   AURA ÇEKİRDEĞİ
========================= */

.aura-core {
    width: 210px;
    height: 210px;

    margin-top: 10px;

    position: relative;

    display: flex;
    align-items: center;
    justify-content: center;

    flex-shrink: 0;
}

.aura-ring {
    position: absolute;

    border-radius: 50%;

    border:
        1px solid
        #00eaff;

    opacity: 0.7;
}

.ring1 {
    width: 135px;
    height: 135px;

    border-left-color: transparent;
    border-right-color: transparent;

    animation:
        rotate1 7s linear infinite;
}

.ring2 {
    width: 175px;
    height: 175px;

    border-top-color: transparent;
    border-bottom-color: transparent;

    animation:
        rotate2 10s linear infinite;
}

.ring3 {
    width: 210px;
    height: 210px;

    border-left-color: transparent;
    border-bottom-color: transparent;

    animation:
        rotate1 14s linear infinite;
}

.aura-center {
    width: 100px;
    height: 100px;

    border-radius: 50%;

    border:
        2px solid
        #00eaff;

    display: flex;
    align-items: center;
    justify-content: center;

    color: #00eaff;

    font-size: 21px;
    font-weight: bold;

    letter-spacing: 3px;

    background:
        radial-gradient(
            circle,
            #064454,
            #02090d
        );

    box-shadow:
        0 0 15px #00eaff,
        0 0 45px rgba(0,234,255,0.7),
        inset 0 0 25px rgba(0,234,255,0.5);

    animation:
        pulse 2.2s infinite ease-in-out;

    z-index: 5;
}

@keyframes rotate1 {
    from {
        transform: rotate(0deg);
    }

    to {
        transform: rotate(360deg);
    }
}

@keyframes rotate2 {
    from {
        transform: rotate(360deg);
    }

    to {
        transform: rotate(0deg);
    }
}

@keyframes pulse {
    0%,
    100% {
        transform: scale(1);
    }

    50% {
        transform: scale(1.06);
    }
}

/* =========================
   DURUM
========================= */

.aura-status {
    margin-top: -8px;
    margin-bottom: 5px;

    font-size: 10px;
    letter-spacing: 3px;

    color: #8defff;
}

/* =========================
   SOHBET
========================= */

#chat {
    width: min(92%, 600px);

    flex: 1;
    min-height: 0;

    overflow-y: auto;

    padding:
        5px 5px 10px;
}

.message {
    max-width: 85%;

    padding:
        10px 13px;

    margin-bottom: 10px;

    border-radius: 10px;

    line-height: 1.4;

    white-space: pre-wrap;

    font-size: 14px;

    word-break: break-word;
}

.aura {
    background:
        rgba(0,35,45,0.8);

    margin-right: auto;

    border:
        1px solid
        rgba(0,234,255,0.25);
}

.user {
    background:
        rgba(0,90,120,0.8);

    margin-left: auto;

    color: white;
}

/* =========================
   ALT PANEL
========================= */

#bottom {
    width: 100%;

    min-height: 65px;

    display: flex;
    align-items: center;

    gap: 8px;

    padding: 10px;

    background:
        rgba(0,10,15,0.97);

    border-top:
        1px solid
        rgba(0,234,255,0.45);

    z-index: 10;
}

#input {
    flex: 1;

    min-width: 0;

    height: 45px;

    padding: 12px;

    border-radius: 8px;

    border:
        1px solid
        rgba(0,234,255,0.5);

    outline: none;

    background:
        rgba(0,25,32,0.95);

    color: #00eaff;

    font-size: 14px;
}

#input::placeholder {
    color: #548995;
}

button {
    height: 45px;

    border:
        1px solid
        #00eaff;

    border-radius: 8px;

    padding: 0 14px;

    background:
        rgba(0,60,75,0.9);

    color: #00eaff;

    font-size: 14px;

    cursor: pointer;
}

button:active {
    transform: scale(0.94);
}

button:disabled {
    opacity: 0.5;
    cursor: not-allowed;
}

.mic-button {
    width: 45px;
    padding: 0;
    font-size: 20px;
}

@media (max-width: 500px) {

    .aura-core {
        transform: scale(0.82);
        margin-top: 0;
        margin-bottom: -15px;
    }

    .logo {
        font-size: 18px;
    }

    button {
        padding: 0 11px;
    }
}

</style>

</head>

<body>

<div class="top-bar">

    <div class="logo">
        AURA
    </div>

    <div class="status">
        ONLINE
    </div>

</div>

<div class="main">

    <div class="aura-core">

        <div class="aura-ring ring1"></div>
        <div class="aura-ring ring2"></div>
        <div class="aura-ring ring3"></div>

        <div class="aura-center">
            AURA
        </div>

    </div>

    <div class="aura-status">
        AI SYSTEM READY
    </div>

    <div id="chat"></div>

    <div id="bottom">

        <input
            id="input"
            type="text"
            placeholder="AURA'ya bir şey sor..."
            autocomplete="off"
        >

        <button
            class="mic-button"
            id="micButton"
            type="button">
            🎤
        </button>

        <button
            id="sendButton"
            type="button">
            Gönder
        </button>

    </div>

</div>

<script src="https://js.puter.com/v2/"></script>

<script>/* =====================================================
   AURA TEMEL AYARLARI
===================================================== */

const USER_NAME = "Bedirhan Kahraman";

const GIRLFRIEND_NAME = "Edanur Kahraman";

const MEMORY_KEY = "AURA_MEMORY_FINAL";

const CHAT_KEY = "AURA_CHAT_FINAL";

const TASK_KEY = "AURA_TASKS_FINAL";


/* =====================================================
   ELEMANLAR
===================================================== */

const chat = document.getElementById("chat");

const input = document.getElementById("input");

const sendButton =
    document.getElementById("sendButton");

const micButton =
    document.getElementById("micButton");


/* =====================================================
   LOCALSTORAGE
===================================================== */

function loadData(key, fallback) {

    try {

        const data =
            localStorage.getItem(key);

        if (data === null) {
            return fallback;
        }

        return JSON.parse(data);

    } catch (error) {

        console.error(
            "AURA veri okuma hatası:",
            error
        );

        return fallback;
    }
}


function saveData(key, value) {

    try {

        localStorage.setItem(
            key,
            JSON.stringify(value)
        );

        return true;

    } catch (error) {

        console.error(
            "AURA veri kaydetme hatası:",
            error
        );

        return false;
    }
}


/* =====================================================
   METİN
===================================================== */

function normalizeText(text) {

    return String(text || "")
        .toLocaleLowerCase("tr-TR")
        .trim()
        .replace(/\s+/g, " ");
}


/* =====================================================
   HAFIZA
===================================================== */

function emptyMemory() {

    return {
        facts: [],
        notes: [],
        preferences: []
    };
}


let auraMemory =
    loadData(
        MEMORY_KEY,
        emptyMemory()
    );


if (
    !auraMemory ||
    typeof auraMemory !== "object"
) {

    auraMemory = emptyMemory();
}


if (!Array.isArray(auraMemory.facts)) {
    auraMemory.facts = [];
}

if (!Array.isArray(auraMemory.notes)) {
    auraMemory.notes = [];
}

if (!Array.isArray(auraMemory.preferences)) {
    auraMemory.preferences = [];
}


function saveMemory() {

    saveData(
        MEMORY_KEY,
        auraMemory
    );
}


function addMemory(type, text) {

    if (!Array.isArray(auraMemory[type])) {
        return false;
    }

    const value =
        String(text || "").trim();

    if (!value) {
        return false;
    }

    const duplicate =
        auraMemory[type].some(
            item =>
                normalizeText(item.text) ===
                normalizeText(value)
        );

    if (duplicate) {
        return true;
    }

    auraMemory[type].push({

        text: value,

        date:
            new Date()
                .toLocaleString("tr-TR")

    });

    if (auraMemory[type].length > 100) {

        auraMemory[type] =
            auraMemory[type].slice(-100);
    }

    saveMemory();

    return true;
}


/* =====================================================
   HAFIZA METNİ
===================================================== */

function memoryText() {

    const result = [];


    if (auraMemory.facts.length > 0) {

        result.push(
            "Bilgiler:\n" +
            auraMemory.facts
                .map(item => "- " + item.text)
                .join("\n")
        );
    }


    if (auraMemory.preferences.length > 0) {

        result.push(
            "Tercihler:\n" +
            auraMemory.preferences
                .map(item => "- " + item.text)
                .join("\n")
        );
    }


    if (auraMemory.notes.length > 0) {

        result.push(
            "Notlar:\n" +
            auraMemory.notes
                .map(item => "- " + item.text)
                .join("\n")
        );
    }


    if (result.length === 0) {

        return "Henüz kayıtlı özel bilgi yok.";
    }


    return result.join("\n\n");
}


/* =====================================================
   HAFIZA KOMUTLARI
===================================================== */

function handleMemoryCommand(text) {

    const command =
        normalizeText(text);


    const notePatterns = [
        "not al ",
        "not kaydet ",
        "bunu not al ",
        "bunu kaydet ",
        "hafızana kaydet ",
        "hafizana kaydet "
    ];


    for (const pattern of notePatterns) {

        if (command.startsWith(pattern)) {

            const value =
                text
                    .substring(pattern.length)
                    .trim();

            if (!value) {

                return "Kaydedilecek notu belirt.";
            }

            addMemory("notes", value);

            return "Tamam. Notu hafızama kaydettim.";
        }
    }


    const factPatterns = [
        "bunu hatırla ",
        "bunu hatirla ",
        "bunu hafızana al ",
        "bunu hafizana al ",
        "bunu hafızanda tut ",
        "bunu hafizanda tut ",
        "bunu unutma "
    ];


    for (const pattern of factPatterns) {

        if (command.startsWith(pattern)) {

            const value =
                text
                    .substring(pattern.length)
                    .trim();

            if (!value) {

                return "Hatırlanacak bilgiyi belirt.";
            }

            addMemory("facts", value);

            return "Tamam. Bunu kalıcı hafızama kaydettim.";
        }
    }


    const preferencePatterns = [
        "tercihimi hatırla ",
        "tercihimi hatirla ",
        "şunu seviyorum ",
        "sunu seviyorum ",
        "şunu sevmiyorum ",
        "sunu sevmiyorum "
    ];


    for (const pattern of preferencePatterns) {

        if (command.startsWith(pattern)) {

            const value =
                text
                    .substring(pattern.length)
                    .trim();

            if (!value) {

                return "Hatırlanacak tercihi belirt.";
            }

            addMemory(
                "preferences",
                value
            );

            return "Tamam. Tercihini hafızama kaydettim.";
        }
    }


    if (
        command === "hafızamda ne var" ||
        command === "hafizamda ne var" ||
        command === "neyi hatırlıyorsun" ||
        command === "neyi hatirliyorsun" ||
        command === "hafızanı göster" ||
        command === "hafizani goster"
    ) {

        return memoryText();
    }


    if (
        command === "hafızanı temizle" ||
        command === "hafizani temizle" ||
        command === "tüm hafızanı sil" ||
        command === "tum hafizani sil"
    ) {

        auraMemory = emptyMemory();

        saveMemory();

        return "AURA hafızası tamamen temizlendi.";
    }


    if (
        command === "notlarımı sil" ||
        command === "notlarimi sil" ||
        command === "tüm notları sil" ||
        command === "tum notlari sil"
    ) {

        auraMemory.notes = [];

        saveMemory();

        return "Tüm notlar silindi.";
    }


    return null;
}/* =====================================================
   GÖREV SİSTEMİ
===================================================== */

let tasks =
    loadData(
        TASK_KEY,
        []
    );


if (!Array.isArray(tasks)) {
    tasks = [];
}


function saveTasks() {

    saveData(
        TASK_KEY,
        tasks
    );
}


function addTask(text) {

    const value =
        String(text || "").trim();

    if (!value) {
        return false;
    }

    tasks.push({

        text: value,

        completed: false,

        date:
            new Date()
                .toLocaleString("tr-TR")

    });


    if (tasks.length > 100) {

        tasks = tasks.slice(-100);
    }


    saveTasks();

    return true;
}


function taskCommand(text) {

    const command =
        normalizeText(text);


    if (
        command === "görevlerim" ||
        command === "gorevlerim" ||
        command === "görevlerimi göster" ||
        command === "gorevlerimi goster"
    ) {

        const active =
            tasks.filter(
                task => !task.completed
            );


        if (active.length === 0) {

            return "Şu anda bekleyen görevin yok.";
        }


        return (
            "Bekleyen görevlerin:\n\n" +
            active
                .map(
                    (task, index) =>
                        `${index + 1}. ${task.text}`
                )
                .join("\n")
        );
    }


    const prefixes = [
        "görev ekle ",
        "gorev ekle "
    ];


    for (const prefix of prefixes) {

        if (command.startsWith(prefix)) {

            const value =
                text
                    .substring(prefix.length)
                    .trim();

            if (!value) {

                return "Eklememi istediğin görevi yaz.";
            }

            addTask(value);

            return "Görev eklendi: " + value;
        }
    }


    if (
        command === "görevleri temizle" ||
        command === "gorevleri temizle"
    ) {

        tasks = [];

        saveTasks();

        return "Görev listesi temizlendi.";
    }


    return null;
}


/* =====================================================
   HESAPLAMA
===================================================== */

function calculate(text) {

    let expression =
        normalizeText(text);


    expression =
        expression
            .replace(/kaç eder/g, "")
            .replace(/kac eder/g, "")
            .replace(/hesapla/g, "")
            .trim();


    if (!expression) {
        return null;
    }


    if (
        !/^[0-9+\-*/%().,\s^]+$/
            .test(expression)
    ) {

        return null;
    }


    if (!/[0-9]/.test(expression)) {
        return null;
    }


    try {

        expression =
            expression
                .replace(/,/g, ".")
                .replace(/\^/g, "**");


        const result =
            Function(
                '"use strict"; return (' +
                expression +
                ')'
            )();


        if (
            typeof result !== "number" ||
            !Number.isFinite(result)
        ) {

            return null;
        }


        return "Sonuç: " + result;

    } catch (error) {

        return null;
    }
}


/* =====================================================
   TARİH / SAAT / KİMLİK
===================================================== */

function localCommand(text) {

    const command =
        normalizeText(text);


    if (
        command === "saat kaç" ||
        command === "saat kac" ||
        command === "şu an saat kaç" ||
        command === "su an saat kac"
    ) {

        const time =
            new Date()
                .toLocaleTimeString(
                    "tr-TR",
                    {
                        hour: "2-digit",
                        minute: "2-digit"
                    }
                );

        return "Şu an saat " + time + ".";
    }


    if (
        command === "bugün tarih ne" ||
        command === "bugun tarih ne" ||
        command === "tarih ne" ||
        command === "bugünün tarihi" ||
        command === "bugunun tarihi"
    ) {

        const date =
            new Date()
                .toLocaleDateString(
                    "tr-TR",
                    {
                        weekday: "long",
                        year: "numeric",
                        month: "long",
                        day: "numeric"
                    }
                );

        return "Bugün " + date + ".";
    }


    if (command === "ben kimim") {

        return "Sen " + USER_NAME + "'sın.";
    }


    if (
        command === "sevgilim kim" ||
        command === "sevgilimin adı ne" ||
        command === "sevgilimin adi ne"
    ) {

        return (
            "Sevgilinin adı " +
            GIRLFRIEND_NAME +
            "."
        );
    }


    if (
        command === "edanur kim" ||
        command === "eda kim"
    ) {

        return (
            GIRLFRIEND_NAME +
            ", senin sevgilin."
        );
    }


    if (
        command === "sen kimsin" ||
        command === "adın ne" ||
        command === "adin ne"
    ) {

        return (
            "Ben AURA. " +
            "Kişisel yapay zeka asistanınım."
        );
    }


    return null;
}


/* =====================================================
   ŞAKA
===================================================== */

function jokeCommand(text) {

    const command =
        normalizeText(text);


    if (
        !command.includes("şaka") &&
        !command.includes("saka")
    ) {

        return null;
    }


    const jokes = [

        "Matematik kitabı neden üzgünmüş? Çünkü çok problemi varmış.",

        "Bilgisayar neden doktora gitmiş? Virüs kapmış.",

        "Telefon neden gözlük takmış? Ekranı bulanıkmış.",

        "Elektrikçi neden yalnız kalmaz? Çünkü her zaman bir bağlantısı vardır.",

        "Programcı neden kahve içer? Çünkü kodu ayıkken çalışmıyormuş."

    ];


    return jokes[
        Math.floor(
            Math.random() * jokes.length
        )
    ];
}


/* =====================================================
   YEREL KOMUTLAR
===================================================== */

function localCommandHandler(text) {

    let result;


    result =
        handleMemoryCommand(text);

    if (result !== null) {
        return result;
    }


    result =
        taskCommand(text);

    if (result !== null) {
        return result;
    }


    result =
        localCommand(text);

    if (result !== null) {
        return result;
    }


    result =
        jokeCommand(text);

    if (result !== null) {
        return result;
    }


    result =
        calculate(text);

    if (result !== null) {
        return result;
    }


    return null;
}


/* =====================================================
   KONUŞMA GEÇMİŞİ
===================================================== */

let savedChat =
    loadData(
        CHAT_KEY,
        []
    );


if (!Array.isArray(savedChat)) {
    savedChat = [];
}


function saveChat() {

    if (savedChat.length > 100) {

        savedChat =
            savedChat.slice(-100);
    }

    saveData(
        CHAT_KEY,
        savedChat
    );
}


function addSavedChat(
    text,
    type
) {

    savedChat.push({

        text: String(text),

        type: type

    });

    saveChat();
        }/* =====================================================
   MESAJ GÖSTER
===================================================== */

function addMessage(
    text,
    type,
    save = true
) {

    const message =
        document.createElement("div");


    message.className =
        "message " + type;


    message.textContent =
        String(text);


    chat.appendChild(
        message
    );


    chat.scrollTop =
        chat.scrollHeight;


    if (
        save &&
        (
            type === "user" ||
            type === "aura"
        )
    ) {

        addSavedChat(
            text,
            type
        );
    }
}


/* =====================================================
   KAYITLI SOHBET
===================================================== */

function restoreChat() {

    if (savedChat.length === 0) {

        addMessage(
            "Merhaba. Ben AURA AI.\n\n" +
            "Sistem hazır. Seni dinliyorum.",
            "aura"
        );

        return;
    }


    savedChat
        .slice(-40)
        .forEach(item => {

            addMessage(
                item.text,
                item.type,
                false
            );

        });


    chat.scrollTop =
        chat.scrollHeight;
}


/* =====================================================
   SİSTEM MESAJI
===================================================== */

function systemPrompt() {

    return `

Sen AURA adında kişisel yapay zeka asistanısın.

Türkçe konuş.

Doğal konuş.

Kısa ve anlaşılır cevaplar ver.

Kullanıcının adı:
${USER_NAME}

Kullanıcının sevgilisi:
${GIRLFRIEND_NAME}

ÖNEMLİ:

Her mesajda kullanıcıya "Bedirhan" deme.

Gereksiz hitap kullanma.

Kullanıcı "ben kimim?" derse:
${USER_NAME}

Kullanıcı sevgilisini sorarsa:
${GIRLFRIEND_NAME}

Kullanıcı "sen kimsin?" derse:
Ben AURA, kişisel yapay zeka asistanıyım.

Bilmediğin bilgileri uydurma.

Kullanıcının kalıcı hafızası:

${memoryText()}

`;
}


/* =====================================================
   PUTER KONTROL
===================================================== */

function puterReady() {

    return (
        typeof puter !== "undefined" &&
        puter.ai &&
        typeof puter.ai.chat === "function"
    );
}


/* =====================================================
   PUTER BEKLE
===================================================== */

async function waitForPuter() {

    if (puterReady()) {
        return true;
    }


    for (
        let i = 0;
        i < 30;
        i++
    ) {

        await new Promise(
            resolve =>
                setTimeout(
                    resolve,
                    300
                )
        );


        if (puterReady()) {
            return true;
        }
    }


    return false;
}


/* =====================================================
   AI CEVABINI ÇIKAR
===================================================== */

function extractAnswer(response) {

    if (!response) {
        return "";
    }


    if (
        typeof response === "string"
    ) {

        return response.trim();
    }


    if (
        response.message &&
        typeof response.message.content === "string"
    ) {

        return response.message.content.trim();
    }


    if (
        response.message &&
        Array.isArray(
            response.message.content
        )
    ) {

        return response.message.content
            .map(part => {

                if (
                    typeof part === "string"
                ) {

                    return part;
                }


                if (
                    part &&
                    typeof part.text === "string"
                ) {

                    return part.text;
                }


                return "";
            })
            .join("")
            .trim();
    }


    if (
        typeof response.text === "string"
    ) {

        return response.text.trim();
    }


    return "";
}


/* =====================================================
   AI KONUŞMASI
===================================================== */

let conversation = [

    {
        role: "system",

        content:
            systemPrompt()
    }

];


/* =====================================================
   NORMAL AI
===================================================== */

async function askAI(text) {

    conversation[0] = {

        role: "system",

        content:
            systemPrompt()
    };


    conversation.push({

        role: "user",

        content: text
    });


    if (conversation.length > 31) {

        conversation =
            [
                conversation[0]
            ].concat(
                conversation.slice(-30)
            );
    }


    const ready =
        await waitForPuter();


    if (!ready) {

        conversation.pop();

        return (
            "AURA AI bağlantısı hazır değil. " +
            "İnternet bağlantını kontrol edip " +
            "sayfayı yenile."
        );
    }


    try {

        const response =
            await puter.ai.chat(
                conversation,
                {
                    model:
                        "gpt-5.4-nano",

                    temperature:
                        0.7
                }
            );


        const answer =
            extractAnswer(
                response
            );


        if (!answer) {

            conversation.pop();

            return (
                "AURA cevap oluşturamadı."
            );
        }


        conversation.push({

            role: "assistant",

            content: answer
        });


        return answer;

    } catch (error) {

        console.error(
            "AI HATASI:",
            error
        );


        if (
            conversation.length > 0 &&
            conversation[
                conversation.length - 1
            ].role === "user"
        ) {

            conversation.pop();
        }


        return (
            "AI bağlantısında bir sorun oluştu. " +
            "Tekrar deneyebiliriz."
        );
    }
}


/* =====================================================
   GÜNCEL BİLGİ KONTROLÜ
===================================================== */

function needsWebSearch(text) {

    const command =
        normalizeText(text);


    const words = [

        "internette ara",
        "internetten ara",
        "internette araştır",
        "internetten araştır",
        "webde ara",
        "web'de ara",
        "internetten bak",
        "güncel bilgi",
        "guncel bilgi",
        "son dakika",
        "güncel haber",
        "guncel haber",
        "haberler",
        "hava durumu"

    ];


    return words.some(
        word =>
            command.includes(word)
    );
}


/* =====================================================
   WEB ARAMALI AI
===================================================== */

async function askAIWeb(text) {

    const ready =
        await waitForPuter();


    if (!ready) {

        return askAI(text);
    }


    const messages = [

        {
            role: "system",

            content:
                systemPrompt()
        },

        {
            role: "user",

            content:
                text
        }

    ];


    try {

        const response =
            await puter.ai.chat(
                messages,
                {
                    model:
                        "openai/gpt-5.3-chat",

                    tools: [
                        {
                            type:
                                "web_search"
                        }
                    ]
                }
            );


        const answer =
            extractAnswer(
                response
            );


        if (answer) {

            return answer;
        }


        return askAI(text);

    } catch (error) {

        console.warn(
            "Web araması kullanılamadı:",
            error
        );


        return askAI(text);
    }
          }/* =====================================================
   SES TEMİZLEME
===================================================== */

function cleanSpeechText(text) {

    return String(text || "")

        .replace(
            /https?:\/\/\S+/gi,
            " "
        )

        .replace(
            /[\p{Emoji_Presentation}\p{Extended_Pictographic}]/gu,
            " "
        )

        .replace(
            /[.,!?;:"'“”‘’()[\]{}<>…\/\\|@#$%^&*_+=~`-]/g,
            " "
        )

        .replace(
            /\s+/g,
            " "
        )

        .trim();
}


/* =====================================================
   AURA KONUŞSUN
===================================================== */

function speak(text) {

    if (
        !("speechSynthesis" in window)
    ) {

        return;
    }


    const clean =
        cleanSpeechText(text);


    if (!clean) {
        return;
    }


    try {

        window.speechSynthesis.cancel();


        const voice =
            new SpeechSynthesisUtterance(
                clean
            );


        voice.lang =
            "tr-TR";

        voice.rate =
            0.9;

        voice.pitch =
            1;

        voice.volume =
            1;


        window.speechSynthesis.speak(
            voice
        );

    } catch (error) {

        console.error(
            "SES ÇIKIŞ HATASI:",
            error
        );
    }
}


/* =====================================================
   MİKROFON SİSTEMİ
===================================================== */

const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;


let recognition = null;

let isListening = false;


if (SpeechRecognition) {

    recognition =
        new SpeechRecognition();


    recognition.lang =
        "tr-TR";


    recognition.continuous =
        false;


    recognition.interimResults =
        false;


    recognition.maxAlternatives =
        1;


    recognition.onstart =
        function() {

            isListening = true;

            micButton.textContent =
                "🔴";

            micButton.disabled =
                false;
        };


    recognition.onend =
        function() {

            isListening = false;

            micButton.textContent =
                "🎤";

            micButton.disabled =
                false;
        };


    recognition.onerror =
        function(event) {

            console.error(
                "MİKROFON HATASI:",
                event
            );


            isListening = false;

            micButton.textContent =
                "🎤";

            micButton.disabled =
                false;


            if (
                event.error ===
                "not-allowed"
            ) {

                addMessage(
                    "Mikrofon izni verilmemiş. Tarayıcı ayarlarından mikrofon iznini aç.",
                    "aura"
                );
            }
        };


    recognition.onresult =
        function(event) {

            const result =
                event
                    .results[0][0]
                    .transcript
                    .trim();


            if (!result) {
                return;
            }


            input.value =
                result;


            sendMessage(
                true
            );
        };
}


/* =====================================================
   MİKROFON BUTONU
===================================================== */

micButton.addEventListener(
    "click",
    function() {

        if (!recognition) {

            addMessage(
                "Bu tarayıcı sesli komutu desteklemiyor. Chrome kullanmayı deneyebilirsin.",
                "aura"
            );

            return;
        }


        if (isListening) {

            try {

                recognition.stop();

            } catch (error) {

                console.error(
                    error
                );
            }

            return;
        }


        try {

            recognition.start();

        } catch (error) {

            console.error(
                "Mikrofon başlatma hatası:",
                error
            );
        }
    }
);


/* =====================================================
   MESAJ GÖNDERME
===================================================== */

let processing = false;


async function sendMessage(
    voiceMode = false
) {

    if (processing) {
        return;
    }


    const text =
        input.value.trim();


    if (!text) {
        return;
    }


    input.value =
        "";


    addMessage(
        text,
        "user"
    );


    addMessage(
        "Düşünüyorum...",
        "aura"
    );


    const loading =
        chat.lastElementChild;


    processing = true;


    sendButton.disabled =
        true;


    micButton.disabled =
        true;


    try {

        let reply =
            localCommandHandler(
                text
            );


        if (reply === null) {

            if (
                needsWebSearch(
                    text
                )
            ) {

                reply =
                    await askAIWeb(
                        text
                    );

            } else {

                reply =
                    await askAI(
                        text
                    );
            }
        }


        if (loading) {
            loading.remove();
        }


        addMessage(
            reply,
            "aura"
        );


        if (voiceMode) {

            speak(
                reply
            );
        }

    } catch (error) {

        console.error(
            "MESAJ İŞLEME HATASI:",
            error
        );


        if (loading) {
            loading.remove();
        }


        addMessage(
            "Beklenmeyen bir hata oluştu. Tekrar deneyelim.",
            "aura"
        );

    } finally {

        processing = false;

        sendButton.disabled =
            false;

        micButton.disabled =
            false;

        input.focus();
    }
}


/* =====================================================
   GÖNDER BUTONU
===================================================== */

sendButton.addEventListener(
    "click",
    function() {

        sendMessage(
            false
        );
    }
);

input.addEventListener(
