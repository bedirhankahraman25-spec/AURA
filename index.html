<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>AURA UI Test</title>

<style>
*{
    box-sizing:border-box;
}

html,body{
    margin:0;
    width:100%;
    height:100%;
}

body{
    overflow:hidden;
    font-family:Arial,sans-serif;
    color:#00eaff;
    background:
        radial-gradient(circle at 50% 25%,
        #073642 0%,
        #021319 45%,
        #000 100%);
}

/* ÜST BAR */

.top{
    height:58px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 18px;
    background:rgba(0,10,15,.9);
    border-bottom:1px solid rgba(0,234,255,.3);
}

.logo{
    font-size:20px;
    font-weight:bold;
    letter-spacing:5px;
    text-shadow:0 0 15px #00eaff;
}

.online{
    font-size:10px;
    letter-spacing:2px;
    color:#55ffcc;
}

.online::before{
    content:"";
    display:inline-block;
    width:6px;
    height:6px;
    margin-right:6px;
    border-radius:50%;
    background:#55ffcc;
    box-shadow:0 0 10px #55ffcc;
}

/* ANA */

.main{
    height:calc(100dvh - 58px);
    display:flex;
    flex-direction:column;
    align-items:center;
    min-height:0;
}

/* ÇEKİRDEK */

.core{
    width:180px;
    height:180px;
    margin-top:5px;
    position:relative;
    display:flex;
    align-items:center;
    justify-content:center;
    flex-shrink:0;
}

.ring{
    position:absolute;
    border:1px solid #00eaff;
    border-radius:50%;
    opacity:.65;
}

.r1{
    width:115px;
    height:115px;
    border-left-color:transparent;
    animation:spin 6s linear infinite;
}

.r2{
    width:150px;
    height:150px;
    border-top-color:transparent;
    animation:spin 9s linear reverse infinite;
}

.r3{
    width:180px;
    height:180px;
    border-right-color:transparent;
    border-bottom-color:transparent;
    animation:spin 13s linear infinite;
}

.center{
    width:82px;
    height:82px;
    border:2px solid #00eaff;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:17px;
    font-weight:bold;
    letter-spacing:3px;
    background:radial-gradient(circle,#07566a,#02090d);
    box-shadow:
        0 0 15px #00eaff,
        0 0 40px rgba(0,234,255,.45),
        inset 0 0 20px rgba(0,234,255,.4);
    animation:pulse 2.2s ease-in-out infinite;
}

@keyframes spin{
    to{transform:rotate(360deg);}
}

@keyframes pulse{
    50%{transform:scale(1.06);}
}

/* DURUM */

.status{
    margin-top:-</style>
</head>

<body>

<div class="top">
    <div class="logo">AURA</div>
    <div class="online">ONLINE</div>
</div>

<div class="main">

    <div class="core">
        <div class="ring r1"></div>
        <div class="ring r2"></div>
        <div class="ring r3"></div>

        <div class="center">AURA</div>
    </div>

    <div class="status">
        SYSTEM READY
    </div>

    <div id="chat">

        <div class="msg aura">
            Merhaba. Ben AURA.<br>
            Sistem hazır.
        </div>

        <div class="msg user">
            Merhaba AURA
        </div>

        <div class="msg aura">
            Seni dinliyorum.
        </div>

    </div>

    <div class="input-area">

        <div class="input-box">

            <span class="input-icon">›</span>

            <input
                id="text"
                type="text"
                placeholder="AURA'ya bir şey yaz..."
                autocomplete="off">

        </div>

        <button
            class="mic"
            type="button">
            🎤
        </button>

        <button
            class="send"
            id="send"
            type="button">
            ↑
        </button>

    </div>

</div>

<style>

/* MESAJ KUTUSU */

.input-area{
    width:100%;
    display:flex;
    align-items:center;
    gap:7px;
    padding:9px 10px;
    background:rgba(0,7,11,.96);
    border-top:1px solid rgba(0,234,255,.25);
}

.input-box{
    flex:1;
    height:44px;
    display:flex;
    align-items:center;
    padding:0 12px;
    border:1px solid rgba(0,234,255,.3);
    border-radius:13px;
    background:rgba(0,25,32,.9);
    transition:.2s;
}

.input-box:focus-within{
    border-color:#00eaff;
    box-shadow:0 0 12px rgba(0,234,255,.12);
}

.input-icon{
    margin-right:8px;
    font-size:22px;
    color:#00eaff;
    opacity:.7;
}

#text{
    width:100%;
    height:100%;
    border:0;
    outline:0;
    background:transparent;
    color:#eaffff;
    font-size:14px;
}

#text::placeholder{
    color:#527c85;
}

.mic,
.send{
    width:44px;
    height:44px;
    flex-shrink:0;
    border-radius:13px;
    cursor:pointer;
    transition:.15s;
}

.mic{
    border:1px solid rgba(0,234,255,.3);
    background:#06232d;
    color:#00eaff;
    font-size:17px;
}

.send{
    border:0;
    background:linear-gradient(135deg,#00eaff,#55ffcc);
    color:#002027;
    font-size:22px;
    font-weight:bold;
    box-shadow:0 0 12px rgba(0,234,255,.2);
}

.mic:active,
.send:active{
    transform:scale(.91);
}

/* TELEFON */

@media(max-width:500px){

    .core{
        transform:scale(.88);
        margin-top:-3px;
        margin-bottom:-10px;
    }

    .msg{
        max-width:88%;
        font-size:13px;
    }

    .input-area{
        padding:8px;
    }

    .input-box,
    .mic,
    .send{
        height:43px;
    }

    .mic,
    .send{
        width:43px;
    }
}

</style>

<script>

const chat =
    document.getElementById("chat");

const text =
    document.getElementById("text");

const send =
    document.getElementById("send");

function addMessage(message,type){

    const div =
        document.createElement("div");

    div.className =
        "msg " + type;

    div.textContent =
        message;

    chat.appendChild(div);

    chat.scrollTop =
        chat.scrollHeight;
}

function sendTest(){

    const value =
        text.value.trim();

    if(!value)return;

    addMessage(value,"user");

    text.value="";

    setTimeout(function(){

        addMessage(
            "Mesajını aldım. Bu şu an sadece AURA arayüz test sürümüdür.",
            "aura"
        );

    },400);
}

send.addEventListener(
    "click",
    sendTest
);

text.addEventListener(
    "keydown",
    function(e){

        if(e.key==="Enter"){
            e.preventDefault();
            sendTest();
        }

    }
);

</script>

</body>
</html>
