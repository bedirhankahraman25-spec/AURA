<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<meta name="theme-color" content="#020912">

<title>AURA AI</title>

<style>

*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,
body{
    width:100%;
    height:100%;
    margin:0;
}

body{
    overflow:hidden;
    font-family:Arial,Helvetica,sans-serif;
    color:#dffaff;

    background:
        radial-gradient(
            circle at 50% 35%,
            #073b57 0%,
            #05263b 30%,
            #020e19 65%,
            #00070d 100%
        );
}

button,
input{
    font:inherit;
}

button{
    border:0;
}

.app{
    width:100%;
    height:100dvh;

    display:flex;
    flex-direction:column;

    position:relative;
    overflow:hidden;
}

.topbar{
    height:64px;
    flex:0 0 64px;

    display:flex;
    align-items:center;
    justify-content:space-between;

    padding:0 18px;

    background:rgba(0,7,13,.94);

    border-bottom:
        1px solid
        rgba(0,234,255,.28);

    box-shadow:
        0 8px 30px
        rgba(0,0,0,.3);

    z-index:20;
}

.logo{
    font-size:22px;
    letter-spacing:6px;
    color:#00eaff;

    text-shadow:
        0 0 12px rgba(0,234,255,.9),
        0 0 25px rgba(0,234,255,.55);
}

.online{
    font-size:9px;
    letter-spacing:2px;
    color:#69ffd7;
}

.online i{
    display:inline-block;

    width:8px;
    height:8px;

    margin-right:7px;

    border-radius:50%;

    background:#55ffc8;

    box-shadow:
        0 0 12px #55ffc8;
}

.stage{
    position:relative;

    flex:1;
    min-height:0;

    overflow:hidden;
}

.background-glow{
    position:absolute;

    width:600px;
    height:600px;

    left:50%;
    top:50%;

    transform:translate(-50%,-50%);

    border-radius:50%;

    background:
        radial-gradient(
            circle,
            rgba(0,220,255,.12),
            rgba(0,100,220,.04) 45%,
            transparent 72%
        );

    filter:blur(12px);

    pointer-events:none;
}

.status-line{
    position:absolute;

    left:50%;
    top:15px;

    transform:translateX(-50%);

    color:#6b99a6;

    font-size:9px;
    letter-spacing:2px;

    z-index:2;
}

.core-zone{
    position:absolute;

    inset:0;

    display:flex;
    align-items:center;
    justify-content:center;

    transition:all .45s ease;

    z-index:3;

    pointer-events:none;
}

.app.chat-open .core-zone{
    align-items:flex-start;
    padding-top:32px;
}

.core-button{
    width:140px;
    height:140px;

    position:relative;

    display:flex;
    align-items:center;
    justify-content:center;

    border-radius:50%;

    cursor:pointer;

    pointer-events:auto;

    color:#fff;

    background:
        radial-gradient(
            circle at 35% 30%,
            #8dfbff 0%,
            #1595ad 18%,
            #053647 48%,
            #010b13 72%
        );

    border:
        2px solid
        #5af7ff;

    box-shadow:
        0 0 18px #00eaff,
        0 0 70px rgba(0,234,255,.5),
        inset 0 0 35px rgba(0,234,255,.55);

    animation:
        corePulse 2.8s
        ease-in-out
        infinite;

    user-select:none;
    outline:none;
}

.core-button:active{
    transform:scale(.96);
}

.core-text{
    font-size:18px;
    font-weight:700;
    letter-spacing:6px;

    text-shadow:
        0 0 8px #fff,
        0 0 18px #00eaff;
}

.ring{
    position:absolute;

    border:
        1px solid
        rgba(0,234,255,.65);

    border-radius:50%;

    pointer-events:none;
}

.r1{
    width:170px;
    height:170px;

    border-left-color:transparent;
    border-bottom-color:transparent;

    animation:
        rotateOne
        9s
        linear
        infinite;
}

.r2{
    width:195px;
    height:195px;

    border-right-color:transparent;
    border-top-color:transparent;

    animation:
        rotateTwo
        13s
        linear
        infinite;
}

.r3{
    width:220px;
    height:220px;

    border-left-color:transparent;
    border-right-color:transparent;

    opacity:.42;

    animation:
        rotateOne
        17s
        linear
        infinite;
}

@keyframes rotateOne{
    from{
        transform:rotate(0deg);
    }

    to{
        transform:rotate(360deg);
    }
}

@keyframes rotateTwo{
    from{
        transform:rotate(360deg);
    }

    to{
        transform:rotate(0deg);
    }
}

@keyframes corePulse{
    0%,
    100%{
        transform:scale(1);
    }

    50%{
        transform:scale(1.035);
    }
}.chat-panel{
    position:absolute;

    left:5px;
    right:5px;
    bottom:5px;

    height:72%;

    display:flex;
    flex-direction:column;

    background:
        rgba(1,12,21,.96);

    border:
        1px solid
        rgba(0,234,255,.35);

    border-radius:23px;

    box-shadow:
        0 0 35px rgba(0,0,0,.45),
        inset 0 0 25px rgba(0,234,255,.04);

    transform:
        translateY(calc(100% + 35px));

    opacity:0;

    pointer-events:none;

    transition:
        transform .45s cubic-bezier(.2,.8,.2,1),
        opacity .25s ease;

    z-index:4;

    overflow:hidden;

    touch-action:none;
}

.app.chat-open .chat-panel{
    transform:translateY(0);
    opacity:1;
    pointer-events:auto;
}

.chat-head{
    height:50px;
    flex:0 0 50px;

    display:flex;
    align-items:center;
    justify-content:space-between;

    padding:0 12px;

    border-bottom:
        1px solid
        rgba(0,234,255,.15);
}

.chat-head-left{
    display:flex;
    align-items:center;
    gap:7px;

    min-width:0;
}

.chat-title{
    font-size:9px;
    letter-spacing:2.5px;
    color:#8fefff;
    white-space:nowrap;
}

.file-hint{
    font-size:7px;
    color:#578592;
    letter-spacing:.5px;

    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;

    max-width:120px;
}

.close-btn{
    width:34px;
    height:34px;

    flex:0 0 34px;

    border-radius:50%;

    background:#08283a;

    color:#8fefff;

    cursor:pointer;
}

.messages{
    flex:1;
    min-height:0;

    overflow-y:auto;

    padding:
        15px
        6px
        112px;

    scroll-behavior:smooth;

    overscroll-behavior:contain;
}

.messages::-webkit-scrollbar{
    width:4px;
}

.messages::-webkit-scrollbar-thumb{
    background:rgba(0,234,255,.3);
    border-radius:10px;
}

.msg{
    width:fit-content;
    max-width:91%;

    padding:13px 15px;

    margin:
        0 6px 12px;

    border-radius:16px;

    line-height:1.5;

    font-size:14px;

    white-space:pre-wrap;

    overflow-wrap:anywhere;
    word-break:break-word;

    text-align:left;

    animation:
        messageIn .2s ease;
}

@keyframes messageIn{
    from{
        opacity:0;
        transform:translateY(6px);
    }

    to{
        opacity:1;
        transform:translateY(0);
    }
}

.msg.aura{
    margin-right:auto;

    background:
        linear-gradient(
            135deg,
            rgba(4,44,61,.96),
            rgba(2,24,35,.96)
        );

    border-left:
        3px solid
        #00eaff;

    border-radius:
        5px 18px 18px 18px;
}

.msg.user{
    margin-left:auto;

    background:
        linear-gradient(
            135deg,
            #0b6687,
            #07465e
        );

    border-right:
        3px solid
        #65faff;

    border-radius:
        18px 5px 18px 18px;

    color:#fff;
}

.input-area{
    position:absolute;

    left:7px;
    right:7px;
    bottom:7px;

    min-height:68px;

    padding:7px;

    display:grid;

    grid-template-columns:
        minmax(0,1fr)
        46px
        46px;

    gap:6px;

    align-items:center;

    background:
        rgba(2,24,37,.99);

    border:
        1px solid
        rgba(0,234,255,.65);

    border-radius:22px;

    box-shadow:
        0 0 20px
        rgba(0,234,255,.12);

    width:auto;
}

.input-wrap{
    min-width:0;

    width:100%;
    height:50px;

    display:flex;
    align-items:center;

    overflow:hidden;

    border-radius:17px;

    background:
        rgba(0,48,65,.75);
}

#input{
    width:100%;
    min-width:0;

    height:100%;

    padding:0 12px;

    border:0;
    outline:0;

    background:transparent;

    color:#e9fdff;

    font-size:14px;
}

#input::placeholder{
    color:#7195a3;
}

.action-button{
    width:46px;
    height:46px;

    min-width:46px;
    max-width:46px;

    padding:0;

    display:flex;
    align-items:center;
    justify-content:center;

    border-radius:16px;

    cursor:pointer;

    font-size:20px;

    transition:
        transform .15s,
        filter .15s;

    overflow:hidden;
}

.action-button:active{
    transform:scale(.92);
}

.action-button:disabled{
    opacity:.45;
    cursor:default;
}

#micButton{
    background:#063c59;

    color:#a9f8ff;

    border:
        1px solid
        rgba(0,234,255,.25);
}

#micButton.listening{
    background:#00a8bd;

    color:#fff;

    box-shadow:
        0 0 20px
        rgba(0,234,255,.7);
}

#sendButton{
    background:
        linear-gradient(
            135deg,
            #19ddeb,
            #15a7c9
        );

    color:#001018;

    font-size:23px;

    font-weight:900;

    box-shadow:
        0 0 15px
        rgba(0,234,255,.35);
}

.file-pill{
    display:none;

    margin:
        8px 12px 0;

    padding:
        8px 10px;

    border-radius:10px;

    background:#05293a;

    color:#86eefa;

    font-size:11px;
}

.file-pill.show{
    display:block;
}

.toast{
    position:fixed;

    left:50%;
    bottom:20px;

    transform:
        translate(-50%,20px);

    max-width:88%;

    padding:
        11px 16px;

    border:
        1px solid
        rgba(0,234,255,.4);

    border-radius:12px;

    background:#041522;

    color:#c4f9ff;

    font-size:13px;

    text-align:center;

    opacity:0;

    pointer-events:none;

    transition:.25s;

    z-index:100;
}

.toast.show{
    opacity:1;

    transform:
        translate(-50%,0);
}

.hidden{
    display:none!important;
}

</style>
</head><body>

<div class="app" id="app">

    <header class="topbar">

        <div class="logo">
            AURA
        </div>

        <div class="online">
            <i></i>
            SYSTEM ONLINE
        </div>

    </header>


    <main class="stage">

        <div class="background-glow"></div>

        <div
            class="status-line"
            id="statusLine">
        </div>


        <section class="core-zone">

            <button
                class="core-button"
                id="coreButton"
                type="button"
                aria-label="AURA sohbetini aç">

                <span class="ring r1"></span>
                <span class="ring r2"></span>
                <span class="ring r3"></span>

                <span class="core-text">
                    AURA
                </span>

            </button>

        </section>


        <section
            class="chat-panel"
            id="chatPanel">

            <div class="chat-head">

                <div class="chat-head-left">

                    <div class="chat-title">
                        AURA COMMUNICATION
                    </div>

                    <div class="file-hint">
                        Dosya için "dosya oku" yaz
                    </div>

                </div>

                <button
                    class="close-btn"
                    id="closeChat"
                    type="button">
                    ×
                </button>

            </div>


            <div
                class="file-pill"
                id="filePill">
            </div>


            <div
                class="messages"
                id="messages">
            </div>


            <div class="input-area">

                <div class="input-wrap">

                    <input
                        id="input"
                        type="text"
                        autocomplete="off"
                        placeholder="AURA'ya mesaj yaz..."
                    >

                </div>


                <button
                    id="micButton"
                    class="action-button"
                    type="button"
                    title="Sesli konuşma">
                    🎙
                </button>


                <button
                    id="sendButton"
                    class="action-button"
                    type="button"
                    title="Gönder">
                    ➤
                </button>

            </div>

        </section>

    </main>


    <input
        type="file"
        id="fileInput"
        class="hidden"
        accept=".txt,.md,.json,.csv,.html,.css,.js,.py"
    >


    <div
        class="toast"
        id="toast">
    </div>

</div>


<script src="https://js.puter.com/v2/"></script>

<script>

"use strict";


const app =
    document.getElementById("app");

const coreButton =
    document.getElementById("coreButton");

const closeChat =
    document.getElementById("closeChat");

const chatPanel =
    document.getElementById("chatPanel");

const messagesEl =
    document.getElementById("messages");

const input =
    document.getElementById("input");

const sendButton =
    document.getElementById("sendButton");

const micButton =
    document.getElementById("micButton");

const fileInput =
    document.getElementById("fileInput");

const filePill =
    document.getElementById("filePill");

const toast =
    document.getElementById("toast");

const statusLine =
    document.getElementById("statusLine");


const USER_NAME =
    "Bedirhan";

const GIRLFRIEND_NAME =
    "Edanur";

const AI_MODEL =
    "gpt-5.4-nano";


const STORAGE = {

    memory:
        "AURA_MEMORY_FINAL_2",

    tasks:
        "AURA_TASKS_FINAL_2",

    reminders:
        "AURA_REMINDERS_FINAL_2",

    history:
        "AURA_HISTORY_FINAL_2",

    knowledge:
        "AURA_KNOWLEDGE_FINAL_2"
};


const state = {

    memory:{
        facts:[],
        preferences:[],
        notes:[]
    },

    tasks:[],

    reminders:[],

    history:[],

    knowledge:[],

    fileContext:"",

    fileName:"",

    busy:false,

    listening:false,

    voiceRequest:false,

    recognition:null
};function loadJSON(
    key,
    fallback
){

    try{

        const raw =
            localStorage.getItem(key);

        if(!raw){
            return fallback;
        }

        return JSON.parse(raw);

    }catch(error){

        console.error(
            "Storage okuma:",
            error
        );

        return fallback;
    }
}


function saveJSON(
    key,
    value
){

    try{

        localStorage.setItem(
            key,
            JSON.stringify(value)
        );

    }catch(error){

        console.error(
            "Storage kayıt:",
            error
        );
    }
}


state.memory =
    loadJSON(
        STORAGE.memory,
        state.memory
    );

state.tasks =
    loadJSON(
        STORAGE.tasks,
        []
    );

state.reminders =
    loadJSON(
        STORAGE.reminders,
        []
    );

state.history =
    loadJSON(
        STORAGE.history,
        []
    );

state.knowledge =
    loadJSON(
        STORAGE.knowledge,
        [
            {
                title:"AURA",
                text:
                    "AURA, Bedirhan'ın kişisel yapay zeka projesidir."
            },
            {
                title:"Edanur",
                text:
                    "Edanur, Bedirhan'ın sevgilisidir."
            }
        ]
    );


function cleanText(
    value
){

    return String(
        value ?? ""
    ).trim();
}


function showToast(
    text
){

    toast.textContent =
        cleanText(text);

    toast.classList.add("show");

    clearTimeout(
        showToast.timer
    );

    showToast.timer =
        setTimeout(
            ()=>{
                toast.classList.remove("show");
            },
            2300
        );
}


function saveEverything(){

    saveJSON(
        STORAGE.memory,
        state.memory
    );

    saveJSON(
        STORAGE.tasks,
        state.tasks
    );

    saveJSON(
        STORAGE.reminders,
        state.reminders
    );

    saveJSON(
        STORAGE.history,
        state.history
    );

    saveJSON(
        STORAGE.knowledge,
        state.knowledge
    );
}


function addMessage(
    text,
    role="aura",
    persist=true
){

    const value =
        cleanText(text);

    if(!value){
        return;
    }


    const element =
        document.createElement("div");


    element.className =
        "msg " +
        (
            role === "user"
                ? "user"
                : "aura"
        );


    element.textContent =
        value;


    messagesEl.appendChild(
        element
    );


    requestAnimationFrame(
        ()=>{
            messagesEl.scrollTop =
                messagesEl.scrollHeight;
        }
    );


    if(persist){

        state.history.push({

            role:
                role === "user"
                    ? "user"
                    : "aura",

            text:value,

            time:Date.now()
        });


        if(
            state.history.length > 100
        ){

            state.history =
                state.history.slice(-100);
        }


        saveJSON(
            STORAGE.history,
            state.history
        );
    }
}


function resetVisibleChat(){

    messagesEl.innerHTML = "";

    filePill.textContent = "";

    filePill.classList.remove("show");

    state.fileContext = "";
    state.fileName = "";

    addMessage(
        "Selam Bedirhan, sistem hazır. Seni dinliyorum.",
        "aura",
        false
    );
}


function openChat(){

    resetVisibleChat();

    app.classList.add("chat-open");

    setTimeout(
        ()=>{
            input.focus();
        },
        300
    );
}


function closeChatBox(){

    app.classList.remove("chat-open");

    input.blur();

    resetVisibleChat();
}


coreButton.addEventListener(
    "click",
    ()=>{
        openChat();
    }
);


closeChat.addEventListener(
    "click",
    ()=>{
        closeChatBox();
    }
);


function memoryText(){

    const sections=[];


    if(
        state.memory.facts.length
    ){

        sections.push(
            "Bilgiler:\n" +
            state.memory.facts
                .map(
                    x =>
                        "- " + x.text
                )
                .join("\n")
        );
    }


    if(
        state.memory.preferences.length
    ){

        sections.push(
            "Tercihler:\n" +
            state.memory.preferences
                .map(
                    x =>
                        "- " + x.text
                )
                .join("\n")
        );
    }


    if(
        state.memory.notes.length
    ){

        sections.push(
            "Notlar:\n" +
            state.memory.notes
                .map(
                    x =>
                        "- " + x.text
                )
                .join("\n")
        );
    }


    return (
        sections.join("\n\n") ||
        "Kayıtlı özel bilgi yok."
    );
}


function addMemory(
    type,
    text
){

    if(
        !Array.isArray(
            state.memory[type]
        )
    ){
        return;
    }


    state.memory[type].push({

        text:
            cleanText(text),

        time:
            Date.now()
    });


    state.memory[type] =
        state.memory[type].slice(-100);


    saveJSON(
        STORAGE.memory,
        state.memory
    );
}


function saveConversation(
    userText,
    auraText
){

    state.history.push({

        role:"user",
        text:cleanText(userText),
        time:Date.now()
    });


    state.history.push({

        role:"aura",
        text:cleanText(auraText),
        time:Date.now()
    });


    if(
        state.history.length > 100
    ){

        state.history =
            state.history.slice(-100);
    }


    saveJSON(
        STORAGE.history,
        state.history
    );
}function memoryCommand(text){

    const lower =
        text
            .toLocaleLowerCase("tr-TR")
            .trim();


    const groups = [

        {
            type:"notes",

            prefixes:[
                "not al ",
                "not kaydet ",
                "bunu not al ",
                "bunu kaydet ",
                "hafızana kaydet ",
                "hafizana kaydet "
            ]
        },

        {
            type:"facts",

            prefixes:[
                "bunu hatırla ",
                "bunu hatirla ",
                "bunu hafızana al ",
                "bunu hafizana al ",
                "bunu unutma "
            ]
        },

        {
            type:"preferences",

            prefixes:[
                "tercihimi hatırla ",
                "tercihimi hatirla ",
                "şunu seviyorum ",
                "sunu seviyorum ",
                "şunu sevmiyorum ",
                "sunu sevmiyorum "
            ]
        }
    ];


    for(
        const group of groups
    ){

        for(
            const prefix of group.prefixes
        ){

            if(
                lower.startsWith(prefix)
            ){

                const value =
                    text
                        .slice(prefix.length)
                        .trim();


                if(!value){

                    return {
                        handled:true,
                        response:
                            "Kaydedilecek bilgiyi belirt."
                    };
                }


                addMemory(
                    group.type,
                    value
                );


                return {
                    handled:true,
                    response:
                        "Tamam, bunu hafızaya kaydettim."
                };
            }
        }
    }


    if(
        [
            "hafızamda ne var",
            "hafizamda ne var",
            "neyi hatırlıyorsun",
            "neyi hatirliyorsun"
        ].includes(lower)
    ){

        return {
            handled:true,
            response:memoryText()
        };
    }


    if(
        [
            "hafızanı temizle",
            "hafizani temizle"
        ].includes(lower)
    ){

        state.memory = {
            facts:[],
            preferences:[],
            notes:[]
        };


        saveJSON(
            STORAGE.memory,
            state.memory
        );


        return {
            handled:true,
            response:
                "AURA hafızası temizlendi."
        };
    }


    return {
        handled:false
    };
}


function taskCommand(text){

    const lower =
        text
            .toLocaleLowerCase("tr-TR")
            .trim();


    const match =
        lower.match(
            /^(?:görev ekle|gorev ekle)\s+(.+)$/
        );


    if(match){

        const start =
            text
                .toLocaleLowerCase("tr-TR")
                .indexOf(match[1]);


        const title =
            text
                .slice(start)
                .trim();


        state.tasks.push({

            id:Date.now(),

            title,

            done:false,

            time:Date.now()
        });


        saveJSON(
            STORAGE.tasks,
            state.tasks
        );


        return {
            handled:true,
            response:
                `Görev eklendi: ${title}`
        };
    }


    if(
        [
            "görevlerim",
            "gorevlerim",
            "görev listesi",
            "gorev listesi"
        ].includes(lower)
    ){

        if(
            !state.tasks.length
        ){

            return {
                handled:true,
                response:
                    "Görev listesi boş."
            };
        }


        return {
            handled:true,
            response:
                state.tasks
                    .map(
                        (x,index)=>
                            `${index+1}. ${
                                x.done ? "✓" : "○"
                            } ${x.title}`
                    )
                    .join("\n")
        };
    }


    const done =
        lower.match(
            /^(?:görevi tamamla|gorevi tamamla)\s+(\d+)$/
        );


    if(done){

        const index =
            Number(done[1])-1;


        if(
            state.tasks[index]
        ){

            state.tasks[index].done =
                true;


            saveJSON(
                STORAGE.tasks,
                state.tasks
            );


            return {
                handled:true,
                response:
                    "Görev tamamlandı."
            };
        }


        return {
            handled:true,
            response:
                "Bu numarada görev bulunamadı."
        };
    }


    return {
        handled:false
    };
}


function reminderCommand(text){

    const lower =
        text
            .toLocaleLowerCase("tr-TR")
            .trim();


    const match =
        lower.match(
            /^(?:hatırlat|hatirlat)\s+(\d+)\s*(saniye|dakika|dk|saat)\s+(.+)$/
        );


    if(match){

        const count =
            Number(match[1]);


        const unit =
            match[2];


        const index =
            text
                .toLocaleLowerCase("tr-TR")
                .indexOf(match[3]);


        const message =
            text
                .slice(index)
                .trim();


        const multiplier =
            unit === "saniye"
                ? 1000
                : unit === "saat"
                    ? 3600000
                    : 60000;


        const item = {

            id:Date.now(),

            msg:message,

            due:
                Date.now() +
                count *
                multiplier,

            done:false
        };


        state.reminders.push(item);


        saveJSON(
            STORAGE.reminders,
            state.reminders
        );


        scheduleReminder(item);


        return {
            handled:true,
            response:
                `${count} ${unit} sonra "${message}" için hatırlatacağım.`
        };
    }


    if(
        [
            "hatırlatıcılarım",
            "hatirlaticilarim"
        ].includes(lower)
    ){

        const active =
            state.reminders.filter(
                x =>
                    !x.done &&
                    x.due > Date.now()
            );


        if(
            !active.length
        ){

            return {
                handled:true,
                response:
                    "Aktif hatırlatıcı yok."
            };
        }


        return {
            handled:true,
            response:
                active
                    .map(
                        (x,index)=>
                            `${index+1}. ${x.msg} — ${new Date(x.due).toLocaleString("tr-TR")}`
                    )
                    .join("\n")
        };
    }


    return {
        handled:false
    };
}


function scheduleReminder(item){

    const delay =
        Math.max(
            0,
            item.due - Date.now()
        );


    setTimeout(
        ()=>{

            if(item.done){
                return;
            }


            item.done = true;


            saveJSON(
                STORAGE.reminders,
                state.reminders
            );


            const message =
                "Hatırlatıcı: " +
                item.msg;


            addMessage(
                message,
                "aura",
                true
            );


            try{

                if(
                    "Notification" in window &&
                    Notification.permission === "granted"
                ){

                    new Notification(
                        "AURA",
                        {
                            body:item.msg
                        }
                    );
                }

            }catch{}

        },
        Math.min(
            delay,
            2147483647
        )
    );

async function readFile(file){

    if(!file){
        return;
    }


    try{

        const name =
            file.name.toLowerCase();


        const supported =
            [
                ".txt",
                ".md",
                ".json",
                ".csv",
                ".html",
                ".css",
                ".js",
                ".py"
            ]
            .some(
                ext =>
                    name.endsWith(ext)
            );


        if(!supported){

            showToast(
                "Bu dosya türü şimdilik desteklenmiyor."
            );

            return;
        }


        const text =
            await file.text();


        state.fileName =
            file.name;


        state.fileContext =
            text.slice(
                0,
                30000
            );


        filePill.textContent =
            `Dosya: ${file.name}`;


        filePill.classList.add("show");


        addMessage(
            `${file.name} okundu. İçeriği hakkında soru sorabilirsin.`,
            "aura",
            true
        );


    }catch(error){

        console.error(
            "Dosya:",
            error
        );


        showToast(
            "Dosya okunamadı."
        );
    }
}

);function normalizeAIResponse(response){

    if(
        response === null ||
        response === undefined
    ){

        return "";
    }


    if(
        typeof response === "string"
    ){

        return response.trim();
    }


    if(
        typeof response.message?.content === "string"
    ){

        return response.message.content.trim();
    }


    if(
        Array.isArray(
            response.message?.content
        )
    ){

        return response.message.content
            .map(
                part =>
                    typeof part === "string"
                        ? part
                        : part?.text || ""
            )
            .join("")
            .trim();
    }


    if(
        typeof response.text === "string"
    ){

        return response.text.trim();
    }


    if(
        typeof response.content === "string"
    ){

        return response.content.trim();
    }


    return "";
}

async function askAI(text){

    if(
        typeof puter === "undefined"
    ){

        throw new Error(
            "Puter yüklenmedi."
        );
    }


    if(
        !puter.ai ||
        typeof puter.ai.chat !== "function"
    ){

        throw new Error(
            "Puter AI servisi bulunamadı."
        );
    }


    const messages = [

        {
            role:"system",
            content:buildPrompt()
        }

    ];


    state.history
        .slice(-12)
        .forEach(
            item => {

                if(
                    item &&
                    typeof item.text === "string"
                ){

                    messages.push({

                        role:
                            item.role === "user"
                                ? "user"
                                : "assistant",

                        content:item.text
                    });
                }
            }
        );


    messages.push({

        role:"user",
        content:String(text)
    });


    const response =
        await puter.ai.chat(
            messages
        );


    const answer =
        normalizeAIResponse(response);


    if(!answer){

        throw new Error(
            "AI metin döndürmedi."
        );
    }


    return answer;
}


function cleanSpeechText(text){

    let result =
        String(text ?? "");


    try{

        result =
            result.replace(
                /[\p{Emoji_Presentation}\p{Extended_Pictographic}]/gu,
                " "
            );

    }catch{

        result =
            result.replace(
                /[\u{1F300}-\u{1FAFF}]/gu,
                " "
            );
    }


    return result
        .replace(
            /https?:\/\/\S+/gi,
            " "
        )
        .replace(
            /[`*_#~|<>{}\[\]]/g,
            " "
        )
        .replace(
            /[•●◆◇★☆✓✔→←↑↓]/g,
            " "
        )
        .replace(
            /\s+/g,
            " "
        )
        .trim();
}


function speak(text){

    if(
        !("speechSynthesis" in window)
    ){

        return;
    }


    const clean =
        cleanSpeechText(text);


    if(!clean){
        return;
    }


    speechSynthesis.cancel();


    const utterance =
        new SpeechSynthesisUtterance(clean);


    utterance.lang = "tr-TR";
    utterance.rate = .92;
    utterance.pitch = 1;
    utterance.volume = 1;


    speechSynthesis.speak(
        utterance
    );
}

async function sendMessage(
    fromVoice=false
){

    if(state.busy){
        return;
    }


    const text =
        cleanText(input.value);


    if(!text){
        return;
    }


    const shouldSpeak =
        Boolean(
            fromVoice ||
            state.voiceRequest
        );


    state.voiceRequest = false;


    addMessage(
        text,
        "user",
        true
    );


    input.value = "";


    state.busy = true;

    sendButton.disabled = true;
    micButton.disabled = true;


    statusLine.textContent =
        "AURA DÜŞÜNÜYOR";


    try{

        const local =
            localCommand(text);


        if(
            local.handled
        ){

            addMessage(
                local.response,
                "aura",
                true
            );


            if(shouldSpeak){

                speak(
                    local.response
                );
            }


            return;
        }


        const answer =
            await askAI(text);


        addMessage(
            answer,
            "aura",
            true
        );


        saveConversation(
            text,
            answer
        );


        if(shouldSpeak){

            speak(answer);
        }


    }catch(error){

        console.error(
            "AURA AI HATASI:",
            error
        );


        addMessage(
            "AI bağlantısında bir sorun oluştu. Lütfen tekrar dene.",
            "aura",
            true
        );


    }finally{

        state.busy = false;

        sendButton.disabled = false;
        micButton.disabled = false;

        state.voiceRequest = false;

        statusLine.textContent = "";

        input.focus();
    }
}
