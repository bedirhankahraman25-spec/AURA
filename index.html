<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AURA AI</title>

<style>
*{
    box-sizing:border-box;
}

html,body{
    width:100%;
    height:100%;
    margin:0;
}

body{
    overflow:hidden;
    font-family:Arial,sans-serif;
    color:#dffcff;

    background:
        radial-gradient(
            circle at 50% 22%,
            #063b5b 0%,
            #031d32 25%,
            #010b17 55%,
            #000307 100%
        );
}

/* =========================
   ARKA PLAN
========================= */

body::before{
    content:"";
    position:fixed;
    inset:0;
    pointer-events:none;

    background:
        radial-gradient(
            circle at 20% 20%,
            rgba(0,120,255,.08),
            transparent 25%
        ),
        radial-gradient(
            circle at 80% 75%,
            rgba(0,190,255,.06),
            transparent 28%
        ),
        linear-gradient(
            120deg,
            transparent 0%,
            rgba(0,140,255,.035) 50%,
            transparent 100%
        );
}

body::after{
    content:"";
    position:fixed;
    inset:0;
    pointer-events:none;

    opacity:.16;

    background:
        linear-gradient(
            rgba(0,180,255,.08) 1px,
            transparent 1px
        ),
        linear-gradient(
            90deg,
            rgba(0,180,255,.08) 1px,
            transparent 1px
        );

    background-size:45px 45px;
}

/* =========================
   ÜST BAR
========================= */

.header{
    height:58px;

    display:flex;
    align-items:center;
    justify-content:space-between;

    padding:0 18px;

    background:
        rgba(0,5,12,.82);

    border-bottom:
        1px solid
        rgba(0,180,255,.25);

    position:relative;
    z-index:10;
}

.logo{
    color:#00dfff;

    font-size:20px;
    font-weight:bold;

    letter-spacing:5px;

    text-shadow:
        0 0 10px #00dfff,
        0 0 25px rgba(0,190,255,.6);
}

.status{
    display:flex;
    align-items:center;

    gap:7px;

    color:#53ffcc;

    font-size:9px;

    letter-spacing:2px;
}

.status-dot{
    width:6px;
    height:6px;

    border-radius:50%;

    background:#53ffcc;

    box-shadow:
        0 0 8px #53ffcc,
        0 0 16px #53ffcc;
}

/* =========================
   ANA ALAN
========================= */

.main{
    height:calc(100dvh - 58px);

    display:flex;
    flex-direction:column;
    align-items:center;

    min-height:0;

    position:relative;
    z-index:2;
}

/* =========================
   AURA KÜRESİ
========================= */

.core{
    width:230px;
    height:230px;

    margin-top:-5px;

    position:relative;

    display:flex;
    align-items:center;
    justify-content:center;

    flex-shrink:0;
}

/* Dış enerji halkaları */

.orbit{
    position:absolute;

    border-radius:50%;

    border:1px solid
        rgba(0,214,255,.65);

    box-shadow:
        0 0 10px
        rgba(0,200,255,.25);
}

.orbit.one{
    width:145px;
    height:145px;

    border-left-color:transparent;
    border-right-color:transparent;

    transform:rotate(25deg);

    animation:
        orbitA 5s linear infinite;
}

.orbit.two{
    width:180px;
    height:180px;

    border-top-color:transparent;
    border-bottom-color:transparent;

    transform:rotate(-35deg);

    animation:
        orbitB 8s linear infinite;
}

.orbit.three{
    width:215px;
    height:215px;

    border-left-color:transparent;
    border-bottom-color:transparent;

    transform:rotate(55deg);

    animation:
        orbitA 12s linear infinite;
}

/* Kürenin dış ışığı */

.core-glow{
    position:absolute;

    width:150px;
    height:150px;

    border-radius:50%;

    background:
        radial-gradient(
            circle,
            rgba(0,220,255,.22),
            rgba(0,100,180,.08) 45%,
            transparent 72%
        );

    filter:blur(5px);

    animation:
        glowPulse 2.5s ease-in-out infinite;
}

/* Kürenin kendisi */

.sphere{
    width:112px;
    height:112px;

    position:relative;

    border-radius:50%;

    background:
        radial-gradient(
            circle at 35% 28%,
            #a8faff 0%,
            #18d7f5 8%,
            #087da5 25%,
            #034263 48%,
            #011726 73%,
            #000810 100%
        );

    border:
        1px solid
        rgba(100,245,255,.85);

    box-shadow:
        0 0 12px #00dfff,
        0 0 35px rgba(0,200,255,.7),
        0 0 80px rgba(0,120,255,.35),
        inset -15px -12px 25px rgba(0,0,0,.55),
        inset 10px 8px 18px rgba(150,255,255,.35);

    animation:
        spherePulse 2.2s ease-in-out infinite;

    z-index:5;
}

/* Küre içindeki enerji çizgileri */

.sphere::before{
    content:"";

    position:absolute;

    left:8px;
    right:8px;

    top:50%;

    height:24px;

    transform:
        translateY(-50%)
        rotate(-18deg);

    border-top:
        1px solid
        rgba(160,250,255,.7);

    border-bottom:
        1px solid
        rgba(0,220,255,.45);

    border-radius:50%;

    box-shadow:
        0 0 8px
        rgba(0,234,255,.7);
}

.sphere::after{
    content:"";

    position:absolute;

    top:5px;
    bottom:5px;

    left:50%;

    width:28px;

    transform:
        translateX(-50%)
        rotate(28deg);

    border-left:
        1px solid
        rgba(130,245,255,.55);

    border-right:
        1px solid
        rgba(0,200,255,.35);

    border-radius:50%;
}

/* Kürenin merkez çekirdeği */

.core-center{
    position:absolute;

    width:30px;
    height:30px;

    border-radius:50%;

    background:
        radial-gradient(
            circle,
            #ffffff 0%,
            #9fffff 15%,
            #00dfff 35%,
            #007aab 65%,
            transparent 100%
        );

    box-shadow:
        0 0 8px #ffffff,
        0 0 20px #00eaff,
        0 0 40px #008cff;

    animation:
        coreFlash 1.8s ease-in-out infinite;

    z-index:7;
}

@keyframes orbitA{
    to{
        transform:rotate(385deg);
    }
}

@keyframes orbitB{
    to{
        transform:rotate(-395deg);
    }
}

@keyframes glowPulse{
    50%{
        transform:scale(1.12);
        opacity:.8;
    }
}

@keyframes spherePulse{
    50%{
        transform:scale(1.045);
        box-shadow:
            0 0 18px #00dfff,
            0 0 48px rgba(0,200,255,.8),
            0 0 90px rgba(0,120,255,.45),
            inset -15px -12px 25px rgba(0,0,0,.55),
            inset 10px 8px 18px rgba(150,255,255,.4);
    }
}

@keyframes coreFlash{
    50%{
        transform:scale(1.18);
        opacity:.8;
    }
}

/* =========================
   DURUM
========================= */

.system{
    margin-top:-8px;
    margin-bottom:7px;

    color:#79dff5;

    font-size:9px;

    letter-spacing:3px;

    text-shadow:
        0 0 8px
        rgba(0,210,255,.55);
}

/* =========================
   SOHBET
========================= */

.chat-panel{
    width:min(92%,640px);

    flex:1;

    min-height:0;

    display:flex;
    flex-direction:column;

    background:
        rgba(1,12,23,.55);

    border:
        1px solid
        rgba(0,170,255,.17);

    border-radius:
        18px 18px 0 0;

    backdrop-filter:blur(8px);

    overflow:hidden;
}

.panel-title{
    height:31px;

    display:flex;
    align-items:center;

    padding:0 13px;

    color:
        rgba(120,210,235,.55);

    font-size:8px;

    letter-spacing:2px;

    border-bottom:
        1px solid
        rgba(0,180,255,.12);
}

.panel-title::after{
    content:"";

    flex:1;

    height:1px;

    margin-left:10px;

    background:
        linear-gradient(
            90deg,
            rgba(0,200,255,.3),
            transparent
        );
}

#chat{
    flex:1;

    min-height:0;

    overflow-y:auto;

    padding:
        12px 12px 10px;

    scrollbar-width:thin;

    scrollbar-color:
        #007ea8 transparent;
}

#chat::-webkit-scrollbar{
    width:3px;
}

#chat::-webkit-scrollbar-thumb{
    background:#008fbd;

    border-radius:10px;
}

/* =========================
   MESAJLAR
========================= */

.message{
    max-width:82%;

    padding:
        10px 13px;

    margin-bottom:9px;

    border-radius:12px;

    font-size:13px;

    line-height:1.45;

    white-space:pre-wrap;

    animation:
        messageIn .2s ease;
}

@keyframes messageIn{
    from{
        opacity:0;
        transform:translateY(5px);
    }

    to{
        opacity:1;
        transform:translateY(0);
    }
}

.aura{
    margin-right:auto;

    color:#d9faff;

    background:
        linear-gradient(
            135deg,
            rgba(3,55,77,.72),
            rgba(1,23,38,.72)
        );

    border-left:
        2px solid
        #00dfff;

    border-top-left-radius:3px;

    box-shadow:
        0 4px 18px
        rgba(0,0,0,.18);
}

.user{
    margin-left:auto;

    color:#ffffff;

    background:
        linear-gradient(
            135deg,
            rgba(5,89,125,.8),
            rgba(3,49,78,.85)
        );

    border-right:
        2px solid
        #43ffce;

    border-top-right-radius:3px;
}

/* =========================
   ALT MESAJ PANELİ
========================= */

.bottom{
    width:min(92%,640px);

    padding:
        9px 8px 10px;

    background:
        linear-gradient(
            180deg,
            #031a2c,
            #020d1b
        );

    border:
        1px solid
        rgba(0,170,255,.2);

    border-top:0;

    border-radius:
        0 0 18px 18px;

    box-shadow:
        0 -10px 30px
        rgba(0,50,100,.18);
}

.composer{
    height:48px;

    display:flex;
    align-items:center;

    gap:7px;

    padding:
        4px 5px 4px 13px;

    border-radius:14px;

    background:
        #041d31;

    border:
        1px solid
        rgba(0,180,255,.3);

    box-shadow:
        inset 0 0 15px
        rgba(0,100,180,.08);

    transition:.2s;
}

.composer:focus-within{
    border-color:
        rgba(0,220,255,.7);

    box-shadow:
        0 0 18px
        rgba(0,180,255,.1),
        inset 0 0 15px
        rgba(0,100,180,.1);
}

#input{
    flex:1;

    min-width:0;

    height:100%;

    border:0;
    outline:0;

    background:transparent;

    color:white;

    font-size:13px;
}

#input::placeholder{
    color:#52798b;
}

.button{
    width:40px;
    height:40px;

    flex-shrink:0;

    border:0;

    border-radius:11px;

    cursor:pointer;

    color:#00dfff;

    background:
        #062b43;

    font-size:16px;

    transition:.15s;
}

.button:active{
    transform:scale(.9);
}

.send{
    color:#001821;

    background:
        linear-gradient(
            135deg,
            #00dfff,
            #45ffce
        );

    box-shadow:
        0 0 15px
        rgba(0,220,255,.25);
}

/* =========================
   MOBİL
========================= */

@media(max-width:500px){

    .core{
        transform:scale(.82);

        margin-top:-5px;
        margin-bottom:-13px;
    }

    .chat-panel,
    .bottom{
        width:96%;
    }

    .message{
        max-width:88%;
        font-size:13px;
    }

    .composer{
        height:46px;
    }

    .button{
        width:38px;
        height:38px;
    }
}
</style>
</head>

<body>

<div class="header">

    <div class="logo">
        AURA
    </div>

    <div class="status">
        <span class="status-dot"></span>
        SYSTEM ONLINE
    </div>

</div>


<div class="main">

    <div class="core">

        <div class="orbit one"></div>
        <div class="orbit two"></div>
        <div class="orbit three"></div>

        <div class="core-glow"></div>

        <div class="sphere"></div>

        <div class="core-center"></div>

    </div>


    <div class="system">
        AURA CORE // READY
    </div>


    <div class="chat-panel">

        <div class="panel-title">
            COMMUNICATION CHANNEL
        </div>

        <div id="chat">

            <div class="message aura">
                AURA çekirdeği başlatıldı.
            </div>

            <div class="message aura">
                Sistem hazır. Seni dinliyorum.
            </div>

        </div>

    </div>


    <div class="bottom">

        <div class="composer">

            <input
                id="input"
                type="text"
                placeholder="AURA'ya mesaj yaz..."
                autocomplete="off"
            >

            <button
                class="button"
                id="mic"
                type="button">
                🎙
            </button>

            <button
                class="button send"
                id="send"
                type="button">
                ➤
            </button>

        </div>

    </div>

</div>


<script>

const input =
    document.getElementById("input");

const send =
    document.getElementById("send");

const mic =
    document.getElementById("mic");

const chat =
    document.getElementById("chat");


function addMessage(text,type){

    const message =
        document.createElement("div");

    message.className =
        "message " + type;

    message.textContent =
        text;

    chat.appendChild(message);

    chat.scrollTop =
        chat.scrollHeight;
}


function sendMessage(){

    const text =
        input.value.trim();

    if(!text){
        return;
    }

    addMessage(
        text,
        "user"
    );

    input.value="";

    setTimeout(function(){

        addMessage(
            "Mesajını aldım. AURA prototip modu aktif.",
            "aura"
        );

    },350);
}


send.addEventListener(
    "click",
    sendMessage
);


input.addEventListener(
    "keydown",
    function(event){

        if(event.key==="Enter"){

            event.preventDefault();

            sendMessage();
        }

    }
);


mic.addEventListener(
    "click",
    function(){

        addMessage(
            "Sesli iletişim prototipte hazır.",
            "aura"
        );

    }
);

</script>

</body>
</html>
