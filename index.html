<html lang="tr">

<meta name="theme-color" content="#02060a">

<title>AURA AI</title>

<style>

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
}

body {
    overflow: hidden;
    font-family: Arial, sans-serif;
    color: #00eaff;

    background:
        radial-gradient(
            circle at center,
            #06303d 0%,
            #02080c 50%,
            #000000 100%
        );
}

/* ÜST BAR */

.top-bar {
    height: 60px;
    display: flex;
    align-items: center;
    justify-content: space-between;

    padding: 0 18px;

    background: rgba(0,10,15,0.9);
    border-bottom: 1px solid rgba(0,234,255,0.4);
}

.logo {
    font-size: 21px;
    font-weight: bold;
    letter-spacing: 4px;

    text-shadow:
        0 0 10px #00eaff,
        0 0 25px #00eaff;
}

.status {
    font-size: 11px;
    letter-spacing: 2px;
    color: #55ffcc;
}

.status::before {
    content: "";
    display: inline-block;

    width: 7px;
    height: 7px;

    margin-right: 7px;

    border-radius: 50%;

    background: #55ffcc;

    box-shadow:
        0 0 8px #55ffcc,
        0 0 15px #55ffcc;
}

/* ANA ALAN */

.main {
    height: calc(100vh - 60px);
    height: calc(100dvh - 60px);

    display: flex;
    flex-direction: column;
    align-items: center;

    min-height: 0;
}

/* AURA ÇEKİRDEĞİ */

.aura-core {
    width: 210px;
    height: 210px;

    margin-top: 10px;

    position: relative;

    display: flex;
    align-items: center;
    justify-content: center;

    flex-shrink: 0;
}

/* HALKALAR */

.aura-ring {
    position: absolute;

    border-radius: 50%;

    border: 1px solid #00eaff;

    opacity: 0.7;
}

.ring1 {
    width: 135px;
    height: 135px;

    border-left-color: transparent;
    border-right-color: transparent;

    animation: rotate1 7s linear infinite;
}

.ring2 {
    width: 175px;
    height: 175px;

    border-top-color: transparent;
    border-bottom-color: transparent;

    animation: rotate2 10s linear infinite;
}

.ring3 {
    width: 210px;
    height: 210px;

    border-left-color: transparent;
    border-bottom-color: transparent;

    animation: rotate1 14s linear infinite;
}

/* MERKEZ */

.aura-center {
    width: 100px;
    height: 100px;

    border-radius: 50%;

    border: 2px solid #00eaff;

    display: flex;
    align-items: center;
    justify-content: center;

    color: #00eaff;

    font-size: 21px;
    font-weight: bold;

    letter-spacing: 3px;

    background:
        radial-gradient(
            circle,
            #064454,
            #02090d
        );

    box-shadow:
        0 0 15px #00eaff,
        0 0 45px rgba(0,234,255,0.7),
        inset 0 0 25px rgba(0,234,255,0.5);

    animation: pulse 2.2s infinite ease-in-out;

    z-index: 5;
}

/* ANİMASYONLAR */

@keyframes rotate1 {

    from {
        transform: rotate(0deg);
    }

    to {
        transform: rotate(360deg);
    }
}

@keyframes rotate2 {

    from {
        transform: rotate(360deg);
    }

    to {
        transform: rotate(0deg);
    }
}

@keyframes pulse {

    0%,
    100% {
        transform: scale(1);
    }

    50% {
        transform: scale(1.06);
    }
}

/* DURUM */

.aura-status {
    margin-top: -8px;
    margin-bottom: 5px;

    font-size: 10px;
    letter-spacing: 3px;

    color: #8defff;
}

/* SOHBET */

#chat {
    width: min(92%, 600px);

    flex: 1;
    min-height: 0;

    overflow-y: auto;

    padding: 5px 5px 10px;
}

.message {
    max-width: 85%;

    padding: 10px 13px;

    margin-bottom: 10px;

    border-radius: 10px;

    line-height: 1.4;

    white-space: pre-wrap;

    font-size: 14px;
}

.aura {
    background: rgba(0,35,45,0.8);

    margin-right: auto;

    border: 1px solid rgba(0,234,255,0.25);
}

.user {
    background: rgba(0,90,120,0.8);

    margin-left: auto;

    color: white;
}

/* ALT PANEL */

#bottom {
    width: 100%;

    min-height: 65px;

    display: flex;
    align-items: center;

    gap: 8px;

    padding: 10px;

    background: rgba(0,10,15,0.97);

    border-top: 1px solid rgba(0,234,255,0.45);

    z-index: 10;
}

/* YAZI KUTUSU */

#input {
    flex: 1;

    min-width: 0;

    height: 45px;

    padding: 12px;

    border-radius: 8px;

    border: 1px solid rgba(0,234,255,0.5);

    outline: none;

    background: rgba(0,25,32,0.95);

    color: #00eaff;

    font-size: 14px;
}

#input::placeholder {
    color: #548995;
}

/* BUTONLAR */

button {
    height: 45px;

    border: 1px solid #00eaff;

    border-radius: 8px;

    padding: 0 14px;

    background: rgba(0,60,75,0.9);

    color: #00eaff;

    font-size: 14px;

    cursor: pointer;
}

button:active {
    transform: scale(0.94);
}

button:disabled {
    opacity: 0.5;
}

.mic-button {
    width: 45px;
    padding: 0;
    font-size: 20px;
}

/* TELEFON */

@media (max-width: 500px) {

    .aura-core {
        transform: scale(0.82);

        margin-top: 0;
        margin-bottom: -15px;
    }

    .logo {
        font-size: 18px;
    }

    button {
        padding: 0 11px;
    }
}

</style>

</head>

<script>

/* ELEMENTLER */

const chat =
    document.getElementById("chat");

const input =
    document.getElementById("input");

const sendButton =
    document.getElementById("sendButton");

const micButton =
    document.getElementById("micButton");


/* =========================================
   AURA KALICI HAFIZA SİSTEMİ
========================================= */

const MEMORY_KEY =
    "AURA_PERSONAL_MEMORY_V1";


const defaultMemory = {

    name: "Bedirhan Kahraman",

    girlfriend: "Edanur Kahraman",

    favoriteTeam: "",

    likes: [],

    dislikes: [],

    importantFacts: [],

    learnedFacts: [],

    updatedAt: null

};


/* HAFIZAYI YÜKLE */

function loadMemory() {

    try {

        const saved =
            localStorage.getItem(MEMORY_KEY);

        if (!saved) {

            return {
                ...defaultMemory
            };

        }

        const parsed =
            JSON.parse(saved);

        return {

            ...defaultMemory,

            ...parsed,

            likes:
                Array.isArray(parsed.likes)
                    ? parsed.likes
                    : [],

            dislikes:
                Array.isArray(parsed.dislikes)
                    ? parsed.dislikes
                    : [],

            importantFacts:
                Array.isArray(parsed.importantFacts)
                    ? parsed.importantFacts
                    : [],

            learnedFacts:
                Array.isArray(parsed.learnedFacts)
                    ? parsed.learnedFacts
                    : []

        };

    }

    catch (error) {

        console.error(
            "Hafıza yükleme hatası:",
            error
        );

        return {
            ...defaultMemory
        };
    }
}


let auraMemory =
    loadMemory();


/* HAFIZAYI KAYDET */

function saveMemory() {

    try {

        auraMemory.updatedAt =
            new Date().toISOString();

        localStorage.setItem(
            MEMORY_KEY,
            JSON.stringify(auraMemory)
        );

    }

    catch (error) {

        console.error(
            "Hafıza kaydetme hatası:",
            error
        );
    }
}


/* HAFIZAYA TEKRARLI BİLGİ EKLEME */

function addUniqueMemory(
    array,
    value
) {

    const clean =
        String(value).trim();

    if (!clean) {
        return;
    }

    const exists =
        array.some(function(item) {

            return item.toLocaleLowerCase("tr-TR") ===
                   clean.toLocaleLowerCase("tr-TR");

        });

    if (!exists) {

        array.push(clean);

    }
}


/* HAFIZADAN BİLGİ SİLME */

function clearAuraMemory() {

    auraMemory = {

        ...defaultMemory,

        name: "Bedirhan Kahraman",

        girlfriend: "Edanur Kahraman",

        favoriteTeam: "",

        likes: [],

        dislikes: [],

        importantFacts: [],

        learnedFacts: [],

        updatedAt: null

    };

    saveMemory();
}


/* HAFIZAYI METİN HALİNE GETİR */

function getMemoryText() {

    const parts = [];


    if (auraMemory.name) {

        parts.push(
            "Kullanıcının adı: " +
            auraMemory.name
        );

    }


    if (auraMemory.girlfriend) {

        parts.push(
            "Kullanıcının sevgilisinin adı: " +
            auraMemory.girlfriend
        );

    }


    if (auraMemory.favoriteTeam) {

        parts.push(
            "Kullanıcının tuttuğu takım: " +
            auraMemory.favoriteTeam
        );

    }


    if (auraMemory.likes.length > 0) {

        parts.push(
            "Kullanıcının sevdiği şeyler: " +
            auraMemory.likes.join(", ")
        );

    }


    if (auraMemory.dislikes.length > 0) {

        parts.push(
            "Kullanıcının sevmediği şeyler: " +
            auraMemory.dislikes.join(", ")
        );

    }


    if (
        auraMemory.importantFacts.length > 0
    ) {

        parts.push(
            "Kullanıcı hakkında önemli bilgiler: " +
            auraMemory.importantFacts.join(" | ")
        );

    }


    if (
        auraMemory.learnedFacts.length > 0
    ) {

        parts.push(
            "Önceki konuşmalardan öğrenilen bilgiler: " +
            auraMemory.learnedFacts.join(" | ")
        );

    }


    if (parts.length === 0) {

        return "Kullanıcı hakkında henüz kayıtlı ek bilgi yok.";

    }


    return parts.join("\n");
}


/* BAŞLANGIÇTA KAYDET */

saveMemory();<script>

/* =========================================
   KONUŞMA HAFIZASI
========================================= */

const conversation = [

    {
        role: "system",

        content:
        `Sen AURA adında kişisel bir yapay zekâ asistanısın.

Kullanıcı Türkçe konuşuyor.

    }

];


/* =========================================
   AI SİSTEM MESAJINI GÜNCELLE
========================================= */

function updateSystemMemory() {

    if (
        !conversation[0] ||
        conversation[0].role !== "system"
    ) {
        return;
    }


    conversation[0].content =
        `Sen AURA adında kişisel bir yapay zekâ asistanısın.

Kullanıcı Türkçe konuşuyor.

Kullanıcının adı Bedirhan Kahraman.

Kullanıcının sevgilisinin adı Edanur Kahraman.

Kullanıcıya her cevapta ismiyle hitap etme.

Bedirhan veya Bedirhan Kahraman kelimelerini sadece gerçekten doğal ve gerekli olduğunda kullan.

Kullanıcı ismini sormadığı sürece ismini cevabın başına koyma.

Her cevaba "Bedirhan" diye başlama.

Kendini gereksiz yere AURA olarak tanıtma.

Kullanıcı sana AURA diye seslenebilir fakat sen her cevapta "AURA" kelimesini kullanmak zorunda değilsin.

Gereksiz tekrar yapma.

Kullanıcı tarafından açıkça kaydedilen hafıza bilgilerini hatırla.

Hafızadaki bilgileri yalnızca konuşmayla ilgili olduğunda kullan.

HAFIZA:
${getMemoryText()}`;

}


/* =========================================
   MESAJ EKLE
========================================= */

function addMessage(
    text,
    type
) {

    const message =
        document.createElement("div");

    message.className =
        "message " + type;

    message.textContent =
        text;

    chat.appendChild(message);

    chat.scrollTop =
        chat.scrollHeight;
}


/* =========================================
   METİN NORMALLEŞTİRME
========================================= */

function normalizeText(text) {

    return String(text)

        .toLocaleLowerCase("tr-TR")

        .replace(/ı/g, "i")
        .replace(/İ/g, "i")
        .replace(/ş/g, "s")
        .replace(/Ş/g, "s")
        .replace(/ğ/g, "g")
        .replace(/Ğ/g, "g")
        .replace(/ü/g, "u")
        .replace(/Ü/g, "u")
        .replace(/ö/g, "o")
        .replace(/Ö/g, "o")
        .replace(/ç/g, "c")
        .replace(/Ç/g, "c")

        .replace(/\s+/g, " ")

        .trim();
}


/* =========================================
   OTOMATİK HAFIZA ÖĞRENME
========================================= */

function learnFromMessage(text) {

    const original =
        String(text).trim();

    const normalized =
        normalizeText(original);


    let changed = false;


    /* TAKIM */

    const teamPatterns = [

        /(.+?)\s+tutuyorum/i,

        /(.+?)\s+taraftariyim/i,

        /(.+?)\s+taraftarıyım/i,

        /ben\s+(.+?)\s+tutuyorum/i,

        /tuttugum takim\s+(.+)/i,

        /tuttuğum takım\s+(.+)/i,

        /takimim\s+(.+)/i,

        /takımım\s+(.+)/i

    ];


    for (
        let i = 0;
        i < teamPatterns.length;
        i++
    ) {

        const match =
            original.match(
                teamPatterns[i]
            );

        if (match) {

            let team =
                match[1]
                    .trim()
                    .replace(/[.!?]+$/g, "");

            if (
                team.length >= 2 &&
                team.length <= 50
            ) {

                auraMemory.favoriteTeam =
                    team;

                changed = true;

            }

            break;
        }
    }


    /* SEVDİĞİ ŞEY */

    const likeMatch =
        original.match(
            /(.+?)\s+(çok\s+)?seviyorum[.!]?$/i
        );


    if (likeMatch) {

        let value =
            likeMatch[1].trim();

        value =
            value.replace(
                /^ben\s+/i,
                ""
            );

        if (
            value.length >= 2 &&
            value.length <= 80
        ) {

            addUniqueMemory(
                auraMemory.likes,
                value
            );

            changed = true;
        }
    }


    /* SEVMEDİĞİ ŞEY */

    const dislikeMatch =
        original.match(
            /(.+?)\s+(hiç\s+)?sevmiyorum[.!]?$/i
        );


    if (dislikeMatch) {

        let value =
            dislikeMatch[1].trim();

        value =
            value.replace(
                /^ben\s+/i,
                ""
            );

        if (
            value.length >= 2 &&
            value.length <= 80
        ) {

            addUniqueMemory(
                auraMemory.dislikes,
                value
            );

            changed = true;
        }
    }


    /* AÇIKÇA HATIRLATILAN BİLGİ */

    const rememberPatterns = [

        /bunu hatırla[:\s]+(.+)/i,

        /bunu hatirla[:\s]+(.+)/i,

        /aklında tut[:\s]+(.+)/i,

        /aklinda tut[:\s]+(.+)/i,

        /unutma[:\s]+(.+)/i,

        /bunu unutma[:\s]+(.+)/i

    ];


    for (
        let i = 0;
        i < rememberPatterns.length;
        i++
    ) {

        const match =
            original.match(
                rememberPatterns[i]
            );

        if (match) {

            const value =
                match[1]
                    .trim()
                    .replace(/[.!?]+$/g, "");

            if (
                value.length >= 2 &&
                value.length <= 200
            ) {

                addUniqueMemory(
                    auraMemory.importantFacts,
                    value
                );

                changed = true;

            }

            break;
        }
    }


    /* "BENİM İÇİN ÖNEMLİ" */

    const importantMatch =
        original.match(
            /benim için önemli olan[:\s]+(.+)/i
        );


    if (importantMatch) {

        const value =
            importantMatch[1]
                .trim()
                .replace(/[.!?]+$/g, "");

        if (
            value.length >= 2 &&
            value.length <= 200
        ) {

            addUniqueMemory(
                auraMemory.importantFacts,
                value
            );

            changed = true;
        }
    }


    /* DEĞİŞİKLİK VARSA KAYDET */

    if (changed) {

        saveMemory();

        updateSystemMemory();

    }

}


/* =========================================
   HAFIZA KOMUTLARI
========================================= */

function memoryCommand(text) {

    const normalized =
        normalizeText(text);


    /* HAFIZAMI GÖSTER */

    if (
        normalized.includes(
            "hafizamda ne var"
        ) ||
        normalized.includes(
            "hafizanda ne var"
        ) ||
        normalized.includes(
            "benim hakkimda ne biliyorsun"
        ) ||
        normalized.includes(
            "benim hakkimda neler biliyorsun"
        )
    ) {

        return getMemoryText();

    }


    /* TAKIMI SOR */

    if (
        normalized.includes(
            "hangi takimi tutuyorum"
        ) ||
        normalized.includes(
            "tuttugum takim ne"
        ) ||
        normalized.includes(
            "ben hangi takimi tutuyorum"
        )
    ) {

        if (
            auraMemory.favoriteTeam
        ) {

            return (
                "Tuttuğun takımın " +
                auraMemory.favoriteTeam +
                "."
            );

        }

        return (
            "Tuttuğun takımı henüz hafızama kaydetmemişim."
        );
    }


    /* HAFIZAYI TEMİZLE */

    if (
        normalized ===
        "hafizani temizle" ||

        normalized ===
        "hafizayi temizle" ||

        normalized ===
        "hafizayi sil" ||

        normalized ===
        "hafizani sil"
    ) {

        clearAuraMemory();

        updateSystemMemory();

        return (
            "Hafızamdaki kişisel bilgileri temizledim."
        );
    }


    return null;

/* =========================================
   SES İÇİN TEMİZLEME
========================================= */

function cleanTextForSpeech(text) {

    return text

        .replace(
            /[\p{Emoji_Presentation}\p{Extended_Pictographic}]/gu,
            ""
        )

        .replace(
            /https?:\/\/\S+/gi,
            ""
        )

        .replace(
            /[.,!?;:"'“”‘’()[\]{}<>…:;\/\\|@#$%^&*_+=~`-]/g,
            " "
        )

        .replace(
            /\s+/g,
            " "
        )

        .trim();
}


/* =========================================
   SESLİ CEVAP
========================================= */

function speak(text) {

    if (!("speechSynthesis" in window)) {
        return;
    }

    const cleanText =
        cleanTextForSpeech(text);

    if (!cleanText) {
        return;
    }

    const message =
        new SpeechSynthesisUtterance(
            cleanText
        );

    message.lang =
        "tr-TR";

    message.rate =
        0.9;

    message.pitch =
        1;

    message.volume =
        1;

    window.speechSynthesis.cancel();

    setTimeout(function() {

        window.speechSynthesis.speak(
            message
        );

    }, 100);
}


/* =========================================
   GERÇEK AI
========================================= */

async function askAI(text) {


    /* Önce mesajdan öğren */

    learnFromMessage(text);


    /* Özel hafıza komutu var mı? */

    const memoryResponse =
        memoryCommand(text);


    if (memoryResponse) {

        return memoryResponse;

    }


    /*
     * Güncel hafızayı AI'ya tekrar gönder.
     * Böylece uygulama yeniden açıldığında
     * localStorage'daki bilgiler de AI tarafından
     * bilinir.
     */

    updateSystemMemory();


    conversation.push({

        role: "user",

        content: text

    });


    try {

        const response =
            await puter.ai.chat(
                conversation,
                {
                    model: "gpt-5.4-nano"
                }
            );


        let answer = "";


        if (
            response &&
            response.message &&
            response.message.content
        ) {

            answer =
                response.message.content;

        }

        else if (
            response &&
            response.text
        ) {

            answer =
                response.text;

        }

        else if (
            typeof response === "string"
        ) {

            answer =
                response;

        }

        else {

            answer =
                String(response);

        }


        /*
         * AI cevabının başına otomatik olarak
         * Bedirhan veya AURA eklemiyoruz.
         */


        conversation.push({

            role: "assistant",

            content: answer

        });


        return answer;

    }


    catch (error) {

        console.error(
            "AURA AI HATASI:",
            error
        );


        return "AI bağlantısında bir sorun oluştu. Biraz sonra tekrar deneyelim.";

    }

}


/* =========================================
   MESAJ GÖNDER
========================================= */

async function sendMessage(
    voiceMode = false
) {

    const text =
        input.value.trim();


    if (!text) {
        return;
    }


    addMessage(
        text,
        "user"
    );


    input.value = "";


    sendButton.disabled =
        true;

    micButton.disabled =
        true;


    addMessage(
        "Düşünüyorum...",
        "aura"
    );


    const loadingMessage =
        chat.lastElementChild;


    try {

        const reply =
            await askAI(text);


        if (loadingMessage) {
            loadingMessage.remove();
        }


        addMessage(
            reply,
            "aura"
        );


        /*
         * SADECE SESLİ KOMUTTA
         * AURA KONUŞUR
         */

        if (voiceMode) {

            speak(reply);

        }

    }


    catch (error) {

        if (loadingMessage) {
            loadingMessage.remove();
        }


        addMessage(
            "Bir hata oluştu. Tekrar deneyebiliriz.",
            "aura"
        );

    }


    sendButton.disabled =
        false;

    micButton.disabled =
        false;


    input.focus();

}


/* =========================================
   GÖNDER BUTONU
========================================= */

sendButton.addEventListener(
    "click",
    function() {

        sendMessage(false);

    }
);


/* =========================================
   ENTER
========================================= */

input.addEventListener(
    "keydown",
    function(event) {

        if (
            event.key === "Enter"
        ) {

            event.preventDefault();

            sendMessage(false);

        }

    }
);


/* =========================================
   SESLİ KOMUT
========================================= */

function startListening() {

    const SpeechRecognition =
        window.SpeechRecognition ||
        window.webkitSpeechRecognition;


    if (!SpeechRecognition) {

        addMessage(
            "Bu tarayıcı sesli komutu desteklemiyor.",
            "aura"
        );

        return;

    }


    const recognition =
        new SpeechRecognition();


    recognition.lang =
        "tr-TR";


    recognition.continuous =
        false;


    recognition.interimResults =
        false;


    recognition.maxAlternatives =
        1;


    recognition.onstart =
        function() {

            micButton.disabled =
                true;


            addMessage(
                "Dinliyorum...",
                "aura"
            );

        };


    recognition.onresult =
        function(event) {

            const text =
                event.results[0][0].transcript;


            input.value =
                text;


            /*
             * Sesli komut olduğu için
             * voiceMode = true.
             */

            sendMessage(true);

        };


    recognition.onerror =
        function(event) {

            console.error(
                "Mikrofon hatası:",
                event.error
            );


            addMessage(
                "Sesli komut alınamadı.",
                "aura"
            );


            micButton.disabled =
                false;

        };


    recognition.onend =
        function() {

            micButton.disabled =
                false;

        };


    try {

        recognition.start();

    }


    catch (error) {

        micButton.disabled =
            false;


        addMessage(
            "Mikrofon başlatılamadı.",
            "aura"
        );

    }

}


/* =========================================
   MİKROFON BUTONU
========================================= */

micButton.addEventListener(
    "click",
    startListening
);
