<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#111827">
    <title>AURA AI</title>

    <style>
        body {
          <h1 style="color:#00eaff; text-align:center;">AURA</h1>
            <p style="color:red; text-align:center; font-size:30px;">TEST</p>
            <div class="aura-core">
    <div class="aura-ring ring1"></div>
    <div class="aura-ring ring2"></div>
    <div class="aura-ring ring3"></div>
    <div class="aura-center">AURA</div>
</div>
    background: #02060a;
    color: #00eaff;
    font-family: Arial, sans-serif;
        }
        body {
    background:
        radial-gradient(circle at center, #06202b 0%, #02060a 55%, #000000 100%);
    color: #00eaff;
    font-family: Arial, sans-serif;
    min-height: 100vh;
        }
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #0b0f19;
            color: white;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            padding: 18px;
            text-align: center;
            background: #111827;
            border-bottom: 1px solid #263043;
        }

        header h1 {
            margin: 0;
            font-size: 25px;
        }

        header p {
            margin: 5px 0 0;
            color: #9ca3af;
            font-size: 13px;
        }

        #chat {
            flex: 1;
            overflow-y: auto;
            padding: 15px;
        }

        .message {
            max-width: 85%;
            padding: 12px 14px;
            margin-bottom: 12px;
            border-radius: 14px;
            line-height: 1.4;
            white-space: pre-wrap;
        }

        .aura {
            background: #172033;
            margin-right: auto;
        }

        .user {
            background: #2563eb;
            margin-left: auto;
        }

        #bottom {
            display: flex;
            padding: 10px;
            gap: 8px;
            background: #111827;
            border-top: 1px solid #263043;
        }

        #input {
            flex: 1;
            border: none;
            outline: none;
            padding: 13px;
            border-radius: 12px;
            background: #1f2937;
            color: white;
            font-size: 15px;
        }

        button {
            border: none;
            border-radius: 12px;
            padding: 0 17px;
            background: #2563eb;
            color: white;
            font-size: 15px;
        }

        button:active {
            transform: scale(.96);
        }
   .aura-core {
    width: 180px;
    height: 180px;
    margin: 40px auto;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
}
        .aura-center {
    width: 100px;
    height: 100px;
    border: 3px solid #00eaff;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #00eaff;
    font-size: 22px;
    font-weight: bold;
    background: #02060a;
    box-shadow: 0 0 20px #00eaff;
        }

.aura-center {
    width: 100px;
    height: 100px;
    border: 2px solid #00eaff;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #00eaff;
    font-size: 22px;
    font-weight: bold;
    box-shadow: 0 0 15px #00eaff, 0 0 40px #007f99;
}
    </style>
</head>

<body>

<header>
    <h1>AURA AI</h1>
    <link rel="manifest" href="manifest.json">
    <p>Kişisel yapay zekâ asistanın</p>
</header>

<div id="chat"></div>

<div id="bottom">
    <div style="display:flex; gap:8px; flex:1;">
    <input id="input" type="text"
           placeholder="AURA'ya bir şey sor..."
           autocomplete="off"
           style="flex:1;">

    <button onclick="startListening()">🎤</button>
</div>

<button onclick="sendMessage()">Gönder</button>
</div>

<script>
    const chat = document.getElementById("chat");
    const input = document.getElementById("input");
function speak(text) {
    const msg = new SpeechSynthesisUtterance(text);
    msg.lang = "tr-TR";
    msg.rate = 0.9;
    msg.pitch = 1;
    msg.volume = 1;

    window.speechSynthesis.cancel();

    setTimeout(() => {
        window.speechSynthesis.speak(msg);
    }, 100);
}
    function addMessage(text, type) {
    const message = document.createElement("div");
    message.className = "message " + type;
    message.textContent = text;
    chat.appendChild(message);
    chat.scrollTop = chat.scrollHeight;
    }

    function auraReply(text) {
        const kullaniciAdi = "Bedirhan Kahraman";
const sevgiliAdi = "Edanur Kahraman";
        const command = text.toLowerCase().trim();
if (
    text.includes("ben kimim") ||
    text.includes("beni tanıyor musun") ||
    text.includes("benim adım ne")
) {
    return "Sen Bedirhan'sın.";
}

if (
    text.includes("sevgilimin adı") ||
    text.includes("sevgilim kim") ||
    text.includes("sevgilimin ismi")
) {
    return "Sevgilinin adı " + sevgiliAdi + ".";
}
        if (
            command === "merhaba" ||
            command === "selam" ||
            command.includes("merhaba aura") ||
            command.includes("selam aura")
        ) {
            return "Merhaba. Ben AURA. Nasıl yardımcı olabilirim?";
        }

        if (command.includes("saat")) {
            return "Şu an saat: " +
                new Date().toLocaleTimeString("tr-TR");
        }

        if (command.includes("tarih")) {
            return "Bugünün tarihi: " +
                new Date().toLocaleDateString("tr-TR");
        }

        if (command.includes("kimsin")) {
            return "Ben AURA AI. Telefonda çalışan kişisel asistanınım.";
        }
        if (
    command.includes("ben kimim") ||
    command.includes("beni tanıyor musun") ||
    command.includes("benim adım ne")
) {
    return "Sen " + kullaniciAdi + "sın.";
}

if (
    command.includes("sevgilimin adı") ||
    command.includes("sevgilimin ismi") ||
    command.includes("sevgilim kim")
) {
    return "Sevgilinin adı " + sevgiliAdi + ".";
}
    
    

        if (command.includes("şaka")) {
            const jokes = [
                "Programcı neden kahve içer? Çünkü bug'ları ayıklaması gerekiyor.",
                "Bilgisayar neden doktora gitmiş? Virüsü varmış.",
                "Wi-Fi neden kavga etmiş? Bağlantısı kopmuş."
            ];

            return jokes[Math.floor(Math.random() * jokes.length)];
        }

        if (command === "yardım") {
            return "Şimdilik deneyebileceğin komutlar:\n\n" +
                   "• merhaba\n" +
                   "• saat\n" +
                   "• tarih\n" +
                   "• kimsin\n" +
                   "• şaka\n" +
                   "• yardım";
        }

        return "Bunu henüz öğrenmedim. Bana başka bir şey söyle.";
    }

    function sendMessage() {
        const text = input.value.trim();

        if (!text) return;

        addMessage(text, "user");
        input.value = "";

        setTimeout(() => {
            const reply = auraReply(text);
addMessage(reply, "aura");
speak(reply);
        }, 300);
    }

    function startListening() {
    const SpeechRecognition =
        window.SpeechRecognition ||
        window.webkitSpeechRecognition;

    if (!SpeechRecognition) {
        addMessage("Telefonunun tarayıcısı sesli konuşmayı desteklemiyor.", "aura");
        return;
    }

    const recognition = new SpeechRecognition();

    recognition.lang = "tr-TR";
    recognition.continuous = false;
    recognition.interimResults = false;

    recognition.onstart = function() {
        addMessage("Dinliyorum...", "aura");
    };

    recognition.onresult = function(event) {
        const text = event.results[0][0].transcript;

        input.value = text;
        sendMessage();
    };

    recognition.onerror = function() {
        addMessage("Sesini anlayamadım. Tekrar deneyebilirsin.", "aura");
    };

    recognition.start();
    }

    addMessage(
        "Merhaba. Ben AURA AI.\n\n" +
        "Bana \"yardım\" yazarak mevcut komutları görebilirsin.",
        "aura"
    );
</script>
<script>
if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
        navigator.serviceWorker.register("./service-worker.js");
    });
}
</script>
</body>
</html>
