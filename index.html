<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>AURA — Prototype</title>

<style>
*{
    box-sizing:border-box;
}

html,body{
    width:100%;
    height:100%;
    margin:0;
}

body{
    overflow:hidden;
    font-family:Arial,sans-serif;
    color:#dffcff;
    background:
        radial-gradient(
            circle at 50% 28%,
            #0b6682 0%,
            #063b55 20%,
            #021b2c 48%,
            #010b15 75%,
            #00050b 100%
        );
}

/* =========================
   HOLOGRAM ARKA PLAN
========================= */

body::before{
    content:"";
    position:fixed;
    inset:0;
    pointer-events:none;

    background:
        linear-gradient(
            rgba(0,234,255,.035) 1px,
            transparent 1px
        ),
        linear-gradient(
            90deg,
            rgba(0,234,255,.035) 1px,
            transparent 1px
        );

    background-size:32px 32px;

    mask-image:
        radial-gradient(
            circle at center,
            black,
            transparent 80%
        );
}

body::after{
    content:"";
    position:fixed;
    inset:0;
    pointer-events:none;

    background:
        radial-gradient(
            circle at 50% 30%,
            rgba(0,234,255,.18),
            transparent 35%
        );

    animation:
        atmosphere 4s ease-in-out infinite;
}

@keyframes atmosphere{
    0%,100%{opacity:.65}
    50%{opacity:1}
}

/* =========================
   ÜST BAR
========================= */

.topbar{
    height:60px;

    display:flex;
    align-items:center;
    justify-content:space-between;

    padding:0 18px;

    background:
        rgba(0,12,23,.82);

    border-bottom:
        1px solid
        rgba(0,234,255,.4);

    box-shadow:
        0 0 25px
        rgba(0,234,255,.1);

    position:relative;
    z-index:10;
}

.logo{
    color:#00eaff;
    font-size:21px;
    font-weight:bold;
    letter-spacing:5px;

    text-shadow:
        0 0 8px #00eaff,
        0 0 25px #00eaff;
}

.online{
    color:#55ffcc;
    font-size:9px;
    letter-spacing:2px;
}

.online::before{
    content:"";
    display:inline-block;

    width:6px;
    height:6px;

    margin-right:6px;

    border-radius:50%;

    background:#55ffcc;

    box-shadow:
        0 0 8px #55ffcc,
        0 0 15px #55ffcc;
}

/* =========================
   ANA
========================= */

.main{
    height:calc(100dvh - 60px);

    display:flex;
    flex-direction:column;
    align-items:center;

    min-height:0;

    position:relative;
    z-index:2;
}

/* =========================
   AURA ÇEKİRDEĞİ
========================= */

.core{
    width:205px;
    height:205px;

    margin-top:5px;

    position:relative;

    display:flex;
    align-items:center;
    justify-content:center;

    flex-shrink:0;
}

.ring{
    position:absolute;
    border-radius:50%;
    border:1px solid #00eaff;

    box-shadow:
        0 0 10px
        rgba(0,234,255,.35);
}

.r1{
    width:125px;
    height:125px;

    border-left-color:transparent;
    border-right-color:transparent;

    animation:
        spin 5s linear infinite;
}

.r2{
    width:165px;
    height:165px;

    border-top-color:transparent;
    border-bottom-color:transparent;

    animation:
        spin 9s linear reverse infinite;
}

.r3{
    width:205px;
    height:205px;

    border-left-color:transparent;
    border-bottom-color:transparent;

    animation:
        spin 14s linear infinite;
}

.center{
    width:94px;
    height:94px;

    display:flex;
    align-items:center;
    justify-content:center;

    border-radius:50%;
    border:2px solid #00eaff;

    background:
        radial-gradient(
            circle,
            #08708b,
            #063449 45%,
            #01101c 100%
        );

    color:#00eaff;

    font-weight:bold;
    font-size:19px;
    letter-spacing:3px;

    box-shadow:
        0 0 15px #00eaff,
        0 0 45px rgba(0,234,255,.65),
        inset 0 0 25px rgba(0,234,255,.5);

    animation:
        corePulse 2.2s ease-in-out infinite;

    z-index:3;
}

@keyframes spin{
    to{
        transform:rotate(360deg);
    }
}

@keyframes corePulse{
    50%{
        transform:scale(1.06);
    }
}

/* =========================
   DURUM
========================= */

.system{
    margin-top:-7px;
    margin-bottom:5px;

    font-size:9px;
    letter-spacing:3px;

    color:#8defff;

    text-shadow:
        0 0 8px
        rgba(0,234,255,.6);
}

/* =========================
   SOHBET
========================= */

#chat{
    width:min(92%,620px);

    flex:1;
    min-height:0;

    overflow-y:auto;

    padding:
        8px 5px 15px;

    scrollbar-width:thin;
    scrollbar-color:
        #00eaff transparent;
}

#chat::-webkit-scrollbar{
    width:3px;
}

#chat::-webkit-scrollbar-thumb{
    background:#00eaff;
    border-radius:10px;
}

/* =========================
   MESAJLAR
========================= */

.message{
    max-width:82%;

    padding:11px 14px;

    margin-bottom:11px;

    border-radius:14px;

    font-size:14px;
    line-height:1.45;

    white-space:pre-wrap;

    animation:
        messageIn .25s ease;
}

@keyframes messageIn{
    from{
        opacity:0;
        transform:translateY(8px);
    }

    to{
        opacity:1;
        transform:translateY(0);
    }
}

/* AURA */

.aura{
    margin-right:auto;

    color:#d9fbff;

    background:
        linear-gradient(
            135deg,
            rgba(0,74,101,.68),
            rgba(0,23,39,.78)
        );

    border:
        1px solid
        rgba(0,234,255,.35);

    border-left:
        2px solid #00eaff;

    border-top-left-radius:3px;

    box-shadow:
        0 0 18px
        rgba(0,234,255,.08);
}

/* USER */

.user{
    margin-left:auto;

    color:#ffffff;

    background:
        linear-gradient(
            135deg,
            rgba(15,124,163,.82),
            rgba(0,67,103,.9)
        );

    border:
        1px solid
        rgba(85,255,255,.4);

    border-right:
        2px solid #55ffcc;

    border-top-right-radius:3px;
}

/* =========================
   JARVIS TARZI ALT PANEL
========================= */

.bottom{
    width:100%;

    padding:
        9px 10px 11px;

    display:flex;
    align-items:center;

    gap:8px;

    background:
        linear-gradient(
            180deg,
            rgba(1,18,31,.72),
            rgba(0,7,15,.98)
        );

    border-top:
        1px solid
        rgba(0,234,255,.45);

    box-shadow:
        0 -12px 35px
        rgba(0,234,255,.1);
}

/* =========================
   ANA MESAJ KUTUSU
========================= */

.input-shell{
    flex:1;

    height:48px;

    position:relative;

    display:flex;
    align-items:center;

    padding:
        0 14px;

    background:
        linear-gradient(
            90deg,
            rgba(3,48,69,.92),
            rgba(2,24,40,.94)
        );

    border:
        1px solid
        rgba(0,234,255,.48);

    clip-path:
        polygon(
            0 0,
            calc(100% - 12px) 0,
            100% 12px,
            100% 100%,
            12px 100%,
            0 calc(100% - 12px)
        );

    box-shadow:
        inset 0 0 20px
        rgba(0,234,255,.07),
        0 0 15px
        rgba(0,234,255,.08);
}

/* Üstteki ince HUD çizgisi */

.input-shell::before{
    content:"";

    position:absolute;

    top:4px;
    left:14px;
    right:14px;

    height:1px;

    background:
        linear-gradient(
            90deg,
            transparent,
            #00eaff,
            transparent
        );

    opacity:.35;
}

/* Sol gösterge */

.input-indicator{
    width:8px;
    height:8px;

    margin-right:10px;

    border-radius:50%;

    background:#00eaff;

    box-shadow:
        0 0 7px #00eaff,
        0 0 15px #00eaff;

    animation:
        indicator 1.8s infinite;
}

@keyframes indicator{
    50%{
        opacity:.35;
    }
}

#input{
    width:100%;
    height:100%;

    border:0;
    outline:0;

    background:transparent;

    color:#eaffff;

    font-size:14px;
}

#input::placeholder{
    color:
        rgba(130,210,225,.55);
}

/* =========================
   BUTONLAR
========================= */

.icon-button{
    width:48px;
    height:48px;

    flex-shrink:0;

    border:
        1px solid
        rgba(0,234,255,.45);

    background:
        rgba(2,35,51,.9);

    color:#00eaff;

    font-size:18px;

    cursor:pointer;

    clip-path:
        polygon(
            0 0,
            calc(100% - 9px) 0,
            100% 9px,
            100% 100%,
            9px 100%,
            0 calc(100% - 9px)
        );

    box-shadow:
        inset 0 0 15px
        rgba(0,234,255,.06);

    transition:.15s;
}

.icon-button:active{
    transform:scale(.91);
}

.send{
    color:#00151d;

    background:
        linear-gradient(
            135deg,
            #00eaff,
            #55ffcc
        );

    border:0;

    font-size:22px;

    box-shadow:
        0 0 18px
        rgba(0,234,255,.3);
}

/* =========================
   MOBİL
========================= */

@media(max-width:500px){

    .core{
        transform:scale(.86);

        margin-top:-4px;
        margin-bottom:-12px;
    }

    .message{
        max-width:89%;
        font-size:13px;
    }

    .bottom{
        padding:8px;
    }

    .input-shell{
        height:45px;
    }

    .icon-button{
        width:45px;
        height:45px;
    }
}
</style>
</head>

<body>

<div class="topbar">

    <div class="logo">
        AURA
    </div>

    <div class="online">
        ONLINE
    </div>

</div>


<div class="main">

    <div class="core">

        <div class="ring r1"></div>
        <div class="ring r2"></div>
        <div class="ring r3"></div>

        <div class="center">
            AURA
        </div>

    </div>


    <div class="system">
        AI SYSTEM READY
    </div>


    <div id="chat">

        <div class="message aura">
            Sistem başlatıldı.
        </div>

        <div class="message user">
            Merhaba AURA.
        </div>

        <div class="message aura">
            Merhaba. Seni dinliyorum.
        </div>

    </div>


    <div class="bottom">

        <div class="input-shell">

            <span class="input-indicator"></span>

            <input
                id="input"
                type="text"
                placeholder="Komut veya mesaj gir..."
                autocomplete="off">

        </div>


        <button
            class="icon-button"
            type="button">
            🎙
        </button>


        <button
            class="icon-button send"
            type="button">

            ➤

        </button>

    </div>

</div>

</body>
</html>
