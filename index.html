<!DOCTYPE html>
<html lang="tr">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

content="#02060a">

<title>AURA AI</title>

<style>

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
}

body {

    overflow: hidden;

    font-family:
        Arial,
        sans-serif;

    color: #00eaff;

    background:
        radial-gradient(
            circle at center,
            #06303d 0%,
            #02080c 50%,
            #000000 100%
        );
}


/* =========================
   ÜST BAR
========================= */

.top-bar {

    height: 60px;

    display: flex;

    align-items: center;

    justify-content:
        space-between;

    padding:
        0 18px;

    background:
        rgba(
            0,
            10,
            15,
            0.9
        );

    border-bottom:
        1px solid
        rgba(
            0,
            234,
            255,
            0.4
        );
}

.logo {

    font-size: 21px;

    font-weight: bold;

    letter-spacing: 4px;

    text-shadow:
        0 0 10px #00eaff,
        0 0 25px #00eaff;
}

.status {

    font-size: 11px;

    letter-spacing: 2px;

    color: #55ffcc;
}

.status::before {

    content: "";

    display: inline-block;

    width: 7px;

    height: 7px;

    margin-right: 7px;

    border-radius: 50%;

    background: #55ffcc;

    box-shadow:
        0 0 8px #55ffcc,
        0 0 15px #55ffcc;
}


/* =========================
   ANA ALAN
========================= */

.main {

    height:
        calc(100vh - 60px);

    height:
        calc(100dvh - 60px);

    display: flex;

    flex-direction:
        column;

    align-items:
        center;

    min-height: 0;
}


/* =========================
   AURA ÇEKİRDEĞİ
========================= */

.aura-core {

    width: 210px;

    height: 210px;

    margin-top: 10px;

    position: relative;

    display: flex;

    align-items:
        center;

    justify-content:
        center;

    flex-shrink: 0;
}

.aura-ring {

    position: absolute;

    border-radius: 50%;

    border:
        1px solid
        #00eaff;

    opacity: 0.7;
}

.ring1 {

    width: 135px;

    height: 135px;

    border-left-color:
        transparent;

    border-right-color:
        transparent;

    animation:
        rotate1 7s
        linear
        infinite;
}

.ring2 {

    width: 175px;

    height: 175px;

    border-top-color:
        transparent;

    border-bottom-color:
        transparent;

    animation:
        rotate2 10s
        linear
        infinite;
}

.ring3 {

    width: 210px;

    height: 210px;

    border-left-color:
        transparent;

    border-bottom-color:
        transparent;

    animation:
        rotate1 14s
        linear
        infinite;
}

.aura-center {

    width: 100px;

    height: 100px;

    border-radius: 50%;

    border:
        2px solid
        #00eaff;

    display: flex;

    align-items:
        center;

    justify-content:
        center;

    color: #00eaff;

    font-size: 21px;

    font-weight: bold;

    letter-spacing: 3px;

    background:
        radial-gradient(
            circle,
            #064454,
            #02090d
        );

    box-shadow:
        0 0 15px #00eaff,
        0 0 45px
        rgba(
            0,
            234,
            255,
            0.7
        ),
        inset 0 0 25px
        rgba(
            0,
            234,
            255,
            0.5
        );

    animation:
        pulse 2.2s
        infinite
        ease-in-out;

    z-index: 5;
}

@keyframes rotate1 {

    from {
        transform:
            rotate(0deg);
    }

    to {
        transform:
            rotate(360deg);
    }
}

@keyframes rotate2 {

    from {
        transform:
            rotate(360deg);
    }

    to {
        transform:
            rotate(0deg);
    }
}

@keyframes pulse {

    0%,
    100% {
        transform:
            scale(1);
    }

    50% {
        transform:
            scale(1.06);
    }
}


/* =========================
   DURUM
========================= */

.aura-status {

    margin-top: -8px;

    margin-bottom: 5px;

    font-size: 10px;

    letter-spacing: 3px;

    color: #8defff;
}


/* =========================
   SOHBET
========================= */

#chat {

    width:
        min(
            92%,
            600px
        );

    flex: 1;

    min-height: 0;

    overflow-y: auto;

    padding:
        5px
        5px
        10px;
}

.message {

    max-width: 85%;

    padding:
        10px
        13px;

    margin-bottom: 10px;

    border-radius: 10px;

    line-height: 1.4;

    white-space:
        pre-wrap;

    font-size: 14px;

    animation:
        messageIn
        0.2s
        ease-out;
}

@keyframes messageIn {

    from {

        opacity: 0;

        transform:
            translateY(5px);
    }

    to {

        opacity: 1;

        transform:
            translateY(0);
    }
}

.aura {

    background:
        rgba(
            0,
            35,
            45,
            0.8
        );

    margin-right: auto;

    border:
        1px solid
        rgba(
            0,
            234,
            255,
            0.25
        );
}

.user {

    background:
        rgba(
            0,
            90,
            120,
            0.8
        );

    margin-left: auto;

    color: white;
}


/* =========================
   ALT KISIM
========================= */

#bottom {

    width: 100%;

    min-height: 65px;

    display: flex;

    align-items:
        center;

    gap: 8px;

    padding: 10px;

    background:
        rgba(
            0,
            10,
            15,
            0.97
        );

    border-top:
        1px solid
        rgba(
            0,
            234,
            255,
            0.45
        );

    z-index: 10;
}

#input {

    flex: 1;

    min-width: 0;

    height: 45px;

    padding: 12px;

    border-radius: 8px;

    border:
        1px solid
        rgba(
            0,
            234,
            255,
            0.5
        );

    outline: none;

    background:
        rgba(
            0,
            25,
            32,
            0.95
        );

    color: #00eaff;

    font-size: 14px;
}

#input::placeholder {

    color:
        #548995;
}

button {

    height: 45px;

    border:
        1px solid
        #00eaff;

    border-radius: 8px;

    padding:
        0 14px;

    background:
        rgba(
            0,
            60,
            75,
            0.9
        );

    color:
        #00eaff;

    font-size: 14px;

button:active {

    transform:

}

button:disabled {

.mic-button {

/* =========================
   MOBİL
========================= */

@media (

    .aura-core {

        margin-bottom:

    }

/* =========================
   TEMEL ELEMANLAR
========================= */

const chat =
    document.getElementById(
        "chat"
    );

const input =
    document.getElementById(
        "input"
    );

    document.getElementById(
        "sendButton"

/* =========================
   MESAJ EKLEME
========================= */

function addMessage(
    text,
    type
) {

    const message =
        document.createElement(
            "div"
        );

    message.className =
        "message " + type;

    message.textContent =
        text;

    chat.appendChild(
        message
    );

    chat.scrollTop =
        chat.scrollHeight;
}


/* =========================
   KULLANICI BİLGİLERİ
========================= */

const userName =
    "Bedirhan Kahraman";

const girlfriendName =
    "Edanur Kahraman";


/* =========================
   AURA KİMLİĞİ
========================= */

const systemPrompt = `

Sen AURA adında kişisel yapay zeka asistanısın.

Türkçe konuş.

Doğal, akıcı ve anlaşılır konuş.

Kullanıcının adı Bedirhan Kahraman.

Fakat kullanıcıya her mesajda
"Bedirhan" diye hitap etme.

Özellikle her cevabın başında
Bedirhan deme.

Sadece konuşmanın doğal akışı
gerektiriyorsa kullanıcıya adıyla
hitap edebilirsin.

Kullanıcı "ben kimim"
veya benzeri bir soru sorarsa
Bedirhan Kahraman olduğunu söyle.

Kullanıcının sevgilisinin adı
Edanur Kahraman.

Edanur'dan bahsedildiğinde
onu kullanıcının sevgilisi olarak
tanı.

Kullanıcı Edanur hakkında
soru sorarsa bildiğin bilgileri
kullan.

Bilmediğin kişisel bilgileri
uydurma.

Kullanıcıya robotik cevaplar verme.

Gereksiz şekilde kendini tanıtma.

Kısa sorulara gereksiz uzun
cevaplar verme.

Kullanıcı detay isterse
detaylandır.

Sen AURA'sın.

`;


/* =========================
   KONUŞMA HAFIZASI
========================= */

let conversation = [

    {
        role:
            "system",

        content:
            systemPrompt
    }

];


/* =========================
   KALICI HAFIZA ANAHTARLARI
========================= */

const MEMORY_KEY =
    "AURA_CONVERSATION_MEMORY_V1";

const MESSAGE_KEY =
    "AURA_MESSAGE_HISTORY_V1";


/* =========================
   HAFIZAYI YÜKLE
========================= */

function loadMemory() {

    try {

        const saved =
            localStorage.getItem(
                MEMORY_KEY
            );

        if (saved) {

            const parsed =
                JSON.parse(saved);

            if (
                Array.isArray(parsed)
            ) {

                conversation =
                    parsed;
            }
        }

    }

    catch (error) {

        console.error(
            "HAFIZA YUKLEME HATASI:",
            error
        );

        conversation = [

            {
                role:
                    "system",

                content:
                    systemPrompt
            }

        ];
    }
}


/* =========================
   HAFIZAYI KAYDET
========================= */

function saveMemory() {

    try {

        /*
         Çok fazla büyümemesi için
         son 80 mesaj tutuluyor.
        */

        const systemMessage =
            conversation.find(
                item =>
                    item.role ===
                    "system"
            );

        const normalMessages =
            conversation.filter(
                item =>
                    item.role !==
                    "system"
            );


        const limited =
            normalMessages.slice(
                -80
            );


        conversation = [

            systemMessage,

            ...limited

        ];


        localStorage.setItem(

            MEMORY_KEY,

            JSON.stringify(
                conversation
            )

        );

    }

    catch (error) {

        console.error(
            "HAFIZA KAYDETME HATASI:",
            error
        );
    }
}


/* =========================
   SAYFA AÇILINCA HAFIZA
========================= */

loadMemory();

/* =========================
   TARİH
========================= */

function getDateInfo() {

    const now =
        new Date();

    return {

        date:
            now.toLocaleDateString(
                "tr-TR",
                {
                    weekday:
                        "long",
                    year:
                        "numeric",
                    month:
                        "long",
                    day:
                        "numeric"
                }
            ),

        time:
            now.toLocaleTimeString(
                "tr-TR",
                {
                    hour:
                        "2-digit",
                    minute:
                        "2-digit",
                    second:
                        "2-digit"
                }
            )
    };
}


/* =========================
   HESAP MAKİNESİ
========================= */

function calculateExpression(
    text
) {

    let expression =
        text
            .toLocaleLowerCase(
                "tr-TR"
            )
            .trim();


    expression =
        expression
            .replace(
                /kaç eder|hesapla|hesaplar mısın|sonuç nedir|sonucu nedir/g,
                ""
            )
            .trim();


    /*
       Güvenli hesaplama:
       yalnızca sayı ve temel
       matematik operatörleri.
    */

    if (
        !/^[0-9+\-*/().%\s]+$/
            .test(expression)
    ) {

        return null;
    }


    if (
        !/[+\-*/%]/.test(
            expression
        )
    ) {

        return null;
    }


    try {

        const result =
            Function(
                '"use strict"; return (' +
                expression +
                ')'
            )();


        if (
            typeof result ===
            "number"
            &&
            Number.isFinite(
                result
            )
        ) {

            return result;
        }

    }

    catch (error) {

        return null;
    }


    return null;
}


/* =========================
   BASİT KOMUTLAR
========================= */

function handleLocalCommand(
    text
) {

    const command =
        text
            .toLocaleLowerCase(
                "tr-TR"
            )
            .trim();


    const info =
        getDateInfo();


    /* SAAT */

    if (
        command === "saat kaç"
        ||
        command ===
        "saat kaç?"
        ||
        command.includes(
            "şu an saat kaç"
        )
        ||
        command.includes(
            "saat kaç oldu"
        )
    ) {

        return (
            "Şu an saat " +
            info.time
        );
    }


    /* TARİH */

    if (
        command === "bugün tarih ne"
        ||
        command ===
        "bugünün tarihi ne"
        ||
        command.includes(
            "bugün günlerden ne"
        )
        ||
        command.includes(
            "tarih ne"
        )
    ) {

        return (
            "Bugün " +
            info.date +
            "."
        );
    }


    /* BUGÜN */

    if (
        command ===
        "bugün ne"
    ) {

        return (
            "Bugün " +
            info.date +
            ". Saat " +
            info.time + "."
        );
    }


    /* KİMLİK */

    if (
        command.includes(
            "ben kimim"
        )
        ||
        command.includes(
            "benim adım ne"
        )
        ||
        command.includes(
            "ismim ne"
        )
    ) {

        return (
            "Sen Bedirhan Kahraman'sın."
        );
    }


    /* EDANUR */

    if (
        command.includes(
            "edanur kim"
        )
        ||
        command.includes(
            "sevgilim kim"
        )
        ||
        command.includes(
            "sevgilimin adı ne"
        )
    ) {

        return (
            "Sevgilinin adı Edanur Kahraman."
        );
    }


    /* AURA */

    if (
        command === "sen kimsin"
        ||
        command === "adın ne"
        ||
        command ===
        "senin adın ne"
    ) {

        return (
            "Ben AURA. "
            +
            "Kişisel yapay zeka "
            +
            "asistanınım."
        );
    }


    /* SADECE SELAM */

    if (
        command === "merhaba"
        ||
        command === "selam"
        ||
        command === "selam aura"
        ||
        command ===
        "merhaba aura"
    ) {

        return (
            "Merhaba. Seni dinliyorum."
        );
    }


    /* ŞAKA */

    if (
        command.includes(
            "şaka yap"
        )
        ||
        command.includes(
            "bana şaka anlat"
        )
        ||
        command ===
        "bir şaka yap"
    ) {

        const jokes = [

            "Matematik kitabı neden ağlamış? Çünkü çok problemi var.",

            "Telefon neden gözlük takmış? Çünkü numaraları okuyamamış.",

            "Bilgisayar neden doktora gitmiş? Virüs kapmış.",

            "Saat neden kavga etmiş? Çünkü zamanı gelmiş."

        ];


        return jokes[
            Math.floor(
                Math.random()
                *
                jokes.length
            )
        ];
    }


    /* HESAPLAMA */

    const calculation =
        calculateExpression(
            command
        );


    if (
        calculation !== null
    ) {

        return (
            "Sonuç: " +
            calculation
        );
    }


    return null;
}

function clearAuraMemory() {

    try {

        localStorage.removeItem(

        localStorage.removeItem(

        conversation = [

}


/* =========================
   AI
========================= */

async function askAI(
    text
) {

    conversation.push({

        role:
            "user",

        content:
            text
    });


    saveMemory();


    try {

        const response =
            await puter.ai.chat(

                conversation,

                {
                    model:
                        "gpt-5.4-nano"
                }

            );


        let answer = "";


        if (
            response &&
            response.message &&
            response.message.content
        ) {

            answer =
                response.message.content;

        }

        else if (
            response &&
            response.text
        ) {

            answer =
                response.text;

        }

        else if (
            typeof response ===
            "string"
        ) {

            answer =
                response;

        }

        else {

            answer =
                "Cevap oluşturamadım.";
        }


        conversation.push({

            role:
                "assistant",

            content:
                answer
        });


        saveMemory();


        return answer;

    }

    catch (error) {

        console.error(
            "AI HATASI:",
            error
        );


        /*
           Hata durumunda kullanıcıya
           teknik ayrıntıyı göstermiyoruz.
        */

        return (
            "Şu anda AI bağlantısında "
            +
            "bir sorun var. Biraz sonra "
            +
            "tekrar deneyebiliriz."
        );
    }
}

) {

/* =========================
   SESLİ CEVAP
========================= */

function cleanTextForSpeech(
    text
) {

    return text

        .replace(
            /[\p{Emoji_Presentation}\p{Extended_Pictographic}]/gu,
            ""
        )

        .replace(
            /https?:\/\/\S+/gi,
            ""
        )

        .replace(
            /[.,!?;:"'“”‘’()[\]{}<>…\/\\|@#$%^&*_+=~`-]/g,
            " "
        )

        .replace(
            /\s+/g,
            " "
        )

        .trim();
}


function speak(
    text
) {

    if (
        !(
            "speechSynthesis"
            in window
        )
    ) {

        return;
    }


    const cleanText =
        cleanTextForSpeech(
            text
        );


    if (
        !cleanText
    ) {

        return;
    }


    window.speechSynthesis.cancel();


    const utterance =
        new SpeechSynthesisUtterance(
            cleanText
        );


    utterance.lang =
        "tr-TR";

    utterance.rate =
        0.9;

    utterance.pitch =
        1;

    utterance.volume =
        1;


    window.speechSynthesis.speak(
        utterance
    );
}


/* =========================
   ANA MESAJ SİSTEMİ
========================= */

async function processMessage(
    text,
    voiceMode = false
) {

    text =
        text.trim();


    if (
        !text
    ) {

        return;
    }


    addMessage(
        text,
        "user"
    );


    /*
       Önce yerel komutları
       kontrol et.
    */

    const localReply =
        handleLocalCommand(
            text
        );


    if (
        localReply !== null
    ) {

        addMessage(
            localReply,
            "aura"
        );


        if (
            voiceMode
        ) {

            speak(
                localReply
            );
        }


        saveMessageHistory(
            text,
            localReply
        );


        input.focus();

        return;
    }


    /*
       AI cevap alanı
    */

    addMessage(
        "Düşünüyorum...",
        "aura"
    );


    const loading =
        chat.lastElementChild;


    sendButton.disabled =
        true;

    micButton.disabled =
        true;


    try {

        let reply;


        if (
            needsWebSearch(
                text
            )
        ) {

            reply =
                await askAIWithWeb(
                    text
                );

        }

        else {

            reply =
                await askAI(
                    text
                );
        }


        if (
            loading
        ) {

            loading.remove();
        }


        addMessage(
            reply,
            "aura"
        );


        saveMessageHistory(
            text,
            reply
        );


        if (
            voiceMode
        ) {

            speak(
                reply
            );
        }

    }

    catch (error) {

        console.error(
            error
        );


        if (
            loading
        ) {

            loading.remove();
        }


        addMessage(
            "Bir hata oluştu. "
            +
            "Tekrar deneyelim.",
            "aura"
        );
    }


    sendButton.disabled =
        false;

    micButton.disabled =
        false;

    input.focus();
}


/* =========================
   MESAJ GEÇMİŞİ
========================= */

function saveMessageHistory(
    userText,
    auraText
) {

    try {

        let history = [];


        const saved =
            localStorage.getItem(
                MESSAGE_KEY
            );


        if (
            saved
        ) {

            history =
                JSON.parse(
                    saved
                );
        }


        history.push({

            user:
                userText,

            aura:
                auraText,

            time:
                new Date()
                    .toISOString()
        });


        /*
           Son 100 konuşmayı tut.
        */

        history =
            history.slice(
                -100
            );


        localStorage.setItem(

            MESSAGE_KEY,

            JSON.stringify(
                history
            )

        );

    }

    catch (error) {

        console.error(
            "MESAJ HAFIZA HATASI:",
            error
        );
    }
}


/* =========================
   YAZILI MESAJ
========================= */

async function sendTextMessage() {

    const text =
        input.value.trim();


    if (
        !text
    ) {

        return;
    }


    input.value =
        "";


    await processMessage(
        text,
        false
    );
}


/* =========================
   GÖNDER BUTONU
========================= */

sendButton.addEventListener(

    "click",

    function() {

        sendTextMessage();

    }

);


/* =========================
   ENTER
========================= */

input.addEventListener(

    "keydown",

    function(event) {

        if (
            event.key ===
            "Enter"
        ) {

            event.preventDefault();

            sendTextMessage();
        }

    }

);


/* =========================
   SESLİ TANIMA
========================= */

const SpeechRecognition =
    window.SpeechRecognition
    ||
    window.webkitSpeechRecognition;


let recognition =
    null;


let isListening =
    false;


if (
    SpeechRecognition
) {

    recognition =
        new SpeechRecognition();


    recognition.lang =
        "tr-TR";


    recognition.continuous =
        false;


    recognition.interimResults =
        false;


    recognition.onstart =
        function() {

            isListening =
                true;

            micButton.textContent =
                "🔴";
        };


    recognition.onend =
        function() {

            isListening =
                false;

            micButton.textContent =
                "🎤";
        };


    recognition.onerror =
        function(error) {

            console.error(
                "SES HATASI:",
                error
            );

            isListening =
                false;

            micButton.textContent =
                "🎤";
        };


    recognition.onresult =
        async function(event) {

            const text =
                event
                    .results[0][0]
                    .transcript
                    .trim();


            if (
                !text
            ) {

                return;
            }


            await processMessage(
                text,
                true
            );
        };
}


/* =========================
   MİKROFON BUTONU
========================= */

micButton.addEventListener(

    "click",

    function() {

        if (
            !recognition
        ) {

            addMessage(

                "Bu tarayıcı sesli "
                +
                "komutu desteklemiyor.",

                "aura"

            );

            return;
        }


        if (
            isListening
        ) {

            recognition.stop();

            return;
        }


        try {

            recognition.start();

        }

        catch (error) {

            console.error(
                "Mikrofon başlatılamadı:",
                error
            );
        }

    }

);

/* =========================
   KAYITLI MESAJLARI GÖSTER
========================= */

function loadVisibleHistory() {

    try {

        const saved =
            localStorage.getItem(
                MESSAGE_KEY
            );


        if (
            !saved
        ) {

            return;
        }


        const history =
            JSON.parse(
                saved
            );


        if (
            !Array.isArray(
                history
            )
        ) {

            return;
        }


        /*
           Açılışta tüm geçmişi
           ekrana doldurmak yerine
           son 20 konuşmayı gösteriyoruz.
        */

        const recent =
            history.slice(
                -20
            );


        recent.forEach(
            function(item) {

                if (
                    item.user
                ) {

                    addMessage(
                        item.user,
                        "user"
                    );
                }


                if (
                    item.aura
                ) {

                    addMessage(
                        item.aura,
                        "aura"
                    );
                }

            }
        );

    }

    catch (error) {

        console.error(
            "GEÇMİŞ YÜKLEME HATASI:",
            error
        );
    }
}


/* =========================
   BAŞLANGIÇ MESAJI
========================= */

function initializeAura() {

    const saved =
        localStorage.getItem(
            MESSAGE_KEY
        );


    if (
        saved
    ) {

        loadVisibleHistory();

    }

    else {

        addMessage(

            "Merhaba. Ben AURA AI.\n\n" +
            "Sistem hazır. Seni dinliyorum.",

            "aura"
        );
    }


    input.focus();
}
