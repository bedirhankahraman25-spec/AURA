<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>AURA AI</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0b0f19;
      color: white;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      height: 70px;
      display: flex;
      align-items: center;
      padding: 0 20px;
      background: #111827;
      border-bottom: 1px solid #263044;
    }

    .logo {
      font-size: 25px;
      font-weight: bold;
      color: #6ea8ff;
    }

    .status {
      margin-left: auto;
      font-size: 13px;
      color: #55e38a;
    }

    main {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
    }

    .welcome {
      text-align: center;
      margin-top: 60px;
    }

    .welcome h1 {
      font-size: 42px;
      margin-bottom: 10px;
      color: #6ea8ff;
    }

    .welcome p {
      color: #9ca3af;
    }

    .message {
      max-width: 850px;
      margin: 15px auto;
      padding: 15px 18px;
      border-radius: 15px;
      line-height: 1.5;
      white-space: pre-wrap;
    }

    .user {
      background: #2563eb;
      margin-left: auto;
      width: fit-content;
      max-width: 80%;
    }

    .aura {
      background: #172033;
      margin-right: auto;
      width: fit-content;
      max-width: 80%;
    }

    .input-area {
      padding: 15px;
      background: #111827;
      border-top: 1px solid #263044;
      display: flex;
      gap: 10px;
    }

    input {
      flex: 1;
      padding: 15px;
      border: none;
      outline: none;
      border-radius: 12px;
      background: #1f2937;
      color: white;
      font-size: 16px;
    }

    button {
      width: 55px;
      border: none;
      border-radius: 12px;
      background: #2563eb;
      color: white;
      font-size: 20px;
      cursor: pointer;
    }

    button:active {
      transform: scale(0.95);
    }
  </style>
</head>

<body>

  <header>
    <div class="logo">AURA</div>
    <div class="status">● Çevrimiçi</div>
  </header>

  <main id="chat">

    <div class="welcome" id="welcome">
      <h1>AURA</h1>
      <p>Merhaba. Ben AURA.</p>
      <p>Bana bir şey yazabilirsin.</p>
    </div>

  </main>

  <div class="input-area">
    <input
      id="messageInput"
      type="text"
      placeholder="AURA'ya bir şey yaz..."
      autocomplete="off"
    >

    <button onclick="sendMessage()">➤</button>
  </div>

  <script>

    const input = document.getElementById("messageInput");
    const chat = document.getElementById("chat");
    const welcome = document.getElementById("welcome");

    input.addEventListener("keydown", function(event) {
      if (event.key === "Enter") {
        sendMessage();
      }
    });

    function addMessage(text, type) {

      if (welcome) {
        welcome.style.display = "none";
      }

      const message = document.createElement("div");

      message.className = "message " + type;

      message.textContent = text;

      chat.appendChild(message);

      chat.scrollTop = chat.scrollHeight;
    }

    function sendMessage() {

      const text = input.value.trim();

      if (text === "") {
        return;
      }

      addMessage(text, "user");

      input.value = "";

      setTimeout(function() {

        let answer = "";

        const lower = text.toLowerCase();

        if (lower.includes("merhaba") ||
            lower.includes("selam")) {

          answer = "Merhaba! Ben AURA. Nasıl yardımcı olabilirim?";

        } else if (lower.includes("nasılsın") ||
                   lower.includes("nasilsin")) {

          answer = "İyiyim. Hazırım.";

        } else if (lower.includes("adın") ||
                   lower.includes("adin")) {

          answer = "Benim adım AURA.";

        } else if (lower.includes("saat")) {

          answer = "Şu an saat: " +
                   new Date().toLocaleTimeString("tr-TR");

        } else if (lower.includes("tarih")) {

          answer = "Bugünün tarihi: " +
                   new Date().toLocaleDateString("tr-TR");

        } else {

          answer = "Mesajını aldım. Gerçek yapay zeka bağlantısını bir sonraki aşamada ekleyeceğiz.";

        }

        addMessage(answer, "aura");

      }, 500);
    }

  </script>

</body>
</html>
