<!DOCTYPE html>
<html lang="tr">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<meta name="theme-color"
      content="#02060a">

<title>AURA AI</title>

<style>

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
}

body {

    overflow: hidden;

    font-family:
        Arial,
        sans-serif;

    color: #00eaff;

    background:
        radial-gradient(
            circle at center,
            #06303d 0%,
            #02080c 50%,
            #000000 100%
        );
}

/* =========================
   ÜST BAR
========================= */

.top-bar {

    height: 60px;

    display: flex;

    align-items: center;

    justify-content: space-between;

    padding: 0 18px;

    background:
        rgba(0,10,15,0.9);

    border-bottom:
        1px solid
        rgba(0,234,255,0.4);
}

.logo {

    font-size: 21px;

    font-weight: bold;

    letter-spacing: 4px;

    text-shadow:
        0 0 10px #00eaff,
        0 0 25px #00eaff;
}

.status {

    font-size: 11px;

    letter-spacing: 2px;

    color: #55ffcc;
}

.status::before {

    content: "";

    display: inline-block;

    width: 7px;

    height: 7px;

    margin-right: 7px;

    border-radius: 50%;

    background: #55ffcc;

    box-shadow:
        0 0 8px #55ffcc,
        0 0 15px #55ffcc;
}

/* =========================
   ANA ALAN
========================= */

.main {

    height:
        calc(100vh - 60px);

    height:
        calc(100dvh - 60px);

    display: flex;

    flex-direction: column;

    align-items: center;

    min-height: 0;
}

/* =========================
   AURA ÇEKİRDEĞİ
========================= */

.aura-core {

    width: 210px;

    height: 210px;

    margin-top: 10px;

    position: relative;

    display: flex;

    align-items: center;

    justify-content: center;

    flex-shrink: 0;
}

.aura-ring {

    position: absolute;

    border-radius: 50%;

    border:
        1px solid
        #00eaff;

    opacity: 0.7;
}

.ring1 {

    width: 135px;

    height: 135px;

    border-left-color: transparent;

    border-right-color: transparent;

    animation:
        rotate1 7s linear infinite;
}

.ring2 {

    width: 175px;

    height: 175px;

    border-top-color: transparent;

    border-bottom-color: transparent;

    animation:
        rotate2 10s linear infinite;
}

.ring3 {

    width: 210px;

    height: 210px;

    border-left-color: transparent;

    border-bottom-color: transparent;

    animation:
        rotate1 14s linear infinite;
}

.aura-center {

    width: 100px;

    height: 100px;

    border-radius: 50%;

    border:
        2px solid
        #00eaff;

    display: flex;

    align-items: center;

    justify-content: center;

    color: #00eaff;

    font-size: 21px;

    font-weight: bold;

    letter-spacing: 3px;

    background:
        radial-gradient(
            circle,
            #064454,
            #02090d
        );

    box-shadow:
        0 0 15px #00eaff,
        0 0 45px rgba(0,234,255,0.7),
        inset 0 0 25px rgba(0,234,255,0.5);

    animation:
        pulse 2.2s infinite ease-in-out;

    z-index: 5;
}

@keyframes rotate1 {

    from {
        transform: rotate(0deg);
    }

    to {
        transform: rotate(360deg);
    }
}

@keyframes rotate2 {

    from {
        transform: rotate(360deg);
    }

    to {
        transform: rotate(0deg);
    }
}

@keyframes pulse {

    0%,
    100% {
        transform: scale(1);
    }

    50% {
        transform: scale(1.06);
    }
}

.aura-status {

    margin-top: -8px;

    margin-bottom: 5px;

    font-size: 10px;

    letter-spacing: 3px;

    color: #8defff;
}

/* =========================
   SOHBET
========================= */

#chat {

    width:
        min(92%, 600px);

    flex: 1;

    min-height: 0;

    overflow-y: auto;

    padding:
        5px 5px 10px;
}

.message {

    max-width: 85%;

    padding:
        10px 13px;

    margin-bottom: 10px;

    border-radius: 10px;

    line-height: 1.4;

    white-space: pre-wrap;

    font-size: 14px;
}

.aura {

    background:
        rgba(0,35,45,0.8);

    margin-right: auto;

    border:
        1px solid
        rgba(0,234,255,0.25);
}

.user {

    background:
        rgba(0,90,120,0.8);

    margin-left: auto;

    color: white;
}

/* =========================
   ALT PANEL
========================= */

#bottom {

    width: 100%;

    min-height: 65px;

    display: flex;

    align-items: center;

    gap: 8px;

    padding: 10px;

    background:
        rgba(0,10,15,0.97);

    border-top:
        1px solid
        rgba(0,234,255,0.45);

    z-index: 10;
}

#input {

    flex: 1;

    min-width: 0;

    height: 45px;

    padding: 12px;

    border-radius: 8px;

    border:
        1px solid
        rgba(0,234,255,0.5);

    outline: none;

    background:
        rgba(0,25,32,0.95);

    color: #00eaff;

    font-size: 14px;
}

#input::placeholder {

    color: #548995;
}

button {

    height: 45px;

    border:
        1px solid
        #00eaff;

    border-radius: 8px;

    padding:
        0 14px;

    background:
        rgba(0,60,75,0.9);

    color: #00eaff;

    font-size: 14px;

    cursor: pointer;
}

button:active {

    transform:
        scale(0.94);
}

button:disabled {

    opacity: 0.5;
}

.mic-button {

    width: 45px;

    padding: 0;

    font-size: 20px;
}

@media (max-width: 500px) {

    .aura-core {

        transform:
            scale(0.82);

        margin-top: 0;

        margin-bottom: -15px;
    }

    .logo {

        font-size: 18px;
    }

    button {

        padding:
            0 11px;
    }
}

</style>

</head>

<body>

<div class="top-bar">

    <div class="logo">
        AURA
    </div>

    <div class="status">
        ONLINE
    </div>

</div>

<div class="main">

    <div class="aura-core">

        <div class="aura-ring ring1"></div>

        <div class="aura-ring ring2"></div>

        <div class="aura-ring ring3"></div>

        <div class="aura-center">
            AURA
        </div>

    </div>

    <div class="aura-status">
        AI SYSTEM READY
    </div>

    <div id="chat"></div>

    <div id="bottom">

        <input
            id="input"
            type="text"
            placeholder="AURA'ya bir şey sor..."
            autocomplete="off"
        >

        <button
            class="mic-button"
            id="micButton"
            type="button">
            🎤
        </button>

        <button
            id="sendButton"
            type="button">
            Gönder
        </button>

    </div>

</div>

<script src="https://js.puter.com/v2/"></script>

<script>

/* =========================
   ELEMENTLER
========================= */

const chat =
    document.getElementById("chat");

const input =
    document.getElementById("input");

const sendButton =
    document.getElementById("sendButton");

const micButton =
    document.getElementById("micButton");


/* =========================
   TEMEL KİMLİK
========================= */

const AURA_USER =
    "Bedirhan Kahraman";

const AURA_GIRLFRIEND =
    "Edanur Kahraman";


/* =========================
   MESAJ EKLE
========================= */

function addMessage(text, type) {

    const message =
        document.createElement("div");

    message.className =
        "message " + type;

    message.textContent =
        String(text);

    chat.appendChild(message);

    chat.scrollTop =
        chat.scrollHeight;
}


/* =========================
   NORMALLEŞTİRME
========================= */

function normalizeText(text) {

    return String(text)
        .toLocaleLowerCase("tr-TR")
        .trim();
}/* =========================
   GELİŞMİŞ HAFIZA
========================= */

const MEMORY_KEY =
    "AURA_ADVANCED_MEMORY_V1";

const TASK_KEY =
    "AURA_TASKS_V1";

const REMINDER_KEY =
    "AURA_REMINDERS_V1";

const CHAT_MEMORY_KEY =
    "AURA_CHAT_MEMORY_V1";


function safeLoad(key, fallback) {

    try {

        const saved =
            localStorage.getItem(key);

        if (!saved) {
            return fallback;
        }

        const data =
            JSON.parse(saved);

        return data;

    } catch (error) {

        console.error(
            "Hafıza okuma hatası:",
            error
        );

        return fallback;
    }
}


function safeSave(key, data) {

    try {

        localStorage.setItem(
            key,
            JSON.stringify(data)
        );

        return true;

    } catch (error) {

        console.error(
            "Hafıza kaydetme hatası:",
            error
        );

        return false;
    }
}


/* =========================
   HAFIZA YAPISI
========================= */

let auraMemory =
    safeLoad(
        MEMORY_KEY,
        {
            facts: [],
            preferences: [],
            notes: [],
            important: []
        }
    );


let auraTasks =
    safeLoad(
        TASK_KEY,
        []
    );


let auraReminders =
    safeLoad(
        REMINDER_KEY,
        []
    );


let chatMemory =
    safeLoad(
        CHAT_MEMORY_KEY,
        []
    );


function saveMemory() {

    safeSave(
        MEMORY_KEY,
        auraMemory
    );
}


function addMemory(type, text) {

    if (
        !auraMemory[type] ||
        !Array.isArray(auraMemory[type])
    ) {

        auraMemory[type] = [];
    }

    auraMemory[type].push({

        text:
            String(text),

        date:
            new Date()
                .toLocaleString("tr-TR")
    });

    /* Gereksiz sonsuz büyümeyi önle */

    if (
        auraMemory[type].length > 200
    ) {

        auraMemory[type] =
            auraMemory[type].slice(-200);
    }

    saveMemory();
}


/* =========================
   HAFIZA METNİ
========================= */

function getMemoryText() {

    let result = "";

    const groups = [
        ["facts", "Bilgiler"],
        ["preferences", "Tercihler"],
        ["notes", "Notlar"],
        ["important", "Önemli bilgiler"]
    ];


    groups.forEach(function(group) {

        const list =
            auraMemory[group[0]];

        if (
            Array.isArray(list) &&
            list.length > 0
        ) {

            result +=
                "\n" +
                group[1] +
                ":\n";

            list.forEach(function(item) {

                result +=
                    "- " +
                    item.text +
                    "\n";
            });
        }

    });


    if (!result.trim()) {

        return "Kayıtlı özel bilgi yok.";
    }


    return result.trim();
}


/* =========================
   HAFIZA KOMUTLARI
========================= */

function handleMemoryCommand(text) {

    const command =
        normalizeText(text);


    const notePrefixes = [
        "not al ",
        "not kaydet ",
        "bunu not al ",
        "bunu kaydet "
    ];


    for (
        const prefix of notePrefixes
    ) {

        if (
            command.startsWith(prefix)
        ) {

            const value =
                text
                    .substring(prefix.length)
                    .trim();

            if (!value) {

                return {
                    handled: true,
                    response:
                        "Kaydedilecek notu belirt."
                };
            }

            addMemory(
                "notes",
                value
            );

            return {
                handled: true,
                response:
                    "Not hafızaya kaydedildi."
            };
        }
    }


    const factPrefixes = [
        "bunu hatırla ",
        "bunu hatirla ",
        "bunu unutma ",
        "hafızana al ",
        "hafizana al ",
        "hafızana kaydet ",
        "hafizana kaydet "
    ];


    for (
        const prefix of factPrefixes
    ) {

        if (
            command.startsWith(prefix)
        ) {

            const value =
                text
                    .substring(prefix.length)
                    .trim();

            if (!value) {

                return {
                    handled: true,
                    response:
                        "Hatırlamam gereken bilgiyi belirt."
                };
            }

            addMemory(
                "facts",
                value
            );

            return {
                handled: true,
                response:
                    "Bilgi kalıcı hafızaya kaydedildi."
            };
        }
    }


    const preferencePrefixes = [
        "tercihimi hatırla ",
        "tercihimi hatirla ",
        "şunu seviyorum ",
        "sunu seviyorum ",
        "şunu sevmiyorum ",
        "sunu sevmiyorum "
    ];


    for (
        const prefix of preferencePrefixes
    ) {

        if (
            command.startsWith(prefix)
        ) {

            const value =
                text
                    .substring(prefix.length)
                    .trim();

            if (!value) {

                return {
                    handled: true,
                    response:
                        "Tercihi belirt."
                };
            }

            addMemory(
                "preferences",
                value
            );

            return {
                handled: true,
                response:
                    "Tercih hafızaya kaydedildi."
            };
        }
    }


    if (
        command === "hafızamda ne var" ||
        command === "hafizamda ne var" ||
        command === "neyi hatırlıyorsun" ||
        command === "neyi hatirliyorsun"
    ) {

        return {
            handled: true,
            response:
                getMemoryText()
        };
    }


    if (
        command === "hafızanı temizle" ||
        command === "hafizani temizle"
    ) {

        auraMemory = {
            facts: [],
            preferences: [],
            notes: [],
            important: []
        };

        saveMemory();

        return {
            handled: true,
            response:
                "AURA hafızası temizlendi."
        };
    }


    return {
        handled: false
    };
}


/* =========================
   SOHBET GEÇMİŞİ
========================= */

function saveChatMessage(
    role,
    content
) {

    chatMemory.push({

        role:
            role,

        content:
            String(content),

        date:
            new Date().toISOString()
    });


    if (
        chatMemory.length > 60
    ) {

        chatMemory =
            chatMemory.slice(-60);
    }


    safeSave(
        CHAT_MEMORY_KEY,
        chatMemory
    );
}


/* =========================
   HAFIZA SİSTEMİ TEST
========================= */

function memoryStatus() {

    return {
        facts:
            auraMemory.facts.length,

        preferences:
            auraMemory.preferences.length,

        notes:
            auraMemory.notes.length,

        important:
            auraMemory.important.length
    };
              }/* =========================
   TARİH / SAAT
========================= */

function getDateTimeAnswer(text) {

    const command =
        normalizeText(text);


    if (
        command.includes("saat kaç") ||
        command.includes("saat kac") ||
        command === "saat"
    ) {

        return {
            handled: true,
            response:
                "Şu an saat " +
                new Date()
                    .toLocaleTimeString(
                        "tr-TR",
                        {
                            hour: "2-digit",
                            minute: "2-digit"
                        }
                    )
        };
    }


    if (
        command.includes("bugün günlerden ne") ||
        command.includes("bugun gunlerden ne") ||
        command.includes("bugünün tarihi") ||
        command.includes("bugunun tarihi") ||
        command === "tarih"
    ) {

        return {
            handled: true,
            response:
                "Bugünün tarihi " +
                new Date()
                    .toLocaleDateString(
                        "tr-TR",
                        {
                            day: "numeric",
                            month: "long",
                            year: "numeric"
                        }
                    )
        };
    }


    return {
        handled: false
    };
}


/* =========================
   BASİT HESAP MAKİNESİ
========================= */

function calculateExpression(text) {

    const command =
        normalizeText(text);


    let expression = "";


    if (
        command.startsWith("hesapla ")
    ) {

        expression =
            text.substring(8).trim();

    }

    else if (
        command.startsWith("kaç eder ")
    ) {

        expression =
            text.substring(9).trim();

    }

    else if (
        command.startsWith("kac eder ")
    ) {

        expression =
            text.substring(9).trim();

    }

    else {

        return {
            handled: false
        };
    }


    if (!expression) {

        return {
            handled: true,
            response:
                "Hesaplanacak işlemi belirt."
        };
    }


    /* Sadece güvenli matematik karakterleri */

    if (
        !/^[0-9+\-*/().,%\s]+$/.test(
            expression
        )
    ) {

        return {
            handled: true,
            response:
                "Bu işlem yalnızca basit matematik ifadeleri için kullanılabilir."
        };
    }


    try {

        let clean =
            expression
                .replace(/%/g, "/100");


        const result =
            Function(
                '"use strict"; return (' +
                clean +
                ')'
            )();


        if (
            typeof result !== "number" ||
            !Number.isFinite(result)
        ) {

            throw new Error(
                "Geçersiz sonuç"
            );
        }


        return {
            handled: true,
            response:
                "Sonuç: " +
                result
        };

    }

    catch (error) {

        return {
            handled: true,
            response:
                "Bu işlemi hesaplayamadım."
        };
    }
}


/* =========================
   ŞAKA
========================= */

function jokeAnswer(text) {

    const command =
        normalizeText(text);


    if (
        !command.includes("şaka") &&
        !command.includes("saka") &&
        !command.includes("espri")
    ) {

        return {
            handled: false
        };
    }


    const jokes = [

        "Bilgisayar neden doktora gitmiş? Çünkü virüs kapmış.",

        "Programcı neden kahve içer? Çünkü Java'sı vardır.",

        "Telefon neden gözlük takmış? Çünkü ekranı bulanıkmış.",

        "İnternet neden kavga etmiş? Bağlantısı kopmuş.",

        "Bilgisayarın en sevdiği müzik nedir? Hard rock."

    ];


    const joke =
        jokes[
            Math.floor(
                Math.random() *
                jokes.length
            )
        ];


    return {
        handled: true,
        response: joke
    };
}


/* =========================
   AURA KİMLİĞİ
========================= */

function identityAnswer(text) {

    const command =
        normalizeText(text);


    if (
        command === "ben kimim" ||
        command === "ben kimim?"
    ) {

        return {
            handled: true,
            response:
                "Sen Bedirhan Kahraman'sın."
        };
    }


    if (
        command.includes("benim sevgilim kim") ||
        command.includes("sevgilimin adı ne") ||
        command.includes("sevgilimin adi ne")
    ) {

        return {
            handled: true,
            response:
                "Bedirhan'ın sevgilisi Edanur Kahraman."
        };
    }


    if (
        command === "sen kimsin" ||
        command === "sen nesin"
    ) {

        return {
            handled: true,
            response:
                "Ben AURA. Kişisel yapay zekâ asistanınım."
        };
    }


    return {
        handled: false
    };
}


/* =========================
   GÖREVLER
========================= */

function taskCommand(text) {

    const command =
        normalizeText(text);


    if (
        command.startsWith("görev ekle ") ||
        command.startsWith("gorev ekle ")
    ) {

        const prefix =
            command.startsWith("görev ekle ")
                ? "görev ekle "
                : "gorev ekle ";


        const task =
            text
                .substring(prefix.length)
                .trim();


        if (!task) {

            return {
                handled: true,
                response:
                    "Eklenecek görevi belirt."
            };
        }


        auraTasks.push({

            id:
                Date.now(),

            text:
                task,

            completed:
                false,

            date:
                new Date().toLocaleString(
                    "tr-TR"
                )
        });


        safeSave(
            TASK_KEY,
            auraTasks
        );


        return {
            handled: true,
            response:
                "Görev listeye eklendi: " +
                task
        };
    }


    if (
        command === "görevlerim" ||
        command === "gorevlerim" ||
        command === "görev listem" ||
        command === "gorev listem"
    ) {

        if (
            auraTasks.length === 0
        ) {

            return {
                handled: true,
                response:
                    "Görev listen boş."
            };
        }


        let result =
            "Görevlerin:\n";


        auraTasks.forEach(
            function(task, index) {

                result +=
                    (index + 1) +
                    ". " +
                    (
                        task.completed
                            ? "✓ "
                            : "○ "
                    ) +
                    task.text +
                    "\n";
            }
        );


        return {
            handled: true,
            response:
                result.trim()
        };
    }


    if (
        command === "görevleri temizle" ||
        command === "gorevleri temizle"
    ) {

        auraTasks = [];

        safeSave(
            TASK_KEY,
            auraTasks
        );


        return {
            handled: true,
            response:
                "Görev listesi temizlendi."
        };
    }


    return {
        handled: false
    };
      }/* =========================
   HATIRLATICI
========================= */

function reminderCommand(text) {

    const command =
        normalizeText(text);


    const prefixes = [

        "hatırlatıcı ekle ",
        "hatirlatici ekle ",
        "hatırlat ",
        "hatirlat "

    ];


    let matchedPrefix =
        null;


    for (
        const prefix of prefixes
    ) {

        if (
            command.startsWith(prefix)
        ) {

            matchedPrefix =
                prefix;

            break;
        }
    }


    if (!matchedPrefix) {

        if (
            command === "hatırlatıcılarım" ||
            command === "hatirlaticilarim"
        ) {

            if (
                auraReminders.length === 0
            ) {

                return {
                    handled: true,
                    response:
                        "Kayıtlı hatırlatıcı yok."
                };
            }


            let result =
                "Hatırlatıcılar:\n";


            auraReminders.forEach(
                function(item, index) {

                    result +=
                        (index + 1) +
                        ". " +
                        item.text +
                        " — " +
                        item.time +
                        "\n";
                }
            );


            return {
                handled: true,
                response:
                    result.trim()
            };
        }


        if (
            command === "hatırlatıcıları temizle" ||
            command === "hatirlaticilari temizle"
        ) {

            auraReminders = [];

            safeSave(
                REMINDER_KEY,
                auraReminders
            );


            return {
                handled: true,
                response:
                    "Tüm hatırlatıcılar silindi."
            };
        }


        return {
            handled: false
        };
    }


    const value =
        text
            .substring(
                matchedPrefix.length
            )
            .trim();


    if (!value) {

        return {
            handled: true,
            response:
                "Hatırlatılacak şeyi belirt."
        };
    }


    /*
       Basit sistem:
       Kullanıcı komutun tamamını
       hatırlatıcı olarak kaydedebilir.

       Örnek:
       "hatırlatıcı ekle saat 20:00'de ders çalış"
    */

    const reminder = {

        id:
            Date.now(),

        text:
            value,

        time:
            new Date().toLocaleString(
                "tr-TR"
            ),

        notified:
            false
    };


    auraReminders.push(
        reminder
    );


    safeSave(
        REMINDER_KEY,
        auraReminders
    );


    return {
        handled: true,
        response:
            "Hatırlatıcı kaydedildi: " +
            value
    };
}

function readFileText(file) {

    return new Promise(
        function(resolve, reject) {

            const reader =
                new FileReader();


            reader.onload =
                function(event) {

                    resolve(
                        event.target.result
                    );
                };


            reader.onerror =
                function() {

                    reject(
                        new Error(
                            "Dosya okunamadı."
                        )
                    );
                };


            reader.readAsText(file);
        }
    );
}


/* =========================
   DOSYA SEÇİCİ
========================= */

function openFileReader() {

    return new Promise(
        function(resolve) {

            const fileInput =
                document.createElement(
                    "input"
                );


            fileInput.type =
                "file";


            fileInput.accept =
                ".txt,.json,.html,.css,.js,.md,.csv";


            fileInput.onchange =
                async function() {

                    const file =
                        fileInput.files[0];


                    if (!file) {

                        resolve(null);

                        return;
                    }


                    try {

                        const content =
                            await readFileText(
                                file
                            );


                        resolve({
                            name:
                                file.name,

                            content:
                                content
                        });

                    }

                    catch (error) {

                        resolve({
                            name:
                                file.name,

                            content:
                                "Dosya okunamadı."
                        });
                    }
                };


            fileInput.click();
        }
    );

async function fileCommand(text) {

    const command =
        normalizeText(text);


    if (
        command === "dosya oku" ||
        command === "dosya aç" ||
        command === "dosya ac"
    ) {

        const file =
            await openFileReader();


        if (!file) {

            return {
                handled: true,
                response:
                    "Dosya seçilmedi."
            };
        }


        /*
           Çok büyük dosyanın
           tamamını AI'a göndermemek için
           ilk 12000 karakter alınır.
        */

        const preview =
            file.content.length > 12000
                ? file.content.substring(
                    0,
                    12000
                ) +
                "\n\n[Dosyanın devamı kısaltıldı.]"
                : file.content;


        auraMemory.notes.push({

            text:
                "Okunan dosya: " +
                file.name,

            date:
                new Date().toLocaleString(
                    "tr-TR"
                )
        });


        saveMemory();


        window.auraLastFile = {

            name:
                file.name,

            content:
                preview
        };


        return {
            handled: true,
            response:
                "Dosya okundu: " +
                file.name +
                "\n\n" +
                preview
        };
    }


    if (
        command === "son dosyayı göster" ||
        command === "son dosyayi goster"
    ) {

        if (
            !window.auraLastFile
        ) {

            return {
                handled: true,
                response:
                    "Henüz dosya okunmadı."
            };
        }


        return {
            handled: true,
            response:
                window.auraLastFile.name +
                "\n\n" +
                window.auraLastFile.content
        };
    }


    return {
        handled: false
    };
}

function openAppCommand(text) {

    const command =
        normalizeText(text);


    let target =
        "";


    if (
        command.includes("youtube")
    ) {

        target =
            "https://www.youtube.com/";

    }

    else if (
        command.includes("google")
    ) {

        target =
            "https://www.google.com/";

    }

    else if (
        command.includes("github")
    ) {

        target =
            "https://github.com/";

    }

    else if (
        command.includes("whatsapp")
    ) {

        target =
            "https://web.whatsapp.com/";

    }

    else if (
        command.includes("instagram")
    ) {

        target =
            "https://www.instagram.com/";

    }

    else if (
        command.includes("chatgpt")
    ) {

        target =
            "https://chatgpt.com/";
    }


    if (!target) {

        if (
            command.startsWith("site aç ") ||
            command.startsWith("site ac ")
        ) {

            const prefix =
                command.startsWith("site aç ")
                    ? "site aç "
                    : "site ac ";


            let url =
                text
                    .substring(
                        prefix.length
                    )
                    .trim();


            if (
                !/^https?:\/\//i.test(
                    url
                )
            ) {

                url =
                    "https://" +
                    url;
            }


            target =
                url;
        }
    }


    if (!target) {

        return {
            handled: false
        };
    }


    try {

        window.open(
            target,
            "_blank"
        );


        return {
            handled: true,
            response:
                "Açıyorum."
        };

    }

    catch (error) {

        return {
            handled: true,
            response:
                "Site açılamadı."
        };
    }
}

async function agentCommand(text) {

    const command =
        normalizeText(text);


    if (
        command.startsWith("ajan ")
    ) {

        const task =
            text
                .substring(5)
                .trim();


        if (!task) {

            return {
                handled: true,
                response:
                    "Ajanın yapacağı görevi belirt."
            };
        }


        /*
           Ajan burada görevi analiz eder,
           gerekli yerel araçları kullanır
           veya AI'a aktarır.
        */

        if (
            task.includes("görev ekle") ||
            task.includes("gorev ekle")
        ) {

            return taskCommand(task);
        }


        if (
            task.includes("hatırlat") ||
            task.includes("hatirlat")
        ) {

            return reminderCommand(task);
        }


        if (
            task.includes("not al") ||
            task.includes("not kaydet")
        ) {

            return handleMemoryCommand(task);
        }


        return {
            handled: false,
            agentTask: task
        };
    }


    return {
        handled: false
    };
}

/* =========================

========================= */

function extractAIText(response) {

    if (!response) {

        return "";
    }


    if (
        typeof response === "string"
    ) {

        return response.trim();
    }


    if (
        response.message &&
        typeof response.message.content === "string"
    ) {

        return response.message.content.trim();
    }


    if (
        response.message &&
        Array.isArray(
            response.message.content
        )
    ) {

        return response.message.content
            .map(function(part) {

                if (
                    typeof part === "string"
                ) {

                    return part;
                }

                return part?.text || "";
            })
            .join("")
            .trim();
    }


    if (
        typeof response.text === "string"
    ) {

        return response.text.trim();
    }


    return "";
}

function cleanTextForSpeech(text) {

    return String(text)

        .replace(
            /https?:\/\/\S+/gi,
            " "
        )

        .replace(
            /[\p{Emoji_Presentation}\p{Extended_Pictographic}]/gu,
            " "
        )

        .replace(
            /[.,!?;:"'“”‘’()[\]{}<>…\/\\|@#$%^&*_+=~`-]/g,
            " "
        )

        .replace(
            /\s+/g,
            " "
        )

        .trim();
}


/* =========================
   SESLENDİRME
========================= */

function speak(text) {

    if (
        !("speechSynthesis" in window)
    ) {

        return;
    }


    const clean =
        cleanTextForSpeech(text);


    if (!clean) {

        return;
    }


    window.speechSynthesis.cancel();


    const utterance =
        new SpeechSynthesisUtterance(
            clean
        );


    utterance.lang =
        "tr-TR";

    utterance.rate =
        0.9;

    utterance.pitch =
        1;

    utterance.volume =
        1;


    window.speechSynthesis.speak(
        utterance
    );
}

async function sendMessage(
    voiceMode = false
) {

    const text =
        input.value.trim();


    if (!text) {

        return;
    }


    input.value =
        "";


    addMessage(
        text,
        "user"
    );


    saveChatMessage(
        "user",
        text
    );


    addMessage(
        "Düşünüyorum...",
        "aura"
    );


    const loading =
        chat.lastElementChild;


    sendButton.disabled =
        true;

    micButton.disabled =
        true;


    try {

        /*
           Önce yerel komutlar.
           Böylece saat, hafıza,
           görev, hesaplama vb.
           için AI'a gereksiz istek
           gönderilmez.
        */

        let localResult =
            await handleLocalCommand(
                text
            );


        /*
           Ajan komutu normal AI'a
           düşebilir.
        */

        let reply;


        if (
            localResult &&
            localResult.handled
        ) {

            reply =
                localResult.response;
        }

        else if (
            localResult &&
            localResult.agentTask
        ) {

            reply =
                await askAI(
                    localResult.agentTask
                );
        }

        else if (
            needsWebSearch(text)
        ) {

            reply =
                await askAIWithWeb(
                    text
                );
        }

        else {

            reply =
                await askAI(
                    text
                );
        }


        if (!reply) {

            reply =
                "Şu anda cevap oluşturamadım.";
        }


        if (loading) {

            loading.remove();
        }


        addMessage(
            reply,
            "aura"
        );


        saveChatMessage(
            "assistant",
            reply
        );


        if (voiceMode) {

            speak(reply);
        }

    }

    catch (error) {

        console.error(
            "AURA MESAJ HATASI:",
            error
        );


        if (loading) {

            loading.remove();
        }


        addMessage(
            "Bağlantıda bir sorun oluştu. Lütfen tekrar deneyin.",
            "aura"
        );
    }


    sendButton.disabled =
        false;

    micButton.disabled =
        false;

    input.focus();
}

/* =========================
   HATA YAKALAMA
========================= */

window.addEventListener(
    "error",
    function(event) {

        console.error(
            "AURA GLOBAL HATA:",
            event.error ||
            event.message
        );
    }
);


window.addEventListener(
    "unhandledrejection",
    function(event) {

        console.error(
            "AURA PROMISE HATASI:",
            event.reason
        );
    }
);


/* =========================
   SAYFA KAPANIRKEN
========================= */

window.addEventListener(
    "beforeunload",
    function() {

        safeSave(
            MEMORY_KEY,
            auraMemory
        );

        safeSave(
            TASK_KEY,
            auraTasks
        );

        safeSave(
            REMINDER_KEY,
            auraReminders
        );

        safeSave(
            CHAT_MEMORY_KEY,
            chatMemory
        );
    }
);

</script>

</body>

</html>
