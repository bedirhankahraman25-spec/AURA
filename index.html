<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AURA AI</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:#080b12;
    color:#fff;
    height:100vh;
    overflow:hidden;
}

.app{
    height:100vh;
    display:flex;
    flex-direction:column;
}

.header{
    height:70px;
    background:#0d111b;
    border-bottom:1px solid #202838;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 18px;
    flex-shrink:0;
}

.logoArea{
    display:flex;
    align-items:center;
    gap:12px;
}

.logo{
    width:43px;
    height:43px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    background:linear-gradient(135deg,#00e5ff,#635bff);
    box-shadow:0 0 20px rgba(0,229,255,.35);
    font-weight:bold;
    color:#fff;
}

.title{
    font-size:20px;
    font-weight:bold;
}

.status{
    font-size:11px;
    color:#6ee7b7;
    margin-top:3px;
}

.menuBtn{
    width:42px;
    height:42px;
    border:0;
    border-radius:12px;
    background:#171d2a;
    color:#fff;
    font-size:21px;
    cursor:pointer;
}

.chat{
    flex:1;
    overflow-y:auto;
    padding:18px 14px 120px;
    scroll-behavior:smooth;
}

.message{
    display:flex;
    margin:12px 0;
}

.message.user{
    justify-content:flex-end;
}

.message.aura{
    justify-content:flex-start;
}

.bubble{
    max-width:86%;
    padding:12px 15px;
    border-radius:17px;
    line-height:1.45;
    font-size:15px;
    white-space:pre-wrap;
    word-wrap:break-word;
}

.user .bubble{
    background:#2457e6;
    border-bottom-right-radius:5px;
}

.aura .bubble{
    background:#151b28;
    border:1px solid #222c3d;
    border-bottom-left-radius:5px;
}

.time{
    font-size:9px;
    opacity:.45;
    margin-top:5px;
}

.inputArea{
    position:fixed;
    bottom:0;
    left:0;
    right:0;
    background:#0c1019;
    border-top:1px solid #202838;
    padding:10px;
    display:flex;
    gap:8px;
    align-items:center;
}

.input{
    flex:1;
    min-width:0;
    background:#171d2a;
    border:1px solid #293449;
    outline:none;
    color:#fff;
    padding:13px 15px;
    border-radius:15px;
    font-size:15px;
}

.input:focus{
    border-color:#3567ff;
}

.actionBtn{
    width:46px;
    height:46px;
    flex-shrink:0;
    border:0;
    border-radius:14px;
    color:#fff;
    background:#182131;
    font-size:19px;
    cursor:pointer;
}

.sendBtn{
    background:#2457e6;
}

.micBtn.active{
    background:#e53935;
    box-shadow:0 0 15px rgba(229,57,53,.35);
}

.typing{
    display:flex;
    gap:4px;
    align-items:center;
}

.typing span{
    width:6px;
    height:6px;
    background:#8d9ab3;
    border-radius:50%;
    animation:blink 1.2s infinite;
}

.typing span:nth-child(2){
    animation-delay:.2s;
}

.typing span:nth-child(3){
    animation-delay:.4s;
}

@keyframes blink{
    0%,80%,100%{opacity:.25}
    40%{opacity:1}
}

.panel{
    position:fixed;
    top:0;
    right:-320px;
    width:300px;
    height:100vh;
    background:#0d111b;
    border-left:1px solid #263044;
    z-index:20;
    transition:.25s;
    padding:20px;
    overflow-y:auto;
}

.panel.open{
    right:0;
}

.panelHeader{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:22px;
}

.panelHeader h2{
    font-size:19px;
}

.closeBtn{
    background:#182131;
    color:#fff;
    border:0;
    border-radius:10px;
    width:36px;
    height:36px;
    cursor:pointer;
}

.section{
    margin-bottom:20px;
}

.sectionTitle{
    font-size:13px;
    color:#7f8ca5;
    margin-bottom:8px;
}

.panelBtn{
    width:100%;
    padding:12px;
    margin:5px 0;
    background:#171d2a;
    border:1px solid #263044;
    color:#fff;
    border-radius:11px;
    text-align:left;
    cursor:pointer;
}

.panelBtn:hover{
    background:#1d2637;
}

.memoryBox{
    background:#131a26;
    border:1px solid #263044;
    border-radius:12px;
    padding:12px;
    font-size:13px;
    line-height:1.6;
    max-height:240px;
    overflow-y:auto;
}

.overlay{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.45);
    z-index:15;
    display:none;
}

.overlay.show{
    display:block;
}

@media(max-width:500px){
    .bubble{
        max-width:90%;
    }

    .panel{
        width:290px;
    }
}
</style>
</head>

<body>

<div class="app">

    <header class="header">
        <div class="logoArea">
            <div class="logo">A</div>
            <div>
                <div class="title">AURA</div>
                <div class="status">Çevrimiçi</div>
            </div>
        </div>

        <button class="menuBtn" id="menuBtn">☰</button>
    </header>

    <main class="chat" id="chat"></main>

    <div class="inputArea">
        <button class="actionBtn micBtn" id="micBtn">🎙</button>

        <input
            class="input"
            id="messageInput"
            type="text"
            autocomplete="off"
            placeholder="Bir şey yaz..."
        >

        <button class="actionBtn sendBtn" id="sendBtn">➤</button>
    </div>

</div>

<div class="overlay" id="overlay"></div>

<aside class="panel" id="panel">

    <div class="panelHeader">
        <h2>AURA Ayarları</h2>
        <button class="closeBtn" id="closeBtn">×</button>
    </div>

    <div class="section">
        <div class="sectionTitle">HAFIZA</div>

        <button class="panelBtn" id="showMemoryBtn">
            Hafızayı Gör
        </button>

        <button class="panelBtn" id="clearMemoryBtn">
            Hafızayı Temizle
        </button>
    </div>

    <div class="section">
        <div class="sectionTitle">NOTLAR</div>

        <button class="panelBtn" id="showNotesBtn">
            Notları Gör
        </button>

        <button class="panelBtn" id="clearNotesBtn">
            Notları Temizle
        </button>
    </div>

    <div class="section">
        <div class="sectionTitle">DİĞER</div>

        <button class="panelBtn" id="clearChatBtn">
            Sohbeti Temizle
        </button>
    </div>

    <div class="section">
        <div class="sectionTitle">BİLGİ</div>

        <div class="memoryBox" id="memoryBox">
            Hafıza yükleniyor...
        </div>
    </div>

</aside>

<script>
"use strict";

/* =========================================
   AURA - TEMEL SİSTEM
========================================= */

const STORAGE_KEYS = {
    memory: "aura_memory_v2",
    notes: "aura_notes_v2",
    chat: "aura_chat_v2",
    settings: "aura_settings_v2"
};

const DEFAULT_MEMORY = {
    facts: [],
    preferences: [],
    name: "",
    favoriteTeam: "",
    learned: []
};

let memory = loadData(STORAGE_KEYS.memory, DEFAULT_MEMORY);
let notes = loadData(STORAGE_KEYS.notes, []);
let chatHistory = loadData(STORAGE_KEYS.chat, []);
let settings = loadData(STORAGE_KEYS.settings, {
    voiceEnabled: true
});

let recognition = null;
let isListening = false;
let currentVoiceRequest = false;

/* =========================================
   VERİ YÜKLEME / KAYDETME
========================================= */

function loadData(key, fallback){
    try{
        const data = localStorage.getItem(key);

        if(!data){
            return structuredCloneSafe(fallback);
        }

        const parsed = JSON.parse(data);

        return parsed;
    }catch(error){
        console.error("Veri yükleme hatası:", error);
        return structuredCloneSafe(fallback);
    }
}

function saveData(key, data){
    try{
        localStorage.setItem(key, JSON.stringify(data));
    }catch(error){
        console.error("Veri kaydetme hatası:", error);
    }
}

function structuredCloneSafe(data){
    try{
        return JSON.parse(JSON.stringify(data));
    }catch{
        return data;
    }
}

/* =========================================
   ELEMENTLER
========================================= */

const chat = document.getElementById("chat");
const input = document.getElementById("messageInput");
const sendBtn = document.getElementById("sendBtn");
const micBtn = document.getElementById("micBtn");

const panel = document.getElementById("panel");
const overlay = document.getElementById("overlay");
const menuBtn = document.getElementById("menuBtn");
const closeBtn = document.getElementById("closeBtn");

const memoryBox = document.getElementById("memoryBox");

const showMemoryBtn = document.getElementById("showMemoryBtn");
const clearMemoryBtn = document.getElementById("clearMemoryBtn");

const showNotesBtn = document.getElementById("showNotesBtn");
const clearNotesBtn = document.getElementById("clearNotesBtn");

const clearChatBtn = document.getElementById("clearChatBtn");

/* =========================================
   SAYFA BAŞLANGICI
========================================= */

document.addEventListener("DOMContentLoaded", () => {

    loadSavedChat();

    updateMemoryBox();

    if(chatHistory.length === 0){
        addAuraMessage(
            "Hazırım. Normal şekilde konuşabiliriz. Önemli bilgileri gerektiğinde hafızama alabilirim."
        );
    }
});

/* =========================================
   MENÜ
========================================= */

menuBtn.addEventListener("click", () => {
    panel.classList.add("open");
    overlay.classList.add("show");
    updateMemoryBox();
});

closeBtn.addEventListener("click", closePanel);
overlay.addEventListener("click", closePanel);

function closePanel(){
    panel.classList.remove("open");
    overlay.classList.remove("show");
}

/* =========================================
   MESAJ GÖNDERME
========================================= */

sendBtn.addEventListener("click", sendMessage);

input.addEventListener("keydown", (event) => {
    if(event.key === "Enter"){
        event.preventDefault();
        sendMessage();
    }
});

async function sendMessage(){

    const text = input.value.trim();

    if(!text){
        return;
    }

    input.value = "";

    addUserMessage(text);

    /*
       Bu mesaj yazılı olarak gönderildi.
       Bu yüzden AURA'nın ses çıkarmaması gerekir.
    */
    currentVoiceRequest = false;

    await processMessage(text, false);
}

/* =========================================
   MESAJ GÖRÜNÜMÜ
========================================= */

function addUserMessage(text){
    const message = createMessageElement("user", text);
    chat.appendChild(message);

    saveChatMessage("user", text);

    scrollToBottom();
}

function addAuraMessage(text){
    const message = createMessageElement("aura", text);
    chat.appendChild(message);

    saveChatMessage("aura", text);

    scrollToBottom();
}

function createMessageElement(type, text){

    const wrapper = document.createElement("div");
    wrapper.className = `message ${type}`;

    const bubble = document.createElement("div");
    bubble.className = "bubble";

    bubble.textContent = text;

    const time = document.createElement("div");
    time.className = "time";

    time.textContent = new Date().toLocaleTimeString(
        "tr-TR",
        {
            hour:"2-digit",
            minute:"2-digit"
        }
    );

    bubble.appendChild(time);
    wrapper.appendChild(bubble);

    return wrapper;
}

function saveChatMessage(sender, text){

    chatHistory.push({
        sender,
        text,
        time:Date.now()
    });

    /*
       Sohbet geçmişinin sonsuza kadar büyümesini
       engellemek için son 150 mesaj tutuluyor.
    */

    if(chatHistory.length > 150){
        chatHistory = chatHistory.slice(-150);
    }

    saveData(STORAGE_KEYS.chat, chatHistory);
}

function loadSavedChat(){

    chat.innerHTML = "";

    for(const item of chatHistory){

        const message = createMessageElement(
            item.sender,
            item.text
        );

        chat.appendChild(message);
    }

    scrollToBottom();
}

function scrollToBottom(){

    setTimeout(() => {
        chat.scrollTop = chat.scrollHeight;
    },50);
}

/* =========================================
   YAZIYOR GÖSTERGESİ
========================================= */

function showTyping(){

    const wrapper = document.createElement("div");
    wrapper.className = "message aura";
    wrapper.id = "typingMessage";

    const bubble = document.createElement("div");
    bubble.className = "bubble";

    const typing = document.createElement("div");
    typing.className = "typing";

    typing.innerHTML = `
        <span></span>
        <span></span>
        <span></span>
    `;

    bubble.appendChild(typing);
    wrapper.appendChild(bubble);

    chat.appendChild(wrapper);

    scrollToBottom();
}

function hideTyping(){

    const element = document.getElementById("typingMessage");

    if(element){
        element.remove();
    }
}<script>
/* =========================================
   MESAJ İŞLEME
========================================= */

async function processMessage(text, fromVoice = false){

    showTyping();

    await wait(250);

    /*
       Önce hafıza komutları kontrol edilir.
       Böylece "hafızamda ne var?" gibi komutlar
       doğrudan çalışır.
    */

    const specialResponse = handleMemoryCommands(text);

    if(specialResponse){

        hideTyping();

        addAuraMessage(specialResponse);

        if(fromVoice){
            speak(specialResponse);
        }

        return;
    }

    /*
       Normal konuşmadan önemli bilgileri öğren.
    */

    learnFromConversation(text);

    /*
       Not alma komutları.
    */

    const noteResponse = handleNoteCommands(text);

    if(noteResponse){

        hideTyping();

        addAuraMessage(noteResponse);

        if(fromVoice){
            speak(noteResponse);
        }

        return;
    }

    /*
       Basit doğal konuşma sistemi.
       İstersen daha sonra buraya gerçek API bağlantısını
       ekleyebiliriz.
    */

    const response = generateResponse(text);

    hideTyping();

    addAuraMessage(response);

    /*
       ÖNEMLİ:
       fromVoice true ise sesli cevap ver.
       Yazılı mesajda kesinlikle ses çıkarma.
    */

    if(fromVoice){
        speak(response);
    }
}

/* =========================================
   HAFIZADAN BİLGİ ÇEKME
========================================= */

function handleMemoryCommands(text){

    const t = normalize(text);

    if(
        t.includes("hafizamda ne var") ||
        t.includes("hafızanda ne var") ||
        t.includes("benim hakkımda ne biliyorsun") ||
        t.includes("beni hatırlıyor musun") ||
        t.includes("neleri hatırlıyorsun")
    ){

        return buildMemorySummary();
    }

    if(
        t.includes("hafizayi temizle") ||
        t.includes("hafızayı temizle") ||
        t.includes("her seyi unut") ||
        t.includes("her şeyi unut")
    ){

        memory = structuredCloneSafe(DEFAULT_MEMORY);

        saveData(
            STORAGE_KEYS.memory,
            memory
        );

        updateMemoryBox();

        return "Hafızadaki öğrendiğim bilgileri temizledim.";
    }

    if(
        t.includes("adimi unut") ||
        t.includes("adımı unut")
    ){

        memory.name = "";

        saveData(
            STORAGE_KEYS.memory,
            memory
        );

        updateMemoryBox();

        return "İsmini hafızamdan sildim.";
    }

    if(
        t.includes("takimimi unut") ||
        t.includes("takımımı unut") ||
        t.includes("tuttugum takimi unut") ||
        t.includes("tuttuğum takımı unut")
    ){

        memory.favoriteTeam = "";

        memory.facts = memory.facts.filter(
            fact => !fact.type || fact.type !== "favoriteTeam"
        );

        saveData(
            STORAGE_KEYS.memory,
            memory
        );

        updateMemoryBox();

        return "Tuttuğun takımla ilgili bilgiyi hafızamdan sildim.";
    }

    return null;
}

/* =========================================
   NORMAL KONUŞMADAN ÖĞRENME
========================================= */

function learnFromConversation(text){

    const original = text.trim();
    const t = normalize(original);

    /*
       İsim öğrenme
    */

    const namePatterns = [
        /benim adım\s+(.+)/i,
        /benim ismim\s+(.+)/i,
        /adım\s+(.+)/i,
        /ismim\s+(.+)/i
    ];

    for(const pattern of namePatterns){

        const match = original.match(pattern);

        if(match){

            let name = cleanLearnedValue(match[1]);

            if(
                name &&
                name.length >= 2 &&
                name.length <= 40 &&
                !containsBadMemoryValue(name)
            ){

                memory.name = name;

                addLearnedItem(
                    "name",
                    name
                );

                saveMemory();

                return;
            }
        }
    }

    /*
       Takım öğrenme
    */

    const teamPatterns = [
        /([a-zçğıöşü0-9]+)\s+tutuyorum/i,
        /([a-zçğıöşü0-9]+)\s+taraftarıyım/i,
        /([a-zçğıöşü0-9]+)\s+taraftarıyım/i,
        /tuttuğum takım\s+([a-zçğıöşü0-9]+)/i,
        /takımım\s+([a-zçğıöşü0-9]+)/i
    ];

    for(const pattern of teamPatterns){

        const match = original.match(pattern);

        if(match){

            let team = cleanLearnedValue(
                match[1]
            );

            if(
                team &&
                team.length >= 2 &&
                team.length <= 40
            ){

                memory.favoriteTeam = team;

                addLearnedItem(
                    "favoriteTeam",
                    team
                );

                saveMemory();

                return;
            }
        }
    }

    /*
       Sevdiği şeyler
    */

    const likePatterns = [
        /(.+?) seviyorum$/i,
        /(.+?) seviyorum\./i,
        /(.+?) çok seviyorum$/i
    ];

    for(const pattern of likePatterns){

        const match = original.match(pattern);

        if(match){

            const value = cleanLearnedValue(
                match[1]
            );

            if(
                value &&
                value.length >= 2 &&
                value.length <= 80
            ){

                addPreference(
                    "likes",
                    value
                );

                saveMemory();

                return;
            }
        }
    }

    /*
       Sevmediği şeyler
    */

    const dislikePatterns = [
        /(.+?) sevmiyorum$/i,
        /(.+?) sevmiyorum\./i,
        /(.+?) hiç sevmiyorum$/i
    ];

    for(const pattern of dislikePatterns){

        const match = original.match(pattern);

        if(match){

            const value = cleanLearnedValue(
                match[1]
            );

            if(
                value &&
                value.length >= 2 &&
                value.length <= 80
            ){

                addPreference(
                    "dislikes",
                    value
                );

                saveMemory();

                return;
            }
        }
    }

    /*
       "Bunu hatırla" şeklindeki normal konuşmalar.
    */

    if(
        t.includes("bunu hatırla") ||
        t.includes("bunu hatırla") ||
        t.includes("aklında tut") ||
        t.includes("aklinda tut") ||
        t.includes("unutma bunu")
    ){

        const cleaned = original
            .replace(/bunu hatırla/gi,"")
            .replace(/bunu hatırla/gi,"")
            .replace(/aklında tut/gi,"")
            .replace(/aklinda tut/gi,"")
            .replace(/unutma bunu/gi,"")
            .trim();

        if(cleaned.length >= 2){

            addFact(
                "general",
                cleaned
            );

            saveMemory();
        }
    }
}

/* =========================================
   HAFIZA YARDIMCI FONKSİYONLARI
========================================= */

function addLearnedItem(type,value){

    const exists = memory.learned.some(
        item =>
            item.type === type &&
            normalize(item.value) === normalize(value)
    );

    if(!exists){

        memory.learned.push({
            type,
            value,
            date:Date.now()
        });
    }

    if(memory.learned.length > 100){
        memory.learned =
            memory.learned.slice(-100);
    }
}

function addFact(type,value){

    const exists = memory.facts.some(
        fact =>
            normalize(fact.value) === normalize(value)
    );

    if(!exists){

        memory.facts.push({
            type,
            value,
            date:Date.now()
        });
    }

    if(memory.facts.length > 100){
        memory.facts =
            memory.facts.slice(-100);
    }
}

function addPreference(type,value){

    const exists = memory.preferences.some(
        item =>
            item.type === type &&
            normalize(item.value) === normalize(value)
    );

    if(!exists){

        memory.preferences.push({
            type,
            value,
            date:Date.now()
        });
    }

    if(memory.preferences.length > 100){
        memory.preferences =
            memory.preferences.slice(-100);
    }
}

function saveMemory(){

    saveData(
        STORAGE_KEYS.memory,
        memory
    );

    updateMemoryBox();
}

function cleanLearnedValue(value){

    return String(value)
        .trim()
        .replace(/[.!?,]+$/,"")
        .replace(/\s+/g," ");
}

function containsBadMemoryValue(value){

    const t = normalize(value);

    return [
        "ben",
        "bir",
        "şey",
        "burada",
        "sana",
        "benim"
    ].includes(t);
}

/* =========================================
   HAFIZA ÖZETİ
========================================= */

function buildMemorySummary(){

    const lines = [];

    if(memory.name){
        lines.push(`İsim: ${memory.name}`);
    }

    if(memory.favoriteTeam){
        lines.push(
            `Tuttuğu takım: ${memory.favoriteTeam}`
        );
    }

    const likes = memory.preferences.filter(
        item => item.type === "likes"
    );

    const dislikes = memory.preferences.filter(
        item => item.type === "dislikes"
    );

    if(likes.length){

        lines.push(
            "Sevdikleri: " +
            likes
                .map(item => item.value)
                .slice(-10)
                .join(", ")
        );
    }

    if(dislikes.length){

        lines.push(
            "Sevmedikleri: " +
            dislikes
                .map(item => item.value)
                .slice(-10)
                .join(", ")
        );
    }

    if(memory.facts.length){

        lines.push(
            "Hatırlanan bilgiler:"
        );

        memory.facts
            .slice(-10)
            .forEach(fact => {
                lines.push("• " + fact.value);
            });
    }

    if(!lines.length){
        return "Henüz senin hakkında kaydettiğim önemli bir bilgi yok.";
    }

    return lines.join("\n");
}

/* =========================================
   NOT SİSTEMİ
========================================= */

function handleNoteCommands(text){

    const original = text.trim();
    const t = normalize(original);

    if(
        t.startsWith("not al") ||
        t.startsWith("nota al") ||

    ){

        notes = [];

            notes

    }

/* =========================================
   NORMALLEŞTİRME
========================================= */

function normalize(text){

    return String(text)
        .toLocaleLowerCase("tr-TR")
        .replace(/ı/g,"i")
        .replace(/İ/g,"i")
        .replace(/ş/g,"s")
        .replace(/Ş/g,"s")
        .replace(/ğ/g,"g")
        .replace(/Ğ/g,"g")
        .replace(/ü/g,"u")
        .replace(/Ü/g,"u")
        .replace(/ö/g,"o")
        .replace(/Ö/g,"o")
        .replace(/ç/g,"c")
        .replace(/Ç/g,"c")
        .replace(/\s+/g," ")
        .trim();
}

function randomChoice(array){

    return array[
        Math.floor(
            Math.random() * array.length
        )
    ];
}

function wait(ms){

    return new Promise(
        resolve => setTimeout(resolve,ms)
    );
}

/* =========================================
   HAFIZA EKRANI
========================================= */

function updateMemoryBox(){

    const parts = [];

    if(memory.name){

        parts.push(
            `<b>İsim:</b> ${escapeHTML(memory.name)}`
        );
    }

    if(memory.favoriteTeam){

        parts.push(
            `<b>Tuttuğu takım:</b> ${escapeHTML(memory.favoriteTeam)}`
        );
    }

    const likes = memory.preferences
        .filter(item => item.type === "likes");

    const dislikes = memory.preferences
        .filter(item => item.type === "dislikes");

    if(likes.length){

        parts.push(
            "<b>Sevdikleri:</b><br>" +
            likes
                .slice(-10)
                .map(
                    item =>
                    "• " + escapeHTML(item.value)
                )
                .join("<br>")
        );
    }

    if(dislikes.length){

        parts.push(
            "<b>Sevmedikleri:</b><br>" +
            dislikes
                .slice(-10)
                .map(
                    item =>
                    "• " + escapeHTML(item.value)
                )
                .join("<br>")
        );
    }

    if(memory.facts.length){

        parts.push(
            "<b>Diğer bilgiler:</b><br>" +
            memory.facts
                .slice(-10)
                .map(
                    fact =>
                    "• " + escapeHTML(fact.value)

        );
    }

    if(notes.length){

        parts.push(

        );
    }

    if(!parts.length){

        memoryBox.innerHTML =
            "Henüz kayıtlı önemli bir bilgi yok.";

    }

    memoryBox.innerHTML =
        parts.join("<br><br>");
}

function escapeHTML(value){

    return String(value)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");
}

/* =========================================
   SESLİ KOMUT SİSTEMİ
========================================= */

function setupSpeechRecognition(){

    const SpeechRecognition =
        window.SpeechRecognition ||
        window.webkitSpeechRecognition;

    if(!SpeechRecognition){

        micBtn.disabled = true;
        micBtn.title =
            "Bu tarayıcı sesli komutu desteklemiyor.";

        return;
    }

    recognition =
        new SpeechRecognition();

    recognition.lang = "tr-TR";

    recognition.continuous = false;

    recognition.interimResults = false;

    recognition.maxAlternatives = 1;

    recognition.onstart = () => {

        isListening = true;

        micBtn.classList.add("active");

        micBtn.textContent = "■";
    };

    recognition.onend = () => {

        isListening = false;

        micBtn.classList.remove("active");

        micBtn.textContent = "🎙";
    };

    recognition.onerror = (event) => {

        console.error(
            "Ses tanıma hatası:",
            event.error
        );

        isListening = false;

        micBtn.classList.remove("active");

        micBtn.textContent = "🎙";
    };

    recognition.onresult = async (event) => {

        const result =
            event.results[
                event.results.length - 1
            ][0].transcript.trim();

        if(!result){
            return;
        }

        input.value = result;

        addUserMessage(result);

        input.value = "";

        /*
           Sesli komut olduğu için
           AURA sesli cevap verebilir.
        */

        currentVoiceRequest = true;

        await processMessage(
            result,
            true
        );
    };
}

micBtn.addEventListener(
    "click",
    () => {

        if(!recognition){
            setupSpeechRecognition();
        }

        if(!recognition){
            return;
        }

        if(isListening){

            recognition.stop();

            return;
        }

        try{

            currentVoiceRequest = true;

            recognition.start();

        }catch(error){

            console.error(
                "Mikrofon başlatılamadı:",
                error
            );
        }
    }
);

/* =========================================
   SESLİ CEVAP
========================================= */

function speak(text){

    /*
       Yazılı mesajlarda bu fonksiyon çağrılmaz.
       Yalnızca sesli komuttan sonra çağrılır.
    */

    if(!currentVoiceRequest){
        return;
    }

    if(!("speechSynthesis" in window)){
        return;
    }

    try{

        window.speechSynthesis.cancel();

        const utterance =
            new SpeechSynthesisUtterance(
                text
            );

        utterance.lang = "tr-TR";

        utterance.rate = 1;

        utterance.pitch = 1;

        utterance.volume = 1;

        window.speechSynthesis.speak(
            utterance
        );

    }catch(error){

        console.error(
            "Sesli cevap hatası:",
            error
        );
    }
}

========================================= */

setupSpeechRecognition();

function detectImportantInformation(text){

    const original = text.trim();

    const patterns = [

        {
            regex:/benim için (.+?) önemli/i,
            type:"important"
        },

        {
            regex:/benim için önemli olan (.+)/i,
            type:"important"
        },

        {
            regex:/bunu unutma[:\s]+(.+)/i,
            type:"important"
        },

        {
            regex:/aklında tut[:\s]+(.+)/i,
            type:"important"
        },

        {
            regex:/aklinda tut[:\s]+(.+)/i,
            type:"important"
        }
    ];

    for(const item of patterns){

        const match =
            original.match(item.regex);

        if(match){

            const value =
                cleanLearnedValue(match[1]);

            if(value){

                addFact(
                    item.type,
                    value
                );

                saveMemory();

                return true;
            }
        }
    }

    return false;
}

function getRecentConversation(){

    return chatHistory
        .slice(-12)
        .map(item => ({
            sender:item.sender,
            text:item.text
        }));
}

/*
   AURA gerektiğinde önceki konuşmanın son
   birkaç mesajını kullanabilir.
*/

function contextAwareResponse(text){

    const recent =
        getRecentConversation();

    if(!recent.length){
        return null;
    }

    const t = normalize(text);

    if(
        t.includes("az önce ne dedim") ||
        t.includes("az once ne dedim")
    ){

        const lastUser =
            [...recent]
                .reverse()
                .find(
                    item =>
                    item.sender === "user"
                );

        if(lastUser){
            return `Az önce şunu söyledin: "${lastUser.text}"`;
        }
    }

    if(
        t.includes("ne konuşuyorduk") ||
        t.includes("ne konusuyorduk")
    ){

        const previous =
            recent
                .filter(
                    item =>
                    item.sender === "user"
                )
                .slice(-3);

        if(previous.length){

            return "Son konuştuğumuz konular:\n" +
                previous
                    .map(
                        item =>
                        "• " + item.text
                    )
                    .join("\n");
        }
    }

    return null;
}

========================================= */

const oldGenerateResponse =
    generateResponse;

generateResponse = function(text){

    const contextResponse =
        contextAwareResponse(text);

    if(contextResponse){
        return contextResponse;
    }

    return oldGenerateResponse(text);
};

/*

let lastVoiceText = "";
let lastVoiceTime = 0;

if(recognition){

    recognition.onresult = async (event) => {

        const result =
            event.results[
                event.results.length - 1
            ][0]
            .transcript
            .trim();

        if(!result){
            return;
        }

        const now = Date.now();

        /*
           Bazı Android tarayıcılarında aynı ses
           sonucunun iki kere gelmesini engeller.
        */

        if(
            normalize(result) ===
            normalize(lastVoiceText) &&
            now - lastVoiceTime < 1500
        ){

            return;
        }

        lastVoiceText = result;
        lastVoiceTime = now;

        addUserMessage(result);

        currentVoiceRequest = true;

        await processMessage(
            result,
            true
        );
    };
}
