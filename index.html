<!DOCTYPE html>
<html lang="tr">
<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>AURA AI</title>

<style>

*{
    box-sizing:border-box;
}

html,
body{
    width:100%;
    height:100%;
    margin:0;
}

body{

    overflow:hidden;

    font-family:Arial,sans-serif;

    color:#e8fbff;

    background:
        radial-gradient(
            circle at 50% 18%,
            #073c5b 0%,
            #031d31 28%,
            #010b16 60%,
            #000207 100%
        );
}


/* =========================
   ARKA PLAN
========================= */

body::before{

    content:"";

    position:fixed;

    inset:0;

    pointer-events:none;

    background:
        radial-gradient(
            circle at 20% 25%,
            rgba(0,130,255,.07),
            transparent 25%
        ),
        radial-gradient(
            circle at 80% 75%,
            rgba(0,210,255,.05),
            transparent 28%
        );

}


/* =========================
   ÜST BAR
========================= */

.header{

    height:58px;

    display:flex;

    align-items:center;

    justify-content:space-between;

    padding:0 18px;

    background:
        rgba(0,5,12,.84);

    border-bottom:
        1px solid
        rgba(0,210,255,.24);

    position:relative;

    z-index:10;

    backdrop-filter:
        blur(10px);
}


.logo{

    color:#00eaff;

    font-size:20px;

    font-weight:bold;

    letter-spacing:5px;

    text-shadow:
        0 0 10px #00eaff,
        0 0 25px rgba(0,220,255,.55);

}


.status{

    display:flex;

    align-items:center;

    gap:7px;

    color:#54ffcf;

    font-size:9px;

    letter-spacing:2px;

}


.status-dot{

    width:6px;

    height:6px;

    border-radius:50%;

    background:#54ffcf;

    box-shadow:
        0 0 8px #54ffcf,
        0 0 15px #54ffcf;

}


/* =========================
   ANA
========================= */

.main{

    height:
        calc(100dvh - 58px);

    display:flex;

    flex-direction:column;

    align-items:center;

    min-height:0;

    position:relative;

    z-index:2;

}


/* =========================
   AURA ÇEKİRDEĞİ
========================= */

.core{

    width:205px;

    height:205px;

    margin-top:0;

    position:relative;

    display:flex;

    align-items:center;

    justify-content:center;

    flex-shrink:0;

}


/* =========================
   HALKALAR
========================= */

.ring{

    position:absolute;

    border-radius:50%;

    border:
        1px solid
        rgba(0,225,255,.6);

    box-shadow:
        0 0 8px
        rgba(0,220,255,.2);

}


.ring.one{

    width:145px;

    height:145px;

    border-left-color:
        transparent;

    border-right-color:
        transparent;

    animation:
        rotateOne 7s
        linear infinite;

}


.ring.two{

    width:180px;

    height:180px;

    border-top-color:
        transparent;

    border-bottom-color:
        transparent;

    animation:
        rotateTwo 10s
        linear infinite;

}


/* =========================
   KÜRE IŞIĞI
========================= */

.core-glow{

    position:absolute;

    width:145px;

    height:145px;

    border-radius:50%;

    background:
        radial-gradient(
            circle,
            rgba(0,230,255,.24),
            rgba(0,120,220,.08) 48%,
            transparent 72%
        );

    filter:
        blur(8px);

    animation:
        glowPulse 3s
        ease-in-out infinite;

}


/* =========================
   SADE KÜRE
========================= */

.sphere{

    width:105px;

    height:105px;

    border-radius:50%;

    display:flex;

    align-items:center;

    justify-content:center;

    position:relative;

    z-index:5;

    background:
        radial-gradient(
            circle at 32% 27%,
            #c8ffff 0%,
            #34eaff 7%,
            #0788a9 24%,
            #034765 46%,
            #012238 68%,
            #000a13 100%
        );

    border:
        2px solid
        rgba(120,250,255,.9);

    box-shadow:

        0 0 12px
        #00eaff,

        0 0 35px
        rgba(0,220,255,.7),

        0 0 70px
        rgba(0,110,255,.35),

        inset
        -15px -15px 25px
        rgba(0,0,0,.58),

        inset
        9px 7px 17px
        rgba(180,255,255,.35);

    animation:
        spherePulse 2.6s
        ease-in-out infinite;

}


/* =========================
   SADE AURA YAZISI
========================= */

.core-name{

    position:relative;

    z-index:8;

    color:#eaffff;

    font-size:16px;

    font-weight:bold;

    letter-spacing:4px;

    text-shadow:

        0 0 5px
        #ffffff,

        0 0 12px
        #00eaff,

        0 0 25px
        #00aaff;

}


/* =========================
   KÜRE ANİMASYONLARI
========================= */

@keyframes spherePulse{

    0%,
    100%{

        transform:
            scale(1);

    }

    50%{

        transform:
            scale(1.07);

    }

}


@keyframes glowPulse{

    0%,
    100%{

        transform:
            scale(1);

        opacity:.7;

    }

    50%{

        transform:
            scale(1.13);

        opacity:1;

    }

}


@keyframes rotateOne{

    from{

        transform:
            rotate(0deg);

    }

    to{

        transform:
            rotate(360deg);

    }

}


@keyframes rotateTwo{

    from{

        transform:
            rotate(360deg);

    }

    to{

        transform:
            rotate(0deg);

    }

}


/* =========================
   SOHBET
========================= */

.chat-panel{

    width:
        min(92%,640px);

    flex:1;

    min-height:0;

    display:flex;

    flex-direction:column;

    background:
        rgba(1,11,21,.55);

    border:
        1px solid
        rgba(0,180,255,.18);

    border-radius:
        18px 18px 0 0;

    backdrop-filter:
        blur(10px);

    overflow:hidden;

}


.chat-title{

    height:31px;

    display:flex;

    align-items:center;

    padding:
        0 13px;

    color:
        rgba(130,220,240,.55);

    font-size:8px;

    letter-spacing:2px;

    border-bottom:
        1px solid
        rgba(0,180,255,.12);

}


.chat-title::after{

    content:"";

    flex:1;

    height:1px;

    margin-left:10px;

    background:
        linear-gradient(
            90deg,
            rgba(0,210,255,.3),
            transparent
        );

}


/* =========================
   MESAJ ALANI
========================= */

#chat{

    flex:1;

    min-height:0;

    overflow-y:auto;

    padding:12px;

    scrollbar-width:thin;

    scrollbar-color:
        #007fa8
        transparent;

}


#chat::-webkit-scrollbar{

    width:3px;

}


#chat::-webkit-scrollbar-thumb{

    background:#008db8;

    border-radius:10px;

}


/* =========================
   MESAJLAR
========================= */

.message{

    max-width:80%;

    padding:
        10px 13px;

    margin-bottom:10px;

    border-radius:12px;

    font-size:13px;

    line-height:1.45;

    white-space:pre-wrap;

}


/* AURA SOL */

.message.aura{

    margin-left:0;

    margin-right:auto;

    color:#dcfaff;

    background:
        linear-gradient(
            135deg,
            rgba(3,58,78,.78),
            rgba(1,24,39,.8)
        );

    border-left:
        2px solid
        #00eaff;

    border-top-left-radius:
        3px;

}


/* SEN SAĞ */

.message.user{

    margin-left:auto;

    margin-right:0;

    color:white;

    background:
        linear-gradient(
            135deg,
            rgba(8,93,126,.9),
            rgba(3,48,76,.92)
        );

    border-right:
        2px solid
        #4dffce;

    border-top-right-radius:
        3px;

}


/* =========================
   ALT MESAJ PANELİ
========================= */

.bottom{

    width:
        min(92%,640px);

    padding:
        9px 8px 10px;

    background:
        linear-gradient(
            180deg,
            #041d31,
            #020d1b
        );

    border:
        1px solid
        rgba(0,180,255,.2);

    border-top:0;

    border-radius:
        0 0 18px 18px;

}


.composer{

    height:48px;

    display:flex;

    align-items:center;

    gap:7px;

    padding:
        4px 5px 4px 13px;

    border-radius:14px;

    background:#041b2d;

    border:
        1px solid
        rgba(0,190,255,.3);

}


.composer:focus-within{

    border-color:
        rgba(0,225,255,.7);

    box-shadow:
        0 0 18px
        rgba(0,180,255,.12);

}


#input{

    flex:1;

    min-width:0;

    height:100%;

    border:0;

    outline:0;

    background:
        transparent;

    color:white;

    font-size:13px;

}


#input::placeholder{

    color:#54798a;

}


/* =========================
   BUTONLAR
========================= */

.button{

    width:40px;

    height:40px;

    flex-shrink:0;

    border:0;

    border-radius:11px;

    cursor:pointer;

    color:#00eaff;

    background:#062b43;

    font-size:16px;

}


.button:active{

    transform:
        scale(.9);

}


.send{

    color:#001923;

    background:
        linear-gradient(
            135deg,
            #00eaff,
            #4dffcf
        );

    box-shadow:
        0 0 15px
        rgba(0,220,255,.25);

}


/* =========================
   MOBİL
========================= */

@media(max-width:500px){

    .core{

        transform:
            scale(.84);

        margin-top:-5px;

        margin-bottom:-13px;

    }


    .chat-panel,
    .bottom{

        width:96%;

    }


    .message{

        max-width:88%;

    }


    .composer{

        height:46px;

    }


    .button{

        width:38px;

        height:38px;

    }

}

</style>

</head>


<body>


<!-- ÜST BAR -->

<div class="header">

    <div class="logo">
        AURA
    </div>

    <div class="status">

        <span class="status-dot"></span>

        SYSTEM ONLINE

    </div>

</div>


<!-- ANA -->

<div class="main">


    <!-- ÇEKİRDEK -->

    <div class="core">

        <div class="ring one"></div>

        <div class="ring two"></div>

        <div class="core-glow"></div>

        <div class="sphere">

            <div class="core-name">
                AURA
            </div>

        </div>

    </div>


    <!-- SOHBET -->

    <div class="chat-panel">

        <div class="chat-title">
            COMMUNICATION CHANNEL
        </div>


        <div id="chat">

            <div class="message aura">
                AURA çekirdeği başlatıldı.
            </div>


            <div class="message aura">
                Sistem hazır. Seni dinliyorum.
            </div>

        </div>

    </div>


    <!-- MESAJ -->

    <div class="bottom">

        <div class="composer">

            <input
                id="input"
                type="text"
                placeholder="AURA'ya mesaj yaz..."
                autocomplete="off"
            >


            <button
                class="button"
                id="mic"
                type="button">

                🎙

            </button>


            <button
                class="button send"
                id="send"
                type="button">

                ➤

            </button>

        </div>

    </div>

</div>


<script>

const input =
    document.getElementById("input");

const send =
    document.getElementById("send");

const mic =
    document.getElementById("mic");

const chat =
    document.getElementById("chat");


/* =========================
   MESAJ EKLE
========================= */

function addMessage(
    text,
    type
){

    const message =
        document.createElement("div");

    message.className =
        "message " + type;

    message.textContent =
        text;

    chat.appendChild(
        message
    );

    chat.scrollTop =
        chat.scrollHeight;

}


/* =========================
   MESAJ GÖNDER
========================= */

function sendMessage(){

    const text =
        input.value.trim();


    if(!text){

        return;

    }


    /* SENİN MESAJIN SAĞDA */

    addMessage(
        text,
        "user"
    );


    input.value =
        "";


    /* AURA MESAJI SOLDA */

    setTimeout(
        function(){

            addMessage(
                "Mesajını aldım. AURA prototip modu aktif.",
                "aura"
            );

        },
        350
    );

}


/* =========================
   GÖNDER
========================= */

send.addEventListener(
    "click",
    sendMessage
);


/* =========================
   ENTER
========================= */

input.addEventListener(
    "keydown",
    function(event){

        if(
            event.key === "Enter"
        ){

            event.preventDefault();

            sendMessage();

        }

    }
);


/* =========================
   MİKROFON
========================= */

mic.addEventListener(
    "click",
    function(){

        addMessage(
            "Sesli iletişim modülü hazır.",
            "aura"
        );

    }
);


/* =========================
   BAŞLANGIÇ
========================= */

window.addEventListener(
    "load",
    function(){

        input.focus();

    }
);

</script>


</body>
</html>
