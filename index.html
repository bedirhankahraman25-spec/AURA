<!DOCTYPE html>
<html lang="tr">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<meta name="theme-color"
content="#02060a">

<title>AURA AI</title>

<style>

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
}

body {
    overflow: hidden;
    font-family: Arial, sans-serif;
    color: #00eaff;

    background:
        radial-gradient(
            circle at center,
            #06303d 0%,
            #02080c 50%,
            #000000 100%
        );
}

/* ÜST BAR */

.top-bar {
    height: 60px;

    display: flex;
    align-items: center;
    justify-content: space-between;

    padding: 0 18px;

    background: rgba(0,10,15,.9);

    border-bottom:
        1px solid
        rgba(0,234,255,.4);
}

.logo {
    font-size: 21px;
    font-weight: bold;
    letter-spacing: 4px;

    text-shadow:
        0 0 10px #00eaff,
        0 0 25px #00eaff;
}

.status {
    font-size: 11px;
    letter-spacing: 2px;
    color: #55ffcc;
}

.status::before {
    content: "";

    display: inline-block;

    width: 7px;
    height: 7px;

    margin-right: 7px;

    border-radius: 50%;

    background: #55ffcc;

    box-shadow:
        0 0 8px #55ffcc,
        0 0 15px #55ffcc;
}

/* ANA ALAN */

.main {
    height: calc(100vh - 60px);
    height: calc(100dvh - 60px);

    display: flex;
    flex-direction: column;
    align-items: center;

    min-height: 0;
}

/* AURA ÇEKİRDEĞİ */

.aura-core {
    width: 210px;
    height: 210px;

    margin-top: 10px;

    position: relative;

    display: flex;
    align-items: center;
    justify-content: center;

    flex-shrink: 0;
}

.aura-ring {
    position: absolute;

    border-radius: 50%;

    border:
        1px solid
        #00eaff;

    opacity: .7;
}

.ring1 {
    width: 135px;
    height: 135px;

    border-left-color: transparent;
    border-right-color: transparent;

    animation:
        rotate1 7s linear infinite;
}

.ring2 {
    width: 175px;
    height: 175px;

    border-top-color: transparent;
    border-bottom-color: transparent;

    animation:
        rotate2 10s linear infinite;
}

.ring3 {
    width: 210px;
    height: 210px;

    border-left-color: transparent;
    border-bottom-color: transparent;

    animation:
        rotate1 14s linear infinite;
}

.aura-center {
    width: 100px;
    height: 100px;

    border-radius: 50%;

    border:
        2px solid
        #00eaff;

    display: flex;
    align-items: center;
    justify-content: center;

    color: #00eaff;

    font-size: 21px;
    font-weight: bold;

    letter-spacing: 3px;

    background:
        radial-gradient(
            circle,
            #064454,
            #02090d
        );

    box-shadow:
        0 0 15px #00eaff,
        0 0 45px rgba(0,234,255,.7),
        inset 0 0 25px rgba(0,234,255,.5);

    animation:
        pulse 2.2s infinite ease-in-out;

    z-index: 5;
}

@keyframes rotate1 {

    from {
        transform: rotate(0deg);
    }

    to {
        transform: rotate(360deg);
    }
}

@keyframes rotate2 {

    from {
        transform: rotate(360deg);
    }

    to {
        transform: rotate(0deg);
    }
}

@keyframes pulse {

    0%,
    100% {
        transform: scale(1);
    }

    50% {
        transform: scale(1.06);
    }
}

/* DURUM */

.aura-status {
    margin-top: -8px;
    margin-bottom: 5px;

    font-size: 10px;
    letter-spacing: 3px;

    color: #8defff;
}

/* SOHBET */

#chat {
    width: min(92%, 600px);

    flex: 1;
    min-height: 0;

    overflow-y: auto;

    padding:
        5px 5px 10px;
}

.message {
    max-width: 85%;

    padding:
        10px 13px;

    margin-bottom: 10px;

    border-radius: 10px;

    line-height: 1.4;

    white-space: pre-wrap;

    font-size: 14px;
}

.aura {
    background:
        rgba(0,35,45,.8);

    margin-right: auto;

    border:
        1px solid
        rgba(0,234,255,.25);
}

.user {
    background:
        rgba(0,90,120,.8);

    margin-left: auto;

    color: white;
}

/* ALT */

#bottom {
    width: 100%;

    min-height: 65px;

    display: flex;
    align-items: center;

    gap: 8px;

    padding: 10px;

    background:
        rgba(0,10,15,.97);

    border-top:
        1px solid
        rgba(0,234,255,.45);

    z-index: 10;
}

#input {
    flex: 1;

    min-width: 0;

    height: 45px;

    padding: 12px;

    border-radius: 8px;

    border:
        1px solid
        rgba(0,234,255,.5);

    outline: none;

    background:
        rgba(0,25,32,.95);

    color: #00eaff;

    font-size: 14px;
}

#input::placeholder {
    color: #548995;
}

button {
    height: 45px;

    border:
        1px solid
        #00eaff;

    border-radius: 8px;

    padding: 0 14px;

    background:
        rgba(0,60,75,.9);

    color: #00eaff;

    font-size: 14px;

    cursor: pointer;
}

button:active {
    transform: scale(.94);
}

button:disabled {
    opacity: .5;
}

.mic-button {
    width: 45px;
    padding: 0;
    font-size: 20px;
}

@media (max-width:500px) {

    .aura-core {
        transform: scale(.82);

        margin-top: 0;
        margin-bottom: -15px;
    }

    .logo {
        font-size: 18px;
    }

    button {
        padding: 0 11px;
    }
}

</style>

</head>

<body>

<div class="top-bar">

    <div class="logo">
        AURA
    </div>

    <div class="status" id="status">
        ONLINE
    </div>

</div>

<div class="main">

    <div class="aura-core">

        <div class="aura-ring ring1"></div>
        <div class="aura-ring ring2"></div>
        <div class="aura-ring ring3"></div>

        <div class="aura-center">
            AURA
        </div>

    </div>

    <div
        class="aura-status"
        id="auraStatus">

        AI READY

    </div>

    <div id="chat"></div>

    <div id="bottom">

        <input
            id="input"
            type="text"
            placeholder="AURA'ya bir şey sor..."
            autocomplete="off"
        >

        <button
            class="mic-button"
            id="micButton"
            type="button">

            🎤

        </button>

        <button
            id="sendButton"
            type="button">

            Gönder

        </button>

    </div>

</div>

<script src="https://js.puter.com/v2/"></script>

<script>
    /* ELEMENTLER */

const chat =
    document.getElementById("chat");

const input =
    document.getElementById("input");

const sendButton =
    document.getElementById("sendButton");

const micButton =
    document.getElementById("micButton");

const status =
    document.getElementById("status");

const auraStatus =
    document.getElementById("auraStatus");


/* MESAJ */

function addMessage(text, type) {

    const message =
        document.createElement("div");

    message.className =
        "message " + type;

    message.textContent =
        text;

    chat.appendChild(message);

    chat.scrollTop =
        chat.scrollHeight;
}


/* SES TEMİZLE */

function cleanTextForSpeech(text) {

    return String(text)

        .replace(
            /[\p{Emoji_Presentation}\p{Extended_Pictographic}]/gu,
            ""
        )

        .replace(
            /https?:\/\/\S+/gi,
            ""
        )

        .replace(
            /[.,!?;:"'“”‘’()[\]{}<>…:;\/\\|@#$%^&*_+=~`-]/g,
            " "
        )

        .replace(
            /\s+/g,
            " "
        )

        .trim();
}


/* SES */

function speak(text) {

    if (
        !("speechSynthesis" in window)
    ) {
        return;
    }

    const clean =
        cleanTextForSpeech(text);

    if (!clean) {
        return;
    }

    const voice =
        new SpeechSynthesisUtterance(
            clean
        );

    voice.lang =
        "tr-TR";

    voice.rate =
        0.92;

    voice.pitch =
        1;

    voice.volume =
        1;

    window.speechSynthesis.cancel();

    setTimeout(function() {

        window.speechSynthesis.speak(
            voice
        );

    }, 100);
}


/* DOĞAL AURA */

const systemPrompt = {

    role: "system",

    content: `
Sen AURA adında kişisel bir yapay zekâ asistanısın.

Türkçe konuş.

Kullanıcının adı Bedirhan Kahraman.

Kullanıcıya her cevapta adıyla hitap etme.

"Bedirhan Kahraman" ifadesini gereksiz yere kullanma.

Sadece konuşmanın doğal olduğu durumlarda Bedirhan diyebilirsin.

Kısa doğal ve anlaşılır cevaplar ver.

Robot gibi konuşma.

Kullanıcı günlük konuşuyorsa doğal Türkçe kullan.

Gereksiz tekrar yapma.

Soruyu doğrudan cevapla.

Bilmediğin bilgiyi uydurma.

Güncel bilgi sorulursa web aramasını kullan.

Kullanıcı "ben kimim" derse Bedirhan Kahraman olduğunu söyle.

Kullanıcı "sevgilimin adı ne" derse Edanur Kahraman olduğunu söyle.

Kendini AURA olarak tanıt.
`
};


/* KONUŞMA GEÇMİŞİ */

let conversation = [
    systemPrompt
];


/* AI CEVABI */

function getAIText(response) {

    if (!response) {
        return "";
    }

    if (
        response.message &&
        typeof response.message.content === "string"
    ) {

        return response.message.content;
    }

    if (
        response.message &&
        Array.isArray(response.message.content)
    ) {

        return response.message.content
            .map(function(item) {

                if (
                    typeof item === "string"
                ) {
                    return item;
                }

                return item.text || "";

            })
            .join("");
    }

    if (
        response.text
    ) {

        return response.text;
    }

    if (
        typeof response === "string"
    ) {

        return response;
    }

    return "";
}


/* NORMAL AI */

async function askAI(text) {

    conversation.push({

        role: "user",

        content: text
    });


    try {

        const response =
            await puter.ai.chat(
                conversation,
                {
                    model:
                        "gpt-5.4-nano",

                    temperature:
                        0.7
                }
            );


        const answer =
            getAIText(response);


        if (!answer) {

            throw new Error(
                "AI boş cevap verdi"
            );
        }


        conversation.push({

            role: "assistant",

            content: answer
        });


        return answer;


    } catch (error) {

        console.error(
            "AURA AI ERROR:",
            error
        );


        /*
          Hata olursa konuşma geçmişine
          bozuk mesajı taşımıyoruz.
        */

        conversation.pop();


        throw error;
    }
}


/* WEB GEREKTİREN SORU */

function needsWebSearch(text) {

    const lower =
        text.toLocaleLowerCase("tr-TR");


    const words = [

        "internette ara",
        "internetten ara",
        "webde ara",
        "web'de ara",
        "güncel",
        "guncel",
        "son haber",
        "son haberler",
        "şu an",
        "su an",
        "bugün",
        "bugun",
        "en son",
        "şimdi",
        "simdi"
    ];


    return words.some(
        function(word) {

            return lower.includes(word);
        }
    );
}


/* WEB ARAMALI AI */

async function askAIWithOptionalWeb(text) {

    /*
      Normal sorular:
      sağlam ve basit AI çağrısı
    */

    if (
        !needsWebSearch(text)
    ) {

        return await askAI(text);
    }


    /*
      Güncel soru:
      OpenAI web search desteği
      Puter dokümanındaki kullanıma
      uygun şekilde çağrılıyor.
    */

    const webConversation = [

        systemPrompt,

        {
            role: "user",
            content: text
        }

    ];


    try {

        const response =
            await puter.ai.chat(
                webConversation,
                {
                    model:
                        "openai/gpt-5.3-chat",

                    tools: [
                        {
                            type:
                                "web_search"
                        }
                    ],

                    temperature:
                        0.5
                }
            );


        const answer =
            getAIText(response);


        if (!answer) {

            throw new Error(
                "Web AI boş cevap verdi"
            );
        }


        /*
          Web konuşmasını normal
          geçmişe tek cevap olarak ekle.
        */

        conversation.push({

            role: "user",

            content: text

        });


        conversation.push({

            role: "assistant",

            content: answer

        });


        return answer;


    } catch (error) {

        console.error(
            "WEB AI ERROR:",
            error
        );


        /*
          Web araması çalışmazsa
          normal AI'ye geri dön.
        */

        return await askAI(text);
    }
        }
    /* MESAJ GÖNDER */

async function sendMessage(
    voiceMode = false
) {

    const text =
        input.value.trim();


    if (!text) {
        return;
    }


    addMessage(
        text,
        "user"
    );


    input.value = "";


    sendButton.disabled =
        true;

    micButton.disabled =
        true;


    auraStatus.textContent =
        "THINKING";


    addMessage(
        "Düşünüyorum...",
        "aura"
    );


    const loading =
        chat.lastElementChild;


    try {

        const reply =
            await askAIWithOptionalWeb(
                text
            );


        if (loading) {
            loading.remove();
        }


        addMessage(
            reply,
            "aura"
        );


        /*
          SADECE SESLİ KOMUTTA KONUŞ
        */

        if (voiceMode) {

            speak(reply);
        }


    } catch (error) {

        console.error(
            "SEND ERROR:",
            error
        );


        if (loading) {
            loading.remove();
        }


        addMessage(
            "AI bağlantısı kurulamadı. İnternet bağlantısını veya Puter bağlantısını kontrol et.",
            "aura"
        );
    }


    auraStatus.textContent =
        wakeMode
            ? "AURA LISTENING"
            : "AI READY";


    sendButton.disabled =
        false;

    micButton.disabled =
        false;

    input.focus();
}


/* GÖNDER BUTONU */

sendButton.addEventListener(
    "click",
    function() {

        sendMessage(false);

    }
);


/* ENTER */

input.addEventListener(
    "keydown",
    function(event) {

        if (
            event.key === "Enter"
        ) {

            event.preventDefault();

            sendMessage(false);
        }

    }
);


/* SES TANIMA */

const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;


let recognition = null;

let wakeMode = false;

let commandMode = false;

let recognitionRunning = false;


/* SES DESTEKLENMİYOR */

if (!SpeechRecognition) {

    micButton.disabled =
        true;

    auraStatus.textContent =
        "VOICE NOT SUPPORTED";
}


/* RECOGNITION OLUŞTUR */

function createRecognition() {

    if (!SpeechRecognition) {
        return null;
    }


    const rec =
        new SpeechRecognition();


    rec.lang =
        "tr-TR";


    rec.continuous =
        true;


    rec.interimResults =
        false;


    rec.maxAlternatives =
        1;


    rec.onstart =
        function() {

            recognitionRunning =
                true;

            auraStatus.textContent =
                wakeMode
                    ? "AURA LISTENING"
                    : "LISTENING";

            status.textContent =
                "VOICE";
        };


    rec.onresult =
        function(event) {

            for (
                let i =
                    event.resultIndex;

                i <
                    event.results.length;

                i++
            ) {

                if (
                    !event.results[i].isFinal
                ) {
                    continue;
                }


                const spoken =
                    event.results[i][0]
                    .transcript
                    .trim();


                if (!spoken) {
                    continue;
                }


                handleVoiceText(
                    spoken
                );
            }
        };


    rec.onerror =
        function(event) {

            console.log(
                "VOICE ERROR:",
                event.error
            );

            recognitionRunning =
                false;


            if (
                wakeMode
            ) {

                setTimeout(
                    startRecognition,
                    600
                );
            }
        };


    rec.onend =
        function() {

            recognitionRunning =
                false;


            if (
                wakeMode
            ) {

                setTimeout(
                    startRecognition,
                    300
                );

            } else {

                auraStatus.textContent =
                    "AI READY";

                status.textContent =
                    "ONLINE";
            }
        };


    return rec;
}


/* AURA VAR MI */

function containsWakeWord(text) {

    const lower =
        text
        .toLocaleLowerCase("tr-TR")
        .trim();


    return (
        lower === "aura" ||
        lower.startsWith("aura ") ||
        lower.startsWith("aura,") ||
        lower.startsWith("aura:")
    );
}


/* AURA'YI SİL */

function removeWakeWord(text) {

    return text
        .replace(
            /^aura[\s,:-]*/i,
            ""
        )
        .trim();
}


/* SESLİ KOMUT */

function handleVoiceText(spoken) {

    console.log(
        "DUYULAN:",
        spoken
    );


    /*
      Daha önce AURA denmişse
      sonraki cümle komuttur.
    */

    if (commandMode) {

        commandMode =
            false;


        input.value =
            spoken;


        sendMessage(true);

        return;
    }


    /*
      AURA yoksa bekle.
    */

    if (
        !containsWakeWord(spoken)
    ) {

        return;
    }


    const command =
        removeWakeWord(
            spoken
        );


    /*
      Sadece AURA denirse
      sonraki cümleyi bekle.
    */

    if (!command) {

        commandMode =
            true;


        auraStatus.textContent =
            "AURA AWAKE";


        status.textContent =
            "AWAKE";


        speak(
            "Dinliyorum"
        );


        return;
    }


    /*
      AURA + komut
    */

    input.value =
        command;


    sendMessage(true);
}


/* DİNLEMEYİ BAŞLAT */

function startRecognition() {

    if (!SpeechRecognition) {
        return;
    }


    if (!wakeMode) {
        return;
    }


    if (recognitionRunning) {
        return;
    }


    recognition =
        createRecognition();


    if (!recognition) {
        return;
    }


    try {

        recognition.start();

    } catch (error) {

        console.log(
            "START:",
            error
        );
    }
}


/* MİKROFON */

micButton.addEventListener(
    "click",
    function() {

        if (!SpeechRecognition) {

            addMessage(
                "Bu tarayıcı sesli komutu desteklemiyor.",
                "aura"
            );

            return;
        }


        if (!wakeMode) {

            wakeMode =
                true;

            commandMode =
                false;


            auraStatus.textContent =
                "AURA LISTENING";

            status.textContent =
                "VOICE";


            addMessage(
                "AURA dinleme modu açıldı. AURA diyerek beni uyandırabilirsin.",
                "aura"
            );


            startRecognition();

            return;
        }


        wakeMode =
            false;

        commandMode =
            false;


        if (recognition) {

            try {
                recognition.stop();
            } catch (error) {}
        }


        recognitionRunning =
            false;


        auraStatus.textContent =
            "AI READY";

        status.textContent =
            "ONLINE";
    });
    /* =========================
   BAŞLANGIÇ
========================= */

addMessage(
    "Merhaba. Ben AURA AI.\n\nSistem hazır. Seni dinliyorum.",
    "aura"
);


/* =========================
   SAYFA KAPANIRKEN
========================= */

window.addEventListener(
    "beforeunload",
    function() {

        if (
            recognition &&
            recognitionRunning
        ) {

            try {
                recognition.stop();
            } catch (error) {}
        }

    }
);


/* =========================
   GENEL HATA YAKALAMA
========================= */

window.addEventListener(
    "error",
    function(event) {

        console.error(
            "AURA:",
            event.error
        );

    }
);


/* =========================
   BAŞLANGIÇ DURUMU
========================= */

auraStatus.textContent =
    "AI READY";

status.textContent =
    "ONLINE";

</script>

</body>

</html>
