name: AURA APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Kodu indir
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Sistem paketlerini kur
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            git \
            zip \
            unzip \
            openjdk-17-jdk \
            autoconf \
            automake \
            libtool \
            pkg-config \
            zlib1g-dev

      - name: Buildozer kur
        run: |
          python -m pip install --upgrade pip
          pip install buildozer cython

      - name: Dosya adını düzelt
        run: |
          cp aura_app.py main.py

      - name: APK oluştur
        run: |
          buildozer android debug

      - name: APK'yi yükle
        uses: actions/upload-artifact@v4
        with:
          name: AURA-APK
          path: bin/*.apk
